    <path d="M57.92,236 V219.28 Q57.92,212.24 65.84,212.24 H78.16 Q86.08,212.24 86.08,219.28 V236 Z" fill="var(--dim)" fill-opacity="0.18" stroke="var(--dim)" stroke-width="1.4" stroke-linejoin="round"/>
