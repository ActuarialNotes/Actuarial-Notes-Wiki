<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Retrospective premium rising with the insured's own losses between a guaranteed minimum and maximum</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The insured pays for its own year,</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">within limits</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">R = (BP + CL × LCF) × TM</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">clamped to [R_min, R_max]</text>
  <line x1="72" y1="98" x2="72" y2="322" class="grid"/>
  <line x1="149.5" y1="98" x2="149.5" y2="322" class="grid"/>
  <line x1="227" y1="98" x2="227" y2="322" class="grid"/>
  <line x1="304.5" y1="98" x2="304.5" y2="322" class="grid"/>
  <line x1="72" y1="322" x2="320" y2="322" class="grid"/>
  <line x1="72" y1="263.05" x2="320" y2="263.05" class="grid"/>
  <line x1="72" y1="204.11" x2="320" y2="204.11" class="grid"/>
  <line x1="72" y1="145.16" x2="320" y2="145.16" class="grid"/>
  <line x1="72" y1="322" x2="330" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="322" x2="72" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="322" x2="72" y2="326" class="tick"/>
  <text x="72" y="338" text-anchor="middle" class="sm dim">0</text>
  <line x1="149.5" y1="322" x2="149.5" y2="326" class="tick"/>
  <text x="149.5" y="338" text-anchor="middle" class="sm dim">50</text>
  <line x1="227" y1="322" x2="227" y2="326" class="tick"/>
  <text x="227" y="338" text-anchor="middle" class="sm dim">100</text>
  <line x1="304.5" y1="322" x2="304.5" y2="326" class="tick"/>
  <text x="304.5" y="338" text-anchor="middle" class="sm dim">150</text>
  <line x1="68" y1="322" x2="72" y2="322" class="tick"/>
  <text x="64" y="325.6" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="263.05" x2="72" y2="263.05" class="tick"/>
  <text x="64" y="266.65" text-anchor="end" class="sm dim">50</text>
  <line x1="68" y1="204.11" x2="72" y2="204.11" class="tick"/>
  <text x="64" y="207.71" text-anchor="end" class="sm dim">100</text>
  <line x1="68" y1="145.16" x2="72" y2="145.16" class="tick"/>
  <text x="64" y="148.76" text-anchor="end" class="sm dim">150</text>
