<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Marginals as the row and column sums of a joint table</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A marginal is a row or column sum</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">pₓ(x) = Σ_y p(x, y)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">f_X(x) = ∫ f(x, y) dy</text>
  <text x="95" y="118" text-anchor="middle" class="sm dim">y = 0</text>
  <text x="157" y="118" text-anchor="middle" class="sm dim">y = 1</text>
  <text x="219" y="118" text-anchor="middle" class="sm dim">y = 2</text>
  <text x="56" y="151" text-anchor="end" class="sm dim">x = 0</text>
  <text x="56" y="193" text-anchor="end" class="sm dim">x = 1</text>
  <text x="56" y="235" text-anchor="end" class="sm dim">x = 2</text>
  <rect x="64" y="126" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="95" y="151" text-anchor="middle" class="sm">0.10</text>
  <rect x="126" y="126" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="157" y="151" text-anchor="middle" class="sm">0.08</text>
  <rect x="188" y="126" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="219" y="151" text-anchor="middle" class="sm">0.02</text>
  <rect x="64" y="168" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="95" y="193" text-anchor="middle" class="sm">0.06</text>
  <rect x="126" y="168" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="157" y="193" text-anchor="middle" class="sm">0.20</text>
  <rect x="188" y="168" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="219" y="193" text-anchor="middle" class="sm">0.14</text>
  <rect x="64" y="210" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="95" y="235" text-anchor="middle" class="sm">0.04</text>
  <rect x="126" y="210" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="157" y="235" text-anchor="middle" class="sm">0.12</text>
  <rect x="188" y="210" width="62" height="42" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="219" y="235" text-anchor="middle" class="sm">0.24</text>
  <text x="287" y="118" text-anchor="middle" class="sm dim" fill="#d97706">pₓ(x)</text>
  <rect x="256" y="126" width="62" height="42" rx="3" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1"/>
  <text x="287" y="151" text-anchor="middle" class="sm bold">0.20</text>
  <rect x="256" y="168" width="62" height="42" rx="3" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1"/>
  <text x="287" y="193" text-anchor="middle" class="sm bold">0.40</text>
  <rect x="256" y="210" width="62" height="42" rx="3" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1"/>
  <text x="287" y="235" text-anchor="middle" class="sm bold">0.40</text>
  <text x="56" y="280" text-anchor="end" class="sm dim" fill="#059669">p_Y(y)</text>
  <rect x="64" y="258" width="62" height="42" rx="3" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1"/>
  <text x="95" y="283" text-anchor="middle" class="sm bold">0.20</text>
  <rect x="126" y="258" width="62" height="42" rx="3" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1"/>
  <text x="157" y="283" text-anchor="middle" class="sm bold">0.40</text>
  <rect x="188" y="258" width="62" height="42" rx="3" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1"/>
  <text x="219" y="283" text-anchor="middle" class="sm bold">0.40</text>
  <line x1="240" y1="147" x2="252" y2="147" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <line x1="95" y1="244" x2="95" y2="254" class="thin" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
  <text x="180" y="352" text-anchor="middle" class="sm dim">both margins sum to 1 — a fast check</text>
</svg>
