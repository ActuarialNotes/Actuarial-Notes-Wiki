<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" width="560" height="284" role="img">
  <title>Variance of a sum with and without the covariance term</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="282.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The covariance term is what independence buys you</text>
  <text x="156" y="78" text-anchor="middle" class="sm bold" fill="#059669">Independent</text>
  <rect x="60" y="100" width="80" height="34" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="100" y="122" text-anchor="middle" class="sm bold">1.00</text>
  <rect x="140" y="100" width="56" height="34" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
  <text x="168" y="122" text-anchor="middle" class="sm bold">0.70</text>
  <line x1="60" y1="146" x2="196" y2="146" stroke="#059669" stroke-width="1.6"/>
  <text x="128" y="164" text-anchor="middle" class="sm bold">Var(W) = 1.70</text>
  <line x1="60" y1="186" x2="72" y2="186" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="78" y="190" text-anchor="start" class="sm dim">a₁²Var(X₁)</text>
  <line x1="60" y1="204" x2="72" y2="204" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <text x="78" y="208" text-anchor="start" class="sm dim">a₂²Var(X₂)</text>
  <text x="406" y="78" text-anchor="middle" class="sm bold" fill="#e11d48">Positively correlated</text>
  <rect x="310" y="100" width="80" height="34" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="350" y="122" text-anchor="middle" class="sm bold">1.00</text>
  <rect x="390" y="100" width="56" height="34" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
  <text x="418" y="122" text-anchor="middle" class="sm bold">0.70</text>
  <rect x="446" y="100" width="56" height="34" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="474" y="122" text-anchor="middle" class="sm bold">0.70</text>
  <line x1="310" y1="146" x2="502" y2="146" stroke="#e11d48" stroke-width="1.6"/>
  <text x="406" y="164" text-anchor="middle" class="sm bold">Var(W) = 2.40</text>
  <line x1="310" y1="186" x2="322" y2="186" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="328" y="190" text-anchor="start" class="sm dim">a₁²Var(X₁)</text>
  <line x1="310" y1="204" x2="322" y2="204" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <text x="328" y="208" text-anchor="start" class="sm dim">a₂²Var(X₂)</text>
  <line x1="310" y1="222" x2="322" y2="222" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="328" y="226" text-anchor="start" class="sm dim">2a₁a₂Cov</text>
  <line x1="28" y1="244" x2="532" y2="244" class="rule"/>
  <text x="280" y="264" text-anchor="middle" class="sm dim">E[W] = Σ aᵢ E[Xᵢ] always;  Var(W) = Σ aᵢ² Var(Xᵢ) only when independent</text>
</svg>
