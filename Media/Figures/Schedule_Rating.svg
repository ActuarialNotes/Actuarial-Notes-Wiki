<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Underwriter debits and credits accumulating into one schedule modifier</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Judgment the class plan does not capture</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Premium = Manual × (1 + Σ s_k)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">−10 −5 +8 −3 +5 ⇒ 0.95</text>
  <text x="44" y="136" text-anchor="start" class="sm">Premises condition</text>
  <rect x="212" y="123" width="36" height="20" rx="3" fill="#059669" fill-opacity="0.65"/>
  <text x="204" y="136" text-anchor="end" class="sm">-10</text>
  <text x="44" y="178" text-anchor="start" class="sm">Classification</text>
  <rect x="230" y="165" width="18" height="20" rx="3" fill="#059669" fill-opacity="0.65"/>
  <text x="222" y="178" text-anchor="end" class="sm">-5</text>
  <text x="44" y="220" text-anchor="start" class="sm">Employee selection</text>
  <rect x="248" y="207" width="28.8" height="20" rx="3" fill="#e11d48" fill-opacity="0.65"/>
  <text x="284.8" y="220" text-anchor="start" class="sm">+8</text>
  <text x="44" y="262" text-anchor="start" class="sm">Management</text>
  <rect x="237.2" y="249" width="10.8" height="20" rx="3" fill="#059669" fill-opacity="0.65"/>
  <text x="229.2" y="262" text-anchor="end" class="sm">-3</text>
  <text x="44" y="304" text-anchor="start" class="sm">Equipment</text>
  <rect x="248" y="291" width="18" height="20" rx="3" fill="#e11d48" fill-opacity="0.65"/>
  <text x="274" y="304" text-anchor="start" class="sm">+5</text>
  <line x1="248" y1="114" x2="248" y2="348" class="rule"/>
  <text x="180" y="372" text-anchor="middle" class="sm dim">net −5% — and the file has to say why</text>
</svg>
