  <line x1="46" y1="324" x2="324" y2="324" class="axis"/>
  <line x1="121.48" y1="324" x2="121.48" y2="328" class="tick"/>
  <text x="121.48" y="341" text-anchor="middle" class="sm dim">μ(1−k)</text>
  <line x1="121.48" y1="324" x2="121.48" y2="274.05" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
  <line x1="185" y1="324" x2="185" y2="328" class="tick"/>
  <text x="185" y="341" text-anchor="middle" class="sm dim">μ</text>
  <line x1="248.52" y1="324" x2="248.52" y2="328" class="tick"/>
  <text x="248.52" y="341" text-anchor="middle" class="sm dim">μ(1+k)</text>
  <line x1="248.52" y1="324" x2="248.52" y2="274.05" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
