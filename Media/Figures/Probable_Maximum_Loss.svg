  <line x1="64" y1="232" x2="64" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="256.4" y1="232" x2="256.4" y2="174.88" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
  <text x="256.4" y="165.44" text-anchor="middle" class="sm bold" fill="#e11d48">1-in-500</text>
  <line x1="183.6" y1="232" x2="183.6" y2="174.88" class="thin dash" stroke="#0d9488" stroke-width="1.3"/>
  <text x="183.6" y="165.44" text-anchor="middle" class="sm bold" fill="#0d9488">net</text>
  <text x="180" y="254" text-anchor="middle" class="sm dim">portfolio catastrophe loss</text>
  <line x1="30" y1="272" x2="330" y2="272" class="rule"/>
  <text x="36" y="294" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="294" text-anchor="start" class="sm">gross PML sizes the reinsurance programme;</text>
  <text x="36" y="318" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="318" text-anchor="start" class="sm">net PML is what the capital has to carry</text>
  <text x="36" y="342" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="342" text-anchor="start" class="sm">over 30 years, the chance of one such year is 6%</text>
  <text x="36" y="366" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="366" text-anchor="start" class="sm">and exposure data beats model sophistication</text>
</svg>
