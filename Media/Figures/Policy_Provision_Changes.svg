<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>One loss shared differently after a deductible and limit change</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The same loss, split on different terms</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Adjusted Loss = Σ [min(X, L_new)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">− min(X, d_new)]</text>
  <text x="180" y="116" text-anchor="middle" class="sm dim">a $1,200k ground-up loss ($000)</text>
  <text x="46" y="144" text-anchor="start" class="sm">old: 100 xs 0, limit 1,000</text>
  <rect x="46" y="158" width="268" height="32" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
  <rect x="46" y="158" width="0" height="32" rx="4" fill="#d97706" fill-opacity="0.6"/>
  <rect x="46" y="158" width="223.33" height="32" rx="4" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="269.33" y="158" width="44.67" height="32" rx="4" fill="#e11d48" fill-opacity="0.55"/>
  <text x="157.67" y="179" text-anchor="middle" class="sm">1,000</text>
  <text x="46" y="240" text-anchor="start" class="sm">new: deductible 250, limit 750</text>
  <rect x="46" y="254" width="268" height="32" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
  <rect x="46" y="254" width="55.83" height="32" rx="4" fill="#d97706" fill-opacity="0.6"/>
  <rect x="101.83" y="254" width="167.5" height="32" rx="4" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="269.33" y="254" width="44.67" height="32" rx="4" fill="#e11d48" fill-opacity="0.55"/>
  <text x="185.58" y="275" text-anchor="middle" class="sm">750</text>
  <line x1="46" y1="322" x2="59" y2="322" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="65" y="325.6" text-anchor="start" class="sm">insured keeps</text>
  <line x1="186" y1="322" x2="199" y2="322" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="205" y="325.6" text-anchor="start" class="sm">insurer pays</text>
  <line x1="46" y1="342" x2="59" y2="342" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="65" y="345.6" text-anchor="start" class="sm">above the limit</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">the loss did not change — the triangle did</text>
</svg>
