<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Ten policies with four of them claiming, above the binomial mass function of the claim count</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Successes in a fixed number of trials</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(X = k) = C(n, k) pᵏ (1 − p)ⁿ⁻ᵏ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[X] = np,   Var(X) = np(1 − p)</text>
  <text x="180" y="92" text-anchor="middle" class="sm dim">10 policies, each claiming with probability 0.3</text>
  <rect x="27.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="58.5" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="89.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="120.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="151.5" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="182.5" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="213.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="244.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="275.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="306.5" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="152" text-anchor="middle" class="sm bold" fill="#3b82f6">4 of the 10 claimed → k = 4</text>
  <line x1="76.33" y1="330" x2="76.33" y2="319.02" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76.33" cy="319.02" r="3.2" fill="#3b82f6"/>
  <line x1="99.67" y1="330" x2="99.67" y2="282.95" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="99.67" cy="282.95" r="3.2" fill="#3b82f6"/>
  <line x1="123" y1="330" x2="123" y2="239.26" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="123" cy="239.26" r="3.2" fill="#3b82f6"/>
  <line x1="146.33" y1="330" x2="146.33" y2="226.3" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="146.33" cy="226.3" r="3.2" fill="#3b82f6"/>
  <line x1="193" y1="330" x2="193" y2="290" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="193" cy="290" r="3.2" fill="#3b82f6"/>
  <line x1="216.33" y1="330" x2="216.33" y2="315.71" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="216.33" cy="315.71" r="3.2" fill="#3b82f6"/>
  <line x1="239.67" y1="330" x2="239.67" y2="326.5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="239.67" cy="326.5" r="3.2" fill="#3b82f6"/>
  <line x1="263" y1="330" x2="263" y2="329.44" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="263" cy="329.44" r="3.2" fill="#3b82f6"/>
  <line x1="286.33" y1="330" x2="286.33" y2="329.95" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="286.33" cy="329.95" r="3.2" fill="#3b82f6"/>
  <line x1="309.67" y1="330" x2="309.67" y2="330" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="309.67" cy="330" r="3.2" fill="#3b82f6"/>
  <line x1="169.67" y1="330" x2="169.67" y2="252.22" stroke="#d97706" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="169.67" cy="252.22" r="3.8" fill="#d97706"/>
  <line x1="60" y1="330" x2="336" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="330" x2="60" y2="180" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76.33" y1="330" x2="76.33" y2="334" class="tick"/>
  <text x="76.33" y="346" text-anchor="middle" class="sm dim">0</text>
  <line x1="99.67" y1="330" x2="99.67" y2="334" class="tick"/>
  <text x="99.67" y="346" text-anchor="middle" class="sm dim">1</text>
  <line x1="123" y1="330" x2="123" y2="334" class="tick"/>
  <text x="123" y="346" text-anchor="middle" class="sm dim">2</text>
  <line x1="146.33" y1="330" x2="146.33" y2="334" class="tick"/>
  <text x="146.33" y="346" text-anchor="middle" class="sm dim">3</text>
  <line x1="169.67" y1="330" x2="169.67" y2="334" class="tick"/>
  <text x="169.67" y="346" text-anchor="middle" class="sm dim">4</text>
  <line x1="193" y1="330" x2="193" y2="334" class="tick"/>
  <text x="193" y="346" text-anchor="middle" class="sm dim">5</text>
  <line x1="216.33" y1="330" x2="216.33" y2="334" class="tick"/>
  <text x="216.33" y="346" text-anchor="middle" class="sm dim">6</text>
  <line x1="239.67" y1="330" x2="239.67" y2="334" class="tick"/>
  <text x="239.67" y="346" text-anchor="middle" class="sm dim">7</text>
  <line x1="263" y1="330" x2="263" y2="334" class="tick"/>
  <text x="263" y="346" text-anchor="middle" class="sm dim">8</text>
  <line x1="286.33" y1="330" x2="286.33" y2="334" class="tick"/>
  <text x="286.33" y="346" text-anchor="middle" class="sm dim">9</text>
  <line x1="309.67" y1="330" x2="309.67" y2="334" class="tick"/>
  <text x="309.67" y="346" text-anchor="middle" class="sm dim">10</text>
  <text x="326" y="362" text-anchor="end" class="sm dim">k</text>
  <text x="56" y="176" text-anchor="start" class="sm dim">P(X = k)</text>
  <text x="169.67" y="241.22" text-anchor="middle" class="sm bold" fill="#d97706">0.200</text>
</svg>
