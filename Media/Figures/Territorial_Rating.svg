<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Territory relativities across a city, with the cross-subsidy that flattening them creates</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The most predictive variable, and the</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">most contested</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Relativity = territory pure premium</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">÷ overall pure premium</text>
    <rect x="62.07" y="138.18" width="38.86" height="111.82" rx="3" fill="#e11d48" fill-opacity="0.75"/>
    <text x="81.5" y="131.18" text-anchor="middle" class="sm">1.42</text>
    <text x="81.5" y="265" text-anchor="middle" class="sm dim">urban</text>
    <rect x="129.07" y="159.44" width="38.86" height="90.56" rx="3" fill="#d97706" fill-opacity="0.75"/>
    <text x="148.5" y="152.44" text-anchor="middle" class="sm">1.15</text>
    <text x="148.5" y="265" text-anchor="middle" class="sm dim">suburb</text>
    <rect x="196.07" y="175.98" width="38.86" height="74.02" rx="3" fill="#0d9488" fill-opacity="0.75"/>
    <text x="215.5" y="168.98" text-anchor="middle" class="sm">0.94</text>
    <text x="215.5" y="265" text-anchor="middle" class="sm dim">town</text>
    <rect x="263.07" y="188.57" width="38.86" height="61.42" rx="3" fill="#059669" fill-opacity="0.75"/>
    <text x="282.5" y="181.57" text-anchor="middle" class="sm">0.78</text>
    <text x="282.5" y="265" text-anchor="middle" class="sm dim">rural</text>
    <line x1="42" y1="250" x2="322" y2="250" class="axis"/>
    <line x1="48" y1="171.25" x2="322" y2="171.25" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="322" y="165.25" text-anchor="end" class="sm dim">1.00</text>
    <text x="180" y="292" text-anchor="middle" class="sm dim">flatten them and the two on the right</text>
    <text x="180" y="308" text-anchor="middle" class="sm dim">pay for the two on the left</text>
    <text x="180" y="336" text-anchor="middle" class="sm dim">traffic density, theft, weather, litigation —</text>
    <text x="180" y="352" text-anchor="middle" class="sm dim">all real, and all correlated with who lives there</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">Ontario limits how narrowly a territory is drawn</text>
  </g>
</svg>
