<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Net income plus the items IFRS keeps outside profit or loss, and where they end up</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Everything but transactions with</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">shareholders</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Comprehensive income = net income + OCI</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">$39M − $14M = $25M</text>
  <rect x="82.72" y="146" width="40.56" height="104" rx="3" fill="#059669" fill-opacity="0.72"/>
  <text x="103" y="138" text-anchor="middle" class="sm">39</text>
  <text x="103" y="265" text-anchor="middle" class="sm dim">net income</text>
  <rect x="160.72" y="146" width="40.56" height="36.95" rx="3" fill="#e11d48" fill-opacity="0.72"/>
  <text x="181" y="138" text-anchor="middle" class="sm">14</text>
  <text x="181" y="265" text-anchor="middle" class="sm dim">OCI</text>
  <rect x="238.72" y="182.95" width="40.56" height="67.05" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
  <text x="259" y="174.95" text-anchor="middle" class="sm">25</text>
  <text x="259" y="265" text-anchor="middle" class="sm dim">total</text>
  <line x1="58" y1="250" x2="304" y2="250" class="axis"/>
  <text x="180" y="288" text-anchor="middle" class="sm dim">$M, the running insurer</text>
  <line x1="30" y1="306" x2="330" y2="306" class="rule"/>
  <text x="38" y="328" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="54" y="328" text-anchor="start" class="sm">FVOCI bonds — where the portfolio sits</text>
  <text x="38" y="352" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="54" y="352" text-anchor="start" class="sm">the discount-rate effect, if OCI is elected</text>
  <text x="38" y="376" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="54" y="376" text-anchor="start" class="sm">pension remeasurement and translation</text>
</svg>
