<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="560" height="318" role="img">
  <title>The annuity family, sorted by payment timing and pattern</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="316.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The annuity family</text>
  <text x="280" y="38" text-anchor="middle" class="sub">one payment stream, valued four ways</text>
  <rect x="30" y="66" width="250" height="46" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="42" y="86" text-anchor="start" class="sm bold">Annuity-immediate</text>
  <text x="42" y="102" text-anchor="start" class="sm dim">payments at period end</text>
  <text x="268" y="94" text-anchor="end" class="sm" fill="#3b82f6">a₍ₙ₎ = (1 − vⁿ)/i</text>
  <rect x="30" y="120" width="250" height="46" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="42" y="140" text-anchor="start" class="sm bold">Annuity-due</text>
  <text x="42" y="156" text-anchor="start" class="sm dim">payments at period start</text>
  <text x="268" y="148" text-anchor="end" class="sm" fill="#7c3aed">ä₍ₙ₎ = (1 + i) a₍ₙ₎</text>
  <rect x="30" y="174" width="250" height="46" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="42" y="194" text-anchor="start" class="sm bold">Perpetuity</text>
  <text x="42" y="210" text-anchor="start" class="sm dim">payments forever</text>
  <text x="268" y="202" text-anchor="end" class="sm" fill="#059669">a₍∞₎ = 1/i</text>
  <rect x="30" y="228" width="250" height="46" rx="7" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.2"/>
  <text x="42" y="248" text-anchor="start" class="sm bold">Continuous</text>
  <text x="42" y="264" text-anchor="start" class="sm dim">payments flow continuously</text>
  <text x="268" y="256" text-anchor="end" class="sm" fill="#0d9488">ā₍ₙ₎ = (1 − vⁿ)/δ</text>
  <text x="420" y="84" text-anchor="middle" class="sm bold">Non-level patterns</text>
  <line x1="304" y1="104" x2="304" y2="138" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="117" text-anchor="start" class="sm bold">Arithmetic</text>
  <text x="314" y="133" text-anchor="start" class="sm dim">P, P+Q, P+2Q, …</text>
  <line x1="304" y1="152" x2="304" y2="186" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="165" text-anchor="start" class="sm bold">Geometric</text>
  <text x="314" y="181" text-anchor="start" class="sm dim">1, (1+g), (1+g)², …</text>
  <line x1="304" y1="200" x2="304" y2="234" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="213" text-anchor="start" class="sm bold">Payable m-thly</text>
  <text x="314" y="229" text-anchor="start" class="sm dim">m payments of 1/m a year</text>
  <rect x="300" y="254" width="230" height="42" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="415" y="280" text-anchor="middle" class="sm">s₍ₙ₎ = (1 + i)ⁿ a₍ₙ₎</text>
  <text x="155" y="302" text-anchor="middle" class="sm dim">Everything else is built from a₍ₙ₎</text>
</svg>
