<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Pure premium, frequency and severity indexed to 2020: severity rising 4.6% a year and frequency falling 1.2%, so pure premium rises 3.3%</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="89.65" y1="94" x2="89.65" y2="344" class="grid"/>
    <line x1="141.83" y1="94" x2="141.83" y2="344" class="grid"/>
    <line x1="194" y1="94" x2="194" y2="344" class="grid"/>
    <line x1="246.17" y1="94" x2="246.17" y2="344" class="grid"/>
    <line x1="298.35" y1="94" x2="298.35" y2="344" class="grid"/>
    <line x1="74" y1="317.21" x2="314" y2="317.21" class="grid"/>
    <line x1="74" y1="227.93" x2="314" y2="227.93" class="grid"/>
    <line x1="74" y1="138.64" x2="314" y2="138.64" class="grid"/>
    <line x1="74" y1="344" x2="324" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="344" x2="74" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="89.65" y1="344" x2="89.65" y2="348" class="tick"/>
    <text x="89.65" y="360" text-anchor="middle" class="sm dim">2020</text>
    <line x1="141.83" y1="344" x2="141.83" y2="348" class="tick"/>
    <text x="141.83" y="360" text-anchor="middle" class="sm dim">2021</text>
    <line x1="194" y1="344" x2="194" y2="348" class="tick"/>
    <text x="194" y="360" text-anchor="middle" class="sm dim">2022</text>
    <line x1="246.17" y1="344" x2="246.17" y2="348" class="tick"/>
    <text x="246.17" y="360" text-anchor="middle" class="sm dim">2023</text>
    <line x1="298.35" y1="344" x2="298.35" y2="348" class="tick"/>
    <text x="298.35" y="360" text-anchor="middle" class="sm dim">2024</text>
    <line x1="70" y1="317.21" x2="74" y2="317.21" class="tick"/>
    <text x="66" y="320.81" text-anchor="end" class="sm dim">0.95</text>
    <line x1="70" y1="227.93" x2="74" y2="227.93" class="tick"/>
    <text x="66" y="231.53" text-anchor="end" class="sm dim">1.05</text>
    <line x1="70" y1="138.64" x2="74" y2="138.64" class="tick"/>
    <text x="66" y="142.24" text-anchor="end" class="sm dim">1.15</text>
    <text x="314" y="376" text-anchor="end" class="sm dim">accident year</text>
    <text x="70" y="80" text-anchor="start" class="sm dim">index</text>
    <polyline points="89.65,272.57 141.83,231.5 194,189.54 246.17,144.89 298.35,97.57" class="curve" stroke="#e11d48" stroke-width="2.2"/>
    <text x="294.35" y="89.57" text-anchor="end" class="sm bold" fill="#e11d48">severity</text>
    <polyline points="89.65,272.57 141.83,283.29 194,294 246.17,304.71 298.35,314.54" class="curve" stroke="#3b82f6" stroke-width="2.2"/>
    <text x="294.35" y="330.54" text-anchor="end" class="sm bold" fill="#3b82f6">frequency</text>
    <polyline points="89.65,272.57 141.83,243.11 194,212.75 246.17,181.5 298.35,147.57" class="curve" stroke="#059669" stroke-width="2.2"/>
    <text x="294.35" y="163.57" text-anchor="end" class="sm bold" fill="#059669">pure premium</text>
  </g>
</svg>
