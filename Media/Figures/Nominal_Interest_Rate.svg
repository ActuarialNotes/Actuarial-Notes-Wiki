  <line x1="72" y1="184.56" x2="328" y2="184.56" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="215.36" y="171.16" text-anchor="middle" class="sm" fill="#059669">δ = ln(1 + i)</text>
