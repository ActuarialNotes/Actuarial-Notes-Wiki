  <text x="312" y="236" text-anchor="end" class="sm dim">year</text>
  <text x="56" y="52" text-anchor="start" class="sm dim">value of 1</text>
  <line x1="68" y1="76" x2="81" y2="76" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="87" y="79.6" text-anchor="start" class="sm">annual</text>
  <line x1="68" y1="92" x2="81" y2="92" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="87" y="95.6" text-anchor="start" class="sm">quarterly</text>
  <line x1="68" y1="108" x2="81" y2="108" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="87" y="111.6" text-anchor="start" class="sm">monthly</text>
  <line x1="68" y1="124" x2="81" y2="124" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="87" y="127.6" text-anchor="start" class="sm">continuous</text>
  <text x="430" y="92" text-anchor="middle" class="sm bold">(1 + i⁽ᵐ⁾/m)ᵐ = 1 + i</text>
  <text x="430" y="112" text-anchor="middle" class="sm dim">i⁽ᵐ⁾ = 12% quoted throughout</text>
  <text x="340" y="142" text-anchor="start" class="sm">m = 1</text>
  <text x="524" y="142" text-anchor="end" class="sm bold">i = 12.000%</text>
  <text x="340" y="168" text-anchor="start" class="sm">m = 4</text>
  <text x="524" y="168" text-anchor="end" class="sm bold">i = 12.551%</text>
  <text x="340" y="194" text-anchor="start" class="sm">m = 12</text>
  <text x="524" y="194" text-anchor="end" class="sm bold">i = 12.683%</text>
  <text x="340" y="220" text-anchor="start" class="sm">m = ∞</text>
  <text x="524" y="220" text-anchor="end" class="sm bold">i = 12.750%</text>
  <line x1="340" y1="252" x2="524" y2="252" class="rule"/>
  <text x="432" y="270" text-anchor="middle" class="sm dim">more frequent → higher effective i</text>
</svg>
