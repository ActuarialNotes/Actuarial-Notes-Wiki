  <line x1="76" y1="184.86" x2="322" y2="184.86" class="thin" stroke="var(--dim)" stroke-width="1.3"/>
  <circle cx="199" cy="184.86" r="4" fill="#d97706"/>
  <text x="199" y="200.86" text-anchor="middle" class="sm">S = 0 at the current yield</text>
  <line x1="76" y1="184.86" x2="332" y2="184.86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="204" x2="76" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="100.6" y1="184.86" x2="100.6" y2="188.86" class="tick"/>
  <text x="100.6" y="200.86" text-anchor="middle" class="sm dim">-2%</text>
  <line x1="297.4" y1="184.86" x2="297.4" y2="188.86" class="tick"/>
  <text x="297.4" y="200.86" text-anchor="middle" class="sm dim">+2%</text>
  <line x1="72" y1="184.86" x2="76" y2="184.86" class="tick"/>
  <text x="68" y="188.46" text-anchor="end" class="sm dim">0</text>
  <line x1="72" y1="137" x2="76" y2="137" class="tick"/>
  <text x="68" y="140.6" text-anchor="end" class="sm dim">10</text>
  <line x1="72" y1="89.14" x2="76" y2="89.14" class="tick"/>
  <text x="68" y="92.74" text-anchor="end" class="sm dim">20</text>
  <text x="72" y="56" text-anchor="start" class="sm dim">surplus S</text>
  <text x="322" y="224" text-anchor="end" class="sm dim">Δj</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">ΔS ≈ ½(C_A − C_L)·V·(Δj)²</text>
  <line x1="342" y1="126" x2="342" y2="160" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="139" text-anchor="start" class="sm bold">Non-negative either way</text>
  <text x="352" y="155" text-anchor="start" class="sm dim">the parabola opens upward</text>
  <line x1="342" y1="174" x2="342" y2="208" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="187" text-anchor="start" class="sm bold">Small parallel shifts only</text>
  <text x="352" y="203" text-anchor="start" class="sm dim">not a general guarantee</text>
  <line x1="342" y1="222" x2="342" y2="256" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="235" text-anchor="start" class="sm bold">Needs rebalancing</text>
  <text x="352" y="251" text-anchor="start" class="sm dim">durations drift as time passes</text>
  <text x="280" y="290" text-anchor="middle" class="sm dim">Less restrictive than cash-flow matching — the dates need not agree</text>
</svg>
