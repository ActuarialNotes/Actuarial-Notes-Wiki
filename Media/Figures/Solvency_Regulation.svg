<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The solvency condition — assets covering liabilities plus required capital — and the three pillars</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Assets must cover the liabilities and a</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">buffer</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="438" text-anchor="middle" class="fml">Assets ≥ Liabilities + Required capital</text>
    <text x="180" y="100" text-anchor="middle" class="sm dim">the balance sheet the regulator tests</text>
    <rect x="46" y="118" width="110" height="176" rx="6" fill="#3b82f6" fill-opacity="0.20" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="101" y="210" text-anchor="middle" class="sm bold">assets</text>
    <rect x="204" y="118" width="110" height="118" rx="6" fill="#d97706" fill-opacity="0.20" stroke="#d97706" stroke-width="1.3"/>
    <text x="259" y="182" text-anchor="middle" class="sm bold">liabilities</text>
    <rect x="204" y="240" width="110" height="54" rx="6" fill="#059669" fill-opacity="0.24" stroke="#059669" stroke-width="1.3"/>
    <text x="259" y="265" text-anchor="middle" class="sm bold">required</text>
    <text x="259" y="280" text-anchor="middle" class="sm bold">capital</text>
    <text x="180" y="210" text-anchor="middle" class="ttl" fill="var(--dim)">≥</text>
    <rect x="40" y="310" width="88" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="84" y="326" text-anchor="middle" class="sm">capital</text>
    <rect x="136" y="310" width="88" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="326" text-anchor="middle" class="sm">governance</text>
    <rect x="232" y="310" width="88" height="24" rx="12.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
    <text x="276" y="326" text-anchor="middle" class="sm">disclosure</text>
    <text x="180" y="358" text-anchor="middle" class="sm dim">three pillars — and not a zero-failure regime:</text>
    <text x="180" y="374" text-anchor="middle" class="sm dim">PACICC exists because insurers are allowed to fail</text>
  </g>
</svg>
