<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>One column of link ratios and the selections drawn from it</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The ratio of one maturity to the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">previous one</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">f = C(AY, n+1) / C(AY, n)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">vol-weighted = Σ C(·, n+1) / Σ C(·, n)</text>
  <text x="180" y="108" text-anchor="middle" class="sm dim">the 12–24 column of the reported triangle</text>
  <text x="52" y="140" text-anchor="start" class="sm dim">2020</text>
  <text x="160" y="140" text-anchor="end" class="sm">1,500 / 1,000</text>
  <text x="232" y="140" text-anchor="end" class="sm">1.500</text>
  <text x="52" y="172" text-anchor="start" class="sm dim">2021</text>
  <text x="160" y="172" text-anchor="end" class="sm">1,650 / 1,100</text>
  <text x="232" y="172" text-anchor="end" class="sm">1.500</text>
  <text x="52" y="204" text-anchor="start" class="sm dim">2022</text>
  <text x="160" y="204" text-anchor="end" class="sm">1,800 / 1,200</text>
  <text x="232" y="204" text-anchor="end" class="sm">1.500</text>
  <text x="52" y="236" text-anchor="start" class="sm dim">2023</text>
  <text x="160" y="236" text-anchor="end" class="sm">2,025 / 1,350</text>
  <text x="232" y="236" text-anchor="end" class="sm">1.500</text>
  <line x1="46" y1="284" x2="314" y2="284" class="rule"/>
  <text x="160" y="306" text-anchor="end" class="sm dim">6,975 / 4,650</text>
  <text x="232" y="306" text-anchor="end" class="sm bold">1.500</text>
  <text x="280" y="306" text-anchor="start" class="sm dim">selected</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">factors need not exceed 1.000 — salvage and</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">over-reserved claims develop downward</text>
</svg>
