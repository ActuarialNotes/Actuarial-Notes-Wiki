  <circle cx="202" cy="313.71" r="4" fill="#d97706"/>
  <text x="202" y="343.71" text-anchor="middle" class="sm">S = 0 at the current yield</text>
  <line x1="78" y1="313.71" x2="336" y2="313.71" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="102.8" y1="313.71" x2="102.8" y2="317.71" class="tick"/>
  <text x="102.8" y="329.71" text-anchor="middle" class="sm dim">-2%</text>
  <line x1="301.2" y1="313.71" x2="301.2" y2="317.71" class="tick"/>
  <text x="301.2" y="329.71" text-anchor="middle" class="sm dim">+2%</text>
  <line x1="74" y1="313.71" x2="78" y2="313.71" class="tick"/>
