  <line x1="52" y1="190" x2="52" y2="52" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="310" y="222" text-anchor="end" class="sm dim">x</text>
  <text x="48" y="48" text-anchor="start" class="sm dim">f(x)</text>
  <line x1="135.9" y1="190" x2="135.9" y2="68.1" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="169.9" y="96.57" text-anchor="middle" class="sm bold">μ = E[X]</text>
  <polygon points="135.9,192 126.9,206 144.9,206" fill="#d97706"/>
  <line x1="52" y1="192" x2="310" y2="192" stroke="#d97706" stroke-width="1.6"/>
  <text x="181" y="224" text-anchor="middle" class="sm dim">the distribution balances here</text>
  <text x="414" y="84" text-anchor="middle" class="sm bold">E[X] weights every value</text>
  <text x="414" y="106" text-anchor="middle" class="sm dim">by how likely it is</text>
  <line x1="312" y1="128" x2="312" y2="154" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="322" y="138" text-anchor="start" class="sm bold">Discrete</text>
  <text x="322" y="152" text-anchor="start" class="sm dim">E[X] = Σ k · f(k)</text>
  <line x1="312" y1="166" x2="312" y2="192" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="322" y="176" text-anchor="start" class="sm bold">Continuous</text>
  <text x="322" y="190" text-anchor="start" class="sm dim">E[X] = ∫ x · f(x) dx</text>
  <line x1="312" y1="204" x2="312" y2="230" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="322" y="214" text-anchor="start" class="sm bold">Linearity</text>
  <text x="322" y="228" text-anchor="start" class="sm dim">E[aX + b] = a E[X] + b</text>
  <line x1="312" y1="242" x2="312" y2="268" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="322" y="252" text-anchor="start" class="sm bold">Moments</text>
  <text x="322" y="266" text-anchor="start" class="sm dim">n-th moment E[Xⁿ]</text>
</svg>
