    <text x="38" y="298" text-anchor="middle" class="sm bold">1</text>
    <text x="180" y="358" text-anchor="middle" class="sm bold">oversight</text>
    <circle cx="146" cy="294" r="9" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
