<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <title>A perpetuity's payments and the finite present value they converge to</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A perpetuity pays forever, but its present value is finite</text>
  <line x1="82" y1="122" x2="438" y2="122" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="90" y1="118" x2="90" y2="126" class="tick"/>
  <text x="90" y="139" text-anchor="middle" class="sm dim">0</text>
  <line x1="145" y1="118" x2="145" y2="126" class="tick"/>
  <text x="145" y="139" text-anchor="middle" class="sm dim">1</text>
  <line x1="200" y1="118" x2="200" y2="126" class="tick"/>
  <text x="200" y="139" text-anchor="middle" class="sm dim">2</text>
  <line x1="255" y1="118" x2="255" y2="126" class="tick"/>
  <text x="255" y="139" text-anchor="middle" class="sm dim">3</text>
  <line x1="310" y1="118" x2="310" y2="126" class="tick"/>
  <text x="310" y="139" text-anchor="middle" class="sm dim">4</text>
  <line x1="365" y1="118" x2="365" y2="126" class="tick"/>
  <text x="365" y="139" text-anchor="middle" class="sm dim">5</text>
  <line x1="420" y1="118" x2="420" y2="126" class="tick"/>
  <text x="420" y="139" text-anchor="middle" class="sm dim">…</text>
  <line x1="145" y1="122" x2="145" y2="90" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="145" y="84" text-anchor="middle" class="sm">1</text>
  <line x1="200" y1="122" x2="200" y2="90" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="200" y="84" text-anchor="middle" class="sm">1</text>
  <line x1="255" y1="122" x2="255" y2="90" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="255" y="84" text-anchor="middle" class="sm">1</text>
  <line x1="310" y1="122" x2="310" y2="90" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="310" y="84" text-anchor="middle" class="sm">1</text>
  <line x1="365" y1="122" x2="365" y2="90" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="365" y="84" text-anchor="middle" class="sm">1</text>
  <line x1="420" y1="122" x2="420" y2="90" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="444" y="126" text-anchor="start" class="sm dim">forever</text>
