<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Disjoint events versus overlapping events</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <clipPath id="meA"><circle cx="156.0" cy="300" r="46"/></clipPath>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Mutually exclusive events cannot overlap</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">A ∩ B = ∅  ⇒  P(A ∪ B) = P(A) + P(B)</text>
  <rect x="34" y="88" width="292" height="124" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="46" y="104" text-anchor="middle" class="sm dim">S</text>
  <circle cx="134" cy="150" r="46" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="226" cy="150" r="46" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.6"/>
  <text x="108.7" y="100" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <text x="251.3" y="100" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <text x="180" y="232" text-anchor="middle" class="bold" fill="#3b82f6">A ∩ B = ∅</text>
  <rect x="34" y="238" width="292" height="124" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="46" y="254" text-anchor="middle" class="sm dim">S</text>
  <circle cx="156" cy="300" r="46" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="204" cy="300" r="46" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.6"/>
  <text x="130.7" y="250" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <text x="229.3" y="250" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <g clip-path="url(#meA)"><circle cx="204.0" cy="300" r="46" fill="#e11d48" fill-opacity="0.4"/></g>
  <text x="180" y="382" text-anchor="middle" class="bold" fill="#e11d48">A ∩ B ≠ ∅</text>
</svg>
