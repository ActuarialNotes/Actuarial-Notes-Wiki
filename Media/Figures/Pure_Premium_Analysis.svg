<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Pure premium by accident year decomposed into frequency and severity</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Which half of the loss cost moved?</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Pure Premium = Frequency × Severity</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">+4.6% severity, −1.2% frequency ⇒ +3.3%</text>
  <line x1="89.65" y1="106" x2="89.65" y2="320" class="grid"/>
  <line x1="141.83" y1="106" x2="141.83" y2="320" class="grid"/>
  <line x1="194" y1="106" x2="194" y2="320" class="grid"/>
  <line x1="246.17" y1="106" x2="246.17" y2="320" class="grid"/>
  <line x1="298.35" y1="106" x2="298.35" y2="320" class="grid"/>
  <line x1="74" y1="297.07" x2="314" y2="297.07" class="grid"/>
  <line x1="74" y1="220.64" x2="314" y2="220.64" class="grid"/>
  <line x1="74" y1="144.21" x2="314" y2="144.21" class="grid"/>
  <line x1="74" y1="320" x2="324" y2="320" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="320" x2="74" y2="96" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="89.65" y1="320" x2="89.65" y2="324" class="tick"/>
  <text x="89.65" y="336" text-anchor="middle" class="sm dim">2020</text>
  <line x1="141.83" y1="320" x2="141.83" y2="324" class="tick"/>
  <text x="141.83" y="336" text-anchor="middle" class="sm dim">2021</text>
  <line x1="194" y1="320" x2="194" y2="324" class="tick"/>
  <text x="194" y="336" text-anchor="middle" class="sm dim">2022</text>
  <line x1="246.17" y1="320" x2="246.17" y2="324" class="tick"/>
  <text x="246.17" y="336" text-anchor="middle" class="sm dim">2023</text>
  <line x1="298.35" y1="320" x2="298.35" y2="324" class="tick"/>
  <text x="298.35" y="336" text-anchor="middle" class="sm dim">2024</text>
  <line x1="70" y1="297.07" x2="74" y2="297.07" class="tick"/>
  <text x="66" y="300.67" text-anchor="end" class="sm dim">0.95</text>
  <line x1="70" y1="220.64" x2="74" y2="220.64" class="tick"/>
  <text x="66" y="224.24" text-anchor="end" class="sm dim">1.05</text>
  <line x1="70" y1="144.21" x2="74" y2="144.21" class="tick"/>
  <text x="66" y="147.81" text-anchor="end" class="sm dim">1.15</text>
  <polyline points="89.65,258.86 141.83,223.7 194,187.78 246.17,149.56 298.35,109.06" class="curve" stroke="#e11d48" stroke-width="2.2"/>
  <text x="294.35" y="101.06" text-anchor="end" class="sm bold" fill="#e11d48">severity</text>
  <polyline points="89.65,258.86 141.83,268.03 194,277.2 246.17,286.37 298.35,294.78" class="curve" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="294.35" y="310.78" text-anchor="end" class="sm bold" fill="#3b82f6">frequency</text>
  <polyline points="89.65,258.86 141.83,233.64 194,207.65 246.17,180.9 298.35,151.86" class="curve" stroke="#059669" stroke-width="2.2"/>
  <text x="294.35" y="143.86" text-anchor="end" class="sm bold" fill="#059669">pure premium</text>
  <text x="180" y="350" text-anchor="middle" class="sm dim">indexed to accident year 2020</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">a rising pure premium built on falling frequency</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">is a different problem from a rising one on both</text>
</svg>
