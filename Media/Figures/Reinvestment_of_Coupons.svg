  <line x1="80" y1="142.86" x2="326" y2="142.86" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="203" y1="208" x2="203" y2="142.86" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <circle cx="203" cy="142.86" r="3.6" fill="#059669"/>
  <text x="229" y="132.86" text-anchor="middle" class="sm bold">r_i = j</text>
  <text x="113.83" y="173" text-anchor="start" class="sm">short of the yield</text>
  <text x="282.95" y="92.06" text-anchor="middle" class="sm">ahead of it</text>
  <line x1="80" y1="208" x2="336" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="80" y1="208" x2="80" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="110.75" y1="208" x2="110.75" y2="212" class="tick"/>
  <text x="110.75" y="224" text-anchor="middle" class="sm dim">2%</text>
  <line x1="203" y1="208" x2="203" y2="212" class="tick"/>
  <text x="203" y="224" text-anchor="middle" class="sm dim">5%</text>
  <line x1="295.25" y1="208" x2="295.25" y2="212" class="tick"/>
  <text x="295.25" y="224" text-anchor="middle" class="sm dim">8%</text>
  <line x1="76" y1="199.25" x2="80" y2="199.25" class="tick"/>
  <text x="72" y="202.85" text-anchor="end" class="sm dim">1,500</text>
  <line x1="76" y1="155.5" x2="80" y2="155.5" class="tick"/>
  <text x="72" y="159.1" text-anchor="end" class="sm dim">1,600</text>
  <line x1="76" y1="111.75" x2="80" y2="111.75" class="tick"/>
  <text x="72" y="115.35" text-anchor="end" class="sm dim">1,700</text>
  <text x="326" y="240" text-anchor="end" class="sm dim">reinvestment rate r_i</text>
  <text x="76" y="54" text-anchor="start" class="sm dim">accumulated value</text>
  <text x="428" y="100" text-anchor="middle" class="sm bold">AV = Fr · s₍ₙ₎ at r_i  +  C</text>
  <line x1="340" y1="126" x2="340" y2="160" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="139" text-anchor="start" class="sm bold">r_i = j</text>
  <text x="350" y="155" text-anchor="start" class="sm dim">AV = P(1+j)ⁿ — exactly the yield</text>
  <line x1="340" y1="174" x2="340" y2="208" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="187" text-anchor="start" class="sm bold">r_i &lt; j</text>
  <text x="350" y="203" text-anchor="start" class="sm dim">the realised return falls short</text>
  <line x1="340" y1="222" x2="340" y2="256" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="235" text-anchor="start" class="sm bold">r_i &gt; j</text>
  <text x="350" y="251" text-anchor="start" class="sm dim">the investor beats the promised yield</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">This gap is reinvestment risk — the reason duration matters</text>
</svg>
