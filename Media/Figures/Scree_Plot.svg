<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Eigenvalues falling steeply and then flattening, with the elbow marked</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Keep the components before the elbow</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">plot λ_m against m</text>
  <line x1="88.97" y1="100" x2="88.97" y2="316" class="grid"/>
  <line x1="130.58" y1="100" x2="130.58" y2="316" class="grid"/>
  <line x1="172.19" y1="100" x2="172.19" y2="316" class="grid"/>
  <line x1="213.81" y1="100" x2="213.81" y2="316" class="grid"/>
  <line x1="255.42" y1="100" x2="255.42" y2="316" class="grid"/>
  <line x1="297.03" y1="100" x2="297.03" y2="316" class="grid"/>
  <line x1="64" y1="316" x2="322" y2="316" class="grid"/>
  <line x1="64" y1="250.55" x2="322" y2="250.55" class="grid"/>
  <line x1="64" y1="185.09" x2="322" y2="185.09" class="grid"/>
  <line x1="64" y1="119.64" x2="322" y2="119.64" class="grid"/>
  <line x1="64" y1="316" x2="332" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="316" x2="64" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="88.97" y1="316" x2="88.97" y2="320" class="tick"/>
  <text x="88.97" y="332" text-anchor="middle" class="sm dim">1</text>
  <line x1="130.58" y1="316" x2="130.58" y2="320" class="tick"/>
  <text x="130.58" y="332" text-anchor="middle" class="sm dim">2</text>
  <line x1="172.19" y1="316" x2="172.19" y2="320" class="tick"/>
  <text x="172.19" y="332" text-anchor="middle" class="sm dim">3</text>
  <line x1="213.81" y1="316" x2="213.81" y2="320" class="tick"/>
  <text x="213.81" y="332" text-anchor="middle" class="sm dim">4</text>
  <line x1="255.42" y1="316" x2="255.42" y2="320" class="tick"/>
  <text x="255.42" y="332" text-anchor="middle" class="sm dim">5</text>
  <line x1="297.03" y1="316" x2="297.03" y2="320" class="tick"/>
  <text x="297.03" y="332" text-anchor="middle" class="sm dim">6</text>
  <line x1="60" y1="316" x2="64" y2="316" class="tick"/>
  <text x="56" y="319.6" text-anchor="end" class="sm dim">0</text>
  <line x1="60" y1="250.55" x2="64" y2="250.55" class="tick"/>
  <text x="56" y="254.15" text-anchor="end" class="sm dim">1</text>
  <line x1="60" y1="185.09" x2="64" y2="185.09" class="tick"/>
  <text x="56" y="188.69" text-anchor="end" class="sm dim">2</text>
  <line x1="60" y1="119.64" x2="64" y2="119.64" class="tick"/>
  <text x="56" y="123.24" text-anchor="end" class="sm dim">3</text>
  <polyline points="88.97,126.18 130.58,211.27 172.19,270.18 213.81,289.82 255.42,296.36 297.03,309.45" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="88.97" cy="126.18" r="3.4" fill="#3b82f6"/>
  <circle cx="130.58" cy="211.27" r="5" fill="#059669"/>
  <circle cx="172.19" cy="270.18" r="3.4" fill="#3b82f6"/>
  <circle cx="213.81" cy="289.82" r="3.4" fill="#3b82f6"/>
  <circle cx="255.42" cy="296.36" r="3.4" fill="#3b82f6"/>
  <circle cx="297.03" cy="309.45" r="3.4" fill="#3b82f6"/>
  <line x1="64" y1="250.55" x2="322" y2="250.55" class="thin dash" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="313.68" y="243.55" text-anchor="end" class="sm bold" fill="#7c3aed">λ = 1</text>
  <text x="144.58" y="200.27" text-anchor="middle" class="sm bold" fill="#059669">elbow</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">component m</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">the flat tail is the scree — noise</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">Kaiser agrees here: two components, 75%</text>
</svg>
