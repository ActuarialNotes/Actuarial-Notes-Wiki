<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running GMM group's $11M CSM released over three years on two drivers: evenly by policy count, or front-loaded by sum insured (40%, 35%, 25%) — the same total landing in different years</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="60" y1="352" x2="332" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="60" y1="352" x2="60" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="352" x2="60" y2="352" class="tick"/>
    <text x="52" y="355.6" text-anchor="end" class="sm dim">0</text>
    <line x1="56" y1="247.2" x2="60" y2="247.2" class="tick"/>
    <text x="52" y="250.8" text-anchor="end" class="sm dim">2</text>
    <line x1="56" y1="142.4" x2="60" y2="142.4" class="tick"/>
    <text x="52" y="146" text-anchor="end" class="sm dim">4</text>
    <rect x="79.65" y="159.87" width="27.84" height="192.13" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="110.76" y="121.44" width="27.84" height="230.56" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="109.12" y="369" text-anchor="middle" class="sm dim">yr 1</text>
    <rect x="161.53" y="159.87" width="27.84" height="192.13" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="192.64" y="150.26" width="27.84" height="201.74" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="191" y="369" text-anchor="middle" class="sm dim">yr 2</text>
    <rect x="243.4" y="159.87" width="27.84" height="192.13" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="274.51" y="207.9" width="27.84" height="144.1" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="272.88" y="369" text-anchor="middle" class="sm dim">yr 3</text>
    <text x="97.57" y="294.36" text-anchor="middle" class="sm bold" transform="rotate(-90 93.56875 294.36)">policy count</text>
    <text x="128.68" y="294.36" text-anchor="middle" class="sm bold" transform="rotate(-90 124.68124999999998 294.36)">sum insured</text>
  </g>
</svg>
