<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Independence as a product of areas on the unit square</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Independent events: knowing A does not</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">change P(B)</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(A ∩ B) = P(A) · P(B)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">0.6 × 0.5 = 0.30</text>
  <rect x="92" y="106" width="200" height="200" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="92" y="106" width="120" height="200" fill="#3b82f6" fill-opacity="0.14"/>
  <rect x="92" y="106" width="200" height="100" fill="#d97706" fill-opacity="0.14"/>
  <rect x="92" y="106" width="120" height="100" fill="#059669" fill-opacity="0.32"/>
  <line x1="212" y1="106" x2="212" y2="306" class="thin" stroke="#3b82f6" stroke-width="1.4"/>
  <line x1="92" y1="206" x2="292" y2="206" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <path d="M92,314 v4.8 H147 q5,0 5,4.4 q0,-4.4 5,-4.4 H212 v-4.8" class="thin" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="152" y="333" text-anchor="middle" class="sm dim">P(A) = 0.6</text>
  <text x="82" y="156" text-anchor="end" class="sm" fill="#d97706">P(B)</text>
  <text x="82" y="171" text-anchor="end" class="sm" fill="#d97706">= 0.5</text>
  <text x="152" y="161" text-anchor="middle" class="bold" fill="#059669">0.30</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">knowing B tells you nothing about A</text>
</svg>
