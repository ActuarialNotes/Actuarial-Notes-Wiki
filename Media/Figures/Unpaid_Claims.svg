<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The ultimate loss split into what has been paid, the case reserves and IBNR</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Everything still owed on losses already</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">incurred</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Unpaid = Ultimate − Paid to date</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Unpaid = Case Reserves + IBNR</text>
  <text x="180" y="118" text-anchor="middle" class="sm dim">AY 2024 at 12 months ($000)</text>
  <rect x="44" y="160" width="57.26" height="44" rx="4" fill="#059669" fill-opacity="0.34" stroke="#059669" stroke-width="1.2"/>
  <rect x="101.26" y="160" width="85.89" height="44" rx="4" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.2"/>
  <rect x="187.16" y="160" width="128.84" height="44" rx="4" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.2"/>
  <path d="M44,156 v-4.8 H175 q5,0 5,-4.4 q0,4.4 5,4.4 H316 v4.8" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="180" y="135" text-anchor="middle" class="sm dim">ultimate 2,850</text>
  <path d="M101.26,210 v4.8 H203.63 q5,0 5,4.4 q0,-4.4 5,-4.4 H316 v-4.8" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="208.63" y="229" text-anchor="middle" class="sm dim">unpaid claim estimate 2,250</text>
  <rect x="84" y="259" width="11" height="11" rx="2" fill="#059669" fill-opacity="0.8"/>
  <text x="102" y="269" text-anchor="start" class="sm">paid 600</text>
  <rect x="84" y="291" width="11" height="11" rx="2" fill="#d97706" fill-opacity="0.8"/>
  <text x="102" y="301" text-anchor="start" class="sm">case 900</text>
  <rect x="84" y="323" width="11" height="11" rx="2" fill="#7c3aed" fill-opacity="0.8"/>
  <text x="102" y="333" text-anchor="start" class="sm">IBNR 1,350</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">reported = paid + case; the rest is the actuary's</text>
</svg>
