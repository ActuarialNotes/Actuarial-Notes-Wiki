<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Territory relativities of 1.42 urban, 1.15 suburb, 0.94 town and 0.78 rural, as columns about a dashed 1.00 base</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="62.07" y="142.55" width="38.86" height="209.45" rx="3" fill="#e11d48" fill-opacity="0.75"/>
    <text x="81.5" y="367" text-anchor="middle" class="sm dim">urban</text>
    <rect x="129.07" y="182.38" width="38.86" height="169.62" rx="3" fill="#d97706" fill-opacity="0.75"/>
    <text x="148.5" y="367" text-anchor="middle" class="sm dim">suburb</text>
    <rect x="196.07" y="213.35" width="38.86" height="138.65" rx="3" fill="#0d9488" fill-opacity="0.75"/>
    <text x="215.5" y="367" text-anchor="middle" class="sm dim">town</text>
    <rect x="263.07" y="236.95" width="38.86" height="115.05" rx="3" fill="#059669" fill-opacity="0.75"/>
    <text x="282.5" y="367" text-anchor="middle" class="sm dim">rural</text>
    <line x1="42" y1="352" x2="322" y2="352" class="axis"/>
    <line x1="42" y1="204.5" x2="322" y2="204.5" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="322" y="198.5" text-anchor="end" class="sm dim">1.00</text>
    <text x="81.5" y="135.55" text-anchor="middle" class="sm bold">1.42</text>
    <text x="148.5" y="175.38" text-anchor="middle" class="sm bold">1.15</text>
    <text x="215.5" y="230.35" text-anchor="middle" class="sm bold">0.94</text>
    <text x="282.5" y="253.95" text-anchor="middle" class="sm bold">0.78</text>
  </g>
</svg>
