<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The running PAA book's LRC at six months, and the loss component the onerous test adds to it</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Premium not yet earned, less what buying</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">it cost</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">LRC = premiums − acquisition amortised</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">− revenue recognised</text>
  <text x="180" y="100" text-anchor="middle" class="sm dim">$24M written 1 July, at 31 December ($M)</text>
  <text x="40" y="124" text-anchor="start" class="sm">premium unearned</text>
  <rect x="40" y="132" width="228" height="20" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="276" y="147" text-anchor="start" class="sm">12.0</text>
  <text x="40" y="168" text-anchor="start" class="sm">less acquisition</text>
  <rect x="40" y="176" width="45.6" height="20" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="93.6" y="191" text-anchor="start" class="sm">-2.4</text>
  <text x="40" y="212" text-anchor="start" class="sm">LRC carried</text>
  <rect x="40" y="220" width="182.4" height="20" rx="3" fill="#0d9488" fill-opacity="0.55"/>
  <text x="230.4" y="235" text-anchor="start" class="sm">9.6</text>
  <text x="40" y="256" text-anchor="start" class="sm">fulfilment cash flows</text>
  <rect x="40" y="264" width="218.5" height="20" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="266.5" y="279" text-anchor="start" class="sm">11.5</text>
  <line x1="30" y1="302" x2="330" y2="302" class="rule"/>
  <rect x="40" y="316" width="280" height="46" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="336" text-anchor="middle" class="sm">the group is onerous by $1.9M — recognised</text>
  <text x="180" y="353" text-anchor="middle" class="sm">in full now, and tracked as the loss component</text>
  <text x="180" y="384" text-anchor="middle" class="sm dim">the test is per group: no profitable group offsets it</text>
</svg>
