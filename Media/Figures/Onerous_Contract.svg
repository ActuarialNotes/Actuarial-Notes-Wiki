<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The onerous test at group level, and the asymmetry between a loss and a profit</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A loss is taken now; a profit is</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">deferred</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Onerous ⟺ PV(outflows) + RA</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">&gt; PV(inflows)</text>
  <text x="40" y="112" text-anchor="start" class="sm bold">group A</text>
  <rect x="40" y="124" width="230" height="22" rx="3" fill="#3b82f6" fill-opacity="0.35"/>
  <text x="46" y="140" text-anchor="start" class="sm">consideration</text>
  <rect x="40" y="154" width="197.8" height="22" rx="3" fill="#059669" fill-opacity="0.50"/>
  <text x="46" y="170" text-anchor="start" class="sm">fulfilment cash flows</text>
  <text x="40" y="212" text-anchor="start" class="sm bold">group B</text>
  <rect x="40" y="224" width="230" height="22" rx="3" fill="#3b82f6" fill-opacity="0.35"/>
  <text x="46" y="240" text-anchor="start" class="sm">consideration</text>
  <rect x="40" y="254" width="271.4" height="22" rx="3" fill="#e11d48" fill-opacity="0.50"/>
  <text x="46" y="270" text-anchor="start" class="sm">fulfilment cash flows</text>
  <text x="180" y="188" text-anchor="middle" class="sm dim">profitable — the margin is deferred as CSM</text>
  <text x="180" y="296" text-anchor="middle" class="sm" fill="#e11d48">onerous — the shortfall is a loss today</text>
  <line x1="30" y1="316" x2="330" y2="316" class="rule"/>
  <text x="180" y="338" text-anchor="middle" class="sm dim">tested per group, at issue and at every</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">reporting date — no profitable group offsets it</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">a rate approved below the indication is the warning</text>
</svg>
