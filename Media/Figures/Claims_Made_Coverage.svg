<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>On a plane of accident date against report date, the covered region is a band: claims reported inside the policy period for accidents after the retro date</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="104" y="100" width="216" height="216" rx="6" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <polygon points="104,316 320,100 320,316" fill="var(--edge)" fill-opacity="0.5"/>
    <line x1="104" y1="316" x2="320" y2="100" class="thin dash" stroke="var(--axis)" stroke-width="1.1"/>
    <text x="263.84" y="290.08" text-anchor="middle" class="sm dim">impossible</text>
    <text x="320" y="364" text-anchor="end" class="sm dim">accident date</text>
    <text x="96" y="112" text-anchor="end" class="sm dim">report date</text>
    <polygon points="142.88,225.28 194.72,225.28 250.88,169.12 142.88,169.12" fill="#d97706" fill-opacity="0.26" stroke="#d97706" stroke-width="1.4"/>
    <line x1="142.88" y1="316" x2="142.88" y2="100" class="thin dash" stroke="#e11d48" stroke-width="1.4"/>
    <text x="142.88" y="92" text-anchor="middle" class="sm bold">retro date</text>
    <text x="175.28" y="201.2" text-anchor="middle" class="sm bold">covered</text>
    <path d="M102.0,225.3 H98.0 V169.1 H102.0" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="92" y="201.2" text-anchor="end" class="sm dim">policy period</text>
  </g>
</svg>
