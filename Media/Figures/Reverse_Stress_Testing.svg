<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two runs along one line from today to non-viability: a forward test applying one known shock that stops well short, and a reverse test starting at non-viability and working back to the combination of shocks that would reach it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="268" y="84" width="64" height="290" rx="6" fill="#e11d48" fill-opacity="0.14" stroke="none"/>
    <line x1="268" y1="84" x2="268" y2="374" class="thin" stroke="#e11d48" stroke-width="1.8"/>
    <text x="300" y="110" text-anchor="middle" class="sm bold">non-viable</text>
    <line x1="44" y1="84" x2="44" y2="374" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="44" y="388" text-anchor="middle" class="sm dim">today</text>
    <rect x="44" y="132" width="104" height="38" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
    <line x1="154" y1="151" x2="194" y2="151" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="50" y="122" text-anchor="start" class="sm bold">forward</text>
    <line x1="266" y1="248" x2="104" y2="248" class="thin dash" stroke="#e11d48" stroke-width="2" marker-end="url(#ahe11d48)"/>
    <text x="262" y="234" text-anchor="end" class="sm bold">reverse</text>
    <rect x="44" y="278" width="89.6" height="38" rx="3" fill="#e11d48" fill-opacity="0.6"/>
    <text x="88.8" y="301" text-anchor="middle" class="sm">cat</text>
    <rect x="133.6" y="278" width="76.16" height="38" rx="3" fill="#d97706" fill-opacity="0.6"/>
    <text x="171.68" y="301" text-anchor="middle" class="sm">reserves</text>
    <rect x="209.76" y="278" width="58.24" height="38" rx="3" fill="#0d9488" fill-opacity="0.6"/>
    <text x="238.88" y="301" text-anchor="middle" class="sm">reinsurer</text>
  </g>
</svg>
