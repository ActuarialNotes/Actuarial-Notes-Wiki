<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>S drawn as a unit-wide rectangle on a 0-to-1 ruler, with two disjoint events side by side whose widths add to the width of their union</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="46" y="104" width="268" height="232" rx="6" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <rect x="46" y="104" width="80.4" height="232" fill="#3b82f6" fill-opacity="0.45"/>
    <rect x="126.4" y="104" width="67" height="232" fill="#7c3aed" fill-opacity="0.45"/>
    <line x1="126.4" y1="104" x2="126.4" y2="336" stroke="var(--surf)" stroke-width="2"/>
    <rect x="46" y="104" width="268" height="232" rx="6" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
    <text x="86.2" y="225" text-anchor="middle" class="bold">E₁</text>
    <text x="159.9" y="225" text-anchor="middle" class="bold">E₂</text>
    <text x="253.7" y="225" text-anchor="middle" class="bold dim">S</text>
    <line x1="46" y1="94" x2="46" y2="102" class="tick"/>
    <text x="46" y="88" text-anchor="middle" class="sm dim">0</text>
    <line x1="314" y1="94" x2="314" y2="102" class="tick"/>
    <text x="314" y="88" text-anchor="middle" class="sm dim">1</text>
    <path d="M46,344 v6 H114.7 q5,0 5,5.5 q0,-5.5 5,-5.5 H193.4 v-6" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="119.7" y="365" text-anchor="middle" class="sm bold">E₁ ∪ E₂</text>
  </g>
</svg>
