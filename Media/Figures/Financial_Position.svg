<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running insurer's balance sheet as two columns of equal height — $1,240M of assets against $980M of liabilities and $260M of equity — and the equity cut by $12M of intangibles to $248M of capital available</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="36" y="112" width="100" height="262" rx="5" fill="#3b82f6" fill-opacity="0.24" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="86" y="239" text-anchor="middle" class="sm bold">assets</text>
    <text x="86" y="255" text-anchor="middle" class="sm">1,240</text>
    <rect x="158" y="166.94" width="100" height="207.06" rx="5" fill="#d97706" fill-opacity="0.24" stroke="#d97706" stroke-width="1.3"/>
    <text x="208" y="266.47" text-anchor="middle" class="sm bold">liabilities</text>
    <text x="208" y="282.47" text-anchor="middle" class="sm">980</text>
    <rect x="158" y="112" width="100" height="54.94" rx="5" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.3"/>
    <text x="208" y="135.47" text-anchor="middle" class="sm bold">equity</text>
    <text x="208" y="151.47" text-anchor="middle" class="sm">260</text>
    <line x1="262" y1="139.47" x2="288" y2="139.47" class="thin" stroke="#059669" stroke-width="1.6" marker-end="url(#ah059669)"/>
    <text x="275" y="131.47" text-anchor="middle" class="sm">−12</text>
    <rect x="292" y="114.54" width="38" height="52.4" rx="4" fill="#059669" fill-opacity="0.50" stroke="#059669" stroke-width="1.3"/>
    <text x="311" y="144.74" text-anchor="middle" class="sm bold">248</text>
    <text x="311" y="184.94" text-anchor="middle" class="sm">capital</text>
  </g>
</svg>
