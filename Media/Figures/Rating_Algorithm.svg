<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The ordered steps that turn a base rate into a quoted premium</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The order of operations is part of the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">filing</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Premium = [Base × ∏Rᵢ + ΣAⱼ](1 − D) + Fees</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">558 × 1.25 × 0.90 + 40 − 5% = $636</text>
  <rect x="46" y="118" width="190" height="30" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="56" y="138" text-anchor="start" class="sm">base rate</text>
  <text x="300" y="138" text-anchor="end" class="sm bold">558</text>
  <rect x="46" y="160" width="190" height="30" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="56" y="180" text-anchor="start" class="sm">× class 1.25</text>
  <text x="300" y="180" text-anchor="end" class="sm bold">698</text>
  <line x1="66" y1="148" x2="66" y2="160" class="thin" stroke="var(--dim)" stroke-width="1"/>
  <rect x="46" y="202" width="190" height="30" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="56" y="222" text-anchor="start" class="sm">× territory 0.90</text>
  <text x="300" y="222" text-anchor="end" class="sm bold">628</text>
  <line x1="66" y1="190" x2="66" y2="202" class="thin" stroke="var(--dim)" stroke-width="1"/>
  <rect x="46" y="244" width="190" height="30" rx="5" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.1"/>
  <text x="56" y="264" text-anchor="start" class="sm">+ endorsements</text>
  <text x="300" y="264" text-anchor="end" class="sm bold">668</text>
  <line x1="66" y1="232" x2="66" y2="244" class="thin" stroke="var(--dim)" stroke-width="1"/>
  <rect x="46" y="286" width="190" height="30" rx="5" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.1"/>
  <text x="56" y="306" text-anchor="start" class="sm">− discounts 5%</text>
  <text x="300" y="306" text-anchor="end" class="sm bold">634</text>
  <line x1="66" y1="274" x2="66" y2="286" class="thin" stroke="var(--dim)" stroke-width="1"/>
  <rect x="46" y="328" width="190" height="30" rx="5" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.1"/>
  <text x="56" y="348" text-anchor="start" class="sm">+ policy fee</text>
  <text x="300" y="348" text-anchor="end" class="sm bold">$636</text>
  <line x1="66" y1="316" x2="66" y2="328" class="thin" stroke="var(--dim)" stroke-width="1"/>
  <text x="180" y="390" text-anchor="middle" class="sm dim">multiply before adding — a reordered algorithm is a different rate</text>
</svg>
