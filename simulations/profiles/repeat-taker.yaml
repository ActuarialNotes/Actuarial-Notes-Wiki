# Failed FM once with a 5. Has seen everything, holds some confident
# misconceptions, reviews what he missed. Tests whether pages correct
# misconceptions rather than just introduce ideas.
name: Daniel (repeat test-taker)
exam: FM
description: >
  Failed his first FM sitting with a 5 (just under the pass mark). Studied from
  a commercial manual last time; strong on annuities and loans, weak on bonds
  and asset-liability management, and sure of a few things that are wrong.
prior_knowledge:
  calculus: comfortable
  algebra: comfortable
