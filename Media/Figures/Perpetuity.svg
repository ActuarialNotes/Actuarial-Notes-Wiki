  <text x="197" y="221.82" text-anchor="middle" class="sm bold" fill="#059669">1/i = 20</text>
  <line x1="74" y1="348" x2="330" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="348" x2="74" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="348" x2="74" y2="352" class="tick"/>
  <text x="74" y="364" text-anchor="middle" class="sm dim">0</text>
