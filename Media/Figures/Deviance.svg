<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Deviance as the gap between the fitted model's likelihood and the saturated model's</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Distance from a perfect fit</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">D = −2[ℓ(fitted) − ℓ(saturated)]</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">ΔD between nested models ~ χ²</text>
  <line x1="60" y1="327.29" x2="336" y2="327.29" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="344" x2="60" y2="100" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="56" y1="327.29" x2="60" y2="327.29" class="tick"/>
  <text x="52" y="330.89" text-anchor="end" class="sm dim">0</text>
  <line x1="56" y1="243.71" x2="60" y2="243.71" class="tick"/>
  <text x="52" y="247.31" text-anchor="end" class="sm dim">20</text>
  <line x1="56" y1="160.14" x2="60" y2="160.14" class="tick"/>
  <text x="52" y="163.74" text-anchor="end" class="sm dim">40</text>
  <text x="56" y="96" text-anchor="start" class="sm dim">deviance</text>
  <line x1="75.96" y1="327.29" x2="310.04" y2="327.29" class="thin" stroke="#059669" stroke-width="2.2"/>
  <text x="81.28" y="319.29" text-anchor="start" class="sm bold" fill="#059669">saturated model</text>
  <text x="304.72" y="319.29" text-anchor="end" class="sm dim">one parameter per row</text>
  <line x1="75.96" y1="198.59" x2="310.04" y2="198.59" class="thin" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="81.28" y="190.59" text-anchor="start" class="sm bold" fill="#3b82f6">fitted model</text>
  <text x="304.72" y="190.59" text-anchor="end" class="sm dim">D = 30.8</text>
  <line x1="75.96" y1="138.41" x2="310.04" y2="138.41" class="thin" stroke="var(--dim)" stroke-width="2.2"/>
  <text x="81.28" y="130.41" text-anchor="start" class="sm bold" fill="var(--dim)">null model</text>
  <text x="304.72" y="130.41" text-anchor="end" class="sm dim">intercept only</text>
  <line x1="193" y1="138.41" x2="193" y2="198.59" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="201" y="172.5" text-anchor="start" class="sm bold" fill="#e11d48">ΔD = 14.4 on 2 df</text>
</svg>
