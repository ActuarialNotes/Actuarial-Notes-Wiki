<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two identical risks with the same expected cost: one's premium stops at the cost line, the other's runs past it into an unfair excess</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="236" y1="106" x2="236" y2="376" class="thin dash" stroke="var(--dim)" stroke-width="1.4"/>
    <text x="236" y="96" text-anchor="middle" class="sm bold">same cost</text>
    <text x="167" y="162" text-anchor="middle" class="sm">premium</text>
    <circle cx="54" cy="172" r="10.8" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M34.8,220 V197.2 Q34.8,187.6 45.6,187.6 H62.4 Q73.2,187.6 73.2,197.2 V220 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="98" y="170" width="138" height="32" rx="4" fill="#3b82f6" fill-opacity="0.40" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="54" cy="306" r="10.8" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M34.8,354 V331.2 Q34.8,321.6 45.6,321.6 H62.4 Q73.2,321.6 73.2,331.2 V354 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="98" y="304" width="138" height="32" rx="4" fill="#3b82f6" fill-opacity="0.40" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="236" y="304" width="76" height="32" rx="4" fill="#e11d48" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.2"/>
    <text x="274" y="296" text-anchor="middle" class="sm bold">unfair</text>
  </g>
</svg>
