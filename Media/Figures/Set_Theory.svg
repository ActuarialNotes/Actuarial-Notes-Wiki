<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Union, intersection, complement and difference on Venn diagrams</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <clipPath id="clipA0"><circle cx="82.0" cy="136" r="36"/></clipPath>
    <clipPath id="clipA1"><circle cx="242.0" cy="136" r="36"/></clipPath>
    <clipPath id="clipA2"><circle cx="82.0" cy="284" r="36"/></clipPath>
    <clipPath id="clipA3"><circle cx="242.0" cy="284" r="36"/></clipPath>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Set operations are the language of</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">events</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">P(Aᶜ) = 1 − P(A)</text>
  <rect x="30" y="84" width="140" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="41" y="99" text-anchor="middle" class="sm dim">S</text>
  <g opacity="0.22" fill="#3b82f6"><circle cx="82.0" cy="136" r="36"/><circle cx="118.0" cy="136" r="36"/></g>
  <circle cx="82" cy="136" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="118" cy="136" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="56" y="108" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="144" y="108" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="100" y="210" text-anchor="middle" class="bold">A ∪ B</text>
  <rect x="190" y="84" width="140" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="201" y="99" text-anchor="middle" class="sm dim">S</text>
  <g clip-path="url(#clipA1)"><circle cx="278.0" cy="136" r="36" fill="#3b82f6" fill-opacity="0.3"/></g>
  <circle cx="242" cy="136" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="278" cy="136" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="216" y="108" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="304" y="108" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="260" y="210" text-anchor="middle" class="bold">A ∩ B</text>
  <rect x="30" y="232" width="140" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="41" y="247" text-anchor="middle" class="sm dim">S</text>
  <rect x="30" y="232" width="140" height="104" rx="7" fill="#3b82f6" fill-opacity="0.22"/>
  <circle cx="82" cy="284" r="36" fill="var(--soft)"/>
  <circle cx="82" cy="284" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="118" cy="284" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="56" y="256" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="144" y="256" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="100" y="358" text-anchor="middle" class="bold">Aᶜ</text>
  <rect x="190" y="232" width="140" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="201" y="247" text-anchor="middle" class="sm dim">S</text>
  <circle cx="242" cy="284" r="36" fill="#3b82f6" fill-opacity="0.22"/>
  <g clip-path="url(#clipA3)"><circle cx="278.0" cy="284" r="36" fill="var(--soft)"/></g>
  <circle cx="242" cy="284" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="278" cy="284" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="216" y="256" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="304" y="256" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="260" y="358" text-anchor="middle" class="bold">A \ B</text>
</svg>
