<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three Kolmogorov axioms shown as diagrams</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Kolmogorov's three axioms</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">P(⋃ Eᵢ) = Σ P(Eᵢ)  for disjoint Eᵢ</text>
  <rect x="26" y="74" width="308" height="92" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="180" y="152" text-anchor="middle" class="bold">P(S) = 1</text>
  <rect x="126" y="88" width="108" height="44" rx="6" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="180" y="116" text-anchor="middle" class="bold">S</text>
  <rect x="26" y="180" width="308" height="92" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="180" y="258" text-anchor="middle" class="bold">P(E) ≥ 0</text>
  <line x1="112" y1="226" x2="250" y2="226" class="axis"/>
  <line x1="181" y1="222" x2="181" y2="230" class="tick"/>
  <text x="181" y="242" text-anchor="middle" class="sm dim">0</text>
  <line x1="184" y1="214" x2="246" y2="214" class="thin" stroke="#059669" stroke-width="1.6" marker-end="url(#ah059669)"/>
  <line x1="178" y1="214" x2="116" y2="214" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
  <text x="147" y="208" text-anchor="middle" class="sm bold" fill="#e11d48">✗</text>
  <rect x="26" y="286" width="308" height="92" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="180" y="364" text-anchor="middle" class="bold">P(E₁ ∪ E₂) = P(E₁) + P(E₂)</text>
  <circle cx="146" cy="322" r="24" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="214" cy="322" r="24" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="146" y="327" text-anchor="middle" class="sm">E₁</text>
  <text x="214" y="327" text-anchor="middle" class="sm">E₂</text>
</svg>
