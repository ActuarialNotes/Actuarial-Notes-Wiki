<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An uncorrelated series and the flat correlogram it produces</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Uncorrelated, mean zero, constant</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">variance</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">ρ_k = 0 for every k ≥ 1</text>
  <rect x="54" y="100" width="270" height="90" rx="5" fill="var(--soft)" stroke="var(--edge)"/>
  <line x1="54" y1="145" x2="324" y2="145" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <polyline points="54,156.01 58.58,149.65 63.15,155.75 67.73,137.51 72.31,128.31 76.88,160.5 81.46,149.53 86.03,163.08 90.61,134.58 95.19,153.86 99.76,147.31 104.34,129.81 108.92,156.45 113.49,156.62 118.07,159.6 122.64,146.59 127.22,117.96 131.8,141.08 136.37,152.66 140.95,147.93 145.53,130.92 150.1,136.27 154.68,125.36 159.25,142.98 163.83,151.68 168.41,138.51 172.98,115.36 177.56,137.73 182.14,145.58 186.71,157.64 191.29,155.54 195.86,131.26 200.44,166.45 205.02,130.96 209.59,154.68 214.17,144.02 218.75,164.24 223.32,138.53 227.9,153.49 232.47,146.51 237.05,138.87 241.63,162.77 246.2,116.86 250.78,142.96 255.36,141.37 259.93,155.15 264.51,127.95 269.08,112.22 273.66,149.74 278.24,142.15 282.81,147.74 287.39,122.65 291.97,176.95 296.54,142.45 301.12,138.24 305.69,160.28 310.27,102.49 314.85,143.58 319.42,163.87 324,134.79" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="180" y="224" text-anchor="middle" class="sm bold" fill="#3b82f6">residual ACF</text>
  <line x1="62" y1="266.16" x2="324" y2="266.16" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
  <line x1="62" y1="287.84" x2="324" y2="287.84" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
  <line x1="62" y1="277" x2="324" y2="277" class="axis"/>
  <text x="55" y="323.46" text-anchor="end" class="sm dim">-1</text>
  <text x="55" y="280.6" text-anchor="end" class="sm dim">0</text>
  <text x="55" y="237.74" text-anchor="end" class="sm dim">1</text>
  <line x1="81.17" y1="277" x2="81.17" y2="274.43" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="81.17" cy="274.43" r="2.6" fill="#3b82f6"/>
  <line x1="113.12" y1="277" x2="113.12" y2="280.86" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="113.12" cy="280.86" r="2.6" fill="#3b82f6"/>
  <line x1="145.07" y1="277" x2="145.07" y2="275.71" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="145.07" cy="275.71" r="2.6" fill="#3b82f6"/>
  <line x1="177.02" y1="277" x2="177.02" y2="272.29" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="177.02" cy="272.29" r="2.6" fill="#3b82f6"/>
  <line x1="208.98" y1="277" x2="208.98" y2="279.14" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="208.98" cy="279.14" r="2.6" fill="#3b82f6"/>
  <line x1="240.93" y1="277" x2="240.93" y2="274" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="240.93" cy="274" r="2.6" fill="#3b82f6"/>
  <line x1="272.88" y1="277" x2="272.88" y2="277.86" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="272.88" cy="277.86" r="2.6" fill="#3b82f6"/>
  <line x1="304.83" y1="277" x2="304.83" y2="273.57" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="304.83" cy="273.57" r="2.6" fill="#3b82f6"/>
  <text x="180" y="346" text-anchor="middle" class="sm bold">every spike inside ±1.96/√n</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">what a fitted model's residuals must look like</text>
</svg>
