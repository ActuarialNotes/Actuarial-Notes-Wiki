<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Payments falling 5, 4, 3, 2, 1 with the increasing payments 1 to 5 stacked on top, so every column reaches the same height n + 1</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="58" y1="344" x2="318" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="340" x2="66" y2="348" class="tick"/>
    <text x="66" y="361" text-anchor="middle" class="sm dim">0</text>
    <line x1="112.8" y1="340" x2="112.8" y2="348" class="tick"/>
    <text x="112.8" y="361" text-anchor="middle" class="sm dim">1</text>
    <line x1="159.6" y1="340" x2="159.6" y2="348" class="tick"/>
    <text x="159.6" y="361" text-anchor="middle" class="sm dim">2</text>
    <line x1="206.4" y1="340" x2="206.4" y2="348" class="tick"/>
    <text x="206.4" y="361" text-anchor="middle" class="sm dim">3</text>
    <line x1="253.2" y1="340" x2="253.2" y2="348" class="tick"/>
    <text x="253.2" y="361" text-anchor="middle" class="sm dim">4</text>
    <line x1="300" y1="340" x2="300" y2="348" class="tick"/>
    <text x="300" y="361" text-anchor="middle" class="sm dim">5</text>
    <rect x="100.8" y="174" width="24" height="170" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <rect x="100.8" y="140" width="24" height="34" rx="2" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="112.8" y="194" text-anchor="middle" class="sm">5</text>
    <rect x="147.6" y="208" width="24" height="136" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <rect x="147.6" y="140" width="24" height="68" rx="2" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="159.6" y="228" text-anchor="middle" class="sm">4</text>
    <rect x="194.4" y="242" width="24" height="102" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <rect x="194.4" y="140" width="24" height="102" rx="2" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="206.4" y="262" text-anchor="middle" class="sm">3</text>
    <rect x="241.2" y="276" width="24" height="68" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <rect x="241.2" y="140" width="24" height="136" rx="2" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="253.2" y="296" text-anchor="middle" class="sm">2</text>
    <rect x="288" y="310" width="24" height="34" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <rect x="288" y="140" width="24" height="170" rx="2" fill="#3b82f6" fill-opacity="0.28"/>
    <text x="300" y="330" text-anchor="middle" class="sm">1</text>
    <line x1="96.8" y1="140" x2="316" y2="140" class="thin dash" stroke="#059669" stroke-width="1.4"/>
    <text x="316" y="132" text-anchor="end" class="sm bold">n + 1</text>
    <text x="95.8" y="263" text-anchor="end" class="sm bold">(Da)₍ₙ₎</text>
    <text x="95.8" y="161" text-anchor="end" class="sm bold">(Ia)₍ₙ₎</text>
  </g>
</svg>
