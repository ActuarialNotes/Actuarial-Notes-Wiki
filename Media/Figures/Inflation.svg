  <text x="81" y="95.6" text-anchor="start" class="sm">X′ = (1 + r) X</text>
  <text x="224.49" y="164.05" text-anchor="middle" class="sm dim">more mass now clears d</text>
  <text x="420" y="100" text-anchor="middle" class="sm bold">X′ = (1 + r) X</text>
