<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Aggregate losses as a staircase of randomly sized jumps</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A random number of random-sized claims</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">S(t) = X₁ + ⋯ + X_N(t)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[S] = λt·E[X],  Var(S) = λt·E[X²]</text>
  <line x1="68" y1="346" x2="336" y2="346" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="346" x2="68" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="346" x2="68" y2="350" class="tick"/>
  <text x="68" y="362" text-anchor="middle" class="sm dim">0</text>
  <line x1="154" y1="346" x2="154" y2="350" class="tick"/>
  <text x="154" y="362" text-anchor="middle" class="sm dim">4</text>
  <line x1="240" y1="346" x2="240" y2="350" class="tick"/>
  <text x="240" y="362" text-anchor="middle" class="sm dim">8</text>
  <line x1="326" y1="346" x2="326" y2="350" class="tick"/>
  <text x="326" y="362" text-anchor="middle" class="sm dim">12</text>
  <line x1="64" y1="346" x2="68" y2="346" class="tick"/>
  <text x="60" y="349.6" text-anchor="end" class="sm dim">0</text>
  <line x1="64" y1="269.08" x2="68" y2="269.08" class="tick"/>
  <text x="60" y="272.68" text-anchor="end" class="sm dim">4</text>
  <line x1="64" y1="192.15" x2="68" y2="192.15" class="tick"/>
  <text x="60" y="195.75" text-anchor="end" class="sm dim">8</text>
  <line x1="64" y1="115.23" x2="68" y2="115.23" class="tick"/>
  <text x="60" y="118.83" text-anchor="end" class="sm dim">12</text>
  <text x="326" y="378" text-anchor="end" class="sm dim">months</text>
  <text x="64" y="82" text-anchor="start" class="sm dim">S(t)  (000s)</text>
  <polyline points="68,346 91.65,346 91.65,319.08 123.9,319.08 123.9,259.46 154,259.46 154,244.08 192.7,244.08 192.7,201.77 227.1,201.77 227.1,180.62 261.5,180.62 261.5,115.23 300.2,115.23 300.2,97.92 326,97.92" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <line x1="78.65" y1="332.54" x2="78.65" y2="346" class="thin" stroke="#d97706" stroke-width="1.3" marker-end="url(#ahd97706)"/>
  <text x="74.65" y="330.54" text-anchor="end" class="sm" fill="#d97706">Xᵢ</text>
  <line x1="110.9" y1="289.27" x2="110.9" y2="319.08" class="thin" stroke="#d97706" stroke-width="1.3" marker-end="url(#ahd97706)"/>
  <text x="106.9" y="287.27" text-anchor="end" class="sm" fill="#d97706">Xᵢ</text>
  <line x1="141" y1="251.77" x2="141" y2="259.46" class="thin" stroke="#d97706" stroke-width="1.3" marker-end="url(#ahd97706)"/>
  <text x="137" y="249.77" text-anchor="end" class="sm" fill="#d97706">Xᵢ</text>
</svg>
