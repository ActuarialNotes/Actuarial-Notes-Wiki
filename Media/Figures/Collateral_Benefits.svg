<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three heads of a tort award as bars, the income and care heads each losing a red slice of accident benefits already paid, traced back to the benefits insurer</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="36" y="112" text-anchor="start" class="sm bold">income loss</text>
    <rect x="36" y="122" width="231" height="32" rx="3" fill="#3b82f6" fill-opacity="0.40"/>
    <rect x="177.75" y="122" width="89.25" height="32" rx="3" fill="#e11d48" fill-opacity="0.60"/>
    <text x="222.38" y="143" text-anchor="middle" class="sm">−$85k</text>
    <text x="275" y="143" text-anchor="start" class="sm dim">$220k</text>
    <text x="36" y="204" text-anchor="start" class="sm bold">future care</text>
    <rect x="36" y="214" width="136.5" height="32" rx="3" fill="#0d9488" fill-opacity="0.40"/>
    <rect x="130.5" y="214" width="42" height="32" rx="3" fill="#e11d48" fill-opacity="0.60"/>
    <text x="151.5" y="235" text-anchor="middle" class="sm">−$40k</text>
    <text x="180.5" y="235" text-anchor="start" class="sm dim">$130k</text>
    <text x="36" y="296" text-anchor="start" class="sm bold">non-pecuniary</text>
    <rect x="36" y="306" width="157.5" height="32" rx="3" fill="#d97706" fill-opacity="0.40"/>
    <text x="201.5" y="327" text-anchor="start" class="sm dim">$150k</text>
    <rect x="283.76" y="291" width="32.48" height="58" rx="2" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="290.14" y="297.96" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="302.9" y="297.96" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="290.14" y="309.56" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="302.9" y="309.56" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="290.14" y="321.16" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="302.9" y="321.16" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="290.14" y="332.76" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <rect x="302.9" y="332.76" width="6.96" height="5.8" fill="#e11d48" fill-opacity="0.55"/>
    <text x="300" y="372" text-anchor="middle" class="sm bold">benefits</text>
    <line x1="292" y1="286" x2="218" y2="158" class="thin dash" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ahe11d48)"/>
    <line x1="284" y1="292" x2="152" y2="250" class="thin dash" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ahe11d48)"/>
  </g>
</svg>
