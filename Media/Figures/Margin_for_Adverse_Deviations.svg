<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two liability columns on one baseline: the old Canadian best estimate topped by three prescribed margins — claims, reinsurance and interest — and the IFRS 17 column topped by a single risk adjustment that replaces them</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="100" y="192" width="82" height="160" rx="3" fill="#3b82f6" fill-opacity="0.5"/>
    <rect x="226" y="192" width="82" height="160" rx="3" fill="#3b82f6" fill-opacity="0.5"/>
    <text x="141" y="276" text-anchor="middle" class="sm">best estimate</text>
    <text x="267" y="276" text-anchor="middle" class="sm">best estimate</text>
    <rect x="100" y="170" width="82" height="22" rx="2" fill="#0d9488" fill-opacity="0.6"/>
    <text x="94" y="185" text-anchor="end" class="sm">interest</text>
    <line x1="184" y1="181" x2="224" y2="170" class="thin dash" stroke="#0d9488" stroke-width="1.3"/>
    <rect x="100" y="152" width="82" height="18" rx="2" fill="#d97706" fill-opacity="0.6"/>
    <text x="94" y="165" text-anchor="end" class="sm">reinsurance</text>
    <line x1="184" y1="161" x2="224" y2="170" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
    <rect x="100" y="126" width="82" height="26" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <text x="94" y="143" text-anchor="end" class="sm">claims</text>
    <line x1="184" y1="139" x2="224" y2="170" class="thin dash" stroke="#7c3aed" stroke-width="1.3"/>
    <rect x="226" y="148" width="82" height="44" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
    <text x="267" y="174" text-anchor="middle" class="bold">RA</text>
    <line x1="86" y1="352" x2="322" y2="352" class="axis"/>
    <text x="141" y="370" text-anchor="middle" class="sm dim">pre-2023</text>
    <text x="267" y="370" text-anchor="middle" class="sm dim">IFRS 17</text>
  </g>
</svg>
