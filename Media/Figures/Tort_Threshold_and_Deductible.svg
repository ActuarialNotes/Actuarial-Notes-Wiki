<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Four bodily injury awards against a verbal threshold and a $45,000 deductible</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The threshold truncates, the deductible</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">shifts</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Paid = max(0, damages − deductible)</text>
  <text x="180" y="100" text-anchor="middle" class="sm dim">assessed vs paid, deductible $45,000</text>
  <text x="44" y="132" text-anchor="start" class="sm">$40,000</text>
  <rect x="44" y="140" width="24" height="20" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
  <rect x="44" y="140" width="0" height="20" rx="3" fill="#e11d48" fill-opacity="0.65"/>
  <text x="76" y="155" text-anchor="start" class="sm" fill="#e11d48">$0</text>
  <text x="44" y="190" text-anchor="start" class="sm">$120,000</text>
  <rect x="44" y="198" width="72" height="20" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
  <rect x="44" y="198" width="45" height="20" rx="3" fill="#d97706" fill-opacity="0.65"/>
  <text x="124" y="213" text-anchor="start" class="sm" fill="#d97706">$75,000</text>
  <text x="44" y="248" text-anchor="start" class="sm">$350,000</text>
  <rect x="44" y="256" width="210" height="20" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
  <rect x="44" y="256" width="183" height="20" rx="3" fill="#059669" fill-opacity="0.65"/>
  <text x="262" y="271" text-anchor="start" class="sm" fill="#059669">$305,000</text>
  <line x1="71" y1="126" x2="71" y2="300" class="thin dash" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="75" y="314" text-anchor="start" class="sm" fill="#7c3aed">deductible</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">a claim that fails the threshold never gets</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">as far as the deductible — it is paid nothing</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">the deductible takes 100% from one and 13% from another</text>
</svg>
