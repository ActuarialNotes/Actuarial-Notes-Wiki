<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Four objects joined by every possible line between two of them — six lines, one for each unordered pair</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="112" y1="134" x2="248" y2="134" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="103.8" y1="153.8" x2="256.2" y2="306.2" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="162" x2="84" y2="298" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="276" y1="162" x2="276" y2="298" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="256.2" y1="153.8" x2="103.8" y2="306.2" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <line x1="248" y1="326" x2="112" y2="326" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <circle cx="84" cy="134" r="24" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="84" y="139" text-anchor="middle" class="bold">A</text>
    <circle cx="276" cy="134" r="24" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="276" y="139" text-anchor="middle" class="bold">B</text>
    <circle cx="276" cy="326" r="24" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="276" y="331" text-anchor="middle" class="bold">C</text>
    <circle cx="84" cy="326" r="24" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="84" y="331" text-anchor="middle" class="bold">D</text>
  </g>
</svg>
