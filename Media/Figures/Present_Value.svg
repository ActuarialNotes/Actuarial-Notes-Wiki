    <text x="181" y="110" text-anchor="middle" class="bold" fill="#d97706">× v⁵</text>
    <text x="56" y="378" text-anchor="middle" class="sm bold">PV</text>
    <text x="306" y="378" text-anchor="middle" class="sm bold">FV</text>
  </g>
</svg>
