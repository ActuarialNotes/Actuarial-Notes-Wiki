<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>Deductible, coinsurance and limit applied in order to a ground-up loss</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Policy provisions, applied in order</text>
  <polyline points="54,210 328,64" class="curve dash" stroke="var(--dim)" stroke-width="1.1"/>
  <text x="295.12" y="72.76" text-anchor="middle" class="sm dim">Y = X</text>
  <polyline points="54,210 108.8,210 245.8,151.6 328,151.6" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <line x1="54" y1="210" x2="338" y2="210" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="54" y1="210" x2="54" y2="54" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="108.8" y1="210" x2="108.8" y2="214" class="tick"/>
  <text x="108.8" y="226" text-anchor="middle" class="sm dim">d</text>
  <line x1="245.8" y1="210" x2="245.8" y2="214" class="tick"/>
  <text x="245.8" y="226" text-anchor="middle" class="sm dim">d + u/α</text>
  <line x1="50" y1="151.6" x2="54" y2="151.6" class="tick"/>
  <text x="46" y="155.2" text-anchor="end" class="sm dim">u</text>
  <text x="328" y="242" text-anchor="end" class="sm dim">loss X</text>
  <text x="50" y="50" text-anchor="start" class="sm dim">payment Y</text>
  <line x1="54" y1="151.6" x2="328" y2="151.6" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="108.8" y1="210" x2="108.8" y2="151.6" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="81.4" y="196.86" text-anchor="middle" class="sm dim">nothing</text>
  <text x="177.3" y="189.56" text-anchor="middle" class="sm">slope α</text>
  <text x="256.76" y="166.2" text-anchor="middle" class="sm dim">capped at u</text>
  <text x="420" y="92" text-anchor="middle" class="sm bold">Y = min( α (X − d)₊ , u )</text>
  <rect x="316" y="112" width="210" height="40" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="326" y="129" text-anchor="start" class="sm bold">1. Deductible d</text>
  <text x="326" y="144" text-anchor="start" class="sm dim">subtract d, floor at 0</text>
  <rect x="316" y="160" width="210" height="40" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="326" y="177" text-anchor="start" class="sm bold">2. Coinsurance α</text>
  <text x="326" y="192" text-anchor="start" class="sm dim">multiply the excess by α</text>
  <rect x="316" y="208" width="210" height="40" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="326" y="225" text-anchor="start" class="sm bold">3. Benefit limit u</text>
  <text x="326" y="240" text-anchor="start" class="sm dim">cap the result at u</text>
  <line x1="28" y1="264" x2="532" y2="264" class="rule"/>
  <text x="280" y="284" text-anchor="middle" class="sm dim">Provisions decide how the loss is split between insured and insurer</text>
</svg>
