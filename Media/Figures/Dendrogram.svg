<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Two adjacent leaves that fuse high, against a distant pair that fuses low</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Height, not left-right position, is</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">similarity</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">cut at height h ⇒ the clusters joined below h</text>
  <text x="76" y="318" text-anchor="middle" class="sm bold">B</text>
  <text x="132" y="318" text-anchor="middle" class="sm bold">A</text>
  <text x="200" y="318" text-anchor="middle" class="sm bold">C</text>
  <text x="268" y="318" text-anchor="middle" class="sm bold">D</text>
  <line x1="132" y1="300" x2="132" y2="234" class="thin" stroke="#059669" stroke-width="1.8"/>
  <line x1="200" y1="300" x2="200" y2="234" class="thin" stroke="#059669" stroke-width="1.8"/>
  <line x1="132" y1="234" x2="200" y2="234" class="thin" stroke="#059669" stroke-width="1.8"/>
  <text x="166" y="227" text-anchor="middle" class="sm bold" fill="#059669">A + C at 3</text>
  <line x1="166" y1="234" x2="166" y2="168" class="thin" stroke="#3b82f6" stroke-width="1.8"/>
  <line x1="268" y1="300" x2="268" y2="168" class="thin" stroke="#3b82f6" stroke-width="1.8"/>
  <line x1="166" y1="168" x2="268" y2="168" class="thin" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="217" y="161" text-anchor="middle" class="sm" fill="#3b82f6">+ D at 6</text>
  <line x1="76" y1="300" x2="76" y2="102" class="thin" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="217" y1="168" x2="217" y2="102" class="thin" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="76" y1="102" x2="217" y2="102" class="thin" stroke="#e11d48" stroke-width="1.8"/>
  <text x="146.5" y="94" text-anchor="middle" class="sm bold" fill="#e11d48">B joins only at 9</text>
  <line x1="52" y1="300" x2="320" y2="300" class="axis"/>
  <line x1="50" y1="300" x2="54" y2="300" class="tick"/>
  <text x="46" y="304" text-anchor="end" class="sm dim">0</text>
  <line x1="50" y1="234" x2="54" y2="234" class="tick"/>
  <text x="46" y="238" text-anchor="end" class="sm dim">3</text>
  <line x1="50" y1="168" x2="54" y2="168" class="tick"/>
  <text x="46" y="172" text-anchor="end" class="sm dim">6</text>
  <line x1="50" y1="102" x2="54" y2="102" class="tick"/>
  <text x="46" y="106" text-anchor="end" class="sm dim">9</text>
  <text x="180" y="346" text-anchor="middle" class="sm">A is drawn next to B, but fuses with C first</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">any branch may be flipped without changing the tree</text>
</svg>
