<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four layers of a risk appetite framework, from the board's statement down to the breach that escalates</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">The board's statement, made operational</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Appetite ≤ capacity</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">how much of what you could bear, you will</text>
    <rect x="30" y="96" width="300" height="46" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="180" y="116" text-anchor="middle" class="sm">Appetite statement</text>
    <text x="180" y="131" text-anchor="middle" class="sm dim">the board says what risk, and why</text>
    <rect x="30" y="152" width="300" height="46" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="172" text-anchor="middle" class="sm">Limits</text>
    <text x="180" y="187" text-anchor="middle" class="sm dim">PML as % of capital, single risk, targets</text>
    <line x1="180" y1="141" x2="180" y2="151" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="30" y="208" width="300" height="46" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.3"/>
    <text x="180" y="228" text-anchor="middle" class="sm">Tolerances</text>
    <text x="180" y="243" text-anchor="middle" class="sm dim">the breach point, and who is told</text>
    <line x1="180" y1="197" x2="180" y2="207" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="30" y="264" width="300" height="46" rx="6" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.3"/>
    <text x="180" y="284" text-anchor="middle" class="sm">Monitoring</text>
    <text x="180" y="299" text-anchor="middle" class="sm dim">measured, reported, and acted on</text>
    <line x1="180" y1="253" x2="180" y2="263" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <line x1="30" y1="326" x2="330" y2="326" class="rule"/>
    <text x="180" y="348" text-anchor="middle" class="sm dim">capacity is what you could bear before failing;</text>
    <text x="180" y="364" text-anchor="middle" class="sm dim">appetite is how much of it you choose to use</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">a framework that stops no transaction is decorative</text>
  </g>
</svg>
