<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A forward stepwise path: AIC falls as territory, vehicle age and driver age are added, then rises when prior claim is tried, so the path stops at driver age</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="112" y1="318.23" x2="320" y2="318.23" class="axis"/>
    <line x1="112" y1="90" x2="112" y2="348" class="axis"/>
    <line x1="156.86" y1="318.23" x2="156.86" y2="322.23" class="tick"/>
    <text x="156.86" y="334.23" text-anchor="middle" class="sm dim">4,100</text>
    <line x1="258.82" y1="318.23" x2="258.82" y2="322.23" class="tick"/>
    <text x="258.82" y="334.23" text-anchor="middle" class="sm dim">4,150</text>
    <text x="320" y="350.23" text-anchor="end" class="sm dim">AIC</text>
    <polyline points="303.69,119.77 220.08,169.38 160.94,219 126.27,268.62" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <polyline points="126.27,268.62 134.43,318.23" class="curve dash" stroke="var(--dim)" stroke-width="1.6"/>
    <circle cx="303.69" cy="119.77" r="4" fill="#3b82f6"/>
    <text x="104" y="123.77" text-anchor="end" class="sm">intercept</text>
    <circle cx="220.08" cy="169.38" r="4" fill="#3b82f6"/>
    <text x="104" y="173.38" text-anchor="end" class="sm">+ territory</text>
    <circle cx="160.94" cy="219" r="4" fill="#3b82f6"/>
    <text x="104" y="223" text-anchor="end" class="sm">+ vehicle age</text>
    <circle cx="126.27" cy="268.62" r="6" fill="#059669"/>
    <text x="104" y="272.62" text-anchor="end" class="sm">+ driver age</text>
    <circle cx="134.43" cy="318.23" r="4" fill="var(--dim)"/>
    <text x="104" y="322.23" text-anchor="end" class="sm">+ prior claim</text>
    <line x1="126.27" y1="348" x2="126.27" y2="268.62" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  </g>
</svg>
