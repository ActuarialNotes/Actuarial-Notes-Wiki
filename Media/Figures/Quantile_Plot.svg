    <line x1="97.7" y1="348" x2="97.7" y2="352" class="tick"/>
    <text x="97.7" y="364" text-anchor="middle" class="sm dim">1</text>
    <line x1="145.85" y1="348" x2="145.85" y2="352" class="tick"/>
    <text x="145.85" y="364" text-anchor="middle" class="sm dim">2</text>
