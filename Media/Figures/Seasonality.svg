<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two quarterly series on one axis, each repeating every four quarters: an additive one whose swing stays constant between parallel envelopes and a multiplicative one whose swing widens with its level</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="40" y1="368" x2="328" y2="368" class="axis"/>
    <polyline points="40,317.67 328,203.59" class="curve dash" stroke="#3b82f6" stroke-width="1.1"/>
    <polyline points="40,345.22 328,231.14" class="curve dash" stroke="#3b82f6" stroke-width="1.1"/>
    <polyline points="40,224.78 328,88.46" class="curve dash" stroke="#7c3aed" stroke-width="1.1"/>
    <polyline points="40,277.02 328,177.78" class="curve dash" stroke="#7c3aed" stroke-width="1.1"/>
    <polyline points="40,344.12 50.67,325.57 61.33,309.22 72,332.55 82.67,327.22 93.33,308.67 104,292.32 114.67,315.65 125.33,310.32 136,291.77 146.67,275.42 157.33,298.75 168,293.42 178.67,274.86 189.33,258.52 200,281.85 210.67,276.52 221.33,257.96 232,241.62 242.67,264.95 253.33,259.62 264,241.06 274.67,224.72 285.33,248.04 296,242.72 306.67,224.16 317.33,207.81 328,231.14" class="curve" stroke="#3b82f6" stroke-width="1.9"/>
    <polyline points="40,274.93 50.67,243.32 61.33,214.69 72,266 82.67,260.01 93.33,225.55 104,194.49 114.67,251.29 125.33,245.09 136,207.77 146.67,174.29 157.33,236.59 168,230.16 178.67,189.99 189.33,154.1 200,221.89 210.67,215.24 221.33,172.21 232,133.9 242.67,207.18 253.33,200.32 264,154.43 274.67,113.71 285.33,192.48 296,185.4 306.67,136.65 317.33,93.51 328,177.78" class="curve" stroke="#7c3aed" stroke-width="1.9"/>
    <text x="40" y="155.14" text-anchor="start" class="sm bold">multiplicative</text>
    <text x="328" y="249.14" text-anchor="end" class="sm bold">additive</text>
    <path d="M61.33,340.32 v4.2 H77.67 q5,0 5,3.85 q0,-3.85 5,-3.85 H104 v-4.2" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="82.67" y="358.32" text-anchor="middle" class="sm bold">s = 4</text>
  </g>
</svg>
