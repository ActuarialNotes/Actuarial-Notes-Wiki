  <line x1="68" y1="98" x2="68" y2="326" class="grid"/>
  <line x1="152" y1="98" x2="152" y2="326" class="grid"/>
  <line x1="236" y1="98" x2="236" y2="326" class="grid"/>
  <line x1="320" y1="98" x2="320" y2="326" class="grid"/>
  <line x1="68" y1="326" x2="320" y2="326" class="grid"/>
  <line x1="68" y1="222.36" x2="320" y2="222.36" class="grid"/>
  <line x1="68" y1="118.73" x2="320" y2="118.73" class="grid"/>
  <line x1="68" y1="326" x2="330" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="326" x2="68" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="326" x2="68" y2="330" class="tick"/>
  <text x="68" y="342" text-anchor="middle" class="sm dim">0</text>
  <line x1="152" y1="326" x2="152" y2="330" class="tick"/>
  <text x="152" y="342" text-anchor="middle" class="sm dim">4</text>
  <line x1="236" y1="326" x2="236" y2="330" class="tick"/>
  <text x="236" y="342" text-anchor="middle" class="sm dim">8</text>
  <line x1="320" y1="326" x2="320" y2="330" class="tick"/>
  <text x="320" y="342" text-anchor="middle" class="sm dim">12</text>
  <line x1="64" y1="326" x2="68" y2="326" class="tick"/>
  <text x="60" y="329.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="64" y1="222.36" x2="68" y2="222.36" class="tick"/>
  <text x="60" y="225.96" text-anchor="end" class="sm dim">50%</text>
  <line x1="64" y1="118.73" x2="68" y2="118.73" class="tick"/>
  <text x="60" y="122.33" text-anchor="end" class="sm dim">100%</text>
  <polyline points="68,118.73 320,326" class="curve" stroke="#d97706" stroke-width="2.4"/>
  <circle cx="236" cy="256.91" r="3.6" fill="#e11d48"/>
  <text x="244" y="250.91" text-anchor="start" class="sm bold" fill="#e11d48">$200 unearned</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">months into a $600 annual policy</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">cancel today and $200 goes back —</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the reserve is an obligation, not income</text>
</svg>
