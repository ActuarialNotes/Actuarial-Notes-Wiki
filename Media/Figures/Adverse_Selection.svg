<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The death spiral — pricing at the average drives the good risks out, and the average rises behind them</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Price the average and the average moves</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">E[loss | buys] &gt; E[loss | population]</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the buyer knows what the seller does not</text>
  <line x1="68" y1="252" x2="332" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="252" x2="68" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <polyline points="68,204 110.33,197.6 152.67,188 195,173.6 237.33,152.8 279.67,124 322,92" class="curve" stroke="#e11d48" stroke-width="2.6"/>
  <polyline points="68,98.4 110.33,120.8 152.67,146.4 195,172 237.33,197.6 279.67,220 322,236" class="curve" stroke="#3b82f6" stroke-width="2.6"/>
  <text x="254.27" y="111.2" text-anchor="middle" class="sm bold" fill="#e11d48">price</text>
  <text x="254.27" y="210.4" text-anchor="middle" class="sm bold" fill="#3b82f6">insureds</text>
  <text x="180" y="274" text-anchor="middle" class="sm dim">rounds of repricing — each loses the best risk</text>
  <line x1="30" y1="292" x2="330" y2="292" class="rule"/>
  <text x="38" y="314" text-anchor="start" class="sm" fill="#059669">•</text>
  <text x="54" y="314" text-anchor="start" class="sm">defences: classification, underwriting,</text>
  <text x="38" y="338" text-anchor="start" class="sm" fill="#059669">•</text>
  <text x="54" y="338" text-anchor="start" class="sm">waiting periods, compulsory participation</text>
  <text x="38" y="362" text-anchor="start" class="sm" fill="#059669">•</text>
  <text x="54" y="362" text-anchor="start" class="sm">and every classification restriction puts</text>
  <text x="38" y="386" text-anchor="start" class="sm" fill="#059669">•</text>
  <text x="54" y="386" text-anchor="start" class="sm">a little of the spiral back</text>
</svg>
