<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Raw group deviations shrunk toward zero by a random effect</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Random effects are drawn from a</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">distribution</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">b ~ N(0, D)</text>
  <line x1="64" y1="282.04" x2="324" y2="282.04" class="grid"/>
  <line x1="64" y1="218.37" x2="324" y2="218.37" class="grid"/>
  <line x1="64" y1="154.69" x2="324" y2="154.69" class="grid"/>
  <line x1="64" y1="218.37" x2="324" y2="218.37" class="axis"/>
  <line x1="64" y1="108" x2="64" y2="316" class="axis"/>
  <line x1="60" y1="282.04" x2="64" y2="282.04" class="tick"/>
  <text x="56" y="285.64" text-anchor="end" class="sm dim">-0.3</text>
  <line x1="60" y1="218.37" x2="64" y2="218.37" class="tick"/>
  <text x="56" y="221.97" text-anchor="end" class="sm dim">0</text>
  <line x1="60" y1="154.69" x2="64" y2="154.69" class="tick"/>
  <text x="56" y="158.29" text-anchor="end" class="sm dim">0.3</text>
  <text x="97.7" y="333" text-anchor="middle" class="sm dim">T1</text>
  <text x="145.85" y="333" text-anchor="middle" class="sm dim">T2</text>
  <text x="194" y="333" text-anchor="middle" class="sm dim">T3</text>
  <text x="242.15" y="333" text-anchor="middle" class="sm dim">T4</text>
  <text x="290.3" y="333" text-anchor="middle" class="sm dim">T5</text>
  <circle cx="90.7" cy="273.55" r="3.6" fill="var(--dim)"/>
  <circle cx="104.7" cy="237.68" r="3.8" fill="#3b82f6"/>
  <line x1="94.7" y1="273.55" x2="101.3" y2="237.68" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
  <circle cx="138.85" cy="241.71" r="3.6" fill="var(--dim)"/>
  <circle cx="152.85" cy="235.18" r="3.8" fill="#3b82f6"/>
  <line x1="142.85" y1="241.71" x2="149.45" y2="235.18" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
  <circle cx="187" cy="214.12" r="3.6" fill="var(--dim)"/>
  <circle cx="201" cy="216.03" r="3.8" fill="#3b82f6"/>
  <line x1="191" y1="214.12" x2="197.6" y2="216.03" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
  <circle cx="235.15" cy="188.65" r="3.6" fill="var(--dim)"/>
  <circle cx="249.15" cy="192.81" r="3.8" fill="#3b82f6"/>
  <line x1="239.15" y1="188.65" x2="245.75" y2="192.81" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
  <circle cx="283.3" cy="154.69" r="3.6" fill="var(--dim)"/>
  <circle cx="297.3" cy="187.8" r="3.8" fill="#3b82f6"/>
  <line x1="287.3" y1="154.69" x2="293.9" y2="187.8" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="218.37" x2="324" y2="218.37" class="thin" stroke="var(--axis)" stroke-width="1.3"/>
  <line x1="64" y1="316" x2="324" y2="316" class="rule"/>
  <line x1="52" y1="78" x2="65" y2="78" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="71" y="81.6" text-anchor="start" class="sm">raw</text>
  <line x1="156" y1="78" x2="169" y2="78" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="175" y="81.6" text-anchor="start" class="sm">predicted b̂</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">every group is pulled toward 0 —</text>
  <text x="180" y="371" text-anchor="middle" class="sm dim">the thin ones furthest</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">5 levels cost one variance, σ²_b</text>
</svg>
