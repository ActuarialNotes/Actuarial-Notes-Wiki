<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A three-by-three lattice of points (x, y), each carrying a disc whose area is the probability of that pair</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="114" y1="94" x2="114" y2="346" class="grid"/>
    <line x1="72" y1="304" x2="324" y2="304" class="grid"/>
    <line x1="114" y1="346" x2="114" y2="350" class="tick"/>
    <text x="114" y="362" text-anchor="middle" class="sm dim">0</text>
    <line x1="68" y1="304" x2="72" y2="304" class="tick"/>
    <text x="64" y="308" text-anchor="end" class="sm dim">0</text>
    <line x1="198" y1="94" x2="198" y2="346" class="grid"/>
    <line x1="72" y1="220" x2="324" y2="220" class="grid"/>
    <line x1="198" y1="346" x2="198" y2="350" class="tick"/>
    <text x="198" y="362" text-anchor="middle" class="sm dim">1</text>
    <line x1="68" y1="220" x2="72" y2="220" class="tick"/>
    <text x="64" y="224" text-anchor="end" class="sm dim">1</text>
    <line x1="282" y1="94" x2="282" y2="346" class="grid"/>
    <line x1="72" y1="136" x2="324" y2="136" class="grid"/>
    <line x1="282" y1="346" x2="282" y2="350" class="tick"/>
    <text x="282" y="362" text-anchor="middle" class="sm dim">2</text>
    <line x1="68" y1="136" x2="72" y2="136" class="tick"/>
    <text x="64" y="140" text-anchor="end" class="sm dim">2</text>
    <line x1="72" y1="346" x2="336" y2="346" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="346" x2="72" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <text x="340" y="350" text-anchor="start" class="sm dim">x</text>
    <text x="66" y="78" text-anchor="end" class="sm dim">y</text>
    <circle cx="114" cy="304" r="24.94" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="114" cy="220" r="22.31" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="114" cy="136" r="11.15" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="198" cy="304" r="19.32" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="198" cy="220" r="35.27" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="198" cy="136" r="29.51" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="282" cy="304" r="15.77" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="282" cy="220" r="27.32" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="282" cy="136" r="38.64" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
  </g>
</svg>
