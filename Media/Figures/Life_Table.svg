<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The ℓx column falling from 8,000 at age 60 to 7,170 at 64, with the deaths dx drawn as the drop between ages</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="50" y1="344" x2="336" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="50" y1="344" x2="50" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="344" x2="68" y2="348" class="tick"/>
    <text x="68" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="128" y1="344" x2="128" y2="348" class="tick"/>
    <text x="128" y="360" text-anchor="middle" class="sm dim">61</text>
    <line x1="188" y1="344" x2="188" y2="348" class="tick"/>
    <text x="188" y="360" text-anchor="middle" class="sm dim">62</text>
    <line x1="248" y1="344" x2="248" y2="348" class="tick"/>
    <text x="248" y="360" text-anchor="middle" class="sm dim">63</text>
    <line x1="308" y1="344" x2="308" y2="348" class="tick"/>
    <text x="308" y="360" text-anchor="middle" class="sm dim">64</text>
    <text x="326" y="376" text-anchor="end" class="sm dim">age x</text>
    <text x="46" y="82" text-anchor="start" class="sm dim">ℓx</text>
    <polyline points="68,143.69 128,174.22 188,210.46 248,252.43 308,302.03" class="curve" stroke="#3b82f6" stroke-width="2.2"/>
    <circle cx="68" cy="143.69" r="3.4" fill="#3b82f6"/>
    <text x="62" y="160.69" text-anchor="middle" class="sm">8,000</text>
    <circle cx="128" cy="174.22" r="3.4" fill="#3b82f6"/>
    <text x="122" y="191.22" text-anchor="middle" class="sm">7,840</text>
    <circle cx="188" cy="210.46" r="3.4" fill="#3b82f6"/>
    <text x="182" y="227.46" text-anchor="middle" class="sm">7,650</text>
    <circle cx="248" cy="252.43" r="3.4" fill="#3b82f6"/>
    <text x="242" y="269.43" text-anchor="middle" class="sm">7,430</text>
    <circle cx="308" cy="302.03" r="3.4" fill="#3b82f6"/>
    <text x="302" y="319.03" text-anchor="middle" class="sm">7,170</text>
    <line x1="128" y1="143.69" x2="128" y2="177.22" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
    <line x1="68" y1="143.69" x2="128" y2="143.69" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <line x1="188" y1="174.22" x2="188" y2="213.46" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
    <line x1="128" y1="174.22" x2="188" y2="174.22" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <line x1="248" y1="210.46" x2="248" y2="255.43" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
    <line x1="188" y1="210.46" x2="248" y2="210.46" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <line x1="308" y1="252.43" x2="308" y2="305.03" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
    <line x1="248" y1="252.43" x2="308" y2="252.43" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <text x="134" y="162.95" text-anchor="start" class="sm bold">d₆₀</text>
  </g>
</svg>
