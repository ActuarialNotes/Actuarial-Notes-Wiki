<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <title>The joint CDF as the probability mass in the lower-left quadrant</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The joint CDF accumulates over a lower-left quadrant</text>
  <rect x="76" y="76" width="168" height="168" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <rect x="76" y="146.56" width="104.16" height="97.44" fill="#3b82f6" fill-opacity="0.22"/>
  <line x1="180.16" y1="76" x2="180.16" y2="244" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="76" y1="146.56" x2="244" y2="146.56" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="76" y1="244" x2="260" y2="244" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="244" x2="76" y2="64" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="180.16" y="262" text-anchor="middle" class="sm dim">x</text>
  <text x="66" y="150.56" text-anchor="end" class="sm dim">y</text>
  <text x="128.08" y="199.28" text-anchor="middle" class="sm bold" fill="#3b82f6">F(x, y)</text>
  <text x="160" y="284" text-anchor="middle" class="sm dim">P(X ≤ x and Y ≤ y)</text>
  <line x1="310" y1="86" x2="310" y2="120" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="320" y="99" text-anchor="start" class="sm bold">F(x, y) = P(X ≤ x, Y ≤ y)</text>
  <text x="320" y="115" text-anchor="start" class="sm dim">non-decreasing in each argument</text>
  <line x1="310" y1="136" x2="310" y2="170" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <text x="320" y="149" text-anchor="start" class="sm bold">F(−∞, y) = F(x, −∞) = 0</text>
  <text x="320" y="165" text-anchor="start" class="sm dim">and F(∞, ∞) = 1</text>
  <line x1="310" y1="186" x2="310" y2="220" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="320" y="199" text-anchor="start" class="sm bold">f(x, y) = ∂²F / ∂x∂y</text>
  <text x="320" y="215" text-anchor="start" class="sm dim">differentiate twice to get back</text>
  <line x1="310" y1="236" x2="310" y2="270" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="320" y="249" text-anchor="start" class="sm bold">F(x, y) = F_X(x) F_Y(y)</text>
  <text x="320" y="265" text-anchor="start" class="sm dim">exactly when X and Y are independent</text>
</svg>
