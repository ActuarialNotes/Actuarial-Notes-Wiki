<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three bodily injury awards of $40,000, $120,000 and $350,000 cut by a dashed $45,000 deductible line to $0, $75,000 and $305,000 paid</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="40" y="128" text-anchor="start" class="sm dim">$40,000</text>
    <line x1="67.9" y1="132" x2="67.9" y2="174" class="thin dash" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="40" y="138" width="24.8" height="30" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <rect x="67.9" y="138" width="0" height="30" rx="3" fill="#e11d48" fill-opacity="0.65"/>
    <text x="72.8" y="158" text-anchor="start" class="sm bold">$0</text>
    <text x="40" y="220" text-anchor="start" class="sm dim">$120,000</text>
    <line x1="67.9" y1="224" x2="67.9" y2="266" class="thin dash" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="40" y="230" width="74.4" height="30" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <rect x="67.9" y="230" width="46.5" height="30" rx="3" fill="#d97706" fill-opacity="0.65"/>
    <text x="122.4" y="250" text-anchor="start" class="sm bold">$75,000</text>
    <text x="40" y="312" text-anchor="start" class="sm dim">$350,000</text>
    <line x1="67.9" y1="316" x2="67.9" y2="358" class="thin dash" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="40" y="322" width="217" height="30" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <rect x="67.9" y="322" width="189.1" height="30" rx="3" fill="#059669" fill-opacity="0.65"/>
    <text x="265" y="342" text-anchor="start" class="sm bold">$305,000</text>
    <line x1="67.9" y1="358" x2="67.9" y2="368" class="thin dash" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="67.9" y="382" text-anchor="middle" class="sm bold">deductible</text>
  </g>
</svg>
