    <text x="180" y="31" text-anchor="middle" class="ttl">A cap turns severity into a spike and a</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">tail</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
