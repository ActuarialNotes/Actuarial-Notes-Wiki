<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The a priori loss ratio derived from the triangle's own used-up premium</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Bornhuetter-Ferguson with the ELR taken</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">from the data</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ELR = Σ C_i / Σ (EP_i / CDF_i)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">9,524 / 14,387 = 66.2%</text>
  <text x="180" y="110" text-anchor="middle" class="sm dim">used-up premium: EP ÷ CDF ($000)</text>
  <text x="52" y="140" text-anchor="start" class="sm dim">2020</text>
  <text x="140" y="140" text-anchor="end" class="sm">3,000</text>
  <text x="206" y="140" text-anchor="end" class="sm dim">÷ 1.010</text>
  <text x="272" y="140" text-anchor="end" class="sm">2,970</text>
  <text x="312" y="140" text-anchor="end" class="sm dim">1,882</text>
  <text x="52" y="170" text-anchor="start" class="sm dim">2021</text>
  <text x="140" y="170" text-anchor="end" class="sm">3,200</text>
  <text x="206" y="170" text-anchor="end" class="sm dim">÷ 1.030</text>
  <text x="272" y="170" text-anchor="end" class="sm">3,106</text>
  <text x="312" y="170" text-anchor="end" class="sm dim">2,029</text>
  <text x="52" y="200" text-anchor="start" class="sm dim">2022</text>
  <text x="140" y="200" text-anchor="end" class="sm">3,500</text>
  <text x="206" y="200" text-anchor="end" class="sm dim">÷ 1.092</text>
  <text x="272" y="200" text-anchor="end" class="sm">3,205</text>
  <text x="312" y="200" text-anchor="end" class="sm dim">2,088</text>
  <text x="52" y="230" text-anchor="start" class="sm dim">2023</text>
  <text x="140" y="230" text-anchor="end" class="sm">3,800</text>
  <text x="206" y="230" text-anchor="end" class="sm dim">÷ 1.267</text>
  <text x="272" y="230" text-anchor="end" class="sm">3,000</text>
  <text x="312" y="230" text-anchor="end" class="sm dim">2,025</text>
  <text x="52" y="260" text-anchor="start" class="sm dim">2024</text>
  <text x="140" y="260" text-anchor="end" class="sm">4,000</text>
  <text x="206" y="260" text-anchor="end" class="sm dim">÷ 1.900</text>
  <text x="272" y="260" text-anchor="end" class="sm">2,105</text>
  <text x="312" y="260" text-anchor="end" class="sm dim">1,500</text>
  <line x1="46" y1="300" x2="314" y2="300" class="rule"/>
  <text x="272" y="322" text-anchor="end" class="sm bold">14,387</text>
  <text x="312" y="322" text-anchor="end" class="sm bold">9,524</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">an ELR that reflects this book's own rate level</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">and mix — no external assumption to go stale</text>
</svg>
