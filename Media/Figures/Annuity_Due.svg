<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" width="560" height="296" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="294.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">An annuity-due pays at the start of each period</text>
  <line x1="160" y1="104" x2="442" y2="104" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="168" y1="100" x2="168" y2="108" class="tick"/>
  <text x="168" y="121" text-anchor="middle" class="sm dim">0</text>
  <line x1="219.2" y1="100" x2="219.2" y2="108" class="tick"/>
  <text x="219.2" y="121" text-anchor="middle" class="sm dim">1</text>
  <line x1="270.4" y1="100" x2="270.4" y2="108" class="tick"/>
  <text x="270.4" y="121" text-anchor="middle" class="sm dim">2</text>
  <line x1="321.6" y1="100" x2="321.6" y2="108" class="tick"/>
  <text x="321.6" y="121" text-anchor="middle" class="sm dim">3</text>
  <line x1="372.8" y1="100" x2="372.8" y2="108" class="tick"/>
  <text x="372.8" y="121" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="100" x2="424" y2="108" class="tick"/>
  <text x="424" y="121" text-anchor="middle" class="sm dim">5</text>
  <text x="152" y="108" text-anchor="end" class="sm bold" fill="var(--dim)">Annuity-immediate</text>
  <line x1="219.2" y1="104" x2="219.2" y2="72" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="219.2" y="66" text-anchor="middle" class="sm">1</text>
  <line x1="270.4" y1="104" x2="270.4" y2="72" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="270.4" y="66" text-anchor="middle" class="sm">1</text>
  <line x1="321.6" y1="104" x2="321.6" y2="72" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="321.6" y="66" text-anchor="middle" class="sm">1</text>
  <line x1="372.8" y1="104" x2="372.8" y2="72" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="372.8" y="66" text-anchor="middle" class="sm">1</text>
  <line x1="424" y1="104" x2="424" y2="72" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="424" y="66" text-anchor="middle" class="sm">1</text>
  <text x="444" y="108" text-anchor="start" class="sm bold" fill="var(--dim)">a₍ₙ₎</text>
  <line x1="160" y1="188" x2="442" y2="188" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="168" y1="184" x2="168" y2="192" class="tick"/>
  <text x="168" y="205" text-anchor="middle" class="sm dim">0</text>
  <line x1="219.2" y1="184" x2="219.2" y2="192" class="tick"/>
  <text x="219.2" y="205" text-anchor="middle" class="sm dim">1</text>
  <line x1="270.4" y1="184" x2="270.4" y2="192" class="tick"/>
  <text x="270.4" y="205" text-anchor="middle" class="sm dim">2</text>
  <line x1="321.6" y1="184" x2="321.6" y2="192" class="tick"/>
  <text x="321.6" y="205" text-anchor="middle" class="sm dim">3</text>
  <line x1="372.8" y1="184" x2="372.8" y2="192" class="tick"/>
  <text x="372.8" y="205" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="184" x2="424" y2="192" class="tick"/>
  <text x="424" y="205" text-anchor="middle" class="sm dim">5</text>
  <text x="152" y="192" text-anchor="end" class="sm bold" fill="#7c3aed">Annuity-due</text>
  <line x1="168" y1="188" x2="168" y2="156" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <text x="168" y="150" text-anchor="middle" class="sm">1</text>
  <line x1="219.2" y1="188" x2="219.2" y2="156" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <text x="219.2" y="150" text-anchor="middle" class="sm">1</text>
  <line x1="270.4" y1="188" x2="270.4" y2="156" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <text x="270.4" y="150" text-anchor="middle" class="sm">1</text>
  <line x1="321.6" y1="188" x2="321.6" y2="156" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <text x="321.6" y="150" text-anchor="middle" class="sm">1</text>
  <line x1="372.8" y1="188" x2="372.8" y2="156" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <text x="372.8" y="150" text-anchor="middle" class="sm">1</text>
  <text x="444" y="192" text-anchor="start" class="sm bold" fill="#7c3aed">ä₍ₙ₎</text>
  <line x1="228" y1="212" x2="176" y2="212" class="thin" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah7c3aed)"/>
  <text x="238" y="216" text-anchor="start" class="sm" fill="#7c3aed">every payment moves one period earlier</text>
  <line x1="28" y1="234" x2="532" y2="234" class="rule"/>
  <text x="150" y="256" text-anchor="middle" class="sm bold">ä₍ₙ₎ = (1 + i) a₍ₙ₎ = (1 − vⁿ)/d</text>
  <text x="150" y="276" text-anchor="middle" class="sm dim">s̈₍ₙ₎ = (1 + i) s₍ₙ₎</text>
  <text x="412" y="256" text-anchor="middle" class="sm bold">Where it shows up</text>
  <text x="412" y="276" text-anchor="middle" class="sm dim">leases, premiums, rent paid in advance</text>
</svg>
