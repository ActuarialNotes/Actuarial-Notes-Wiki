<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A non-callable bond has no uncertainty about when it ends</text>
  <line x1="96" y1="124" x2="442" y2="124" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="104" y1="120" x2="104" y2="128" class="tick"/>
  <text x="104" y="141" text-anchor="middle" class="sm dim">0</text>
  <line x1="144" y1="120" x2="144" y2="128" class="tick"/>
  <text x="144" y="141" text-anchor="middle" class="sm dim">1</text>
  <line x1="184" y1="120" x2="184" y2="128" class="tick"/>
  <text x="184" y="141" text-anchor="middle" class="sm dim">2</text>
  <line x1="224" y1="120" x2="224" y2="128" class="tick"/>
  <text x="224" y="141" text-anchor="middle" class="sm dim">…</text>
  <line x1="264" y1="120" x2="264" y2="128" class="tick"/>
  <line x1="304" y1="120" x2="304" y2="128" class="tick"/>
  <line x1="344" y1="120" x2="344" y2="128" class="tick"/>
  <line x1="384" y1="120" x2="384" y2="128" class="tick"/>
  <text x="384" y="141" text-anchor="middle" class="sm dim">7</text>
  <line x1="424" y1="120" x2="424" y2="128" class="tick"/>
  <text x="424" y="141" text-anchor="middle" class="sm dim">n</text>
  <line x1="144" y1="124" x2="144" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="144" y="90" text-anchor="middle" class="sm">Fr</text>
  <line x1="184" y1="124" x2="184" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="224" y1="124" x2="224" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="264" y1="124" x2="264" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="304" y1="124" x2="304" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="344" y1="124" x2="344" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="384" y1="124" x2="384" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="424" y1="124" x2="424" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="424" y1="124" x2="424" y2="66" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="424" y="60" text-anchor="middle" class="sm">C</text>
  <text x="444" y="66" text-anchor="start" class="sm bold" fill="#059669">certain</text>
  <line x1="28" y1="194" x2="532" y2="194" class="rule"/>
  <text x="150" y="216" text-anchor="middle" class="sm bold">P = Fr · a₍ₙ₎ⱼ + C · vⁿ</text>
  <text x="150" y="236" text-anchor="middle" class="sm dim">one term, one price, no cases</text>
  <text x="150" y="256" text-anchor="middle" class="sm dim">also called a bullet bond</text>
  <text x="412" y="216" text-anchor="middle" class="sm bold">No call risk</text>
  <text x="412" y="236" text-anchor="middle" class="sm dim">the schedule cannot be cut short</text>
  <text x="412" y="256" text-anchor="middle" class="sm dim">the baseline case for every bond formula</text>
  <text x="280" y="280" text-anchor="middle" class="sm dim">Compare with a callable bond, where n itself is uncertain</text>
</svg>
