<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The five principles of Canadian workers' compensation, and what each is under pressure from</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Five principles, one bargain, 1913</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">The worker's tort action, traded for</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">a guaranteed benefit the employers fund</text>
    <rect x="40" y="100" width="280" height="32" rx="6" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.2"/>
    <text x="180" y="121" text-anchor="middle" class="sm">1. No-fault compensation</text>
    <rect x="40" y="140" width="280" height="32" rx="6" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.2"/>
    <text x="180" y="161" text-anchor="middle" class="sm">2. Collective liability</text>
    <rect x="40" y="180" width="280" height="32" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="180" y="201" text-anchor="middle" class="sm">3. Security of payment</text>
    <rect x="40" y="220" width="280" height="32" rx="6" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="241" text-anchor="middle" class="sm">4. Exclusive jurisdiction</text>
    <rect x="40" y="260" width="280" height="32" rx="6" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="281" text-anchor="middle" class="sm">5. An independent board</text>
    <line x1="30" y1="314" x2="330" y2="314" class="rule"/>
    <text x="180" y="336" text-anchor="middle" class="sm dim">and each is under strain: experience rating</text>
    <text x="180" y="352" text-anchor="middle" class="sm dim">against 2, an underfunded board against 3,</text>
    <text x="180" y="368" text-anchor="middle" class="sm dim">judicial review against 4 — and gig work</text>
    <text x="180" y="384" text-anchor="middle" class="sm dim">sits outside all five at once</text>
  </g>
</svg>
