<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four quantum factors a Canadian court weighs, and the rationality test that bounds the award</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Punishment, not compensation — and</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">exceptional</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Awarded only for an independent wrong</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">and only if compensation has not deterred</text>
    <text x="180" y="102" text-anchor="middle" class="sm dim">what raises the award</text>
    <text x="44" y="128" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="60" y="128" text-anchor="start" class="sm">how reprehensible the conduct was</text>
    <text x="44" y="154" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="60" y="154" text-anchor="start" class="sm">how vulnerable the plaintiff was</text>
    <text x="44" y="180" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="60" y="180" text-anchor="start" class="sm">the harm caused or intended</text>
    <text x="44" y="206" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="60" y="206" text-anchor="start" class="sm">the profit the insurer made from it</text>
    <line x1="30" y1="244" x2="330" y2="244" class="rule"/>
    <rect x="44" y="264" width="272" height="60" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="288" text-anchor="middle" class="sm">no fixed multiplier — the award must be</text>
    <text x="180" y="306" text-anchor="middle" class="sm">no more than rationally needed to deter</text>
    <text x="180" y="348" text-anchor="middle" class="sm dim">Whiten: $1M punitive on a $345k fire claim,</text>
    <text x="180" y="364" text-anchor="middle" class="sm dim">modest by American standards and not trivial</text>
    <text x="180" y="386" text-anchor="middle" class="sm dim">a policyholder cannot insure their own</text>
  </g>
</svg>
