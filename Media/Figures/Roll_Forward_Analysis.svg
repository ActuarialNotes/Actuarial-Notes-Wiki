<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The reserve balance reconciled from one valuation to the next</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Where the reserve balance actually went</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">R_end = R_begin + New AY − Paid ± PY dev</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">5,200 + 2,850 − 2,400 + 180 = 5,830</text>
  <line x1="105.92" y1="110" x2="105.92" y2="312" class="grid"/>
  <line x1="152.46" y1="110" x2="152.46" y2="312" class="grid"/>
  <line x1="199" y1="110" x2="199" y2="312" class="grid"/>
  <line x1="245.54" y1="110" x2="245.54" y2="312" class="grid"/>
  <line x1="292.08" y1="110" x2="292.08" y2="312" class="grid"/>
  <line x1="78" y1="312" x2="320" y2="312" class="grid"/>
  <line x1="78" y1="218.05" x2="320" y2="218.05" class="grid"/>
  <line x1="78" y1="124.09" x2="320" y2="124.09" class="grid"/>
  <line x1="78" y1="312" x2="330" y2="312" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="312" x2="78" y2="100" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="105.92" y1="312" x2="105.92" y2="316" class="tick"/>
  <text x="105.92" y="328" text-anchor="middle" class="sm dim">opening</text>
  <line x1="152.46" y1="312" x2="152.46" y2="316" class="tick"/>
  <text x="152.46" y="328" text-anchor="middle" class="sm dim">new AY</text>
  <line x1="199" y1="312" x2="199" y2="316" class="tick"/>
  <text x="199" y="328" text-anchor="middle" class="sm dim">paid</text>
  <line x1="245.54" y1="312" x2="245.54" y2="316" class="tick"/>
  <text x="245.54" y="328" text-anchor="middle" class="sm dim">PY dev</text>
  <line x1="292.08" y1="312" x2="292.08" y2="316" class="tick"/>
  <text x="292.08" y="328" text-anchor="middle" class="sm dim">closing</text>
  <line x1="74" y1="312" x2="78" y2="312" class="tick"/>
  <text x="70" y="315.6" text-anchor="end" class="sm dim">0</text>
  <line x1="74" y1="218.05" x2="78" y2="218.05" class="tick"/>
  <text x="70" y="221.65" text-anchor="end" class="sm dim">4,000</text>
  <line x1="74" y1="124.09" x2="78" y2="124.09" class="tick"/>
  <text x="70" y="127.69" text-anchor="end" class="sm dim">8,000</text>
  <rect x="94.29" y="189.86" width="23.27" height="122.14" rx="2" fill="#7c3aed" fill-opacity="0.72"/>
  <text x="105.92" y="181.86" text-anchor="middle" class="sm">5,200</text>
  <rect x="140.83" y="122.92" width="23.27" height="66.94" rx="2" fill="#059669" fill-opacity="0.72"/>
  <text x="152.46" y="114.92" text-anchor="middle" class="sm">2,850</text>
  <rect x="187.37" y="179.29" width="23.27" height="56.37" rx="2" fill="#e11d48" fill-opacity="0.72"/>
  <text x="199" y="171.29" text-anchor="middle" class="sm">2,400</text>
  <rect x="233.9" y="175.06" width="23.27" height="4.23" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <text x="245.54" y="167.06" text-anchor="middle" class="sm">180</text>
  <rect x="280.44" y="175.06" width="23.27" height="136.94" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <text x="292.08" y="167.06" text-anchor="middle" class="sm">5,830</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">unpaid claims ($000) through calendar 2024</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">only the prior-year development is a change of</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">view — the rest is mechanics</text>
</svg>
