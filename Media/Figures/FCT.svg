<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Four MCT-ratio bars from the FCT: the base scenario at 168%, above the 150% supervisory target, and the adverse scenarios at 124% and 112% above the 100% minimum — but the solvency scenario at 86%, below it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="74" y1="264" x2="330" y2="264" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
    <text x="66" y="268" text-anchor="end" class="sm bold">100%</text>
    <line x1="74" y1="159" x2="330" y2="159" class="thin dash" stroke="#d97706" stroke-width="1.6"/>
    <text x="66" y="163" text-anchor="end" class="sm bold">150%</text>
    <rect x="90" y="121.2" width="44" height="226.8" rx="3" fill="#059669" fill-opacity="0.6"/>
    <text x="112" y="113.2" text-anchor="middle" class="sm">168%</text>
    <text x="112" y="366" text-anchor="middle" class="sm dim">base</text>
    <rect x="154" y="213.6" width="44" height="134.4" rx="3" fill="#0d9488" fill-opacity="0.6"/>
    <text x="176" y="205.6" text-anchor="middle" class="sm">124%</text>
    <text x="176" y="366" text-anchor="middle" class="sm dim">cat</text>
    <rect x="218" y="238.8" width="44" height="109.2" rx="3" fill="#d97706" fill-opacity="0.6"/>
    <text x="240" y="230.8" text-anchor="middle" class="sm">112%</text>
    <text x="240" y="366" text-anchor="middle" class="sm dim">reserves</text>
    <rect x="282" y="293.4" width="44" height="54.6" rx="3" fill="#e11d48" fill-opacity="0.6"/>
    <text x="304" y="285.4" text-anchor="middle" class="sm">86%</text>
    <text x="304" y="366" text-anchor="middle" class="sm dim">solvency</text>
    <line x1="74" y1="348" x2="330" y2="348" class="axis"/>
  </g>
</svg>
