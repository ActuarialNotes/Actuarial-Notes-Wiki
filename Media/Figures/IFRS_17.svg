<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A policy's coverage on a timeline at the reporting date: the coverage still to come is the liability for remaining coverage, and claims already incurred but not yet paid are the liability for incurred claims</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="52" y="170" width="120" height="60" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <rect x="172" y="170" width="128" height="60" rx="4" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="236" y="205" text-anchor="middle" class="bold">LRC</text>
    <line x1="30" y1="266" x2="334" y2="266" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <polygon points="93,322 85.4,324.24 89.19,331.19 82.24,327.4 80,335 77.76,327.4 70.81,331.19 74.6,324.24 67,322 74.6,319.76 70.81,312.81 77.76,316.6 80,309 82.24,316.6 89.19,312.81 85.4,319.76" fill="#e11d48" fill-opacity="0.30" stroke="#e11d48" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="129,322 121.4,324.24 125.19,331.19 118.24,327.4 116,335 113.76,327.4 106.81,331.19 110.6,324.24 103,322 110.6,319.76 106.81,312.81 113.76,316.6 116,309 118.24,316.6 125.19,312.81 121.4,319.76" fill="#e11d48" fill-opacity="0.30" stroke="#e11d48" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="163,322 155.4,324.24 159.19,331.19 152.24,327.4 150,335 147.76,327.4 140.81,331.19 144.6,324.24 137,322 144.6,319.76 140.81,312.81 147.76,316.6 150,309 152.24,316.6 159.19,312.81 155.4,319.76" fill="#e11d48" fill-opacity="0.30" stroke="#e11d48" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="166" y1="322" x2="180" y2="322" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
    <rect x="184" y="300" width="146" height="44" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.3"/>
    <text x="251" y="327" text-anchor="middle" class="bold">LIC</text>
    <line x1="172" y1="136" x2="172" y2="362" class="thin dash" stroke="var(--ink)" stroke-width="1.3"/>
    <text x="172" y="126" text-anchor="middle" class="sm bold">now</text>
    <text x="52" y="284" text-anchor="middle" class="sm dim">issue</text>
    <text x="300" y="284" text-anchor="middle" class="sm dim">expiry</text>
  </g>
</svg>
