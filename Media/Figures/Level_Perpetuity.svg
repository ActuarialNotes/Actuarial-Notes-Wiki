<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Payments that never stop, discounted to a finite value</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Each payment's present value shrinks</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">geometrically</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">a₍∞₎ = Σ vᵏ = 1/i</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">at i = 5%:  1/0.05 = 20</text>
  <rect x="78.17" y="119.61" width="8.05" height="230.39" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="90.36" y="130.59" width="8.05" height="219.41" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="102.55" y="141.03" width="8.05" height="208.97" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="114.74" y="150.98" width="8.05" height="199.02" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="126.93" y="160.46" width="8.05" height="189.54" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="139.12" y="169.49" width="8.05" height="180.51" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="151.31" y="178.08" width="8.05" height="171.92" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="163.5" y="186.27" width="8.05" height="163.73" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="175.69" y="194.07" width="8.05" height="155.93" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="187.88" y="201.49" width="8.05" height="148.51" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="200.07" y="208.56" width="8.05" height="141.44" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="212.26" y="215.3" width="8.05" height="134.7" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="224.45" y="221.71" width="8.05" height="128.29" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="236.64" y="227.82" width="8.05" height="122.18" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="248.83" y="233.64" width="8.05" height="116.36" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="261.02" y="239.18" width="8.05" height="110.82" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="273.22" y="244.46" width="8.05" height="105.54" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="285.41" y="249.48" width="8.05" height="100.52" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="297.6" y="254.27" width="8.05" height="95.73" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="309.79" y="258.83" width="8.05" height="91.17" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <line x1="70" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="70" y1="350" x2="70" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="82.19" y1="350" x2="82.19" y2="354" class="tick"/>
  <text x="82.19" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="130.95" y1="350" x2="130.95" y2="354" class="tick"/>
  <text x="130.95" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="191.9" y1="350" x2="191.9" y2="354" class="tick"/>
  <text x="191.9" y="366" text-anchor="middle" class="sm dim">10</text>
  <line x1="252.86" y1="350" x2="252.86" y2="354" class="tick"/>
  <text x="252.86" y="366" text-anchor="middle" class="sm dim">15</text>
  <line x1="313.81" y1="350" x2="313.81" y2="354" class="tick"/>
  <text x="313.81" y="366" text-anchor="middle" class="sm dim">20</text>
  <line x1="66" y1="229.05" x2="70" y2="229.05" class="tick"/>
  <text x="62" y="232.65" text-anchor="end" class="sm dim">0.5</text>
  <line x1="66" y1="108.1" x2="70" y2="108.1" class="tick"/>
  <text x="62" y="111.7" text-anchor="end" class="sm dim">1</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">payment number</text>
  <text x="66" y="82" text-anchor="start" class="sm dim">present value</text>
</svg>
