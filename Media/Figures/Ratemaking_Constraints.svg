<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The band of filed changes the regulatory, competitive and operational limits leave open</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The indication is the start of the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">conversation</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Selected = f(Indication, Z, Constraints)</text>
  <line x1="52" y1="168" x2="312" y2="168" class="axis"/>
  <line x1="52" y1="163" x2="52" y2="173" class="tick"/>
  <text x="52" y="188" text-anchor="middle" class="sm dim">0%</text>
  <line x1="182" y1="163" x2="182" y2="173" class="tick"/>
  <text x="182" y="188" text-anchor="middle" class="sm dim">+5%</text>
  <line x1="312" y1="163" x2="312" y2="173" class="tick"/>
  <text x="312" y="188" text-anchor="middle" class="sm dim">+10%</text>
  <rect x="130" y="134" width="91" height="24" rx="4" fill="#059669" fill-opacity="0.24" stroke="#059669" stroke-width="1.2"/>
  <text x="175.5" y="151" text-anchor="middle" class="sm" fill="#059669">filable band</text>
  <line x1="241.8" y1="110" x2="241.8" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="241.8" y="102" text-anchor="middle" class="sm bold" fill="#3b82f6">indicated +7.3%</text>
  <rect x="52" y="237" width="11" height="11" rx="2" fill="#e11d48" fill-opacity="0.8"/>
  <text x="70" y="247" text-anchor="start" class="sm bold">Regulatory</text>
  <text x="70" y="263" text-anchor="start" class="sm dim">prior approval, capping rules</text>
  <rect x="52" y="279" width="11" height="11" rx="2" fill="#d97706" fill-opacity="0.8"/>
  <text x="70" y="289" text-anchor="start" class="sm bold">Competitive</text>
  <text x="70" y="305" text-anchor="start" class="sm dim">what the market will bear</text>
  <rect x="52" y="321" width="11" height="11" rx="2" fill="#7c3aed" fill-opacity="0.8"/>
  <text x="70" y="331" text-anchor="start" class="sm bold">Operational</text>
  <text x="70" y="347" text-anchor="start" class="sm dim">systems, filing lead times</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">compute it properly, then say why you departed</text>
</svg>
