    <path d="M49.52,174 V149.68 Q49.52,139.44 61.04,139.44 H78.96 Q90.48,139.44 90.48,149.68 V174 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="70" y="196" text-anchor="middle" class="sm bold">driver</text>
    <rect x="270.96" y="108" width="38.08" height="68" rx="2" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="278.44" y="116.16" width="8.16" height="6.8" fill="#d97706" fill-opacity="0.55"/>
    <rect x="293.4" y="116.16" width="8.16" height="6.8" fill="#d97706" fill-opacity="0.55"/>
    <rect x="278.44" y="129.76" width="8.16" height="6.8" fill="#d97706" fill-opacity="0.55"/>
    <rect x="293.4" y="129.76" width="8.16" height="6.8" fill="#d97706" fill-opacity="0.55"/>
