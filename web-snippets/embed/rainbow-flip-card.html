<div class="an-flip-wrap" tabindex="0" role="button" aria-pressed="false" aria-label="Probability. Press to flip the card and read the definition.">
  <div class="an-flip-card">
    <div class="an-flip-face an-flip-front">
      <div class="an-flip-title">Probability</div>
    </div>
    <div class="an-flip-face an-flip-back">
      <div class="an-flip-scroll">
        <div class="an-flip-back-inner">
          <div class="an-flip-back-title">Probability</div>
          <div class="an-flip-back-text">
            A number between 0 and 1 measuring how likely an event is to occur —
            0 is impossible, 1 is certain. For equally likely outcomes:
          </div>
          <div class="an-flip-formula">P(E) = favorable outcomes / total outcomes</div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .an-flip-wrap {
    --an-card-max: 260px;
    --an-card-min-h: 340px;
    --an-bg: hsl(250 30% 14%);
    --an-fg: hsl(240 30% 96%);
    --an-muted: hsl(240 15% 72%);
    --an-border: hsl(250 25% 26%);
    --an-c1: rgb(56 189 248);   /* sky     */
    --an-c2: rgb(232 121 249);  /* fuchsia */
    --an-c3: rgb(250 204 21);   /* gold    */

    display: block;
    width: 100%;
    max-width: var(--an-card-max);
    margin-left: auto;
    margin-right: auto;
    cursor: pointer;
    outline: none;
  }
  .an-flip-wrap * { box-sizing: border-box; }

  .an-flip-wrap .an-flip-card {
    position: relative;
  }
  .an-flip-wrap:focus-visible .an-flip-card {
    box-shadow: 0 0 0 3px hsl(263 85% 66% / 0.6);
    border-radius: 18px;
  }

  .an-flip-wrap .an-flip-face {
    border-radius: 18px;
    background: var(--an-bg);
    color: var(--an-fg);
    text-align: center;
    /* Fallback edge. Replaced by the gradient ring inside @supports below. */
    border: 2px solid var(--an-c2);
    transition: opacity 260ms ease;
  }

  /* The front is in normal flow: it is what gives the card its height, so the
     card can never collapse no matter what else the page's CSS does. */
  .an-flip-wrap .an-flip-front {
    position: relative;
    z-index: 1;
    min-height: var(--an-card-min-h);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }

  /* The back is overlaid on top of the front and cross-faded in. */
  .an-flip-wrap .an-flip-back {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
  }
  .an-flip-wrap.an-is-flipped .an-flip-front { opacity: 0; }
  .an-flip-wrap.an-is-flipped .an-flip-back { opacity: 1; pointer-events: auto; }

  /* A short column can't fit a long definition, so the back scrolls rather
     than clipping — same behaviour as the app's card back. */
  .an-flip-wrap .an-flip-scroll {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 24px 20px;
    border-radius: 18px;
    scrollbar-width: thin;
    scrollbar-color: hsl(240 15% 72% / 0.5) transparent;
  }
  .an-flip-wrap .an-flip-scroll::-webkit-scrollbar { width: 5px; }
  .an-flip-wrap .an-flip-scroll::-webkit-scrollbar-thumb {
    background: hsl(240 15% 72% / 0.45);
    border-radius: 3px;
  }
  .an-flip-wrap .an-flip-scroll::-webkit-scrollbar-track { background: transparent; }
  /* min-height (not height) + centring: content sits centred when it fits and
     grows downward when it doesn't, so a long definition is never top-clipped. */
  .an-flip-wrap .an-flip-back-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 100%;
    width: 100%;
  }

  /* Type — plain px. Set explicitly (never inherited) so a host stylesheet's
     bare `div { ... }` rule, which targets these elements directly, can't win. */
  .an-flip-wrap .an-flip-title {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--an-fg);
  }
  .an-flip-wrap .an-flip-back-title {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--an-c2);
  }
  .an-flip-wrap .an-flip-back-text {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--an-muted);
  }
  .an-flip-wrap .an-flip-formula {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--an-fg);
    background: hsl(0 0% 100% / 0.06);
    border: 1px solid var(--an-border);
    border-radius: 9px;
    padding: 9px 11px;
  }

  /* ── Enhancement: the travelling rainbow foil ring ──────────────────────
     Layered on only where the padding + mask-exclude trick is actually
     supported. Without the guard, a browser (or a CSS minifier) that drops
     mask-composite would paint the gradient as a solid block covering the
     card's text instead of as a 2px edge. */
  @supports ((-webkit-mask-composite: xor) or (mask-composite: exclude)) {
    .an-flip-wrap .an-flip-face {
      border-color: transparent;
    }
    .an-flip-wrap .an-flip-face::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 18px;
      padding: 2px;
      background: linear-gradient(115deg, var(--an-c1), var(--an-c2), var(--an-c3), var(--an-c1));
      background-size: 300% 100%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 3;
      animation: an-foil-shift 4s linear infinite;
    }
    /* The front is in flow, so its ring needs a positioning context. */
    .an-flip-wrap .an-flip-front { position: relative; }
  }
  @keyframes an-foil-shift {
    to { background-position: 300% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .an-flip-wrap .an-flip-face { transition: none; }
    .an-flip-wrap .an-flip-face::before { animation: none; }
  }
</style>

<script>
(function () {
  // One delegated listener on the document, rather than a handler bound to
  // each card. That matters inside a page builder: Elementor (and any CMS
  // that re-renders a widget, loads it over AJAX, or swaps it in the live
  // editor) replaces the markup after this script has run, which would strip
  // per-element handlers and leave a card that no longer flips. Delegation
  // keeps working no matter when the markup appears or reappears — and it
  // handles any number of cards on the page for free.
  if (window.__anFlipCardBound) return;
  window.__anFlipCardBound = true;

  function toggle(card) {
    var flipped = card.classList.toggle('an-is-flipped');
    card.setAttribute('aria-pressed', flipped ? 'true' : 'false');
  }

  document.addEventListener('click', function (e) {
    var card = e.target.closest && e.target.closest('.an-flip-wrap');
    if (card) toggle(card);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest && e.target.closest('.an-flip-wrap');
    if (!card) return;
    e.preventDefault();
    toggle(card);
  });
})();
</script>
