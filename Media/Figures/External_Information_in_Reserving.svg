<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Link ratios from four thin years of own data swinging around a smooth industry pattern, and the selected pattern blended mostly from the industry</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="140" y1="94" x2="140" y2="344" class="grid"/>
    <line x1="184" y1="94" x2="184" y2="344" class="grid"/>
    <line x1="228" y1="94" x2="228" y2="344" class="grid"/>
    <line x1="272" y1="94" x2="272" y2="344" class="grid"/>
    <line x1="316" y1="94" x2="316" y2="344" class="grid"/>
    <line x1="74" y1="328.38" x2="316" y2="328.38" class="grid"/>
    <line x1="74" y1="250.25" x2="316" y2="250.25" class="grid"/>
    <line x1="74" y1="172.12" x2="316" y2="172.12" class="grid"/>
    <line x1="74" y1="344" x2="326" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="344" x2="74" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="140" y1="344" x2="140" y2="348" class="tick"/>
    <text x="140" y="360" text-anchor="middle" class="sm dim">12</text>
    <line x1="184" y1="344" x2="184" y2="348" class="tick"/>
    <text x="184" y="360" text-anchor="middle" class="sm dim">24</text>
    <line x1="228" y1="344" x2="228" y2="348" class="tick"/>
    <text x="228" y="360" text-anchor="middle" class="sm dim">36</text>
    <line x1="272" y1="344" x2="272" y2="348" class="tick"/>
    <text x="272" y="360" text-anchor="middle" class="sm dim">48</text>
    <line x1="316" y1="344" x2="316" y2="348" class="tick"/>
    <text x="316" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="70" y1="328.38" x2="74" y2="328.38" class="tick"/>
    <text x="66" y="331.98" text-anchor="end" class="sm dim">1.00</text>
    <line x1="70" y1="250.25" x2="74" y2="250.25" class="tick"/>
    <text x="66" y="253.85" text-anchor="end" class="sm dim">1.25</text>
    <line x1="70" y1="172.12" x2="74" y2="172.12" class="tick"/>
    <text x="66" y="175.72" text-anchor="end" class="sm dim">1.50</text>
    <text x="316" y="376" text-anchor="end" class="sm dim">age in months</text>
    <text x="70" y="80" text-anchor="start" class="sm dim">link ratio</text>
    <polyline points="140,178.38 184,278.38 228,306.5 272,319 316,325.25" class="curve dash" stroke="#d97706" stroke-width="2.2"/>
    <polyline points="140,134.62 184,300.25 228,284.62 272,331.5 316,319" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="140" cy="134.62" r="3.6" fill="#3b82f6"/>
    <circle cx="184" cy="300.25" r="3.6" fill="#3b82f6"/>
    <circle cx="228" cy="284.62" r="3.6" fill="#3b82f6"/>
    <circle cx="272" cy="331.5" r="3.6" fill="#3b82f6"/>
    <circle cx="316" cy="319" r="3.6" fill="#3b82f6"/>
    <polyline points="140,165.25 184,284.94 228,299.94 272,322.75 316,323.38" class="curve" stroke="#059669" stroke-width="2.6"/>
    <text x="228" y="275.62" text-anchor="middle" class="sm bold" fill="#3b82f6">own data</text>
    <text x="228" y="323.5" text-anchor="middle" class="sm bold" fill="#d97706">industry</text>
    <text x="132" y="169.25" text-anchor="end" class="sm bold" fill="#059669">selected</text>
  </g>
</svg>
