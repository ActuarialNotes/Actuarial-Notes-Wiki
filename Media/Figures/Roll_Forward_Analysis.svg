<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A waterfall taking the reserve from 5,200 at the opening through 2,850 for the new accident year, 2,400 of payments and 180 of prior-year development to 5,830 at the close</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="105.92" y1="94" x2="105.92" y2="344" class="grid"/>
    <line x1="152.46" y1="94" x2="152.46" y2="344" class="grid"/>
    <line x1="199" y1="94" x2="199" y2="344" class="grid"/>
    <line x1="245.54" y1="94" x2="245.54" y2="344" class="grid"/>
    <line x1="292.08" y1="94" x2="292.08" y2="344" class="grid"/>
    <line x1="78" y1="344" x2="320" y2="344" class="grid"/>
    <line x1="78" y1="227.72" x2="320" y2="227.72" class="grid"/>
    <line x1="78" y1="111.44" x2="320" y2="111.44" class="grid"/>
    <line x1="78" y1="344" x2="330" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="78" y1="344" x2="78" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="105.92" y1="344" x2="105.92" y2="348" class="tick"/>
    <text x="105.92" y="360" text-anchor="middle" class="sm dim">opening</text>
    <line x1="152.46" y1="344" x2="152.46" y2="348" class="tick"/>
    <text x="152.46" y="360" text-anchor="middle" class="sm dim">new AY</text>
    <line x1="199" y1="344" x2="199" y2="348" class="tick"/>
    <text x="199" y="360" text-anchor="middle" class="sm dim">paid</text>
    <line x1="245.54" y1="344" x2="245.54" y2="348" class="tick"/>
    <text x="245.54" y="360" text-anchor="middle" class="sm dim">PY dev</text>
    <line x1="292.08" y1="344" x2="292.08" y2="348" class="tick"/>
    <text x="292.08" y="360" text-anchor="middle" class="sm dim">closing</text>
    <line x1="74" y1="344" x2="78" y2="344" class="tick"/>
    <text x="70" y="347.6" text-anchor="end" class="sm dim">0</text>
    <line x1="74" y1="227.72" x2="78" y2="227.72" class="tick"/>
    <text x="70" y="231.32" text-anchor="end" class="sm dim">4,000</text>
    <line x1="74" y1="111.44" x2="78" y2="111.44" class="tick"/>
    <text x="70" y="115.04" text-anchor="end" class="sm dim">8,000</text>
    <rect x="94.29" y="192.84" width="23.27" height="151.16" rx="2" fill="#7c3aed" fill-opacity="0.72"/>
    <text x="105.92" y="184.84" text-anchor="middle" class="sm">5,200</text>
    <rect x="140.83" y="109.99" width="23.27" height="82.85" rx="2" fill="#059669" fill-opacity="0.72"/>
    <text x="152.46" y="101.99" text-anchor="middle" class="sm">+2,850</text>
    <rect x="187.37" y="109.99" width="23.27" height="69.77" rx="2" fill="#e11d48" fill-opacity="0.72"/>
    <text x="199" y="101.99" text-anchor="middle" class="sm">−2,400</text>
    <rect x="233.9" y="174.52" width="23.27" height="5.23" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <text x="245.54" y="166.52" text-anchor="middle" class="sm">+180</text>
    <rect x="280.44" y="174.52" width="23.27" height="169.48" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="292.08" y="166.52" text-anchor="middle" class="sm">5,830</text>
    <line x1="117.56" y1="192.84" x2="140.83" y2="192.84" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <line x1="164.1" y1="109.99" x2="187.37" y2="109.99" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <line x1="210.63" y1="179.76" x2="233.9" y2="179.76" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <line x1="257.17" y1="174.52" x2="280.44" y2="174.52" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
  </g>
</svg>
