<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Future payments projected from the case reserve balance instead of from reported losses</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Develop the case reserve, not the losses</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">U = Paid to date + Case O/S × f_case</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">600 + 900 × 2.500 = 2,850</text>
  <text x="180" y="116" text-anchor="middle" class="sm dim">AY 2024 at 12 months ($000)</text>
  <rect x="46" y="140" width="56.42" height="34" rx="4" fill="#059669" fill-opacity="0.6"/>
  <text x="54" y="162" text-anchor="start" class="sm">paid 600</text>
  <rect x="46" y="196" width="84.63" height="34" rx="4" fill="#d97706" fill-opacity="0.6"/>
  <text x="54" y="218" text-anchor="start" class="sm">case 900</text>
  <line x1="136.63" y1="213" x2="257.58" y2="213" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
  <text x="196.46" y="205" text-anchor="middle" class="sm bold" fill="#e11d48">× 2.500</text>
  <rect x="46" y="252" width="211.58" height="34" rx="4" fill="#e11d48" fill-opacity="0.35" stroke="#e11d48" stroke-width="1.2"/>
  <text x="54" y="274" text-anchor="start" class="sm">future payments 2,250</text>
  <text x="180" y="322" text-anchor="middle" class="sm dim">the factor is all future payments per dollar</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">of case reserve, so it inherits every change</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">in case-reserving adequacy directly</text>
</svg>
