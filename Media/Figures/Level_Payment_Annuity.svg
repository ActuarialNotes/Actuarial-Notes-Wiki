<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The two standard annuity factors read off one payment stream</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Level payments, two standard factors</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">a₍ₙ₎ = (1 − vⁿ)/i,   s₍ₙ₎ = ((1+i)ⁿ − 1)/i</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">at i = 6%, n = 5:  a₍₅₎ = 4.2124,  s₍₅₎ = 5.6371</text>
  <line x1="58" y1="250" x2="318" y2="250" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="66" y1="246" x2="66" y2="254" class="tick"/>
  <text x="66" y="267" text-anchor="middle" class="sm dim">0</text>
  <line x1="112.8" y1="246" x2="112.8" y2="254" class="tick"/>
  <text x="112.8" y="267" text-anchor="middle" class="sm dim">1</text>
  <line x1="159.6" y1="246" x2="159.6" y2="254" class="tick"/>
  <text x="159.6" y="267" text-anchor="middle" class="sm dim">2</text>
  <line x1="206.4" y1="246" x2="206.4" y2="254" class="tick"/>
  <text x="206.4" y="267" text-anchor="middle" class="sm dim">3</text>
  <line x1="253.2" y1="246" x2="253.2" y2="254" class="tick"/>
  <text x="253.2" y="267" text-anchor="middle" class="sm dim">4</text>
  <line x1="300" y1="246" x2="300" y2="254" class="tick"/>
  <text x="300" y="267" text-anchor="middle" class="sm dim">5</text>
  <line x1="112.8" y1="250" x2="112.8" y2="210" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="112.8" y="204" text-anchor="middle" class="sm">P</text>
  <line x1="159.6" y1="250" x2="159.6" y2="210" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="159.6" y="204" text-anchor="middle" class="sm">P</text>
  <line x1="206.4" y1="250" x2="206.4" y2="210" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="206.4" y="204" text-anchor="middle" class="sm">P</text>
  <line x1="253.2" y1="250" x2="253.2" y2="210" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="253.2" y="204" text-anchor="middle" class="sm">P</text>
  <line x1="300" y1="250" x2="300" y2="210" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="300" y="204" text-anchor="middle" class="sm">P</text>
  <line x1="66" y1="158" x2="66" y2="242" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="66" y="150" text-anchor="middle" class="sm bold" fill="#d97706">a₍ₙ₎ here</text>
  <line x1="300" y1="158" x2="300" y2="242" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="300" y="150" text-anchor="middle" class="sm bold" fill="#059669">s₍ₙ₎ here</text>
  <text x="66" y="290" text-anchor="start" class="sm dim">one period</text>
  <text x="66" y="304" text-anchor="start" class="sm dim">before</text>
  <text x="300" y="290" text-anchor="end" class="sm dim">at the last</text>
  <text x="300" y="304" text-anchor="end" class="sm dim">payment</text>
</svg>
