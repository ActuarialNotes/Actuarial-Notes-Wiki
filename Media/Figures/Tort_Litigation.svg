<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A bodily injury award built as a waterfall — income, care and pain up to $1.85M, then 20% contributory negligence and the accident benefits taken off — to $1.38M paid</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="45.18" y="175.35" width="29.97" height="174.65" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="60.17" y="167.35" text-anchor="middle" class="sm">1.37M</text>
    <text x="60.17" y="365" text-anchor="middle" class="sm dim">income</text>
    <rect x="93.52" y="137" width="29.97" height="38.34" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="108.5" y="129" text-anchor="middle" class="sm">300k</text>
    <text x="108.5" y="365" text-anchor="middle" class="sm dim">care</text>
    <rect x="141.85" y="114" width="29.97" height="23" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="156.83" y="106" text-anchor="middle" class="sm">180k</text>
    <text x="156.83" y="365" text-anchor="middle" class="sm dim">pain</text>
    <rect x="190.18" y="114" width="29.97" height="47.2" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="205.17" y="106" text-anchor="middle" class="sm">369k</text>
    <text x="205.17" y="365" text-anchor="middle" class="sm dim">−20%</text>
    <rect x="238.52" y="161.2" width="29.97" height="12.14" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="253.5" y="153.2" text-anchor="middle" class="sm">95k</text>
    <text x="253.5" y="365" text-anchor="middle" class="sm dim">−AB</text>
    <rect x="286.85" y="173.34" width="29.97" height="176.66" rx="3" fill="#059669" fill-opacity="0.72"/>
    <text x="301.83" y="165.34" text-anchor="middle" class="sm">1.38M</text>
    <text x="301.83" y="365" text-anchor="middle" class="sm dim">paid</text>
    <line x1="30" y1="350" x2="332" y2="350" class="axis"/>
  </g>
</svg>
