<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three columns building the rate: the $360 pure premium, $25 of fixed expense added to make $385, then divided by 0.69 to make room for variable expense and profit, reaching $558</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="32" y="194.7" width="56" height="161.3" rx="2" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.1"/>
    <text x="60" y="186.7" text-anchor="middle" class="sm bold">360</text>
    <rect x="146" y="194.7" width="56" height="161.3" rx="2" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="146" y="183.5" width="56" height="11.2" rx="2" fill="#0d9488" fill-opacity="0.32" stroke="#0d9488" stroke-width="1.1"/>
    <text x="174" y="175.5" text-anchor="middle" class="sm bold">385</text>
    <rect x="260" y="194.7" width="56" height="161.3" rx="2" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="260" y="183.5" width="56" height="11.2" rx="2" fill="#0d9488" fill-opacity="0.32" stroke="#0d9488" stroke-width="1.1"/>
    <rect x="260" y="118.5" width="56" height="65" rx="2" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.1"/>
    <rect x="260" y="106" width="56" height="12.5" rx="2" fill="#059669" fill-opacity="0.32" stroke="#059669" stroke-width="1.1"/>
    <text x="288" y="98" text-anchor="middle" class="sm bold">558</text>
    <line x1="94" y1="316" x2="140" y2="316" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="117" y="308" text-anchor="middle" class="sm bold">+ 25</text>
    <line x1="208" y1="316" x2="254" y2="316" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="231" y="308" text-anchor="middle" class="sm bold">÷ 0.69</text>
    <text x="288" y="155" text-anchor="middle" class="sm bold">V</text>
    <text x="322" y="116.25" text-anchor="start" class="sm bold">Q</text>
  </g>
</svg>
