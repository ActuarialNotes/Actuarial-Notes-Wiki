<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 282" width="560" height="282" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="280.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A level annuity: the same payment, every period</text>
  <line x1="100" y1="136" x2="442" y2="136" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="108" y1="132" x2="108" y2="140" class="tick"/>
  <text x="108" y="153" text-anchor="middle" class="sm dim">0</text>
  <line x1="171.2" y1="132" x2="171.2" y2="140" class="tick"/>
  <text x="171.2" y="153" text-anchor="middle" class="sm dim">1</text>
  <line x1="234.4" y1="132" x2="234.4" y2="140" class="tick"/>
  <text x="234.4" y="153" text-anchor="middle" class="sm dim">2</text>
  <line x1="297.6" y1="132" x2="297.6" y2="140" class="tick"/>
  <text x="297.6" y="153" text-anchor="middle" class="sm dim">3</text>
  <line x1="360.8" y1="132" x2="360.8" y2="140" class="tick"/>
  <text x="360.8" y="153" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="132" x2="424" y2="140" class="tick"/>
  <text x="424" y="153" text-anchor="middle" class="sm dim">5</text>
  <line x1="171.2" y1="136" x2="171.2" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="171.2" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="234.4" y1="136" x2="234.4" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="234.4" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="297.6" y1="136" x2="297.6" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="297.6" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="360.8" y1="136" x2="360.8" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="360.8" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="424" y1="136" x2="424" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="424" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="163.2" y1="180" x2="112" y2="180" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <text x="104" y="184" text-anchor="end" class="sm bold" fill="#d97706">P · a₍ₙ₎</text>
  <line x1="368.8" y1="180" x2="420" y2="180" class="thin" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
  <text x="430" y="184" text-anchor="start" class="sm bold" fill="#059669">P · s₍ₙ₎</text>
  <line x1="28" y1="208" x2="532" y2="208" class="rule"/>
  <line x1="40" y1="226" x2="40" y2="256" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="50" y="237" text-anchor="start" class="sm bold">PV = P · a₍ₙ₎</text>
  <text x="50" y="252" text-anchor="start" class="sm dim">= P (1 − vⁿ)/i</text>
  <line x1="212" y1="226" x2="212" y2="256" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="222" y="237" text-anchor="start" class="sm bold">FV = P · s₍ₙ₎</text>
  <text x="222" y="252" text-anchor="start" class="sm dim">= P ((1+i)ⁿ − 1)/i</text>
  <line x1="384" y1="226" x2="384" y2="256" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="394" y="237" text-anchor="start" class="sm bold">s₍ₙ₎ = (1+i)ⁿ a₍ₙ₎</text>
  <text x="394" y="252" text-anchor="start" class="sm dim">same stream, later date</text>
  <text x="280" y="274" text-anchor="middle" class="sm dim">The building block for loans, bonds and reserves</text>
</svg>
