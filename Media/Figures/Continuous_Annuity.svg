  <text x="273.6" y="366" text-anchor="middle" class="sm dim">n</text>
  <line x1="60" y1="234.55" x2="64" y2="234.55" class="tick"/>
  <text x="56" y="238.15" text-anchor="end" class="sm dim">0.5</text>
