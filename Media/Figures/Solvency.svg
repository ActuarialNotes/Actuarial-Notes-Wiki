<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three hurdles against one level of assets: liabilities alone, liabilities plus the required buffer — the one OSFI enforces — and that again with a stress on top</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="34" y1="112" x2="326" y2="112" class="thin dash" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="36" y="104" text-anchor="start" class="sm bold">assets</text>
    <rect x="44" y="232" width="80" height="118" rx="3" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.3"/>
    <text x="84" y="368" text-anchor="middle" class="sm bold">balance sheet</text>
    <rect x="140" y="232" width="80" height="118" rx="3" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.3"/>
    <rect x="140" y="172" width="80" height="60" rx="3" fill="#e11d48" fill-opacity="0.28" stroke="#e11d48" stroke-width="1.3"/>
    <text x="180" y="368" text-anchor="middle" class="sm bold">regulatory</text>
    <rect x="236" y="232" width="80" height="118" rx="3" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.3"/>
    <rect x="236" y="172" width="80" height="60" rx="3" fill="#e11d48" fill-opacity="0.28" stroke="#e11d48" stroke-width="1.3"/>
    <rect x="236" y="136" width="80" height="36" rx="3" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="276" y="368" text-anchor="middle" class="sm bold">economic</text>
    <polygon points="160,134 180,122 200,134" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="163.6" y="136.4" width="4" height="18.4" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="173.2" y="136.4" width="4" height="18.4" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="182.8" y="136.4" width="4" height="18.4" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="192.4" y="136.4" width="4" height="18.4" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="160" y="156.4" width="40" height="5.6" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="276" y="158" text-anchor="middle" class="sm">stress</text>
    <text x="276" y="206" text-anchor="middle" class="sm">buffer</text>
    <text x="276" y="295" text-anchor="middle" class="sm">liabilities</text>
    <line x1="30" y1="350" x2="330" y2="350" class="axis"/>
  </g>
</svg>
