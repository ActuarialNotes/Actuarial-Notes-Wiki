<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 238" width="560" height="238" role="img">
  <title>A set function mapping events to real numbers</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="236.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A set function maps sets — not points — to numbers</text>
  <rect x="26" y="58" width="214" height="140" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="39" y="74" text-anchor="middle" class="sm dim">S</text>
  <ellipse cx="136" cy="96" rx="52" ry="17" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="136" y="100" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <ellipse cx="136" cy="132" rx="52" ry="17" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.4"/>
  <text x="136" y="136" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <ellipse cx="136" cy="168" rx="52" ry="17" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.4"/>
  <text x="136" y="172" text-anchor="middle" class="sm bold" fill="#059669">C</text>
  <text x="133" y="216" text-anchor="middle" class="sm dim">𝓕 — a collection of subsets of S</text>
  <text x="440" y="62" text-anchor="middle" class="bold">f : 𝓕 → ℝ</text>
  <line x1="384" y1="194" x2="384" y2="70" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="366" y="66" text-anchor="end" class="sm dim">ℝ</text>
  <line x1="192" y1="96" x2="372" y2="101.76" class="thin dash" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#ah3b82f6)"/>
  <line x1="380" y1="101.76" x2="388" y2="101.76" class="tick"/>
  <circle cx="384" cy="101.76" r="4" fill="#3b82f6"/>
  <line x1="192" y1="132" x2="372" y2="136.32" class="thin dash" stroke="#d97706" stroke-width="1.2" marker-end="url(#ahd97706)"/>
  <line x1="380" y1="136.32" x2="388" y2="136.32" class="tick"/>
  <circle cx="384" cy="136.32" r="4" fill="#d97706"/>
  <line x1="192" y1="168" x2="372" y2="166.56" class="thin dash" stroke="#059669" stroke-width="1.2" marker-end="url(#ah059669)"/>
  <line x1="380" y1="166.56" x2="388" y2="166.56" class="tick"/>
  <circle cx="384" cy="166.56" r="4" fill="#059669"/>
  <text x="396" y="105.76" text-anchor="start" class="sm" fill="#3b82f6">f(A)</text>
  <text x="396" y="140.32" text-anchor="start" class="sm" fill="#d97706">f(B)</text>
  <text x="396" y="170.56" text-anchor="start" class="sm" fill="#059669">f(C)</text>
  <text x="390" y="216" text-anchor="middle" class="sm dim">Probability is the set function with f(S) = 1</text>
</svg>
