<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 254" width="560" height="254" role="img">
  <title>The twelve ordered pairs drawn from four objects</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="252.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">P(4,2) = 12 — order matters</text>
  <rect x="40" y="69" width="52" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="66" y="89" text-anchor="middle" class="sm">AB</text>
  <rect x="102" y="69" width="52" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="128" y="89" text-anchor="middle" class="sm">BA</text>
  <rect x="164" y="69" width="52" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="190" y="89" text-anchor="middle" class="sm">AC</text>
  <rect x="226" y="69" width="52" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="252" y="89" text-anchor="middle" class="sm">CA</text>
  <rect x="40" y="113" width="52" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="66" y="133" text-anchor="middle" class="sm">AD</text>
  <rect x="102" y="113" width="52" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="128" y="133" text-anchor="middle" class="sm">DA</text>
  <rect x="164" y="113" width="52" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="190" y="133" text-anchor="middle" class="sm">BC</text>
  <rect x="226" y="113" width="52" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="252" y="133" text-anchor="middle" class="sm">CB</text>
  <rect x="40" y="157" width="52" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="66" y="177" text-anchor="middle" class="sm">BD</text>
  <rect x="102" y="157" width="52" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="128" y="177" text-anchor="middle" class="sm">DB</text>
  <rect x="164" y="157" width="52" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="190" y="177" text-anchor="middle" class="sm">CD</text>
  <rect x="226" y="157" width="52" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="252" y="177" text-anchor="middle" class="sm">DC</text>
  <text x="159" y="232" text-anchor="middle" class="sm dim">12 ordered arrangements — AB ≠ BA</text>
  <text x="424" y="74" text-anchor="middle" class="sm bold">P(n,k) = n! / (n−k)!</text>
  <text x="424" y="96" text-anchor="middle" class="sm dim">P(4,2) = 24 / 2 = 12</text>
  <rect x="316" y="116" width="216" height="52" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="424" y="136" text-anchor="middle" class="sm">P(n,k) = C(n,k) × k!</text>
  <text x="424" y="154" text-anchor="middle" class="sm dim">12 = 6 × 2!</text>
  <rect x="316" y="178" width="216" height="52" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="424" y="198" text-anchor="middle" class="sm">Use when sequence matters</text>
  <text x="424" y="216" text-anchor="middle" class="sm dim">ranking, scheduling, distinct roles</text>
</svg>
