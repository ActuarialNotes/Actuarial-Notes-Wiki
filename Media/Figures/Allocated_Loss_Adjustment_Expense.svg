<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>ALAE developing more slowly than indemnity, as a rising ratio to loss</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Defence cost that belongs to one claim</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Loss &amp; ALAE = Indemnity + ALAE</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">ALAE Ratio = ALAE / Indemnity</text>
  <line x1="107.14" y1="102" x2="107.14" y2="322" class="grid"/>
  <line x1="177.43" y1="102" x2="177.43" y2="322" class="grid"/>
  <line x1="247.71" y1="102" x2="247.71" y2="322" class="grid"/>
  <line x1="318" y1="102" x2="318" y2="322" class="grid"/>
  <line x1="72" y1="322" x2="318" y2="322" class="grid"/>
  <line x1="72" y1="230.33" x2="318" y2="230.33" class="grid"/>
  <line x1="72" y1="138.67" x2="318" y2="138.67" class="grid"/>
  <line x1="72" y1="322" x2="328" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="322" x2="72" y2="92" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="107.14" y1="322" x2="107.14" y2="326" class="tick"/>
  <text x="107.14" y="338" text-anchor="middle" class="sm dim">12</text>
  <line x1="177.43" y1="322" x2="177.43" y2="326" class="tick"/>
  <text x="177.43" y="338" text-anchor="middle" class="sm dim">36</text>
  <line x1="247.71" y1="322" x2="247.71" y2="326" class="tick"/>
  <text x="247.71" y="338" text-anchor="middle" class="sm dim">60</text>
  <line x1="318" y1="322" x2="318" y2="326" class="tick"/>
  <text x="318" y="338" text-anchor="middle" class="sm dim">84</text>
  <line x1="68" y1="322" x2="72" y2="322" class="tick"/>
  <text x="64" y="325.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="68" y1="230.33" x2="72" y2="230.33" class="tick"/>
  <text x="64" y="233.93" text-anchor="end" class="sm dim">10%</text>
  <line x1="68" y1="138.67" x2="72" y2="138.67" class="tick"/>
  <text x="64" y="142.27" text-anchor="end" class="sm dim">20%</text>
  <polyline points="107.14,244.08 142.29,219.33 177.43,198.25 212.57,182.67 247.71,172.58 282.86,168 318,166.17" class="curve" stroke="#7c3aed" stroke-width="2.4"/>
  <circle cx="107.14" cy="244.08" r="3" fill="#7c3aed"/>
  <circle cx="142.29" cy="219.33" r="3" fill="#7c3aed"/>
  <circle cx="177.43" cy="198.25" r="3" fill="#7c3aed"/>
  <circle cx="212.57" cy="182.67" r="3" fill="#7c3aed"/>
  <circle cx="247.71" cy="172.58" r="3" fill="#7c3aed"/>
  <circle cx="282.86" cy="168" r="3" fill="#7c3aed"/>
  <circle cx="318" cy="166.17" r="3" fill="#7c3aed"/>
  <text x="236" y="162.58" text-anchor="middle" class="sm bold" fill="#7c3aed">17% at ultimate</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">age in months</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">ALAE outlives the indemnity it defends, so its</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">own triangle develops longer — reserve it apart</text>
</svg>
