  <polyline points="78,163.22 102.8,175.82 127.6,188.8 152.4,202.17 177.2,215.94 202,230.12 226.8,244.72 251.6,259.77 276.4,275.27 301.2,291.23 326,307.67" class="curve" stroke="#d97706" stroke-width="2"/>
  <circle cx="78" cy="163.22" r="2.8" fill="#d97706"/>
  <circle cx="102.8" cy="175.82" r="2.8" fill="#d97706"/>
  <circle cx="127.6" cy="188.8" r="2.8" fill="#d97706"/>
  <circle cx="152.4" cy="202.17" r="2.8" fill="#d97706"/>
  <circle cx="177.2" cy="215.94" r="2.8" fill="#d97706"/>
