<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The credit exposures behind the margin, with reinsurance recoverables usually the largest</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Cede the insurance risk, take on credit</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">risk</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Credit = factors × exposure,</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">by counterparty type and quality</text>
  <text x="40" y="112" text-anchor="start" class="sm">reinsurance recoverables</text>
  <rect x="170" y="114" width="148" height="18" rx="3" fill="#e11d48" fill-opacity="0.60"/>
  <text x="40" y="152" text-anchor="start" class="sm">corporate bonds</text>
  <rect x="170" y="154" width="96" height="18" rx="3" fill="#d97706" fill-opacity="0.60"/>
  <text x="40" y="192" text-anchor="start" class="sm">premiums receivable</text>
  <rect x="170" y="194" width="52" height="18" rx="3" fill="#0d9488" fill-opacity="0.60"/>
  <text x="40" y="232" text-anchor="start" class="sm">Government of Canada</text>
  <rect x="170" y="234" width="6" height="18" rx="3" fill="#059669" fill-opacity="0.60"/>
  <text x="180" y="288" text-anchor="middle" class="sm dim">and the formula cannot see concentration:</text>
  <text x="180" y="304" text-anchor="middle" class="sm dim">80% of recoverables from one reinsurer attracts</text>
  <text x="180" y="320" text-anchor="middle" class="sm dim">the same charge as a spread programme</text>
  <line x1="30" y1="340" x2="330" y2="340" class="rule"/>
  <text x="180" y="362" text-anchor="middle" class="sm dim">unregistered cessions get no credit at all unless</text>
  <text x="180" y="378" text-anchor="middle" class="sm dim">collateralised — the IFRS 17 parallel is</text>
  <text x="180" y="392" text-anchor="middle" class="sm dim">non-performance risk on the reinsurance asset</text>
</svg>
