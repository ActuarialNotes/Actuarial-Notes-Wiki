<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A portfolio cut by annual cohort and by profitability into the groups IFRS 17 measures</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Measured in groups — never as a whole</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">book</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Group = portfolio ∩ annual cohort</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">∩ profitability bucket</text>
    <rect x="42" y="92" width="276" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="110" text-anchor="middle" class="sm">portfolio — personal auto, Ontario</text>
    <text x="104" y="146" text-anchor="middle" class="sm bold" fill="#3b82f6">2024</text>
    <rect x="44" y="160" width="120" height="36" rx="5" fill="#e11d48" fill-opacity="0.22" stroke="#e11d48" stroke-width="1.2"/>
    <text x="104" y="182" text-anchor="middle" class="sm">onerous</text>
    <rect x="44" y="204" width="120" height="36" rx="5" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.2"/>
    <text x="104" y="226" text-anchor="middle" class="sm">may become</text>
    <rect x="44" y="248" width="120" height="36" rx="5" fill="#059669" fill-opacity="0.22" stroke="#059669" stroke-width="1.2"/>
    <text x="104" y="270" text-anchor="middle" class="sm">profitable</text>
    <text x="246" y="146" text-anchor="middle" class="sm bold" fill="#3b82f6">2025</text>
    <rect x="186" y="160" width="120" height="36" rx="5" fill="#e11d48" fill-opacity="0.22" stroke="#e11d48" stroke-width="1.2"/>
    <text x="246" y="182" text-anchor="middle" class="sm">onerous</text>
    <rect x="186" y="204" width="120" height="36" rx="5" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.2"/>
    <text x="246" y="226" text-anchor="middle" class="sm">may become</text>
    <rect x="186" y="248" width="120" height="36" rx="5" fill="#059669" fill-opacity="0.22" stroke="#059669" stroke-width="1.2"/>
    <text x="246" y="270" text-anchor="middle" class="sm">profitable</text>
    <text x="180" y="318" text-anchor="middle" class="sm dim">six groups from one portfolio, and the onerous</text>
    <text x="180" y="334" text-anchor="middle" class="sm dim">test runs in each of them separately</text>
    <text x="180" y="360" text-anchor="middle" class="sm dim">the annual cohort is what stops new profitable</text>
    <text x="180" y="376" text-anchor="middle" class="sm dim">business from hiding an older loss</text>
  </g>
</svg>
