<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 264" width="560" height="264" role="img">
  <title>The discount factor as the present value of 1 due in one period</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="262.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">v is what 1 payable next period is worth today</text>
  <line x1="122" y1="118" x2="408" y2="118" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="130" y1="114" x2="130" y2="122" class="tick"/>
  <text x="130" y="135" text-anchor="middle" class="sm dim">0</text>
  <line x1="390" y1="114" x2="390" y2="122" class="tick"/>
  <text x="390" y="135" text-anchor="middle" class="sm dim">1</text>
  <line x1="390" y1="118" x2="390" y2="62" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="390" y="56" text-anchor="middle" class="sm">1</text>
  <line x1="130" y1="118" x2="130" y2="78" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="130" y="72" text-anchor="middle" class="sm">v = 1/(1+i)</text>
  <line x1="380" y1="50" x2="140" y2="50" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
  <text x="260" y="42" text-anchor="middle" class="sm bold" fill="#d97706">× v</text>
  <rect x="130" y="176" width="273.58" height="26" rx="4" fill="#d97706" fill-opacity="0.3" stroke="#d97706" stroke-width="1.2"/>
  <rect x="403.58" y="176" width="16.42" height="26" rx="4" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.2"/>
  <text x="266.79" y="193" text-anchor="middle" class="sm bold">v = 0.9434</text>
  <text x="428" y="193" text-anchor="start" class="sm bold" fill="#e11d48">d = 0.0566</text>
  <text x="122" y="193" text-anchor="end" class="sm dim">1</text>
  <text x="275" y="220" text-anchor="middle" class="sm dim">v + d = 1</text>
  <line x1="28" y1="232" x2="532" y2="232" class="rule"/>
  <text x="280" y="252" text-anchor="middle" class="sm dim">v = (1 + i)⁻¹ = 1 − d = e^(−δ)     ·     n periods: vⁿ = (1 + i)⁻ⁿ</text>
</svg>
