<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Bars of authority falling from the Rules of Professional Conduct and the Standards of Practice, which cross the binding line, to educational notes and draft notes, which stop short of it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="40" y="111" text-anchor="start" class="sm bold">conduct rules</text>
    <rect x="40" y="120" width="276" height="30" rx="4" fill="#7c3aed" fill-opacity="0.6" stroke="none" stroke-width="1.6"/>
    <text x="40" y="177" text-anchor="start" class="sm bold">standards</text>
    <rect x="40" y="186" width="248.4" height="30" rx="4" fill="#3b82f6" fill-opacity="0.6" stroke="none" stroke-width="1.6"/>
    <text x="40" y="243" text-anchor="start" class="sm bold">educational notes</text>
    <rect x="40" y="252" width="154.56" height="30" rx="4" fill="#0d9488" fill-opacity="0.8" stroke="#0d9488" stroke-width="1.6"/>
    <text x="40" y="309" text-anchor="start" class="sm bold">draft notes</text>
    <rect x="40" y="318" width="99.36" height="30" rx="4" fill="#059669" fill-opacity="0.6" stroke="none" stroke-width="1.6"/>
    <line x1="238.72" y1="96" x2="238.72" y2="372" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
    <text x="238.72" y="388" text-anchor="middle" class="sm bold">binding</text>
  </g>
</svg>
