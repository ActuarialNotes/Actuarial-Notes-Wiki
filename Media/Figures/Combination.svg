<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 246" width="560" height="246" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="244.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">C(4,2) = 6 — order does not matter</text>
  <circle cx="74" cy="78" r="16" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="74" y="83" text-anchor="middle" class="sm">A</text>
  <circle cx="120" cy="78" r="16" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="120" y="83" text-anchor="middle" class="sm">B</text>
  <circle cx="166" cy="78" r="16" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="166" y="83" text-anchor="middle" class="sm">C</text>
  <circle cx="212" cy="78" r="16" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="212" y="83" text-anchor="middle" class="sm">D</text>
  <text x="140" y="112" text-anchor="middle" class="sm dim">choose 2 of these 4</text>
  <rect x="48" y="133" width="52" height="30" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="74" y="153" text-anchor="middle" class="sm">AB</text>
  <rect x="110" y="133" width="52" height="30" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="136" y="153" text-anchor="middle" class="sm">AC</text>
  <rect x="172" y="133" width="52" height="30" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="198" y="153" text-anchor="middle" class="sm">AD</text>
  <rect x="48" y="177" width="52" height="30" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="74" y="197" text-anchor="middle" class="sm">BC</text>
  <rect x="110" y="177" width="52" height="30" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="136" y="197" text-anchor="middle" class="sm">BD</text>
  <rect x="172" y="177" width="52" height="30" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="198" y="197" text-anchor="middle" class="sm">CD</text>
  <text x="136" y="226" text-anchor="middle" class="sm bold" fill="#059669">6 selections</text>
  <text x="410" y="74" text-anchor="middle" class="sm bold">C(n,k) = n! / [k!(n−k)!]</text>
  <text x="410" y="96" text-anchor="middle" class="sm dim">C(4,2) = 24 / (2 · 2) = 6</text>
  <rect x="300" y="116" width="224" height="46" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="412" y="134" text-anchor="middle" class="sm">AB and BA are the same choice</text>
  <text x="412" y="150" text-anchor="middle" class="sm dim">divide the 12 orderings by 2! = 2</text>
  <rect x="300" y="172" width="224" height="46" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="412" y="190" text-anchor="middle" class="sm">C(n,k) = C(n, n−k)</text>
  <text x="412" y="206" text-anchor="middle" class="sm dim">picking who is in = picking who is out</text>
</svg>
