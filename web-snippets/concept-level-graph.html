<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept Level Graph — Actuarial Notes snippet</title>
<style>
  /* Preview-page-only styles — not part of the embeddable snippet. */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: hsl(250 35% 9%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 16px;
  }
</style>
</head>
<body>

<!-- ============================================================
     COPY START — paste everything from here to "COPY END" into
     your site's HTML/embed block. Swap the questions in the
     QUESTIONS array at the bottom of the <script> to reuse this
     for a different concept — each correct answer advances the
     ladder one level; a miss leaves it where it was.
============================================================ -->
<div class="an-mastery">
  <div class="an-mastery-head">
    <p class="an-mastery-tag">Concept Mastery · Probability</p>
    <p class="an-mastery-current">Level: <span class="an-mastery-current-label">New</span></p>
  </div>

  <div class="an-mastery-ladder">
    <div class="an-mastery-track"><span class="an-mastery-fill"></span></div>
    <div class="an-mastery-nodes">
      <div class="an-mastery-node" data-level="0">
        <span class="an-mastery-dot"></span>
        <span class="an-mastery-label">New</span>
      </div>
      <div class="an-mastery-node" data-level="1">
        <span class="an-mastery-dot"></span>
        <span class="an-mastery-label">Level 1</span>
      </div>
      <div class="an-mastery-node" data-level="2">
        <span class="an-mastery-dot"></span>
        <span class="an-mastery-label">Level 2</span>
      </div>
      <div class="an-mastery-node" data-level="3">
        <span class="an-mastery-dot"></span>
        <span class="an-mastery-label">Level 3</span>
      </div>
    </div>
  </div>

  <p class="an-mastery-toast" role="status" aria-live="polite">
    Answer correctly to level this concept up.
  </p>

  <div class="an-mastery-quiz">
    <p class="an-mastery-quiz-question"></p>
    <div class="an-mastery-quiz-options" role="radiogroup" aria-label="Answer options"></div>
  </div>

  <button type="button" class="an-mastery-reset">Reset demo</button>
</div>

<style>
  .an-mastery {
    --an-bg: hsl(250 30% 14%);
    --an-fg: hsl(240 30% 96%);
    --an-muted: hsl(240 15% 70%);
    --an-border: hsl(250 25% 26%);
    --an-primary: hsl(263 85% 66%);
    --an-good: hsl(158 64% 45%);
    --an-bad: hsl(350 80% 62%);
    --an-c1: rgb(56 189 248);
    --an-c2: rgb(232 121 249);
    --an-c3: rgb(250 204 21);
    width: 100%;
    max-width: 440px;
    box-sizing: border-box;
    background: var(--an-bg);
    border: 1px solid var(--an-border);
    border-radius: 16px;
    padding: 22px;
    color: var(--an-fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .an-mastery * { box-sizing: border-box; }

  .an-mastery-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .an-mastery-tag {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--an-primary);
  }
  .an-mastery-current {
    margin: 0;
    font-size: 12px;
    color: var(--an-muted);
  }
  .an-mastery-current-label {
    font-weight: 800;
    color: var(--an-fg);
  }

  /* ---- Ladder ---- */
  .an-mastery-ladder {
    position: relative;
    padding: 10px 0 26px;
  }
  .an-mastery-track {
    position: absolute;
    top: 19px;
    left: 19px;
    right: 19px;
    height: 3px;
    border-radius: 999px;
    background: hsl(0 0% 100% / 0.08);
    overflow: hidden;
  }
  .an-mastery-fill {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--an-primary), var(--an-c2));
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(0.4, 0.1, 0.2, 1);
  }
  .an-mastery-nodes {
    position: relative;
    display: flex;
    justify-content: space-between;
  }
  .an-mastery-node {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 25%;
  }
  .an-mastery-dot {
    position: relative;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: var(--an-bg);
    border: 2px solid hsl(0 0% 100% / 0.18);
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
  }
  .an-mastery-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--an-muted);
    white-space: nowrap;
  }

  /* Reached (this level or below current progress) */
  .an-mastery-node.an-reached .an-mastery-dot {
    background: var(--an-primary);
    border-color: var(--an-primary);
  }
  .an-mastery-node.an-reached .an-mastery-label {
    color: var(--an-fg);
  }
  /* Currently-active node gets a soft pulsing ring */
  .an-mastery-node.an-current .an-mastery-dot {
    transform: scale(1.15);
    box-shadow: 0 0 0 4px hsl(263 85% 66% / 0.25);
  }
  /* Level 2: static three-colour foil ring, same recipe as the app's
     "level 2" flashcard sheen. */
  .an-mastery-node[data-level="2"].an-reached .an-mastery-dot::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(115deg, var(--an-c1), var(--an-c2), var(--an-c3));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
  /* Level 3: animated rainbow foil ring, same recipe as the app's
     "level 3" flashcard sheen — the fully mastered state. */
  .an-mastery-node[data-level="3"].an-reached .an-mastery-dot::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    padding: 2px;
    background: linear-gradient(115deg, var(--an-c1), var(--an-c2), var(--an-c3), var(--an-c1));
    background-size: 300% 100%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: an-mastery-foil-shift 3s linear infinite;
  }
  @keyframes an-mastery-foil-shift {
    to { background-position: 300% 0; }
  }

  /* Level-up "snake" flash — a comet of colour that chases around the
     node the instant it's reached, spinning faster before it settles. */
  .an-mastery-node.an-leveling .an-mastery-dot::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 999px;
    padding: 2px;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 290deg,
      var(--an-c1) 306deg, var(--an-c2) 325deg, var(--an-c3) 344deg, transparent 360deg);
    animation: an-mastery-snake-spin 0.9s cubic-bezier(0.45, 0, 0.9, 0.45) forwards;
  }
  @keyframes an-mastery-snake-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(1080deg); }
  }
  .an-mastery-node.an-pop .an-mastery-dot {
    animation: an-mastery-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes an-mastery-pop {
    0%   { transform: scale(0.7); }
    60%  { transform: scale(1.3); }
    100% { transform: scale(1.15); }
  }

  /* ---- Toast ---- */
  .an-mastery-toast {
    margin: 4px 0 16px;
    min-height: 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--an-muted);
    transition: color 0.2s ease;
  }
  .an-mastery-toast.an-good { color: var(--an-good); }
  .an-mastery-toast.an-bad { color: var(--an-bad); }

  /* ---- Embedded quiz ---- */
  .an-mastery-quiz-question {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.45;
  }
  .an-mastery-quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .an-mastery-opt {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: hsl(0 0% 100% / 0.04);
    border: 1px solid var(--an-border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--an-fg);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .an-mastery-opt:hover:not(:disabled) {
    border-color: var(--an-primary);
    background: hsl(263 85% 66% / 0.08);
  }
  .an-mastery-opt:active:not(:disabled) { transform: scale(0.99); }
  .an-mastery-opt.an-is-correct {
    border-color: var(--an-good);
    background: hsl(158 64% 45% / 0.14);
  }
  .an-mastery-opt.an-is-wrong {
    border-color: var(--an-bad);
    background: hsl(350 80% 62% / 0.12);
  }
  .an-mastery-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: hsl(0 0% 100% / 0.08);
    font-size: 11px;
    font-weight: 800;
  }

  .an-mastery-reset {
    margin-top: 16px;
    background: none;
    border: 1px solid var(--an-border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--an-fg);
    cursor: pointer;
  }
  .an-mastery-reset:hover { border-color: var(--an-primary); }

  .an-mastery-done .an-mastery-quiz { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .an-mastery-node.an-leveling .an-mastery-dot::after,
    .an-mastery-node[data-level="3"].an-reached .an-mastery-dot::before,
    .an-mastery-node.an-pop .an-mastery-dot { animation: none; }
  }
</style>

<script>
(function () {
  var LEVEL_LABELS = ['New', 'Level 1', 'Level 2', 'Level 3'];

  // One question per level-up. Swap these out to demo a different
  // concept — each entry: the question, four options, and the index
  // (0-based) of the correct one.
  var QUESTIONS = [
    {
      q: 'You flip a fair coin 3 times. What’s the probability all three land the same way (HHH or TTT)?',
      options: ['1/8', '1/4', '1/2', '3/8'],
      answer: 1
    },
    {
      q: 'A fair six-sided die is rolled once. What’s the probability of rolling a number greater than 4?',
      options: ['1/6', '1/3', '1/2', '2/3'],
      answer: 1
    },
    {
      q: 'Independent events A and B have P(A) = 0.4 and P(B) = 0.5. What’s P(A and B)?',
      options: ['0.1', '0.2', '0.45', '0.9'],
      answer: 1
    }
  ];

  document.querySelectorAll('.an-mastery').forEach(function (widget) {
    if (widget.dataset.anBound) return;
    widget.dataset.anBound = 'true';

    var level = 0;
    var qIndex = 0;

    var nodes = widget.querySelectorAll('.an-mastery-node');
    var fill = widget.querySelector('.an-mastery-fill');
    var currentLabel = widget.querySelector('.an-mastery-current-label');
    var toast = widget.querySelector('.an-mastery-toast');
    var qEl = widget.querySelector('.an-mastery-quiz-question');
    var optsEl = widget.querySelector('.an-mastery-quiz-options');
    var resetBtn = widget.querySelector('.an-mastery-reset');

    function renderLadder(justLeveled) {
      currentLabel.textContent = LEVEL_LABELS[level];
      fill.style.width = (level / 3 * 100) + '%';
      nodes.forEach(function (node) {
        var lvl = parseInt(node.dataset.level, 10);
        node.classList.toggle('an-reached', lvl <= level);
        node.classList.toggle('an-current', lvl === level);
        node.classList.remove('an-leveling', 'an-pop');
        if (justLeveled && lvl === level && lvl > 0) {
          // Restart the level-up flourish on the node just reached.
          void node.offsetWidth; // eslint-disable-line no-void
          node.classList.add('an-leveling', 'an-pop');
        }
      });
    }

    function renderQuestion() {
      if (level >= 3 || qIndex >= QUESTIONS.length) {
        widget.classList.add('an-mastery-done');
        toast.textContent = 'Mastered! 🎉 (Reset to try the demo again.)';
        toast.className = 'an-mastery-toast an-good';
        return;
      }
      var item = QUESTIONS[qIndex];
      qEl.textContent = item.q;
      optsEl.innerHTML = '';
      item.options.forEach(function (text, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'an-mastery-opt';
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', 'false');
        btn.innerHTML = '<span class="an-mastery-letter">' + String.fromCharCode(65 + i) +
          '</span><span>' + text + '</span>';
        btn.addEventListener('click', function () { answer(i, btn); });
        optsEl.appendChild(btn);
      });
    }

    function answer(index, btn) {
      var item = QUESTIONS[qIndex];
      var correct = index === item.answer;
      var buttons = optsEl.querySelectorAll('.an-mastery-opt');
      buttons.forEach(function (b, i) {
        b.disabled = true;
        if (i === item.answer) b.classList.add('an-is-correct');
        if (i === index && !correct) b.classList.add('an-is-wrong');
      });

      if (correct) {
        level = Math.min(3, level + 1);
        toast.textContent = 'Correct! Leveled up: ' + LEVEL_LABELS[level - 1] + ' → ' + LEVEL_LABELS[level] + '.';
        toast.className = 'an-mastery-toast an-good';
        renderLadder(true);
        qIndex++;
        setTimeout(renderQuestion, 1300);
      } else {
        toast.textContent = 'Not quite — no level change. Give it another shot.';
        toast.className = 'an-mastery-toast an-bad';
        setTimeout(function () {
          buttons.forEach(function (b) {
            b.disabled = false;
            b.classList.remove('an-is-correct', 'an-is-wrong');
          });
        }, 1100);
      }
    }

    function reset() {
      level = 0;
      qIndex = 0;
      widget.classList.remove('an-mastery-done');
      toast.textContent = 'Answer correctly to level this concept up.';
      toast.className = 'an-mastery-toast';
      renderLadder(false);
      renderQuestion();
    }

    resetBtn.addEventListener('click', reset);
    renderLadder(false);
    renderQuestion();
  });
})();
</script>

</body>
</html>
