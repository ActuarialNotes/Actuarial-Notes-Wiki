<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Emergence in the period against what the previous valuation implied</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Did the year emerge the way it was meant</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">to?</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Expected = U_prior × Δ(1 / CDF)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">A/E = Actual emergence / Expected emergence</text>
  <line x1="100.2" y1="114" x2="100.2" y2="312" class="grid"/>
  <line x1="148.6" y1="114" x2="148.6" y2="312" class="grid"/>
  <line x1="197" y1="114" x2="197" y2="312" class="grid"/>
  <line x1="245.4" y1="114" x2="245.4" y2="312" class="grid"/>
  <line x1="293.8" y1="114" x2="293.8" y2="312" class="grid"/>
  <line x1="76" y1="312" x2="318" y2="312" class="grid"/>
  <line x1="76" y1="227.14" x2="318" y2="227.14" class="grid"/>
  <line x1="76" y1="142.29" x2="318" y2="142.29" class="grid"/>
  <line x1="76" y1="312" x2="328" y2="312" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="312" x2="76" y2="104" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="100.2" y1="312" x2="100.2" y2="316" class="tick"/>
  <text x="100.2" y="328" text-anchor="middle" class="sm dim">2020</text>
  <line x1="148.6" y1="312" x2="148.6" y2="316" class="tick"/>
  <text x="148.6" y="328" text-anchor="middle" class="sm dim">2021</text>
  <line x1="197" y1="312" x2="197" y2="316" class="tick"/>
  <text x="197" y="328" text-anchor="middle" class="sm dim">2022</text>
  <line x1="245.4" y1="312" x2="245.4" y2="316" class="tick"/>
  <text x="245.4" y="328" text-anchor="middle" class="sm dim">2023</text>
  <line x1="293.8" y1="312" x2="293.8" y2="316" class="tick"/>
  <text x="293.8" y="328" text-anchor="middle" class="sm dim">2024</text>
  <line x1="72" y1="312" x2="76" y2="312" class="tick"/>
  <text x="68" y="315.6" text-anchor="end" class="sm dim">0</text>
  <line x1="72" y1="227.14" x2="76" y2="227.14" class="tick"/>
  <text x="68" y="230.74" text-anchor="end" class="sm dim">300</text>
  <line x1="72" y1="142.29" x2="76" y2="142.29" class="tick"/>
  <text x="68" y="145.89" text-anchor="end" class="sm dim">600</text>
  <rect x="83.71" y="300.69" width="15.49" height="11.31" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="101.2" y="301.82" width="15.49" height="10.18" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="132.11" y="286.54" width="15.49" height="25.46" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="149.6" y="288.24" width="15.49" height="23.76" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="180.51" y="261.09" width="15.49" height="50.91" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="198" y="252.6" width="15.49" height="59.4" rx="2" fill="#e11d48" fill-opacity="0.72"/>
  <rect x="228.91" y="215.83" width="15.49" height="96.17" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="246.4" y="193.2" width="15.49" height="118.8" rx="2" fill="#e11d48" fill-opacity="0.72"/>
  <rect x="277.31" y="130.97" width="15.49" height="181.03" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="294.8" y="139.46" width="15.49" height="172.54" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <line x1="104" y1="106" x2="117" y2="106" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="123" y="109.6" text-anchor="start" class="sm">expected</text>
  <line x1="216" y1="106" x2="229" y2="106" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="235" y="109.6" text-anchor="start" class="sm">actual</text>
  <text x="180" y="342" text-anchor="middle" class="sm dim">emergence during 2024 ($000)</text>
  <text x="180" y="366" text-anchor="middle" class="sm bold">2022 and 2023 ran hot: A/E 1.17 and 1.24</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">— investigate before the next full review</text>
</svg>
