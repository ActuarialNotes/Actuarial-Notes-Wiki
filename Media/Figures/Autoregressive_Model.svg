<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An AR(1) forecast decaying geometrically back to the long-run mean</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Regress the series on its own past</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Y_t = c + φ₁Y_{t−1} + ⋯ + φ_pY_{t−p} + ε_t</text>
  <line x1="64" y1="100" x2="64" y2="312" class="grid"/>
  <line x1="155.76" y1="100" x2="155.76" y2="312" class="grid"/>
  <line x1="239.88" y1="100" x2="239.88" y2="312" class="grid"/>
  <line x1="316.35" y1="100" x2="316.35" y2="312" class="grid"/>
  <line x1="64" y1="273.45" x2="324" y2="273.45" class="grid"/>
  <line x1="64" y1="225.27" x2="324" y2="225.27" class="grid"/>
  <line x1="64" y1="177.09" x2="324" y2="177.09" class="grid"/>
  <line x1="64" y1="128.91" x2="324" y2="128.91" class="grid"/>
  <line x1="64" y1="312" x2="334" y2="312" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="312" x2="64" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="312" x2="64" y2="316" class="tick"/>
  <line x1="155.76" y1="312" x2="155.76" y2="316" class="tick"/>
  <line x1="239.88" y1="312" x2="239.88" y2="316" class="tick"/>
  <text x="239.88" y="328" text-anchor="middle" class="sm dim">now</text>
  <line x1="316.35" y1="312" x2="316.35" y2="316" class="tick"/>
  <line x1="60" y1="273.45" x2="64" y2="273.45" class="tick"/>
  <text x="56" y="277.05" text-anchor="end" class="sm dim">0.7</text>
  <line x1="60" y1="225.27" x2="64" y2="225.27" class="tick"/>
  <text x="56" y="228.87" text-anchor="end" class="sm dim">0.8</text>
  <line x1="60" y1="177.09" x2="64" y2="177.09" class="tick"/>
  <text x="56" y="180.69" text-anchor="end" class="sm dim">0.9</text>
  <line x1="60" y1="128.91" x2="64" y2="128.91" class="tick"/>
  <text x="56" y="132.51" text-anchor="end" class="sm dim">1</text>
  <polyline points="64,170.15 71.65,163.44 79.29,173.16 86.94,226.31 94.59,232.49 102.24,254.29 109.88,236.02 117.53,238.04 125.18,207.96 132.82,235.57 140.47,178.78 148.12,225.11 155.76,207.54 163.41,206.48 171.06,191.52 178.71,138.7 186.35,138.05 194,172.2 201.65,136.86 209.29,174.7 216.94,207.2 224.59,190.47 232.24,200.66 239.88,167.45" class="curve" stroke="#3b82f6" stroke-width="1.9"/>
  <polyline points="239.88,167.45 247.53,184.8 255.18,196.94 262.82,205.44 270.47,211.39 278.12,215.56 285.76,218.47 293.41,220.51 301.06,221.94 308.71,222.94 316.35,223.64" class="curve dash" stroke="#059669" stroke-width="2.2"/>
  <line x1="64" y1="225.27" x2="324" y2="225.27" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="316.35" y="290.32" text-anchor="end" class="sm bold" fill="#d97706">μ = c/(1 − φ) = 0.80</text>
  <line x1="239.88" y1="312" x2="239.88" y2="119.27" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="180" y="346" text-anchor="middle" class="sm bold">Ŷ_{t+h} = μ + φ^h (Y_t − μ)</text>
  <text x="180" y="364" text-anchor="middle" class="sm dim">0.884, then 0.859, then 0.841 …</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">stationary iff every root lies outside the circle</text>
</svg>
