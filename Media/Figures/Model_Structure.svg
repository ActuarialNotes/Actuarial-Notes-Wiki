<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The terms of a linear predictor: main effects, an interaction and a transform</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Which terms go into the predictor</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">η = β₀ + β₁x₁ + β₂x₂ + β₃x₁x₂ + β₄x₁²</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">distribution and link are chosen separately</text>
  <rect x="36" y="96" width="76" height="28" rx="14.0" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="74" y="114" text-anchor="middle" class="bold">β₀</text>
  <text x="124" y="114" text-anchor="start" class="sm dim">intercept — the base level</text>
  <rect x="36" y="152" width="76" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="74" y="170" text-anchor="middle" class="bold">β₁x₁</text>
  <text x="124" y="170" text-anchor="start" class="sm dim">main effect: territory</text>
  <text x="40" y="170" text-anchor="middle" class="bold">+</text>
  <rect x="36" y="208" width="76" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="74" y="226" text-anchor="middle" class="bold">β₂x₂</text>
  <text x="124" y="226" text-anchor="start" class="sm dim">main effect: vehicle age</text>
  <text x="40" y="226" text-anchor="middle" class="bold">+</text>
  <rect x="36" y="264" width="76" height="28" rx="14.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="74" y="282" text-anchor="middle" class="bold">β₃x₁x₂</text>
  <text x="124" y="282" text-anchor="start" class="sm dim">interaction — effects not additive</text>
  <text x="40" y="282" text-anchor="middle" class="bold">+</text>
  <rect x="36" y="320" width="76" height="28" rx="14.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="74" y="338" text-anchor="middle" class="bold">β₄x₁²</text>
  <text x="124" y="338" text-anchor="start" class="sm dim">transform — a curved effect</text>
  <text x="40" y="338" text-anchor="middle" class="bold">+</text>
</svg>
