<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A customer's discounted profit by policy year, negative in the first year, with the running total climbing to a lifetime value of 81</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="68" y1="344" x2="322" y2="344" class="grid"/>
    <line x1="68" y1="269.93" x2="322" y2="269.93" class="grid"/>
    <line x1="68" y1="195.85" x2="322" y2="195.85" class="grid"/>
    <line x1="68" y1="121.78" x2="322" y2="121.78" class="grid"/>
    <line x1="68" y1="269.93" x2="332" y2="269.93" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="344" x2="68" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="344" x2="68" y2="344" class="tick"/>
    <text x="60" y="347.6" text-anchor="end" class="sm dim">-40</text>
    <line x1="64" y1="269.93" x2="68" y2="269.93" class="tick"/>
    <text x="60" y="273.53" text-anchor="end" class="sm dim">0</text>
    <line x1="64" y1="195.85" x2="68" y2="195.85" class="tick"/>
    <text x="60" y="199.45" text-anchor="end" class="sm dim">40</text>
    <line x1="64" y1="121.78" x2="68" y2="121.78" class="tick"/>
    <text x="60" y="125.38" text-anchor="end" class="sm dim">80</text>
    <rect x="81.58" y="269.93" width="22" height="62.96" rx="1.5" fill="#e11d48" fill-opacity="0.72"/>
    <text x="92.58" y="360" text-anchor="middle" class="sm dim">1</text>
    <rect x="122.55" y="229.19" width="22" height="40.74" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="133.55" y="360" text-anchor="middle" class="sm dim">2</text>
    <rect x="163.52" y="214.37" width="22" height="55.56" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="174.52" y="360" text-anchor="middle" class="sm dim">3</text>
    <rect x="204.48" y="221.78" width="22" height="48.15" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="215.48" y="360" text-anchor="middle" class="sm dim">4</text>
    <rect x="245.45" y="231.04" width="22" height="38.89" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="256.45" y="360" text-anchor="middle" class="sm dim">5</text>
    <rect x="286.42" y="240.3" width="22" height="29.63" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="297.42" y="360" text-anchor="middle" class="sm dim">6</text>
    <text x="322" y="376" text-anchor="end" class="sm dim">policy year</text>
    <polyline points="92.58,332.89 133.55,292.15 174.52,236.59 215.48,188.44 256.45,149.56 297.42,119.93" class="curve" stroke="#059669" stroke-width="2.4"/>
    <circle cx="92.58" cy="332.89" r="3.2" fill="#059669"/>
    <circle cx="133.55" cy="292.15" r="3.2" fill="#059669"/>
    <circle cx="174.52" cy="236.59" r="3.2" fill="#059669"/>
    <circle cx="215.48" cy="188.44" r="3.2" fill="#059669"/>
    <circle cx="256.45" cy="149.56" r="3.2" fill="#059669"/>
    <circle cx="297.42" cy="119.93" r="3.2" fill="#059669"/>
    <text x="305.42" y="123.93" text-anchor="start" class="sm bold">81</text>
    <text x="250.45" y="141.56" text-anchor="end" class="sm bold">lifetime value</text>
  </g>
</svg>
