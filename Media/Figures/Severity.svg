  <line x1="94" y1="336" x2="94" y2="111" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="91" y="105" text-anchor="end" class="sm bold" fill="var(--dim)">median 5.0</text>
  <line x1="106.42" y1="336" x2="106.42" y2="111" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="109.42" y="105" text-anchor="start" class="sm bold" fill="#059669">mean 6.35</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">claim size ($000s)</text>
