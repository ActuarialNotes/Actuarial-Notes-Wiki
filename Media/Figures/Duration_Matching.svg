<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>Assets and liabilities matched in value and duration</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Match the value and the duration, and small rate moves cancel</text>
  <line x1="88" y1="138" x2="438" y2="138" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="96" y1="134" x2="96" y2="142" class="tick"/>
  <text x="96" y="155" text-anchor="middle" class="sm dim">0</text>
  <line x1="136.5" y1="134" x2="136.5" y2="142" class="tick"/>
  <line x1="177" y1="134" x2="177" y2="142" class="tick"/>
  <line x1="217.5" y1="134" x2="217.5" y2="142" class="tick"/>
  <line x1="258" y1="134" x2="258" y2="142" class="tick"/>
  <line x1="298.5" y1="134" x2="298.5" y2="142" class="tick"/>
  <line x1="339" y1="134" x2="339" y2="142" class="tick"/>
  <line x1="379.5" y1="134" x2="379.5" y2="142" class="tick"/>
  <line x1="420" y1="134" x2="420" y2="142" class="tick"/>
  <line x1="177" y1="138" x2="177" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="177" y="92" text-anchor="middle" class="sm">asset</text>
  <line x1="379.5" y1="138" x2="379.5" y2="86" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="379.5" y="80" text-anchor="middle" class="sm">asset</text>
  <line x1="298.5" y1="138" x2="298.5" y2="192" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="298.5" y="208" text-anchor="middle" class="sm">liability</text>
  <polygon points="258,222 249,236 267,236" fill="#d97706"/>
  <line x1="96" y1="222" x2="420" y2="222" stroke="#d97706" stroke-width="1.6"/>
  <text x="258" y="254" text-anchor="middle" class="sm dim">the two streams balance at the same point</text>
  <line x1="28" y1="268" x2="532" y2="268" class="rule"/>
  <text x="150" y="288" text-anchor="middle" class="sm bold">PV(A) = PV(L)   and   D(A) = D(L)</text>
  <text x="412" y="288" text-anchor="middle" class="sm bold">Add C(A) ≥ C(L) for Redington</text>
</svg>
