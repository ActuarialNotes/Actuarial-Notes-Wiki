<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Earned premium less losses, LAE and expenses leaving the underwriting margin</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">What the insurance operation earns on</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">its own</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">UW Profit = EP − Loss − LAE − Expenses</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">UW Margin = 1 − Combined Ratio</text>
  <text x="180" y="116" text-anchor="middle" class="sm dim">per $520 of earned premium</text>
  <rect x="46" y="136" width="268" height="30" rx="4" fill="#7c3aed" fill-opacity="0.24" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="156" text-anchor="middle" class="sm">earned premium  520</text>
  <rect x="46" y="190" width="154.62" height="26" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="210.62" y="208" text-anchor="start" class="sm">− losses 300</text>
  <rect x="46" y="234" width="30.92" height="26" rx="3" fill="#0d9488" fill-opacity="0.6"/>
  <text x="86.92" y="252" text-anchor="start" class="sm">− LAE 60</text>
  <rect x="46" y="278" width="69.06" height="26" rx="3" fill="#d97706" fill-opacity="0.6"/>
  <text x="125.06" y="296" text-anchor="start" class="sm">− expenses 134</text>
  <rect x="46" y="322" width="13.4" height="26" rx="3" fill="#059669" fill-opacity="0.6"/>
  <text x="69.4" y="340" text-anchor="start" class="sm bold">= profit 26</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">26 / 520 = 5.0% — a 95% combined ratio</text>
</svg>
