  <text x="180" y="430" text-anchor="middle" class="fml">f(y) = exp{ (yθ − b(θ))/a(φ) + c(y, φ) }</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Var(Y) = φ · V(μ)</text>
