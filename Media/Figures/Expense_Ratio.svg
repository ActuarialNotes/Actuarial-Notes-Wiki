<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The underwriting expense ratio broken into its four components</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Non-claim cost as a share of premium</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Expense Ratio = UW Expenses / Premium</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">20.0 + 3.0 + 3.0 variable + 4.8 fixed = 30.8%</text>
  <text x="170" y="132" text-anchor="end" class="sm">Commission &amp; brokerage</text>
  <rect x="178" y="119" width="132" height="20" rx="3" fill="#3b82f6" fill-opacity="0.70"/>
  <text x="317" y="132" text-anchor="start" class="sm">20.0</text>
  <text x="170" y="147" text-anchor="end" class="sm dim">variable</text>
  <text x="170" y="180" text-anchor="end" class="sm">Taxes, licences, fees</text>
  <rect x="178" y="167" width="19.8" height="20" rx="3" fill="#0d9488" fill-opacity="0.70"/>
  <text x="204.8" y="180" text-anchor="start" class="sm">3.0</text>
  <text x="170" y="195" text-anchor="end" class="sm dim">variable</text>
  <text x="170" y="228" text-anchor="end" class="sm">Other acquisition</text>
  <rect x="178" y="215" width="19.8" height="20" rx="3" fill="#7c3aed" fill-opacity="0.70"/>
  <text x="204.8" y="228" text-anchor="start" class="sm">3.0</text>
  <text x="170" y="243" text-anchor="end" class="sm dim">variable</text>
  <text x="170" y="276" text-anchor="end" class="sm">General expenses</text>
  <rect x="178" y="263" width="31.68" height="20" rx="3" fill="#d97706" fill-opacity="0.70"/>
  <text x="216.68" y="276" text-anchor="start" class="sm">4.8</text>
  <text x="170" y="291" text-anchor="end" class="sm dim">fixed</text>
  <line x1="178" y1="112" x2="178" y2="328" class="rule"/>
  <text x="180" y="356" text-anchor="middle" class="sm dim">which column an expense sits in decides</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">whether it is divided or added</text>
</svg>
