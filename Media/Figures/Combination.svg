<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The six unordered pairs chosen from four objects</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <circle cx="78" cy="104" r="18" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="78" y="110" text-anchor="middle">A</text>
    <circle cx="146" cy="104" r="18" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="146" y="110" text-anchor="middle">B</text>
    <circle cx="214" cy="104" r="18" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="214" y="110" text-anchor="middle">C</text>
    <circle cx="282" cy="104" r="18" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="282" y="110" text-anchor="middle">D</text>
    <text x="180" y="152" text-anchor="middle" class="sm dim">choose 2 of these 4</text>
    <rect x="58" y="182" width="64" height="36" rx="7" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="90" y="206" text-anchor="middle">AB</text>
    <rect x="148" y="182" width="64" height="36" rx="7" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="180" y="206" text-anchor="middle">AC</text>
    <rect x="238" y="182" width="64" height="36" rx="7" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="270" y="206" text-anchor="middle">AD</text>
    <rect x="58" y="244" width="64" height="36" rx="7" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="90" y="268" text-anchor="middle">BC</text>
    <rect x="148" y="244" width="64" height="36" rx="7" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="180" y="268" text-anchor="middle">BD</text>
    <rect x="238" y="244" width="64" height="36" rx="7" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="270" y="268" text-anchor="middle">CD</text>
    <text x="180" y="322" text-anchor="middle" class="sm dim">AB and BA are the same choice</text>
  </g>
</svg>
