<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Coupon rate against yield rate, and the pricing it implies</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Coupon rate is fixed at issue; yield is</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">not</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">r = coupon / F</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">what matters is Fr vs Cj, not r vs j</text>
  <rect x="48" y="148.96" width="68" height="151.04" rx="4" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="1.3"/>
  <line x1="38" y1="172" x2="126" y2="172" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="82" y="228.48" text-anchor="middle" class="sm bold">P &gt; C</text>
  <text x="82" y="320" text-anchor="middle" class="bold">r &gt; j</text>
  <text x="82" y="338" text-anchor="middle" class="sm dim">premium</text>
  <rect x="146" y="172" width="68" height="128" rx="4" fill="#059669" fill-opacity="0.35" stroke="#059669" stroke-width="1.3"/>
  <line x1="136" y1="172" x2="224" y2="172" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="180" y="240" text-anchor="middle" class="sm bold">P = C</text>
  <text x="180" y="320" text-anchor="middle" class="bold">r = j</text>
  <text x="180" y="338" text-anchor="middle" class="sm dim">par</text>
  <rect x="244" y="192.48" width="68" height="107.52" rx="4" fill="#3b82f6" fill-opacity="0.35" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="234" y1="172" x2="322" y2="172" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="278" y="250.24" text-anchor="middle" class="sm bold">P &lt; C</text>
  <text x="278" y="320" text-anchor="middle" class="bold">r &lt; j</text>
  <text x="278" y="338" text-anchor="middle" class="sm dim">discount</text>
  <text x="46" y="176" text-anchor="end" class="sm dim">C</text>
</svg>
