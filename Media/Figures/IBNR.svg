<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Reported claims whose case reserves will still grow, the IBNER, beside claims not yet reported at all, the pure IBNR</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="36" y="230" width="28" height="110" rx="2" fill="#d97706" fill-opacity="0.5" stroke="#d97706" stroke-width="1.2"/>
    <rect x="36" y="160" width="28" height="70" rx="2" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="76" y="275" width="28" height="65" rx="2" fill="#d97706" fill-opacity="0.5" stroke="#d97706" stroke-width="1.2"/>
    <rect x="76" y="225" width="28" height="50" rx="2" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="116" y="220" width="28" height="120" rx="2" fill="#d97706" fill-opacity="0.5" stroke="#d97706" stroke-width="1.2"/>
    <rect x="116" y="152" width="28" height="68" rx="2" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="156" y="275" width="28" height="65" rx="2" fill="#d97706" fill-opacity="0.5" stroke="#d97706" stroke-width="1.2"/>
    <rect x="156" y="235" width="28" height="40" rx="2" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="216" y="245" width="28" height="95" rx="2" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="256" y="210" width="28" height="130" rx="2" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="296" y="253" width="28" height="87" rx="2" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="28" y1="340" x2="332" y2="340" class="axis"/>
    <text x="110" y="142" text-anchor="middle" class="sm bold">IBNER 570</text>
    <text x="270" y="200" text-anchor="middle" class="sm bold">pure IBNR 780</text>
    <text x="110" y="358" text-anchor="middle" class="sm">case 900</text>
  </g>
</svg>
