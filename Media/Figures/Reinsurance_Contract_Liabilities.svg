<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Reinsurance assumed measured exactly as insurance issued — and the reporting lag that makes it harder</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Reinsurance assumed is insurance issued</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Liability = LRC + LIC, as always</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">— it is held reinsurance that is the asset</text>
  <rect x="30" y="100" width="143" height="102" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
  <rect x="30" y="100" width="143" height="26" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="117" text-anchor="middle" class="sm bold" fill="#059669">Held</text>
  <text x="101.5" y="146" text-anchor="middle" class="sm">reinsurance bought</text>
  <text x="101.5" y="168" text-anchor="middle" class="sm">an asset</text>
  <text x="101.5" y="190" text-anchor="middle" class="sm">recoveries in</text>
  <rect x="187" y="100" width="143" height="124" rx="7" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="187" y="100" width="143" height="26" rx="7" fill="#e11d48" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="117" text-anchor="middle" class="sm bold" fill="#e11d48">Issued</text>
  <text x="258.5" y="146" text-anchor="middle" class="sm">reinsurance</text>
  <text x="258.5" y="168" text-anchor="middle" class="sm">assumed</text>
  <text x="258.5" y="190" text-anchor="middle" class="sm">a liability</text>
  <text x="258.5" y="212" text-anchor="middle" class="sm">claims out</text>
  <text x="180" y="234" text-anchor="middle" class="sm dim">confusing the direction is the first error</text>
  <line x1="30" y1="254" x2="330" y2="254" class="rule"/>
  <text x="180" y="276" text-anchor="middle" class="sm bold">and the assuming reinsurer's own problem</text>
  <line x1="48" y1="316" x2="322" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="70" y1="311" x2="70" y2="321" class="tick"/>
  <text x="70" y="335" text-anchor="middle" class="sm dim">loss</text>
  <line x1="150" y1="311" x2="150" y2="321" class="tick"/>
  <text x="150" y="335" text-anchor="middle" class="sm dim">cedant</text>
  <line x1="250" y1="311" x2="250" y2="321" class="tick"/>
  <text x="250" y="335" text-anchor="middle" class="sm dim">report</text>
  <rect x="70" y="294" width="180" height="16" rx="3" fill="#d97706" fill-opacity="0.45"/>
  <text x="160" y="306" text-anchor="middle" class="sm">not yet reported to the reinsurer</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">so a reinsurer's disclosed confidence level sits</text>
  <text x="180" y="378" text-anchor="middle" class="sm dim">above a primary insurer's — the data are later</text>
</svg>
