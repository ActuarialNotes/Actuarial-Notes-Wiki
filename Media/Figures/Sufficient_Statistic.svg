<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A sample funnelled into one number that keeps every piece of information about the parameter</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">One number that keeps all the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">information</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">f(x | T = t, θ) = f(x | T = t)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">f(x | θ) = g(T(x), θ) · h(x)</text>
  <text x="180" y="86" text-anchor="middle" class="bold">X₁, X₂, …, Xₙ</text>
  <circle cx="66" cy="118" r="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="66" y="122" text-anchor="middle" class="sm">xᵢ</text>
  <line x1="66" y1="132" x2="180" y2="170" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <circle cx="112" cy="118" r="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="112" y="122" text-anchor="middle" class="sm">xᵢ</text>
  <line x1="112" y1="132" x2="180" y2="170" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <circle cx="158" cy="118" r="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="158" y="122" text-anchor="middle" class="sm">xᵢ</text>
  <line x1="158" y1="132" x2="180" y2="170" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <circle cx="204" cy="118" r="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="204" y="122" text-anchor="middle" class="sm">xᵢ</text>
  <line x1="204" y1="132" x2="180" y2="170" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <circle cx="250" cy="118" r="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="250" y="122" text-anchor="middle" class="sm">xᵢ</text>
  <line x1="250" y1="132" x2="180" y2="170" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <circle cx="296" cy="118" r="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="296" y="122" text-anchor="middle" class="sm">xᵢ</text>
  <line x1="296" y1="132" x2="180" y2="170" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <rect x="105" y="173" width="150" height="30" rx="15.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="192" text-anchor="middle" class="bold">T(X) = Σ Xᵢ</text>
  <line x1="180" y1="206" x2="180" y2="234" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <rect x="60" y="236" width="240" height="52" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="256" text-anchor="middle" class="sm">θ̂ built from T alone</text>
  <text x="180" y="274" text-anchor="middle" class="sm dim">loses nothing</text>
  <text x="180" y="316" text-anchor="middle" class="sm dim">the leftover detail carries no θ</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">Poisson: T = ΣXᵢ      Normal: T = (ΣXᵢ, ΣXᵢ²)</text>
</svg>
