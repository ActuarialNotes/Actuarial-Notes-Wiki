62.53,101.87 263.91,101.14 265.29,100.41 266.67,99.67 268.04,98.93 269.42,98.19 270.8,97.45 272.18,96.71 273.56,95.96 274.93,95.21 276.31,94.46 277.69,93.7 279.07,92.94 280.44,92.18 281.82,91.42 283.2,90.66 284.58,89.89 285.96,89.12 287.33,88.34 288.71,87.57 290.09,86.79 291.47,86.01 292.84,85.23 294.22,84.44 295.6,83.65 296.98,82.86 298.36,82.07 299.73,81.27 301.11,80.47 302.49,79.67 303.87,78.87 305.24,78.06 306.62,77.25 308,76.44" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="130.27,163.75 254.27,108.38" class="curve" stroke="#d97706" stroke-width="1.6"/>
  <circle cx="192.27" cy="136.06" r="3.6" fill="#d97706"/>
  <text x="175.73" y="117.3" text-anchor="middle" class="sm" fill="#d97706">slope a′(t)</text>
  <line x1="60" y1="200" x2="318" y2="200" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="200" x2="60" y2="56" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="200" x2="60" y2="204" class="tick"/>
  <text x="60" y="216" text-anchor="middle" class="sm dim">0</text>
  <line x1="184" y1="200" x2="184" y2="204" class="tick"/>
  <text x="184" y="216" text-anchor="middle" class="sm dim">3</text>
  <line x1="308" y1="200" x2="308" y2="204" class="tick"/>
  <text x="308" y="216" text-anchor="middle" class="sm dim">6</text>
  <line x1="56" y1="186.6" x2="60" y2="186.6" class="tick"/>
  <text x="52" y="190.2" text-anchor="end" class="sm dim">1</text>
  <line x1="56" y1="119.6" x2="60" y2="119.6" class="tick"/>
  <text x="52" y="123.2" text-anchor="end" class="sm dim">1.5</text>
  <text x="308" y="232" text-anchor="end" class="sm dim">time t</text>
  <text x="56" y="52" text-anchor="start" class="sm dim">a(t) = e^(δt)</text>
  <text x="420" y="96" text-anchor="middle" class="sm bold">δ = a′(t) / a(t)</text>
  <text x="420" y="116" text-anchor="middle" class="sm dim">= d/dt · ln a(t)</text>
  <line x1="316" y1="136" x2="316" y2="168" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="148" text-anchor="start" class="sm bold">δ = ln(1 + i)</text>
  <text x="326" y="164" text-anchor="start" class="sm dim">and i = e^δ − 1</text>
  <line x1="316" y1="182" x2="316" y2="214" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="194" text-anchor="start" class="sm bold">a(t) = e^(δt)</text>
  <text x="326" y="210" text-anchor="start" class="sm dim">constant force</text>
  <line x1="316" y1="228" x2="316" y2="260" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="240" text-anchor="start" class="sm bold">Varying force</text>
  <text x="326" y="256" text-anchor="start" class="sm dim">a(t) = exp(∫₀ᵗ δ(s) ds)</text>
  <text x="280" y="270" text-anchor="middle" class="sm dim">δ is the m → ∞ limit of both i⁽ᵐ⁾ and d⁽ᵐ⁾</text>
</svg>
