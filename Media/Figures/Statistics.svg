  <text x="108" y="291" text-anchor="middle" class="sm">X̄ = 0.169</text>
  <text x="108" y="309" text-anchor="middle" class="sm dim">centre</text>
  <rect x="188" y="274" width="132" height="46" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="254" y="291" text-anchor="middle" class="sm">S² = 1.30</text>
  <text x="254" y="309" text-anchor="middle" class="sm dim">spread</text>
  <text x="180" y="368" text-anchor="middle" class="sm dim">estimates of μ and σ²</text>
</svg>
