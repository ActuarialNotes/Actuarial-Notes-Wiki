<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Written exposure earning out over the policy term in car-years</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Exposure earns exactly as premium does</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Earned Exposure = Written − ΔUnearned</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">Pure Premium = Losses / Earned Exposures</text>
    <line x1="72" y1="98" x2="72" y2="326" class="grid"/>
    <line x1="154.67" y1="98" x2="154.67" y2="326" class="grid"/>
    <line x1="237.33" y1="98" x2="237.33" y2="326" class="grid"/>
    <line x1="320" y1="98" x2="320" y2="326" class="grid"/>
    <line x1="72" y1="326" x2="320" y2="326" class="grid"/>
    <line x1="72" y1="222.36" x2="320" y2="222.36" class="grid"/>
    <line x1="72" y1="118.73" x2="320" y2="118.73" class="grid"/>
    <line x1="72" y1="326" x2="330" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="326" x2="72" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="326" x2="72" y2="330" class="tick"/>
    <text x="72" y="342" text-anchor="middle" class="sm dim">0</text>
    <line x1="154.67" y1="326" x2="154.67" y2="330" class="tick"/>
    <text x="154.67" y="342" text-anchor="middle" class="sm dim">4</text>
    <line x1="237.33" y1="326" x2="237.33" y2="330" class="tick"/>
    <text x="237.33" y="342" text-anchor="middle" class="sm dim">8</text>
    <line x1="320" y1="326" x2="320" y2="330" class="tick"/>
    <text x="320" y="342" text-anchor="middle" class="sm dim">12</text>
    <line x1="68" y1="326" x2="72" y2="326" class="tick"/>
    <text x="64" y="329.6" text-anchor="end" class="sm dim">0.00</text>
    <line x1="68" y1="222.36" x2="72" y2="222.36" class="tick"/>
    <text x="64" y="225.96" text-anchor="end" class="sm dim">0.50</text>
    <line x1="68" y1="118.73" x2="72" y2="118.73" class="tick"/>
    <text x="64" y="122.33" text-anchor="end" class="sm dim">1.00</text>
    <polyline points="72,326 320,118.73" class="curve" stroke="#059669" stroke-width="2.4"/>
    <circle cx="196" cy="222.36" r="3.6" fill="#059669"/>
    <text x="189" y="217.36" text-anchor="end" class="sm bold" fill="#059669">0.50</text>
    <circle cx="320" cy="118.73" r="3.6" fill="#059669"/>
    <text x="313" y="113.73" text-anchor="end" class="sm bold" fill="#059669">1.00</text>
    <text x="180" y="358" text-anchor="middle" class="sm dim">months of a one-car annual policy</text>
    <text x="180" y="374" text-anchor="middle" class="sm dim">a six-month policy is 0.5 car-years,</text>
    <text x="180" y="390" text-anchor="middle" class="sm dim">not one — exposure is counted, not policies</text>
  </g>
</svg>
