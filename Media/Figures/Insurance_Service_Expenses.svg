<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>What lands in insurance service expenses and what is routed to finance instead</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Past service here; the discount effect</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">elsewhere</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Claims + acquisition amortised</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">+ onerous losses — and nothing financial</text>
  <rect x="30" y="100" width="143" height="154" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="30" y="100" width="143" height="24" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="116" text-anchor="middle" class="sm bold" fill="#3b82f6">In</text>
  <text x="101.5" y="144" text-anchor="middle" class="sm">incurred claims</text>
  <text x="101.5" y="164" text-anchor="middle" class="sm">and ALAE</text>
  <text x="101.5" y="184" text-anchor="middle" class="sm">claims handling</text>
  <text x="101.5" y="204" text-anchor="middle" class="sm">acquisition</text>
  <text x="101.5" y="224" text-anchor="middle" class="sm">amortised</text>
  <text x="101.5" y="244" text-anchor="middle" class="sm">onerous losses</text>
  <rect x="187" y="100" width="143" height="154" rx="7" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="187" y="100" width="143" height="24" rx="7" fill="#e11d48" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="116" text-anchor="middle" class="sm bold" fill="#e11d48">Out</text>
  <text x="258.5" y="144" text-anchor="middle" class="sm">discount unwind</text>
  <text x="258.5" y="164" text-anchor="middle" class="sm">rate changes</text>
  <text x="258.5" y="184" text-anchor="middle" class="sm">general overhead</text>
  <text x="258.5" y="204" text-anchor="middle" class="sm">not attributable</text>
  <text x="258.5" y="224" text-anchor="middle" class="sm">reinsurance</text>
  <text x="258.5" y="244" text-anchor="middle" class="sm">recoveries</text>
  <line x1="30" y1="288" x2="330" y2="288" class="rule"/>
  <text x="180" y="310" text-anchor="middle" class="sm bold">the routing rule, in one line</text>
  <text x="180" y="334" text-anchor="middle" class="sm" fill="#3b82f6">past service → here, in profit or loss</text>
  <text x="180" y="354" text-anchor="middle" class="sm" fill="#059669">future service → the CSM, or a loss component</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">and on an onerous group the loss component offsets it</text>
</svg>
