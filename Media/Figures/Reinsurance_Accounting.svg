<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Whether a contract transfers significant insurance risk, and the two accountings that follow</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Everything turns on the risk transfer</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">test</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">No significant risk transfer</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">⇒ deposit accounting</text>
  <rect x="45" y="90" width="270" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="108" text-anchor="middle" class="sm">does it transfer significant risk?</text>
  <line x1="180" y1="120" x2="106" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="180" y1="120" x2="254" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <text x="120" y="146" text-anchor="middle" class="sm bold" fill="#059669">yes</text>
  <text x="240" y="146" text-anchor="middle" class="sm bold" fill="#e11d48">no</text>
  <rect x="36" y="164" width="132" height="92" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="102" y="204" text-anchor="middle" class="sm">reinsurance</text>
  <text x="102" y="222" text-anchor="middle" class="sm dim">a separate asset,</text>
  <text x="102" y="244" text-anchor="middle" class="sm dim">never netted</text>
  <rect x="192" y="164" width="132" height="92" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
  <text x="258" y="204" text-anchor="middle" class="sm">deposit</text>
  <text x="258" y="222" text-anchor="middle" class="sm dim">an asset accruing</text>
  <text x="258" y="244" text-anchor="middle" class="sm dim">interest — no relief</text>
  <line x1="30" y1="274" x2="330" y2="274" class="rule"/>
  <text x="38" y="296" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="296" text-anchor="start" class="sm">non-performance risk reduces the asset</text>
  <text x="38" y="322" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="322" text-anchor="start" class="sm">the income statement shows one net line</text>
  <text x="38" y="348" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="348" text-anchor="start" class="sm">and the MCT credit still needs registration</text>
</svg>
