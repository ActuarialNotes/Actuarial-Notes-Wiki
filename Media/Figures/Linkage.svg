<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two clusters joined three ways: complete linkage by their farthest pair, single linkage by their closest pair, and average linkage by every pair at once</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="70.92" y1="117.48" x2="269.83" y2="137.76" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="70.92" y1="117.48" x2="295.5" y2="249.28" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="70.92" y1="117.48" x2="257" y2="340.52" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="103" y1="218.86" x2="269.83" y2="137.76" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="103" y1="218.86" x2="295.5" y2="249.28" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="103" y1="218.86" x2="257" y2="340.52" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="64.5" y1="310.1" x2="269.83" y2="137.76" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="64.5" y1="310.1" x2="295.5" y2="249.28" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="64.5" y1="310.1" x2="257" y2="340.52" class="thin" stroke="#3b82f6" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="70.92" y1="117.48" x2="295.5" y2="249.28" class="thin" stroke="#e11d48" stroke-width="2.8"/>
    <line x1="103" y1="218.86" x2="257" y2="340.52" class="thin" stroke="#059669" stroke-width="2.8"/>
    <ellipse cx="79.47" cy="215.48" rx="46" ry="116" fill="none" stroke="var(--axis)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="70.92" cy="117.48" r="4.2" fill="var(--ink)"/>
    <circle cx="103" cy="218.86" r="4.2" fill="var(--ink)"/>
    <circle cx="64.5" cy="310.1" r="4.2" fill="var(--ink)"/>
    <ellipse cx="274.11" cy="242.52" rx="46" ry="116" fill="none" stroke="var(--axis)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="269.83" cy="137.76" r="4.2" fill="var(--ink)"/>
    <circle cx="295.5" cy="249.28" r="4.2" fill="var(--ink)"/>
    <circle cx="257" cy="340.52" r="4.2" fill="var(--ink)"/>
    <text x="183.21" y="171.38" text-anchor="middle" class="sm bold">complete</text>
    <text x="180" y="299.69" text-anchor="middle" class="sm bold">single</text>
    <text x="160.75" y="343.31" text-anchor="middle" class="sm bold">average</text>
  </g>
</svg>
