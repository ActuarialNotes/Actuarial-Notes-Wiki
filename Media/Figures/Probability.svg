<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Five of twelve equally likely outcomes shaded, and the resulting probability marked on a 0-to-1 scale</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Probability counts the outcomes that</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">work</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">P(E) = |E| / |S| = 5/12 ≈ 0.42</text>
  <rect x="40" y="82" width="280" height="168" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="53" y="98" text-anchor="middle" class="sm dim">S</text>
  <circle cx="86" cy="122" r="19" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="148" cy="122" r="19" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="210" cy="122" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="272" cy="122" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="86" cy="174" r="19" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="148" cy="174" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="210" cy="174" r="19" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="272" cy="174" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="86" cy="226" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="148" cy="226" r="19" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="210" cy="226" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="272" cy="226" r="19" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <text x="180" y="278" text-anchor="middle" class="sm dim">5 of the 12 outcomes are in E</text>
  <rect x="60" y="334" width="240" height="16" rx="8" fill="var(--soft)" stroke="var(--edge)"/>
  <rect x="60" y="334" width="100" height="16" rx="8" fill="#3b82f6" fill-opacity="0.55"/>
  <line x1="60" y1="352" x2="60" y2="357" class="tick"/>
  <text x="60" y="370" text-anchor="middle" class="sm dim">0</text>
  <line x1="300" y1="352" x2="300" y2="357" class="tick"/>
  <text x="300" y="370" text-anchor="middle" class="sm dim">1</text>
  <line x1="160" y1="308" x2="160" y2="330" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
  <text x="160" y="302" text-anchor="middle" class="sm bold" fill="#3b82f6">P(E)</text>
</svg>
