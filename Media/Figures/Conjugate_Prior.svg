<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A Gamma prior updated by Poisson data staying in the Gamma family</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvarink" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--ink)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The posterior stays in the prior's</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">family</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Gamma prior + Poisson data</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">⇒ Gamma(α + Σx, θ / (1 + nθ))</text>
  <rect x="38" y="100" width="118" height="62" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="97" y="125" text-anchor="middle" class="sm bold">Gamma(2, 0.10)</text>
  <text x="97" y="143" text-anchor="middle" class="sm dim">prior</text>
  <rect x="204" y="100" width="118" height="62" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="263" y="125" text-anchor="middle" class="sm bold">Gamma(3, 0.077)</text>
  <text x="263" y="143" text-anchor="middle" class="sm dim">posterior</text>
  <line x1="160" y1="131" x2="200" y2="131" class="thin" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ahvarink)"/>
  <text x="180" y="122" text-anchor="middle" class="sm dim">data</text>
  <text x="180" y="184" text-anchor="middle" class="sm dim">n = 3 years, Σx = 1 claim</text>
  <line x1="38" y1="208" x2="322" y2="208" class="rule"/>
  <text x="60" y="202" text-anchor="middle" class="sm dim">likelihood</text>
  <text x="160" y="202" text-anchor="middle" class="sm dim">prior</text>
  <text x="260" y="202" text-anchor="middle" class="sm dim">posterior</text>
  <text x="60" y="230" text-anchor="middle" class="sm">Poisson</text>
  <text x="160" y="230" text-anchor="middle" class="sm">Gamma</text>
  <text x="260" y="230" text-anchor="middle" class="sm">Gamma</text>
  <line x1="38" y1="238" x2="322" y2="238" class="rule"/>
  <text x="60" y="255" text-anchor="middle" class="sm">Bernoulli</text>
  <text x="160" y="255" text-anchor="middle" class="sm">Beta</text>
  <text x="260" y="255" text-anchor="middle" class="sm">Beta</text>
  <line x1="38" y1="263" x2="322" y2="263" class="rule"/>
  <text x="60" y="280" text-anchor="middle" class="sm">Normal</text>
  <text x="160" y="280" text-anchor="middle" class="sm">Normal</text>
  <text x="260" y="280" text-anchor="middle" class="sm">Normal</text>
  <line x1="38" y1="288" x2="322" y2="288" class="rule"/>
  <text x="60" y="305" text-anchor="middle" class="sm">Exponential</text>
  <text x="160" y="305" text-anchor="middle" class="sm">Inv. Gamma</text>
  <text x="260" y="305" text-anchor="middle" class="sm">Inv. Gamma</text>
  <line x1="38" y1="313" x2="322" y2="313" class="rule"/>
  <text x="180" y="390" text-anchor="middle" class="sm dim">conjugate ⇒ Bayesian = Bühlmann exactly</text>
</svg>
