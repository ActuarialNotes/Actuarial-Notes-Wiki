<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Seven claims with the third large loss on the seventh, above the negative binomial mass function of the trial count</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Trials until the r-th success</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(X = k) = C(k−1, r−1) pʳ (1 − p)ᵏ⁻ʳ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[X] = r/p,   Var(X) = r(1 − p)/p²</text>
  <text x="180" y="92" text-anchor="middle" class="sm dim">each claim is a large loss with probability 0.25</text>
  <rect x="74" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="105" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="136" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="167" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="198" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="229" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="260" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="256" y="98" width="34" height="34" rx="8" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <text x="180" y="154" text-anchor="middle" class="sm bold" fill="#3b82f6">the 3rd large loss is the 7th claim → k = 7</text>
  <line x1="71.24" y1="330" x2="71.24" y2="310.22" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="71.24" cy="310.22" r="2.8" fill="#3b82f6"/>
  <line x1="89.97" y1="330" x2="89.97" y2="285.5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="89.97" cy="285.5" r="2.8" fill="#3b82f6"/>
  <line x1="108.7" y1="330" x2="108.7" y2="263.24" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="108.7" cy="263.24" r="2.8" fill="#3b82f6"/>
  <line x1="127.44" y1="330" x2="127.44" y2="246.55" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="127.44" cy="246.55" r="2.8" fill="#3b82f6"/>
  <line x1="164.9" y1="330" x2="164.9" y2="231.43" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="164.9" cy="231.43" r="2.8" fill="#3b82f6"/>
  <line x1="183.63" y1="330" x2="183.63" y2="231.43" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="183.63" cy="231.43" r="2.8" fill="#3b82f6"/>
  <line x1="202.37" y1="330" x2="202.37" y2="234.95" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="202.37" cy="234.95" r="2.8" fill="#3b82f6"/>
  <line x1="221.1" y1="330" x2="221.1" y2="240.89" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="221.1" cy="240.89" r="2.8" fill="#3b82f6"/>
  <line x1="239.83" y1="330" x2="239.83" y2="248.32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="239.83" cy="248.32" r="2.8" fill="#3b82f6"/>
  <line x1="258.56" y1="330" x2="258.56" y2="256.48" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="258.56" cy="256.48" r="2.8" fill="#3b82f6"/>
  <line x1="277.3" y1="330" x2="277.3" y2="264.84" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="277.3" cy="264.84" r="2.8" fill="#3b82f6"/>
  <line x1="296.03" y1="330" x2="296.03" y2="272.98" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="296.03" cy="272.98" r="2.8" fill="#3b82f6"/>
  <line x1="314.76" y1="330" x2="314.76" y2="280.66" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="314.76" cy="280.66" r="2.8" fill="#3b82f6"/>
  <line x1="146.17" y1="330" x2="146.17" y2="236.12" stroke="#d97706" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="146.17" cy="236.12" r="3.8" fill="#d97706"/>
  <line x1="60" y1="330" x2="336" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="330" x2="60" y2="182" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="71.24" y1="330" x2="71.24" y2="334" class="tick"/>
  <text x="71.24" y="346" text-anchor="middle" class="sm dim">3</text>
  <line x1="108.7" y1="330" x2="108.7" y2="334" class="tick"/>
  <text x="108.7" y="346" text-anchor="middle" class="sm dim">5</text>
  <line x1="146.17" y1="330" x2="146.17" y2="334" class="tick"/>
  <text x="146.17" y="346" text-anchor="middle" class="sm dim">7</text>
  <line x1="183.63" y1="330" x2="183.63" y2="334" class="tick"/>
  <text x="183.63" y="346" text-anchor="middle" class="sm dim">9</text>
  <line x1="221.1" y1="330" x2="221.1" y2="334" class="tick"/>
  <text x="221.1" y="346" text-anchor="middle" class="sm dim">11</text>
  <line x1="258.56" y1="330" x2="258.56" y2="334" class="tick"/>
  <text x="258.56" y="346" text-anchor="middle" class="sm dim">13</text>
  <line x1="296.03" y1="330" x2="296.03" y2="334" class="tick"/>
  <text x="296.03" y="346" text-anchor="middle" class="sm dim">15</text>
  <text x="326" y="362" text-anchor="end" class="sm dim">k</text>
  <text x="56" y="178" text-anchor="start" class="sm dim">P(X = k)</text>
  <text x="146.17" y="225.12" text-anchor="middle" class="sm bold" fill="#d97706">0.074</text>
</svg>
