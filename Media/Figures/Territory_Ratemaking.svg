<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A grid of territories carrying spatially correlated relativities</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Geography is correlated with its</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">neighbours</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Territory Relativity = PP_i / PP_base</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Rate_i = Base Rate × Territory Relativity</text>
  <rect x="108" y="122" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.06" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="128" y="146" text-anchor="middle" class="sm">0.72</text>
  <rect x="150" y="122" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.09" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="170" y="146" text-anchor="middle" class="sm">0.78</text>
  <rect x="192" y="122" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.17" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="212" y="146" text-anchor="middle" class="sm">0.88</text>
  <rect x="234" y="122" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.22" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="254" y="146" text-anchor="middle" class="sm">0.95</text>
  <rect x="108" y="164" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.11" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="128" y="188" text-anchor="middle" class="sm">0.80</text>
  <rect x="150" y="164" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.22" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="170" y="188" text-anchor="middle" class="sm">0.95</text>
  <rect x="192" y="164" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.36" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="212" y="188" text-anchor="middle" class="sm">1.15</text>
  <rect x="234" y="164" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.32" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="254" y="188" text-anchor="middle" class="sm">1.10</text>
  <rect x="108" y="206" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.18" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="128" y="230" text-anchor="middle" class="sm">0.90</text>
  <rect x="150" y="206" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.40" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="170" y="230" text-anchor="middle" class="sm">1.20</text>
  <rect x="192" y="206" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.58" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="212" y="230" text-anchor="middle" class="sm">1.45</text>
  <rect x="234" y="206" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.41" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="254" y="230" text-anchor="middle" class="sm">1.22</text>
  <rect x="108" y="248" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.14" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="128" y="272" text-anchor="middle" class="sm">0.85</text>
  <rect x="150" y="248" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.29" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="170" y="272" text-anchor="middle" class="sm">1.05</text>
  <rect x="192" y="248" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.38" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="212" y="272" text-anchor="middle" class="sm">1.18</text>
  <rect x="234" y="248" width="40" height="40" rx="3" fill="#e11d48" fill-opacity="0.25" stroke="var(--edge)" stroke-width="0.8"/>
  <text x="254" y="272" text-anchor="middle" class="sm">1.00</text>
  <text x="180" y="316" text-anchor="middle" class="sm dim">the city centre and its ring, not a list</text>
  <text x="180" y="334" text-anchor="middle" class="sm dim">of independent cells</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">neighbouring territories inform one another —</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">and the boundaries are themselves a decision</text>
</svg>
