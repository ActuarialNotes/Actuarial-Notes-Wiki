  <text x="180" y="40" text-anchor="middle" class="ttl">Level payment versus level principal</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">level:  P = L / a₍ₙ₎</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">constant principal: interest = i·L·(n+1)/2</text>
