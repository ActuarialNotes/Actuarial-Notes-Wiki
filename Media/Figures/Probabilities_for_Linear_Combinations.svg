  <line x1="384" y1="226" x2="384" y2="256" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="394" y="237" text-anchor="start" class="sm bold">Then standardise</text>
  <text x="394" y="252" text-anchor="start" class="sm dim">P(L ≤ c) = Φ((c − μ_L)/σ_L)</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">Standard deviations never add — only variances do</text>
