  <line x1="106.67" y1="310" x2="106.67" y2="314" class="tick"/>
  <text x="106.67" y="326" text-anchor="middle" class="sm dim">500</text>
  <line x1="149.33" y1="310" x2="149.33" y2="314" class="tick"/>
  <text x="149.33" y="326" text-anchor="middle" class="sm dim">1,000</text>
