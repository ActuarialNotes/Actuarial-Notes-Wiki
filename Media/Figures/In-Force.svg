<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A vertical cut through the book at one date, counting the policies then providing coverage</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A stock at a date, not a flow over a</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">period</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">In-force = # { effective ≤ t &lt; expiry }</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">measured at an instant, not over a period</text>
  <line x1="48" y1="124" x2="48" y2="306" class="grid"/>
  <line x1="138" y1="124" x2="138" y2="306" class="grid"/>
  <line x1="228" y1="124" x2="228" y2="306" class="grid"/>
  <line x1="318" y1="124" x2="318" y2="306" class="grid"/>
  <line x1="40" y1="306" x2="334" y2="306" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <text x="93" y="322" text-anchor="middle" class="sm dim">2023</text>
  <text x="183" y="322" text-anchor="middle" class="sm dim">2024</text>
  <text x="273" y="322" text-anchor="middle" class="sm dim">2025</text>
  <rect x="61.5" y="140.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="102" y="170.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="142.5" y="200.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="174" y="230.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="205.5" y="260.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
  <line x1="183" y1="122" x2="183" y2="306" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
  <text x="183" y="114" text-anchor="middle" class="sm bold" fill="#e11d48">valuation date</text>
  <circle cx="183" cy="176" r="4.4" fill="#e11d48"/>
  <circle cx="183" cy="206" r="4.4" fill="#e11d48"/>
  <circle cx="183" cy="236" r="4.4" fill="#e11d48"/>
  <text x="180" y="344" text-anchor="middle" class="sm dim">3 of the 5 policies are in force —</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">written and earned both count different things</text>
</svg>
