<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The predictable unwind of discount beside the volatile effect of a rate change</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Two effects, one predictable and one not</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">IFIE = unwind of discount</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">+ effect of rate changes</text>
  <line x1="68" y1="232" x2="334" y2="232" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="232" x2="68" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <polyline points="68,197.5 110.67,188.01 153.33,177.66 196,167.31 238.67,156.1 281.33,144.89 324,132.81" class="curve" stroke="#0d9488" stroke-width="2.4"/>
  <polyline points="196,167.31 198.56,128.5" class="curve" stroke="#e11d48" stroke-width="2.4"/>
  <polyline points="198.56,128.5 238.67,118.15 281.33,106.94 324,95.72" class="curve dash" stroke="#e11d48" stroke-width="2.4"/>
  <text x="132" y="203.6" text-anchor="middle" class="sm bold" fill="#0d9488">unwind</text>
  <text x="204.53" y="118.15" text-anchor="start" class="sm bold" fill="#e11d48">rates fall</text>
  <text x="180" y="254" text-anchor="middle" class="sm dim">the liability, period by period</text>
  <line x1="30" y1="274" x2="330" y2="274" class="rule"/>
  <text x="180" y="296" text-anchor="middle" class="sm dim">kept out of the insurance service result, so</text>
  <text x="180" y="312" text-anchor="middle" class="sm dim">underwriting is measured on its own</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">a fall in rates raises the liability and produces</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">a finance expense — while the bonds backing it</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">gain in value, often through OCI</text>
</svg>
