<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" width="560" height="322" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="320.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Independence: the joint density factors and the support is a rectangle</text>
  <rect x="76" y="82" width="152" height="152" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <ellipse cx="152" cy="158.0" rx="26" ry="18" transform="rotate(0 152 158.0)" fill="#059669" fill-opacity="0.28" stroke="#059669" stroke-width="1"/>
  <ellipse cx="152" cy="158.0" rx="44" ry="31" transform="rotate(0 152 158.0)" fill="#059669" fill-opacity="0.17" stroke="#059669" stroke-width="1"/>
  <ellipse cx="152" cy="158.0" rx="62" ry="43" transform="rotate(0 152 158.0)" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1"/>
  <line x1="76" y1="234" x2="240" y2="234" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="234" x2="76" y2="72" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="152" y="258" text-anchor="middle" class="sm bold" fill="#059669">Independent</text>
  <text x="152" y="274" text-anchor="middle" class="sm dim">f(x, y) = f_X(x) f_Y(y)</text>
  <text x="152" y="290" text-anchor="middle" class="sm dim">Cov = 0</text>
  <rect x="326" y="82" width="152" height="152" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <ellipse cx="402" cy="158.0" rx="26" ry="18" transform="rotate(-30 402 158.0)" fill="#e11d48" fill-opacity="0.28" stroke="#e11d48" stroke-width="1"/>
  <ellipse cx="402" cy="158.0" rx="44" ry="31" transform="rotate(-30 402 158.0)" fill="#e11d48" fill-opacity="0.17" stroke="#e11d48" stroke-width="1"/>
  <ellipse cx="402" cy="158.0" rx="62" ry="43" transform="rotate(-30 402 158.0)" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1"/>
  <line x1="326" y1="234" x2="490" y2="234" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="326" y1="234" x2="326" y2="72" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="402" y="258" text-anchor="middle" class="sm bold" fill="#e11d48">Dependent</text>
  <text x="402" y="274" text-anchor="middle" class="sm dim">cannot be factored</text>
  <text x="402" y="290" text-anchor="middle" class="sm dim">Cov ≠ 0 here</text>
  <line x1="28" y1="266" x2="532" y2="266" class="rule"/>
  <text x="38" y="288" text-anchor="start" class="sm bold">F(x,y) = F_X F_Y</text>
  <text x="38" y="306" text-anchor="start" class="sm dim">equivalently f = f_X f_Y</text>
  <text x="210" y="288" text-anchor="start" class="sm bold">E[XY] = E[X] E[Y]</text>
  <text x="210" y="306" text-anchor="start" class="sm dim">so Cov(X, Y) = 0</text>
  <text x="382" y="288" text-anchor="start" class="sm bold">Var(X+Y) = VarX + VarY</text>
  <text x="382" y="306" text-anchor="start" class="sm dim">no covariance survives</text>
</svg>
