<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The five concentrations that turn separate exposures into one, and the formula that cannot see them</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Exposures that look separate and are not</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Diversification is the assumption —</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">concentration is its failure</text>
    <rect x="30" y="98" width="300" height="38" rx="6" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
    <text x="42" y="122" text-anchor="start" class="sm bold">Geographic</text>
    <text x="318" y="122" text-anchor="end" class="sm dim">one earthquake, one wildfire</text>
    <rect x="30" y="144" width="300" height="38" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="42" y="168" text-anchor="start" class="sm bold">Counterparty</text>
    <text x="318" y="168" text-anchor="end" class="sm dim">one reinsurer, one issuer</text>
    <rect x="30" y="190" width="300" height="38" rx="6" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
    <text x="42" y="214" text-anchor="start" class="sm bold">Line or product</text>
    <text x="318" y="214" text-anchor="end" class="sm dim">one reserving error</text>
    <rect x="30" y="236" width="300" height="38" rx="6" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="42" y="260" text-anchor="start" class="sm bold">Jurisdictional</text>
    <text x="318" y="260" text-anchor="end" class="sm dim">one province's rate regime</text>
    <rect x="30" y="282" width="300" height="38" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="42" y="306" text-anchor="start" class="sm bold">Distribution</text>
    <text x="318" y="306" text-anchor="end" class="sm dim">one broker, one channel</text>
    <line x1="30" y1="340" x2="330" y2="340" class="rule"/>
    <text x="180" y="362" text-anchor="middle" class="sm dim">the MCT charges the same whether recoverables</text>
    <text x="180" y="378" text-anchor="middle" class="sm dim">sit with eight reinsurers or with one</text>
  </g>
</svg>
