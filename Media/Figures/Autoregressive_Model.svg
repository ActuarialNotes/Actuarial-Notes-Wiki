    <text x="316.35" y="322.02" text-anchor="end" class="sm bold" fill="#d97706">μ = 0.80</text>
    <line x1="239.88" y1="348" x2="239.88" y2="117.09" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  </g>
</svg>
