<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five territory bars above and below zero, each its own separately estimated coefficient β̂, with nothing pulling them toward the mean</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="64" y1="314.57" x2="324" y2="314.57" class="grid"/>
    <line x1="64" y1="221" x2="324" y2="221" class="grid"/>
    <line x1="64" y1="127.43" x2="324" y2="127.43" class="grid"/>
    <line x1="64" y1="221" x2="324" y2="221" class="axis"/>
    <line x1="64" y1="90" x2="64" y2="352" class="axis"/>
    <line x1="60" y1="314.57" x2="64" y2="314.57" class="tick"/>
    <text x="56" y="318.17" text-anchor="end" class="sm dim">-0.3</text>
    <line x1="60" y1="221" x2="64" y2="221" class="tick"/>
    <text x="56" y="224.6" text-anchor="end" class="sm dim">0</text>
    <line x1="60" y1="127.43" x2="64" y2="127.43" class="tick"/>
    <text x="56" y="131.03" text-anchor="end" class="sm dim">0.3</text>
    <text x="97.7" y="369" text-anchor="middle" class="sm dim">T1</text>
    <rect x="87.11" y="221" width="21.19" height="81.1" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="97.7" y="317.1" text-anchor="middle" class="sm bold">β̂₁</text>
    <text x="145.85" y="369" text-anchor="middle" class="sm dim">T2</text>
    <rect x="135.26" y="221" width="21.19" height="34.31" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="145.85" y="270.31" text-anchor="middle" class="sm bold">β̂₂</text>
    <text x="194" y="369" text-anchor="middle" class="sm dim">T3</text>
    <rect x="183.41" y="214.76" width="21.19" height="6.24" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="194" y="207.76" text-anchor="middle" class="sm bold">β̂₃</text>
    <text x="242.15" y="369" text-anchor="middle" class="sm dim">T4</text>
    <rect x="231.56" y="177.33" width="21.19" height="43.67" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="242.15" y="170.33" text-anchor="middle" class="sm bold">β̂₄</text>
    <text x="290.3" y="369" text-anchor="middle" class="sm dim">T5</text>
    <rect x="279.7" y="127.43" width="21.19" height="93.57" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="290.3" y="120.43" text-anchor="middle" class="sm bold">β̂₅</text>
    <line x1="64" y1="221" x2="324" y2="221" class="thin" stroke="var(--axis)" stroke-width="1.3"/>
    <line x1="64" y1="352" x2="324" y2="352" class="rule"/>
  </g>
</svg>
