<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The boundary ending where the insurer can reprice, and the guarantee that pushes it out</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">It ends where full repricing begins</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">In boundary ⟺ the insurer cannot</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">reprice fully for the risk</text>
    <line x1="40" y1="148" x2="330" y2="148" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="143" x2="56" y2="153" class="tick"/>
    <text x="56" y="167" text-anchor="middle" class="sm dim">issue</text>
    <line x1="168" y1="143" x2="168" y2="153" class="tick"/>
    <text x="168" y="167" text-anchor="middle" class="sm dim">renewal</text>
    <line x1="280" y1="143" x2="280" y2="153" class="tick"/>
    <text x="280" y="167" text-anchor="middle" class="sm dim">renewal</text>
    <rect x="56" y="122" width="112" height="18" rx="3" fill="#3b82f6" fill-opacity="0.50"/>
    <text x="112" y="135" text-anchor="middle" class="sm">in boundary</text>
    <text x="240" y="135" text-anchor="middle" class="sm dim">outside</text>
    <text x="180" y="108" text-anchor="middle" class="sm dim">an ordinary annual policy</text>
    <line x1="30" y1="190" x2="330" y2="190" class="rule"/>
    <line x1="40" y1="250" x2="330" y2="250" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <rect x="56" y="224" width="224" height="18" rx="3" fill="#e11d48" fill-opacity="0.50"/>
    <text x="168" y="237" text-anchor="middle" class="sm">in boundary</text>
    <text x="180" y="214" text-anchor="middle" class="sm dim">guaranteed renewable, at a capped price</text>
    <text x="180" y="270" text-anchor="middle" class="sm dim">the insurer cannot price for deterioration</text>
    <text x="180" y="306" text-anchor="middle" class="sm dim">so the boundary picks the model too: one year</text>
    <text x="180" y="322" text-anchor="middle" class="sm dim">makes a group PAA-eligible without argument</text>
    <text x="180" y="350" text-anchor="middle" class="sm dim">it is a legal and practical judgement, not</text>
    <text x="180" y="366" text-anchor="middle" class="sm dim">arithmetic — a regulatory cap on repricing</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">can extend a boundary the wording does not</text>
  </g>
</svg>
