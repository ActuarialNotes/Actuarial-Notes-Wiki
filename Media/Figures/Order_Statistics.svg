  <text x="107.92" y="209.85" text-anchor="middle" class="sm bold" fill="#d97706">min</text>
  <text x="252.08" y="209.85" text-anchor="middle" class="sm bold" fill="#e11d48">max</text>
  <text x="180" y="270" text-anchor="middle" class="sm dim">Uniform(0,1), n = 5</text>
  <text x="410" y="96" text-anchor="middle" class="sm bold">f_{X₍ₖ₎}(x) =</text>
  <text x="410" y="118" text-anchor="middle" class="sm dim">n! / [(k−1)!(n−k)!]</text>
  <text x="410" y="136" text-anchor="middle" class="sm dim">× F(x)^{k−1} [1−F(x)]^{n−k} f(x)</text>
  <rect x="304" y="156" width="216" height="56" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="412" y="176" text-anchor="middle" class="sm bold">Shortcuts worth memorising</text>
  <text x="412" y="194" text-anchor="middle" class="sm dim">F_min = 1 − [1−F]ⁿ,  F_max = Fⁿ</text>
  <rect x="304" y="222" width="216" height="52" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
