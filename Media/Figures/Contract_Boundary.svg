<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>One timeline with two boundaries: an ordinary annual policy's ends at the first renewal, where the insurer can reprice, while a guaranteed-renewable policy's runs through every capped renewal</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="36" y1="318" x2="336" y2="318" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="313" x2="56" y2="323" class="tick"/>
    <text x="56" y="337" text-anchor="middle" class="sm dim">issue</text>
    <line x1="146" y1="313" x2="146" y2="323" class="tick"/>
    <text x="146" y="337" text-anchor="middle" class="sm dim">renew</text>
    <line x1="236" y1="313" x2="236" y2="323" class="tick"/>
    <text x="236" y="337" text-anchor="middle" class="sm dim">renew</text>
    <line x1="326" y1="313" x2="326" y2="323" class="tick"/>
    <text x="326" y="337" text-anchor="middle" class="sm dim">renew</text>
    <rect x="56" y="136" width="270" height="52" rx="5" fill="#e11d48" fill-opacity="0.26" stroke="#e11d48" stroke-width="1.3"/>
    <text x="191" y="167" text-anchor="middle" class="bold">guaranteed</text>
    <rect x="56" y="222" width="90" height="52" rx="5" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="101" y="253" text-anchor="middle" class="bold">annual</text>
    <line x1="146" y1="208" x2="146" y2="318" class="thin dash" stroke="#3b82f6" stroke-width="1.6"/>
    <line x1="326" y1="122" x2="326" y2="318" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
    <text x="154" y="252" text-anchor="start" class="sm">reprice</text>
  </g>
</svg>
