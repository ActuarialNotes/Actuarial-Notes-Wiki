  <text x="253.61" y="230" text-anchor="end" class="sm bold" fill="#059669">log link ⇒ μ = e^η</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">log link ⇒ multiplicative rating factors</text>
</svg>
