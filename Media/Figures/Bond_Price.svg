  <text x="117.16" y="99.09" text-anchor="middle" class="sm bold">premium</text>
  <text x="263.91" y="180.69" text-anchor="middle" class="sm bold">discount</text>
  <line x1="72" y1="204" x2="336" y2="204" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="204" x2="72" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="100.22" y1="204" x2="100.22" y2="208" class="tick"/>
  <text x="100.22" y="220" text-anchor="middle" class="sm dim">2%</text>
  <line x1="184.89" y1="204" x2="184.89" y2="208" class="tick"/>
  <text x="184.89" y="220" text-anchor="middle" class="sm dim">5%</text>
  <line x1="269.56" y1="204" x2="269.56" y2="208" class="tick"/>
  <text x="269.56" y="220" text-anchor="middle" class="sm dim">8%</text>
  <line x1="68" y1="184.57" x2="72" y2="184.57" class="tick"/>
  <text x="64" y="188.17" text-anchor="end" class="sm dim">800</text>
  <line x1="68" y1="145.71" x2="72" y2="145.71" class="tick"/>
  <text x="64" y="149.31" text-anchor="end" class="sm dim">1,000</text>
  <line x1="68" y1="106.86" x2="72" y2="106.86" class="tick"/>
  <text x="64" y="110.46" text-anchor="end" class="sm dim">1,200</text>
  <text x="326" y="236" text-anchor="end" class="sm dim">yield j per period</text>
  <text x="68" y="54" text-anchor="start" class="sm dim">price</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">P = Fr·a₍ₙ₎ⱼ + C·vⁿ</text>
  <text x="430" y="120" text-anchor="middle" class="sm dim">F = C = 1,000, r = 5%, n = 10</text>
  <rect x="340" y="138" width="190" height="58" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="434" y="158" text-anchor="middle" class="sm bold">Premium/discount form</text>
  <text x="434" y="176" text-anchor="middle" class="sm dim">P = C + (Fr − Cj) a₍ₙ₎</text>
  <rect x="340" y="204" width="190" height="58" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="434" y="224" text-anchor="middle" class="sm bold">The sign of (Fr − Cj)</text>
  <text x="434" y="242" text-anchor="middle" class="sm dim">decides premium or discount</text>
  <text x="280" y="282" text-anchor="middle" class="sm dim">Price is just the PV of the bond's own cash flows at the yield</text>
</svg>
