<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Exposure entering the model with its coefficient fixed at one</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Exposure enters with coefficient 1</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ln μ = ln(exposure) + β₀ + Σ βⱼxⱼ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">μ / exposure = e^(β₀ + Σ βⱼxⱼ)</text>
  <line x1="74" y1="340" x2="336" y2="340" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="340" x2="74" y2="110" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="340" x2="74" y2="344" class="tick"/>
  <text x="74" y="356" text-anchor="middle" class="sm dim">0</text>
  <line x1="183.57" y1="340" x2="183.57" y2="344" class="tick"/>
  <text x="183.57" y="356" text-anchor="middle" class="sm dim">1</text>
  <line x1="293.13" y1="340" x2="293.13" y2="344" class="tick"/>
  <text x="293.13" y="356" text-anchor="middle" class="sm dim">2</text>
  <line x1="70" y1="340" x2="74" y2="340" class="tick"/>
  <text x="66" y="343.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="246.38" x2="74" y2="246.38" class="tick"/>
  <text x="66" y="249.98" text-anchor="end" class="sm dim">0.1</text>
  <line x1="70" y1="152.77" x2="74" y2="152.77" class="tick"/>
  <text x="66" y="156.37" text-anchor="end" class="sm dim">0.2</text>
  <text x="326" y="372" text-anchor="end" class="sm dim">exposure (years)</text>
  <text x="70" y="106" text-anchor="start" class="sm dim">expected claims</text>
