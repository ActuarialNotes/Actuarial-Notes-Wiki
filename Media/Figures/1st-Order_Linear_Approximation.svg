  <polyline points="76,73.38 322,209.28" class="curve" stroke="#d97706" stroke-width="1.6"/>
  <circle cx="199" cy="141.33" r="3.2" fill="var(--dim)"/>
  <line x1="117" y1="91.29" x2="117" y2="96.03" stroke="#e11d48" stroke-width="2.4"/>
  <circle cx="117" cy="91.29" r="3" fill="#3b82f6"/>
  <circle cx="117" cy="96.03" r="3" fill="#d97706"/>
  <line x1="281" y1="182.54" x2="281" y2="186.63" stroke="#e11d48" stroke-width="2.4"/>
  <circle cx="281" cy="182.54" r="3" fill="#3b82f6"/>
  <circle cx="281" cy="186.63" r="3" fill="#d97706"/>
  <text x="125.2" y="82.67" text-anchor="start" class="sm">understates the gain</text>
  <text x="272.8" y="176.53" text-anchor="end" class="sm">overstates the loss</text>
  <line x1="76" y1="200" x2="332" y2="200" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="200" x2="76" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="117" y1="200" x2="117" y2="204" class="tick"/>
  <text x="117" y="216" text-anchor="middle" class="sm dim">3%</text>
  <line x1="199" y1="200" x2="199" y2="204" class="tick"/>
  <text x="199" y="216" text-anchor="middle" class="sm dim">5%</text>
  <line x1="281" y1="200" x2="281" y2="204" class="tick"/>
  <text x="281" y="216" text-anchor="middle" class="sm dim">7%</text>
  <line x1="72" y1="170.67" x2="76" y2="170.67" class="tick"/>
  <text x="68" y="174.27" text-anchor="end" class="sm dim">900</text>
  <line x1="72" y1="112" x2="76" y2="112" class="tick"/>
  <text x="68" y="115.6" text-anchor="end" class="sm dim">1,100</text>
  <text x="322" y="232" text-anchor="end" class="sm dim">yield j</text>
  <text x="72" y="54" text-anchor="start" class="sm dim">price</text>
  <line x1="78" y1="252" x2="91" y2="252" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="97" y="255.6" text-anchor="start" class="sm">true price</text>
  <line x1="218" y1="252" x2="231" y2="252" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="237" y="255.6" text-anchor="start" class="sm">duration estimate</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">ΔP ≈ −D_Mod · P · Δj</text>
  <rect x="342" y="122" width="186" height="66" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
  <text x="435" y="144" text-anchor="middle" class="sm bold">Always an underestimate</text>
  <text x="435" y="164" text-anchor="middle" class="sm dim">understates gains when j falls</text>
  <text x="435" y="180" text-anchor="middle" class="sm dim">overstates losses when j rises</text>
  <rect x="342" y="198" width="186" height="66" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="435" y="220" text-anchor="middle" class="sm bold">Second-order fix</text>
  <text x="435" y="240" text-anchor="middle" class="sm dim">+ ½ · Convexity · P · (Δj)²</text>
  <text x="435" y="256" text-anchor="middle" class="sm dim">always a positive correction</text>
</svg>
