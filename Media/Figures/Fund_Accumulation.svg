<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A fund balance stepping up with deposits and interest</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A fund grows from interest and from</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">deposits</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">AVₙ = F₀(1 + i)ⁿ + Σ C_t (1 + i)^(n − t)</text>
  <rect x="77" y="235.7" width="44.4" height="114.3" rx="2" fill="#3b82f6" fill-opacity="0.22"/>
  <rect x="77" y="244.17" width="44.4" height="105.83" rx="2" fill="#3b82f6" fill-opacity="0.34"/>
  <rect x="127.4" y="194.81" width="44.4" height="155.19" rx="2" fill="#3b82f6" fill-opacity="0.22"/>
  <rect x="127.4" y="235.7" width="44.4" height="114.3" rx="2" fill="#3b82f6" fill-opacity="0.34"/>
  <rect x="177.8" y="150.64" width="44.4" height="199.36" rx="2" fill="#3b82f6" fill-opacity="0.22"/>
  <rect x="177.8" y="194.81" width="44.4" height="155.19" rx="2" fill="#3b82f6" fill-opacity="0.34"/>
  <rect x="228.2" y="155.86" width="44.4" height="194.14" rx="2" fill="#3b82f6" fill-opacity="0.22"/>
  <rect x="228.2" y="150.64" width="44.4" height="199.36" rx="2" fill="#3b82f6" fill-opacity="0.34"/>
  <rect x="278.6" y="108.58" width="44.4" height="241.42" rx="2" fill="#3b82f6" fill-opacity="0.22"/>
  <rect x="278.6" y="155.86" width="44.4" height="194.14" rx="2" fill="#3b82f6" fill-opacity="0.34"/>
  <polyline points="74,244.17 124.4,235.7 174.8,194.81 225.2,150.64 275.6,155.86 326,108.58" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="74" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="350" x2="74" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="350" x2="74" y2="354" class="tick"/>
  <text x="74" y="366" text-anchor="middle" class="sm dim">0</text>
  <line x1="124.4" y1="350" x2="124.4" y2="354" class="tick"/>
  <text x="124.4" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="174.8" y1="350" x2="174.8" y2="354" class="tick"/>
  <text x="174.8" y="366" text-anchor="middle" class="sm dim">2</text>
  <line x1="225.2" y1="350" x2="225.2" y2="354" class="tick"/>
  <text x="225.2" y="366" text-anchor="middle" class="sm dim">3</text>
  <line x1="275.6" y1="350" x2="275.6" y2="354" class="tick"/>
  <text x="275.6" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="326" y1="350" x2="326" y2="354" class="tick"/>
  <text x="326" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="70" y1="350" x2="74" y2="350" class="tick"/>
  <text x="66" y="353.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="244.17" x2="74" y2="244.17" class="tick"/>
  <text x="66" y="247.77" text-anchor="end" class="sm dim">1,000</text>
  <line x1="70" y1="138.33" x2="74" y2="138.33" class="tick"/>
  <text x="66" y="141.93" text-anchor="end" class="sm dim">2,000</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">year</text>
  <text x="70" y="82" text-anchor="start" class="sm dim">fund balance</text>
  <text x="149.6" y="186.81" text-anchor="middle" class="sm bold" fill="#059669">+300</text>
  <text x="200" y="142.64" text-anchor="middle" class="sm bold" fill="#059669">+300</text>
  <text x="250.4" y="147.86" text-anchor="middle" class="sm bold" fill="#e11d48">-200</text>
  <text x="300.8" y="100.58" text-anchor="middle" class="sm bold" fill="#059669">+300</text>
</svg>
