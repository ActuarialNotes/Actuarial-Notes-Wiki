<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The AIC curve bottoming out where fit stops paying for its parameters</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">AIC penalises the log-likelihood by 2</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">per parameter</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">AIC = −2ℓ(β̂) + 2p</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">smaller is better</text>
  <line x1="76" y1="342" x2="336" y2="342" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="342" x2="76" y2="104" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="96.83" y1="342" x2="96.83" y2="346" class="tick"/>
  <text x="96.83" y="358" text-anchor="middle" class="sm dim">1</text>
  <line x1="166.28" y1="342" x2="166.28" y2="346" class="tick"/>
  <text x="166.28" y="358" text-anchor="middle" class="sm dim">3</text>
  <line x1="235.72" y1="342" x2="235.72" y2="346" class="tick"/>
  <text x="235.72" y="358" text-anchor="middle" class="sm dim">5</text>
  <line x1="305.17" y1="342" x2="305.17" y2="346" class="tick"/>
  <text x="305.17" y="358" text-anchor="middle" class="sm dim">7</text>
  <line x1="72" y1="296.4" x2="76" y2="296.4" class="tick"/>
  <text x="68" y="300" text-anchor="end" class="sm dim">4,100</text>
  <line x1="72" y1="182.4" x2="76" y2="182.4" class="tick"/>
  <text x="68" y="186" text-anchor="end" class="sm dim">4,150</text>
  <text x="326" y="374" text-anchor="end" class="sm dim">parameters p</text>
  <text x="72" y="100" text-anchor="start" class="sm dim">AIC</text>
  <polyline points="96.83,132.24 131.56,225.72 166.28,291.84 201,330.6 235.72,321.48 270.44,305.52 305.17,278.16" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="96.83" cy="132.24" r="3.2" fill="#3b82f6"/>
  <circle cx="131.56" cy="225.72" r="3.2" fill="#3b82f6"/>
  <circle cx="166.28" cy="291.84" r="3.2" fill="#3b82f6"/>
  <circle cx="201" cy="330.6" r="3.2" fill="#3b82f6"/>
  <circle cx="235.72" cy="321.48" r="3.2" fill="#3b82f6"/>
  <circle cx="270.44" cy="305.52" r="3.2" fill="#3b82f6"/>
  <circle cx="305.17" cy="278.16" r="3.2" fill="#3b82f6"/>
  <circle cx="201" cy="330.6" r="5" fill="#e11d48"/>
  <text x="201" y="350.6" text-anchor="middle" class="sm bold" fill="#e11d48">best AIC</text>
  <text x="32" y="384" text-anchor="start" class="sm dim">adding terms stops paying at p = 4</text>
</svg>
