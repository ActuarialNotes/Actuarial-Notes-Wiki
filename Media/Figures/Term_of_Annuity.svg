  <line x1="74" y1="232" x2="290" y2="232" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="232" x2="74" y2="170" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="232" x2="74" y2="236" class="tick"/>
  <text x="74" y="248" text-anchor="middle" class="sm dim">0</text>
  <line x1="156.4" y1="232" x2="156.4" y2="236" class="tick"/>
  <text x="156.4" y="248" text-anchor="middle" class="sm dim">12</text>
  <line x1="280" y1="232" x2="280" y2="236" class="tick"/>
  <text x="280" y="248" text-anchor="middle" class="sm dim">30</text>
  <line x1="70" y1="215.75" x2="74" y2="215.75" class="tick"/>
