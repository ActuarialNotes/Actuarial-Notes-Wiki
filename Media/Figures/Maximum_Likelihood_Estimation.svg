  <circle cx="170" cy="139.88" r="4.4" fill="#e11d48"/>
  <text x="200" y="129.88" text-anchor="middle" class="sm bold" fill="#e11d48">λ̂ = 0.25</text>
  <text x="310.4" y="234.97" text-anchor="end" class="sm" fill="#3b82f6">ℓ(λ)</text>
  <text x="180" y="88" text-anchor="middle" class="sm dim">20 claims from 80 exposure-years</text>
</svg>
