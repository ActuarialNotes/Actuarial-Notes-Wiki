<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>What the annual return carries, and the quarterly return that keeps OSFI current between filings</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">One standardised filing, so insurers</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">compare</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Statements + exhibits + MCT</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">+ the Appointed Actuary's opinion</text>
    <rect x="30" y="96" width="300" height="46" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="116" text-anchor="middle" class="sm">Audited statements</text>
    <text x="180" y="131" text-anchor="middle" class="sm dim">position, income, OCI, equity, cash</text>
    <rect x="30" y="152" width="300" height="46" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.3"/>
    <text x="180" y="172" text-anchor="middle" class="sm">Supplementary exhibits</text>
    <text x="180" y="187" text-anchor="middle" class="sm dim">by province and class; claims development</text>
    <rect x="30" y="208" width="300" height="46" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.3"/>
    <text x="180" y="228" text-anchor="middle" class="sm">The MCT calculation</text>
    <text x="180" y="243" text-anchor="middle" class="sm dim">available, required, buffer</text>
    <rect x="30" y="264" width="300" height="46" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="180" y="284" text-anchor="middle" class="sm">The AA's report</text>
    <text x="180" y="299" text-anchor="middle" class="sm dim">and the Statement of Actuarial Opinion</text>
    <line x1="30" y1="328" x2="330" y2="328" class="rule"/>
    <text x="180" y="350" text-anchor="middle" class="sm dim">the claims development exhibit is the one analysts</text>
    <text x="180" y="366" text-anchor="middle" class="sm dim">read first — it shows every prior year's estimate</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">moving, filing after filing</text>
  </g>
</svg>
