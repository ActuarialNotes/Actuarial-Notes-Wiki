<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The combined ratio split into its parts, and the four families of ratio a Canadian analyst reads</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">One filing, one instruction set,</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">comparable ratios</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Combined = (claims + expenses)</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">÷ earned premium — 64% + 31% = 95%</text>
    <rect x="40" y="115" width="179.2" height="34" rx="4" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="129.6" y="136" text-anchor="middle" class="sm">loss 64%</text>
    <rect x="219.2" y="115" width="86.8" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <text x="262.6" y="136" text-anchor="middle" class="sm">exp 31%</text>
    <rect x="306" y="115" width="14" height="34" rx="4" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.2"/>
    <text x="320" y="166" text-anchor="end" class="sm" fill="#059669">underwriting profit 5%</text>
    <line x1="30" y1="190" x2="330" y2="190" class="rule"/>
    <text x="38" y="212" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="212" text-anchor="start" class="sm">profitability — loss, expense, combined, ROE</text>
    <text x="38" y="238" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="238" text-anchor="start" class="sm">leverage — premium and reserves to surplus</text>
    <text x="38" y="264" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="264" text-anchor="start" class="sm">adequacy — one- and two-year development</text>
    <text x="38" y="290" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="290" text-anchor="start" class="sm">capital — the MCT ratio, and its trend</text>
    <text x="180" y="336" text-anchor="middle" class="sm dim">no single ratio diagnoses anything — distress is</text>
    <text x="180" y="352" text-anchor="middle" class="sm dim">rapid growth, thin capital and adverse development</text>
    <text x="180" y="368" text-anchor="middle" class="sm dim">arriving together</text>
    <text x="180" y="390" text-anchor="middle" class="sm dim">and under IFRS 17 revenue is not earned premium</text>
  </g>
</svg>
