<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The premium column split into 69% for losses, 26% for expenses and a thin 5% profit slice on top, with the 95% combined ratio marked below it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="126" y="182.8" width="84" height="193.2" rx="2" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="168" y="283.4" text-anchor="middle" class="sm">69%</text>
    <text x="222" y="283.4" text-anchor="start" class="sm">losses</text>
    <rect x="126" y="110" width="84" height="72.8" rx="2" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.2"/>
    <text x="168" y="150.4" text-anchor="middle" class="sm">26%</text>
    <text x="222" y="150.4" text-anchor="start" class="sm">expenses</text>
    <rect x="126" y="96" width="84" height="14" rx="2" fill="#059669" fill-opacity="0.32" stroke="#059669" stroke-width="1.2"/>
    <line x1="114" y1="110" x2="216" y2="110" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
    <text x="110" y="114" text-anchor="end" class="sm bold">combined 95%</text>
    <path d="M232,85 L244,89.2 V99.4 Q244,110.2 232,115 Q220,110.2 220,99.4 V89.2 Z" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="254" y="105" text-anchor="start" class="sm bold">Q 5%</text>
  </g>
</svg>
