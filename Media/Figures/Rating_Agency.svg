<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The downgrade spiral — a rating cut feeding the metrics that produced it</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A published opinion, and it feeds back</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">A- is the common commercial threshold</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">— below it, the business goes elsewhere</text>
  <rect x="128" y="109.16" width="104" height="24" rx="12.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="125.16" text-anchor="middle" class="sm">downgrade</text>
  <rect x="221.96" y="166" width="104" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="273.96" y="182" text-anchor="middle" class="sm">business lost</text>
  <rect x="128" y="222.84" width="104" height="24" rx="12.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="238.84" text-anchor="middle" class="sm">costs rise</text>
  <rect x="34.04" y="166" width="104" height="24" rx="12.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
  <text x="86.04" y="182" text-anchor="middle" class="sm">metrics fall</text>
  <line x1="197.94" y1="144" x2="232.1" y2="166.29" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="232.1" y1="189.71" x2="197.94" y2="212" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="162.06" y1="212" x2="127.9" y2="189.71" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="127.9" y1="166.29" x2="162.06" y2="144" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="30" y1="254" x2="330" y2="254" class="rule"/>
  <rect x="30" y="268" width="143" height="94" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="30" y="268" width="143" height="24" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="284" text-anchor="middle" class="sm bold" fill="#d97706">Rating</text>
  <text x="101.5" y="312" text-anchor="middle" class="sm">published</text>
  <text x="101.5" y="332" text-anchor="middle" class="sm">an opinion</text>
  <text x="101.5" y="352" text-anchor="middle" class="sm">voluntary</text>
  <rect x="187" y="268" width="143" height="94" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="187" y="268" width="143" height="24" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="284" text-anchor="middle" class="sm bold" fill="#3b82f6">Supervision</text>
  <text x="258.5" y="312" text-anchor="middle" class="sm">confidential</text>
  <text x="258.5" y="332" text-anchor="middle" class="sm">legal powers</text>
  <text x="258.5" y="352" text-anchor="middle" class="sm">compulsory</text>
</svg>
