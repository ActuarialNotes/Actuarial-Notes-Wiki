<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The hierarchy the phrase points at, and the statutory hook that gives it legal effect</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Parliament pointed at the profession's</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">own rules</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ICA s. 365: value in accordance with</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">accepted actuarial practice in Canada</text>
  <rect x="30" y="96" width="300" height="46" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="180" y="116" text-anchor="middle" class="sm">Rules of Professional Conduct</text>
  <text x="180" y="131" text-anchor="middle" class="sm dim">how to behave</text>
  <rect x="30" y="152" width="300" height="46" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="180" y="172" text-anchor="middle" class="sm">Standards of Practice</text>
  <text x="180" y="187" text-anchor="middle" class="sm dim">binding — what must be done</text>
  <rect x="30" y="208" width="300" height="46" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.3"/>
  <text x="180" y="228" text-anchor="middle" class="sm">Educational Notes</text>
  <text x="180" y="243" text-anchor="middle" class="sm dim">guidance, not binding</text>
  <rect x="30" y="264" width="300" height="46" rx="6" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.3"/>
  <text x="180" y="284" text-anchor="middle" class="sm">Generally accepted practice</text>
  <text x="180" y="299" text-anchor="middle" class="sm dim">where the standards are silent</text>
  <line x1="30" y1="326" x2="330" y2="326" class="rule"/>
  <text x="180" y="348" text-anchor="middle" class="sm dim">departure is allowed, with the departure and</text>
  <text x="180" y="364" text-anchor="middle" class="sm dim">its reason disclosed — silence is not</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">and it moves: MfADs became the risk adjustment</text>
</svg>
