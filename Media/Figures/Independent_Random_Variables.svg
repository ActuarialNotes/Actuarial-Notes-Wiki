<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Independent variables give a rectangular, untilted joint density</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Independence: the joint density factors</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">f(x, y) = f_X(x) · f_Y(y)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">⇒ E[XY] = E[X] E[Y]  and  Cov = 0</text>
  <rect x="106" y="88" width="148" height="148" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <ellipse cx="180.0" cy="162.0" rx="25" ry="17" transform="rotate(0 180.0 162.0)" fill="#059669" fill-opacity="0.28" stroke="#059669" stroke-width="1"/>
  <ellipse cx="180.0" cy="162.0" rx="42" ry="29" transform="rotate(0 180.0 162.0)" fill="#059669" fill-opacity="0.17" stroke="#059669" stroke-width="1"/>
  <ellipse cx="180.0" cy="162.0" rx="60" ry="41" transform="rotate(0 180.0 162.0)" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1"/>
  <line x1="106" y1="236" x2="266" y2="236" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="106" y1="236" x2="106" y2="78" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="278" y="162" text-anchor="middle" class="sm bold" fill="#059669">Independent</text>
  <text x="278" y="178" text-anchor="middle" class="sm dim">Cov = 0</text>
  <rect x="106" y="244" width="148" height="148" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <ellipse cx="180.0" cy="318.0" rx="25" ry="17" transform="rotate(-30 180.0 318.0)" fill="#e11d48" fill-opacity="0.28" stroke="#e11d48" stroke-width="1"/>
  <ellipse cx="180.0" cy="318.0" rx="42" ry="29" transform="rotate(-30 180.0 318.0)" fill="#e11d48" fill-opacity="0.17" stroke="#e11d48" stroke-width="1"/>
  <ellipse cx="180.0" cy="318.0" rx="60" ry="41" transform="rotate(-30 180.0 318.0)" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1"/>
  <line x1="106" y1="392" x2="266" y2="392" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="106" y1="392" x2="106" y2="234" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="278" y="318" text-anchor="middle" class="sm bold" fill="#e11d48">Dependent</text>
  <text x="278" y="334" text-anchor="middle" class="sm dim">Cov ≠ 0</text>
</svg>
