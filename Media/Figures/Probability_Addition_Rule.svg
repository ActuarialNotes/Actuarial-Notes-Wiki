<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The addition rule correcting for a double-counted overlap</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Subtract the double-counted overlap</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">0.45 + 0.40 − 0.15 = 0.70</text>
  <rect x="28" y="100" width="304" height="200" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="42" y="120" text-anchor="middle" class="sm dim">S</text>
  <circle cx="141" cy="200" r="78" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="219" cy="200" r="78" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.6"/>
  <path d="M180,132.45 A78,78 0 0 1 180,267.55 A78,78 0 0 1 180,132.45 Z" fill="#e11d48" fill-opacity="0.4" stroke="none"/>
  <text x="105" y="205" text-anchor="middle">0.30</text>
  <text x="180" y="205" text-anchor="middle" class="bold">0.15</text>
  <text x="255" y="205" text-anchor="middle">0.25</text>
  <text x="97" y="138" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <text x="263" y="138" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <text x="180" y="330" text-anchor="middle" class="sm dim">the overlap belongs to both circles</text>
</svg>
