  <text x="326" y="131" text-anchor="start" class="sm bold">Mass at Y = 0</text>
  <text x="326" y="147" text-anchor="start" class="sm dim">every loss the deductible absorbs</text>
  <line x1="316" y1="166" x2="316" y2="200" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="179" text-anchor="start" class="sm bold">Continuous middle</text>
  <text x="326" y="195" text-anchor="start" class="sm dim">partial losses, scaled by α</text>
