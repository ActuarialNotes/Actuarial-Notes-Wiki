<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Many trees fitted and combined into one prediction</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Many weak trees beat one strong tree</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">f̂(x) = average (or vote) over B trees</text>
  <circle cx="78" cy="118" r="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.4"/>
  <line x1="73" y1="123" x2="52" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <circle cx="52" cy="158" r="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.4"/>
  <line x1="47" y1="163" x2="39" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="30" y="191" width="18" height="14" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <line x1="57" y1="163" x2="65" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="56" y="191" width="18" height="14" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <line x1="83" y1="123" x2="104" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <circle cx="104" cy="158" r="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.4"/>
  <line x1="99" y1="163" x2="91" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="82" y="191" width="18" height="14" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <line x1="109" y1="163" x2="117" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="108" y="191" width="18" height="14" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="78" y="214" text-anchor="middle" class="sm dim">tree 1</text>
  <circle cx="180" cy="118" r="6" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <line x1="175" y1="123" x2="154" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <circle cx="154" cy="158" r="6" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <line x1="149" y1="163" x2="141" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="132" y="191" width="18" height="14" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <line x1="159" y1="163" x2="167" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="158" y="191" width="18" height="14" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <line x1="185" y1="123" x2="206" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <circle cx="206" cy="158" r="6" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <line x1="201" y1="163" x2="193" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="184" y="191" width="18" height="14" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <line x1="211" y1="163" x2="219" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="210" y="191" width="18" height="14" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="180" y="214" text-anchor="middle" class="sm dim">tree 2</text>
  <circle cx="282" cy="118" r="6" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.4"/>
  <line x1="277" y1="123" x2="256" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <circle cx="256" cy="158" r="6" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.4"/>
  <line x1="251" y1="163" x2="243" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="234" y="191" width="18" height="14" rx="3" fill="#059669" fill-opacity="0.55"/>
  <line x1="261" y1="163" x2="269" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="260" y="191" width="18" height="14" rx="3" fill="#059669" fill-opacity="0.55"/>
  <line x1="287" y1="123" x2="308" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <circle cx="308" cy="158" r="6" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.4"/>
  <line x1="303" y1="163" x2="295" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="286" y="191" width="18" height="14" rx="3" fill="#059669" fill-opacity="0.55"/>
  <line x1="313" y1="163" x2="321" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="312" y="191" width="18" height="14" rx="3" fill="#059669" fill-opacity="0.55"/>
  <text x="282" y="214" text-anchor="middle" class="sm dim">tree 3</text>
  <text x="276" y="178" text-anchor="middle" class="bold">…</text>
  <line x1="78" y1="226" x2="180" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="180" y1="226" x2="180" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="282" y1="226" x2="180" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <rect x="102" y="262" width="156" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="283" text-anchor="middle" class="sm bold">average / vote</text>
  <text x="180" y="322" text-anchor="middle" class="sm dim">bagging &amp; random forests: parallel, cut variance</text>
  <text x="180" y="338" text-anchor="middle" class="sm dim">boosting: sequential, cuts bias</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">accuracy bought with interpretability</text>
</svg>
