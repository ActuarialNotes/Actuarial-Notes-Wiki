  <line x1="64" y1="260" x2="322" y2="260" class="thin" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="260.08" y="252" text-anchor="middle" class="sm bold" fill="#3b82f6">AIC penalty = 2</text>
  <text x="244.6" y="124.57" text-anchor="end" class="sm bold" fill="#7c3aed">BIC penalty = log n</text>
  <line x1="65.91" y1="316" x2="65.91" y2="260" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="180" y="348" text-anchor="middle" class="sm dim">sample size n</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">past n ≈ 8 the BIC penalty is the harsher —</text>
  <text x="180" y="381" text-anchor="middle" class="sm dim">so BIC picks the sparser model</text>
</svg>
