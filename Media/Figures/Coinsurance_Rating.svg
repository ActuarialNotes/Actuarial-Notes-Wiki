  <line x1="232" y1="322" x2="232" y2="120.18" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="226" y="114.18" text-anchor="end" class="sm bold" fill="#059669">80% required</text>
  <circle cx="152" cy="170.64" r="4.2" fill="#e11d48"/>
  <text x="162" y="186.64" text-anchor="start" class="sm bold" fill="#e11d48">carried 60%</text>
  <text x="162" y="201.64" text-anchor="start" class="sm" fill="#e11d48">⇒ 75% paid</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">insurance carried, as a % of value</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">the penalty applies to every loss, including</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the partial ones the insured expected to collect</text>
</svg>
