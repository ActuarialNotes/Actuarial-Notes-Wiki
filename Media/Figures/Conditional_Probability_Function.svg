<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>One row of a joint table renormalised into a conditional distribution</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A conditional PMF is one row divided by</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">its total</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">p(y | x) = p(x, y) / pₓ(x)</text>
  <text x="112" y="102" text-anchor="middle" class="sm dim">y = 0</text>
  <text x="180" y="102" text-anchor="middle" class="sm dim">y = 1</text>
  <text x="248" y="102" text-anchor="middle" class="sm dim">y = 2</text>
  <text x="70" y="136" text-anchor="end" class="sm dim">x = 0</text>
  <text x="70" y="180" text-anchor="end" class="sm dim">x = 1</text>
  <text x="70" y="224" text-anchor="end" class="sm dim">x = 2</text>
  <rect x="78" y="110" width="68" height="44" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="112" y="136" text-anchor="middle" class="sm">0.10</text>
  <rect x="146" y="110" width="68" height="44" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="180" y="136" text-anchor="middle" class="sm">0.08</text>
  <rect x="214" y="110" width="68" height="44" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="248" y="136" text-anchor="middle" class="sm">0.02</text>
  <rect x="78" y="154" width="68" height="44" rx="3" fill="#3b82f6" fill-opacity="0.26" stroke="var(--edge)" stroke-width="1"/>
  <text x="112" y="180" text-anchor="middle" class="sm bold">0.06</text>
  <rect x="146" y="154" width="68" height="44" rx="3" fill="#3b82f6" fill-opacity="0.26" stroke="var(--edge)" stroke-width="1"/>
  <text x="180" y="180" text-anchor="middle" class="sm bold">0.20</text>
  <rect x="214" y="154" width="68" height="44" rx="3" fill="#3b82f6" fill-opacity="0.26" stroke="var(--edge)" stroke-width="1"/>
  <text x="248" y="180" text-anchor="middle" class="sm bold">0.14</text>
  <rect x="78" y="198" width="68" height="44" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="112" y="224" text-anchor="middle" class="sm">0.04</text>
  <rect x="146" y="198" width="68" height="44" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="180" y="224" text-anchor="middle" class="sm">0.12</text>
  <rect x="214" y="198" width="68" height="44" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="248" y="224" text-anchor="middle" class="sm">0.24</text>
  <text x="180" y="264" text-anchor="middle" class="sm dim">the row X = 1 sums to 0.40</text>
  <line x1="180" y1="274" x2="180" y2="296" class="thin" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ah7c3aed)"/>
  <text x="192" y="290" text-anchor="start" class="sm" fill="#7c3aed">÷ 0.40</text>
  <rect x="78" y="306" width="68" height="40" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="112" y="331" text-anchor="middle" class="sm bold">0.15</text>
  <rect x="146" y="306" width="68" height="40" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="331" text-anchor="middle" class="sm bold">0.50</text>
  <rect x="214" y="306" width="68" height="40" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="248" y="331" text-anchor="middle" class="sm bold">0.35</text>
  <text x="180" y="368" text-anchor="middle" class="sm dim">0.15 + 0.50 + 0.35 = 1.00</text>
</svg>
