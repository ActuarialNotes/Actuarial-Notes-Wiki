<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The BIC penalty growing with sample size against AIC's fixed 2 per parameter</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">BIC's penalty grows with the sample</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">BIC = −2ℓ + k·log n</text>
  <line x1="64" y1="92" x2="64" y2="316" class="grid"/>
  <line x1="128.5" y1="92" x2="128.5" y2="316" class="grid"/>
  <line x1="193" y1="92" x2="193" y2="316" class="grid"/>
  <line x1="257.5" y1="92" x2="257.5" y2="316" class="grid"/>
  <line x1="322" y1="92" x2="322" y2="316" class="grid"/>
  <line x1="64" y1="316" x2="322" y2="316" class="grid"/>
  <line x1="64" y1="260" x2="322" y2="260" class="grid"/>
  <line x1="64" y1="204" x2="322" y2="204" class="grid"/>
  <line x1="64" y1="148" x2="322" y2="148" class="grid"/>
  <line x1="64" y1="92" x2="322" y2="92" class="grid"/>
  <line x1="64" y1="316" x2="332" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="316" x2="64" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="316" x2="64" y2="320" class="tick"/>
  <text x="64" y="332" text-anchor="middle" class="sm dim">0</text>
  <line x1="128.5" y1="316" x2="128.5" y2="320" class="tick"/>
  <text x="128.5" y="332" text-anchor="middle" class="sm dim">250</text>
  <line x1="193" y1="316" x2="193" y2="320" class="tick"/>
  <text x="193" y="332" text-anchor="middle" class="sm dim">500</text>
  <line x1="257.5" y1="316" x2="257.5" y2="320" class="tick"/>
  <text x="257.5" y="332" text-anchor="middle" class="sm dim">750</text>
  <line x1="322" y1="316" x2="322" y2="320" class="tick"/>
  <text x="322" y="332" text-anchor="middle" class="sm dim">1000</text>
  <line x1="60" y1="316" x2="64" y2="316" class="tick"/>
  <text x="56" y="319.6" text-anchor="end" class="sm dim">0</text>
  <line x1="60" y1="260" x2="64" y2="260" class="tick"/>
  <text x="56" y="263.6" text-anchor="end" class="sm dim">2</text>
  <line x1="60" y1="204" x2="64" y2="204" class="tick"/>
  <text x="56" y="207.6" text-anchor="end" class="sm dim">4</text>
  <line x1="60" y1="148" x2="64" y2="148" class="tick"/>
  <text x="56" y="151.6" text-anchor="end" class="sm dim">6</text>
  <line x1="60" y1="92" x2="64" y2="92" class="tick"/>
  <text x="56" y="95.6" text-anchor="end" class="sm dim">8</text>
