<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Asset cash flows set against the liabilities they fund</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Assets are held to fund liabilities</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PV(A) = PV(L)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">match the cash flows, or the durations</text>
  <line x1="44" y1="236" x2="320" y2="236" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="52" y1="232" x2="52" y2="240" class="tick"/>
  <text x="52" y="253" text-anchor="middle" class="sm dim">0</text>
  <line x1="83.25" y1="232" x2="83.25" y2="240" class="tick"/>
  <text x="83.25" y="253" text-anchor="middle" class="sm dim">1</text>
  <line x1="114.5" y1="232" x2="114.5" y2="240" class="tick"/>
  <text x="114.5" y="253" text-anchor="middle" class="sm dim">2</text>
  <line x1="145.75" y1="232" x2="145.75" y2="240" class="tick"/>
  <text x="145.75" y="253" text-anchor="middle" class="sm dim">3</text>
  <line x1="177" y1="232" x2="177" y2="240" class="tick"/>
  <text x="177" y="253" text-anchor="middle" class="sm dim">4</text>
  <line x1="208.25" y1="232" x2="208.25" y2="240" class="tick"/>
  <text x="208.25" y="253" text-anchor="middle" class="sm dim">5</text>
  <line x1="239.5" y1="232" x2="239.5" y2="240" class="tick"/>
  <text x="239.5" y="253" text-anchor="middle" class="sm dim">6</text>
  <line x1="270.75" y1="232" x2="270.75" y2="240" class="tick"/>
  <text x="270.75" y="253" text-anchor="middle" class="sm dim">7</text>
  <line x1="302" y1="232" x2="302" y2="240" class="tick"/>
  <text x="302" y="253" text-anchor="middle" class="sm dim">8</text>
  <line x1="79.25" y1="236" x2="79.25" y2="208" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="110.5" y1="236" x2="110.5" y2="200" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="141.75" y1="236" x2="141.75" y2="204" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="173" y1="236" x2="173" y2="192" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="204.25" y1="236" x2="204.25" y2="204" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="235.5" y1="236" x2="235.5" y2="200" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="266.75" y1="236" x2="266.75" y2="208" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="298" y1="236" x2="298" y2="170" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="118.5" y1="236" x2="118.5" y2="268" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="181" y1="236" x2="181" y2="276" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="243.5" y1="236" x2="243.5" y2="268" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="306" y1="236" x2="306" y2="290" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="180" y="128" text-anchor="middle" class="bold" fill="#3b82f6">assets</text>
  <text x="180" y="366" text-anchor="middle" class="bold" fill="#e11d48">liabilities</text>
</svg>
