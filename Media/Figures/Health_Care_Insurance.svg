<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>What medicare covers and what private insurance is left to fill, under the five Canada Health Act principles</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Single payer for the core, private for</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">the rest</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Funded from taxation, not from premiums</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">— and private duplication is barred</text>
    <text x="180" y="100" text-anchor="middle" class="sm dim">one household's health spending</text>
    <rect x="40" y="121" width="190.4" height="34" rx="4" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="135.2" y="142" text-anchor="middle" class="sm">medicare</text>
    <rect x="230.4" y="121" width="89.6" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <text x="275.2" y="142" text-anchor="middle" class="sm">private</text>
    <text x="112" y="176" text-anchor="middle" class="sm dim">hospital, physician</text>
    <text x="266" y="176" text-anchor="middle" class="sm dim">drugs, dental,</text>
    <text x="266" y="191" text-anchor="middle" class="sm dim">vision, paramedical</text>
    <line x1="30" y1="212" x2="330" y2="212" class="rule"/>
    <text x="180" y="234" text-anchor="middle" class="sm bold">the five Canada Health Act principles</text>
    <rect x="36" y="250" width="90.67" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="81.33" y="266" text-anchor="middle" class="sm">public</text>
    <rect x="134.67" y="250" width="90.67" height="24" rx="12.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
    <text x="180" y="266" text-anchor="middle" class="sm">comprehensive</text>
    <rect x="233.33" y="250" width="90.67" height="24" rx="12.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
    <text x="278.67" y="266" text-anchor="middle" class="sm">universal</text>
    <rect x="88" y="280" width="88" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="132" y="296" text-anchor="middle" class="sm">portable</text>
    <rect x="184" y="280" width="88" height="24" rx="12.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="228" y="296" text-anchor="middle" class="sm">accessible</text>
    <text x="180" y="330" text-anchor="middle" class="sm dim">meet them and the federal transfer is paid in full</text>
    <text x="180" y="358" text-anchor="middle" class="sm dim">and a provincial health insurer subrogates against</text>
    <text x="180" y="374" text-anchor="middle" class="sm dim">the at-fault auto insurer for what it spent</text>
  </g>
</svg>
