<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The two residual structures — a facility the driver sees and a pool the driver never learns of</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Compulsory to buy means someone must</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">sell</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Results shared by voluntary market share,</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">whether or not you service the business</text>
  <rect x="30" y="100" width="143" height="141" rx="7" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="30" y="100" width="143" height="26" rx="7" fill="#e11d48" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="117" text-anchor="middle" class="sm bold" fill="#e11d48">Facility</text>
  <text x="101.5" y="146" text-anchor="middle" class="sm">written by FA</text>
  <text x="101.5" y="167" text-anchor="middle" class="sm">FA's own rate</text>
  <text x="101.5" y="188" text-anchor="middle" class="sm">the driver knows</text>
  <text x="101.5" y="209" text-anchor="middle" class="sm">risks nobody</text>
  <text x="101.5" y="230" text-anchor="middle" class="sm">will write</text>
  <rect x="187" y="100" width="143" height="141" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="1.2"/>
  <rect x="187" y="100" width="143" height="26" rx="7" fill="#0d9488" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="117" text-anchor="middle" class="sm bold" fill="#0d9488">Pool</text>
  <text x="258.5" y="146" text-anchor="middle" class="sm">written by an</text>
  <text x="258.5" y="167" text-anchor="middle" class="sm">ordinary insurer</text>
  <text x="258.5" y="188" text-anchor="middle" class="sm">at the normal rate</text>
  <text x="258.5" y="209" text-anchor="middle" class="sm">risks everybody</text>
  <text x="258.5" y="230" text-anchor="middle" class="sm">must write</text>
  <line x1="30" y1="262" x2="330" y2="262" class="rule"/>
  <text x="180" y="284" text-anchor="middle" class="sm bold">size is a diagnostic, not a goal</text>
  <text x="180" y="308" text-anchor="middle" class="sm dim">a growing residual market says the approved</text>
  <text x="180" y="324" text-anchor="middle" class="sm dim">rate no longer covers part of the risk —</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">depopulation is the direction to want</text>
  <text x="180" y="368" text-anchor="middle" class="sm dim">the business is adversely selected by construction,</text>
  <text x="180" y="384" text-anchor="middle" class="sm dim">so its loss ratio exceeds the voluntary market's</text>
</svg>
