<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The AIC curve over model size, bottoming out at four parameters where better fit stops paying for its parameters</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="66" y1="348" x2="336" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="348" x2="66" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="87.67" y1="348" x2="87.67" y2="352" class="tick"/>
    <text x="87.67" y="364" text-anchor="middle" class="sm dim">1</text>
    <line x1="159.89" y1="348" x2="159.89" y2="352" class="tick"/>
    <text x="159.89" y="364" text-anchor="middle" class="sm dim">3</text>
    <line x1="232.11" y1="348" x2="232.11" y2="352" class="tick"/>
    <text x="232.11" y="364" text-anchor="middle" class="sm dim">5</text>
    <line x1="304.33" y1="348" x2="304.33" y2="352" class="tick"/>
    <text x="304.33" y="364" text-anchor="middle" class="sm dim">7</text>
    <line x1="62" y1="297.6" x2="66" y2="297.6" class="tick"/>
    <text x="58" y="301.2" text-anchor="end" class="sm dim">4,100</text>
    <line x1="62" y1="171.6" x2="66" y2="171.6" class="tick"/>
    <text x="58" y="175.2" text-anchor="end" class="sm dim">4,150</text>
    <text x="326" y="380" text-anchor="end" class="sm dim">parameters p</text>
    <text x="62" y="82" text-anchor="start" class="sm dim">AIC</text>
    <polyline points="87.67,116.16 123.78,219.48 159.89,292.56 196,335.4 232.11,325.32 268.22,307.68 304.33,277.44" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <circle cx="87.67" cy="116.16" r="3.2" fill="#3b82f6"/>
    <circle cx="123.78" cy="219.48" r="3.2" fill="#3b82f6"/>
    <circle cx="159.89" cy="292.56" r="3.2" fill="#3b82f6"/>
    <circle cx="196" cy="335.4" r="3.2" fill="#3b82f6"/>
    <circle cx="232.11" cy="325.32" r="3.2" fill="#3b82f6"/>
    <circle cx="268.22" cy="307.68" r="3.2" fill="#3b82f6"/>
    <circle cx="304.33" cy="277.44" r="3.2" fill="#3b82f6"/>
    <circle cx="196" cy="335.4" r="5" fill="#e11d48"/>
    <text x="196" y="355.4" text-anchor="middle" class="sm bold" fill="#e11d48">best AIC</text>
  </g>
</svg>
