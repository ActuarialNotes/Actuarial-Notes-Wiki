<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 316" width="560" height="316" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="314.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The integrand is easy — the region is the work</text>
  <text x="280" y="38" text-anchor="middle" class="sub">support 0 &lt; x &lt; y &lt; 1</text>
  <polygon points="84,236 260,60 84,60" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.4"/>
  <line x1="84" y1="236" x2="282" y2="236" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="84" y1="236" x2="84" y2="40" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="84" y1="236" x2="260" y2="60" class="thin" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="288" y="240" text-anchor="start" class="sm dim">x</text>
  <text x="76" y="36" text-anchor="end" class="sm dim">y</text>
  <text x="84" y="253" text-anchor="middle" class="sm dim">0</text>
  <text x="76" y="240" text-anchor="end" class="sm dim">0</text>
  <text x="260" y="253" text-anchor="middle" class="sm dim">1</text>
  <text x="76" y="64" text-anchor="end" class="sm dim">1</text>
  <line x1="157.92" y1="236" x2="157.92" y2="162.08" stroke="#d97706" stroke-width="2.4"/>
  <line x1="157.92" y1="232" x2="157.92" y2="162.08" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
  <text x="165.92" y="199.04" text-anchor="start" class="sm" fill="#d97706">y runs x → 1</text>
  <text x="157.92" y="268" text-anchor="middle" class="sm dim">fix x</text>
  <text x="230" y="76" text-anchor="start" class="sm" fill="#3b82f6">y = x</text>
  <text x="400" y="88" text-anchor="middle" class="sm bold">Work outside in</text>
  <text x="300" y="108" text-anchor="start" class="sm bold">1. Sketch the support</text>
  <text x="300" y="123" text-anchor="start" class="sm dim">shade where f &gt; 0</text>
  <text x="300" y="148" text-anchor="start" class="sm bold">2. Outer limits</text>
  <text x="300" y="163" text-anchor="start" class="sm dim">must be numbers: 0 &lt; x &lt; 1</text>
  <text x="300" y="188" text-anchor="start" class="sm bold">3. Slice</text>
  <text x="300" y="203" text-anchor="start" class="sm dim">inner limits may use x: x &lt; y &lt; 1</text>
  <text x="300" y="228" text-anchor="start" class="sm bold">4. Check</text>
  <text x="300" y="243" text-anchor="start" class="sm dim">the outer symbol never appears outside</text>
  <line x1="28" y1="274" x2="532" y2="274" class="rule"/>
  <text x="280" y="294" text-anchor="middle" class="sm dim">∫₀¹ ∫ₓ¹ f(x, y) dy dx     — reversing the order means re-reading the sketch</text>
  <text x="280" y="310" text-anchor="middle" class="sm dim">A triangular support forces dependence, however the formula factors</text>
</svg>
