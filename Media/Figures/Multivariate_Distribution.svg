<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A joint distribution with its marginals shown on the axes</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The joint law, with both marginals</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">f_X(x) = ∫ f(x, y) dy</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">f_Y(y) = ∫ f(x, y) dx</text>
  <rect x="128" y="122" width="186" height="186" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <ellipse cx="221.0" cy="215.0" rx="34" ry="19" transform="rotate(-28 221.0 215.0)" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1"/>
  <ellipse cx="221.0" cy="215.0" rx="58" ry="32" transform="rotate(-28 221.0 215.0)" fill="#3b82f6" fill-opacity="0.17" stroke="#3b82f6" stroke-width="1"/>
  <ellipse cx="221.0" cy="215.0" rx="82" ry="46" transform="rotate(-28 221.0 215.0)" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1"/>
  <line x1="128" y1="308" x2="326" y2="308" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="128" y1="308" x2="128" y2="110" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="330" y="312" text-anchor="start" class="sm dim">x</text>
  <text x="122" y="106" text-anchor="end" class="sm dim">y</text>
  <polyline points="128,359.56 131.1,359.4 134.2,359.21 137.3,358.96 140.4,358.64 143.5,358.25 146.6,357.76 149.7,357.17 152.8,356.45 155.9,355.6 159,354.6 162.1,353.44 165.2,352.1 168.3,350.6 171.4,348.91 174.5,347.05 177.6,345.03 180.7,342.86 183.8,340.58 186.9,338.21 190,335.8 193.1,333.39 196.2,331.03 199.3,328.77 202.4,326.68 205.5,324.79 208.6,323.17 211.7,321.86 214.8,320.9 217.9,320.3 221,320.11 224.1,320.3 227.2,320.9 230.3,321.86 233.4,323.17 236.5,324.79 239.6,326.68 242.7,328.77 245.8,331.03 248.9,333.39 252,335.8 255.1,338.21 258.2,340.58 261.3,342.86 264.4,345.03 267.5,347.05 270.6,348.91 273.7,350.6 276.8,352.1 279.9,353.44 283,354.6 286.1,355.6 289.2,356.45 292.3,357.17 295.4,357.76 298.5,358.25 301.6,358.64 304.7,358.96 307.8,359.21 310.9,359.4 314,359.56" class="curve" stroke="#d97706" stroke-width="1.8"/>
  <text x="320" y="354" text-anchor="start" class="sm bold" fill="#d97706">f_X</text>
  <polyline points="82.41,308 82.55,304.9 82.73,301.8 82.96,298.7 83.25,295.6 83.61,292.5 84.06,289.4 84.61,286.3 85.26,283.2 86.05,280.1 86.97,277 88.04,273.9 89.26,270.8 90.65,267.7 92.2,264.6 93.92,261.5 95.77,258.4 97.77,255.3 99.87,252.2 102.04,249.1 104.26,246 106.48,242.9 108.65,239.8 110.73,236.7 112.66,233.6 114.39,230.5 115.88,227.4 117.09,224.3 117.98,221.2 118.52,218.1 118.7,215 118.52,211.9 117.98,208.8 117.09,205.7 115.88,202.6 114.39,199.5 112.66,196.4 110.73,193.3 108.65,190.2 106.48,187.1 104.26,184 102.04,180.9 99.87,177.8 97.77,174.7 95.77,171.6 93.92,168.5 92.2,165.4 90.65,162.3 89.26,159.2 88.04,156.1 86.97,153 86.05,149.9 85.26,146.8 84.61,143.7 84.06,140.6 83.61,137.5 83.25,134.4 82.96,131.3 82.73,128.2 82.55,125.1 82.41,122" class="curve" stroke="#059669" stroke-width="1.8"/>
  <text x="88" y="116" text-anchor="middle" class="sm bold" fill="#059669">f_Y</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">each marginal integrates the other variable out</text>
</svg>
