  <text x="144" y="332" text-anchor="middle" class="sm dim">3</text>
  <line x1="167.33" y1="316" x2="167.33" y2="320" class="tick"/>
  <text x="167.33" y="332" text-anchor="middle" class="sm dim">4</text>
  <line x1="190.67" y1="316" x2="190.67" y2="320" class="tick"/>
  <text x="190.67" y="332" text-anchor="middle" class="sm dim">5</text>
  <line x1="214" y1="316" x2="214" y2="320" class="tick"/>
  <text x="214" y="332" text-anchor="middle" class="sm dim">6</text>
  <line x1="237.33" y1="316" x2="237.33" y2="320" class="tick"/>
  <text x="237.33" y="332" text-anchor="middle" class="sm dim">7</text>
  <line x1="260.67" y1="316" x2="260.67" y2="320" class="tick"/>
  <text x="260.67" y="332" text-anchor="middle" class="sm dim">8</text>
  <line x1="284" y1="316" x2="284" y2="320" class="tick"/>
  <text x="284" y="332" text-anchor="middle" class="sm dim">9</text>
  <line x1="307.33" y1="316" x2="307.33" y2="320" class="tick"/>
  <text x="307.33" y="332" text-anchor="middle" class="sm dim">10</text>
  <line x1="70" y1="316" x2="74" y2="316" class="tick"/>
  <text x="66" y="319.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="221.71" x2="74" y2="221.71" class="tick"/>
  <text x="66" y="225.31" text-anchor="end" class="sm dim">300</text>
  <line x1="70" y1="127.43" x2="74" y2="127.43" class="tick"/>
  <text x="66" y="131.03" text-anchor="end" class="sm dim">600</text>
  <text x="326" y="348" text-anchor="end" class="sm dim">time t</text>
  <text x="70" y="82" text-anchor="start" class="sm dim">PV of cash flow</text>
  <line x1="74" y1="360" x2="326" y2="360" stroke="#d97706" stroke-width="1.8"/>
  <polygon points="263.18,360 253.18,376 273.18,376" fill="#d97706"/>
  <text x="263.18" y="110" text-anchor="middle" class="sm bold" fill="#d97706">D_Mac = 8.11</text>
</svg>
