    <rect x="197" y="216" width="26" height="28" rx="2" fill="#d97706" fill-opacity="0.35"/>
    <rect x="197" y="248" width="26" height="28" rx="2" fill="#d97706" fill-opacity="0.35"/>
    <text x="210" y="132" text-anchor="middle" class="bold">β</text>
