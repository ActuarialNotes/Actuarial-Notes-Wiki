<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four ultimates for one accident year, with Benktander sitting between BF and the chain ladder</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Bornhuetter-Ferguson, run a second time</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">U_GB = C + (1 − 1/CDF) × U_BF</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1,500 + 0.474 × 2,732 = 2,794</text>
  <line x1="124" y1="108" x2="124" y2="322" class="grid"/>
  <line x1="184" y1="108" x2="184" y2="322" class="grid"/>
  <line x1="244" y1="108" x2="244" y2="322" class="grid"/>
  <line x1="304" y1="108" x2="304" y2="322" class="grid"/>
  <line x1="64" y1="322" x2="326" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="322" x2="64" y2="98" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="124" y1="322" x2="124" y2="326" class="tick"/>
  <text x="124" y="338" text-anchor="middle" class="sm dim">2,600</text>
  <line x1="184" y1="322" x2="184" y2="326" class="tick"/>
  <text x="184" y="338" text-anchor="middle" class="sm dim">2,700</text>
  <line x1="244" y1="322" x2="244" y2="326" class="tick"/>
  <text x="244" y="338" text-anchor="middle" class="sm dim">2,800</text>
  <line x1="304" y1="322" x2="304" y2="326" class="tick"/>
  <text x="304" y="338" text-anchor="middle" class="sm dim">2,900</text>
  <circle cx="124" cy="146.91" r="5" fill="#7c3aed"/>
  <line x1="64" y1="146.91" x2="124" y2="146.91" class="thin" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="133" y="150.91" text-anchor="start" class="sm bold" fill="#7c3aed">2,600</text>
  <text x="68" y="137.91" text-anchor="start" class="sm dim">expected loss</text>
  <circle cx="202.99" cy="193.11" r="5" fill="#0d9488"/>
  <line x1="64" y1="193.11" x2="202.99" y2="193.11" class="thin" stroke="#0d9488" stroke-width="1.4"/>
  <text x="211.99" y="197.11" text-anchor="start" class="sm bold" fill="#0d9488">2,732</text>
  <text x="68" y="184.11" text-anchor="start" class="sm dim">Bornhuetter-Ferguson</text>
  <circle cx="240.41" cy="239.32" r="5" fill="#059669"/>
  <line x1="64" y1="239.32" x2="240.41" y2="239.32" class="thin" stroke="#059669" stroke-width="1.4"/>
  <text x="249.41" y="243.32" text-anchor="start" class="sm bold" fill="#059669">2,794</text>
  <text x="68" y="230.32" text-anchor="start" class="sm dim">Benktander</text>
  <circle cx="274.09" cy="285.52" r="5" fill="#3b82f6"/>
  <line x1="64" y1="285.52" x2="274.09" y2="285.52" class="thin" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="283.09" y="289.52" text-anchor="start" class="sm bold" fill="#3b82f6">2,850</text>
  <text x="68" y="276.52" text-anchor="start" class="sm dim">chain ladder</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">AY 2024 ultimate ($000)</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">each iteration leans a little further on the</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">data; iterate forever and you reach chain ladder</text>
</svg>
