<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The eight subsets of {a, b, c} stacked by size from the empty set to the whole set, each linked to the subsets one element larger</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="180" y1="114" x2="76" y2="170" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="180" y1="114" x2="180" y2="170" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="180" y1="114" x2="284" y2="170" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="76" y1="202" x2="76" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="76" y1="202" x2="180" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="180" y1="202" x2="76" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="180" y1="202" x2="284" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="284" y1="202" x2="180" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="284" y1="202" x2="284" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="76" y1="290" x2="180" y2="346" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="180" y1="290" x2="180" y2="346" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="284" y1="290" x2="180" y2="346" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
    <rect x="144" y="82" width="72" height="32" rx="8" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="180" y="103" text-anchor="middle">∅</text>
    <rect x="40" y="170" width="72" height="32" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="76" y="191" text-anchor="middle">{a}</text>
    <rect x="144" y="170" width="72" height="32" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="191" text-anchor="middle">{b}</text>
    <rect x="248" y="170" width="72" height="32" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="284" y="191" text-anchor="middle">{c}</text>
    <rect x="40" y="258" width="72" height="32" rx="8" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="76" y="279" text-anchor="middle">{a,b}</text>
    <rect x="144" y="258" width="72" height="32" rx="8" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="180" y="279" text-anchor="middle">{a,c}</text>
    <rect x="248" y="258" width="72" height="32" rx="8" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="284" y="279" text-anchor="middle">{b,c}</text>
    <rect x="144" y="346" width="72" height="32" rx="8" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
    <text x="180" y="367" text-anchor="middle">{a,b,c}</text>
  </g>
</svg>
