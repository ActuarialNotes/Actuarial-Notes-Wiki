  <line x1="60" y1="204" x2="60" y2="56" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="204" x2="60" y2="208" class="tick"/>
  <text x="60" y="220" text-anchor="middle" class="sm dim">0</text>
