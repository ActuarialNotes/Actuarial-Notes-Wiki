<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Squared deviations from the sample mean, divided by n − 1</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Average the squared deviations</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">S² = Σ (Xᵢ − X̄)² / (n − 1)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[S²] = σ²</text>
  <line x1="64" y1="344" x2="336" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="344" x2="64" y2="96" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="344" x2="64" y2="344" class="tick"/>
  <text x="56" y="347.6" text-anchor="end" class="sm dim">0</text>
  <line x1="60" y1="235.82" x2="64" y2="235.82" class="tick"/>
  <text x="56" y="239.42" text-anchor="end" class="sm dim">10</text>
  <line x1="60" y1="127.64" x2="64" y2="127.64" class="tick"/>
  <text x="56" y="131.24" text-anchor="end" class="sm dim">20</text>
  <line x1="64" y1="235.82" x2="326" y2="235.82" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
  <text x="79.28" y="229.82" text-anchor="start" class="sm" fill="#e11d48">X̄ = 10</text>
  <polyline points="107.67,235.82 107.67,300.73" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="107.67" cy="300.73" r="4" fill="#3b82f6"/>
  <text x="120.67" y="268.27" text-anchor="middle" class="sm" fill="#3b82f6">-6</text>
  <polyline points="151.33,235.82 151.33,279.09" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="151.33" cy="279.09" r="4" fill="#3b82f6"/>
  <text x="164.33" y="257.45" text-anchor="middle" class="sm" fill="#3b82f6">-4</text>
  <polyline points="195,235.82 195,246.64" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="195" cy="246.64" r="4" fill="#3b82f6"/>
  <text x="208" y="241.23" text-anchor="middle" class="sm" fill="#3b82f6">-1</text>
  <polyline points="238.67,235.82 238.67,225" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="238.67" cy="225" r="4" fill="#3b82f6"/>
  <text x="251.67" y="230.41" text-anchor="middle" class="sm" fill="#3b82f6">+1</text>
  <polyline points="282.33,235.82 282.33,127.64" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="282.33" cy="127.64" r="4" fill="#3b82f6"/>
  <text x="295.33" y="181.73" text-anchor="middle" class="sm" fill="#3b82f6">+10</text>
  <text x="44" y="382" text-anchor="start" class="sm">Σ(Xᵢ − X̄)² = 154</text>
  <text x="316" y="382" text-anchor="end" class="sm bold">S² = 154 / 4 = 38.5</text>
</svg>
