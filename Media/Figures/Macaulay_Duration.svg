<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>Each cash flow's present value weighting its own time</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Macaulay duration weights each date by its share of the price</text>
  <rect x="87.51" y="193.27" width="15.28" height="8.73" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="110.66" y="193.69" width="15.28" height="8.31" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="133.81" y="194.08" width="15.28" height="7.92" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="156.95" y="194.46" width="15.28" height="7.54" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="180.1" y="194.82" width="15.28" height="7.18" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="203.25" y="195.16" width="15.28" height="6.84" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="226.4" y="195.49" width="15.28" height="6.51" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="249.55" y="195.8" width="15.28" height="6.2" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="272.69" y="196.09" width="15.28" height="5.91" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="295.84" y="83.82" width="15.28" height="118.18" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <line x1="72" y1="202" x2="332" y2="202" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="202" x2="72" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="95.15" y1="202" x2="95.15" y2="206" class="tick"/>
  <text x="95.15" y="218" text-anchor="middle" class="sm dim">1</text>
  <line x1="118.3" y1="202" x2="118.3" y2="206" class="tick"/>
  <text x="118.3" y="218" text-anchor="middle" class="sm dim">2</text>
  <line x1="141.44" y1="202" x2="141.44" y2="206" class="tick"/>
  <text x="141.44" y="218" text-anchor="middle" class="sm dim">3</text>
  <line x1="164.59" y1="202" x2="164.59" y2="206" class="tick"/>
  <text x="164.59" y="218" text-anchor="middle" class="sm dim">4</text>
  <line x1="187.74" y1="202" x2="187.74" y2="206" class="tick"/>
  <text x="187.74" y="218" text-anchor="middle" class="sm dim">5</text>
  <line x1="210.89" y1="202" x2="210.89" y2="206" class="tick"/>
  <text x="210.89" y="218" text-anchor="middle" class="sm dim">6</text>
  <line x1="234.04" y1="202" x2="234.04" y2="206" class="tick"/>
  <text x="234.04" y="218" text-anchor="middle" class="sm dim">7</text>
  <line x1="257.19" y1="202" x2="257.19" y2="206" class="tick"/>
  <text x="257.19" y="218" text-anchor="middle" class="sm dim">8</text>
  <line x1="280.33" y1="202" x2="280.33" y2="206" class="tick"/>
  <text x="280.33" y="218" text-anchor="middle" class="sm dim">9</text>
  <line x1="303.48" y1="202" x2="303.48" y2="206" class="tick"/>
  <text x="303.48" y="218" text-anchor="middle" class="sm dim">10</text>
  <line x1="68" y1="202" x2="72" y2="202" class="tick"/>
  <text x="64" y="205.6" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="156.17" x2="72" y2="156.17" class="tick"/>
  <text x="64" y="159.77" text-anchor="end" class="sm dim">0.25</text>
  <line x1="68" y1="110.33" x2="72" y2="110.33" class="tick"/>
  <text x="64" y="113.93" text-anchor="end" class="sm dim">0.5</text>
  <text x="68" y="56" text-anchor="start" class="sm dim">weight  PV(C_t)/P</text>
  <text x="322" y="234" text-anchor="end" class="sm dim">time t</text>
  <line x1="259.68" y1="202" x2="259.68" y2="70" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="259.68" y="82" text-anchor="middle" class="sm bold" fill="#d97706">8.11</text>
  <text x="430" y="96" text-anchor="middle" class="sm bold">D_Mac = Σ t·PV(C_t) / P</text>
  <text x="430" y="116" text-anchor="middle" class="sm dim">the weights sum to 1</text>
  <rect x="342" y="134" width="186" height="60" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="435" y="156" text-anchor="middle" class="sm bold">Measured in time units</text>
  <text x="435" y="174" text-anchor="middle" class="sm dim">periods, not percent</text>
  <rect x="342" y="202" width="186" height="60" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="435" y="224" text-anchor="middle" class="sm bold">Perpetuity</text>
  <text x="435" y="242" text-anchor="middle" class="sm dim">D_Mac = (1 + j)/j = 1/d</text>
  <text x="280" y="288" text-anchor="middle" class="sm dim">A zero-coupon bond has duration exactly equal to its term</text>
</svg>
