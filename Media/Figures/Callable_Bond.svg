<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>The issuer's call option and the worst-case pricing rule</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A callable bond can be redeemed early — price the worst case</text>
  <line x1="88" y1="122" x2="442" y2="122" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="96" y1="118" x2="96" y2="126" class="tick"/>
  <text x="96" y="139" text-anchor="middle" class="sm dim">0</text>
  <line x1="137" y1="118" x2="137" y2="126" class="tick"/>
  <text x="137" y="139" text-anchor="middle" class="sm dim">1</text>
  <line x1="178" y1="118" x2="178" y2="126" class="tick"/>
  <text x="178" y="139" text-anchor="middle" class="sm dim">…</text>
  <line x1="219" y1="118" x2="219" y2="126" class="tick"/>
  <line x1="260" y1="118" x2="260" y2="126" class="tick"/>
  <text x="260" y="139" text-anchor="middle" class="sm dim">call</text>
  <line x1="301" y1="118" x2="301" y2="126" class="tick"/>
  <line x1="342" y1="118" x2="342" y2="126" class="tick"/>
  <text x="342" y="139" text-anchor="middle" class="sm dim">…</text>
  <line x1="383" y1="118" x2="383" y2="126" class="tick"/>
  <line x1="424" y1="118" x2="424" y2="126" class="tick"/>
  <text x="424" y="139" text-anchor="middle" class="sm dim">n</text>
  <line x1="137" y1="122" x2="137" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="178" y1="122" x2="178" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="219" y1="122" x2="219" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="260" y1="122" x2="260" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="301" y1="122" x2="301" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="342" y1="122" x2="342" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="383" y1="122" x2="383" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="424" y1="122" x2="424" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="260" y1="122" x2="260" y2="66" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="260" y="56" text-anchor="middle" class="sm bold" fill="#d97706">earliest call</text>
  <line x1="424" y1="122" x2="424" y2="66" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="424" y="56" text-anchor="middle" class="sm bold" fill="#059669">maturity</text>
  <line x1="260" y1="148" x2="424" y2="148" class="thin dash" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="342" y="164" text-anchor="middle" class="sm dim">the issuer chooses somewhere in here</text>
  <line x1="28" y1="190" x2="532" y2="190" class="rule"/>
  <text x="280" y="212" text-anchor="middle" class="sm bold">Price at the redemption date that is worst for the investor</text>
  <rect x="60" y="232" width="226" height="48" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="173" y="252" text-anchor="middle" class="sm bold">Priced at a premium</text>
  <text x="173" y="270" text-anchor="middle" class="sm dim">assume the earliest call date</text>
  <rect x="310" y="232" width="226" height="48" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="423" y="252" text-anchor="middle" class="sm bold">Priced at a discount</text>
  <text x="423" y="270" text-anchor="middle" class="sm dim">assume the latest date — maturity</text>
  <text x="280" y="294" text-anchor="middle" class="sm dim">Issuers call when rates fall — that is the investor's reinvestment risk</text>
</svg>
