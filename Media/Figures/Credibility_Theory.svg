<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A seesaw balancing the manual rate of 380 against the class's own 420, weighted 1 − Z and Z, so it tips at the estimate 401</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="35" y="153.21" width="58" height="108.79" rx="4" fill="#d97706" fill-opacity="0.3" stroke="#d97706" stroke-width="1.4"/>
    <text x="64" y="211.61" text-anchor="middle" class="bold">1 − Z</text>
    <text x="64" y="143.21" text-anchor="middle" class="sm">manual</text>
    <line x1="64" y1="268" x2="64" y2="312" class="thin dash" stroke="var(--axis)" stroke-width="1.1"/>
    <rect x="267" y="140.79" width="58" height="121.21" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="296" y="205.39" text-anchor="middle" class="bold">Z</text>
    <text x="296" y="130.79" text-anchor="middle" class="sm">own data</text>
    <line x1="296" y1="268" x2="296" y2="312" class="thin dash" stroke="var(--axis)" stroke-width="1.1"/>
    <rect x="31" y="262" width="298" height="6" rx="3" fill="var(--ink)" fill-opacity="0.7"/>
    <polygon points="186.26,268 166.26,312 206.26,312" fill="#059669" fill-opacity="0.3" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="28" y1="312" x2="332" y2="312" class="axis"/>
    <text x="64" y="331" text-anchor="middle" class="sm dim">380</text>
    <text x="186.26" y="331" text-anchor="middle" class="bold">401</text>
    <text x="296" y="331" text-anchor="middle" class="sm dim">420</text>
  </g>
</svg>
