<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>AIC and BIC curves over model size: BIC's heavier penalty per parameter puts its minimum at a smaller model than AIC's</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="50" y1="348" x2="336" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="50" y1="348" x2="50" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="73" y1="348" x2="73" y2="352" class="tick"/>
    <text x="73" y="364" text-anchor="middle" class="sm dim">1</text>
    <line x1="149.67" y1="348" x2="149.67" y2="352" class="tick"/>
    <text x="149.67" y="364" text-anchor="middle" class="sm dim">3</text>
    <line x1="226.33" y1="348" x2="226.33" y2="352" class="tick"/>
    <text x="226.33" y="364" text-anchor="middle" class="sm dim">5</text>
    <line x1="303" y1="348" x2="303" y2="352" class="tick"/>
    <text x="303" y="364" text-anchor="middle" class="sm dim">7</text>
    <text x="326" y="380" text-anchor="end" class="sm dim">parameters p</text>
    <polyline points="73,137.24 111.33,231.16 149.67,315.93 188,320.51 226.33,318.22 264.67,314.78 303,311.35" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <circle cx="73" cy="137.24" r="2.8" fill="#3b82f6"/>
    <circle cx="111.33" cy="231.16" r="2.8" fill="#3b82f6"/>
    <circle cx="149.67" cy="315.93" r="2.8" fill="#3b82f6"/>
    <circle cx="188" cy="320.51" r="5" fill="#3b82f6"/>
    <circle cx="226.33" cy="318.22" r="2.8" fill="#3b82f6"/>
    <circle cx="264.67" cy="314.78" r="2.8" fill="#3b82f6"/>
    <circle cx="303" cy="311.35" r="2.8" fill="#3b82f6"/>
    <text x="313" y="315.35" text-anchor="start" class="sm bold">AIC</text>
    <line x1="188" y1="327.51" x2="188" y2="348" class="thin dash" stroke="#3b82f6" stroke-width="1.2"/>
    <polyline points="73,127.58 111.33,211.85 149.67,286.96 188,281.89 226.33,269.94 264.67,256.85 303,243.76" class="curve" stroke="#e11d48" stroke-width="2.4"/>
    <circle cx="73" cy="127.58" r="2.8" fill="#e11d48"/>
    <circle cx="111.33" cy="211.85" r="2.8" fill="#e11d48"/>
    <circle cx="149.67" cy="286.96" r="5" fill="#e11d48"/>
    <circle cx="188" cy="281.89" r="2.8" fill="#e11d48"/>
    <circle cx="226.33" cy="269.94" r="2.8" fill="#e11d48"/>
    <circle cx="264.67" cy="256.85" r="2.8" fill="#e11d48"/>
    <circle cx="303" cy="243.76" r="2.8" fill="#e11d48"/>
    <text x="313" y="247.76" text-anchor="start" class="sm bold">BIC</text>
    <line x1="149.67" y1="293.96" x2="149.67" y2="348" class="thin dash" stroke="#e11d48" stroke-width="1.2"/>
  </g>
</svg>
