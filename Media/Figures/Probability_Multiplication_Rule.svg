<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" width="560" height="284" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="282.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Chain the stages: P(A ∩ B) = P(A) · P(B | A)</text>
  <circle cx="58" cy="150" r="6" fill="var(--dim)"/>
  <line x1="66" y1="150" x2="148" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah3b82f6)"/>
  <text x="102" y="113" text-anchor="middle" class="sm" fill="#3b82f6">0.30</text>
  <circle cx="156" cy="92" r="15" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="156" y="96" text-anchor="middle" class="sm">A</text>
  <line x1="66" y1="150" x2="148" y2="208" class="thin" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#ahvardim)"/>
  <text x="102" y="171" text-anchor="middle" class="sm" fill="var(--dim)">0.70</text>
  <circle cx="156" cy="208" r="15" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="156" y="212" text-anchor="middle" class="sm">Aᶜ</text>
  <line x1="172" y1="92" x2="268" y2="66" class="thin" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
  <text x="216" y="72" text-anchor="middle" class="sm" fill="#059669">0.80</text>
  <circle cx="278" cy="66" r="15" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
  <text x="278" y="70" text-anchor="middle" class="sm">B</text>
  <text x="306" y="70" text-anchor="start" class="sm bold">0.30 × 0.80 = 0.24</text>
  <line x1="172" y1="92" x2="268" y2="122" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="216" y="100" text-anchor="middle" class="sm" fill="var(--dim)">0.20</text>
  <circle cx="278" cy="122" r="15" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="278" y="126" text-anchor="middle" class="sm">Bᶜ</text>
  <text x="306" y="126" text-anchor="start" class="sm dim">0.30 × 0.20 = 0.06</text>
  <line x1="172" y1="208" x2="268" y2="182" class="thin" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
  <text x="216" y="188" text-anchor="middle" class="sm" fill="#059669">0.10</text>
  <circle cx="278" cy="182" r="15" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.3"/>
  <text x="278" y="186" text-anchor="middle" class="sm">B</text>
  <text x="306" y="186" text-anchor="start" class="sm dim">0.70 × 0.10 = 0.07</text>
  <line x1="172" y1="208" x2="268" y2="238" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="216" y="216" text-anchor="middle" class="sm" fill="var(--dim)">0.90</text>
  <circle cx="278" cy="238" r="15" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="278" y="242" text-anchor="middle" class="sm">Bᶜ</text>
  <text x="306" y="242" text-anchor="start" class="sm dim">0.70 × 0.90 = 0.63</text>
  <line x1="28" y1="262" x2="532" y2="262" class="rule"/>
  <text x="280" y="278" text-anchor="middle" class="sm dim">The four paths partition the space — their probabilities sum to 1</text>
</svg>
