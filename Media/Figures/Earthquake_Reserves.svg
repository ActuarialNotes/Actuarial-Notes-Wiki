<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A 1-in-500 countrywide earthquake PML of 385 beside the resources stacked against it — 200 of reinsurance, 40 of capital, a 25 earthquake premium reserve and the 120 reserve component that closes the gap — with the premium reserve and the component braced as the reserve, times 1.25</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="50" y="97.9" width="84" height="254.1" rx="3" fill="#e11d48" fill-opacity="0.6"/>
    <text x="92" y="89.9" text-anchor="middle" class="sm bold">PML 385</text>
    <text x="92" y="370" text-anchor="middle" class="sm dim">1-in-500</text>
    <rect x="172" y="220" width="84" height="132" rx="3" fill="#0d9488" fill-opacity="0.6"/>
    <text x="214" y="290" text-anchor="middle" class="sm">reinsurance</text>
    <rect x="172" y="193.6" width="84" height="26.4" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
    <text x="214" y="210.8" text-anchor="middle" class="sm">capital</text>
    <rect x="172" y="177.1" width="84" height="16.5" rx="3" fill="#d97706" fill-opacity="0.6"/>
    <text x="214" y="189.35" text-anchor="middle" class="sm bold">EPR</text>
    <rect x="172" y="97.9" width="84" height="79.2" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
    <text x="214" y="141.5" text-anchor="middle" class="sm bold">ERC</text>
    <text x="214" y="370" text-anchor="middle" class="sm dim">resources</text>
    <line x1="134" y1="97.9" x2="172" y2="97.9" class="thin dot" stroke="var(--dim)"/>
    <path d="M262.0,97.89999999999999 h8 V193.6 h-8" class="thin" stroke="var(--ink)" stroke-width="1.4" fill="none"/>
    <text x="276" y="149.75" text-anchor="start" class="sm bold">× 1.25</text>
    <line x1="40" y1="352" x2="320" y2="352" class="axis"/>
  </g>
</svg>
