<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 282" width="560" height="282" role="img">
  <title>Coinsurance flattening the payment line by the factor alpha</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="280.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Coinsurance shares each covered dollar</text>
  <polyline points="54,206 328,64" class="curve dash" stroke="var(--dim)" stroke-width="1.1"/>
  <text x="295.12" y="72.52" text-anchor="middle" class="sm dim">Y = X</text>
  <polyline points="54,206 108.8,206 328,115.12" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <polyline points="54,206 108.8,206 328,92.4" class="curve dash" stroke="var(--dim)" stroke-width="1.4"/>
  <polygon points="108.8,206 328,92.4 328,115.12" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="273.2" y="98.08" text-anchor="middle" class="sm">insured's</text>
  <text x="273.2" y="109.44" text-anchor="middle" class="sm">1 − α share</text>
  <line x1="54" y1="206" x2="338" y2="206" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="54" y1="206" x2="54" y2="54" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="108.8" y1="206" x2="108.8" y2="210" class="tick"/>
  <text x="108.8" y="222" text-anchor="middle" class="sm dim">d</text>
  <text x="328" y="238" text-anchor="end" class="sm dim">loss X</text>
  <text x="50" y="50" text-anchor="start" class="sm dim">payment Y</text>
  <line x1="60" y1="76" x2="73" y2="76" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="79" y="79.6" text-anchor="start" class="sm">Y = α (X − d)₊,  α = 0.8</text>
  <line x1="60" y1="92" x2="73" y2="92" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="79" y="95.6" text-anchor="start" class="sm">α = 1: insurer pays it all</text>
  <text x="420" y="100" text-anchor="middle" class="sm bold">α ∈ (0, 1] is the insurer's share</text>
  <line x1="316" y1="122" x2="316" y2="154" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="134" text-anchor="start" class="sm bold">E[Y] scales by α</text>
  <text x="326" y="150" text-anchor="start" class="sm dim">expectation is linear</text>
  <line x1="316" y1="168" x2="316" y2="200" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="180" text-anchor="start" class="sm bold">Var(Y) scales by α²</text>
  <text x="326" y="196" text-anchor="start" class="sm dim">coefficients enter squared</text>
  <line x1="316" y1="214" x2="316" y2="246" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="226" text-anchor="start" class="sm bold">Order matters</text>
  <text x="326" y="242" text-anchor="start" class="sm dim">deductible first, then α, then the limit</text>
  <text x="280" y="268" text-anchor="middle" class="sm dim">The insured keeps the fraction 1 − α of every covered dollar</text>
</svg>
