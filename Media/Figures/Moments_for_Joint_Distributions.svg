<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>E[XY] built cell by cell from a joint table</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="112" y="132" text-anchor="middle" class="sm dim">y = 0</text>
    <text x="180" y="132" text-anchor="middle" class="sm dim">y = 1</text>
    <text x="248" y="132" text-anchor="middle" class="sm dim">y = 2</text>
    <text x="70" y="168" text-anchor="end" class="sm dim">x = 0</text>
    <text x="70" y="216" text-anchor="end" class="sm dim">x = 1</text>
    <text x="70" y="264" text-anchor="end" class="sm dim">x = 2</text>
    <rect x="78" y="140" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="112" y="168" text-anchor="middle" class="sm">0.10</text>
    <rect x="146" y="140" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="180" y="168" text-anchor="middle" class="sm">0.08</text>
    <rect x="214" y="140" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="248" y="168" text-anchor="middle" class="sm">0.02</text>
    <rect x="78" y="188" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="112" y="216" text-anchor="middle" class="sm">0.06</text>
    <rect x="146" y="188" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="180" y="216" text-anchor="middle" class="sm">0.20</text>
    <rect x="214" y="188" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="248" y="216" text-anchor="middle" class="sm">0.14</text>
    <rect x="78" y="236" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="112" y="264" text-anchor="middle" class="sm">0.04</text>
    <rect x="146" y="236" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="180" y="264" text-anchor="middle" class="sm">0.12</text>
    <rect x="214" y="236" width="68" height="48" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
    <text x="248" y="264" text-anchor="middle" class="sm">0.24</text>
    <text x="180" y="332" text-anchor="middle" class="sm dim">each cell contributes g(x, y) · p(x, y)</text>
  </g>
</svg>
