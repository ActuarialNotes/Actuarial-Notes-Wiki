<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Underwriter credits and debits stepping the manual 1.00 down, row by row, to a 0.95 schedule modifier</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="300" y1="94" x2="300" y2="370" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="300" y="86" text-anchor="middle" class="sm dim">1.00</text>
    <rect x="200" y="103" width="100" height="22" rx="3" fill="#059669" fill-opacity="0.6" stroke="#059669" stroke-width="1.2"/>
    <text x="108" y="118" text-anchor="end" class="sm">premises</text>
    <line x1="200" y1="125" x2="200" y2="149" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="150" y="149" width="50" height="22" rx="3" fill="#059669" fill-opacity="0.6" stroke="#059669" stroke-width="1.2"/>
    <text x="108" y="164" text-anchor="end" class="sm">class</text>
    <line x1="150" y1="171" x2="150" y2="195" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="150" y="195" width="80" height="22" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1.2"/>
    <text x="108" y="210" text-anchor="end" class="sm">staff</text>
    <line x1="230" y1="217" x2="230" y2="241" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="200" y="241" width="30" height="22" rx="3" fill="#059669" fill-opacity="0.6" stroke="#059669" stroke-width="1.2"/>
    <text x="108" y="256" text-anchor="end" class="sm">management</text>
    <line x1="200" y1="263" x2="200" y2="287" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="200" y="287" width="50" height="22" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1.2"/>
    <text x="108" y="302" text-anchor="end" class="sm">equipment</text>
    <line x1="250" y1="309" x2="250" y2="345" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="250" y="344" width="50" height="24" rx="3" fill="#3b82f6" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="108" y="360" text-anchor="end" class="sm bold">modifier</text>
    <text x="244" y="360" text-anchor="end" class="sm bold">0.95</text>
  </g>
</svg>
