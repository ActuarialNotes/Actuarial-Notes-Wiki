<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" width="560" height="296" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="294.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Book value walks the price to the redemption value</text>
  <polyline points="72,92.7 97.4,97.33 122.8,102.1 148.2,107.01 173.6,112.07 199,117.28 224.4,122.65 249.8,128.18 275.2,133.87 300.6,139.74 326,145.78" class="curve" stroke="#d97706" stroke-width="2"/>
  <polyline points="72,189.48 97.4,186.32 122.8,182.93 148.2,179.31 173.6,175.44 199,171.29 224.4,166.85 249.8,162.11 275.2,157.03 300.6,151.59 326,145.78" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <line x1="72" y1="145.78" x2="326" y2="145.78" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <circle cx="72" cy="92.7" r="2.6" fill="#d97706"/>
  <circle cx="97.4" cy="97.33" r="2.6" fill="#d97706"/>
  <circle cx="122.8" cy="102.1" r="2.6" fill="#d97706"/>
  <circle cx="148.2" cy="107.01" r="2.6" fill="#d97706"/>
  <circle cx="173.6" cy="112.07" r="2.6" fill="#d97706"/>
  <circle cx="199" cy="117.28" r="2.6" fill="#d97706"/>
  <circle cx="224.4" cy="122.65" r="2.6" fill="#d97706"/>
  <circle cx="249.8" cy="128.18" r="2.6" fill="#d97706"/>
  <circle cx="275.2" cy="133.87" r="2.6" fill="#d97706"/>
  <circle cx="300.6" cy="139.74" r="2.6" fill="#d97706"/>
  <circle cx="326" cy="145.78" r="2.6" fill="#d97706"/>
  <circle cx="72" cy="189.48" r="2.6" fill="#3b82f6"/>
  <circle cx="97.4" cy="186.32" r="2.6" fill="#3b82f6"/>
  <circle cx="122.8" cy="182.93" r="2.6" fill="#3b82f6"/>
  <circle cx="148.2" cy="179.31" r="2.6" fill="#3b82f6"/>
  <circle cx="173.6" cy="175.44" r="2.6" fill="#3b82f6"/>
  <circle cx="199" cy="171.29" r="2.6" fill="#3b82f6"/>
  <circle cx="224.4" cy="166.85" r="2.6" fill="#3b82f6"/>
  <circle cx="249.8" cy="162.11" r="2.6" fill="#3b82f6"/>
  <circle cx="275.2" cy="157.03" r="2.6" fill="#3b82f6"/>
  <circle cx="300.6" cy="151.59" r="2.6" fill="#3b82f6"/>
  <circle cx="326" cy="145.78" r="2.6" fill="#3b82f6"/>
  <text x="132.96" y="85.11" text-anchor="start" class="sm bold">premium bond</text>
  <text x="132.96" y="185.6" text-anchor="start" class="sm bold">discount bond</text>
  <text x="318" y="137.78" text-anchor="middle" class="sm bold">C</text>
  <line x1="72" y1="208" x2="336" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="208" x2="72" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="208" x2="72" y2="212" class="tick"/>
  <text x="72" y="224" text-anchor="middle" class="sm dim">0</text>
  <line x1="199" y1="208" x2="199" y2="212" class="tick"/>
  <text x="199" y="224" text-anchor="middle" class="sm dim">5</text>
  <line x1="326" y1="208" x2="326" y2="212" class="tick"/>
  <text x="326" y="224" text-anchor="middle" class="sm dim">10</text>
  <line x1="68" y1="176.89" x2="72" y2="176.89" class="tick"/>
  <text x="64" y="180.49" text-anchor="end" class="sm dim">900</text>
  <line x1="68" y1="145.78" x2="72" y2="145.78" class="tick"/>
  <text x="64" y="149.38" text-anchor="end" class="sm dim">1,000</text>
  <line x1="68" y1="114.67" x2="72" y2="114.67" class="tick"/>
  <text x="64" y="118.27" text-anchor="end" class="sm dim">1,100</text>
  <line x1="68" y1="83.56" x2="72" y2="83.56" class="tick"/>
  <text x="64" y="87.16" text-anchor="end" class="sm dim">1,200</text>
  <text x="326" y="240" text-anchor="end" class="sm dim">coupons paid</text>
  <text x="68" y="54" text-anchor="start" class="sm dim">book value</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">BV₀ = P   and   BVₙ = C</text>
  <rect x="340" y="118" width="190" height="62" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="435" y="140" text-anchor="middle" class="sm bold">Prospective</text>
  <text x="435" y="160" text-anchor="middle" class="sm dim">BV_k = Fr·a₍ₙ₋ₖ₎ + C·v^(n−k)</text>
  <rect x="340" y="188" width="190" height="62" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="435" y="210" text-anchor="middle" class="sm bold">Retrospective</text>
  <text x="435" y="230" text-anchor="middle" class="sm dim">BV_k = P(1+j)ᵏ − Fr·s₍ₖ₎</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">Always at the original yield j — book value is not market value</text>
</svg>
