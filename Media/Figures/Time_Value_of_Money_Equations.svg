<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 274" width="560" height="274" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="272.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Every FM calculation is one of these moves</text>
  <rect x="44" y="84" width="152" height="48" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="120" y="113" text-anchor="middle" class="sm bold">PV</text>
  <rect x="224" y="84" width="152" height="48" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="300" y="113" text-anchor="middle" class="sm bold">FV</text>
  <rect x="44" y="176" width="152" height="48" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="120" y="205" text-anchor="middle" class="sm bold">a₍ₙ₎ — level PV</text>
  <rect x="224" y="176" width="152" height="48" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="300" y="205" text-anchor="middle" class="sm bold">s₍ₙ₎ — level AV</text>
  <line x1="200" y1="96" x2="220" y2="96" class="thin" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
  <text x="210" y="84" text-anchor="middle" class="sm" fill="#059669">× (1 + i)ⁿ</text>
  <line x1="220" y1="122" x2="200" y2="122" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <text x="210" y="140" text-anchor="middle" class="sm" fill="#d97706">× vⁿ</text>
  <line x1="120" y1="172" x2="120" y2="136" class="thin dash" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#ah3b82f6)"/>
  <text x="112" y="158" text-anchor="end" class="sm dim">× payment</text>
  <line x1="300" y1="172" x2="300" y2="136" class="thin dash" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#ah7c3aed)"/>
  <text x="310" y="158" text-anchor="start" class="sm dim">× payment</text>
  <line x1="200" y1="200" x2="220" y2="200" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="210" y="220" text-anchor="middle" class="sm dim">× (1 + i)ⁿ</text>
  <text x="524" y="96" text-anchor="end" class="sm bold">FV = PV (1 + i)ⁿ</text>
  <text x="524" y="116" text-anchor="end" class="sm dim">PV = FV vⁿ</text>
  <text x="524" y="150" text-anchor="end" class="sm bold">s₍ₙ₎ = (1 + i)ⁿ a₍ₙ₎</text>
  <text x="524" y="170" text-anchor="end" class="sm dim">the same two-date move</text>
  <text x="524" y="204" text-anchor="end" class="sm bold">General form</text>
  <text x="524" y="224" text-anchor="end" class="sm dim">Σ C_k · a(t₀)/a(t_k)</text>
  <line x1="28" y1="244" x2="532" y2="244" class="rule"/>
  <text x="280" y="264" text-anchor="middle" class="sm dim">Same rate, same timeline — only the valuation date ever changes</text>
</svg>
