<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A balance stepping up by × 1.03 at each quarter to 1.1255, above the straight dashed line to the quoted 1.12</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <polyline points="66,352 326,115.56" class="curve dash" stroke="var(--dim)" stroke-width="1.6"/>
    <polyline points="66,352 131,352 131,292.89 196,292.89 196,232 261,232 261,169.29 326,169.29 326,104.7" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <text x="163.5" y="308.89" text-anchor="middle" class="sm bold" fill="#3b82f6">× 1.03</text>
    <circle cx="326" cy="104.7" r="3.6" fill="#3b82f6"/>
    <text x="302" y="100.7" text-anchor="middle" class="sm">1.1255</text>
    <line x1="66" y1="352" x2="336" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="352" x2="66" y2="76" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="352" x2="66" y2="356" class="tick"/>
    <text x="66" y="368" text-anchor="middle" class="sm dim">0</text>
    <line x1="131" y1="352" x2="131" y2="356" class="tick"/>
    <text x="131" y="368" text-anchor="middle" class="sm dim">¼</text>
    <line x1="196" y1="352" x2="196" y2="356" class="tick"/>
    <text x="196" y="368" text-anchor="middle" class="sm dim">½</text>
    <line x1="261" y1="352" x2="261" y2="356" class="tick"/>
    <text x="261" y="368" text-anchor="middle" class="sm dim">¾</text>
    <line x1="326" y1="352" x2="326" y2="356" class="tick"/>
    <text x="326" y="368" text-anchor="middle" class="sm dim">1</text>
    <line x1="62" y1="352" x2="66" y2="352" class="tick"/>
    <text x="58" y="355.6" text-anchor="end" class="sm dim">1</text>
    <line x1="62" y1="115.56" x2="66" y2="115.56" class="tick"/>
    <text x="58" y="119.16" text-anchor="end" class="sm dim">1.12</text>
  </g>
</svg>
