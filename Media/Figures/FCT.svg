<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The FCT opinion — the base scenario above the supervisory target and every adverse scenario above the minimum</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Satisfactory means both tests pass</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Base ≥ supervisory target</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Every adverse scenario ≥ minimum</text>
  <line x1="76" y1="250.93" x2="322" y2="250.93" class="thin dash" stroke="#e11d48" stroke-width="1.4"/>
  <text x="70" y="254.93" text-anchor="end" class="sm" fill="#e11d48">100%</text>
  <line x1="76" y1="189.6" x2="322" y2="189.6" class="thin dash" stroke="#d97706" stroke-width="1.4"/>
  <text x="70" y="193.6" text-anchor="end" class="sm" fill="#d97706">150%</text>
  <line x1="76" y1="300" x2="322" y2="300" class="axis"/>
  <rect x="100" y="167.52" width="36" height="132.48" rx="3" fill="#059669" fill-opacity="0.55"/>
  <text x="118" y="160.52" text-anchor="middle" class="sm">168%</text>
  <text x="118" y="318" text-anchor="middle" class="sm dim">base</text>
  <rect x="156" y="221.49" width="36" height="78.51" rx="3" fill="#0d9488" fill-opacity="0.55"/>
  <text x="174" y="214.49" text-anchor="middle" class="sm">124%</text>
  <text x="174" y="318" text-anchor="middle" class="sm dim">cat</text>
  <rect x="212" y="236.21" width="36" height="63.79" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="230" y="229.21" text-anchor="middle" class="sm">112%</text>
  <text x="230" y="318" text-anchor="middle" class="sm dim">reserves</text>
  <rect x="268" y="268.11" width="36" height="31.89" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="286" y="261.11" text-anchor="middle" class="sm">86%</text>
  <text x="286" y="318" text-anchor="middle" class="sm dim">solvency</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">the solvency scenario fails — the opinion cannot</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">be that the financial condition is satisfactory</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">it replaced DCAT in 2020, adding reverse stress testing</text>
</svg>
