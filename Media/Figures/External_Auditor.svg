<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Actuary and auditor relying on each other, and the judgements they can genuinely disagree about</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Mutual reliance, and neither replaces</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">the other</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">The auditor opines on the statements;</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the actuary on the liabilities</text>
  <rect x="36" y="98" width="112" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="92" y="116" text-anchor="middle" class="sm">actuary</text>
  <rect x="212" y="98" width="112" height="28" rx="14.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="268" y="116" text-anchor="middle" class="sm">auditor</text>
  <line x1="150" y1="104" x2="210" y2="104" class="thin" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah3b82f6)"/>
  <line x1="210" y1="122" x2="150" y2="122" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <text x="180" y="150" text-anchor="middle" class="sm dim">the valuation and the AA's report go one way,</text>
  <text x="180" y="166" text-anchor="middle" class="sm dim">data and asset information the other</text>
  <line x1="30" y1="188" x2="330" y2="188" class="rule"/>
  <text x="180" y="210" text-anchor="middle" class="sm bold">where they can genuinely disagree</text>
  <text x="36" y="234" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="234" text-anchor="start" class="sm">the risk adjustment's confidence level</text>
  <text x="36" y="259" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="259" text-anchor="start" class="sm">the discount rate and illiquidity premium</text>
  <text x="36" y="284" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="284" text-anchor="start" class="sm">which groups are onerous</text>
  <text x="36" y="309" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="309" text-anchor="start" class="sm">and the materiality standard each applies</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">they meet at the audit committee — a board that</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">hears them only separately loses the disagreement</text>
</svg>
