<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A timeline from the accident to discovery, when the clock starts: a short basic period runs two years from discovery inside an ultimate period running fifteen years from the act</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="34" y1="318" x2="334" y2="318" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="52" y1="313" x2="52" y2="323" class="tick"/>
    <text x="52" y="340" text-anchor="middle" class="sm bold">act</text>
    <line x1="130" y1="313" x2="130" y2="323" class="tick"/>
    <text x="130" y="340" text-anchor="middle" class="sm bold">discovery</text>
    <line x1="236" y1="313" x2="236" y2="323" class="tick"/>
    <text x="236" y="340" text-anchor="middle" class="sm bold">2 years</text>
    <line x1="312" y1="313" x2="312" y2="323" class="tick"/>
    <text x="312" y="340" text-anchor="middle" class="sm bold">15 years</text>
    <rect x="52" y="206" width="260" height="30" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="182" y="226" text-anchor="middle" class="sm bold">ultimate</text>
    <rect x="130" y="250" width="106" height="30" rx="4" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="183" y="270" text-anchor="middle" class="sm bold">basic</text>
    <path d="M20,156.4 V147.44 L32.8,144.88 L41.76,134.64 H63.52 L72.48,144.88 L84,148.72 V156.4 Z" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="34.08" cy="157.68" r="5.76" fill="var(--surf)" stroke="#e11d48" stroke-width="1.6"/>
    <circle cx="69.92" cy="157.68" r="5.76" fill="var(--surf)" stroke="#e11d48" stroke-width="1.6"/>
    <circle cx="130" cy="150" r="28" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4"/>
    <line x1="151.84" y1="150" x2="155.2" y2="150" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="148.91" y1="160.92" x2="151.82" y2="162.6" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="140.92" y1="168.91" x2="142.6" y2="171.82" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="130" y1="171.84" x2="130" y2="175.2" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="119.08" y1="168.91" x2="117.4" y2="171.82" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="111.09" y1="160.92" x2="108.18" y2="162.6" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="108.16" y1="150" x2="104.8" y2="150" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="111.09" y1="139.08" x2="108.18" y2="137.4" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="119.08" y1="131.09" x2="117.4" y2="128.18" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="130" y1="128.16" x2="130" y2="124.8" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="140.92" y1="131.09" x2="142.6" y2="128.18" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="148.91" y1="139.08" x2="151.82" y2="137.4" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="130" y1="150" x2="130" y2="132.64" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="150" x2="142.32" y2="153.36" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="184" x2="52" y2="204" class="thin dot" stroke="var(--dim)" stroke-width="1.4"/>
    <line x1="130" y1="184" x2="130" y2="204" class="thin dot" stroke="var(--dim)" stroke-width="1.4"/>
  </g>
</svg>
