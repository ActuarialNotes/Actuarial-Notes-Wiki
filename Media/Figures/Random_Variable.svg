<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A random variable mapping outcomes of two coin tosses to the number of heads</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A random variable maps outcomes to</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">numbers</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">X : S → ℝ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">here X = number of heads</text>
  <rect x="36" y="110" width="288" height="92" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="49" y="126" text-anchor="middle" class="sm dim">S</text>
  <rect x="42" y="152" width="64" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="74" y="174" text-anchor="middle">TT</text>
  <rect x="114" y="152" width="64" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="146" y="174" text-anchor="middle">HT</text>
  <rect x="186" y="152" width="64" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="218" y="174" text-anchor="middle">TH</text>
  <rect x="258" y="152" width="64" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="290" y="174" text-anchor="middle">HH</text>
  <line x1="50" y1="330" x2="310" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="320" y="334" text-anchor="start" class="sm dim">ℝ</text>
  <line x1="66" y1="325" x2="66" y2="335" class="tick"/>
  <circle cx="66" cy="330" r="5" fill="#7c3aed"/>
  <text x="66" y="352" text-anchor="middle">0</text>
  <line x1="180" y1="325" x2="180" y2="335" class="tick"/>
  <circle cx="180" cy="330" r="5" fill="#7c3aed"/>
  <text x="180" y="352" text-anchor="middle">1</text>
  <line x1="294" y1="325" x2="294" y2="335" class="tick"/>
  <circle cx="294" cy="330" r="5" fill="#7c3aed"/>
  <text x="294" y="352" text-anchor="middle">2</text>
  <line x1="74" y1="188" x2="66" y2="316" class="thin dash" stroke="var(--dim)" stroke-width="1" marker-end="url(#ahvardim)"/>
  <line x1="146" y1="188" x2="180" y2="316" class="thin dash" stroke="var(--dim)" stroke-width="1" marker-end="url(#ahvardim)"/>
  <line x1="218" y1="188" x2="180" y2="316" class="thin dash" stroke="var(--dim)" stroke-width="1" marker-end="url(#ahvardim)"/>
  <line x1="290" y1="188" x2="294" y2="316" class="thin dash" stroke="var(--dim)" stroke-width="1" marker-end="url(#ahvardim)"/>
</svg>
