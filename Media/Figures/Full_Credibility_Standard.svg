  <path d="M121.48,350 v4.2 H180 q5,0 5,3.85 q0,-3.85 5,-3.85 H248.52 v-4.2" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="185" y="368" text-anchor="middle" class="sm dim">±k = ±5%</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">tighter k or higher p ⇒ larger n_F</text>
</svg>
