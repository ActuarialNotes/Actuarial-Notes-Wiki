<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 244" width="560" height="244" role="img">
  <title>Five of twelve equally likely outcomes shaded, and the resulting probability marked on a 0-to-1 scale</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="242.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Probability as a proportion of equally likely outcomes</text>
  <rect x="40" y="58" width="236" height="116" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="53" y="74" text-anchor="middle" class="sm dim">S</text>
  <circle cx="74" cy="88" r="12" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="128" cy="88" r="12" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="182" cy="88" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="236" cy="88" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="74" cy="122" r="12" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="128" cy="122" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="182" cy="122" r="12" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="236" cy="122" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="74" cy="156" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="128" cy="156" r="12" fill="#3b82f6" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="182" cy="156" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <circle cx="236" cy="156" r="12" fill="var(--surf)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.4"/>
  <text x="158" y="190" text-anchor="middle" class="sm dim">|E| = 5 shaded of |S| = 12</text>
  <text x="422" y="76" text-anchor="middle" class="sm">P(E) = |E| / |S| = 5/12 ≈ 0.42</text>
  <rect x="316" y="125" width="212" height="14" rx="7" fill="var(--soft)" stroke="var(--edge)"/>
  <rect x="316" y="125" width="88.33" height="14" rx="7" fill="#3b82f6" fill-opacity="0.55"/>
  <line x1="316" y1="141" x2="316" y2="146" class="tick"/>
  <text x="316" y="159" text-anchor="middle" class="sm dim">0</text>
  <text x="316" y="171" text-anchor="middle" class="sm dim">impossible</text>
  <line x1="422" y1="141" x2="422" y2="146" class="tick"/>
  <text x="422" y="159" text-anchor="middle" class="sm dim">0.5</text>
  <line x1="528" y1="141" x2="528" y2="146" class="tick"/>
  <text x="528" y="159" text-anchor="middle" class="sm dim">1</text>
  <text x="528" y="171" text-anchor="middle" class="sm dim">certain</text>
  <line x1="404.33" y1="106" x2="404.33" y2="121" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
  <text x="404.33" y="100" text-anchor="middle" class="sm bold" fill="#3b82f6">P(E)</text>
  <text x="422" y="200" text-anchor="middle" class="sm dim">Every probability lives in [0, 1]</text>
</svg>
