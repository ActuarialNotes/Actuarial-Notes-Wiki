<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>One 1,200 ground-up loss cut two ways: the old terms pay the first 1,000 of it, the new 250 deductible and 750 limit pay only the 750 above the deductible</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="140" y="315.83" width="80" height="54.17" rx="3" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="346.92" text-anchor="middle" class="sm">deductible</text>
    <rect x="140" y="153.33" width="80" height="162.5" rx="3" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="140" y="110" width="80" height="43.33" rx="3" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.2"/>
    <text x="180" y="135.67" text-anchor="middle" class="sm">over limit</text>
    <text x="180" y="102" text-anchor="middle" class="sm bold">1,200 loss</text>
    <path d="M134,370.0 H128 V153.3 H134" class="thin" stroke="var(--ink)" stroke-width="1.4"/>
    <text x="120" y="265.67" text-anchor="end" class="sm bold">old 1,000</text>
    <path d="M226,315.8 H232 V153.3 H226" class="thin" stroke="var(--ink)" stroke-width="1.4"/>
    <text x="240" y="238.58" text-anchor="start" class="sm bold">new 750</text>
  </g>
</svg>
