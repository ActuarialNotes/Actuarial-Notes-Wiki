<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A probability mass function drawn as stems standing on the integers 0 to 8</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="83.51" y1="350" x2="83.51" y2="324.14" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="83.51" cy="324.14" r="4.2" fill="#3b82f6"/>
    <line x1="111.38" y1="350" x2="111.38" y2="238.6" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="111.38" cy="238.6" r="4.2" fill="#3b82f6"/>
    <line x1="139.26" y1="350" x2="139.26" y2="140.06" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="139.26" cy="140.06" r="4.2" fill="#3b82f6"/>
    <line x1="167.13" y1="350" x2="167.13" y2="123.91" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="167.13" cy="123.91" r="4.2" fill="#3b82f6"/>
    <line x1="195" y1="350" x2="195" y2="197.83" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="195" cy="197.83" r="4.2" fill="#3b82f6"/>
    <line x1="222.87" y1="350" x2="222.87" y2="284.45" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="222.87" cy="284.45" r="4.2" fill="#3b82f6"/>
    <line x1="250.74" y1="350" x2="250.74" y2="332.35" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="250.74" cy="332.35" r="4.2" fill="#3b82f6"/>
    <line x1="278.62" y1="350" x2="278.62" y2="347.28" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="278.62" cy="347.28" r="4.2" fill="#3b82f6"/>
    <line x1="306.49" y1="350" x2="306.49" y2="349.82" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="306.49" cy="349.82" r="4.2" fill="#3b82f6"/>
    <line x1="64" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="350" x2="64" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="83.51" y1="350" x2="83.51" y2="354" class="tick"/>
    <text x="83.51" y="366" text-anchor="middle" class="sm dim">0</text>
    <line x1="111.38" y1="350" x2="111.38" y2="354" class="tick"/>
    <text x="111.38" y="366" text-anchor="middle" class="sm dim">1</text>
    <line x1="139.26" y1="350" x2="139.26" y2="354" class="tick"/>
    <text x="139.26" y="366" text-anchor="middle" class="sm dim">2</text>
    <line x1="167.13" y1="350" x2="167.13" y2="354" class="tick"/>
    <text x="167.13" y="366" text-anchor="middle" class="sm dim">3</text>
    <line x1="195" y1="350" x2="195" y2="354" class="tick"/>
    <text x="195" y="366" text-anchor="middle" class="sm dim">4</text>
    <line x1="222.87" y1="350" x2="222.87" y2="354" class="tick"/>
    <text x="222.87" y="366" text-anchor="middle" class="sm dim">5</text>
    <line x1="250.74" y1="350" x2="250.74" y2="354" class="tick"/>
    <text x="250.74" y="366" text-anchor="middle" class="sm dim">6</text>
    <line x1="278.62" y1="350" x2="278.62" y2="354" class="tick"/>
    <text x="278.62" y="366" text-anchor="middle" class="sm dim">7</text>
    <line x1="306.49" y1="350" x2="306.49" y2="354" class="tick"/>
    <text x="306.49" y="366" text-anchor="middle" class="sm dim">8</text>
    <text x="326" y="382" text-anchor="end" class="sm dim">k</text>
    <text x="60" y="76" text-anchor="start" class="sm dim">p(k)</text>
  </g>
</svg>
