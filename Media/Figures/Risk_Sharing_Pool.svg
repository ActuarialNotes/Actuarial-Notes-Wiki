    <rect x="293.4" y="156.96" width="8.16" height="6.8" fill="#d97706" fill-opacity="0.55"/>
    <text x="290" y="196" text-anchor="middle" class="sm bold">insurer</text>
    <line x1="108" y1="134" x2="250" y2="134" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
    <line x1="250" y1="152" x2="108" y2="152" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
    <text x="180" y="124" text-anchor="middle" class="sm">normal rate</text>
    <circle cx="180" cy="304" r="54" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.3"/>
