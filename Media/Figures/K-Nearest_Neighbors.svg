<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A query point classified by a vote of its five nearest neighbours</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Vote among the k nearest points</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">ŷ₀ = majority of the k nearest xᵢ</text>
  <line x1="50" y1="318" x2="326" y2="318" class="axis"/>
  <line x1="50" y1="100" x2="50" y2="318" class="axis"/>
  <rect x="50" y="100" width="276" height="218" rx="6" fill="var(--soft)" stroke="var(--edge)"/>
  <circle cx="188" cy="204.64" r="32.61" fill="#059669" fill-opacity="0.10" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="178.65" cy="199.46" r="3.8" fill="#e11d48"/>
  <circle cx="170.11" cy="212.74" r="3.8" fill="#e11d48"/>
  <circle cx="208.54" cy="200.2" r="3.8" fill="#3b82f6"/>
  <circle cx="167.21" cy="213.53" r="3.8" fill="#e11d48"/>
  <circle cx="156.76" cy="197.25" r="3.8" fill="#e11d48"/>
  <circle cx="238.14" cy="209.31" r="3" fill="#3b82f6"/>
  <circle cx="133.68" cy="200.52" r="3" fill="#e11d48"/>
  <circle cx="245.59" cy="211.77" r="3" fill="#3b82f6"/>
  <circle cx="238.39" cy="239.34" r="3" fill="#3b82f6"/>
  <circle cx="163.48" cy="261.32" r="3" fill="#3b82f6"/>
  <circle cx="208.68" cy="265.13" r="3" fill="#3b82f6"/>
  <circle cx="267.31" cy="206.04" r="3" fill="#3b82f6"/>
  <circle cx="214.74" cy="271.97" r="3" fill="#3b82f6"/>
  <circle cx="280.33" cy="196.67" r="3" fill="#3b82f6"/>
  <circle cx="189.39" cy="278.49" r="3" fill="#3b82f6"/>
  <circle cx="246.56" cy="263.34" r="3" fill="#3b82f6"/>
  <circle cx="214.13" cy="283.77" r="3" fill="#3b82f6"/>
  <circle cx="126.13" cy="271.56" r="3" fill="#3b82f6"/>
  <circle cx="110.48" cy="147.77" r="3" fill="#e11d48"/>
  <circle cx="274.63" cy="263.11" r="3" fill="#3b82f6"/>
  <circle cx="217.93" cy="117.67" r="3" fill="#e11d48"/>
  <circle cx="301.04" cy="174.4" r="3" fill="#3b82f6"/>
  <circle cx="290.02" cy="154" r="3" fill="#3b82f6"/>
  <circle cx="124.06" cy="122.51" r="3" fill="#e11d48"/>
  <circle cx="83.35" cy="147.28" r="3" fill="#e11d48"/>
  <circle cx="256.28" cy="117.78" r="3" fill="#e11d48"/>
  <circle cx="73.91" cy="255.86" r="3" fill="#e11d48"/>
  <circle cx="285.59" cy="131.95" r="3" fill="#e11d48"/>
  <circle cx="281.94" cy="117.36" r="3" fill="#e11d48"/>
  <circle cx="93.48" cy="298.33" r="3" fill="#3b82f6"/>
  <circle cx="188" cy="204.64" r="5" fill="var(--surf)" stroke="var(--ink)" stroke-width="1.8"/>
  <text x="188" y="193.64" text-anchor="middle" class="sm bold">x₀</text>
  <text x="180" y="342" text-anchor="middle" class="sm">k = 5 — three blue, two rose ⇒ blue</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">k = 1 interpolates: no bias, all variance</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">k large oversmooths: all bias, no variance</text>
</svg>
