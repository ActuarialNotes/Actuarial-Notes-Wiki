  <text x="72" y="216" text-anchor="middle" class="sm dim">1</text>
  <line x1="102.72" y1="200" x2="102.72" y2="204" class="tick"/>
  <text x="102.72" y="216" text-anchor="middle" class="sm dim">4</text>
  <line x1="184.64" y1="200" x2="184.64" y2="204" class="tick"/>
  <text x="184.64" y="216" text-anchor="middle" class="sm dim">12</text>
  <line x1="307.52" y1="200" x2="307.52" y2="204" class="tick"/>
  <text x="307.52" y="216" text-anchor="middle" class="sm dim">24</text>
  <line x1="68" y1="183.25" x2="72" y2="183.25" class="tick"/>
  <text x="64" y="186.85" text-anchor="end" class="sm dim">7.7%</text>
  <line x1="68" y1="116.25" x2="72" y2="116.25" class="tick"/>
  <text x="64" y="119.85" text-anchor="end" class="sm dim">7.9%</text>
  <text x="328" y="232" text-anchor="end" class="sm dim">compounding frequency m</text>
  <text x="68" y="52" text-anchor="start" class="sm dim">i⁽ᵐ⁾</text>
  <text x="428" y="94" text-anchor="middle" class="sm bold">(1 + i⁽ᵐ⁾/m)ᵐ = 1 + i</text>
  <text x="428" y="114" text-anchor="middle" class="sm dim">i⁽ᵐ⁾ = m[(1 + i)^(1/m) − 1]</text>
  <text x="340" y="144" text-anchor="start" class="sm">i⁽¹⁾</text>
  <text x="524" y="144" text-anchor="end" class="sm bold">8.0000%</text>
  <text x="340" y="168" text-anchor="start" class="sm">i⁽²⁾</text>
  <text x="524" y="168" text-anchor="end" class="sm bold">7.8461%</text>
  <text x="340" y="192" text-anchor="start" class="sm">i⁽⁴⁾</text>
  <text x="524" y="192" text-anchor="end" class="sm bold">7.7706%</text>
  <text x="340" y="216" text-anchor="start" class="sm">i⁽¹²⁾</text>
  <text x="524" y="216" text-anchor="end" class="sm bold">7.7208%</text>
  <line x1="340" y1="250" x2="524" y2="250" class="rule"/>
  <text x="432" y="268" text-anchor="middle" class="sm dim">all equivalent to i = 8% effective</text>
</svg>
