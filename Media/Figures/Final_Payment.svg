<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <title>A drop payment and a balloon payment against the regular payment</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">When the term is not a whole number, the last payment differs</text>
  <line x1="160" y1="110" x2="442" y2="110" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="168" y1="106" x2="168" y2="114" class="tick"/>
  <text x="168" y="127" text-anchor="middle" class="sm dim">0</text>
  <line x1="219.2" y1="106" x2="219.2" y2="114" class="tick"/>
  <text x="219.2" y="127" text-anchor="middle" class="sm dim">1</text>
  <line x1="270.4" y1="106" x2="270.4" y2="114" class="tick"/>
  <text x="270.4" y="127" text-anchor="middle" class="sm dim">2</text>
  <line x1="321.6" y1="106" x2="321.6" y2="114" class="tick"/>
  <text x="321.6" y="127" text-anchor="middle" class="sm dim">3</text>
  <line x1="372.8" y1="106" x2="372.8" y2="114" class="tick"/>
  <text x="372.8" y="127" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="106" x2="424" y2="114" class="tick"/>
  <text x="424" y="127" text-anchor="middle" class="sm dim">5</text>
  <text x="152" y="114" text-anchor="end" class="sm bold" fill="#059669">Drop payment</text>
  <line x1="219.2" y1="110" x2="219.2" y2="76" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="219.2" y="70" text-anchor="middle" class="sm">P</text>
  <line x1="270.4" y1="110" x2="270.4" y2="76" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="270.4" y="70" text-anchor="middle" class="sm">P</text>
  <line x1="321.6" y1="110" x2="321.6" y2="76" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="321.6" y="70" text-anchor="middle" class="sm">P</text>
  <line x1="372.8" y1="110" x2="372.8" y2="76" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="372.8" y="70" text-anchor="middle" class="sm">P</text>
  <line x1="424" y1="110" x2="424" y2="90" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="444" y="114" text-anchor="start" class="sm dim">smaller than P</text>
  <line x1="160" y1="194" x2="442" y2="194" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="168" y1="190" x2="168" y2="198" class="tick"/>
  <text x="168" y="211" text-anchor="middle" class="sm dim">0</text>
  <line x1="219.2" y1="190" x2="219.2" y2="198" class="tick"/>
  <text x="219.2" y="211" text-anchor="middle" class="sm dim">1</text>
  <line x1="270.4" y1="190" x2="270.4" y2="198" class="tick"/>
  <text x="270.4" y="211" text-anchor="middle" class="sm dim">2</text>
  <line x1="321.6" y1="190" x2="321.6" y2="198" class="tick"/>
  <text x="321.6" y="211" text-anchor="middle" class="sm dim">3</text>
  <line x1="372.8" y1="190" x2="372.8" y2="198" class="tick"/>
  <text x="372.8" y="211" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="190" x2="424" y2="198" class="tick"/>
  <text x="424" y="211" text-anchor="middle" class="sm dim">5</text>
  <text x="152" y="198" text-anchor="end" class="sm bold" fill="#e11d48">Balloon payment</text>
  <line x1="219.2" y1="194" x2="219.2" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="219.2" y="154" text-anchor="middle" class="sm">P</text>
  <line x1="270.4" y1="194" x2="270.4" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="270.4" y="154" text-anchor="middle" class="sm">P</text>
  <line x1="321.6" y1="194" x2="321.6" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="321.6" y="154" text-anchor="middle" class="sm">P</text>
  <line x1="372.8" y1="194" x2="372.8" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="372.8" y="154" text-anchor="middle" class="sm">P</text>
  <line x1="424" y1="194" x2="424" y2="132" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="444" y="198" text-anchor="start" class="sm dim">larger than P</text>
  <line x1="28" y1="232" x2="532" y2="232" class="rule"/>
  <text x="150" y="254" text-anchor="middle" class="sm bold">Drop:  B_n(1 + i),  smaller than P</text>
  <text x="150" y="274" text-anchor="middle" class="sm dim">the balance was already nearly cleared</text>
  <text x="412" y="254" text-anchor="middle" class="sm bold">Balloon:  OB₍ₙ₋₁₎(1 + i)</text>
  <text x="412" y="274" text-anchor="middle" class="sm dim">the regular payments left a stub</text>
</svg>
