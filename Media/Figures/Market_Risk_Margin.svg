<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Interest rate risk measured on the duration mismatch, not on the assets alone</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Interest rate risk is measured on the</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">mismatch</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Market = interest + equity</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">+ real estate + currency</text>
    <text x="40" y="108" text-anchor="start" class="sm bold" fill="#059669">matched</text>
    <rect x="40" y="118" width="115.6" height="20" rx="3" fill="#3b82f6" fill-opacity="0.45"/>
    <text x="163.6" y="133" text-anchor="start" class="sm dim">assets</text>
    <rect x="40" y="146" width="115.6" height="20" rx="3" fill="#d97706" fill-opacity="0.45"/>
    <text x="163.6" y="161" text-anchor="start" class="sm dim">liabilities</text>
    <text x="40" y="196" text-anchor="start" class="sm bold" fill="#e11d48">mismatched</text>
    <rect x="40" y="206" width="210.8" height="20" rx="3" fill="#3b82f6" fill-opacity="0.45"/>
    <text x="258.8" y="221" text-anchor="start" class="sm dim">assets</text>
    <rect x="40" y="234" width="115.6" height="20" rx="3" fill="#d97706" fill-opacity="0.45"/>
    <text x="163.6" y="249" text-anchor="start" class="sm dim">liabilities</text>
    <text x="180" y="282" text-anchor="middle" class="sm dim">duration, in years — only the second attracts</text>
    <text x="180" y="298" text-anchor="middle" class="sm dim">an interest rate charge</text>
    <line x1="30" y1="318" x2="330" y2="318" class="rule"/>
    <text x="180" y="340" text-anchor="middle" class="sm dim">equity carries a high factor, and it falls when</text>
    <text x="180" y="356" text-anchor="middle" class="sm dim">the insurer most needs the capital</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">so the extra yield has to pay for the extra capital</text>
  </g>
</svg>
