<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Average premium at the current rate level drifting up from 496 to 520 over the experience years, projected on to 529</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="74" y1="100" x2="74" y2="350" class="grid"/>
    <line x1="135.5" y1="100" x2="135.5" y2="350" class="grid"/>
    <line x1="197" y1="100" x2="197" y2="350" class="grid"/>
    <line x1="258.5" y1="100" x2="258.5" y2="350" class="grid"/>
    <line x1="320" y1="100" x2="320" y2="350" class="grid"/>
    <line x1="74" y1="350" x2="320" y2="350" class="grid"/>
    <line x1="74" y1="266.67" x2="320" y2="266.67" class="grid"/>
    <line x1="74" y1="183.33" x2="320" y2="183.33" class="grid"/>
    <line x1="74" y1="100" x2="320" y2="100" class="grid"/>
    <line x1="74" y1="350" x2="330" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="350" x2="74" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="350" x2="74" y2="354" class="tick"/>
    <line x1="135.5" y1="350" x2="135.5" y2="354" class="tick"/>
    <line x1="197" y1="350" x2="197" y2="354" class="tick"/>
    <line x1="258.5" y1="350" x2="258.5" y2="354" class="tick"/>
    <line x1="320" y1="350" x2="320" y2="354" class="tick"/>
    <line x1="70" y1="350" x2="74" y2="350" class="tick"/>
    <text x="66" y="353.6" text-anchor="end" class="sm dim">480</text>
    <line x1="70" y1="266.67" x2="74" y2="266.67" class="tick"/>
    <text x="66" y="270.27" text-anchor="end" class="sm dim">500</text>
    <line x1="70" y1="183.33" x2="74" y2="183.33" class="tick"/>
    <text x="66" y="186.93" text-anchor="end" class="sm dim">520</text>
    <line x1="70" y1="100" x2="74" y2="100" class="tick"/>
    <text x="66" y="103.6" text-anchor="end" class="sm dim">540</text>
    <text x="320" y="382" text-anchor="end" class="sm dim">years</text>
    <text x="70" y="86" text-anchor="start" class="sm dim">average premium</text>
    <polyline points="74,283.33 135.5,245.83 197,216.67 258.5,183.33" class="curve" stroke="#3b82f6" stroke-width="2.2"/>
    <circle cx="74" cy="283.33" r="3.2" fill="#3b82f6"/>
    <circle cx="135.5" cy="245.83" r="3.2" fill="#3b82f6"/>
    <circle cx="197" cy="216.67" r="3.2" fill="#3b82f6"/>
    <circle cx="258.5" cy="183.33" r="3.2" fill="#3b82f6"/>
    <polyline points="258.5,183.33 320,145.83" class="curve dash" stroke="#059669" stroke-width="2.2"/>
    <circle cx="320" cy="145.83" r="4.2" fill="#059669"/>
    <text x="314" y="136.83" text-anchor="end" class="sm bold">forecast</text>
  </g>
</svg>
