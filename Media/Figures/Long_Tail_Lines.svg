<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A long-tail reporting pattern taking years to reach ultimate</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Most of the cost is still an estimate</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">for years</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Reported % = 1 / CDF(n → ult)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">52.6% reported at 12 months</text>
  <line x1="101" y1="98" x2="101" y2="326" class="grid"/>
  <line x1="163" y1="98" x2="163" y2="326" class="grid"/>
  <line x1="225" y1="98" x2="225" y2="326" class="grid"/>
  <line x1="287" y1="98" x2="287" y2="326" class="grid"/>
  <line x1="70" y1="326" x2="318" y2="326" class="grid"/>
  <line x1="70" y1="220.44" x2="318" y2="220.44" class="grid"/>
  <line x1="70" y1="114.89" x2="318" y2="114.89" class="grid"/>
  <line x1="70" y1="326" x2="328" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="70" y1="326" x2="70" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="101" y1="326" x2="101" y2="330" class="tick"/>
  <text x="101" y="342" text-anchor="middle" class="sm dim">12</text>
  <line x1="163" y1="326" x2="163" y2="330" class="tick"/>
  <text x="163" y="342" text-anchor="middle" class="sm dim">36</text>
  <line x1="225" y1="326" x2="225" y2="330" class="tick"/>
  <text x="225" y="342" text-anchor="middle" class="sm dim">60</text>
  <line x1="287" y1="326" x2="287" y2="330" class="tick"/>
  <text x="287" y="342" text-anchor="middle" class="sm dim">84</text>
  <line x1="66" y1="326" x2="70" y2="326" class="tick"/>
  <text x="62" y="329.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="66" y1="220.44" x2="70" y2="220.44" class="tick"/>
  <text x="62" y="224.04" text-anchor="end" class="sm dim">50%</text>
  <line x1="66" y1="114.89" x2="70" y2="114.89" class="tick"/>
  <text x="62" y="118.49" text-anchor="end" class="sm dim">100%</text>
  <polyline points="101,127.56 132,117 163,114.89 194,114.89 225,114.89 256,114.89 287,114.89 318,114.89" class="curve dash" stroke="var(--dim)" stroke-width="1.6"/>
  <polyline points="101,214.96 132,159.43 163,132.62 194,121.01 225,117 256,115.31 287,114.89 318,114.89" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="101" cy="214.96" r="3" fill="#3b82f6"/>
  <circle cx="132" cy="159.43" r="3" fill="#3b82f6"/>
  <circle cx="163" cy="132.62" r="3" fill="#3b82f6"/>
  <circle cx="194" cy="121.01" r="3" fill="#3b82f6"/>
  <circle cx="225" cy="117" r="3" fill="#3b82f6"/>
  <circle cx="256" cy="115.31" r="3" fill="#3b82f6"/>
  <circle cx="287" cy="114.89" r="3" fill="#3b82f6"/>
  <circle cx="318" cy="114.89" r="3" fill="#3b82f6"/>
  <text x="225" y="262.67" text-anchor="middle" class="sm bold" fill="#3b82f6">long tail</text>
  <text x="225" y="277.67" text-anchor="middle" class="sm dim">auto BI, WC, med mal</text>
  <text x="177.33" y="107.89" text-anchor="start" class="sm dim">short tail</text>
  <circle cx="101" cy="214.96" r="4.2" fill="#e11d48"/>
  <text x="180" y="358" text-anchor="middle" class="sm dim">age in months</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the reserve, not the payment, is the whole exposure</text>
</svg>
