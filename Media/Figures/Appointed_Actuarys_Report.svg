<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>What the report has to record, and the actual-versus-expected section that tests last year's estimate</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Detailed enough for another actuary to</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">redo it</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Data · methods · assumptions · results</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">· sensitivity · subsequent events</text>
  <text x="36" y="106" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="52" y="106" text-anchor="start" class="sm">data, reconciled — and its deficiencies</text>
  <text x="36" y="132" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="52" y="132" text-anchor="start" class="sm">methods by line and by LIC / LRC component</text>
  <text x="36" y="158" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="52" y="158" text-anchor="start" class="sm">assumptions, and why each was selected</text>
  <text x="36" y="184" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="52" y="184" text-anchor="start" class="sm">results against the prior valuation</text>
  <text x="36" y="210" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="52" y="210" text-anchor="start" class="sm">sensitivity, and the range of reasonable estimates</text>
  <text x="36" y="236" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="52" y="236" text-anchor="start" class="sm">subsequent events, materiality, reliance</text>
  <line x1="30" y1="274" x2="330" y2="274" class="rule"/>
  <text x="180" y="296" text-anchor="middle" class="sm bold">and the section that earns its place</text>
  <text x="180" y="312" text-anchor="middle" class="sm dim">actual versus expected</text>
  <rect x="76.18" y="357.14" width="33.64" height="6.86" rx="3" fill="#e11d48" fill-opacity="0.75"/>
  <text x="93" y="350.14" text-anchor="middle" class="sm">+2%</text>
  <text x="93" y="379" text-anchor="middle" class="sm dim">2022</text>
  <rect x="134.18" y="340" width="33.64" height="24" rx="3" fill="#e11d48" fill-opacity="0.75"/>
  <text x="151" y="333" text-anchor="middle" class="sm">+7%</text>
  <text x="151" y="379" text-anchor="middle" class="sm dim">2023</text>
  <rect x="192.18" y="333.14" width="33.64" height="30.86" rx="3" fill="#e11d48" fill-opacity="0.75"/>
  <text x="209" y="326.14" text-anchor="middle" class="sm">+9%</text>
  <text x="209" y="379" text-anchor="middle" class="sm dim">2024</text>
  <rect x="250.18" y="322.86" width="33.64" height="41.14" rx="3" fill="#e11d48" fill-opacity="0.75"/>
  <text x="267" y="315.86" text-anchor="middle" class="sm">+12%</text>
  <text x="267" y="379" text-anchor="middle" class="sm dim">2025</text>
  <line x1="58" y1="364" x2="302" y2="364" class="axis"/>
  <text x="180" y="390" text-anchor="middle" class="sm dim">four years of adverse development is a method problem</text>
</svg>
