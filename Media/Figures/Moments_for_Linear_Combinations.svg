<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two stacked bars on one baseline: the variance of a sum of independent variables, the two variances alone, and of correlated ones, the same two plus a covariance block on top</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="50" y1="346" x2="310" y2="346" class="axis"/>
    <rect x="78" y="240" width="76" height="106" rx="3" fill="#3b82f6" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="78" y="165.8" width="76" height="74.2" rx="3" fill="#7c3aed" fill-opacity="0.6" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="116" y="364" text-anchor="middle" class="sm dim">independent</text>
    <rect x="206" y="240" width="76" height="106" rx="3" fill="#3b82f6" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="244" y="297" text-anchor="middle" class="sm bold">Var X₁</text>
    <rect x="206" y="165.8" width="76" height="74.2" rx="3" fill="#7c3aed" fill-opacity="0.6" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="244" y="206.9" text-anchor="middle" class="sm bold">Var X₂</text>
    <rect x="206" y="91.6" width="76" height="74.2" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1.2"/>
    <text x="244" y="132.7" text-anchor="middle" class="sm bold">2 Cov</text>
    <text x="244" y="364" text-anchor="middle" class="sm dim">correlated</text>
    <line x1="154" y1="165.8" x2="206" y2="165.8" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  </g>
</svg>
