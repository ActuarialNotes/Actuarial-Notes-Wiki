<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The projected loss and LAE ratio measured against the permissible loss ratio</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The share of premium the claims consume</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Loss Ratio = (Loss + LAE) / Premium</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">= Pure Premium / Average Premium</text>
  <rect x="46" y="150" width="268" height="40" rx="5" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="46" y="150" width="185.46" height="40" rx="5" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="138.73" y="175" text-anchor="middle" class="sm">69.2% losses</text>
  <text x="272.73" y="175" text-anchor="middle" class="sm dim">30.8%</text>
  <text x="180" y="136" text-anchor="middle" class="sm dim">$520 of earned premium</text>
  <text x="272.73" y="208" text-anchor="middle" class="sm dim">expenses</text>
  <text x="272.73" y="223" text-anchor="middle" class="sm dim">+ profit</text>
  <line x1="230.92" y1="126" x2="230.92" y2="194" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
  <text x="230.92" y="118" text-anchor="middle" class="sm bold" fill="#e11d48">PLR 69.0%</text>
  <text x="180" y="274" text-anchor="middle" class="sm dim">360 / 520 = 69.2%, against 69.0% available</text>
  <text x="180" y="312" text-anchor="middle" class="sm">above the PLR ⇒ the rate is inadequate</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">below it ⇒ there is room to give back</text>
</svg>
