<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Two policies without a claim then one with, above the geometric mass function of the trial the first claim lands on</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Trials until the first success</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(X = k) = (1 − p)ᵏ⁻¹ p,  k ≥ 1</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[X] = 1/p,   P(X &gt; n) = (1 − p)ⁿ</text>
  <text x="180" y="92" text-anchor="middle" class="sm dim">each policy claims with probability 0.2</text>
  <rect x="136" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="167" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="198" y="102" width="26" height="26" rx="5" fill="#3b82f6" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="194" y="98" width="34" height="34" rx="8" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <text x="180" y="154" text-anchor="middle" class="sm bold" fill="#3b82f6">the first claim is the 3rd policy → k = 3</text>
  <line x1="77.9" y1="330" x2="77.9" y2="227.78" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="77.9" cy="227.78" r="3.2" fill="#3b82f6"/>
  <line x1="103.48" y1="330" x2="103.48" y2="248.22" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="103.48" cy="248.22" r="3.2" fill="#3b82f6"/>
  <line x1="154.63" y1="330" x2="154.63" y2="277.66" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="154.63" cy="277.66" r="3.2" fill="#3b82f6"/>
  <line x1="180.21" y1="330" x2="180.21" y2="288.13" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="180.21" cy="288.13" r="3.2" fill="#3b82f6"/>
  <line x1="205.79" y1="330" x2="205.79" y2="296.5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="205.79" cy="296.5" r="3.2" fill="#3b82f6"/>
  <line x1="231.37" y1="330" x2="231.37" y2="303.2" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="231.37" cy="303.2" r="3.2" fill="#3b82f6"/>
  <line x1="256.94" y1="330" x2="256.94" y2="308.56" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="256.94" cy="308.56" r="3.2" fill="#3b82f6"/>
  <line x1="282.52" y1="330" x2="282.52" y2="312.85" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="282.52" cy="312.85" r="3.2" fill="#3b82f6"/>
  <line x1="308.1" y1="330" x2="308.1" y2="316.28" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="308.1" cy="316.28" r="3.2" fill="#3b82f6"/>
  <line x1="129.06" y1="330" x2="129.06" y2="264.58" stroke="#d97706" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="129.06" cy="264.58" r="3.8" fill="#d97706"/>
  <line x1="60" y1="330" x2="336" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="330" x2="60" y2="182" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="77.9" y1="330" x2="77.9" y2="334" class="tick"/>
  <text x="77.9" y="346" text-anchor="middle" class="sm dim">1</text>
  <line x1="103.48" y1="330" x2="103.48" y2="334" class="tick"/>
  <text x="103.48" y="346" text-anchor="middle" class="sm dim">2</text>
  <line x1="129.06" y1="330" x2="129.06" y2="334" class="tick"/>
  <text x="129.06" y="346" text-anchor="middle" class="sm dim">3</text>
  <line x1="154.63" y1="330" x2="154.63" y2="334" class="tick"/>
  <text x="154.63" y="346" text-anchor="middle" class="sm dim">4</text>
  <line x1="180.21" y1="330" x2="180.21" y2="334" class="tick"/>
  <text x="180.21" y="346" text-anchor="middle" class="sm dim">5</text>
  <line x1="205.79" y1="330" x2="205.79" y2="334" class="tick"/>
  <text x="205.79" y="346" text-anchor="middle" class="sm dim">6</text>
  <line x1="231.37" y1="330" x2="231.37" y2="334" class="tick"/>
  <text x="231.37" y="346" text-anchor="middle" class="sm dim">7</text>
  <line x1="256.94" y1="330" x2="256.94" y2="334" class="tick"/>
  <text x="256.94" y="346" text-anchor="middle" class="sm dim">8</text>
  <line x1="282.52" y1="330" x2="282.52" y2="334" class="tick"/>
  <text x="282.52" y="346" text-anchor="middle" class="sm dim">9</text>
  <line x1="308.1" y1="330" x2="308.1" y2="334" class="tick"/>
  <text x="308.1" y="346" text-anchor="middle" class="sm dim">10</text>
  <text x="326" y="362" text-anchor="end" class="sm dim">k</text>
  <text x="56" y="178" text-anchor="start" class="sm dim">P(X = k)</text>
  <text x="129.06" y="253.58" text-anchor="middle" class="sm bold" fill="#d97706">0.128</text>
</svg>
