<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five territory lines starting at different heights and fanning at different slopes around a dashed mean line, the intercept spread bracketed b₀ᵢ and one line's extra slope marked b₁ᵢ</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="129.27" y1="86" x2="129.27" y2="352" class="grid"/>
    <line x1="186.55" y1="86" x2="186.55" y2="352" class="grid"/>
    <line x1="243.82" y1="86" x2="243.82" y2="352" class="grid"/>
    <line x1="301.09" y1="86" x2="301.09" y2="352" class="grid"/>
    <line x1="72" y1="352" x2="324" y2="352" class="axis"/>
    <line x1="72" y1="86" x2="72" y2="352" class="axis"/>
    <line x1="129.27" y1="352" x2="129.27" y2="356" class="tick"/>
    <text x="129.27" y="368" text-anchor="middle" class="sm dim">1</text>
    <line x1="186.55" y1="352" x2="186.55" y2="356" class="tick"/>
    <text x="186.55" y="368" text-anchor="middle" class="sm dim">2</text>
    <line x1="243.82" y1="352" x2="243.82" y2="356" class="tick"/>
    <text x="243.82" y="368" text-anchor="middle" class="sm dim">3</text>
    <line x1="301.09" y1="352" x2="301.09" y2="356" class="tick"/>
    <text x="301.09" y="368" text-anchor="middle" class="sm dim">4</text>
    <polyline points="72,310.89 318.27,186.11" class="curve" stroke="#3b82f6" stroke-width="1.8"/>
    <circle cx="72" cy="310.89" r="3" fill="#3b82f6"/>
    <polyline points="72,274.62 318.27,241.34" class="curve" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="72" cy="274.62" r="3" fill="#d97706"/>
    <polyline points="72,243.18 318.27,164.16" class="curve" stroke="#059669" stroke-width="1.8"/>
    <circle cx="72" cy="243.18" r="3" fill="#059669"/>
    <polyline points="72,214.16 318.27,205.85" class="curve" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="72" cy="214.16" r="3" fill="#7c3aed"/>
    <polyline points="72,175.47 318.27,108.92" class="curve" stroke="#e11d48" stroke-width="1.8"/>
    <circle cx="72" cy="175.47" r="3" fill="#e11d48"/>
    <polyline points="72,248.02 318.27,185.63" class="curve dash" stroke="var(--ink)" stroke-width="2.2"/>
    <path d="M66.0,175.5 H62.0 V310.9 H66.0" class="thin" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="57" y="247.18" text-anchor="end" class="bold">b₀ᵢ</text>
    <polyline points="72,310.89 220.91,273.17" class="curve dash" stroke="var(--dim)" stroke-width="1.3"/>
    <path d="M186.4,281.9 A118,118 0 0 0 177.3,257.6" class="thin" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="197.48" y="267.87" text-anchor="middle" class="bold">b₁ᵢ</text>
  </g>
</svg>
