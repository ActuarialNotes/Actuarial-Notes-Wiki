<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Revenue climbing in two steps: new relativities alone add 3.0%, so the base rate needs only +4.2% to reach the +7.3% overall target</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="114" y1="96" x2="114" y2="350" class="grid"/>
    <line x1="198" y1="96" x2="198" y2="350" class="grid"/>
    <line x1="282" y1="96" x2="282" y2="350" class="grid"/>
    <line x1="72" y1="323.26" x2="324" y2="323.26" class="grid"/>
    <line x1="72" y1="243.05" x2="324" y2="243.05" class="grid"/>
    <line x1="72" y1="128.03" x2="324" y2="128.03" class="grid"/>
    <line x1="72" y1="350" x2="324" y2="350" class="axis"/>
    <line x1="72" y1="96" x2="72" y2="350" class="axis"/>
    <line x1="114" y1="350" x2="114" y2="354" class="tick"/>
    <text x="114" y="366" text-anchor="middle" class="sm dim">current</text>
    <line x1="198" y1="350" x2="198" y2="354" class="tick"/>
    <text x="198" y="366" text-anchor="middle" class="sm dim">relativities</text>
    <line x1="282" y1="350" x2="282" y2="354" class="tick"/>
    <text x="282" y="366" text-anchor="middle" class="sm dim">base rate</text>
    <line x1="68" y1="323.26" x2="72" y2="323.26" class="tick"/>
    <text x="64" y="326.86" text-anchor="end" class="sm dim">1.000</text>
    <line x1="68" y1="243.05" x2="72" y2="243.05" class="tick"/>
    <text x="64" y="246.65" text-anchor="end" class="sm dim">1.030</text>
    <line x1="68" y1="128.03" x2="72" y2="128.03" class="tick"/>
    <text x="64" y="131.63" text-anchor="end" class="sm dim">1.073</text>
    <text x="68" y="82" text-anchor="start" class="sm dim">revenue</text>
    <line x1="72" y1="128.03" x2="324" y2="128.03" class="thin dash" stroke="#059669" stroke-width="1.3"/>
    <text x="114" y="121.03" text-anchor="middle" class="sm bold">+7.3%</text>
    <polyline points="72,323.26 156,323.26" class="curve" stroke="#3b82f6" stroke-width="2.6"/>
    <polyline points="156,243.05 240,243.05" class="curve" stroke="#3b82f6" stroke-width="2.6"/>
    <polyline points="240,128.03 324,128.03" class="curve" stroke="#3b82f6" stroke-width="2.6"/>
    <line x1="156" y1="323.26" x2="156" y2="245.05" class="thin" stroke="#d97706" stroke-width="2" marker-end="url(#ahd97706)"/>
    <text x="148" y="287.16" text-anchor="end" class="sm bold">+3.0%</text>
    <line x1="240" y1="243.05" x2="240" y2="130.03" class="thin" stroke="#059669" stroke-width="2" marker-end="url(#ah059669)"/>
    <text x="232" y="189.54" text-anchor="end" class="sm bold">+4.2%</text>
  </g>
</svg>
