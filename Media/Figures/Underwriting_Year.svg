<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A treaty bound at the start of 2024 and the policies that attach to it through the year, so underwriting year 2024 runs for 24 months</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="138" y="96" width="90" height="244" rx="3" fill="#d97706" fill-opacity="0.13"/>
    <line x1="48" y1="96" x2="48" y2="340" class="grid"/>
    <line x1="138" y1="96" x2="138" y2="340" class="grid"/>
    <line x1="228" y1="96" x2="228" y2="340" class="grid"/>
    <line x1="318" y1="96" x2="318" y2="340" class="grid"/>
    <line x1="40" y1="340" x2="334" y2="340" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <text x="93" y="356" text-anchor="middle" class="sm dim">2023</text>
    <text x="183" y="356" text-anchor="middle" class="sm dim">2024</text>
    <text x="273" y="356" text-anchor="middle" class="sm dim">2025</text>
    <rect x="138" y="117" width="90" height="18" rx="3" fill="#7c3aed" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="93" y="130" text-anchor="middle" class="sm bold">treaty</text>
    <rect x="138" y="160.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="154.2" y="182.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="170.4" y="204.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="186.6" y="226.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="202.8" y="248.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="219" y="270.5" width="90" height="11" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <text x="93" y="226" text-anchor="middle" class="sm">policies</text>
    <path d="M138,296 v4.8 H218.5 q5,0 5,4.4 q0,-4.4 5,-4.4 H309 v-4.8" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="223.5" y="315" text-anchor="middle" class="sm bold">24 months</text>
  </g>
</svg>
