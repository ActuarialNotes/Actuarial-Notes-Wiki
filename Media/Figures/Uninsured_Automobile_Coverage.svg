<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The two triggers — an uninsured driver and an unidentified one — and who ends up paying</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Insured drivers absorb the cost of</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">uninsured ones</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Two triggers: uninsured · unidentified</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">and the insured still proves liability</text>
  <rect x="30" y="100" width="143" height="134" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="30" y="100" width="143" height="28" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="118" text-anchor="middle" class="sm bold" fill="#d97706">Uninsured</text>
  <text x="101.5" y="148" text-anchor="middle" class="sm">a real driver</text>
  <text x="101.5" y="172" text-anchor="middle" class="sm">with no policy</text>
  <text x="101.5" y="196" text-anchor="middle" class="sm">subrogation lies</text>
  <text x="101.5" y="220" text-anchor="middle" class="sm">— rarely collects</text>
  <rect x="187" y="100" width="143" height="134" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="187" y="100" width="143" height="28" rx="7" fill="#7c3aed" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="118" text-anchor="middle" class="sm bold" fill="#7c3aed">Unidentified</text>
  <text x="258.5" y="148" text-anchor="middle" class="sm">hit-and-run</text>
  <text x="258.5" y="172" text-anchor="middle" class="sm">no defendant</text>
  <text x="258.5" y="196" text-anchor="middle" class="sm">physical evidence</text>
  <text x="258.5" y="220" text-anchor="middle" class="sm">requirements</text>
  <text x="180" y="248" text-anchor="middle" class="sm dim">the insured must still show the other</text>
  <text x="180" y="264" text-anchor="middle" class="sm dim">driver was legally liable — so tort law</text>
  <text x="180" y="280" text-anchor="middle" class="sm dim">comes back inside a no-fault policy</text>
  <line x1="30" y1="300" x2="330" y2="300" class="rule"/>
  <text x="180" y="322" text-anchor="middle" class="sm bold">cost follows the province's uninsured rate</text>
  <text x="180" y="350" text-anchor="middle" class="sm dim">underinsured motorist coverage is the adjacent —</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">and usually optional — protection: insured,</text>
  <text x="180" y="382" text-anchor="middle" class="sm dim">but for less than the loss</text>
</svg>
