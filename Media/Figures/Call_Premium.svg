<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <title>The call premium shrinking to zero as maturity approaches</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The call premium narrows as the bond nears maturity</text>
  <polyline points="76,89.47 117.67,103.79 159.33,118.11 201,132.42 242.67,146.74 284.33,161.05 326,175.37" class="curve" stroke="#d97706" stroke-width="2"/>
  <circle cx="76" cy="89.47" r="3" fill="#d97706"/>
  <circle cx="117.67" cy="103.79" r="3" fill="#d97706"/>
  <circle cx="159.33" cy="118.11" r="3" fill="#d97706"/>
  <circle cx="201" cy="132.42" r="3" fill="#d97706"/>
  <circle cx="242.67" cy="146.74" r="3" fill="#d97706"/>
  <circle cx="284.33" cy="161.05" r="3" fill="#d97706"/>
  <circle cx="326" cy="175.37" r="3" fill="#d97706"/>
  <line x1="76" y1="175.37" x2="326" y2="175.37" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="301" y="166.78" text-anchor="middle" class="sm dim">face value</text>
  <line x1="76" y1="89.47" x2="76" y2="175.37" class="thin" stroke="#e11d48" stroke-width="2"/>
  <line x1="201" y1="132.42" x2="201" y2="175.37" class="thin" stroke="#e11d48" stroke-width="2"/>
  <text x="96.83" y="132.42" text-anchor="start" class="sm bold">call premium</text>
  <line x1="76" y1="204" x2="336" y2="204" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="204" x2="76" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="204" x2="76" y2="208" class="tick"/>
  <text x="76" y="220" text-anchor="middle" class="sm dim">4</text>
  <line x1="159.33" y1="204" x2="159.33" y2="208" class="tick"/>
  <text x="159.33" y="220" text-anchor="middle" class="sm dim">6</text>
  <line x1="242.67" y1="204" x2="242.67" y2="208" class="tick"/>
  <text x="242.67" y="220" text-anchor="middle" class="sm dim">8</text>
  <line x1="326" y1="204" x2="326" y2="208" class="tick"/>
  <text x="326" y="220" text-anchor="middle" class="sm dim">10</text>
  <line x1="72" y1="175.37" x2="76" y2="175.37" class="tick"/>
  <text x="68" y="178.97" text-anchor="end" class="sm dim">1,000</text>
  <line x1="72" y1="103.79" x2="76" y2="103.79" class="tick"/>
  <text x="68" y="107.39" text-anchor="end" class="sm dim">1,050</text>
  <text x="326" y="236" text-anchor="end" class="sm dim">call date (period)</text>
  <text x="72" y="54" text-anchor="start" class="sm dim">call price</text>
  <text x="428" y="100" text-anchor="middle" class="sm bold">Call premium = call price − F</text>
  <line x1="340" y1="126" x2="340" y2="160" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="139" text-anchor="start" class="sm bold">Compensation</text>
  <text x="350" y="155" text-anchor="start" class="sm dim">for the coupons the investor loses</text>
  <line x1="340" y1="174" x2="340" y2="208" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="187" text-anchor="start" class="sm bold">Declines with time</text>
  <text x="350" y="203" text-anchor="start" class="sm dim">reaching zero at maturity</text>
  <line x1="340" y1="222" x2="340" y2="256" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="235" text-anchor="start" class="sm bold">A cost to the issuer</text>
  <text x="350" y="251" text-anchor="start" class="sm dim">the price of holding the option</text>
  <text x="280" y="282" text-anchor="middle" class="sm dim">A call schedule is a table of call dates and their call prices</text>
</svg>
