<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Six lines of insurance placed by claim frequency and claim severity, with the tail lengthening toward low frequency and high severity</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="56" y1="352" x2="330" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="352" x2="56" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <text x="320" y="384" text-anchor="end" class="sm dim">frequency</text>
    <text x="52" y="78" text-anchor="start" class="sm dim">severity</text>
    <circle cx="277.76" cy="315.6" r="4.6" fill="#059669"/>
    <text x="277.76" y="305.6" text-anchor="middle" class="sm bold" fill="#059669">Auto PD</text>
    <circle cx="230.24" cy="268.8" r="4.6" fill="#059669"/>
    <text x="230.24" y="258.8" text-anchor="middle" class="sm bold" fill="#059669">Homeowners</text>
    <circle cx="172.16" cy="206.4" r="4.6" fill="#3b82f6"/>
    <text x="172.16" y="196.4" text-anchor="middle" class="sm bold" fill="#3b82f6">CGL</text>
    <circle cx="124.64" cy="175.2" r="4.6" fill="#3b82f6"/>
    <text x="124.64" y="165.2" text-anchor="middle" class="sm bold" fill="#3b82f6">Auto BI</text>
    <circle cx="140.48" cy="123.2" r="4.6" fill="#e11d48"/>
    <text x="140.48" y="113.2" text-anchor="middle" class="sm bold" fill="#e11d48">Workers comp</text>
    <circle cx="79.76" cy="107.6" r="4.6" fill="#e11d48"/>
    <text x="79.76" y="97.6" text-anchor="middle" class="sm bold" fill="#e11d48">Med mal</text>
    <line x1="298.88" y1="222" x2="230.24" y2="133.6" class="thin" stroke="var(--dim)" stroke-width="1.6" marker-end="url(#ahvardim)"/>
    <text x="269.84" y="162.2" text-anchor="start" class="sm dim">longer tail</text>
  </g>
</svg>
