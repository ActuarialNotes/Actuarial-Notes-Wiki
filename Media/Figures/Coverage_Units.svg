<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The same CSM released on two different drivers, and the profit pattern each produces</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The driver chooses when the profit</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">appears</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Released = CSM × units this period</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">÷ total units remaining</text>
  <text x="180" y="102" text-anchor="middle" class="sm dim">$11M of CSM, released three ways ($M)</text>
  <text x="40" y="126" text-anchor="start" class="sm bold" fill="#3b82f6">policy count</text>
  <rect x="56" y="151.3" width="62" height="36.7" rx="3" fill="#3b82f6" fill-opacity="0.70"/>
  <text x="87" y="147.3" text-anchor="middle" class="sm">3.7</text>
  <text x="87" y="204" text-anchor="middle" class="sm dim">yr 1</text>
  <rect x="144" y="151.3" width="62" height="36.7" rx="3" fill="#3b82f6" fill-opacity="0.70"/>
  <text x="175" y="147.3" text-anchor="middle" class="sm">3.7</text>
  <text x="175" y="204" text-anchor="middle" class="sm dim">yr 2</text>
  <rect x="232" y="151.4" width="62" height="36.6" rx="3" fill="#3b82f6" fill-opacity="0.70"/>
  <text x="263" y="147.4" text-anchor="middle" class="sm">3.7</text>
  <text x="263" y="204" text-anchor="middle" class="sm dim">yr 3</text>
  <line x1="50" y1="188" x2="300" y2="188" class="axis"/>
  <text x="40" y="226" text-anchor="start" class="sm bold" fill="#d97706">sum insured</text>
  <rect x="56" y="244" width="62" height="44" rx="3" fill="#d97706" fill-opacity="0.70"/>
  <text x="87" y="240" text-anchor="middle" class="sm">4.4</text>
  <text x="87" y="304" text-anchor="middle" class="sm dim">yr 1</text>
  <rect x="144" y="249.5" width="62" height="38.5" rx="3" fill="#d97706" fill-opacity="0.70"/>
  <text x="175" y="245.5" text-anchor="middle" class="sm">3.9</text>
  <text x="175" y="304" text-anchor="middle" class="sm dim">yr 2</text>
  <rect x="232" y="260.5" width="62" height="27.5" rx="3" fill="#d97706" fill-opacity="0.70"/>
  <text x="263" y="256.5" text-anchor="middle" class="sm">2.8</text>
  <text x="263" y="304" text-anchor="middle" class="sm dim">yr 3</text>
  <line x1="50" y1="288" x2="300" y2="288" class="axis"/>
  <text x="180" y="330" text-anchor="middle" class="sm dim">same total, different years — which is why the</text>
  <text x="180" y="346" text-anchor="middle" class="sm dim">driver has to be disclosed</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">units count expected coverage, so expected lapses are</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">in them — and none of it applies under the PAA</text>
</svg>
