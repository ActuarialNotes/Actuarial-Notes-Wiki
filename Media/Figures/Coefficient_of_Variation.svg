  <text x="199" y="212" text-anchor="middle" class="sm dim">both have σ = 0.9 — only the mean differs</text>
  <text x="432" y="84" text-anchor="middle" class="sm bold">CV = σ / μ</text>
  <text x="432" y="104" text-anchor="middle" class="sm dim">= √Var(X) / E[X]</text>
  <line x1="336" y1="126" x2="336" y2="158" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="346" y="138" text-anchor="start" class="sm bold">Dimensionless</text>
  <text x="346" y="154" text-anchor="start" class="sm dim">compares across units and scales</text>
  <line x1="336" y1="172" x2="336" y2="204" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="346" y="184" text-anchor="start" class="sm bold">Larger CV</text>
  <text x="346" y="200" text-anchor="start" class="sm dim">more risk per dollar of expected loss</text>
  <line x1="336" y1="218" x2="336" y2="250" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="346" y="230" text-anchor="start" class="sm bold">Needs E[X] &gt; 0</text>
  <text x="346" y="246" text-anchor="start" class="sm dim">meaningless around a zero mean</text>
