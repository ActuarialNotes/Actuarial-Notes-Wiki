<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>One insurer answering to a federal solvency regulator and to every province it writes in</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">No one regulator sees the whole insurer</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Regulation = Solvency + Market conduct</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">federal / provincial — the same company</text>
  <rect x="110" y="86" width="140" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="104" text-anchor="middle" class="sm">one insurer</text>
  <line x1="150" y1="116" x2="116" y2="142" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="210" y1="116" x2="244" y2="142" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="30" y="150" width="143" height="134" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="30" y="150" width="143" height="28" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="168" text-anchor="middle" class="sm bold" fill="#3b82f6">OSFI</text>
  <text x="101.5" y="198" text-anchor="middle" class="sm">capital</text>
  <text x="101.5" y="222" text-anchor="middle" class="sm">valuation</text>
  <text x="101.5" y="246" text-anchor="middle" class="sm">reserves</text>
  <text x="101.5" y="270" text-anchor="middle" class="sm">intervention</text>
  <rect x="187" y="150" width="143" height="134" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="187" y="150" width="143" height="28" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="168" text-anchor="middle" class="sm bold" fill="#d97706">The provinces</text>
  <text x="258.5" y="198" text-anchor="middle" class="sm">licensing</text>
  <text x="258.5" y="222" text-anchor="middle" class="sm">rates</text>
  <text x="258.5" y="246" text-anchor="middle" class="sm">policy forms</text>
  <text x="258.5" y="270" text-anchor="middle" class="sm">claims conduct</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">solvency is federal, the contract is provincial —</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">and both apply to every policy sold</text>
</svg>
