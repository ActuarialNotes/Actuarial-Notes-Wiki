<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Level payments, two standard factors</text>
  <line x1="100" y1="128" x2="442" y2="128" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="108" y1="124" x2="108" y2="132" class="tick"/>
  <text x="108" y="145" text-anchor="middle" class="sm dim">0</text>
  <line x1="171.2" y1="124" x2="171.2" y2="132" class="tick"/>
  <text x="171.2" y="145" text-anchor="middle" class="sm dim">1</text>
  <line x1="234.4" y1="124" x2="234.4" y2="132" class="tick"/>
  <text x="234.4" y="145" text-anchor="middle" class="sm dim">2</text>
  <line x1="297.6" y1="124" x2="297.6" y2="132" class="tick"/>
  <text x="297.6" y="145" text-anchor="middle" class="sm dim">3</text>
  <line x1="360.8" y1="124" x2="360.8" y2="132" class="tick"/>
  <text x="360.8" y="145" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="124" x2="424" y2="132" class="tick"/>
  <text x="424" y="145" text-anchor="middle" class="sm dim">5</text>
  <line x1="171.2" y1="128" x2="171.2" y2="94" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="171.2" y="88" text-anchor="middle" class="sm">P</text>
  <line x1="234.4" y1="128" x2="234.4" y2="94" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="234.4" y="88" text-anchor="middle" class="sm">P</text>
  <line x1="297.6" y1="128" x2="297.6" y2="94" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="297.6" y="88" text-anchor="middle" class="sm">P</text>
  <line x1="360.8" y1="128" x2="360.8" y2="94" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="360.8" y="88" text-anchor="middle" class="sm">P</text>
  <line x1="424" y1="128" x2="424" y2="94" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="424" y="88" text-anchor="middle" class="sm">P</text>
  <line x1="108" y1="50" x2="108" y2="122" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="108" y="42" text-anchor="middle" class="sm bold" fill="#d97706">value here → a₍ₙ₎</text>
  <line x1="424" y1="50" x2="424" y2="122" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="424" y="42" text-anchor="middle" class="sm bold" fill="#059669">value here → s₍ₙ₎</text>
  <line x1="28" y1="190" x2="532" y2="190" class="rule"/>
  <text x="150" y="212" text-anchor="middle" class="sm bold">a₍ₙ₎ = (1 − vⁿ)/i</text>
  <text x="150" y="232" text-anchor="middle" class="sm dim">one period before the first payment</text>
  <text x="150" y="252" text-anchor="middle" class="sm bold">s₍ₙ₎ = ((1+i)ⁿ − 1)/i</text>
  <text x="150" y="272" text-anchor="middle" class="sm dim">at the date of the last payment</text>
  <rect x="304" y="202" width="226" height="74" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="417" y="224" text-anchor="middle" class="sm bold">Worked at i = 6%, n = 5</text>
  <text x="417" y="244" text-anchor="middle" class="sm dim">a₍₅₎ = 4.2124</text>
  <text x="417" y="262" text-anchor="middle" class="sm dim">s₍₅₎ = 5.6371 = 1.06⁵ × 4.2124</text>
</svg>
