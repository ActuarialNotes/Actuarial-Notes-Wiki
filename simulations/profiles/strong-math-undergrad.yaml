  derivation_patience: 0.9
  math_anxiety: 0.05
  guess_tendency: 0.05
  confidence_bias: 0.1
  reading_speed_wpm: 260
study_strategy: read-then-practice
time_budget:
  steps_per_session: 40
  questions_per_session: 8
feedback: solution
seed: 11
