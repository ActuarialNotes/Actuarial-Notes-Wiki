<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Payments of 100 at times 0, 1 and 2 piled up at time 4, each block topped by the interest it earned — largest for the payment made first</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="48" y1="344" x2="324" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="340" x2="56" y2="348" class="tick"/>
    <text x="56" y="361" text-anchor="middle" class="sm dim">0</text>
    <line x1="118.5" y1="340" x2="118.5" y2="348" class="tick"/>
    <text x="118.5" y="361" text-anchor="middle" class="sm dim">1</text>
    <line x1="181" y1="340" x2="181" y2="348" class="tick"/>
    <text x="181" y="361" text-anchor="middle" class="sm dim">2</text>
    <line x1="243.5" y1="340" x2="243.5" y2="348" class="tick"/>
    <text x="243.5" y="361" text-anchor="middle" class="sm dim">3</text>
    <line x1="306" y1="340" x2="306" y2="348" class="tick"/>
    <text x="306" y="361" text-anchor="middle" class="sm dim">4</text>
    <rect x="41" y="290" width="30" height="54" rx="2" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="56" y="282" text-anchor="middle" class="sm">100</text>
    <rect x="291" y="290" width="30" height="54" rx="2" fill="#3b82f6" fill-opacity="0.75"/>
    <rect x="291" y="264.94" width="30" height="25.06" rx="2" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="103.5" y="290" width="30" height="54" rx="2" fill="#7c3aed" fill-opacity="0.75"/>
    <text x="118.5" y="282" text-anchor="middle" class="sm">100</text>
    <rect x="291" y="210.94" width="30" height="54" rx="2" fill="#7c3aed" fill-opacity="0.75"/>
    <rect x="291" y="193.06" width="30" height="17.87" rx="2" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="166" y="290" width="30" height="54" rx="2" fill="#0d9488" fill-opacity="0.75"/>
    <text x="181" y="282" text-anchor="middle" class="sm">100</text>
    <rect x="291" y="139.06" width="30" height="54" rx="2" fill="#0d9488" fill-opacity="0.75"/>
    <rect x="291" y="127.72" width="30" height="11.34" rx="2" fill="#0d9488" fill-opacity="0.3" stroke="#0d9488" stroke-width="1.2"/>
    <line x1="204" y1="317" x2="281" y2="317" class="thin" stroke="#059669" stroke-width="1.6" marker-end="url(#ah059669)"/>
    <text x="306" y="119.72" text-anchor="middle" class="bold">FV₄</text>
  </g>
</svg>
