<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A lift chart of actual against predicted loss cost across equal-exposure buckets</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Lift is how far the model separates best</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">from worst</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">lift = worst bucket ÷ best bucket</text>
  <line x1="97.7" y1="98" x2="97.7" y2="310" class="grid"/>
  <line x1="145.85" y1="98" x2="145.85" y2="310" class="grid"/>
  <line x1="194" y1="98" x2="194" y2="310" class="grid"/>
  <line x1="242.15" y1="98" x2="242.15" y2="310" class="grid"/>
  <line x1="290.3" y1="98" x2="290.3" y2="310" class="grid"/>
  <line x1="64" y1="243.75" x2="324" y2="243.75" class="grid"/>
  <line x1="64" y1="177.5" x2="324" y2="177.5" class="grid"/>
  <line x1="64" y1="111.25" x2="324" y2="111.25" class="grid"/>
  <line x1="64" y1="310" x2="324" y2="310" class="axis"/>
  <line x1="64" y1="98" x2="64" y2="310" class="axis"/>
  <line x1="97.7" y1="310" x2="97.7" y2="314" class="tick"/>
  <text x="97.7" y="326" text-anchor="middle" class="sm dim">1</text>
  <line x1="145.85" y1="310" x2="145.85" y2="314" class="tick"/>
  <text x="145.85" y="326" text-anchor="middle" class="sm dim">2</text>
  <line x1="194" y1="310" x2="194" y2="314" class="tick"/>
  <text x="194" y="326" text-anchor="middle" class="sm dim">3</text>
  <line x1="242.15" y1="310" x2="242.15" y2="314" class="tick"/>
  <text x="242.15" y="326" text-anchor="middle" class="sm dim">4</text>
  <line x1="290.3" y1="310" x2="290.3" y2="314" class="tick"/>
  <text x="290.3" y="326" text-anchor="middle" class="sm dim">5</text>
  <line x1="60" y1="243.75" x2="64" y2="243.75" class="tick"/>
  <text x="56" y="247.35" text-anchor="end" class="sm dim">0.5</text>
  <line x1="60" y1="177.5" x2="64" y2="177.5" class="tick"/>
  <text x="56" y="181.1" text-anchor="end" class="sm dim">1</text>
  <line x1="60" y1="111.25" x2="64" y2="111.25" class="tick"/>
  <text x="56" y="114.85" text-anchor="end" class="sm dim">1.5</text>
  <rect x="84.7" y="219.9" width="26" height="90.1" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="132.85" y="198.7" width="26" height="111.3" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="181" y="181.48" width="26" height="128.52" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="229.15" y="162.93" width="26" height="147.07" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="277.3" y="121.85" width="26" height="188.15" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <polyline points="97.7,215.93 145.85,196.05 194,180.15 242.15,161.6 290.3,133.77" class="curve" stroke="#e11d48" stroke-width="2.2"/>
  <circle cx="97.7" cy="215.93" r="3.2" fill="#e11d48"/>
  <circle cx="145.85" cy="196.05" r="3.2" fill="#e11d48"/>
  <circle cx="194" cy="180.15" r="3.2" fill="#e11d48"/>
  <circle cx="242.15" cy="161.6" r="3.2" fill="#e11d48"/>
  <circle cx="290.3" cy="133.77" r="3.2" fill="#e11d48"/>
  <line x1="64" y1="177.5" x2="324" y2="177.5" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="64" y1="348" x2="77" y2="348" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="83" y="351.6" text-anchor="start" class="sm">actual</text>
  <line x1="174" y1="348" x2="187" y2="348" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="193" y="351.6" text-anchor="start" class="sm">predicted</text>
  <text x="180" y="372" text-anchor="middle" class="sm bold">lift = 1.42 / 0.68 = 2.1×</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">rising bars = ranking; matching line = calibration</text>
</svg>
