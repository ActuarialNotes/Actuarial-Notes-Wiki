  <text x="192" y="216" text-anchor="middle" class="sm dim">μ</text>
  <text x="332" y="232" text-anchor="end" class="sm dim">x</text>
  <text x="48" y="48" text-anchor="start" class="sm dim">f(x)</text>
  <text x="204.6" y="74" text-anchor="start" class="sm bold">σ² = 1</text>
  <text x="264.8" y="140" text-anchor="start" class="sm bold">σ² = 3.6</text>
