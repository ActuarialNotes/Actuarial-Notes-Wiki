<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running PAA book's $24M premium less $4.8M of acquisition cash flows leaving a $19.2M LRC, with the deferred acquisition asset that used to hold them struck out</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="50.06" y="114" width="45.88" height="236" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="73" y="106" text-anchor="middle" class="sm">24.0</text>
    <text x="73" y="365" text-anchor="middle" class="sm dim">premium</text>
    <rect x="124.06" y="114" width="45.88" height="47.2" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="147" y="106" text-anchor="middle" class="sm">4.8</text>
    <text x="147" y="365" text-anchor="middle" class="sm dim">acquisition</text>
    <rect x="198.06" y="161.2" width="45.88" height="188.8" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="221" y="153.2" text-anchor="middle" class="sm">19.2</text>
    <text x="221" y="365" text-anchor="middle" class="sm dim">LRC</text>
    <line x1="30" y1="350" x2="264" y2="350" class="axis"/>
    <rect x="280" y="114" width="44" height="47.2" rx="3" fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="280" y1="114" x2="324" y2="161.2" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="324" y1="114" x2="280" y2="161.2" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round"/>
    <text x="302" y="365" text-anchor="middle" class="sm dim">DAC</text>
  </g>
</svg>
