<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Book value converging to the redemption value for a premium and a discount bond</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Book value walks the price to the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">redemption value</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">BV_k = Fr · a₍ₙ₋ₖ₎ + C · v^(n−k)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">BV₀ = P  and  BVₙ = C</text>
  <polyline points="78,140.81 102.8,149.21 127.6,157.87 152.4,166.78 177.2,175.96 202,185.41 226.8,195.15 251.6,205.18 276.4,215.51 301.2,226.15 326,237.11" class="curve" stroke="#d97706" stroke-width="2"/>
  <polyline points="78,316.4 102.8,310.66 127.6,304.52 152.4,297.95 177.2,290.92 202,283.4 226.8,275.35 251.6,266.74 276.4,257.52 301.2,247.66 326,237.11" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <line x1="78" y1="237.11" x2="326" y2="237.11" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <circle cx="78" cy="140.81" r="2.6" fill="#d97706"/>
  <circle cx="102.8" cy="149.21" r="2.6" fill="#d97706"/>
  <circle cx="127.6" cy="157.87" r="2.6" fill="#d97706"/>
  <circle cx="152.4" cy="166.78" r="2.6" fill="#d97706"/>
  <circle cx="177.2" cy="175.96" r="2.6" fill="#d97706"/>
  <circle cx="202" cy="185.41" r="2.6" fill="#d97706"/>
  <circle cx="226.8" cy="195.15" r="2.6" fill="#d97706"/>
  <circle cx="251.6" cy="205.18" r="2.6" fill="#d97706"/>
  <circle cx="276.4" cy="215.51" r="2.6" fill="#d97706"/>
  <circle cx="301.2" cy="226.15" r="2.6" fill="#d97706"/>
  <circle cx="326" cy="237.11" r="2.6" fill="#d97706"/>
  <circle cx="78" cy="316.4" r="2.6" fill="#3b82f6"/>
  <circle cx="102.8" cy="310.66" r="2.6" fill="#3b82f6"/>
  <circle cx="127.6" cy="304.52" r="2.6" fill="#3b82f6"/>
  <circle cx="152.4" cy="297.95" r="2.6" fill="#3b82f6"/>
  <circle cx="177.2" cy="290.92" r="2.6" fill="#3b82f6"/>
  <circle cx="202" cy="283.4" r="2.6" fill="#3b82f6"/>
  <circle cx="226.8" cy="275.35" r="2.6" fill="#3b82f6"/>
  <circle cx="251.6" cy="266.74" r="2.6" fill="#3b82f6"/>
  <circle cx="276.4" cy="257.52" r="2.6" fill="#3b82f6"/>
  <circle cx="301.2" cy="247.66" r="2.6" fill="#3b82f6"/>
  <circle cx="326" cy="237.11" r="2.6" fill="#3b82f6"/>
  <text x="112.72" y="124.22" text-anchor="start" class="sm bold" fill="#d97706">premium bond</text>
  <text x="112.72" y="312.75" text-anchor="start" class="sm bold" fill="#3b82f6">discount bond</text>
  <text x="316" y="229.11" text-anchor="middle" class="sm bold">C</text>
  <line x1="78" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="354" class="tick"/>
  <text x="78" y="366" text-anchor="middle" class="sm dim">0</text>
  <line x1="202" y1="350" x2="202" y2="354" class="tick"/>
  <text x="202" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="326" y1="350" x2="326" y2="354" class="tick"/>
  <text x="326" y="366" text-anchor="middle" class="sm dim">10</text>
  <line x1="74" y1="293.56" x2="78" y2="293.56" class="tick"/>
  <text x="70" y="297.16" text-anchor="end" class="sm dim">900</text>
  <line x1="74" y1="237.11" x2="78" y2="237.11" class="tick"/>
  <text x="70" y="240.71" text-anchor="end" class="sm dim">1,000</text>
  <line x1="74" y1="180.67" x2="78" y2="180.67" class="tick"/>
  <text x="70" y="184.27" text-anchor="end" class="sm dim">1,100</text>
  <line x1="74" y1="124.22" x2="78" y2="124.22" class="tick"/>
  <text x="70" y="127.82" text-anchor="end" class="sm dim">1,200</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">coupons paid</text>
  <text x="74" y="82" text-anchor="start" class="sm dim">book value</text>
</svg>
