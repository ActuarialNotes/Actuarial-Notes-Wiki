  <circle cx="101.3" cy="230.78" r="3.6" fill="#d97706"/>
  <text x="123.3" y="220.78" text-anchor="middle" class="sm">Z = 0.53</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">claims n</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">full credibility at the standard, √ below it</text>
</svg>
