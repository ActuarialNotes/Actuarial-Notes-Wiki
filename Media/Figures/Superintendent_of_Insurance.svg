<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The provincial superintendent's powers beside the federal solvency regulator's</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The province licenses; Ottawa</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">capitalises</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">One licence per province, every province</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">plus one federal order to commence</text>
    <rect x="30" y="96" width="143" height="158" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
    <rect x="30" y="96" width="143" height="28" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
    <text x="101.5" y="114" text-anchor="middle" class="sm bold" fill="#d97706">Superintendent</text>
    <text x="101.5" y="144" text-anchor="middle" class="sm">licence insurers</text>
    <text x="101.5" y="168" text-anchor="middle" class="sm">licence agents</text>
    <text x="101.5" y="192" text-anchor="middle" class="sm">approve rates</text>
    <text x="101.5" y="216" text-anchor="middle" class="sm">police conduct</text>
    <text x="101.5" y="240" text-anchor="middle" class="sm">set benefits</text>
    <rect x="187" y="96" width="143" height="158" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="187" y="96" width="143" height="28" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
    <text x="258.5" y="114" text-anchor="middle" class="sm bold" fill="#3b82f6">OSFI</text>
    <text x="258.5" y="144" text-anchor="middle" class="sm">capital, MCT</text>
    <text x="258.5" y="168" text-anchor="middle" class="sm">valuation</text>
    <text x="258.5" y="192" text-anchor="middle" class="sm">guidelines</text>
    <text x="258.5" y="216" text-anchor="middle" class="sm">intervention</text>
    <text x="180" y="274" text-anchor="middle" class="sm dim">FSRA · AMF · Alberta · BCFSA — one office</text>
    <text x="180" y="290" text-anchor="middle" class="sm dim">per province, under a different name each time</text>
    <text x="180" y="322" text-anchor="middle" class="sm dim">a provincially chartered insurer gets both halves</text>
    <text x="180" y="338" text-anchor="middle" class="sm dim">from the same office — it adopts the MCT rather</text>
    <text x="180" y="354" text-anchor="middle" class="sm dim">than writing a capital rule of its own</text>
  </g>
</svg>
