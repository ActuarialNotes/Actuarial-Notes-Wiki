<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A future payment discounted back to today along a timeline</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Discounting moves a payment backwards</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PV = FV · vⁿ = FV (1 + i)⁻ⁿ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">747.26 = 1,000 × 1.06⁻⁵</text>
  <line x1="48" y1="250" x2="324" y2="250" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="56" y1="246" x2="56" y2="254" class="tick"/>
  <text x="56" y="267" text-anchor="middle" class="sm dim">0</text>
  <line x1="106" y1="246" x2="106" y2="254" class="tick"/>
  <text x="106" y="267" text-anchor="middle" class="sm dim">1</text>
  <line x1="156" y1="246" x2="156" y2="254" class="tick"/>
  <text x="156" y="267" text-anchor="middle" class="sm dim">2</text>
  <line x1="206" y1="246" x2="206" y2="254" class="tick"/>
  <text x="206" y="267" text-anchor="middle" class="sm dim">3</text>
  <line x1="256" y1="246" x2="256" y2="254" class="tick"/>
  <text x="256" y="267" text-anchor="middle" class="sm dim">4</text>
  <line x1="306" y1="246" x2="306" y2="254" class="tick"/>
  <text x="306" y="267" text-anchor="middle" class="sm dim">5</text>
  <line x1="306" y1="250" x2="306" y2="172" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="306" y="166" text-anchor="middle" class="sm">1,000</text>
  <line x1="298" y1="146" x2="64" y2="146" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="181" y="138" text-anchor="middle" class="bold" fill="#d97706">× v⁵</text>
  <line x1="56" y1="250" x2="56" y2="200" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="56" y="194" text-anchor="middle" class="sm">747.26</text>
  <text x="56" y="286" text-anchor="middle" class="sm dim">PV</text>
  <text x="306" y="286" text-anchor="middle" class="sm dim">FV</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">a dollar later is worth less than one now</text>
</svg>
