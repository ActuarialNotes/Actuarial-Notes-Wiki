<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <title>E[XY] built cell by cell from a joint table</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Every joint moment is one weighted sum over the table</text>
  <text x="92" y="90" text-anchor="middle" class="sm dim">y = 0</text>
  <text x="144" y="90" text-anchor="middle" class="sm dim">y = 1</text>
  <text x="196" y="90" text-anchor="middle" class="sm dim">y = 2</text>
  <text x="56" y="115" text-anchor="end" class="sm dim">x = 0</text>
  <text x="56" y="145" text-anchor="end" class="sm dim">x = 1</text>
  <text x="56" y="175" text-anchor="end" class="sm dim">x = 2</text>
  <rect x="66" y="96" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="92" y="115" text-anchor="middle" class="sm">0.10</text>
  <rect x="118" y="96" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="144" y="115" text-anchor="middle" class="sm">0.08</text>
  <rect x="170" y="96" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="196" y="115" text-anchor="middle" class="sm">0.02</text>
  <rect x="66" y="126" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="92" y="145" text-anchor="middle" class="sm">0.06</text>
  <rect x="118" y="126" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="144" y="145" text-anchor="middle" class="sm">0.20</text>
  <rect x="170" y="126" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="196" y="145" text-anchor="middle" class="sm">0.14</text>
  <rect x="66" y="156" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="92" y="175" text-anchor="middle" class="sm">0.04</text>
  <rect x="118" y="156" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="144" y="175" text-anchor="middle" class="sm">0.12</text>
  <rect x="170" y="156" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="196" y="175" text-anchor="middle" class="sm">0.24</text>
  <text x="144" y="236" text-anchor="middle" class="sm dim">each cell contributes g(x, y) · p(x, y)</text>
  <text x="400" y="92" text-anchor="middle" class="sm bold">E[g(X, Y)] = Σ Σ g(x, y) p(x, y)</text>
  <line x1="304" y1="112" x2="304" y2="140" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="123" text-anchor="start" class="sm bold">E[X] = Σ Σ x p(x, y)</text>
  <text x="314" y="138" text-anchor="start" class="sm dim">= 1.34 here</text>
  <line x1="304" y1="154" x2="304" y2="182" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="165" text-anchor="start" class="sm bold">E[Y] = Σ Σ y p(x, y)</text>
  <text x="314" y="180" text-anchor="start" class="sm dim">= 1.28 here</text>
  <line x1="304" y1="196" x2="304" y2="224" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="207" text-anchor="start" class="sm bold">E[XY] = Σ Σ xy p(x, y)</text>
  <text x="314" y="222" text-anchor="start" class="sm dim">= 1.88 here</text>
  <line x1="304" y1="238" x2="304" y2="266" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="314" y="249" text-anchor="start" class="sm bold">Cov(X, Y) = E[XY] − E[X]E[Y]</text>
  <text x="314" y="264" text-anchor="start" class="sm dim">= 0.16 → positive tilt</text>
  <text x="280" y="276" text-anchor="middle" class="sm dim">Independence would force E[XY] = E[X]E[Y] — it does not hold here</text>
</svg>
