<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three parts of the insurance risk margin, and why growth alone raises it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The largest margin, and it grows with</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">volume</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Insurance = claim liabilities</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">+ premium liabilities + catastrophe</text>
    <rect x="71.92" y="138.5" width="49.49" height="101.5" rx="3" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="96.67" y="131.5" text-anchor="middle" class="sm">58</text>
    <text x="96.67" y="255" text-anchor="middle" class="sm dim">claim</text>
    <rect x="157.25" y="201.5" width="49.49" height="38.5" rx="3" fill="#0d9488" fill-opacity="0.75"/>
    <text x="182" y="194.5" text-anchor="middle" class="sm">22</text>
    <text x="182" y="255" text-anchor="middle" class="sm dim">premium</text>
    <rect x="242.59" y="219" width="49.49" height="21" rx="3" fill="#e11d48" fill-opacity="0.75"/>
    <text x="267.33" y="212" text-anchor="middle" class="sm">12</text>
    <text x="267.33" y="255" text-anchor="middle" class="sm dim">catastrophe</text>
    <line x1="48" y1="240" x2="316" y2="240" class="axis"/>
    <text x="180" y="278" text-anchor="middle" class="sm dim">$M — the running insurer's $92M margin</text>
    <line x1="30" y1="298" x2="330" y2="298" class="rule"/>
    <text x="36" y="320" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="320" text-anchor="start" class="sm">factors by line — long-tail lines carry more</text>
    <text x="36" y="344" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="344" text-anchor="start" class="sm">reinsurance reduces it, but only if registered</text>
    <text x="36" y="368" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="368" text-anchor="start" class="sm">— which swaps insurance risk for credit risk</text>
  </g>
</svg>
