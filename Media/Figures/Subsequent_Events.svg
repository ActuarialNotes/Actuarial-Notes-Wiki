<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The one question that decides the treatment of an event between the valuation date and the report</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Evidence of what was already true, or a</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">new fact?</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Evidence at the valuation date → adjust</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">A new condition after it → disclose</text>
    <line x1="40" y1="134" x2="330" y2="134" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="78" y1="129" x2="78" y2="139" class="tick"/>
    <text x="78" y="153" text-anchor="middle" class="sm dim">valuation</text>
    <line x1="268" y1="129" x2="268" y2="139" class="tick"/>
    <text x="268" y="153" text-anchor="middle" class="sm dim">report</text>
    <rect x="78" y="114" width="190" height="14" rx="3" fill="#7c3aed" fill-opacity="0.40"/>
    <text x="173" y="125" text-anchor="middle" class="sm">events to consider</text>
    <text x="180" y="104" text-anchor="middle" class="sm dim">the window runs to the report date</text>
    <rect x="34" y="176" width="136" height="88" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="102" y="214" text-anchor="middle" class="sm">Adjusting</text>
    <text x="102" y="232" text-anchor="middle" class="sm dim">a court decision on</text>
    <text x="102" y="252" text-anchor="middle" class="sm dim">a claim already open</text>
    <rect x="190" y="176" width="136" height="88" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
    <text x="258" y="214" text-anchor="middle" class="sm">Non-adjusting</text>
    <text x="258" y="232" text-anchor="middle" class="sm dim">a January catastrophe</text>
    <text x="258" y="252" text-anchor="middle" class="sm dim">after a 31 Dec date</text>
    <line x1="30" y1="282" x2="330" y2="282" class="rule"/>
    <text x="180" y="304" text-anchor="middle" class="sm dim">and a third category: an event that ends the</text>
    <text x="180" y="320" text-anchor="middle" class="sm dim">going concern changes the whole basis</text>
    <text x="180" y="348" text-anchor="middle" class="sm dim">an adjusting event of any size moves the opinion</text>
    <text x="180" y="364" text-anchor="middle" class="sm dim">and the MCT ratio — which is why the boundary</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">is where the argument happens</text>
  </g>
</svg>
