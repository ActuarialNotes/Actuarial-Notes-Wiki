<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The prior split into two columns whose shaded claim areas make up P(C), half of it high-risk</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The posterior is the claiming slice of</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">the prior</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(H | C) = P(C | H) P(H) / P(C)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">= 0.08 / 0.16 = 0.50</text>
  <rect x="70" y="108" width="48" height="168" fill="#3b82f6" fill-opacity="0.12"/>
  <rect x="118" y="108" width="192" height="168" fill="#e11d48" fill-opacity="0.12"/>
  <rect x="70" y="208.8" width="48" height="67.2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="118" y="259.2" width="192" height="16.8" fill="#e11d48" fill-opacity="0.55"/>
  <rect x="70" y="108" width="240" height="168" rx="3" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
  <line x1="118" y1="108" x2="118" y2="276" stroke="var(--surf)" stroke-width="1.4"/>
  <text x="94" y="100" text-anchor="middle" class="sm bold" fill="#3b82f6">H 0.20</text>
  <text x="214" y="100" text-anchor="middle" class="sm bold" fill="#e11d48">L 0.80</text>
  <text x="94" y="248" text-anchor="middle" class="sm bold">0.08</text>
  <text x="214" y="272" text-anchor="middle" class="sm bold">0.08</text>
  <text x="180" y="296" text-anchor="middle" class="sm dim">shaded = files a claim</text>
  <rect x="80" y="312" width="110" height="26" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="190" y="312" width="110" height="26" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <rect x="80" y="312" width="220" height="26" rx="3" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="135" y="329" text-anchor="middle" class="sm bold">0.08</text>
  <text x="245" y="329" text-anchor="middle" class="sm bold">0.08</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">P(C) = 0.16 — the blue half is P(H | C)</text>
</svg>
