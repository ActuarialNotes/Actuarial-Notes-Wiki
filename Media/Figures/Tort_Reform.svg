<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A reform's saving arriving at once and eroding as the courts and the bar adapt to it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">The saving is real, and it decays</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Reform lowers premium by lowering</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">compensation — say so plainly</text>
    <line x1="64" y1="258" x2="334" y2="258" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="258" x2="64" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <polyline points="64,121.33 139.4,121.33" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <polyline points="142,121.33 142,210.17" class="curve" stroke="#e11d48" stroke-width="2.4"/>
    <polyline points="142,210.17 220,182.83 324,141.83" class="curve" stroke="#d97706" stroke-width="2.4"/>
    <line x1="142" y1="258" x2="142" y2="94" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
    <text x="142" y="100.25" text-anchor="middle" class="sm bold" fill="#e11d48">reform</text>
    <text x="256.4" y="196.5" text-anchor="middle" class="sm bold" fill="#d97706">erosion</text>
    <text x="100.4" y="141.83" text-anchor="middle" class="sm dim">cost</text>
    <text x="180" y="280" text-anchor="middle" class="sm dim">years since the reform</text>
    <line x1="30" y1="282" x2="330" y2="282" class="rule"/>
    <text x="40" y="302" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="56" y="302" text-anchor="start" class="sm">restrict access — threshold, deductible</text>
    <text x="40" y="326" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="56" y="326" text-anchor="start" class="sm">cap damages by category</text>
    <text x="40" y="350" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="56" y="350" text-anchor="start" class="sm">shorten limitation, cut expert evidence</text>
    <text x="40" y="374" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="56" y="374" text-anchor="start" class="sm">coordinate with the accident benefit</text>
  </g>
</svg>
