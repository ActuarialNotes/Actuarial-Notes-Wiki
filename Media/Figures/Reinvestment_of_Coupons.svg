  <line x1="82" y1="231.81" x2="326" y2="231.81" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="204" y1="350" x2="204" y2="231.81" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <circle cx="204" cy="231.81" r="3.6" fill="#059669"/>
  <text x="230" y="219.81" text-anchor="middle" class="sm bold">r_i = j</text>
  <text x="100.3" y="327.77" text-anchor="start" class="sm">short of the yield</text>
  <text x="313.8" y="127.75" text-anchor="end" class="sm">ahead of it</text>
  <line x1="82" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="82" y1="350" x2="82" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="112.5" y1="350" x2="112.5" y2="354" class="tick"/>
  <text x="112.5" y="366" text-anchor="middle" class="sm dim">2%</text>
  <line x1="204" y1="350" x2="204" y2="354" class="tick"/>
  <text x="204" y="366" text-anchor="middle" class="sm dim">5%</text>
  <line x1="295.5" y1="350" x2="295.5" y2="354" class="tick"/>
  <text x="295.5" y="366" text-anchor="middle" class="sm dim">8%</text>
  <line x1="78" y1="334.12" x2="82" y2="334.12" class="tick"/>
  <text x="74" y="337.73" text-anchor="end" class="sm dim">1,500</text>
  <line x1="78" y1="254.75" x2="82" y2="254.75" class="tick"/>
  <text x="74" y="258.35" text-anchor="end" class="sm dim">1,600</text>
  <line x1="78" y1="175.38" x2="82" y2="175.38" class="tick"/>
  <text x="74" y="178.97" text-anchor="end" class="sm dim">1,700</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">reinvestment rate r_i</text>
  <text x="78" y="82" text-anchor="start" class="sm dim">accumulated value</text>
</svg>
