<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A rear-end collision drawn on a road, with the car in front pointed to 0% and the car behind to 100% on a fault scale in 25% steps</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="24" y="110" width="312" height="132" rx="6" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <line x1="24" y1="176" x2="336" y2="176" class="thin dash" stroke="var(--axis)" stroke-width="1.6"/>
    <line x1="318" y1="142" x2="282" y2="142" class="thin" stroke="var(--axis)" stroke-width="1.3" marker-end="url(#ahvaraxis)"/>
    <line x1="318" y1="210" x2="282" y2="210" class="thin" stroke="var(--axis)" stroke-width="1.3" marker-end="url(#ahvaraxis)"/>
    <g transform="translate(220,0) scale(-1,1)">
    <path d="M68,218.4 V206.64 L84.8,203.28 L96.56,189.84 H125.12 L136.88,203.28 L152,208.32 V218.4 Z" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="86.48" cy="220.08" r="7.56" fill="var(--surf)" stroke="#059669" stroke-width="1.6"/>
    <circle cx="133.52" cy="220.08" r="7.56" fill="var(--surf)" stroke="#059669" stroke-width="1.6"/>
    </g>
    <g transform="translate(412,0) scale(-1,1)">
    <path d="M164,218.4 V206.64 L180.8,203.28 L192.56,189.84 H221.12 L232.88,203.28 L248,208.32 V218.4 Z" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="182.48" cy="220.08" r="7.56" fill="var(--surf)" stroke="#e11d48" stroke-width="1.6"/>
    <circle cx="229.52" cy="220.08" r="7.56" fill="var(--surf)" stroke="#e11d48" stroke-width="1.6"/>
    </g>
    <line x1="60" y1="322" x2="300" y2="322" class="axis"/>
    <line x1="60" y1="317" x2="60" y2="327" class="tick"/>
    <text x="60" y="344" text-anchor="middle" class="sm bold">0%</text>
    <line x1="120" y1="317" x2="120" y2="327" class="tick"/>
    <text x="120" y="344" text-anchor="middle" class="sm bold">25%</text>
    <line x1="180" y1="317" x2="180" y2="327" class="tick"/>
    <text x="180" y="344" text-anchor="middle" class="sm bold">50%</text>
    <line x1="240" y1="317" x2="240" y2="327" class="tick"/>
    <text x="240" y="344" text-anchor="middle" class="sm bold">75%</text>
    <line x1="300" y1="317" x2="300" y2="327" class="tick"/>
    <text x="300" y="344" text-anchor="middle" class="sm bold">100%</text>
    <line x1="110" y1="234" x2="60" y2="306" class="thin dot" stroke="#059669" stroke-width="1.6"/>
    <polygon points="53,306 67,306 60,317" fill="#059669"/>
    <line x1="206" y1="234" x2="300" y2="306" class="thin dot" stroke="#e11d48" stroke-width="1.6"/>
    <polygon points="293,306 307,306 300,317" fill="#e11d48"/>
  </g>
</svg>
