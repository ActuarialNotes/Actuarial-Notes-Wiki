<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An ROC curve with the area under it shaded against the diagonal of a useless model</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Area under the ROC curve, over all</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">thresholds</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Gini = 2 × AUROC − 1</text>
  <line x1="64" y1="98" x2="64" y2="314" class="grid"/>
  <line x1="193" y1="98" x2="193" y2="314" class="grid"/>
  <line x1="322" y1="98" x2="322" y2="314" class="grid"/>
  <line x1="64" y1="314" x2="322" y2="314" class="grid"/>
  <line x1="64" y1="206" x2="322" y2="206" class="grid"/>
  <line x1="64" y1="98" x2="322" y2="98" class="grid"/>
  <line x1="64" y1="314" x2="322" y2="314" class="axis"/>
  <line x1="64" y1="98" x2="64" y2="314" class="axis"/>
  <line x1="64" y1="314" x2="64" y2="318" class="tick"/>
  <text x="64" y="330" text-anchor="middle" class="sm dim">0</text>
  <line x1="193" y1="314" x2="193" y2="318" class="tick"/>
  <text x="193" y="330" text-anchor="middle" class="sm dim">0.5</text>
  <line x1="322" y1="314" x2="322" y2="318" class="tick"/>
  <text x="322" y="330" text-anchor="middle" class="sm dim">1</text>
  <line x1="60" y1="314" x2="64" y2="314" class="tick"/>
  <text x="56" y="317.6" text-anchor="end" class="sm dim">0</text>
  <line x1="60" y1="206" x2="64" y2="206" class="tick"/>
  <text x="56" y="209.6" text-anchor="end" class="sm dim">0.5</text>
  <line x1="60" y1="98" x2="64" y2="98" class="tick"/>
  <text x="56" y="101.6" text-anchor="end" class="sm dim">1</text>
