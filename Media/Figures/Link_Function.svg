  <text x="58" y="121.6" text-anchor="end" class="sm dim">8</text>
  <text x="326" y="370" text-anchor="end" class="sm dim">linear predictor η</text>
  <text x="62" y="104" text-anchor="start" class="sm dim">mean μ</text>
