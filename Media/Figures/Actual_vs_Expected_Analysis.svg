<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Each accident year's emergence during 2024 drawn inside the outline of what the prior valuation expected, 2022 and 2023 running over it at A/E ratios of 1.17 and 1.24</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="100.2" y1="94" x2="100.2" y2="344" class="grid"/>
    <line x1="148.6" y1="94" x2="148.6" y2="344" class="grid"/>
    <line x1="197" y1="94" x2="197" y2="344" class="grid"/>
    <line x1="245.4" y1="94" x2="245.4" y2="344" class="grid"/>
    <line x1="293.8" y1="94" x2="293.8" y2="344" class="grid"/>
    <line x1="76" y1="344" x2="318" y2="344" class="grid"/>
    <line x1="76" y1="236.86" x2="318" y2="236.86" class="grid"/>
    <line x1="76" y1="129.71" x2="318" y2="129.71" class="grid"/>
    <line x1="76" y1="344" x2="328" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="76" y1="344" x2="76" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="100.2" y1="344" x2="100.2" y2="348" class="tick"/>
    <text x="100.2" y="360" text-anchor="middle" class="sm dim">2020</text>
    <line x1="148.6" y1="344" x2="148.6" y2="348" class="tick"/>
    <text x="148.6" y="360" text-anchor="middle" class="sm dim">2021</text>
    <line x1="197" y1="344" x2="197" y2="348" class="tick"/>
    <text x="197" y="360" text-anchor="middle" class="sm dim">2022</text>
    <line x1="245.4" y1="344" x2="245.4" y2="348" class="tick"/>
    <text x="245.4" y="360" text-anchor="middle" class="sm dim">2023</text>
    <line x1="293.8" y1="344" x2="293.8" y2="348" class="tick"/>
    <text x="293.8" y="360" text-anchor="middle" class="sm dim">2024</text>
    <line x1="72" y1="344" x2="76" y2="344" class="tick"/>
    <text x="68" y="347.6" text-anchor="end" class="sm dim">0</text>
    <line x1="72" y1="236.86" x2="76" y2="236.86" class="tick"/>
    <text x="68" y="240.46" text-anchor="end" class="sm dim">300</text>
    <line x1="72" y1="129.71" x2="76" y2="129.71" class="tick"/>
    <text x="68" y="133.31" text-anchor="end" class="sm dim">600</text>
    <text x="318" y="376" text-anchor="end" class="sm dim">accident year</text>
    <text x="72" y="80" text-anchor="start" class="sm dim">emergence</text>
    <rect x="89.2" y="331.14" width="22" height="12.86" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="83.2" y="329.71" width="34" height="14.29" rx="2" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="137.6" y="314" width="22" height="30" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="131.6" y="311.86" width="34" height="32.14" rx="2" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="186" y="269" width="22" height="75" rx="2" fill="#e11d48" fill-opacity="0.72"/>
    <rect x="180" y="279.71" width="34" height="64.29" rx="2" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="197" y="261" text-anchor="middle" class="sm bold">1.17</text>
    <rect x="234.4" y="194" width="22" height="150" rx="2" fill="#e11d48" fill-opacity="0.72"/>
    <rect x="228.4" y="222.57" width="34" height="121.43" rx="2" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="245.4" y="186" text-anchor="middle" class="sm bold">1.24</text>
    <rect x="282.8" y="126.14" width="22" height="217.86" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="276.8" y="115.43" width="34" height="228.57" rx="2" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="272.02" y="119.43" text-anchor="end" class="sm dim">expected</text>
  </g>
</svg>
