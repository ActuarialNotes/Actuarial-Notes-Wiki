<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Twenty years of catastrophe ratios against the long-term load they average to</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A load, not an average of recent years</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Total PP = Non-Cat PP + Cat Load</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Cat Load = expected annual cat loss / exposures</text>
  <line x1="75.54" y1="100" x2="75.54" y2="326" class="grid"/>
  <line x1="125.84" y1="100" x2="125.84" y2="326" class="grid"/>
  <line x1="188.71" y1="100" x2="188.71" y2="326" class="grid"/>
  <line x1="251.58" y1="100" x2="251.58" y2="326" class="grid"/>
  <line x1="314.46" y1="100" x2="314.46" y2="326" class="grid"/>
  <line x1="68" y1="326" x2="322" y2="326" class="grid"/>
  <line x1="68" y1="242.91" x2="322" y2="242.91" class="grid"/>
  <line x1="68" y1="159.82" x2="322" y2="159.82" class="grid"/>
  <line x1="68" y1="326" x2="332" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="326" x2="68" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="75.54" y1="326" x2="75.54" y2="330" class="tick"/>
  <text x="75.54" y="342" text-anchor="middle" class="sm dim">1</text>
  <line x1="125.84" y1="326" x2="125.84" y2="330" class="tick"/>
  <text x="125.84" y="342" text-anchor="middle" class="sm dim">5</text>
  <line x1="188.71" y1="326" x2="188.71" y2="330" class="tick"/>
  <text x="188.71" y="342" text-anchor="middle" class="sm dim">10</text>
  <line x1="251.58" y1="326" x2="251.58" y2="330" class="tick"/>
  <text x="251.58" y="342" text-anchor="middle" class="sm dim">15</text>
  <line x1="314.46" y1="326" x2="314.46" y2="330" class="tick"/>
  <text x="314.46" y="342" text-anchor="middle" class="sm dim">20</text>
  <line x1="64" y1="326" x2="68" y2="326" class="tick"/>
  <text x="60" y="329.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="64" y1="242.91" x2="68" y2="242.91" class="tick"/>
  <text x="60" y="246.51" text-anchor="end" class="sm dim">25%</text>
  <line x1="64" y1="159.82" x2="68" y2="159.82" class="tick"/>
  <text x="60" y="163.42" text-anchor="end" class="sm dim">50%</text>
  <rect x="71.4" y="319.35" width="8.3" height="6.65" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="83.97" y="322.68" width="8.3" height="3.32" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="96.54" y="312.71" width="8.3" height="13.29" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="109.12" y="326" width="8.3" height="0" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="121.69" y="133.24" width="8.3" height="192.76" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="134.27" y="316.03" width="8.3" height="9.97" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="146.84" y="322.68" width="8.3" height="3.32" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="159.41" y="326" width="8.3" height="0" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="171.99" y="306.06" width="8.3" height="19.94" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="184.56" y="319.35" width="8.3" height="6.65" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="197.14" y="322.68" width="8.3" height="3.32" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="209.71" y="189.74" width="8.3" height="136.26" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="222.29" y="319.35" width="8.3" height="6.65" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="234.86" y="326" width="8.3" height="0" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="247.43" y="316.03" width="8.3" height="9.97" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="260.01" y="322.68" width="8.3" height="3.32" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="272.58" y="296.09" width="8.3" height="29.91" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="285.16" y="326" width="8.3" height="0" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="297.73" y="319.35" width="8.3" height="6.65" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <rect x="310.31" y="312.71" width="8.3" height="13.29" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <line x1="68" y1="302.74" x2="322" y2="302.74" class="thin" stroke="#059669" stroke-width="1.3"/>
  <text x="319.49" y="295.74" text-anchor="end" class="sm bold" fill="#059669">load 7%</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">cat losses as a % of premium, by year</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">a five-year experience period would price</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">this book at 0% or at 12% — never at 7%</text>
</svg>
