<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The discount factor as the present value of 1 due in one period</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">v is what 1 next period is worth today</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">v = (1 + i)⁻¹ = 1 − d</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">n periods:  vⁿ = (1 + i)⁻ⁿ</text>
  <line x1="88" y1="190" x2="286" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="96" y1="186" x2="96" y2="194" class="tick"/>
  <text x="96" y="207" text-anchor="middle" class="sm dim">0</text>
  <line x1="268" y1="186" x2="268" y2="194" class="tick"/>
  <text x="268" y="207" text-anchor="middle" class="sm dim">1</text>
  <line x1="268" y1="190" x2="268" y2="124" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="268" y="118" text-anchor="middle" class="sm">1</text>
  <line x1="96" y1="190" x2="96" y2="144" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="96" y="138" text-anchor="middle" class="sm">v</text>
  <line x1="258" y1="106" x2="106" y2="106" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
  <text x="182" y="98" text-anchor="middle" class="bold" fill="#d97706">× v</text>
  <rect x="62" y="288" width="194.34" height="30" rx="4" fill="#d97706" fill-opacity="0.3" stroke="#d97706" stroke-width="1.2"/>
  <rect x="256.34" y="288" width="11.66" height="30" rx="4" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.2"/>
  <text x="159.17" y="308" text-anchor="middle" class="sm bold">v = 0.9434</text>
  <text x="276" y="308" text-anchor="start" class="sm bold" fill="#e11d48">d</text>
  <text x="165" y="338" text-anchor="middle" class="sm dim">v + d = 1</text>
</svg>
