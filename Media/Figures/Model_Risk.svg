    <path d="M162.08,358 V336.72 Q162.08,327.76 172.16,327.76 H187.84 Q197.92,327.76 197.92,336.72 V358 Z" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
