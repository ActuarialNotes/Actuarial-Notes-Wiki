<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The duty running both ways, and the imbalance in what a breach costs each side</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A duty owed in both directions,</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">unequally felt</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">uberrimae fidei — utmost good faith</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">at application, in force, and on the claim</text>
  <rect x="36" y="98" width="104" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="88" y="116" text-anchor="middle" class="sm">insured</text>
  <rect x="220" y="98" width="104" height="28" rx="14.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="272" y="116" text-anchor="middle" class="sm">insurer</text>
  <line x1="146" y1="104" x2="214" y2="104" class="thin" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah3b82f6)"/>
  <line x1="214" y1="122" x2="146" y2="122" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <rect x="30" y="148" width="143" height="100" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="30" y="148" width="143" height="24" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="164" text-anchor="middle" class="sm bold" fill="#3b82f6">owes</text>
  <text x="101.5" y="192" text-anchor="middle" class="sm">full disclosure</text>
  <text x="101.5" y="214" text-anchor="middle" class="sm">honest claims</text>
  <text x="101.5" y="236" text-anchor="middle" class="sm">cooperation</text>
  <rect x="187" y="148" width="143" height="122" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="187" y="148" width="143" height="24" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="164" text-anchor="middle" class="sm bold" fill="#d97706">owes</text>
  <text x="258.5" y="192" text-anchor="middle" class="sm">prompt, fair</text>
  <text x="258.5" y="214" text-anchor="middle" class="sm">investigation</text>
  <text x="258.5" y="236" text-anchor="middle" class="sm">reasons on denial</text>
  <text x="258.5" y="258" text-anchor="middle" class="sm">equal regard</text>
  <line x1="30" y1="274" x2="330" y2="274" class="rule"/>
  <text x="180" y="296" text-anchor="middle" class="sm bold" fill="#e11d48">but the positions are not equal</text>
  <text x="180" y="320" text-anchor="middle" class="sm dim">the claimant has just suffered a loss and</text>
  <text x="180" y="336" text-anchor="middle" class="sm dim">cannot fund years of litigation — which is why</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">the duty is enforced with damages of its own</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">in Quebec it comes from the Civil Code, not equity</text>
</svg>
