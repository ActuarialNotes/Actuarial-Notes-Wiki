    <text x="300" y="85" text-anchor="middle" class="sm dim">C</text>
    <line x1="86.5" y1="318" x2="86.5" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="117" y1="318" x2="117" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="147.5" y1="318" x2="147.5" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="178" y1="318" x2="178" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="208.5" y1="318" x2="208.5" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="239" y1="318" x2="239" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="269.5" y1="318" x2="269.5" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="300" y1="318" x2="300" y2="228" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <text x="86.5" y="220" text-anchor="middle" class="bold">Fr</text>
    <path d="M86.5,350 v5.4 H188.25 q5,0 5,4.95 q0,-4.95 5,-4.95 H300 v-5.4" class="thin" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="193.25" y="370" text-anchor="middle" class="sm bold">n coupons</text>
  </g>
</svg>
