<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A single appellate decision moving the reserve on every open claim, not just the one before the court</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">One decision reprices every open claim</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">A ruling binds until a higher court</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">or the legislature answers it</text>
  <rect x="44" y="100" width="272" height="34" rx="6" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="122" text-anchor="middle" class="sm">Supreme Court of Canada</text>
  <rect x="70" y="144" width="220" height="34" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="166" text-anchor="middle" class="sm">provincial court of appeal</text>
  <line x1="180" y1="134" x2="180" y2="143" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <rect x="96" y="188" width="168" height="34" rx="6" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.2"/>
  <text x="180" y="210" text-anchor="middle" class="sm">trial court</text>
  <line x1="180" y1="178" x2="180" y2="187" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <text x="180" y="254" text-anchor="middle" class="sm dim">binds downward, everywhere below it</text>
  <line x1="30" y1="274" x2="330" y2="274" class="rule"/>
  <line x1="64" y1="362" x2="334" y2="362" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="362" x2="64" y2="284" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <polyline points="64,334.8 194,332.08" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <polyline points="194,332.08 194,311.68 324,306.24" class="curve" stroke="#e11d48" stroke-width="2.4"/>
  <text x="124.67" y="345.68" text-anchor="middle" class="sm dim">reserve</text>
  <text x="196.17" y="302.16" text-anchor="start" class="sm bold" fill="#e11d48">decision</text>
  <text x="180" y="382" text-anchor="middle" class="sm dim">and the effect is retroactive — it lands on claims</text>
</svg>
