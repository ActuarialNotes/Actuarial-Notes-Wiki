<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Claims paid in full by the insurer and billed back within the insured's large deductible</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Paid in full, then billed back</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Recovery = min(X, d) per occurrence</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Net Loss = Gross Paid − Collected Recoveries</text>
  <rect x="39" y="127" width="84.67" height="30" rx="15.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="81.33" y="146" text-anchor="middle" class="sm">claim occurs</text>
  <rect x="137.67" y="127" width="84.67" height="30" rx="15.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="146" text-anchor="middle" class="sm">insurer pays</text>
  <line x1="124.67" y1="142" x2="136.67" y2="142" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="236.33" y="127" width="84.67" height="30" rx="15.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="278.67" y="146" text-anchor="middle" class="sm">insured repays</text>
  <line x1="223.33" y1="142" x2="235.33" y2="142" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <text x="180" y="190" text-anchor="middle" class="sm dim">a $700k claim under a $250k deductible</text>
  <rect x="46" y="216" width="268" height="34" rx="4" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="238" text-anchor="middle" class="sm">insurer pays 700</text>
  <rect x="46" y="272" width="95.71" height="34" rx="4" fill="#059669" fill-opacity="0.6"/>
  <text x="93.86" y="294" text-anchor="middle" class="sm">billed back 250</text>
  <text x="180" y="336" text-anchor="middle" class="sm dim">the credit risk stays with the insurer —</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">reserve gross and hold the recovery as an asset</text>
</svg>
