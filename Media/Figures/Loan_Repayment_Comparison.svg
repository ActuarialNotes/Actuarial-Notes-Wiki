  <text x="399" y="78" text-anchor="middle" class="sm bold" fill="#059669">Constant principal</text>
  <text x="399" y="204" text-anchor="middle" class="sm dim">payment falls each period</text>
  <text x="399" y="222" text-anchor="middle" class="sm bold">total interest 3,600</text>
  <line x1="158" y1="250" x2="171" y2="250" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="177" y="253.6" text-anchor="start" class="sm">interest</text>
  <line x1="282" y1="250" x2="295" y2="250" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="301" y="253.6" text-anchor="start" class="sm">principal (level)</text>
  <line x1="406" y1="250" x2="419" y2="250" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="425" y="253.6" text-anchor="start" class="sm">principal (constant)</text>
  <line x1="28" y1="268" x2="532" y2="268" class="rule"/>
  <text x="150" y="288" text-anchor="middle" class="sm bold">P_level = L / a₍ₙ₎</text>
