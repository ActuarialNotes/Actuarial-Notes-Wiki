<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three sample paths of one counting process over the same time axis, one path per outcome</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="60" y1="348" x2="320" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="60" y1="348" x2="60" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="60" y1="348" x2="60" y2="352" class="tick"/>
    <text x="60" y="364" text-anchor="middle" class="sm dim">0</text>
    <line x1="110" y1="348" x2="110" y2="352" class="tick"/>
    <text x="110" y="364" text-anchor="middle" class="sm dim">2</text>
    <line x1="160" y1="348" x2="160" y2="352" class="tick"/>
    <text x="160" y="364" text-anchor="middle" class="sm dim">4</text>
    <line x1="210" y1="348" x2="210" y2="352" class="tick"/>
    <text x="210" y="364" text-anchor="middle" class="sm dim">6</text>
    <line x1="260" y1="348" x2="260" y2="352" class="tick"/>
    <text x="260" y="364" text-anchor="middle" class="sm dim">8</text>
    <line x1="310" y1="348" x2="310" y2="352" class="tick"/>
    <text x="310" y="364" text-anchor="middle" class="sm dim">10</text>
    <line x1="56" y1="348" x2="60" y2="348" class="tick"/>
    <text x="52" y="351.6" text-anchor="end" class="sm dim">0</text>
    <line x1="56" y1="278.81" x2="60" y2="278.81" class="tick"/>
    <text x="52" y="282.41" text-anchor="end" class="sm dim">2</text>
    <line x1="56" y1="209.62" x2="60" y2="209.62" class="tick"/>
    <text x="52" y="213.22" text-anchor="end" class="sm dim">4</text>
    <line x1="56" y1="140.43" x2="60" y2="140.43" class="tick"/>
    <text x="52" y="144.03" text-anchor="end" class="sm dim">6</text>
    <text x="310" y="380" text-anchor="end" class="sm dim">time t</text>
    <polyline points="60,348 75,348 75,313.41 97.5,313.41 97.5,278.81 145,278.81 145,244.22 185,244.22 185,209.62 212.5,209.62 212.5,175.03 265,175.03 265,140.43 310,140.43" class="curve" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="316" y="144.43" text-anchor="start" class="sm bold">ω₁</text>
    <polyline points="60,348 90,348 90,313.41 110,313.41 110,278.81 125,278.81 125,244.22 180,244.22 180,209.62 245,209.62 245,175.03 310,175.03" class="curve" stroke="#d97706" stroke-width="1.8"/>
    <text x="316" y="179.03" text-anchor="start" class="sm bold">ω₂</text>
    <polyline points="60,348 82.5,348 82.5,313.41 137.5,313.41 137.5,278.81 165,278.81 165,244.22 182.5,244.22 182.5,209.62 225,209.62 225,175.03 255,175.03 255,140.43 287.5,140.43 287.5,105.84 310,105.84" class="curve" stroke="#059669" stroke-width="1.8"/>
    <text x="316" y="109.84" text-anchor="start" class="sm bold">ω₃</text>
  </g>
</svg>
