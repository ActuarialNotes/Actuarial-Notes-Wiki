<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <title>Face value as the base for coupons and, usually, the redemption</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Face value sets the coupon — it is not the price</text>
  <rect x="56" y="84" width="172" height="76" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="142" y="112" text-anchor="middle" class="ttl">F = 1,000</text>
  <text x="142" y="136" text-anchor="middle" class="sm dim">face (par) value</text>
  <line x1="236" y1="108" x2="292" y2="108" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
  <text x="264" y="98" text-anchor="middle" class="sm" fill="#3b82f6">× r</text>
  <rect x="300" y="84" width="172" height="76" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="386" y="112" text-anchor="middle" class="ttl">coupon = 50</text>
  <text x="386" y="136" text-anchor="middle" class="sm dim">F × r each period</text>
  <line x1="142" y1="172" x2="142" y2="200" class="thin" stroke="#059669" stroke-width="1.6" marker-end="url(#ah059669)"/>
  <text x="152" y="190" text-anchor="start" class="sm dim">usually C = F at maturity</text>
  <line x1="28" y1="216" x2="532" y2="216" class="rule"/>
  <line x1="40" y1="234" x2="40" y2="264" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="50" y="245" text-anchor="start" class="sm bold">Face value F</text>
  <text x="50" y="260" text-anchor="start" class="sm dim">on the certificate</text>
  <line x1="212" y1="234" x2="212" y2="264" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="222" y="245" text-anchor="start" class="sm bold">Redemption C</text>
  <text x="222" y="260" text-anchor="start" class="sm dim">what is repaid</text>
  <line x1="384" y1="234" x2="384" y2="264" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="394" y="245" text-anchor="start" class="sm bold">Price P</text>
  <text x="394" y="260" text-anchor="start" class="sm dim">what the buyer pays</text>
  <text x="280" y="282" text-anchor="middle" class="sm dim">All three are equal only when the bond sells at par</text>
</svg>
