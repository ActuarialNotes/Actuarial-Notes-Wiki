  <circle cx="216" cy="108" r="3.4" fill="#3b82f6"/>
  <text x="216" y="96" text-anchor="middle" class="sm dim">S₄</text>
  <line x1="254" y1="102" x2="254" y2="114" class="tick"/>
  <circle cx="254" cy="108" r="3.4" fill="#3b82f6"/>
  <text x="254" y="96" text-anchor="middle" class="sm dim">S₅</text>
  <line x1="312" y1="102" x2="312" y2="114" class="tick"/>
  <circle cx="312" cy="108" r="3.4" fill="#3b82f6"/>
  <text x="312" y="96" text-anchor="middle" class="sm dim">S₆</text>
  <path d="M40,117 v3.6 H62 q5,0 5,3.3 q0,-3.3 5,-3.3 H94 v-3.6" class="thin" stroke="#d97706" stroke-width="1.2"/>
  <text x="67" y="134" text-anchor="middle" class="sm">T₁</text>
  <path d="M94,117 v3.6 H110 q5,0 5,3.3 q0,-3.3 5,-3.3 H136 v-3.6" class="thin" stroke="#d97706" stroke-width="1.2"/>
