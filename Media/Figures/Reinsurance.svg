<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Seven claims cut by a 1,500 xs 500 excess-of-loss treaty into the cedant's retention, the reinsured layer and the excess above it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="74" y1="344" x2="326" y2="344" class="grid"/>
    <line x1="74" y1="299.36" x2="326" y2="299.36" class="grid"/>
    <line x1="74" y1="165.43" x2="326" y2="165.43" class="grid"/>
    <line x1="74" y1="94" x2="326" y2="94" class="grid"/>
    <line x1="74" y1="344" x2="336" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="344" x2="74" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="70" y1="344" x2="74" y2="344" class="tick"/>
    <text x="66" y="347.6" text-anchor="end" class="sm dim">0</text>
    <line x1="70" y1="299.36" x2="74" y2="299.36" class="tick"/>
    <text x="66" y="302.96" text-anchor="end" class="sm dim">500</text>
    <line x1="70" y1="165.43" x2="74" y2="165.43" class="tick"/>
    <text x="66" y="169.03" text-anchor="end" class="sm dim">2,000</text>
    <line x1="70" y1="94" x2="74" y2="94" class="tick"/>
    <text x="66" y="97.6" text-anchor="end" class="sm dim">2,800</text>
    <text x="326" y="376" text-anchor="end" class="sm dim">claims</text>
    <rect x="83.93" y="327.93" width="15.78" height="16.07" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="109.38" y="299.36" width="15.78" height="44.64" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="109.38" y="288.64" width="15.78" height="10.71" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="134.84" y="317.21" width="15.78" height="26.79" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="160.29" y="299.36" width="15.78" height="44.64" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="160.29" y="219" width="15.78" height="80.36" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="185.75" y="299.36" width="15.78" height="44.64" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="185.75" y="165.43" width="15.78" height="133.93" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="185.75" y="111.86" width="15.78" height="53.57" rx="2" fill="#e11d48" fill-opacity="0.72"/>
    <rect x="211.2" y="322.57" width="15.78" height="21.43" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="236.65" y="299.36" width="15.78" height="44.64" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
    <rect x="236.65" y="263.64" width="15.78" height="35.71" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <line x1="74" y1="299.36" x2="326" y2="299.36" class="thin" stroke="#3b82f6" stroke-width="1.3"/>
    <line x1="74" y1="165.43" x2="326" y2="165.43" class="thin" stroke="#d97706" stroke-width="1.3"/>
    <text x="292.91" y="325.68" text-anchor="middle" class="sm">retained</text>
    <text x="292.91" y="236.39" text-anchor="middle" class="sm bold">1,500 xs 500</text>
    <text x="292.91" y="133.71" text-anchor="middle" class="sm">above limit</text>
  </g>
</svg>
