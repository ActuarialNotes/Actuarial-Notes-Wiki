<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Predictors ranked by the impurity they remove across the trees of an ensemble</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Rank predictors by impurity removed</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Imp(Xⱼ) = mean Δ impurity over splits on Xⱼ</text>
  <text x="120" y="122" text-anchor="end" class="sm">prior claims</text>
  <rect x="130" y="108" width="178" height="20" rx="3" fill="#3b82f6" fill-opacity="0.75"/>
  <text x="315" y="122" text-anchor="start" class="sm dim">100</text>
  <text x="120" y="156" text-anchor="end" class="sm">claim amount</text>
  <rect x="130" y="142" width="126.38" height="20" rx="3" fill="#3b82f6" fill-opacity="0.60"/>
  <text x="263.38" y="156" text-anchor="start" class="sm dim">71</text>
  <text x="120" y="190" text-anchor="end" class="sm">days to report</text>
  <rect x="130" y="176" width="113.92" height="20" rx="3" fill="#3b82f6" fill-opacity="0.57"/>
  <text x="250.92" y="190" text-anchor="start" class="sm dim">64</text>
  <text x="120" y="224" text-anchor="end" class="sm">territory</text>
  <rect x="130" y="210" width="21.36" height="20" rx="3" fill="#3b82f6" fill-opacity="0.31"/>
  <text x="158.36" y="224" text-anchor="start" class="sm dim">12</text>
  <text x="120" y="258" text-anchor="end" class="sm">policy age</text>
  <rect x="130" y="244" width="16.02" height="20" rx="3" fill="#3b82f6" fill-opacity="0.29"/>
  <text x="153.02" y="258" text-anchor="start" class="sm dim">9</text>
  <text x="120" y="292" text-anchor="end" class="sm">gender</text>
  <rect x="130" y="278" width="3.56" height="20" rx="3" fill="#3b82f6" fill-opacity="0.26"/>
  <text x="140.56" y="292" text-anchor="start" class="sm dim">2</text>
  <line x1="130" y1="100" x2="130" y2="320" class="rule"/>
  <text x="180" y="344" text-anchor="middle" class="sm dim">importance says a variable matters,</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">not which way it pushes the prediction</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">correlated predictors split the credit</text>
</svg>
