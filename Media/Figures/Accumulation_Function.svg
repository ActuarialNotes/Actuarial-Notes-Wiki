  <text x="338" y="228" text-anchor="end" class="sm dim">time t</text>
  <text x="54" y="52" text-anchor="start" class="sm dim">a(t)</text>
  <circle cx="58" cy="186.71" r="3.6" fill="var(--dim)"/>
  <text x="88" y="176.71" text-anchor="middle" class="sm">a(0) = 1</text>
  <line x1="66" y1="78" x2="79" y2="78" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="81.6" text-anchor="start" class="sm">simple: 1 + it</text>
  <line x1="66" y1="94" x2="79" y2="94" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="97.6" text-anchor="start" class="sm">compound: (1 + i)ᵗ</text>
  <line x1="66" y1="110" x2="79" y2="110" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="113.6" text-anchor="start" class="sm">force δ: e^(δt)</text>
  <text x="438" y="96" text-anchor="middle" class="sm bold">a(t) = exp( ∫₀ᵗ δ(s) ds )</text>
  <line x1="348" y1="118" x2="348" y2="150" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="358" y="130" text-anchor="start" class="sm bold">a(0) = 1</text>
  <text x="358" y="146" text-anchor="start" class="sm dim">and a(t) never decreases</text>
  <line x1="348" y1="164" x2="348" y2="196" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="358" y="176" text-anchor="start" class="sm bold">δ(t) = a′(t)/a(t)</text>
  <text x="358" y="192" text-anchor="start" class="sm dim">the force recovered from a(t)</text>
  <line x1="348" y1="210" x2="348" y2="242" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="358" y="222" text-anchor="start" class="sm bold">A(t) = k · a(t)</text>
  <text x="358" y="238" text-anchor="start" class="sm dim">the amount function for k</text>
  <text x="280" y="264" text-anchor="middle" class="sm dim">Every regime on the syllabus is one choice of δ(t)</text>
</svg>
