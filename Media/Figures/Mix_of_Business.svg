<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three territories at fixed loss ratios on a beam, their shares shifting from the 2022 mix to the 2024 mix, which moves the balance point, the aggregate loss ratio, from 69.5% to 76.1%</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="92.8" y="210" width="40" height="90" rx="3" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <rect x="92.8" y="138" width="40" height="162" rx="3" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="112.8" y="130" text-anchor="middle" class="sm bold">58%</text>
    <rect x="171.2" y="174" width="40" height="126" rx="3" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="171.2" y="174" width="40" height="126" rx="3" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="191.2" y="166" text-anchor="middle" class="sm bold">72%</text>
    <rect x="277.6" y="156" width="40" height="144" rx="3" fill="#e11d48" fill-opacity="0.45" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="277.6" y="228" width="40" height="72" rx="3" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="297.6" y="148" text-anchor="middle" class="sm bold">91%</text>
    <line x1="34" y1="300" x2="326" y2="300" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="177.2,302 167.2,320 187.2,320" fill="none" fill-opacity="0.5" stroke="var(--dim)" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="183.2" y="336" text-anchor="end" class="sm dim">69.5%</text>
    <polygon points="214.16,302 204.16,320 224.16,320" fill="#e11d48" fill-opacity="0.5" stroke="#e11d48" stroke-width="1.4"/>
    <text x="208.16" y="336" text-anchor="start" class="sm bold">76.1%</text>
  </g>
</svg>
