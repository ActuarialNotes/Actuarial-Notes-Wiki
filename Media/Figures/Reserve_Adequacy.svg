<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A carried reserve of 2,180 inside the 2,050 to 2,440 reasonable range but 70 short of the 2,250 indicated estimate</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="98.8" y="140" width="162.24" height="136" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="106.8" y="160" text-anchor="start" class="sm bold">range</text>
    <line x1="52" y1="280" x2="312" y2="280" class="axis"/>
    <line x1="78" y1="276" x2="78" y2="284" class="tick"/>
    <text x="78" y="298" text-anchor="middle" class="sm dim">2,000</text>
    <line x1="182" y1="276" x2="182" y2="284" class="tick"/>
    <text x="182" y="298" text-anchor="middle" class="sm dim">2,250</text>
    <line x1="286" y1="276" x2="286" y2="284" class="tick"/>
    <text x="286" y="298" text-anchor="middle" class="sm dim">2,500</text>
    <line x1="182" y1="132" x2="182" y2="280" class="thin dash" stroke="#059669" stroke-width="1.6"/>
    <text x="182" y="124" text-anchor="middle" class="sm bold">indicated 2,250</text>
    <rect x="152.88" y="262" width="29.12" height="12" rx="2" fill="#e11d48" fill-opacity="0.6"/>
    <text x="167.44" y="254" text-anchor="middle" class="sm bold">−70</text>
    <line x1="152.88" y1="356" x2="152.88" y2="288" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
    <text x="152.88" y="372" text-anchor="middle" class="sm bold">carried 2,180</text>
  </g>
</svg>
