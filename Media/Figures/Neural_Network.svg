  <line x1="79" y1="214" x2="171" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="214" x2="171" y2="259" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="214" x2="171" y2="289" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="244" x2="171" y2="169" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="244" x2="171" y2="199" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="244" x2="171" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="244" x2="171" y2="259" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="244" x2="171" y2="289" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="274" x2="171" y2="169" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="274" x2="171" y2="199" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="274" x2="171" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="274" x2="171" y2="259" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="79" y1="274" x2="171" y2="289" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="189" y1="169" x2="281" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="189" y1="199" x2="281" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="189" y1="229" x2="281" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="189" y1="259" x2="281" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <line x1="189" y1="289" x2="281" y2="229" class="thin" stroke="var(--axis)" stroke-width="0.7" stroke-opacity="0.55"/>
  <circle cx="70" cy="184" r="9" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="70" cy="214" r="9" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="70" cy="244" r="9" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.4"/>
