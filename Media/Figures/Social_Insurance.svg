<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Individual equity against social adequacy — the trade every social insurance program makes</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Contributions track earnings, benefits</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">track need</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Compulsory · statutory benefit</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">· contribution by earnings, not by risk</text>
    <line x1="68" y1="250" x2="332" y2="250" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="250" x2="68" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <polyline points="80.7,242.2 309.3,101.8" class="curve dash" stroke="#3b82f6" stroke-width="2"/>
    <polyline points="80.7,196.96 309.3,147.04" class="curve" stroke="#e11d48" stroke-width="2.4"/>
    <text x="261.04" y="112.72" text-anchor="middle" class="sm bold" fill="#3b82f6">private</text>
    <text x="255.96" y="165.76" text-anchor="middle" class="sm bold" fill="#e11d48">social</text>
    <text x="180" y="272" text-anchor="middle" class="sm dim">own expected cost</text>
    <text x="52" y="80" text-anchor="start" class="sm dim">contribution</text>
    <line x1="30" y1="292" x2="330" y2="292" class="rule"/>
    <text x="38" y="314" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="314" text-anchor="start" class="sm">compulsory, because adverse selection unravels</text>
    <text x="38" y="338" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="338" text-anchor="start" class="sm">a voluntary version of the same cover</text>
    <text x="38" y="362" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="362" text-anchor="start" class="sm">and pay-as-you-go funding is the weak point</text>
    <text x="38" y="386" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="386" text-anchor="start" class="sm">when the demographics turn</text>
  </g>
</svg>
