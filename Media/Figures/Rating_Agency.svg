    <ellipse cx="180" cy="332" rx="16" ry="3.4" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.2"/>
    <ellipse cx="180" cy="332" rx="16" ry="3.4" fill="#7c3aed" fill-opacity="0.3" stroke="none"/>
    <text x="180" y="384" text-anchor="middle" class="sm bold">costs rise</text>
    <polyline points="50,216 64,230 76,224 94,250" class="curve" stroke="#0d9488" stroke-width="2.6"/>
    <text x="72" y="272" text-anchor="middle" class="sm bold">metrics fall</text>
