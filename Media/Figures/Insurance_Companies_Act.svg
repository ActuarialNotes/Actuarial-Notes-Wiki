<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The sections of the ICA that create and protect the Appointed Actuary's role</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The statute that makes the actuary's</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">role real</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">s. 357 appoint · s. 365 value</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">s. 361 immunity · s. 515 adequate capital</text>
  <rect x="34" y="98" width="292" height="42" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="44" y="116" text-anchor="start" class="sm bold" fill="#3b82f6">s. 357</text>
  <text x="44" y="131" text-anchor="start" class="sm">the directors appoint, and only they remove</text>
  <rect x="34" y="148" width="292" height="42" rx="6" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
  <text x="44" y="166" text-anchor="start" class="sm bold" fill="#0d9488">s. 365</text>
  <text x="44" y="181" text-anchor="start" class="sm">value in accordance with accepted practice</text>
  <rect x="34" y="198" width="292" height="42" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="44" y="216" text-anchor="start" class="sm bold" fill="#d97706">ss. 358–368</text>
  <text x="44" y="231" text-anchor="start" class="sm">access to records, and the duty to report</text>
  <rect x="34" y="248" width="292" height="42" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="44" y="266" text-anchor="start" class="sm bold" fill="#059669">s. 361</text>
  <text x="44" y="281" text-anchor="start" class="sm">civil immunity for good-faith statements</text>
  <rect x="34" y="298" width="292" height="42" rx="6" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="44" y="316" text-anchor="start" class="sm bold" fill="#7c3aed">s. 515</text>
  <text x="44" y="331" text-anchor="start" class="sm">adequate capital and appropriate liquidity</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">a provincial Insurance Act mirrors all of it</text>
</svg>
