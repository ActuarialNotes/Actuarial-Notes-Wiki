<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An off-balance correction keeping a relativity change revenue-neutral</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Relativity changes move revenue on their</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">own</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">New Base = Base × (1 + overall) / (1 + OB)</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">1.073 / 1.030 ⇒ base rate +4.2%</text>
    <rect x="51" y="117" width="122" height="30" rx="15.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="112" y="136" text-anchor="middle" class="sm">overall +7.3%</text>
    <rect x="187" y="117" width="122" height="30" rx="15.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="248" y="136" text-anchor="middle" class="sm">relativities</text>
    <line x1="174" y1="132" x2="186" y2="132" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <text x="180" y="176" text-anchor="middle" class="sm dim">new relativities alone would raise revenue 3.0%</text>
    <text x="180" y="200" text-anchor="middle" class="sm dim">even before any base-rate change</text>
    <line x1="180" y1="214" x2="180" y2="244" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <rect x="82" y="249" width="196" height="34" rx="17.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
    <text x="180" y="270" text-anchor="middle" class="sm">base rate +4.2%</text>
    <text x="180" y="308" text-anchor="middle" class="sm dim">so the book gets +7.3% overall</text>
    <text x="180" y="344" text-anchor="middle" class="sm dim">dislocation, capping and the effective date</text>
    <text x="180" y="362" text-anchor="middle" class="sm dim">are decided here, not in the indication</text>
  </g>
</svg>
