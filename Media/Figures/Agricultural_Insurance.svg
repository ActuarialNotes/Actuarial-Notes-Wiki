<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four business risk management programs layered by the size of the income decline each answers</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Four programs stacked by the size of the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">loss</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">AgriInvest → AgriStability → AgriInsurance</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">→ AgriRecovery, as the loss grows</text>
  <rect x="96" y="100" width="168" height="38" rx="6" fill="#e11d48" fill-opacity="0.20" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="116" text-anchor="middle" class="sm bold">AgriRecovery</text>
  <text x="180" y="130" text-anchor="middle" class="sm dim">disaster response</text>
  <rect x="76" y="146" width="208" height="38" rx="6" fill="#d97706" fill-opacity="0.20" stroke="#d97706" stroke-width="1.2"/>
  <text x="180" y="162" text-anchor="middle" class="sm bold">AgriInsurance</text>
  <text x="180" y="176" text-anchor="middle" class="sm dim">yield loss, insured peril</text>
  <rect x="56" y="192" width="248" height="38" rx="6" fill="#0d9488" fill-opacity="0.20" stroke="#0d9488" stroke-width="1.2"/>
  <text x="180" y="208" text-anchor="middle" class="sm bold">AgriStability</text>
  <text x="180" y="222" text-anchor="middle" class="sm dim">margin decline</text>
  <rect x="36" y="238" width="288" height="38" rx="6" fill="#059669" fill-opacity="0.20" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="254" text-anchor="middle" class="sm bold">AgriInvest</text>
  <text x="180" y="268" text-anchor="middle" class="sm dim">matched savings</text>
  <text x="180" y="306" text-anchor="middle" class="sm dim">premiums are cost-shared federally and</text>
  <text x="180" y="322" text-anchor="middle" class="sm dim">provincially, and delivered by crown agencies</text>
  <text x="180" y="350" text-anchor="middle" class="sm dim">one drought hits every farm at once, so the law</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">of large numbers never gets going — which is why</text>
  <text x="180" y="382" text-anchor="middle" class="sm dim">no private market forms without the subsidy</text>
</svg>
