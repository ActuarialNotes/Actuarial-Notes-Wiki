  <circle cx="98.32" cy="174.74" r="3.2" fill="#3b82f6"/>
  <circle cx="113.97" cy="170.02" r="3.2" fill="#3b82f6"/>
  <circle cx="119.72" cy="139.02" r="3.2" fill="#3b82f6"/>
  <circle cx="131.42" cy="153.24" r="3.2" fill="#3b82f6"/>
  <circle cx="125.98" cy="155.78" r="30" fill="none" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="125.98" cy="155.78" r="4.6" fill="#3b82f6" stroke="var(--surf)" stroke-width="1.4"/>
  <circle cx="250.91" cy="156.69" r="3.2" fill="#d97706"/>
  <circle cx="257.11" cy="134.6" r="3.2" fill="#d97706"/>
  <circle cx="257.06" cy="141.69" r="3.2" fill="#d97706"/>
  <circle cx="275.7" cy="150.19" r="3.2" fill="#d97706"/>
  <circle cx="233.31" cy="157.75" r="3.2" fill="#d97706"/>
  <circle cx="253.87" cy="141.79" r="3.2" fill="#d97706"/>
  <circle cx="263.14" cy="140.87" r="3.2" fill="#d97706"/>
  <circle cx="300.92" cy="123.1" r="3.2" fill="#d97706"/>
  <circle cx="273.61" cy="120.12" r="3.2" fill="#d97706"/>
  <circle cx="270" cy="123.8" r="3.2" fill="#d97706"/>
  <circle cx="254.76" cy="149.36" r="30" fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="254.76" cy="149.36" r="4.6" fill="#d97706" stroke="var(--surf)" stroke-width="1.4"/>
  <circle cx="204.05" cy="243.27" r="3.2" fill="#059669"/>
  <circle cx="206.41" cy="273.38" r="3.2" fill="#059669"/>
  <circle cx="193.67" cy="274" r="3.2" fill="#059669"/>
  <circle cx="198.97" cy="227.9" r="3.2" fill="#059669"/>
  <circle cx="193.83" cy="246.74" r="3.2" fill="#059669"/>
  <circle cx="192.99" cy="256.51" r="3.2" fill="#059669"/>
  <circle cx="188.74" cy="248.33" r="3.2" fill="#059669"/>
  <circle cx="201.49" cy="255.93" r="3.2" fill="#059669"/>
  <circle cx="168.41" cy="218.05" r="3.2" fill="#059669"/>
  <circle cx="187.41" cy="274.65" r="3.2" fill="#059669"/>
  <circle cx="191.74" cy="254.22" r="30" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="191.74" cy="254.22" r="4.6" fill="#059669" stroke="var(--surf)" stroke-width="1.4"/>
  <text x="180" y="336" text-anchor="middle" class="sm dim">K-means: fix K, partition, iterate</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">hierarchical: no K, cut the dendrogram</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">standardize first — distance is scale-sensitive</text>
</svg>
