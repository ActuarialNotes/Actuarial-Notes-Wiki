<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The 1-in-500 PML met by reinsurance, reserves and capital — with the shortfall the requirement</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="180" y="104" text-anchor="middle" class="sm dim">$600M gross PML, and what meets it ($M)</text>
    <rect x="40" y="124" width="268" height="26" rx="4" fill="#e11d48" fill-opacity="0.45"/>
    <text x="174" y="142" text-anchor="middle" class="sm">PML 600</text>
    <rect x="40" y="172" width="166.16" height="26" rx="4" fill="#0d9488" fill-opacity="0.50"/>
    <text x="123.08" y="190" text-anchor="middle" class="sm">reinsurance</text>
    <rect x="206.16" y="172" width="26.8" height="26" rx="4" fill="#d97706" fill-opacity="0.50"/>
    <rect x="232.96" y="172" width="75.04" height="26" rx="4" fill="#3b82f6" fill-opacity="0.50"/>
    <text x="270.48" y="190" text-anchor="middle" class="sm">capital</text>
    <text x="180" y="218" text-anchor="middle" class="sm dim">reinsurance and the reserve go first — the capital</text>
    <text x="180" y="233" text-anchor="middle" class="sm dim">band is what OSFI requires you to hold behind them</text>
    <line x1="30" y1="250" x2="330" y2="250" class="rule"/>
    <text x="36" y="272" text-anchor="start" class="sm" fill="#7c3aed">•</text>
    <text x="52" y="272" text-anchor="start" class="sm">two zones carry it — coastal BC, and the</text>
    <text x="36" y="296" text-anchor="start" class="sm" fill="#7c3aed">•</text>
    <text x="52" y="296" text-anchor="start" class="sm">Quebec City–Montreal corridor</text>
    <text x="36" y="320" text-anchor="start" class="sm" fill="#7c3aed">•</text>
    <text x="52" y="320" text-anchor="start" class="sm">exposure data quality is a supervisory matter</text>
    <text x="36" y="344" text-anchor="start" class="sm" fill="#7c3aed">•</text>
    <text x="52" y="344" text-anchor="start" class="sm">and a programme sized for one event may be</text>
    <text x="36" y="368" text-anchor="start" class="sm" fill="#7c3aed">•</text>
    <text x="52" y="368" text-anchor="start" class="sm">exhausted before the aftershock</text>
  </g>
</svg>
