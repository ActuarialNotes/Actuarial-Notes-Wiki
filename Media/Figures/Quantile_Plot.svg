<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Held-out data sorted into equal-exposure buckets, actual against predicted</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Sort by prediction, bucket by equal</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">exposure</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ranking = the slope</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">calibration = the gap</text>
  <text x="180" y="88" text-anchor="middle" class="sm dim">buckets, worst predicted → best</text>
  <line x1="97.7" y1="112" x2="97.7" y2="308" class="grid"/>
  <line x1="145.85" y1="112" x2="145.85" y2="308" class="grid"/>
  <line x1="194" y1="112" x2="194" y2="308" class="grid"/>
  <line x1="242.15" y1="112" x2="242.15" y2="308" class="grid"/>
  <line x1="290.3" y1="112" x2="290.3" y2="308" class="grid"/>
  <line x1="64" y1="290.18" x2="324" y2="290.18" class="grid"/>
  <line x1="64" y1="218.91" x2="324" y2="218.91" class="grid"/>
  <line x1="64" y1="147.64" x2="324" y2="147.64" class="grid"/>
  <line x1="64" y1="308" x2="324" y2="308" class="axis"/>
  <line x1="64" y1="112" x2="64" y2="308" class="axis"/>
  <line x1="97.7" y1="308" x2="97.7" y2="312" class="tick"/>
  <text x="97.7" y="324" text-anchor="middle" class="sm dim">1</text>
  <line x1="145.85" y1="308" x2="145.85" y2="312" class="tick"/>
  <text x="145.85" y="324" text-anchor="middle" class="sm dim">2</text>
  <line x1="194" y1="308" x2="194" y2="312" class="tick"/>
  <text x="194" y="324" text-anchor="middle" class="sm dim">3</text>
  <line x1="242.15" y1="308" x2="242.15" y2="312" class="tick"/>
  <text x="242.15" y="324" text-anchor="middle" class="sm dim">4</text>
  <line x1="290.3" y1="308" x2="290.3" y2="312" class="tick"/>
  <text x="290.3" y="324" text-anchor="middle" class="sm dim">5</text>
  <line x1="60" y1="290.18" x2="64" y2="290.18" class="tick"/>
  <text x="56" y="293.78" text-anchor="end" class="sm dim">0.6</text>
  <line x1="60" y1="218.91" x2="64" y2="218.91" class="tick"/>
  <text x="56" y="222.51" text-anchor="end" class="sm dim">1</text>
  <line x1="60" y1="147.64" x2="64" y2="147.64" class="tick"/>
  <text x="56" y="151.24" text-anchor="end" class="sm dim">1.4</text>
  <polyline points="97.7,270.58 145.85,243.85 194,222.47 242.15,197.53 290.3,160.11" class="curve dash" stroke="#e11d48" stroke-width="2.3"/>
  <circle cx="97.7" cy="270.58" r="3.2" fill="#e11d48"/>
  <circle cx="145.85" cy="243.85" r="3.2" fill="#e11d48"/>
  <circle cx="194" cy="222.47" r="3.2" fill="#e11d48"/>
  <circle cx="242.15" cy="197.53" r="3.2" fill="#e11d48"/>
  <circle cx="290.3" cy="160.11" r="3.2" fill="#e11d48"/>
  <polyline points="97.7,275.93 145.85,247.42 194,224.25 242.15,199.31 290.3,144.07" class="curve" stroke="#3b82f6" stroke-width="2.3"/>
  <circle cx="97.7" cy="275.93" r="3.2" fill="#3b82f6"/>
  <circle cx="145.85" cy="247.42" r="3.2" fill="#3b82f6"/>
  <circle cx="194" cy="224.25" r="3.2" fill="#3b82f6"/>
  <circle cx="242.15" cy="199.31" r="3.2" fill="#3b82f6"/>
  <circle cx="290.3" cy="144.07" r="3.2" fill="#3b82f6"/>
  <line x1="64" y1="218.91" x2="324" y2="218.91" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="97.7" y1="275.93" x2="97.7" y2="270.58" class="thin" stroke="#059669" stroke-width="2"/>
  <line x1="145.85" y1="247.42" x2="145.85" y2="243.85" class="thin" stroke="#059669" stroke-width="2"/>
  <line x1="194" y1="224.25" x2="194" y2="222.47" class="thin" stroke="#059669" stroke-width="2"/>
  <line x1="242.15" y1="199.31" x2="242.15" y2="197.53" class="thin" stroke="#059669" stroke-width="2"/>
  <line x1="290.3" y1="160.11" x2="290.3" y2="144.07" class="thin" stroke="#059669" stroke-width="2"/>
  <line x1="60" y1="346" x2="73" y2="346" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="79" y="349.6" text-anchor="start" class="sm">actual</text>
  <line x1="172" y1="346" x2="185" y2="346" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="191" y="349.6" text-anchor="start" class="sm">predicted</text>
  <text x="180" y="370" text-anchor="middle" class="sm bold">top bucket under-predicted by 7%</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">held-out data only — never the training set</text>
</svg>
