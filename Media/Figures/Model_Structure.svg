<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The linear predictor built as a waterfall of terms: the intercept, two main effects, an interaction and a squared term, summing to η</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="40" y1="356" x2="320" y2="356" class="axis"/>
    <rect x="53.1" y="219.16" width="28" height="136.84" rx="2" fill="var(--dim)" fill-opacity="0.7"/>
    <text x="67.1" y="374" text-anchor="middle" class="sm bold">β₀</text>
    <rect x="98.26" y="137.05" width="28" height="82.11" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <line x1="81.1" y1="219.16" x2="98.26" y2="219.16" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="112.26" y="374" text-anchor="middle" class="sm bold">β₁x₁</text>
    <rect x="143.42" y="137.05" width="28" height="41.05" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <line x1="126.26" y1="137.05" x2="143.42" y2="137.05" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="157.42" y="374" text-anchor="middle" class="sm bold">β₂x₂</text>
    <rect x="188.58" y="123.37" width="28" height="54.74" rx="2" fill="#d97706" fill-opacity="0.7"/>
    <line x1="171.42" y1="178.11" x2="188.58" y2="178.11" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="202.58" y="374" text-anchor="middle" class="sm bold">β₃x₁x₂</text>
    <rect x="233.74" y="123.37" width="28" height="27.37" rx="2" fill="#059669" fill-opacity="0.7"/>
    <line x1="216.58" y1="123.37" x2="233.74" y2="123.37" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="247.74" y="374" text-anchor="middle" class="sm bold">β₄x₁²</text>
    <line x1="261.74" y1="150.74" x2="278.9" y2="150.74" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="278.9" y="150.74" width="28" height="205.26" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <text x="292.9" y="374" text-anchor="middle" class="bold">η</text>
  </g>
</svg>
