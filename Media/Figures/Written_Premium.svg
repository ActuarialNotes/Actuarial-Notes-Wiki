<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A $600 annual policy's written premium jumping to the full $600 on the day it is issued, while earned premium climbs to it over twelve months</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="68" y1="98" x2="68" y2="350" class="grid"/>
    <line x1="131" y1="98" x2="131" y2="350" class="grid"/>
    <line x1="194" y1="98" x2="194" y2="350" class="grid"/>
    <line x1="257" y1="98" x2="257" y2="350" class="grid"/>
    <line x1="320" y1="98" x2="320" y2="350" class="grid"/>
    <line x1="68" y1="350" x2="320" y2="350" class="grid"/>
    <line x1="68" y1="276.96" x2="320" y2="276.96" class="grid"/>
    <line x1="68" y1="203.91" x2="320" y2="203.91" class="grid"/>
    <line x1="68" y1="130.87" x2="320" y2="130.87" class="grid"/>
    <line x1="68" y1="350" x2="330" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="350" x2="68" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="350" x2="68" y2="354" class="tick"/>
    <text x="68" y="366" text-anchor="middle" class="sm dim">0</text>
    <line x1="131" y1="350" x2="131" y2="354" class="tick"/>
    <text x="131" y="366" text-anchor="middle" class="sm dim">3</text>
    <line x1="194" y1="350" x2="194" y2="354" class="tick"/>
    <text x="194" y="366" text-anchor="middle" class="sm dim">6</text>
    <line x1="257" y1="350" x2="257" y2="354" class="tick"/>
    <text x="257" y="366" text-anchor="middle" class="sm dim">9</text>
    <line x1="320" y1="350" x2="320" y2="354" class="tick"/>
    <text x="320" y="366" text-anchor="middle" class="sm dim">12</text>
    <line x1="64" y1="350" x2="68" y2="350" class="tick"/>
    <text x="60" y="353.6" text-anchor="end" class="sm dim">0</text>
    <line x1="64" y1="276.96" x2="68" y2="276.96" class="tick"/>
    <text x="60" y="280.56" text-anchor="end" class="sm dim">200</text>
    <line x1="64" y1="203.91" x2="68" y2="203.91" class="tick"/>
    <text x="60" y="207.51" text-anchor="end" class="sm dim">400</text>
    <line x1="64" y1="130.87" x2="68" y2="130.87" class="tick"/>
    <text x="60" y="134.47" text-anchor="end" class="sm dim">600</text>
    <text x="320" y="382" text-anchor="end" class="sm dim">months</text>
    <text x="64" y="84" text-anchor="start" class="sm dim">premium</text>
    <polyline points="68,350 68,130.87 320,130.87" class="curve" stroke="#d97706" stroke-width="2.4"/>
    <polyline points="68,350 320,130.87" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <text x="194" y="122.87" text-anchor="middle" class="sm bold">written</text>
    <text x="248.6" y="222.14" text-anchor="middle" class="sm bold">earned</text>
  </g>
</svg>
