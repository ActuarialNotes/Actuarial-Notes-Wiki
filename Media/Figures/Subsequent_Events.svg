<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A timeline from the valuation date to the report date with two events inside the window: a court ruling on an existing claim, arrowed back to adjust the valuation, and a new catastrophe, arrowed forward to be disclosed</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="64" y="224" width="232" height="24" rx="4" fill="#7c3aed" fill-opacity="0.16" stroke="none"/>
    <line x1="40" y1="236" x2="328" y2="236" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="220" x2="64" y2="252" class="thin" stroke="var(--ink)" stroke-width="1.8"/>
    <text x="64" y="268" text-anchor="middle" class="sm dim">valuation</text>
    <line x1="296" y1="220" x2="296" y2="252" class="thin" stroke="var(--ink)" stroke-width="1.8"/>
    <text x="296" y="268" text-anchor="middle" class="sm dim">report</text>
    <circle cx="174" cy="236" r="5" fill="#3b82f6"/>
    <line x1="174" y1="112.8" x2="174" y2="162" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="160.8" y="162" width="26.4" height="6" rx="2" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="146.4" y1="120" x2="201.6" y2="120" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="174" cy="111.6" r="3" fill="#3b82f6"/>
    <line x1="146.4" y1="120" x2="136.8" y2="138" stroke="#3b82f6" stroke-width="1"/>
    <line x1="146.4" y1="120" x2="156" y2="138" stroke="#3b82f6" stroke-width="1"/>
    <path d="M134.4,138 Q146.4,146.4 158.4,138 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="201.6" y1="120" x2="192" y2="138" stroke="#3b82f6" stroke-width="1"/>
    <line x1="201.6" y1="120" x2="211.2" y2="138" stroke="#3b82f6" stroke-width="1"/>
    <path d="M189.6,138 Q201.6,146.4 213.6,138 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="174" y1="168" x2="174" y2="230" class="thin dot" stroke="#3b82f6"/>
    <path d="M144,128 Q76,116 64,216" class="thin" stroke="#3b82f6" stroke-width="2"/>
    <line x1="65.44" y1="204" x2="64" y2="216" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="68" y="104" text-anchor="middle" class="sm bold">adjust</text>
    <circle cx="238" cy="236" r="5" fill="#e11d48"/>
    <polygon points="218.56,318.76 218.56,349 257.44,349 257.44,318.76 238,297.16" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="233.14" y="331.72" width="9.72" height="17.28" fill="#e11d48" fill-opacity="0.55"/>
    <line x1="238" y1="242" x2="238" y2="294" class="thin dot" stroke="#e11d48"/>
    <path d="M264,328 Q304,338 300,278" class="thin" stroke="#d97706" stroke-width="2"/>
    <line x1="300.48" y1="285.2" x2="300" y2="278" class="thin" stroke="#d97706" stroke-width="2" marker-end="url(#ahd97706)"/>
    <text x="308" y="374" text-anchor="end" class="sm bold">disclose</text>
  </g>
</svg>
