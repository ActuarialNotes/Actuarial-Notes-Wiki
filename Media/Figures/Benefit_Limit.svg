<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <title>Insurer payment capped at the benefit limit u</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A benefit limit caps what the insurer will pay</text>
  <polyline points="54,212 328,64" class="curve dash" stroke="var(--dim)" stroke-width="1.1"/>
  <text x="295.12" y="72.88" text-anchor="middle" class="sm dim">Y = X</text>
  <polyline points="54,212 218.4,123.2" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <polyline points="218.4,123.2 328,123.2" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <polygon points="218.4,123.2 328,64 328,123.2" fill="#e11d48" fill-opacity="0.2" stroke="none"/>
  <text x="281.42" y="90.64" text-anchor="middle" class="sm">insured keeps</text>
  <text x="281.42" y="102.48" text-anchor="middle" class="sm">the excess</text>
  <line x1="54" y1="212" x2="338" y2="212" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="54" y1="212" x2="54" y2="54" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="218.4" y1="212" x2="218.4" y2="216" class="tick"/>
  <text x="218.4" y="228" text-anchor="middle" class="sm dim">u</text>
  <line x1="50" y1="123.2" x2="54" y2="123.2" class="tick"/>
  <text x="46" y="126.8" text-anchor="end" class="sm dim">u</text>
  <text x="328" y="244" text-anchor="end" class="sm dim">loss X</text>
  <text x="50" y="50" text-anchor="start" class="sm dim">payment Y</text>
  <line x1="54" y1="123.2" x2="328" y2="123.2" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="60" y1="76" x2="73" y2="76" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="79" y="79.6" text-anchor="start" class="sm">Y = min(X, u)</text>
  <text x="420" y="96" text-anchor="middle" class="sm bold">The limit is the deductible's mirror</text>
  <line x1="316" y1="116" x2="316" y2="148" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="128" text-anchor="start" class="sm bold">Deductible d</text>
  <text x="326" y="144" text-anchor="start" class="sm dim">removes the small losses</text>
  <line x1="316" y1="162" x2="316" y2="194" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="174" text-anchor="start" class="sm bold">Limit u</text>
  <text x="326" y="190" text-anchor="start" class="sm dim">removes the large ones</text>
  <line x1="316" y1="208" x2="316" y2="240" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="220" text-anchor="start" class="sm bold">Both together</text>
  <text x="326" y="236" text-anchor="start" class="sm dim">Y = min(α(X − d)₊, u)</text>
  <text x="280" y="274" text-anchor="middle" class="sm dim">Above d + u/α the insurer pays exactly u, whatever the loss</text>
</svg>
