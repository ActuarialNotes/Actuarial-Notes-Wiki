<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The MCT ratio over a year: the two annual returns show only its start and end, while the three quarterly returns between them catch it falling through the supervisory target</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="68" y1="188.25" x2="320" y2="188.25" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
    <line x1="68" y1="352" x2="330" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="352" x2="68" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="352" x2="68" y2="356" class="tick"/>
    <text x="68" y="368" text-anchor="middle" class="sm dim">Dec</text>
    <line x1="131" y1="352" x2="131" y2="356" class="tick"/>
    <text x="131" y="368" text-anchor="middle" class="sm dim">Mar</text>
    <line x1="194" y1="352" x2="194" y2="356" class="tick"/>
    <text x="194" y="368" text-anchor="middle" class="sm dim">Jun</text>
    <line x1="257" y1="352" x2="257" y2="356" class="tick"/>
    <text x="257" y="368" text-anchor="middle" class="sm dim">Sep</text>
    <line x1="320" y1="352" x2="320" y2="356" class="tick"/>
    <text x="320" y="368" text-anchor="middle" class="sm dim">Dec</text>
    <line x1="64" y1="352" x2="68" y2="352" class="tick"/>
    <text x="60" y="355.6" text-anchor="end" class="sm dim">100%</text>
    <line x1="64" y1="188.25" x2="68" y2="188.25" class="tick"/>
    <text x="60" y="191.85" text-anchor="end" class="sm dim">150%</text>
    <polyline points="68,129.3 131,155.5 194,191.52 257,243.93 320,293.05" class="curve" stroke="#e11d48" stroke-width="2.4"/>
    <circle cx="131" cy="155.5" r="4" fill="#e11d48"/>
    <circle cx="194" cy="191.52" r="4" fill="#e11d48"/>
    <circle cx="257" cy="243.93" r="4" fill="#e11d48"/>
    <circle cx="68" cy="129.3" r="6" fill="#3b82f6"/>
    <circle cx="320" cy="293.05" r="6" fill="#3b82f6"/>
    <text x="62" y="117.3" text-anchor="start" class="sm bold">annual</text>
    <text x="326" y="313.05" text-anchor="end" class="sm bold">annual</text>
    <text x="140.45" y="132.57" text-anchor="start" class="sm bold">quarterly</text>
    <text x="80.6" y="202.25" text-anchor="start" class="sm">target</text>
  </g>
</svg>
