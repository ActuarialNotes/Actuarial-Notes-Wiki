  <line x1="170.67" y1="316" x2="170.67" y2="320" class="tick"/>
  <text x="170.67" y="332" text-anchor="middle" class="sm dim">250k</text>
  <line x1="277.33" y1="316" x2="277.33" y2="320" class="tick"/>
  <text x="277.33" y="332" text-anchor="middle" class="sm dim">500k</text>
  <line x1="170.67" y1="316" x2="170.67" y2="218.39" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
  <text x="176.67" y="214.39" text-anchor="start" class="sm bold" fill="#e11d48">cap M = 250k</text>
  <text x="238.93" y="287.2" text-anchor="middle" class="sm bold" fill="#e11d48">excess</text>
  <text x="180" y="346" text-anchor="middle" class="sm dim">claim size</text>
