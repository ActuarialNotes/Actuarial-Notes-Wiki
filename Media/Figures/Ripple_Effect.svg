<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A catastrophe's direct cost compounded by the second-order effects FCT requires to be modelled</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">The first impact is never the whole cost</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Model the ripples — and the realistic</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">management actions against them</text>
    <rect x="45.68" y="178.59" width="35.04" height="69.41" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="63.2" y="170.59" text-anchor="middle" class="sm">50</text>
    <text x="63.2" y="263" text-anchor="middle" class="sm dim">cat</text>
    <rect x="104.08" y="167.48" width="35.04" height="11.11" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="121.6" y="159.48" text-anchor="middle" class="sm">8</text>
    <text x="121.6" y="263" text-anchor="middle" class="sm dim">reinst.</text>
    <rect x="162.48" y="146.66" width="35.04" height="20.82" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="180" y="138.66" text-anchor="middle" class="sm">15</text>
    <text x="180" y="263" text-anchor="middle" class="sm dim">renewal</text>
    <rect x="220.88" y="130" width="35.04" height="16.66" rx="3" fill="#7c3aed" fill-opacity="0.72"/>
    <text x="238.4" y="122" text-anchor="middle" class="sm">12</text>
    <text x="238.4" y="263" text-anchor="middle" class="sm dim">lost</text>
    <rect x="279.28" y="130" width="35.04" height="118" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="296.8" y="122" text-anchor="middle" class="sm">85</text>
    <text x="296.8" y="263" text-anchor="middle" class="sm dim">total</text>
    <line x1="28" y1="248" x2="332" y2="248" class="axis"/>
    <text x="180" y="286" text-anchor="middle" class="sm dim">$M — reinstatement premium, a dearer renewal and</text>
    <text x="180" y="302" text-anchor="middle" class="sm dim">the business lost turn $50M into $85M</text>
    <line x1="30" y1="318" x2="330" y2="318" class="rule"/>
    <text x="36" y="340" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="340" text-anchor="start" class="sm">a downgrade, then dearer reinsurance and funding</text>
    <text x="36" y="362" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="362" text-anchor="start" class="sm">and the ripple most often left out: the events</text>
    <text x="36" y="384" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="384" text-anchor="start" class="sm">that damage capital also mean more is needed</text>
  </g>
</svg>
