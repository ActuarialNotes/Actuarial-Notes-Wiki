<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The transition hierarchy — full retrospective first, and the two fallbacks only where it is impracticable</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A hierarchy, not a menu</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Full retrospective, unless impracticable</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">— then modified retrospective or fair value</text>
  <rect x="38" y="100" width="284" height="62" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="125" text-anchor="middle" class="sm">Full retrospective</text>
  <text x="180" y="143" text-anchor="middle" class="sm dim">as if IFRS 17 had always applied</text>
  <text x="180" y="178" text-anchor="middle" class="sm dim">only if that is impracticable</text>
  <line x1="180" y1="186" x2="108" y2="208" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <line x1="180" y1="186" x2="252" y2="208" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <rect x="38" y="220" width="132" height="74" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="104" y="251" text-anchor="middle" class="sm">Modified</text>
  <text x="104" y="269" text-anchor="middle" class="sm dim">specified reliefs,</text>
  <text x="104" y="282" text-anchor="middle" class="sm dim">where data exist</text>
  <rect x="190" y="220" width="132" height="74" rx="7" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.2"/>
  <text x="256" y="251" text-anchor="middle" class="sm">Fair value</text>
  <text x="256" y="269" text-anchor="middle" class="sm dim">CSM = fair value</text>
  <text x="256" y="282" text-anchor="middle" class="sm dim">− fulfilment CF</text>
  <line x1="30" y1="312" x2="330" y2="312" class="rule"/>
  <text x="180" y="334" text-anchor="middle" class="sm dim">a higher CSM at transition defers more profit into</text>
  <text x="180" y="350" text-anchor="middle" class="sm dim">later years and opens equity lower</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">little of it bites in P&amp;C — the PAA has no CSM</text>
</svg>
