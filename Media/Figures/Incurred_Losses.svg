<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Each accident year's reported losses stacked as paid losses plus the case reserves still outstanding, case shrinking as the year ages</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="102.38" y1="94" x2="102.38" y2="344" class="grid"/>
    <line x1="149.69" y1="94" x2="149.69" y2="344" class="grid"/>
    <line x1="197" y1="94" x2="197" y2="344" class="grid"/>
    <line x1="244.31" y1="94" x2="244.31" y2="344" class="grid"/>
    <line x1="291.62" y1="94" x2="291.62" y2="344" class="grid"/>
    <line x1="74" y1="344" x2="320" y2="344" class="grid"/>
    <line x1="74" y1="239.83" x2="320" y2="239.83" class="grid"/>
    <line x1="74" y1="135.67" x2="320" y2="135.67" class="grid"/>
    <line x1="74" y1="344" x2="330" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="344" x2="74" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="102.38" y1="344" x2="102.38" y2="348" class="tick"/>
    <text x="102.38" y="360" text-anchor="middle" class="sm dim">2020</text>
    <line x1="149.69" y1="344" x2="149.69" y2="348" class="tick"/>
    <text x="149.69" y="360" text-anchor="middle" class="sm dim">2021</text>
    <line x1="197" y1="344" x2="197" y2="348" class="tick"/>
    <text x="197" y="360" text-anchor="middle" class="sm dim">2022</text>
    <line x1="244.31" y1="344" x2="244.31" y2="348" class="tick"/>
    <text x="244.31" y="360" text-anchor="middle" class="sm dim">2023</text>
    <line x1="291.62" y1="344" x2="291.62" y2="348" class="tick"/>
    <text x="291.62" y="360" text-anchor="middle" class="sm dim">2024</text>
    <line x1="70" y1="344" x2="74" y2="344" class="tick"/>
    <text x="66" y="347.6" text-anchor="end" class="sm dim">0</text>
    <line x1="70" y1="239.83" x2="74" y2="239.83" class="tick"/>
    <text x="66" y="243.43" text-anchor="end" class="sm dim">1,000</text>
    <line x1="70" y1="135.67" x2="74" y2="135.67" class="tick"/>
    <text x="66" y="139.27" text-anchor="end" class="sm dim">2,000</text>
    <text x="320" y="376" text-anchor="end" class="sm dim">accident year</text>
    <rect x="89.14" y="153.38" width="26.49" height="190.62" rx="2" fill="#059669" fill-opacity="0.72"/>
    <rect x="89.14" y="147.96" width="26.49" height="5.42" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="136.45" y="149.21" width="26.49" height="194.79" rx="2" fill="#059669" fill-opacity="0.72"/>
    <rect x="136.45" y="132.65" width="26.49" height="16.56" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="183.75" y="168.9" width="26.49" height="175.1" rx="2" fill="#059669" fill-opacity="0.72"/>
    <rect x="183.75" y="126.5" width="26.49" height="42.4" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="231.06" y="210.46" width="26.49" height="133.54" rx="2" fill="#059669" fill-opacity="0.72"/>
    <rect x="231.06" y="133.06" width="26.49" height="77.4" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <rect x="278.37" y="281.5" width="26.49" height="62.5" rx="2" fill="#059669" fill-opacity="0.72"/>
    <rect x="278.37" y="187.75" width="26.49" height="93.75" rx="2" fill="#d97706" fill-opacity="0.72"/>
    <text x="102.38" y="252.69" text-anchor="middle" class="sm bold">paid</text>
    <text x="291.62" y="238.62" text-anchor="middle" class="sm bold">case</text>
    <text x="197" y="118.5" text-anchor="middle" class="sm bold">reported</text>
  </g>
</svg>
