<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The share of homes that are insurable, and the high-risk tail that still is not</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Priced at last — except at the top of</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">the risk</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Overland water, not sewer backup</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">and not plumbing that let go inside</text>
    <text x="180" y="104" text-anchor="middle" class="sm dim">Canadian homes, by flood risk</text>
    <rect x="40" y="125" width="224" height="34" rx="4" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.2"/>
    <text x="152" y="146" text-anchor="middle" class="sm">insurable</text>
    <rect x="264" y="125" width="39.2" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <rect x="303.2" y="125" width="16.8" height="34" rx="4" fill="#e11d48" fill-opacity="0.30" stroke="#e11d48" stroke-width="1.2"/>
    <text x="320" y="176" text-anchor="end" class="sm" fill="#d97706">priced high</text>
    <text x="320" y="192" text-anchor="end" class="sm" fill="#e11d48">uninsurable</text>
    <line x1="30" y1="208" x2="330" y2="208" class="rule"/>
    <rect x="30" y="222" width="143" height="134" rx="7" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="30" y="222" width="143" height="24" rx="7" fill="#e11d48" fill-opacity="0.22" stroke="none"/>
    <text x="101.5" y="238" text-anchor="middle" class="sm bold" fill="#e11d48">Why it was</text>
    <text x="101.5" y="266" text-anchor="middle" class="sm">uninsurable:</text>
    <text x="101.5" y="286" text-anchor="middle" class="sm">one event hits</text>
    <text x="101.5" y="306" text-anchor="middle" class="sm">every house,</text>
    <text x="101.5" y="326" text-anchor="middle" class="sm">and the buyer</text>
    <text x="101.5" y="346" text-anchor="middle" class="sm">knows the risk</text>
    <rect x="187" y="222" width="143" height="134" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
    <rect x="187" y="222" width="143" height="24" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
    <text x="258.5" y="238" text-anchor="middle" class="sm bold" fill="#059669">What changed</text>
    <text x="258.5" y="266" text-anchor="middle" class="sm">flood mapping,</text>
    <text x="258.5" y="286" text-anchor="middle" class="sm">cat models,</text>
    <text x="258.5" y="306" text-anchor="middle" class="sm">2013 Alberta</text>
    <text x="258.5" y="326" text-anchor="middle" class="sm">and 2013</text>
    <text x="258.5" y="346" text-anchor="middle" class="sm">Toronto</text>
    <text x="180" y="366" text-anchor="middle" class="sm dim">disaster assistance after every flood is moral hazard</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">at the land-use level — it pays people to rebuild there</text>
  </g>
</svg>
