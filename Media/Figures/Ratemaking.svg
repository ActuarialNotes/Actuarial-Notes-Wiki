<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A $558 premium column standing level with the stack it has to pay for: $360 of losses and LAE, $170 of expenses and $28 of profit</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="44" y="94" width="84" height="258" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="86" y="227" text-anchor="middle" class="bold">558</text>
    <text x="86" y="372" text-anchor="middle" class="sm dim">premium</text>
    <line x1="144" y1="218" x2="164" y2="218" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="144" y1="228" x2="164" y2="228" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="180" y="185.54" width="84" height="166.46" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="222" y="272.77" text-anchor="middle" class="sm">360</text>
    <text x="274" y="272.77" text-anchor="start" class="sm">loss &amp; LAE</text>
    <rect x="180" y="106.9" width="84" height="78.64" rx="3" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <text x="222" y="150.22" text-anchor="middle" class="sm">170</text>
    <text x="274" y="150.22" text-anchor="start" class="sm">expenses</text>
    <rect x="180" y="94" width="84" height="12.9" rx="3" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.2"/>
    <text x="222" y="104.45" text-anchor="middle" class="sm">28</text>
    <text x="274" y="104.45" text-anchor="start" class="sm">profit</text>
  </g>
</svg>
