<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Solvency II drawn as a temple of three pillars — the SCR, ORSA and the SFCR — with the Canadian piece that answers to each beneath it: the MCT, ORSA and FCT, and the annual return</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <polygon points="52,136 190,88 328,136" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.4"/>
    <text x="190" y="126" text-anchor="middle" class="bold">Solvency II</text>
    <rect x="52" y="136" width="276" height="14" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.4"/>
    <rect x="72" y="150" width="56" height="168" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="100" y="240" text-anchor="middle" class="bold">SCR</text>
    <rect x="162" y="150" width="56" height="168" fill="#0d9488" fill-opacity="0.25" stroke="#0d9488" stroke-width="1.4"/>
    <text x="190" y="240" text-anchor="middle" class="bold">ORSA</text>
    <rect x="252" y="150" width="56" height="168" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.4"/>
    <text x="280" y="240" text-anchor="middle" class="bold">SFCR</text>
    <rect x="52" y="318" width="276" height="14" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.4"/>
    <text x="22" y="370" text-anchor="start" class="sm dim">Canada</text>
    <line x1="100" y1="336" x2="100" y2="352" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
    <text x="100" y="370" text-anchor="middle" class="sm bold">MCT</text>
    <line x1="190" y1="336" x2="190" y2="352" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
    <text x="190" y="370" text-anchor="middle" class="sm bold">ORSA, FCT</text>
    <line x1="280" y1="336" x2="280" y2="352" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
    <text x="280" y="370" text-anchor="middle" class="sm bold">annual return</text>
  </g>
</svg>
