<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <title>An annuity-immediate paying at the end of each period, valued at both ends</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">An annuity-immediate pays at the end of each period</text>
  <line x1="108" y1="132" x2="442" y2="132" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="116" y1="128" x2="116" y2="136" class="tick"/>
  <text x="116" y="149" text-anchor="middle" class="sm dim">0</text>
  <line x1="177.6" y1="128" x2="177.6" y2="136" class="tick"/>
  <text x="177.6" y="149" text-anchor="middle" class="sm dim">1</text>
  <line x1="239.2" y1="128" x2="239.2" y2="136" class="tick"/>
  <text x="239.2" y="149" text-anchor="middle" class="sm dim">2</text>
  <line x1="300.8" y1="128" x2="300.8" y2="136" class="tick"/>
  <text x="300.8" y="149" text-anchor="middle" class="sm dim">3</text>
  <line x1="362.4" y1="128" x2="362.4" y2="136" class="tick"/>
  <text x="362.4" y="149" text-anchor="middle" class="sm dim">4</text>
  <line x1="424" y1="128" x2="424" y2="136" class="tick"/>
  <text x="424" y="149" text-anchor="middle" class="sm dim">5</text>
  <line x1="177.6" y1="132" x2="177.6" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="177.6" y="90" text-anchor="middle" class="sm">1</text>
  <line x1="239.2" y1="132" x2="239.2" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="239.2" y="90" text-anchor="middle" class="sm">1</text>
  <line x1="300.8" y1="132" x2="300.8" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="300.8" y="90" text-anchor="middle" class="sm">1</text>
  <line x1="362.4" y1="132" x2="362.4" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="362.4" y="90" text-anchor="middle" class="sm">1</text>
  <line x1="424" y1="132" x2="424" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="424" y="90" text-anchor="middle" class="sm">1</text>
  <line x1="116" y1="66" x2="116" y2="126" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="116" y="58" text-anchor="middle" class="sm bold" fill="#d97706">a₍ₙ₎ valued here</text>
  <line x1="424" y1="66" x2="424" y2="126" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="424" y="58" text-anchor="middle" class="sm bold" fill="#059669">s₍ₙ₎ valued here</text>
  <text x="116" y="166" text-anchor="middle" class="sm dim">one period before</text>
  <text x="424" y="166" text-anchor="middle" class="sm dim">at the last payment</text>
  <line x1="28" y1="196" x2="532" y2="196" class="rule"/>
  <text x="150" y="218" text-anchor="middle" class="sm bold">a₍ₙ₎ = (1 − vⁿ)/i</text>
  <text x="150" y="238" text-anchor="middle" class="sm dim">s₍ₙ₎ = ((1+i)ⁿ − 1)/i</text>
  <text x="150" y="258" text-anchor="middle" class="sm dim">s₍ₙ₎ = (1+i)ⁿ · a₍ₙ₎</text>
  <text x="412" y="218" text-anchor="middle" class="sm bold">At i = 6%, n = 5</text>
  <text x="412" y="238" text-anchor="middle" class="sm dim">a₍₅₎ = 4.2124,  s₍₅₎ = 5.6371</text>
  <text x="412" y="258" text-anchor="middle" class="sm dim">1,200 per year → PV ≈ 5,054.87</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">The building block for loan amortisation and bond pricing</text>
</svg>
