<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Variances of competing unbiased estimators, with the smallest marked</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The unbiased estimator with least spread</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Var(θ̂*) ≤ Var(θ̂) for all unbiased θ̂</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">UMVUE — uniformly minimum variance</text>
  <line x1="72" y1="344" x2="336" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="344" x2="72" y2="108" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="344" x2="72" y2="344" class="tick"/>
  <text x="64" y="347.6" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="251.76" x2="72" y2="251.76" class="tick"/>
  <text x="64" y="255.36" text-anchor="end" class="sm dim">2</text>
  <line x1="68" y1="159.51" x2="72" y2="159.51" class="tick"/>
  <text x="64" y="163.11" text-anchor="end" class="sm dim">4</text>
  <text x="68" y="104" text-anchor="start" class="sm dim">n · Var(θ̂) / σ²</text>
  <rect x="91.41" y="297.88" width="42" height="46.12" rx="1.5" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="149.14" y="271.59" width="42" height="72.41" rx="1.5" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="206.86" y="237.92" width="42" height="106.08" rx="1.5" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="264.59" y="159.51" width="42" height="184.49" rx="1.5" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="91.41" y="297.88" width="42" height="46.12" rx="1.5" fill="#059669" fill-opacity="0.7"/>
  <text x="112.41" y="362" text-anchor="middle" class="sm">X̄</text>
  <text x="112.41" y="289.88" text-anchor="middle" class="sm">1.00</text>
  <rect x="149.14" y="271.59" width="42" height="72.41" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <text x="170.14" y="362" text-anchor="middle" class="sm">median</text>
  <text x="170.14" y="263.59" text-anchor="middle" class="sm">1.57</text>
  <rect x="206.86" y="237.92" width="42" height="106.08" rx="1.5" fill="#d97706" fill-opacity="0.7"/>
  <text x="227.86" y="362" text-anchor="middle" class="sm">midrange</text>
  <text x="227.86" y="229.92" text-anchor="middle" class="sm">2.30</text>
  <rect x="264.59" y="159.51" width="42" height="184.49" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <text x="285.59" y="362" text-anchor="middle" class="sm">X₁</text>
  <text x="285.59" y="151.51" text-anchor="middle" class="sm">4.00</text>
  <line x1="72" y1="297.88" x2="320.23" y2="297.88" class="thin dash" stroke="#059669" stroke-width="1.3"/>
</svg>
