<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A large circle of what is alleged, where the insurer's shield defends, holding a smaller circle of what is proven, where it pays to indemnify</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <circle cx="180" cy="229" r="150" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="180" cy="290" r="80" fill="#d97706" fill-opacity="0.20" stroke="#d97706" stroke-width="1.6"/>
    <text x="180" y="108" text-anchor="middle" class="bold">alleged</text>
    <path d="M180,129 L196.8,134.88 V149.16 Q196.8,164.28 180,171 Q163.2,164.28 163.2,149.16 V134.88 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="180" y="192" text-anchor="middle" class="sm bold">defend</text>
    <text x="180" y="244" text-anchor="middle" class="bold">proven</text>
    <rect x="162" y="298" width="36" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="180" cy="304" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="298" rx="18" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="298" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <rect x="162" y="292" width="36" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="180" cy="298" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="292" rx="18" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="292" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <rect x="162" y="286" width="36" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="180" cy="292" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="286" rx="18" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="286" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <rect x="162" y="280" width="36" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="180" cy="286" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="280" rx="18" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="180" cy="280" rx="18" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <text x="180" y="330" text-anchor="middle" class="sm bold">indemnify</text>
  </g>
</svg>
