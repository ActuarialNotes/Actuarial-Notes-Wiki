<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The Ontario file-and-approve auto rate cycle, from filing to implementation</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Ontario auto rates are used only once</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">approved</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">File → review → approve → use</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the level and the classification plan</text>
  <rect x="36" y="103" width="63" height="26" rx="13.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="67.5" y="120" text-anchor="middle" class="sm">file</text>
  <rect x="111" y="103" width="63" height="26" rx="13.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="142.5" y="120" text-anchor="middle" class="sm">review</text>
  <line x1="100" y1="116" x2="110" y2="116" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="186" y="103" width="63" height="26" rx="13.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="217.5" y="120" text-anchor="middle" class="sm">approve</text>
  <line x1="175" y1="116" x2="185" y2="116" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="261" y="103" width="63" height="26" rx="13.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
  <text x="292.5" y="120" text-anchor="middle" class="sm">use</text>
  <line x1="250" y1="116" x2="260" y2="116" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <text x="180" y="152" text-anchor="middle" class="sm dim">and the review takes months, so the rate</text>
  <text x="180" y="168" text-anchor="middle" class="sm dim">in force always trails the cost that justified it</text>
  <text x="44" y="208" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="60" y="208" text-anchor="start" class="sm">created 2019, replacing FSCO</text>
  <text x="44" y="234" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="60" y="234" text-anchor="start" class="sm">self-funded by industry assessment</text>
  <text x="44" y="260" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="60" y="260" text-anchor="start" class="sm">principles-based, outcome-focused</text>
  <text x="44" y="286" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="60" y="286" text-anchor="start" class="sm">runs the Minor Injury Guideline</text>
  <text x="44" y="312" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="60" y="312" text-anchor="start" class="sm">publishes what support a filing needs</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">solvency is still OSFI's — FSRA does not do capital</text>
</svg>
