  <circle cx="89.77" cy="259" r="2.8" fill="#3b82f6"/>
  <circle cx="95.19" cy="245.81" r="2.8" fill="#3b82f6"/>
  <circle cx="100.61" cy="243.43" r="2.8" fill="#3b82f6"/>
