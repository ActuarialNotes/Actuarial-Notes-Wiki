<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>AY 2024's four ultimates in a column, the iteration stepping from expected loss through BF to Benktander and on toward the chain ladder</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="124" y1="94" x2="124" y2="344" class="grid"/>
    <line x1="184" y1="94" x2="184" y2="344" class="grid"/>
    <line x1="244" y1="94" x2="244" y2="344" class="grid"/>
    <line x1="304" y1="94" x2="304" y2="344" class="grid"/>
    <line x1="64" y1="344" x2="326" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="344" x2="64" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="124" y1="344" x2="124" y2="348" class="tick"/>
    <text x="124" y="360" text-anchor="middle" class="sm dim">2,600</text>
    <line x1="184" y1="344" x2="184" y2="348" class="tick"/>
    <text x="184" y="360" text-anchor="middle" class="sm dim">2,700</text>
    <line x1="244" y1="344" x2="244" y2="348" class="tick"/>
    <text x="244" y="360" text-anchor="middle" class="sm dim">2,800</text>
    <line x1="304" y1="344" x2="304" y2="348" class="tick"/>
    <text x="304" y="360" text-anchor="middle" class="sm dim">2,900</text>
    <text x="316" y="376" text-anchor="end" class="sm dim">AY 2024 ultimate</text>
    <circle cx="124" cy="139.45" r="5" fill="#7c3aed"/>
    <line x1="64" y1="139.45" x2="124" y2="139.45" class="thin" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="133" y="143.45" text-anchor="start" class="sm bold" fill="#7c3aed">2,600</text>
    <text x="68" y="130.45" text-anchor="start" class="sm dim">expected loss</text>
    <circle cx="202.99" cy="193.43" r="5" fill="#0d9488"/>
    <line x1="64" y1="193.43" x2="202.99" y2="193.43" class="thin" stroke="#0d9488" stroke-width="1.4"/>
    <text x="211.99" y="197.43" text-anchor="start" class="sm bold" fill="#0d9488">2,732</text>
    <text x="68" y="184.43" text-anchor="start" class="sm dim">BF</text>
    <circle cx="240.41" cy="247.41" r="5" fill="#059669"/>
    <line x1="64" y1="247.41" x2="240.41" y2="247.41" class="thin" stroke="#059669" stroke-width="1.4"/>
    <text x="249.41" y="251.41" text-anchor="start" class="sm bold" fill="#059669">2,794</text>
    <text x="68" y="238.41" text-anchor="start" class="sm dim">Benktander</text>
    <circle cx="274.09" cy="301.39" r="5" fill="#3b82f6"/>
    <line x1="64" y1="301.39" x2="274.09" y2="301.39" class="thin" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="283.09" y="305.39" text-anchor="start" class="sm bold" fill="#3b82f6">2,850</text>
    <text x="68" y="292.39" text-anchor="start" class="sm dim">chain ladder</text>
    <line x1="127" y1="147.45" x2="199.99" y2="185.43" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <line x1="205.99" y1="201.43" x2="237.41" y2="239.41" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <line x1="243.41" y1="255.41" x2="271.09" y2="293.39" class="thin dash" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  </g>
</svg>
