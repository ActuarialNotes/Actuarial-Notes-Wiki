<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The classical ULAE reserve: half of the 900 of case reserves and all of the 1,350 of IBNR, charged at the 6.0% paid ratio, give a 108 reserve</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="40" y="176" width="70" height="180" rx="3" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="40" y="266" width="70" height="90" rx="3" fill="#d97706" fill-opacity="0.55" stroke="#d97706" stroke-width="1.2"/>
    <text x="75" y="315" text-anchor="middle" class="sm bold">× 0.5</text>
    <text x="75" y="374" text-anchor="middle" class="sm">case 900</text>
    <rect x="130" y="86" width="70" height="270" rx="3" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="130" y="86" width="70" height="270" rx="3" fill="#7c3aed" fill-opacity="0.55" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="165" y="225" text-anchor="middle" class="sm bold">× 1.0</text>
    <text x="165" y="374" text-anchor="middle" class="sm">IBNR 1,350</text>
    <rect x="262" y="334.4" width="50" height="21.6" rx="3" fill="#059669" fill-opacity="0.6" stroke="#059669" stroke-width="1.2"/>
    <text x="287" y="374" text-anchor="middle" class="sm bold">ULAE 108</text>
    <line x1="206" y1="345.2" x2="256" y2="345.2" class="thin" stroke="var(--dim)" stroke-width="1.6" marker-end="url(#ahvardim)"/>
    <text x="231" y="335.2" text-anchor="middle" class="sm bold">× 6.0%</text>
  </g>
</svg>
