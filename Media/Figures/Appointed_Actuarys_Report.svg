<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The Appointed Actuary handing a report to another actuary, whose redone result stands the same height as the original — the report is detailed enough to reproduce</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah0d9488" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#0d9488"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <circle cx="64" cy="114.6" r="10.44" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M45.44,161 V138.96 Q45.44,129.68 55.88,129.68 H72.12 Q82.56,129.68 82.56,138.96 V161 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="64" y="180" text-anchor="middle" class="bold">AA</text>
    <polygon points="152.64,94 192.16,94 207.36,109.2 207.36,170 152.64,170" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M192.16,94 V109.2 H207.36" fill="none" stroke="#d97706" stroke-width="1.2"/>
    <line x1="163.28" y1="124.4" x2="195.2" y2="124.4" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="163.28" y1="137.32" x2="195.2" y2="137.32" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="163.28" y1="150.24" x2="184.56" y2="150.24" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
    <text x="180" y="190" text-anchor="middle" class="bold">report</text>
    <circle cx="296" cy="114.6" r="10.44" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M277.44,161 V138.96 Q277.44,129.68 287.88,129.68 H304.12 Q314.56,129.68 314.56,138.96 V161 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="296" y="180" text-anchor="middle" class="sm bold">another actuary</text>
    <line x1="92" y1="132" x2="146" y2="132" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="214" y1="132" x2="268" y2="132" class="thin" stroke="#0d9488" stroke-width="2" marker-end="url(#ah0d9488)"/>
    <rect x="42" y="244" width="44" height="108" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="274" y="244" width="44" height="108" rx="3" fill="#0d9488" fill-opacity="0.6"/>
    <line x1="86" y1="244" x2="274" y2="244" class="thin dot" stroke="var(--dim)"/>
    <text x="180" y="302" text-anchor="middle" class="bold" style="font-size:30px">=</text>
    <line x1="24" y1="352" x2="336" y2="352" class="axis"/>
    <text x="180" y="372" text-anchor="middle" class="sm dim">same result</text>
  </g>
</svg>
