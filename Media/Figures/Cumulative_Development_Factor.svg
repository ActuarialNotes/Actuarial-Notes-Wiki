<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The cumulative factor at each age drawn as a bar, each one the bar below it times one link ratio, climbing from 1.000 at ultimate to 1.900 at 12 months</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="70" y="87" width="171.01" height="26" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="62" y="104" text-anchor="end" class="sm dim">12</text>
    <rect x="70" y="137" width="114.01" height="26" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="62" y="154" text-anchor="end" class="sm dim">24</text>
    <rect x="70" y="187" width="98.28" height="26" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="62" y="204" text-anchor="end" class="sm dim">36</text>
    <rect x="70" y="237" width="92.72" height="26" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="62" y="254" text-anchor="end" class="sm dim">48</text>
    <rect x="70" y="287" width="90.9" height="26" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="62" y="304" text-anchor="end" class="sm dim">60</text>
    <rect x="70" y="337" width="90" height="26" rx="3" fill="#d97706" fill-opacity="0.3" stroke="#d97706" stroke-width="1.2"/>
    <text x="62" y="354" text-anchor="end" class="sm dim">ult</text>
    <text x="235.01" y="104" text-anchor="end" class="sm bold">1.900</text>
    <line x1="188.01" y1="137" x2="245.01" y2="113" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="259.01" y="129" text-anchor="start" class="sm">× 1.500</text>
    <line x1="172.28" y1="187" x2="188.01" y2="163" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="202.01" y="179" text-anchor="start" class="sm">× 1.160</text>
    <line x1="166.72" y1="237" x2="172.28" y2="213" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="186.28" y="229" text-anchor="start" class="sm">× 1.060</text>
    <line x1="164.9" y1="287" x2="166.72" y2="263" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="180.72" y="279" text-anchor="start" class="sm">× 1.020</text>
    <line x1="164" y1="337" x2="164.9" y2="313" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="178.9" y="329" text-anchor="start" class="sm">× 1.010</text>
  </g>
</svg>
