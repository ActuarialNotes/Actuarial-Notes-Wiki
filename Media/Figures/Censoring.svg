<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Policies observed to a limit, with the true values beyond it unknown</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Known to exceed the limit, size unknown</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">contribute S(u) to the likelihood</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">not the density f(x)</text>
  <line x1="60" y1="323.77" x2="336" y2="323.77" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="344" x2="60" y2="98" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="323.77" x2="60" y2="327.77" class="tick"/>
  <text x="60" y="339.77" text-anchor="middle" class="sm dim">0</text>
  <line x1="113.2" y1="323.77" x2="113.2" y2="327.77" class="tick"/>
  <text x="113.2" y="339.77" text-anchor="middle" class="sm dim">2</text>
  <line x1="166.4" y1="323.77" x2="166.4" y2="327.77" class="tick"/>
  <text x="166.4" y="339.77" text-anchor="middle" class="sm dim">4</text>
  <line x1="219.6" y1="323.77" x2="219.6" y2="327.77" class="tick"/>
  <text x="219.6" y="339.77" text-anchor="middle" class="sm dim">6</text>
  <line x1="272.8" y1="323.77" x2="272.8" y2="327.77" class="tick"/>
  <text x="272.8" y="339.77" text-anchor="middle" class="sm dim">8</text>
  <line x1="326" y1="323.77" x2="326" y2="327.77" class="tick"/>
  <text x="326" y="339.77" text-anchor="middle" class="sm dim">10</text>
  <text x="326" y="355.77" text-anchor="end" class="sm dim">claim size (000s)</text>
  <line x1="219.6" y1="344" x2="219.6" y2="114.74" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
  <text x="219.6" y="108.74" text-anchor="middle" class="sm">policy limit u</text>
  <polyline points="60,134.97 150.44,134.97" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="150.44" cy="134.97" r="3.6" fill="#3b82f6"/>
  <polyline points="60,167 195.66,167" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="195.66" cy="167" r="3.6" fill="#3b82f6"/>
  <polyline points="60,199.03 219.6,199.03" class="curve" stroke="#e11d48" stroke-width="2"/>
  <circle cx="219.6" cy="199.03" r="3.6" fill="#e11d48"/>
  <text x="241.6" y="203.03" text-anchor="middle" class="sm" fill="#e11d48">→ ?</text>
  <polyline points="60,231.06 118.52,231.06" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="118.52" cy="231.06" r="3.6" fill="#3b82f6"/>
  <polyline points="60,263.09 219.6,263.09" class="curve" stroke="#e11d48" stroke-width="2"/>
  <circle cx="219.6" cy="263.09" r="3.6" fill="#e11d48"/>
  <text x="241.6" y="267.09" text-anchor="middle" class="sm" fill="#e11d48">→ ?</text>
  <polyline points="60,295.11 177.04,295.11" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="177.04" cy="295.11" r="3.6" fill="#3b82f6"/>
  <text x="180" y="92" text-anchor="middle" class="sm dim">two claims hit the limit</text>
</svg>
