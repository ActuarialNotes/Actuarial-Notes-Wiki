<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>OSFI above a staircase of five intervention stages, from stage 0, normal supervision, up to stage 4, non-viability</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="40" y="334" width="56" height="40" rx="4" fill="#059669" fill-opacity="0.22" stroke="#059669" stroke-width="1.3"/>
    <text x="68" y="358" text-anchor="middle" class="bold">0</text>
    <rect x="96" y="288" width="56" height="86" rx="4" fill="#0d9488" fill-opacity="0.22" stroke="#0d9488" stroke-width="1.3"/>
    <text x="124" y="312" text-anchor="middle" class="bold">1</text>
    <rect x="152" y="242" width="56" height="132" rx="4" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.3"/>
    <text x="180" y="266" text-anchor="middle" class="bold">2</text>
    <rect x="208" y="196" width="56" height="178" rx="4" fill="#e11d48" fill-opacity="0.22" stroke="#e11d48" stroke-width="1.3"/>
    <text x="236" y="220" text-anchor="middle" class="bold">3</text>
    <rect x="264" y="150" width="56" height="224" rx="4" fill="#7c3aed" fill-opacity="0.22" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="292" y="174" text-anchor="middle" class="bold">4</text>
    <text x="68" y="324" text-anchor="middle" class="sm">normal</text>
    <text x="292" y="140" text-anchor="middle" class="sm">non-viable</text>
    <polygon points="60,119.2 92,100 124,119.2" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="65.76" y="123.04" width="6.4" height="29.44" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="81.12" y="123.04" width="6.4" height="29.44" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="96.48" y="123.04" width="6.4" height="29.44" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="111.84" y="123.04" width="6.4" height="29.44" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="60" y="155.04" width="64" height="8.96" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="92" y="184" text-anchor="middle" class="bold">OSFI</text>
  </g>
</svg>
