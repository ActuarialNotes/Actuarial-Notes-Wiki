  <text x="72" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="102.48" y1="350" x2="102.48" y2="354" class="tick"/>
  <text x="102.48" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="183.76" y1="350" x2="183.76" y2="354" class="tick"/>
  <text x="183.76" y="366" text-anchor="middle" class="sm dim">12</text>
  <line x1="305.68" y1="350" x2="305.68" y2="354" class="tick"/>
  <text x="305.68" y="366" text-anchor="middle" class="sm dim">24</text>
  <line x1="68" y1="318.25" x2="72" y2="318.25" class="tick"/>
  <text x="64" y="321.85" text-anchor="end" class="sm dim">7.7%</text>
  <line x1="68" y1="191.25" x2="72" y2="191.25" class="tick"/>
  <text x="64" y="194.85" text-anchor="end" class="sm dim">7.9%</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">compounding frequency m</text>
  <text x="68" y="82" text-anchor="start" class="sm dim">i⁽ᵐ⁾</text>
</svg>
