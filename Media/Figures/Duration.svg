<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Duration as the balance point of the discounted cash flows</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Duration is the balance point of the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">present values</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">D_Mac = Σ t · PV(C_t) / P</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">measured in periods, not percent</text>
  <rect x="89.63" y="301.03" width="15.4" height="14.97" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="112.97" y="301.75" width="15.4" height="14.25" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="136.3" y="302.43" width="15.4" height="13.57" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="159.63" y="303.07" width="15.4" height="12.93" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="182.97" y="303.69" width="15.4" height="12.31" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="206.3" y="304.27" width="15.4" height="11.73" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="229.63" y="304.83" width="15.4" height="11.17" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="252.97" y="305.36" width="15.4" height="10.64" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="276.3" y="305.87" width="15.4" height="10.13" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="299.63" y="113.41" width="15.4" height="202.59" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <line x1="74" y1="316" x2="336" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="316" x2="74" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="97.33" y1="316" x2="97.33" y2="320" class="tick"/>
  <text x="97.33" y="332" text-anchor="middle" class="sm dim">1</text>
  <line x1="120.67" y1="316" x2="120.67" y2="320" class="tick"/>
  <text x="120.67" y="332" text-anchor="middle" class="sm dim">2</text>
