<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Four methods' ultimates for one accident year and the figure selected from them</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The number every method is trying to</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">estimate</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">U = Paid + Case Reserves + IBNR</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">U = Reported + IBNR</text>
  <text x="180" y="112" text-anchor="middle" class="sm dim">AY 2024 at 12 months ($000)</text>
  <text x="168" y="150" text-anchor="end" class="sm">Expected loss</text>
  <rect x="176" y="136" width="22.5" height="22" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <text x="205.5" y="150" text-anchor="start" class="sm">2,600</text>
  <text x="168" y="188" text-anchor="end" class="sm">Bornhuetter-Ferguson</text>
  <rect x="176" y="174" width="81.74" height="22" rx="3" fill="#0d9488" fill-opacity="0.6"/>
  <text x="264.74" y="188" text-anchor="start" class="sm">2,732</text>
  <text x="168" y="226" text-anchor="end" class="sm">Benktander</text>
  <rect x="176" y="212" width="109.81" height="22" rx="3" fill="#059669" fill-opacity="0.6"/>
  <text x="292.81" y="226" text-anchor="start" class="sm">2,794</text>
  <text x="168" y="264" text-anchor="end" class="sm">Chain ladder</text>
  <rect x="176" y="250" width="135.07" height="22" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="318.07" y="264" text-anchor="start" class="sm">2,850</text>
  <text x="168" y="302" text-anchor="end" class="sm bold">Selected</text>
  <rect x="176" y="288" width="103.5" height="22" rx="3" fill="#d97706" fill-opacity="0.8"/>
  <text x="286.5" y="302" text-anchor="start" class="sm bold">2,780</text>
  <line x1="176" y1="128" x2="176" y2="330" class="rule"/>
  <text x="176" y="346" text-anchor="middle" class="sm dim">2,550</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">the selection is a judgment about which method</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the data supports — and it has to be documented</text>
</svg>
