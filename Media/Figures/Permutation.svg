<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The twelve ordered pairs drawn from four objects</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Order matters: P(4, 2) = 12</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">P(n, k) = n! / (n − k)!</text>
  <rect x="46" y="99" width="60" height="34" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="76" y="121" text-anchor="middle">AB</text>
  <rect x="118" y="99" width="60" height="34" rx="7" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="148" y="121" text-anchor="middle">BA</text>
  <rect x="190" y="99" width="60" height="34" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="220" y="121" text-anchor="middle">AC</text>
  <rect x="262" y="99" width="60" height="34" rx="7" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="292" y="121" text-anchor="middle">CA</text>
  <rect x="46" y="165" width="60" height="34" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="76" y="187" text-anchor="middle">AD</text>
  <rect x="118" y="165" width="60" height="34" rx="7" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="148" y="187" text-anchor="middle">DA</text>
  <rect x="190" y="165" width="60" height="34" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="220" y="187" text-anchor="middle">BC</text>
  <rect x="262" y="165" width="60" height="34" rx="7" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="292" y="187" text-anchor="middle">CB</text>
  <rect x="46" y="231" width="60" height="34" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="76" y="253" text-anchor="middle">BD</text>
  <rect x="118" y="231" width="60" height="34" rx="7" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="148" y="253" text-anchor="middle">DB</text>
  <rect x="190" y="231" width="60" height="34" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="220" y="253" text-anchor="middle">CD</text>
  <rect x="262" y="231" width="60" height="34" rx="7" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="292" y="253" text-anchor="middle">DC</text>
  <text x="180" y="332" text-anchor="middle" class="sm dim">AB ≠ BA — each pair counted twice</text>
</svg>
