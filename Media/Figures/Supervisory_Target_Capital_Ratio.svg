<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A capital-ratio thermometer banded red below the 100% minimum, amber from there to the 150% supervisory target and green above it — with the running insurer at 104.6%, low in the amber band</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="92" y="88" width="64" height="288" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <rect x="92" y="293.71" width="64" height="82.29" fill="#e11d48" fill-opacity="0.3"/>
    <rect x="92" y="190.86" width="64" height="102.86" fill="#d97706" fill-opacity="0.3"/>
    <rect x="92" y="88" width="64" height="102.86" fill="#059669" fill-opacity="0.3"/>
    <line x1="84" y1="293.71" x2="164" y2="293.71" class="thin" stroke="#e11d48" stroke-width="1.8"/>
    <text x="172" y="297.71" text-anchor="start" class="sm bold">100% minimum</text>
    <line x1="84" y1="190.86" x2="164" y2="190.86" class="thin" stroke="#d97706" stroke-width="1.8"/>
    <text x="172" y="194.86" text-anchor="start" class="sm bold">150% target</text>
    <text x="172" y="246.29" text-anchor="start" class="sm dim">room to act</text>
    <text x="172" y="137.26" text-anchor="start" class="sm dim">operate here</text>
    <polygon points="90,284.17 80,278.17 80,290.17" fill="#3b82f6"/>
    <rect x="46.48" y="267.17" width="19.04" height="34" rx="2" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="50.22" y="271.25" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="57.7" y="271.25" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="50.22" y="278.05" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="57.7" y="278.05" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="50.22" y="284.85" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="57.7" y="284.85" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="50.22" y="291.65" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="57.7" y="291.65" width="4.08" height="3.4" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="56" y="316.17" text-anchor="middle" class="sm bold">104.6%</text>
  </g>
</svg>
