<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>What a peer review adds, and the one thing it cannot move</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Independent challenge — and the opinion</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">stays yours</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">A reviewer's concurrence is not a defence</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">for an opinion that was wrong</text>
    <text x="180" y="102" text-anchor="middle" class="sm dim">how deep the review goes</text>
    <text x="40" y="124" text-anchor="start" class="sm">full re-performance</text>
    <rect x="40" y="130" width="246" height="16" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="40" y="166" text-anchor="start" class="sm">methods and assumptions</text>
    <rect x="40" y="172" width="176" height="16" rx="3" fill="#0d9488" fill-opacity="0.55"/>
    <text x="40" y="208" text-anchor="start" class="sm">targeted — one line, one issue</text>
    <rect x="40" y="214" width="106" height="16" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <line x1="30" y1="258" x2="330" y2="258" class="rule"/>
    <text x="36" y="280" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="52" y="280" text-anchor="start" class="sm">independence is the whole value — a reviewer</text>
    <text x="36" y="304" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="52" y="304" text-anchor="start" class="sm">reporting to the same management adds little</text>
    <text x="36" y="328" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="52" y="328" text-anchor="start" class="sm">OSFI may require one after adverse development</text>
    <text x="36" y="352" text-anchor="start" class="sm" fill="#e11d48">•</text>
    <text x="52" y="352" text-anchor="start" class="sm">and the findings have to be recorded and actioned</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">an unaddressed finding is worse than no review</text>
  </g>
</svg>
