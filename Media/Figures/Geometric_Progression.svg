<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img">
  <title>A geometric payment stream and the shifted rate that values it</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="288.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A geometric stream is a level annuity at a shifted rate</text>
  <rect x="78.86" y="119.5" width="14.64" height="82.5" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="101.04" y="117.03" width="14.64" height="84.97" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="123.23" y="114.48" width="14.64" height="87.52" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="145.41" y="111.85" width="14.64" height="90.15" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="167.59" y="109.15" width="14.64" height="92.85" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="189.77" y="106.36" width="14.64" height="95.64" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="211.95" y="103.49" width="14.64" height="98.51" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="234.13" y="100.54" width="14.64" height="101.46" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="256.32" y="97.49" width="14.64" height="104.51" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="278.5" y="94.36" width="14.64" height="107.64" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="78.86" y="125.61" width="14.64" height="76.39" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="101.04" y="129.15" width="14.64" height="72.85" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="123.23" y="132.52" width="14.64" height="69.48" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="145.41" y="135.74" width="14.64" height="66.26" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="167.59" y="138.8" width="14.64" height="63.2" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="189.77" y="141.73" width="14.64" height="60.27" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="211.95" y="144.52" width="14.64" height="57.48" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="234.13" y="147.18" width="14.64" height="54.82" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="256.32" y="149.72" width="14.64" height="52.28" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="278.5" y="152.14" width="14.64" height="49.86" rx="1.5" fill="#3b82f6" fill-opacity="0.85"/>
  <line x1="64" y1="202" x2="318" y2="202" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="202" x2="64" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="86.18" y1="202" x2="86.18" y2="206" class="tick"/>
  <text x="86.18" y="218" text-anchor="middle" class="sm dim">1</text>
  <line x1="174.91" y1="202" x2="174.91" y2="206" class="tick"/>
  <text x="174.91" y="218" text-anchor="middle" class="sm dim">5</text>
  <line x1="285.82" y1="202" x2="285.82" y2="206" class="tick"/>
  <text x="285.82" y="218" text-anchor="middle" class="sm dim">10</text>
  <line x1="60" y1="160.75" x2="64" y2="160.75" class="tick"/>
  <text x="56" y="164.35" text-anchor="end" class="sm dim">0.5</text>
  <line x1="60" y1="119.5" x2="64" y2="119.5" class="tick"/>
  <text x="56" y="123.1" text-anchor="end" class="sm dim">1</text>
  <line x1="60" y1="78.25" x2="64" y2="78.25" class="tick"/>
  <text x="56" y="81.85" text-anchor="end" class="sm dim">1.5</text>
  <text x="308" y="234" text-anchor="end" class="sm dim">payment number</text>
  <text x="60" y="56" text-anchor="start" class="sm dim">amount</text>
  <line x1="72" y1="80" x2="85" y2="80" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="91" y="83.6" text-anchor="start" class="sm">payment (1+g)^(k−1)</text>
  <line x1="72" y1="96" x2="85" y2="96" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="91" y="99.6" text-anchor="start" class="sm">its present value</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">PV = [1 − ((1+g)/(1+i))ⁿ] / (i − g)</text>
  <rect x="338" y="120" width="190" height="62" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="433" y="142" text-anchor="middle" class="sm bold">The shifted rate</text>
  <text x="433" y="162" text-anchor="middle" class="sm dim">j = (1+i)/(1+g) − 1</text>
  <rect x="338" y="190" width="190" height="62" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="433" y="212" text-anchor="middle" class="sm bold">Then PV = a₍ₙ₎ⱼ / (1 + g)</text>
  <text x="433" y="232" text-anchor="middle" class="sm dim">an ordinary annuity at rate j</text>
  <text x="280" y="278" text-anchor="middle" class="sm dim">Growth and discount both compound — subtract them in ratio, not in level</text>
</svg>
