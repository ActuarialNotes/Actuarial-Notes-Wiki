  <line x1="76" y1="152.8" x2="322" y2="152.8" class="thin" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="76" y1="152.8" x2="332" y2="152.8" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="208" x2="76" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="117" y1="152.8" x2="117" y2="156.8" class="tick"/>
  <text x="117" y="168.8" text-anchor="middle" class="sm dim">-2%</text>
  <line x1="281" y1="152.8" x2="281" y2="156.8" class="tick"/>
  <text x="281" y="168.8" text-anchor="middle" class="sm dim">+2%</text>
  <line x1="72" y1="194.2" x2="76" y2="194.2" class="tick"/>
  <text x="68" y="197.8" text-anchor="end" class="sm dim">-15</text>
  <line x1="72" y1="152.8" x2="76" y2="152.8" class="tick"/>
  <text x="68" y="156.4" text-anchor="end" class="sm dim">0</text>
  <line x1="72" y1="111.4" x2="76" y2="111.4" class="tick"/>
  <text x="68" y="115" text-anchor="end" class="sm dim">15</text>
  <text x="72" y="56" text-anchor="start" class="sm dim">surplus  S = V_A − V_L</text>
  <text x="322" y="228" text-anchor="end" class="sm dim">shift in yield  Δj</text>
  <text x="297.4" y="86.56" text-anchor="middle" class="sm bold">immunized</text>
  <text x="289.2" y="188.68" text-anchor="middle" class="sm bold">not immunized</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">Redington's three conditions</text>
  <line x1="342" y1="124" x2="342" y2="158" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="137" text-anchor="start" class="sm bold">1.  PV(A) = PV(L)</text>
  <text x="352" y="153" text-anchor="start" class="sm dim">the surplus starts at zero</text>
  <line x1="342" y1="172" x2="342" y2="206" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="185" text-anchor="start" class="sm bold">2.  D(A) = D(L)</text>
  <text x="352" y="201" text-anchor="start" class="sm dim">the first-order effect cancels</text>
  <line x1="342" y1="220" x2="342" y2="254" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="233" text-anchor="start" class="sm bold">3.  C(A) &gt; C(L)</text>
  <text x="352" y="249" text-anchor="start" class="sm dim">the second-order effect is positive</text>
  <text x="280" y="296" text-anchor="middle" class="sm dim">ΔS ≈ ½ (C_A − C_L) · V · (Δj)² ≥ 0 — small, parallel shifts only</text>
</svg>
