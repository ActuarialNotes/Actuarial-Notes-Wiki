<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The projected ratio of 74.0 — 69.2 of loss and LAE plus 4.8 of fixed expense — standing taller than the 69.0 permissible column, a gap of +7.3%</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="55" y="116.62" width="90" height="235.38" rx="2" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="55" y="100.27" width="90" height="16.35" rx="2" fill="#0d9488" fill-opacity="0.34" stroke="#0d9488" stroke-width="1.2"/>
    <text x="100" y="370" text-anchor="middle" class="sm dim">projected</text>
    <rect x="195" y="117.4" width="90" height="234.6" rx="2" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.2"/>
    <text x="240" y="370" text-anchor="middle" class="sm dim">permissible</text>
    <text x="100" y="238.31" text-anchor="middle" class="sm">69.2</text>
    <text x="100" y="112.44" text-anchor="middle" class="sm">4.8</text>
    <text x="240" y="238.7" text-anchor="middle" class="sm">69.0</text>
    <text x="100" y="90.27" text-anchor="middle" class="bold">74.0</text>
    <line x1="145" y1="100.27" x2="195" y2="100.27" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="195" y="100.27" width="90" height="17.13" rx="2" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="293" y="112.83" text-anchor="start" class="bold">+7.3%</text>
  </g>
</svg>
