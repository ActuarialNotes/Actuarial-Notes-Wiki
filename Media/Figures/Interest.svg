    <rect x="298.48" y="309.6" width="18.75" height="2.99" rx="2" fill="#d97706" fill-opacity="0.85"/>
    <line x1="78" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="78" y1="350" x2="78" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="96.15" y1="350" x2="96.15" y2="354" class="tick"/>
    <text x="96.15" y="366" text-anchor="middle" class="sm dim">1</text>
    <line x1="126.39" y1="350" x2="126.39" y2="354" class="tick"/>
    <text x="126.39" y="366" text-anchor="middle" class="sm dim">2</text>
    <line x1="156.63" y1="350" x2="156.63" y2="354" class="tick"/>
    <text x="156.63" y="366" text-anchor="middle" class="sm dim">3</text>
    <line x1="186.88" y1="350" x2="186.88" y2="354" class="tick"/>
    <text x="186.88" y="366" text-anchor="middle" class="sm dim">4</text>
    <line x1="217.12" y1="350" x2="217.12" y2="354" class="tick"/>
    <text x="217.12" y="366" text-anchor="middle" class="sm dim">5</text>
    <line x1="247.37" y1="350" x2="247.37" y2="354" class="tick"/>
    <text x="247.37" y="366" text-anchor="middle" class="sm dim">6</text>
