<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The distribution of claim counts per policy at 0.25 claims per exposure-year, most of them zero</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="44" y1="344" x2="336" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="44" y1="344" x2="44" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="76.54" y1="344" x2="76.54" y2="348" class="tick"/>
    <text x="76.54" y="360" text-anchor="middle" class="sm dim">0</text>
    <line x1="130.77" y1="344" x2="130.77" y2="348" class="tick"/>
    <text x="130.77" y="360" text-anchor="middle" class="sm dim">1</text>
    <line x1="185" y1="344" x2="185" y2="348" class="tick"/>
    <text x="185" y="360" text-anchor="middle" class="sm dim">2</text>
    <line x1="239.23" y1="344" x2="239.23" y2="348" class="tick"/>
    <text x="239.23" y="360" text-anchor="middle" class="sm dim">3</text>
    <line x1="293.46" y1="344" x2="293.46" y2="348" class="tick"/>
    <text x="293.46" y="360" text-anchor="middle" class="sm dim">4</text>
    <text x="326" y="376" text-anchor="end" class="sm dim">claims</text>
    <rect x="58.54" y="129.4" width="36" height="214.6" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="112.77" y="290.35" width="36" height="53.65" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="167" y="337.29" width="36" height="6.71" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="221.23" y="343.44" width="36" height="0.56" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="275.46" y="343.97" width="36" height="0.03" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="76.54" y="121.4" text-anchor="middle" class="sm">0.779</text>
    <text x="130.77" y="282.35" text-anchor="middle" class="sm">0.195</text>
    <text x="185" y="329.29" text-anchor="middle" class="sm">0.024</text>
  </g>
</svg>
