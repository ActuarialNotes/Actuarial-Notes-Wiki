  <line x1="127.5" y1="92" x2="127.5" y2="348" class="grid"/>
  <line x1="193" y1="92" x2="193" y2="348" class="grid"/>
  <line x1="258.5" y1="92" x2="258.5" y2="348" class="grid"/>
  <line x1="324" y1="92" x2="324" y2="348" class="grid"/>
  <line x1="62" y1="348" x2="324" y2="348" class="grid"/>
  <line x1="62" y1="236.7" x2="324" y2="236.7" class="grid"/>
  <line x1="62" y1="125.39" x2="324" y2="125.39" class="grid"/>
  <line x1="62" y1="348" x2="334" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="348" x2="62" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="348" x2="62" y2="352" class="tick"/>
  <text x="62" y="364" text-anchor="middle" class="sm dim">0</text>
  <line x1="127.5" y1="348" x2="127.5" y2="352" class="tick"/>
  <text x="127.5" y="364" text-anchor="middle" class="sm dim">0.5k</text>
  <line x1="193" y1="348" x2="193" y2="352" class="tick"/>
  <text x="193" y="364" text-anchor="middle" class="sm dim">1.0k</text>
  <line x1="258.5" y1="348" x2="258.5" y2="352" class="tick"/>
  <text x="258.5" y="364" text-anchor="middle" class="sm dim">1.5k</text>
  <line x1="324" y1="348" x2="324" y2="352" class="tick"/>
  <text x="324" y="364" text-anchor="middle" class="sm dim">2.0k</text>
  <line x1="58" y1="348" x2="62" y2="348" class="tick"/>
  <text x="54" y="351.6" text-anchor="end" class="sm dim">0</text>
  <line x1="58" y1="236.7" x2="62" y2="236.7" class="tick"/>
  <text x="54" y="240.3" text-anchor="end" class="sm dim">0.5</text>
  <line x1="58" y1="125.39" x2="62" y2="125.39" class="tick"/>
  <text x="54" y="128.99" text-anchor="end" class="sm dim">1</text>
