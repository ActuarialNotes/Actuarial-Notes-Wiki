<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Fault read off a diagram in 25% increments, mechanically and without regard to the facts around it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Fault read off a diagram, not argued</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Fault ∈ {0, 25, 50, 75, 100}%</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">the physical facts, and nothing else</text>
    <rect x="44" y="100" width="272" height="96" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <text x="180" y="120" text-anchor="middle" class="sm dim">rear-end collision — scenario 6</text>
    <rect x="96" y="140" width="52" height="24" rx="4" fill="#059669" fill-opacity="0.55"/>
    <rect x="178" y="140" width="52" height="24" rx="4" fill="#e11d48" fill-opacity="0.55"/>
    <line x1="238" y1="152" x2="274" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <text x="122" y="180" text-anchor="middle" class="sm bold" fill="#059669">0%</text>
    <text x="204" y="180" text-anchor="middle" class="sm bold" fill="#e11d48">100%</text>
    <rect x="46" y="214" width="47.2" height="24" rx="12.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
    <text x="69.6" y="230" text-anchor="middle" class="sm">0%</text>
    <rect x="101.2" y="214" width="47.2" height="24" rx="12.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
    <text x="124.8" y="230" text-anchor="middle" class="sm">25%</text>
    <rect x="156.4" y="214" width="47.2" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="230" text-anchor="middle" class="sm">50%</text>
    <rect x="211.6" y="214" width="47.2" height="24" rx="12.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
    <text x="235.2" y="230" text-anchor="middle" class="sm">75%</text>
    <rect x="266.8" y="214" width="47.2" height="24" rx="12.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="290.4" y="230" text-anchor="middle" class="sm">100%</text>
    <text x="180" y="258" text-anchor="middle" class="sm dim">50% or more counts as at fault</text>
    <line x1="30" y1="278" x2="330" y2="278" class="rule"/>
    <text x="40" y="300" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="300" text-anchor="start" class="sm">certainty beats accuracy at this volume</text>
    <text x="40" y="324" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="324" text-anchor="start" class="sm">wrong in the odd case, and deliberately so</text>
    <text x="40" y="348" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="348" text-anchor="start" class="sm">binds first-party recovery and rating —</text>
    <text x="40" y="372" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="372" text-anchor="start" class="sm">not a court hearing a bodily injury action</text>
  </g>
</svg>
