<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A bodily injury award built head by head, then reduced for contributory negligence and benefits received</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Four elements to prove, then two</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">reductions</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Damages = pecuniary + non-pecuniary</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">duty · breach · causation · damage</text>
    <rect x="36" y="94" width="63" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="67.5" y="110" text-anchor="middle" class="sm">duty</text>
    <rect x="111" y="94" width="63" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="142.5" y="110" text-anchor="middle" class="sm">breach</text>
    <line x1="100" y1="106" x2="110" y2="106" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="186" y="94" width="63" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="217.5" y="110" text-anchor="middle" class="sm">cause</text>
    <line x1="175" y1="106" x2="185" y2="106" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="261" y="94" width="63" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="292.5" y="110" text-anchor="middle" class="sm">damage</text>
    <line x1="250" y1="106" x2="260" y2="106" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <text x="180" y="138" text-anchor="middle" class="sm dim">fail any one and the claim fails entirely</text>
    <line x1="30" y1="158" x2="330" y2="158" class="rule"/>
    <text x="180" y="180" text-anchor="middle" class="sm dim">then the arithmetic</text>
    <rect x="45.18" y="235.11" width="29.97" height="82.89" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="60.17" y="227.11" text-anchor="middle" class="sm">1.37M</text>
    <text x="60.17" y="333" text-anchor="middle" class="sm dim">income</text>
    <rect x="93.52" y="216.92" width="29.97" height="18.2" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="108.5" y="208.92" text-anchor="middle" class="sm">300k</text>
    <text x="108.5" y="333" text-anchor="middle" class="sm dim">care</text>
    <rect x="141.85" y="206" width="29.97" height="10.92" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="156.83" y="198" text-anchor="middle" class="sm">180k</text>
    <text x="156.83" y="333" text-anchor="middle" class="sm dim">pain</text>
    <rect x="190.18" y="206" width="29.97" height="22.4" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="205.17" y="198" text-anchor="middle" class="sm">369k</text>
    <text x="205.17" y="333" text-anchor="middle" class="sm dim">−20%</text>
    <rect x="238.52" y="228.4" width="29.97" height="5.76" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="253.5" y="220.4" text-anchor="middle" class="sm">95k</text>
    <text x="253.5" y="333" text-anchor="middle" class="sm dim">−AB</text>
    <rect x="286.85" y="234.16" width="29.97" height="83.84" rx="3" fill="#059669" fill-opacity="0.72"/>
    <text x="301.83" y="226.16" text-anchor="middle" class="sm">1.38M</text>
    <text x="301.83" y="333" text-anchor="middle" class="sm dim">paid</text>
    <line x1="30" y1="318" x2="332" y2="318" class="axis"/>
    <text x="180" y="358" text-anchor="middle" class="sm dim">the non-pecuniary head is capped by the 1978 trilogy</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">and costs follow the event, which deters weak claims</text>
  </g>
</svg>
