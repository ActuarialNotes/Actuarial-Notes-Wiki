  <circle cx="102.36" cy="139.46" r="3.4" fill="#d97706"/>
  <text x="102.36" y="129.46" text-anchor="middle" class="sm">2,505</text>
  <circle cx="146.29" cy="165.6" r="3.4" fill="#d97706"/>
  <text x="146.29" y="155.6" text-anchor="middle" class="sm">1,490</text>
  <circle cx="234.14" cy="177.75" r="3.4" fill="#d97706"/>
  <text x="234.14" y="167.75" text-anchor="middle" class="sm">1,019</text>
  <line x1="76" y1="204" x2="332" y2="204" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="204" x2="76" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="102.36" y1="204" x2="102.36" y2="208" class="tick"/>
  <text x="102.36" y="220" text-anchor="middle" class="sm dim">5</text>
  <line x1="146.29" y1="204" x2="146.29" y2="208" class="tick"/>
  <text x="146.29" y="220" text-anchor="middle" class="sm dim">10</text>
  <line x1="234.14" y1="204" x2="234.14" y2="208" class="tick"/>
  <text x="234.14" y="220" text-anchor="middle" class="sm dim">20</text>
  <line x1="322" y1="204" x2="322" y2="208" class="tick"/>
  <text x="322" y="220" text-anchor="middle" class="sm dim">30</text>
  <line x1="72" y1="204" x2="76" y2="204" class="tick"/>
  <text x="68" y="207.6" text-anchor="end" class="sm dim">0</text>
  <line x1="72" y1="152.46" x2="76" y2="152.46" class="tick"/>
  <text x="68" y="156.06" text-anchor="end" class="sm dim">2,000</text>
  <line x1="72" y1="100.92" x2="76" y2="100.92" class="tick"/>
  <text x="68" y="104.52" text-anchor="end" class="sm dim">4,000</text>
  <text x="322" y="236" text-anchor="end" class="sm dim">term n (years)</text>
  <text x="72" y="56" text-anchor="start" class="sm dim">level payment</text>
  <text x="199" y="258" text-anchor="middle" class="sm dim">L = 10,000 at i = 8%</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">P = L / a₍ₙ₎</text>
  <line x1="342" y1="124" x2="342" y2="158" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="137" text-anchor="start" class="sm bold">Longer term</text>
  <text x="352" y="153" text-anchor="start" class="sm dim">smaller payment, more total interest</text>
  <line x1="342" y1="172" x2="342" y2="206" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="185" text-anchor="start" class="sm bold">Non-integer n</text>
  <text x="352" y="201" text-anchor="start" class="sm dim">the last payment differs</text>
  <line x1="342" y1="220" x2="342" y2="254" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="233" text-anchor="start" class="sm bold">Solve for n</text>
  <text x="352" y="249" text-anchor="start" class="sm dim">n = −ln(1 − iL/P)/ln(1 + i)</text>
  <text x="280" y="280" text-anchor="middle" class="sm dim">A drop or balloon payment is what a non-integer term looks like</text>
</svg>
