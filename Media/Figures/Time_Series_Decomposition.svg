<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A series split into its trend, seasonal and irregular components</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Split the series into trend, season,</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">remainder</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Y_t = m_t + s_t + z_t</text>
  <text x="80" y="118" text-anchor="end" class="sm bold" fill="#3b82f6">Y_t observed</text>
  <rect x="86" y="88" width="240" height="52" rx="4" fill="var(--soft)" stroke="var(--edge)"/>
  <polyline points="86,132.57 93.74,127.88 101.48,124.75 109.23,131.12 116.97,127.91 124.71,122.64 132.45,118.24 140.19,128.8 147.94,125.34 155.68,119.82 163.42,114.93 171.16,122 178.9,120.81 186.65,114.74 194.39,111.27 202.13,115.53 209.87,115.76 217.61,112.02 225.35,104.47 233.1,111.4 240.84,112.96 248.58,106.94 256.32,102.36 264.06,110.8 271.81,107.28 279.55,102.57 287.29,99.78 295.03,107.12 302.77,102.37 310.52,100.29 318.26,95.43 326,101.07" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="80" y="192" text-anchor="end" class="sm bold" fill="#d97706">m_t trend</text>
  <rect x="86" y="162" width="240" height="52" rx="4" fill="var(--soft)" stroke="var(--edge)"/>
  <polyline points="86,206.57 93.74,205.37 101.48,204.18 109.23,202.98 116.97,201.78 124.71,200.58 132.45,199.38 140.19,198.18 147.94,196.99 155.68,195.79 163.42,194.59 171.16,193.39 178.9,192.19 186.65,191 194.39,189.8 202.13,188.6 209.87,187.4 217.61,186.2 225.35,185 233.1,183.81 240.84,182.61 248.58,181.41 256.32,180.21 264.06,179.01 271.81,177.82 279.55,176.62 287.29,175.42 295.03,174.22 302.77,173.02 310.52,171.82 318.26,170.63 326,169.43" class="curve" stroke="#d97706" stroke-width="1.6"/>
  <text x="80" y="266" text-anchor="end" class="sm bold" fill="#7c3aed">s_t seasonal</text>
  <rect x="86" y="236" width="240" height="52" rx="4" fill="var(--soft)" stroke="var(--edge)"/>
  <polyline points="86,279.09 93.74,259.77 101.48,243.43 109.23,280.57 116.97,279.09 124.71,259.77 132.45,243.43 140.19,280.57 147.94,279.09 155.68,259.77 163.42,243.43 171.16,280.57 178.9,279.09 186.65,259.77 194.39,243.43 202.13,280.57 209.87,279.09 217.61,259.77 225.35,243.43 233.1,280.57 240.84,279.09 248.58,259.77 256.32,243.43 264.06,280.57 271.81,279.09 279.55,259.77 287.29,243.43 295.03,280.57 302.77,279.09 310.52,259.77 318.26,243.43 326,280.57" class="curve" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="80" y="340" text-anchor="end" class="sm bold" fill="#059669">z_t irregular</text>
  <rect x="86" y="310" width="240" height="52" rx="4" fill="var(--soft)" stroke="var(--edge)"/>
  <polyline points="86,336.05 93.74,338.88 101.48,347.84 109.23,343.87 116.97,331.22 124.71,330.23 132.45,330.77 140.19,354.57 147.94,340.25 155.68,337.56 163.42,334.9 171.16,335.53 178.9,336.28 186.65,329.99 194.39,336.68 202.13,318.75 209.87,328.89 217.61,337.99 225.35,317.71 233.1,317.43 240.84,336.38 248.58,330.44 256.32,329.77 264.06,339.54 271.81,324.82 279.55,327.55 287.29,338.75 295.03,341.18 302.77,318.37 310.52,338.47 318.26,335.96 326,327.18" class="curve" stroke="#059669" stroke-width="1.6"/>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the moving average loses s/2 points at each end</text>
</svg>
