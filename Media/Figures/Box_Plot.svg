<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A box from Q₁ = 4 to Q₃ = 11 with the median at 7, whiskers to 2 and 14, the upper fence at 21.5, and one outlier at 40 beyond it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="40" y1="348" x2="336" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="40" y1="348" x2="40" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="40" y1="348" x2="40" y2="352" class="tick"/>
    <text x="40" y="364" text-anchor="middle" class="sm dim">0</text>
    <line x1="105" y1="348" x2="105" y2="352" class="tick"/>
    <text x="105" y="364" text-anchor="middle" class="sm dim">10</text>
    <line x1="170" y1="348" x2="170" y2="352" class="tick"/>
    <text x="170" y="364" text-anchor="middle" class="sm dim">20</text>
    <line x1="235" y1="348" x2="235" y2="352" class="tick"/>
    <text x="235" y="364" text-anchor="middle" class="sm dim">30</text>
    <line x1="300" y1="348" x2="300" y2="352" class="tick"/>
    <text x="300" y="364" text-anchor="middle" class="sm dim">40</text>
    <text x="326" y="380" text-anchor="end" class="sm dim">claim size (000s)</text>
    <rect x="66" y="151.44" width="45.5" height="110.88" rx="3" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.6"/>
    <line x1="85.5" y1="151.44" x2="85.5" y2="262.32" stroke="#3b82f6" stroke-width="2.6"/>
    <line x1="53" y1="206.88" x2="66" y2="206.88" class="thin" stroke="#3b82f6" stroke-width="1.6"/>
    <line x1="111.5" y1="206.88" x2="131" y2="206.88" class="thin" stroke="#3b82f6" stroke-width="1.6"/>
    <line x1="53" y1="176.64" x2="53" y2="237.12" stroke="#3b82f6" stroke-width="1.6"/>
    <line x1="131" y1="176.64" x2="131" y2="237.12" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="53" y="278.32" text-anchor="middle" class="sm bold">2</text>
    <text x="66" y="278.32" text-anchor="middle" class="sm bold">4</text>
    <text x="85.5" y="278.32" text-anchor="middle" class="sm bold">7</text>
    <text x="111.5" y="278.32" text-anchor="middle" class="sm bold">11</text>
    <text x="131" y="278.32" text-anchor="middle" class="sm bold">14</text>
    <circle cx="300" cy="206.88" r="4.6" fill="#e11d48"/>
    <text x="300" y="192.88" text-anchor="middle" class="sm bold">outlier</text>
    <line x1="179.75" y1="348" x2="179.75" y2="111.12" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
    <text x="179.75" y="105.12" text-anchor="middle" class="sm">fence</text>
    <path d="M66,145.44 v-4.2 H83.75 q5,0 5,-3.85 q0,3.85 5,3.85 H111.5 v4.2" class="thin" stroke="#d97706" stroke-width="1.2"/>
    <text x="88.75" y="125.44" text-anchor="middle" class="sm">IQR</text>
  </g>
</svg>
