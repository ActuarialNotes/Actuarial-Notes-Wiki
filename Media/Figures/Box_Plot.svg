<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The five-number summary, the fences, and one outlier beyond them</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Five numbers, a box, and the outliers</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">IQR = Q₃ − Q₁</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">outlier beyond Q₃ + 1.5·IQR</text>
  <line x1="46" y1="338" x2="336" y2="338" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="46" y1="338" x2="46" y2="206" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="46" y1="338" x2="46" y2="342" class="tick"/>
  <text x="46" y="354" text-anchor="middle" class="sm dim">0</text>
  <line x1="109.64" y1="338" x2="109.64" y2="342" class="tick"/>
  <text x="109.64" y="354" text-anchor="middle" class="sm dim">10</text>
  <line x1="173.27" y1="338" x2="173.27" y2="342" class="tick"/>
  <text x="173.27" y="354" text-anchor="middle" class="sm dim">20</text>
  <line x1="236.91" y1="338" x2="236.91" y2="342" class="tick"/>
  <text x="236.91" y="354" text-anchor="middle" class="sm dim">30</text>
  <line x1="300.55" y1="338" x2="300.55" y2="342" class="tick"/>
  <text x="300.55" y="354" text-anchor="middle" class="sm dim">40</text>
  <text x="326" y="370" text-anchor="end" class="sm dim">claim size (000s)</text>
  <rect x="71.45" y="228.2" width="44.55" height="63.44" rx="3" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="90.55" y1="228.2" x2="90.55" y2="291.64" stroke="#3b82f6" stroke-width="2.6"/>
  <line x1="58.73" y1="259.92" x2="71.45" y2="259.92" class="thin" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="116" y1="259.92" x2="135.09" y2="259.92" class="thin" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="58.73" y1="242.84" x2="58.73" y2="277" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="135.09" y1="242.84" x2="135.09" y2="277" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="300.55" cy="259.92" r="4.6" fill="#e11d48"/>
  <text x="300.55" y="245.92" text-anchor="middle" class="sm bold" fill="#e11d48">outlier</text>
  <line x1="182.82" y1="338" x2="182.82" y2="220.88" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
  <text x="182.82" y="214.88" text-anchor="middle" class="sm">fence 21.5</text>
  <path d="M71.45,222.2 v-4.2 H88.73 q5,0 5,-3.85 q0,3.85 5,3.85 H116 v4.2" class="thin" stroke="#d97706" stroke-width="1.2"/>
  <text x="93.73" y="202.2" text-anchor="middle" class="sm">IQR = 7</text>
  <text x="116" y="92" text-anchor="end" class="sm dim">minimum</text>
  <text x="128" y="92" text-anchor="start" class="sm bold">2</text>
  <text x="116" y="112" text-anchor="end" class="sm dim">Q₁</text>
  <text x="128" y="112" text-anchor="start" class="sm bold">4</text>
  <text x="116" y="132" text-anchor="end" class="sm dim">median</text>
  <text x="128" y="132" text-anchor="start" class="sm bold">7</text>
  <text x="116" y="152" text-anchor="end" class="sm dim">Q₃</text>
  <text x="128" y="152" text-anchor="start" class="sm bold">11</text>
  <text x="116" y="172" text-anchor="end" class="sm dim">maximum (whisker)</text>
  <text x="128" y="172" text-anchor="start" class="sm bold">14</text>
  <text x="170" y="132" text-anchor="start" class="sm dim">the box holds the middle 50%</text>
  <text x="170" y="152" text-anchor="start" class="sm dim">of the claims</text>
</svg>
