<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Inflows above the timeline and outflows below it, each moved back to time 0, where their present values stack into two equal bars</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="68" y1="229" x2="324" y2="229" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="76" y1="225" x2="76" y2="233" class="tick"/>
    <line x1="114.33" y1="225" x2="114.33" y2="233" class="tick"/>
    <text x="114.33" y="246" text-anchor="middle" class="sm dim">1</text>
    <line x1="152.67" y1="225" x2="152.67" y2="233" class="tick"/>
    <text x="152.67" y="246" text-anchor="middle" class="sm dim">2</text>
    <line x1="191" y1="225" x2="191" y2="233" class="tick"/>
    <text x="191" y="246" text-anchor="middle" class="sm dim">3</text>
    <line x1="229.33" y1="225" x2="229.33" y2="233" class="tick"/>
    <text x="229.33" y="246" text-anchor="middle" class="sm dim">4</text>
    <line x1="267.67" y1="225" x2="267.67" y2="233" class="tick"/>
    <text x="267.67" y="246" text-anchor="middle" class="sm dim">5</text>
    <line x1="306" y1="225" x2="306" y2="233" class="tick"/>
    <text x="306" y="246" text-anchor="middle" class="sm dim">6</text>
    <line x1="152.67" y1="229" x2="152.67" y2="179" class="thin" stroke="#059669" stroke-width="2" marker-end="url(#ah059669)"/>
    <line x1="229.33" y1="229" x2="229.33" y2="179" class="thin" stroke="#059669" stroke-width="2" marker-end="url(#ah059669)"/>
    <line x1="306" y1="229" x2="306" y2="179" class="thin" stroke="#059669" stroke-width="2" marker-end="url(#ah059669)"/>
    <line x1="114.33" y1="229" x2="114.33" y2="291.45" class="thin" stroke="#e11d48" stroke-width="2" marker-end="url(#ahe11d48)"/>
    <line x1="191" y1="229" x2="191" y2="291.45" class="thin" stroke="#e11d48" stroke-width="2" marker-end="url(#ahe11d48)"/>
    <rect x="69" y="187.68" width="14" height="41.32" rx="2" fill="#059669" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="69" y="153.53" width="14" height="34.15" rx="2" fill="#059669" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="69" y="125.3" width="14" height="28.22" rx="2" fill="#059669" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="69" y="229" width="14" height="56.78" rx="2" fill="#e11d48" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="69" y="285.78" width="14" height="46.92" rx="2" fill="#e11d48" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <line x1="306" y1="111.3" x2="89" y2="111.3" class="thin dash" stroke="#059669" stroke-width="1.2" marker-end="url(#ah059669)"/>
    <line x1="191" y1="346.7" x2="89" y2="346.7" class="thin dash" stroke="#e11d48" stroke-width="1.2" marker-end="url(#ahe11d48)"/>
    <text x="63" y="233" text-anchor="end" class="sm dim">0</text>
    <text x="76" y="99.3" text-anchor="middle" class="sm bold">PV in</text>
    <text x="76" y="362.7" text-anchor="middle" class="sm bold">PV out</text>
  </g>
</svg>
