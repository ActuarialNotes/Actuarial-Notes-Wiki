<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The share of claims closed at 12 months by accident year, level near 35% and then jumping in 2023 and 2024</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="94.33" y1="94" x2="94.33" y2="344" class="grid"/>
    <line x1="145.17" y1="94" x2="145.17" y2="344" class="grid"/>
    <line x1="196" y1="94" x2="196" y2="344" class="grid"/>
    <line x1="246.83" y1="94" x2="246.83" y2="344" class="grid"/>
    <line x1="297.67" y1="94" x2="297.67" y2="344" class="grid"/>
    <line x1="74" y1="344" x2="318" y2="344" class="grid"/>
    <line x1="74" y1="239.83" x2="318" y2="239.83" class="grid"/>
    <line x1="74" y1="135.67" x2="318" y2="135.67" class="grid"/>
    <line x1="74" y1="344" x2="328" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="344" x2="74" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="94.33" y1="344" x2="94.33" y2="348" class="tick"/>
    <text x="94.33" y="360" text-anchor="middle" class="sm dim">2020</text>
    <line x1="145.17" y1="344" x2="145.17" y2="348" class="tick"/>
    <text x="145.17" y="360" text-anchor="middle" class="sm dim">2021</text>
    <line x1="196" y1="344" x2="196" y2="348" class="tick"/>
    <text x="196" y="360" text-anchor="middle" class="sm dim">2022</text>
    <line x1="246.83" y1="344" x2="246.83" y2="348" class="tick"/>
    <text x="246.83" y="360" text-anchor="middle" class="sm dim">2023</text>
    <line x1="297.67" y1="344" x2="297.67" y2="348" class="tick"/>
    <text x="297.67" y="360" text-anchor="middle" class="sm dim">2024</text>
    <line x1="70" y1="344" x2="74" y2="344" class="tick"/>
    <text x="66" y="347.6" text-anchor="end" class="sm dim">0%</text>
    <line x1="70" y1="239.83" x2="74" y2="239.83" class="tick"/>
    <text x="66" y="243.43" text-anchor="end" class="sm dim">30%</text>
    <line x1="70" y1="135.67" x2="74" y2="135.67" class="tick"/>
    <text x="66" y="139.27" text-anchor="end" class="sm dim">60%</text>
    <text x="318" y="376" text-anchor="end" class="sm dim">accident year</text>
    <text x="70" y="80" text-anchor="start" class="sm dim">share closed</text>
    <rect x="79.33" y="225.94" width="30" height="118.06" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
    <rect x="130.17" y="222.47" width="30" height="121.53" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
    <rect x="181" y="219" width="30" height="125" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
    <rect x="231.83" y="180.81" width="30" height="163.19" rx="1.5" fill="#e11d48" fill-opacity="0.72"/>
    <rect x="282.67" y="163.44" width="30" height="180.56" rx="1.5" fill="#e11d48" fill-opacity="0.72"/>
    <line x1="74" y1="222.47" x2="318" y2="222.47" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="79.08" y="216.47" text-anchor="start" class="sm dim">old level</text>
  </g>
</svg>
