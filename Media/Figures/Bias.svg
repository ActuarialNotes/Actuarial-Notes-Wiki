  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Off-centre by a fixed amount</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Bias(θ̂) = E[θ̂] − θ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">MSE = Var(θ̂) + Bias²</text>
