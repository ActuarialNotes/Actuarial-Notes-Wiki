  <text x="326" y="229" text-anchor="start" class="sm bold">Payments rise faster than r</text>
  <text x="326" y="245" text-anchor="start" class="sm dim">the leveraged effect of inflation</text>
  <text x="280" y="278" text-anchor="middle" class="sm dim">Deductibles and limits are fixed in dollars — inflation erodes both</text>
