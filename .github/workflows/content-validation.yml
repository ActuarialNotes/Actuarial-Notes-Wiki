name: Content Validation

# Gate every change to the question bank on content integrity (roadmap P0.2).
# The app's parser silently drops any question it can't parse and any duplicate
# id, so bad frontmatter or a mismatched answer key means the question just never
# appears in-app. This check reproduces that contract so drift fails the PR
# instead of shipping. Path-filtered to content the validators read.
#
# The second job gates the exam pages (docs/syllabus-pipeline.md): their
# structure, their links, and the question bank's learning objectives against
# their sections (scripts/syllabus_lint.py), then the link graph of every
# ready/beta exam (validate_links.py --studiable). Exams 6–9 are a syllabus
# outline by design, so their unwritten pages warn rather than fail. Last, every
# `ready` exam must still pass its structural publication gates
# (publication_readiness.py --hold).
#
# The third gates the resource pages (docs/resource-pages.md): every
# Resources/Books/ page in the one shape the standard defines, its syllabus
# callout matching the exam pages, its sources named (scripts/resource_lint.py).
#
# The fourth holds the simulated learner (docs/simulated-learner.md) to its
# isolation guarantee: no question's solution reaches the learner. It runs on
# content changes too, because a new heading or a reworded solution is exactly
# what could slip past the loader. No model is called; the runs are scripted.
on:
  pull_request:
    paths:
      - 'questions/**'
      - 'Concepts/**'
      - 'Resources/**'
      - 'Exam *.md'
      - '.syllabus/**'
      - 'comprehension-checks/**'
      - 'scripts/validate_content.py'
      - 'scripts/syllabus_*.py'
      - 'scripts/resource_*.py'
      - 'scripts/vault_links.py'
      - 'scripts/publication_readiness.py'
      - 'scripts/answerability_lib.py'
      - 'scripts/generate_coverage_report.py'
      - 'scripts/*.json'
      - '.claude/skills/actuarial-concept-definitions/validate_links.py'
      - 'simulations/**'
      - '.github/workflows/content-validation.yml'
  push:
    branches: [main]
    paths:
      - 'questions/**'
      - 'Concepts/**'
      - 'Resources/**'
      - 'Exam *.md'
      - '.syllabus/**'
      - 'comprehension-checks/**'
      - 'scripts/validate_content.py'
      - 'scripts/syllabus_*.py'
      - 'scripts/resource_*.py'
      - 'scripts/vault_links.py'
      - 'scripts/publication_readiness.py'
      - 'scripts/answerability_lib.py'
      - 'scripts/generate_coverage_report.py'
      - 'scripts/*.json'
      - '.claude/skills/actuarial-concept-definitions/validate_links.py'
      - 'simulations/**'
      - '.github/workflows/content-validation.yml'
  workflow_dispatch:

concurrency:
  group: content-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate question bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Standard library only — no dependencies to install.
      - name: Validate content
        run: python3 scripts/validate_content.py

  syllabus:
    name: lint exam pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Standard library only. Warnings (development exams, missing
      # comprehension checks) print but don't fail; errors do.
      - name: Lint exam pages
        run: python3 scripts/syllabus_lint.py

      - name: Link graph of the studiable exams
        run: python3 .claude/skills/actuarial-concept-definitions/validate_links.py --studiable

      # A ready exam keeps its structural gates (docs/content-plan.md, Phase 1):
      # every objective link written, no catch-all, every concept with a served
      # question. The fact-check gates print as warnings — an edit makes a page
      # stale by design, and verify-check.yml repairs the record — and so does
      # G8, answerability, re-read in code from simulations/answerability/.
      - name: Ready exams hold their gates
        run: python3 scripts/publication_readiness.py --hold

  resources:
    name: lint resource pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Standard library only (resource_extract.py, which needs PyMuPDF, is not run here).
      - name: Lint resource pages
        run: python3 scripts/resource_lint.py

  simulated-learner:
    name: simulated learner isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyYAML reads the learner profiles and question frontmatter.
      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Isolation and component tests
        run: python3 -m unittest discover -s simulations/tests -t simulations
