<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two series along the same dashed trend line hit by the same shock: the trend-stationary one returns to the line, the unit-root one stays shifted for good</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="44" y1="362" x2="328" y2="362" class="axis"/>
    <polyline points="44,348.53 328,153.5" class="curve dash" stroke="var(--dim)" stroke-width="1.4"/>
    <line x1="162.88" y1="362" x2="162.88" y2="98.67" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
    <text x="162.88" y="92.67" text-anchor="middle" class="sm bold">shock</text>
    <polyline points="44,351.33 50.6,347.34 57.21,342.43 63.81,332.19 70.42,333.33 77.02,320.61 83.63,321.58 90.23,317.04 96.84,315.42 103.44,312.85 110.05,314.8 116.65,313.65 123.26,302.9 129.86,303.54 136.47,287.71 143.07,276.29 149.67,277.34 156.28,276.17 162.88,220.81 169.49,242.27 176.09,251.28 182.7,252.75 189.3,253.8 195.91,241.77 202.51,237.53 209.12,229.65 215.72,224 222.33,226.89 228.93,215.08 235.53,210.58 242.14,210.18 248.74,206.07 255.35,203.4 261.95,201.2 268.56,194.92 275.16,194.77 281.77,200.12 288.37,185.25 294.98,181.45 301.58,178.85 308.19,173.9 314.79,162.86 321.4,160.43 328,149.83" class="curve" stroke="#059669" stroke-width="1.9"/>
    <polyline points="44,345.53 50.6,345.29 57.21,336.64 63.81,330.33 70.42,328.82 77.02,327.26 83.63,319.17 90.23,311.65 96.84,307.08 103.44,311.92 110.05,300.17 116.65,291.66 123.26,291.07 129.86,285.61 136.47,280.77 143.07,278.42 149.67,276.4 156.28,276.06 162.88,224.54 169.49,215.36 176.09,216.1 182.7,214.2 189.3,205.47 195.91,202.7 202.51,197.01 209.12,189.18 215.72,181.27 222.33,175.1 228.93,171.9 235.53,174.71 242.14,174.28 248.74,163.48 255.35,161.83 261.95,151.74 268.56,145.51 275.16,150.74 281.77,150.68 288.37,145.41 294.98,135.93 301.58,127.58 308.19,120.25 314.79,113.99 321.4,105.19 328,104.01" class="curve" stroke="#e11d48" stroke-width="1.9"/>
    <text x="328" y="92.01" text-anchor="end" class="sm bold">stochastic</text>
    <text x="328" y="179.83" text-anchor="end" class="sm bold">deterministic</text>
  </g>
</svg>
