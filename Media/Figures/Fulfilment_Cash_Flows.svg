<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three building blocks of a fulfilment measurement, and where each lands on the income statement</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">What it will cost to discharge the</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">obligation</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">FCF = PV(E[cash flows]) + RA</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">the insurer's own view, not an exit price</text>
    <rect x="34" y="100" width="292" height="48" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="121" text-anchor="middle" class="sm">Expected cash flows</text>
    <text x="180" y="136" text-anchor="middle" class="sm dim">unbiased, probability-weighted</text>
    <rect x="34" y="160" width="292" height="48" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.3"/>
    <text x="180" y="181" text-anchor="middle" class="sm">Time value of money</text>
    <text x="180" y="196" text-anchor="middle" class="sm dim">current, market-consistent rates</text>
    <rect x="34" y="220" width="292" height="48" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="180" y="241" text-anchor="middle" class="sm">Risk adjustment</text>
    <text x="180" y="256" text-anchor="middle" class="sm dim">for non-financial uncertainty</text>
    <line x1="30" y1="268" x2="330" y2="268" class="rule"/>
    <text x="180" y="290" text-anchor="middle" class="sm bold">and the split drives the income statement</text>
    <text x="180" y="316" text-anchor="middle" class="sm dim">a change in the cash flow estimate →</text>
    <text x="180" y="332" text-anchor="middle" class="sm" fill="#d97706">insurance service expenses</text>
    <text x="180" y="356" text-anchor="middle" class="sm dim">a change in the discount rate →</text>
    <text x="180" y="372" text-anchor="middle" class="sm" fill="#0d9488">insurance finance income or expenses</text>
  </g>
</svg>
