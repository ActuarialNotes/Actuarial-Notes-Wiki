<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The parallelogram method: calendar year 2023 as a unit square, cut by the diagonal of a 7/1 rate change into 0.875 earned at the old rates and a 0.125 triangle at the new</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="76" y="100" width="236" height="236" rx="4" fill="#3b82f6" fill-opacity="0.14" stroke="var(--edge)" stroke-width="1.2"/>
    <polygon points="194,336 312,336 312,218" fill="#059669" fill-opacity="0.34" stroke="#059669" stroke-width="1.4"/>
    <text x="165.68" y="208.56" text-anchor="middle" class="sm bold">old 0.875</text>
    <text x="271.88" y="302.96" text-anchor="middle" class="sm bold">new 0.125</text>
    <line x1="76" y1="336" x2="76" y2="342" class="tick"/>
    <text x="76" y="356" text-anchor="middle" class="sm dim">1/1</text>
    <line x1="194" y1="336" x2="194" y2="342" class="tick"/>
    <text x="194" y="356" text-anchor="middle" class="sm dim">7/1</text>
    <line x1="312" y1="336" x2="312" y2="342" class="tick"/>
    <text x="312" y="356" text-anchor="middle" class="sm dim">12/31</text>
    <text x="68" y="340" text-anchor="end" class="sm dim">0</text>
    <text x="68" y="104" text-anchor="end" class="sm dim">1</text>
    <text x="76" y="90" text-anchor="start" class="sm dim">earned</text>
    <text x="312" y="378" text-anchor="end" class="sm dim">CY 2023</text>
  </g>
</svg>
