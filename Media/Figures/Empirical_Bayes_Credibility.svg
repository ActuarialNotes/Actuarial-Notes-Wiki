  <line x1="58" y1="312" x2="58" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="92.48" y1="312" x2="92.48" y2="316" class="tick"/>
  <text x="92.48" y="328" text-anchor="middle" class="sm dim">R1</text>
