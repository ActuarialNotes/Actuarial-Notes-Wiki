<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Three of ten policies drawn without replacement, above the hypergeometric mass function of the number drawn with errors</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Drawing without replacement from a</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">finite pool</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(X = k) = C(K,k) C(N−K, n−k) / C(N,n)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[X] = nK/N</text>
  <text x="180" y="92" text-anchor="middle" class="sm dim">10 policies, 4 with errors — 3 drawn (dashed)</text>
  <rect x="27.5" y="102" width="26" height="26" rx="5" fill="#e11d48" fill-opacity="0.7" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="58.5" y="102" width="26" height="26" rx="5" fill="#e11d48" fill-opacity="0.7" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="54.5" y="98" width="34" height="34" rx="8" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <rect x="89.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="120.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="151.5" y="102" width="26" height="26" rx="5" fill="#e11d48" fill-opacity="0.7" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="147.5" y="98" width="34" height="34" rx="8" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <rect x="182.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="213.5" y="102" width="26" height="26" rx="5" fill="#e11d48" fill-opacity="0.7" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="244.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="240.5" y="98" width="34" height="34" rx="8" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <rect x="275.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="306.5" y="102" width="26" height="26" rx="5" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="180" y="154" text-anchor="middle" class="sm bold" fill="#e11d48">2 of the 3 drawn have errors → k = 2</text>
  <line x1="90.69" y1="330" x2="90.69" y2="295.93" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="90.69" cy="295.93" r="3.2" fill="#3b82f6"/>
  <line x1="158.9" y1="330" x2="158.9" y2="227.78" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="158.9" cy="227.78" r="3.2" fill="#3b82f6"/>
  <line x1="295.31" y1="330" x2="295.31" y2="323.19" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="295.31" cy="323.19" r="3.2" fill="#3b82f6"/>
  <line x1="227.1" y1="330" x2="227.1" y2="268.67" stroke="#d97706" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="227.1" cy="268.67" r="3.8" fill="#d97706"/>
  <line x1="60" y1="330" x2="336" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="330" x2="60" y2="182" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="90.69" y1="330" x2="90.69" y2="334" class="tick"/>
  <text x="90.69" y="346" text-anchor="middle" class="sm dim">0</text>
  <line x1="158.9" y1="330" x2="158.9" y2="334" class="tick"/>
  <text x="158.9" y="346" text-anchor="middle" class="sm dim">1</text>
  <line x1="227.1" y1="330" x2="227.1" y2="334" class="tick"/>
  <text x="227.1" y="346" text-anchor="middle" class="sm dim">2</text>
  <line x1="295.31" y1="330" x2="295.31" y2="334" class="tick"/>
  <text x="295.31" y="346" text-anchor="middle" class="sm dim">3</text>
  <text x="326" y="362" text-anchor="end" class="sm dim">k</text>
  <text x="56" y="178" text-anchor="start" class="sm dim">P(X = k)</text>
  <text x="227.1" y="257.67" text-anchor="middle" class="sm bold" fill="#d97706">0.300</text>
</svg>
