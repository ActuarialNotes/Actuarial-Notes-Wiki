    <line x1="84.89" y1="285.35" x2="82.93" y2="281.34" class="thin" stroke="var(--dim)" stroke-width="1.6" marker-end="url(#ahvardim)"/>
    <path d="M82.93024299968997,186.65591614677965 Q99.23211839625509,153.23211839625512 132.6559161467796,136.93024299969" class="thin" stroke="var(--dim)" stroke-width="1.6"/>
