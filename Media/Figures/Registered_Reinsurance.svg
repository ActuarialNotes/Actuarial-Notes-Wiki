<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Full MCT credit for a cession OSFI can reach, and none for one it cannot</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Credit follows the regulator's reach</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Registered ⇒ full capital credit</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">for the ceded liabilities</text>
    <rect x="30" y="100" width="143" height="120" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
    <rect x="30" y="100" width="143" height="26" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
    <text x="101.5" y="117" text-anchor="middle" class="sm bold" fill="#059669">Registered</text>
    <text x="101.5" y="146" text-anchor="middle" class="sm">OSFI licensed</text>
    <text x="101.5" y="167" text-anchor="middle" class="sm">examined and</text>
    <text x="101.5" y="188" text-anchor="middle" class="sm">supervised</text>
    <text x="101.5" y="209" text-anchor="middle" class="sm">full MCT credit</text>
    <rect x="187" y="100" width="143" height="141" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
    <rect x="187" y="100" width="143" height="26" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
    <text x="258.5" y="117" text-anchor="middle" class="sm bold" fill="#d97706">Unregistered</text>
    <text x="258.5" y="146" text-anchor="middle" class="sm">offshore or</text>
    <text x="258.5" y="167" text-anchor="middle" class="sm">a foreign parent</text>
    <text x="258.5" y="188" text-anchor="middle" class="sm">no reach</text>
    <text x="258.5" y="209" text-anchor="middle" class="sm">credit only up to</text>
    <text x="258.5" y="230" text-anchor="middle" class="sm">collateral</text>
    <line x1="30" y1="256" x2="330" y2="256" class="rule"/>
    <rect x="40" y="272" width="280" height="46" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
    <text x="180" y="292" text-anchor="middle" class="sm">registration is supervision, not strength —</text>
    <text x="180" y="309" text-anchor="middle" class="sm">counterparty analysis is still the cedant's job</text>
    <text x="180" y="342" text-anchor="middle" class="sm dim">OSFI's B-3 expectations: a documented reinsurance</text>
    <text x="180" y="358" text-anchor="middle" class="sm dim">risk policy, due diligence, and concentration limits</text>
    <text x="180" y="384" text-anchor="middle" class="sm dim">and the cedant is never released to its policyholders</text>
  </g>
</svg>
