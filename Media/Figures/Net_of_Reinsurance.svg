<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Gross losses split into the reinsurer's share and the retained net</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">What the insurer keeps after cessions</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Net = Gross − Ceded</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the cedant stays liable to its policyholders</text>
  <text x="180" y="118" text-anchor="middle" class="sm dim">AY 2024 ultimate losses ($000)</text>
  <text x="46" y="152" text-anchor="start" class="sm bold">Gross</text>
  <rect x="46" y="162" width="268" height="30" rx="4" fill="#7c3aed" fill-opacity="0.28" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="182" text-anchor="middle" class="sm">2,850</text>
  <text x="46" y="228" text-anchor="start" class="sm bold">Ceded</text>
  <rect x="46" y="238" width="75.04" height="30" rx="4" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.2"/>
  <text x="83.52" y="258" text-anchor="middle" class="sm">800</text>
  <text x="46" y="304" text-anchor="start" class="sm bold">Net</text>
  <rect x="46" y="314" width="192.96" height="30" rx="4" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="142.48" y="334" text-anchor="middle" class="sm">2,050</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">reserve gross first, then cede — never the reverse</text>
</svg>
