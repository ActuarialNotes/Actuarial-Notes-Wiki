    <circle cx="145.85" cy="268.87" r="3.2" fill="#3b82f6"/>
    <circle cx="194" cy="238.62" r="3.2" fill="#3b82f6"/>
    <circle cx="242.15" cy="206.04" r="3.2" fill="#3b82f6"/>
    <circle cx="290.3" cy="133.89" r="3.2" fill="#3b82f6"/>
    <line x1="64" y1="231.64" x2="324" y2="231.64" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <line x1="97.7" y1="306.11" x2="97.7" y2="299.13" class="thin" stroke="#059669" stroke-width="2"/>
    <line x1="145.85" y1="268.87" x2="145.85" y2="264.22" class="thin" stroke="#059669" stroke-width="2"/>
    <line x1="194" y1="238.62" x2="194" y2="236.29" class="thin" stroke="#059669" stroke-width="2"/>
    <line x1="242.15" y1="206.04" x2="242.15" y2="203.71" class="thin" stroke="#059669" stroke-width="2"/>
    <line x1="290.3" y1="154.84" x2="290.3" y2="133.89" class="thin" stroke="#059669" stroke-width="2"/>
    <text x="271.04" y="146.51" text-anchor="end" class="sm bold">actual</text>
    <text x="269.41" y="217.71" text-anchor="start" class="sm bold">predicted</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">bucket</text>
