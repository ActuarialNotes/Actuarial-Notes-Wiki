<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Directly attributable acquisition costs absorbed into the LRC — with no deferred asset left behind</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">No deferred acquisition asset any more</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">They reduce the LRC instead —</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">$24M premium less $4.8M of them</text>
    <rect x="30" y="100" width="143" height="126" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
    <rect x="30" y="100" width="143" height="28" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
    <text x="101.5" y="118" text-anchor="middle" class="sm bold" fill="#059669">Directly</text>
    <text x="101.5" y="148" text-anchor="middle" class="sm">commission</text>
    <text x="101.5" y="170" text-anchor="middle" class="sm">premium tax</text>
    <text x="101.5" y="192" text-anchor="middle" class="sm">underwriting</text>
    <text x="101.5" y="214" text-anchor="middle" class="sm">policy issue</text>
    <rect x="187" y="100" width="143" height="126" rx="7" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="187" y="100" width="143" height="28" rx="7" fill="#e11d48" fill-opacity="0.22" stroke="none"/>
    <text x="258.5" y="118" text-anchor="middle" class="sm bold" fill="#e11d48">Not</text>
    <text x="258.5" y="148" text-anchor="middle" class="sm">brand advertising</text>
    <text x="258.5" y="170" text-anchor="middle" class="sm">product design</text>
    <text x="258.5" y="192" text-anchor="middle" class="sm">sales overhead</text>
    <text x="258.5" y="214" text-anchor="middle" class="sm">IT projects</text>
    <text x="180" y="242" text-anchor="middle" class="sm dim">attributable to the portfolio, or not</text>
    <line x1="30" y1="256" x2="330" y2="256" class="rule"/>
    <text x="180" y="278" text-anchor="middle" class="sm bold">and the choice under the PAA</text>
    <rect x="40" y="293" width="136" height="26" rx="13.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="108" y="310" text-anchor="middle" class="sm">defer into the LRC</text>
    <rect x="184" y="293" width="136" height="26" rx="13.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="252" y="310" text-anchor="middle" class="sm">or expense at once</text>
    <text x="180" y="342" text-anchor="middle" class="sm dim">available only where coverage is a year or less,</text>
    <text x="180" y="358" text-anchor="middle" class="sm dim">applied consistently by group, and disclosed</text>
    <text x="180" y="384" text-anchor="middle" class="sm dim">they are fulfilment cash flows — so they feed the onerous test</text>
  </g>
</svg>
