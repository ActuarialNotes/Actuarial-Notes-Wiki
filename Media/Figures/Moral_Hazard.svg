    <line x1="192.24" y1="146" x2="282" y2="240" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
    <text x="236" y="196" text-anchor="start" class="sm">pays</text>
  </g>
</svg>
