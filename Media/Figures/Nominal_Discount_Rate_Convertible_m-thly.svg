<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A payment of 1 at time 1 carried back a quarter at a time, a slice d⁽⁴⁾/4 of its value taken off the top at the start of each quarter</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="62" y1="344" x2="308" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="70" y1="340" x2="70" y2="348" class="tick"/>
    <text x="70" y="361" text-anchor="middle" class="sm dim">0</text>
    <line x1="125" y1="340" x2="125" y2="348" class="tick"/>
    <text x="125" y="361" text-anchor="middle" class="sm dim">¼</text>
    <line x1="180" y1="340" x2="180" y2="348" class="tick"/>
    <text x="180" y="361" text-anchor="middle" class="sm dim">½</text>
    <line x1="235" y1="340" x2="235" y2="348" class="tick"/>
    <text x="235" y="361" text-anchor="middle" class="sm dim">¾</text>
    <line x1="290" y1="340" x2="290" y2="348" class="tick"/>
    <text x="290" y="361" text-anchor="middle" class="sm dim">1</text>
    <rect x="275" y="94" width="30" height="250" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="290" y="86" text-anchor="middle" class="bold">1</text>
    <rect x="220" y="119" width="30" height="225" rx="2" fill="#d97706" fill-opacity="0.7"/>
    <rect x="220" y="94" width="30" height="25" rx="2" fill="#e11d48" fill-opacity="0.25" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="250" y1="94" x2="275" y2="94" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
    <rect x="165" y="141.5" width="30" height="202.5" rx="2" fill="#d97706" fill-opacity="0.7"/>
    <rect x="165" y="119" width="30" height="22.5" rx="2" fill="#e11d48" fill-opacity="0.25" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="195" y1="119" x2="220" y2="119" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
    <rect x="110" y="161.75" width="30" height="182.25" rx="2" fill="#d97706" fill-opacity="0.7"/>
    <rect x="110" y="141.5" width="30" height="20.25" rx="2" fill="#e11d48" fill-opacity="0.25" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="140" y1="141.5" x2="165" y2="141.5" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
    <rect x="55" y="179.97" width="30" height="164.03" rx="2" fill="#d97706" fill-opacity="0.7"/>
    <rect x="55" y="161.75" width="30" height="18.22" rx="2" fill="#e11d48" fill-opacity="0.25" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="85" y1="161.75" x2="110" y2="161.75" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
    <text x="214" y="110.5" text-anchor="end" class="sm bold" fill="#e11d48">d⁽⁴⁾/4</text>
  </g>
</svg>
