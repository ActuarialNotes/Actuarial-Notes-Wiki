<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An immature accident year grown to ultimate by its cumulative development factor</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Immature years must be grown to ultimate</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Ultimate = Losses at age n × CDF(n → ult)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1,500 × 1.900 = 2,850</text>
  <line x1="107.14" y1="98" x2="107.14" y2="330" class="grid"/>
  <line x1="142.29" y1="98" x2="142.29" y2="330" class="grid"/>
  <line x1="177.43" y1="98" x2="177.43" y2="330" class="grid"/>
  <line x1="212.57" y1="98" x2="212.57" y2="330" class="grid"/>
  <line x1="247.71" y1="98" x2="247.71" y2="330" class="grid"/>
  <line x1="282.86" y1="98" x2="282.86" y2="330" class="grid"/>
  <line x1="318" y1="98" x2="318" y2="330" class="grid"/>
  <line x1="72" y1="330" x2="318" y2="330" class="grid"/>
  <line x1="72" y1="221.25" x2="318" y2="221.25" class="grid"/>
  <line x1="72" y1="112.5" x2="318" y2="112.5" class="grid"/>
  <line x1="72" y1="330" x2="328" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="330" x2="72" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="107.14" y1="330" x2="107.14" y2="334" class="tick"/>
  <text x="107.14" y="346" text-anchor="middle" class="sm dim">12</text>
  <line x1="142.29" y1="330" x2="142.29" y2="334" class="tick"/>
  <text x="142.29" y="346" text-anchor="middle" class="sm dim">24</text>
  <line x1="177.43" y1="330" x2="177.43" y2="334" class="tick"/>
  <text x="177.43" y="346" text-anchor="middle" class="sm dim">36</text>
  <line x1="212.57" y1="330" x2="212.57" y2="334" class="tick"/>
  <text x="212.57" y="346" text-anchor="middle" class="sm dim">48</text>
  <line x1="247.71" y1="330" x2="247.71" y2="334" class="tick"/>
  <text x="247.71" y="346" text-anchor="middle" class="sm dim">60</text>
  <line x1="282.86" y1="330" x2="282.86" y2="334" class="tick"/>
  <text x="282.86" y="346" text-anchor="middle" class="sm dim">72</text>
  <line x1="318" y1="330" x2="318" y2="334" class="tick"/>
  <text x="318" y="346" text-anchor="middle" class="sm dim">84</text>
  <line x1="68" y1="330" x2="72" y2="330" class="tick"/>
  <text x="64" y="333.6" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="221.25" x2="72" y2="221.25" class="tick"/>
  <text x="64" y="224.85" text-anchor="end" class="sm dim">1,500</text>
  <line x1="68" y1="112.5" x2="72" y2="112.5" class="tick"/>
  <text x="64" y="116.1" text-anchor="end" class="sm dim">3,000</text>
  <polyline points="107.14,221.25 142.29,166.88 177.43,140.77 212.57,129.39 247.71,125.41 282.86,123.74 318,123.38" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="107.14" cy="221.25" r="3" fill="#3b82f6"/>
  <circle cx="142.29" cy="166.88" r="3" fill="#3b82f6"/>
  <circle cx="177.43" cy="140.77" r="3" fill="#3b82f6"/>
  <circle cx="212.57" cy="129.39" r="3" fill="#3b82f6"/>
  <circle cx="247.71" cy="125.41" r="3" fill="#3b82f6"/>
  <circle cx="282.86" cy="123.74" r="3" fill="#3b82f6"/>
  <circle cx="318" cy="123.38" r="3" fill="#3b82f6"/>
  <line x1="72" y1="123.38" x2="318" y2="123.38" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="206.71" y="115.38" text-anchor="middle" class="sm bold" fill="#059669">ultimate 2,850</text>
  <circle cx="107.14" cy="221.25" r="4.4" fill="#e11d48"/>
  <text x="115.14" y="235.25" text-anchor="start" class="sm bold" fill="#e11d48">1,500 reported</text>
  <line x1="107.14" y1="216.9" x2="107.14" y2="127.73" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="101.14" y="170.5" text-anchor="end" class="sm bold" fill="#d97706">× 1.900</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">age in months</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">AY 2024 is 52.6% reported at 12 months</text>
</svg>
