<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five payments of different sizes drawn as dashed outlines, each discounted separately into the filled bar inside it, the filled pieces stacked at time 0 into the present value</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="48" y1="344" x2="324" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="340" x2="56" y2="348" class="tick"/>
    <text x="56" y="361" text-anchor="middle" class="sm dim">0</text>
    <line x1="106" y1="340" x2="106" y2="348" class="tick"/>
    <text x="106" y="361" text-anchor="middle" class="sm dim">1</text>
    <line x1="156" y1="340" x2="156" y2="348" class="tick"/>
    <text x="156" y="361" text-anchor="middle" class="sm dim">2</text>
    <line x1="206" y1="340" x2="206" y2="348" class="tick"/>
    <text x="206" y="361" text-anchor="middle" class="sm dim">3</text>
    <line x1="256" y1="340" x2="256" y2="348" class="tick"/>
    <text x="256" y="361" text-anchor="middle" class="sm dim">4</text>
    <line x1="306" y1="340" x2="306" y2="348" class="tick"/>
    <text x="306" y="361" text-anchor="middle" class="sm dim">5</text>
    <rect x="94" y="278" width="24" height="66" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="94" y="284" width="24" height="60" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="44" y="284" width="24" height="60" rx="2" fill="#7c3aed" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="144" y="322" width="24" height="22" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="144" y="325.82" width="24" height="18.18" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="44" y="265.82" width="24" height="18.18" rx="2" fill="#7c3aed" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="194" y="256" width="24" height="88" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="194" y="277.88" width="24" height="66.12" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="44" y="199.7" width="24" height="66.12" rx="2" fill="#7c3aed" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="244" y="300" width="24" height="44" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="244" y="313.95" width="24" height="30.05" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="44" y="169.65" width="24" height="30.05" rx="2" fill="#7c3aed" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <rect x="294" y="234" width="24" height="110" rx="2" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="294" y="275.7" width="24" height="68.3" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="44" y="101.35" width="24" height="68.3" rx="2" fill="#7c3aed" fill-opacity="0.7" stroke="var(--surf)" stroke-width="1"/>
    <text x="56" y="93.35" text-anchor="middle" class="bold">PV</text>
  </g>
</svg>
