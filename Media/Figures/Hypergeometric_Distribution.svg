<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A pool of ten policies, four of them with errors, with three drawn out of it into a sample, leaving empty places behind</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="36" y="92" width="288" height="142" rx="14" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <circle cx="72" cy="132" r="19" fill="var(--dim)" fill-opacity="0.25" stroke="var(--dim)" stroke-width="1.4"/>
    <circle cx="126" cy="132" r="19" fill="#e11d48" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.4"/>
    <circle cx="180" cy="132" r="19" fill="var(--dim)" fill-opacity="0.25" stroke="var(--dim)" stroke-width="1.4"/>
    <circle cx="234" cy="132" r="19" fill="#e11d48" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.4"/>
    <circle cx="288" cy="132" r="19" fill="var(--dim)" fill-opacity="0.25" stroke="var(--dim)" stroke-width="1.4"/>
    <circle cx="72" cy="194" r="19" fill="none" stroke="var(--edge)" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="126" cy="194" r="19" fill="var(--dim)" fill-opacity="0.25" stroke="var(--dim)" stroke-width="1.4"/>
    <circle cx="180" cy="194" r="19" fill="none" stroke="var(--edge)" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="234" cy="194" r="19" fill="var(--dim)" fill-opacity="0.25" stroke="var(--dim)" stroke-width="1.4"/>
    <circle cx="288" cy="194" r="19" fill="none" stroke="var(--edge)" stroke-width="1.4" stroke-dasharray="3 3"/>
    <rect x="92" y="294" width="176" height="76" rx="14" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <line x1="72" y1="216" x2="124" y2="306" class="thin dash" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
    <circle cx="124" cy="332" r="19" fill="#e11d48" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.4"/>
    <line x1="180" y1="216" x2="180" y2="306" class="thin dash" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
    <circle cx="180" cy="332" r="19" fill="var(--dim)" fill-opacity="0.25" stroke="var(--dim)" stroke-width="1.4"/>
    <line x1="288" y1="216" x2="236" y2="306" class="thin dash" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
    <circle cx="236" cy="332" r="19" fill="#e11d48" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.4"/>
  </g>
</svg>
