  <circle cx="236" cy="187.82" r="3.6" fill="#e11d48"/>
  <text x="228" y="181.82" text-anchor="end" class="sm bold" fill="#e11d48">$400 earned</text>
  <text x="282.2" y="267.96" text-anchor="middle" class="sm dim">$200 still</text>
  <text x="282.2" y="280.96" text-anchor="middle" class="sm dim">unearned</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">months into a $600 annual policy</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">earned premium is the ratemaking denominator</text>
</svg>
