<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Where an educational note sits — expected in practice, and binding on nobody</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="40" y="106" text-anchor="start" class="sm">Rules of Professional Conduct</text>
    <rect x="40" y="114" width="262" height="20" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
    <text x="294" y="129" text-anchor="end" class="sm">binding</text>
    <text x="40" y="154" text-anchor="start" class="sm">Standards of Practice</text>
    <rect x="40" y="162" width="225.32" height="20" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="257.32" y="177" text-anchor="end" class="sm">binding</text>
    <text x="40" y="202" text-anchor="start" class="sm">Educational notes</text>
    <rect x="40" y="210" width="141.48" height="20" rx="3" fill="#0d9488" fill-opacity="0.55"/>
    <text x="40" y="250" text-anchor="start" class="sm">Draft notes</text>
    <rect x="40" y="258" width="89.08" height="20" rx="3" fill="#059669" fill-opacity="0.55"/>
    <line x1="30" y1="302" x2="330" y2="302" class="rule"/>
    <text x="180" y="324" text-anchor="middle" class="sm dim">the standards are principles-based and prescribe</text>
    <text x="180" y="340" text-anchor="middle" class="sm dim">no method — notes are what fills that gap</text>
    <text x="180" y="366" text-anchor="middle" class="sm dim">they can lag a changed standard, and two written</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">years apart need not agree with each other</text>
  </g>
</svg>
