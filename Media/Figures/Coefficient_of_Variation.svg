  <text x="105.9" y="192" text-anchor="middle" class="sm dim">μ = 2.2</text>
  <line x1="248" y1="176" x2="248" y2="180" class="tick"/>
  <text x="248" y="192" text-anchor="middle" class="sm dim">μ = 8</text>
  <text x="48" y="48" text-anchor="start" class="sm dim">f(x)</text>
  <text x="105.9" y="55.52" text-anchor="middle" class="sm bold">CV = 0.41</text>
  <text x="248" y="55.52" text-anchor="middle" class="sm bold">CV = 0.11</text>
