<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Coupons along a timeline and, at maturity, three possible redemption payments around the dashed face-value level: above it, at it, below it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="48" y1="330" x2="306" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="326" x2="56" y2="334" class="tick"/>
    <text x="56" y="347" text-anchor="middle" class="sm dim">0</text>
    <line x1="94.67" y1="326" x2="94.67" y2="334" class="tick"/>
    <text x="94.67" y="347" text-anchor="middle" class="sm dim">1</text>
    <line x1="133.33" y1="326" x2="133.33" y2="334" class="tick"/>
    <text x="133.33" y="347" text-anchor="middle" class="sm dim">2</text>
    <line x1="172" y1="326" x2="172" y2="334" class="tick"/>
    <text x="172" y="347" text-anchor="middle" class="sm dim">…</text>
    <line x1="210.67" y1="326" x2="210.67" y2="334" class="tick"/>
    <line x1="249.33" y1="326" x2="249.33" y2="334" class="tick"/>
    <line x1="288" y1="326" x2="288" y2="334" class="tick"/>
    <text x="288" y="347" text-anchor="middle" class="sm dim">n</text>
    <line x1="94.67" y1="330" x2="94.67" y2="294" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="133.33" y1="330" x2="133.33" y2="294" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="172" y1="330" x2="172" y2="294" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="210.67" y1="330" x2="210.67" y2="294" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="249.33" y1="330" x2="249.33" y2="294" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="288" y1="330" x2="288" y2="294" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="94.67" y="286" text-anchor="middle" class="sm bold">Fr</text>
    <line x1="82.67" y1="160" x2="256" y2="160" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="78.67" y="164" text-anchor="end" class="bold">F</text>
    <line x1="272" y1="330" x2="272" y2="194" class="thin" stroke="#e11d48" stroke-width="2.2" marker-end="url(#ahe11d48)"/>
    <text x="272" y="188" text-anchor="middle" class="sm bold">C &lt; F</text>
    <line x1="288" y1="330" x2="288" y2="160" class="thin" stroke="#059669" stroke-width="2.2" marker-end="url(#ah059669)"/>
    <text x="288" y="154" text-anchor="middle" class="sm bold">C = F</text>
    <line x1="304" y1="330" x2="304" y2="122.6" class="thin" stroke="#d97706" stroke-width="2.2" marker-end="url(#ahd97706)"/>
    <text x="304" y="116.6" text-anchor="middle" class="sm bold">C &gt; F</text>
  </g>
</svg>
