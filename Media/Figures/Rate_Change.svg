<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Indicated and selected rate changes for 2021–2025 drawn as two lines, the selected always below, with the gap between them shaded</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="89" y1="106" x2="89" y2="350" class="grid"/>
    <line x1="141.5" y1="106" x2="141.5" y2="350" class="grid"/>
    <line x1="194" y1="106" x2="194" y2="350" class="grid"/>
    <line x1="246.5" y1="106" x2="246.5" y2="350" class="grid"/>
    <line x1="299" y1="106" x2="299" y2="350" class="grid"/>
    <line x1="68" y1="350" x2="320" y2="350" class="grid"/>
    <line x1="68" y1="273.75" x2="320" y2="273.75" class="grid"/>
    <line x1="68" y1="197.5" x2="320" y2="197.5" class="grid"/>
    <line x1="68" y1="121.25" x2="320" y2="121.25" class="grid"/>
    <line x1="68" y1="350" x2="330" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="350" x2="68" y2="96" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="89" y1="350" x2="89" y2="354" class="tick"/>
    <text x="89" y="366" text-anchor="middle" class="sm dim">2021</text>
    <line x1="141.5" y1="350" x2="141.5" y2="354" class="tick"/>
    <text x="141.5" y="366" text-anchor="middle" class="sm dim">2022</text>
    <line x1="194" y1="350" x2="194" y2="354" class="tick"/>
    <text x="194" y="366" text-anchor="middle" class="sm dim">2023</text>
    <line x1="246.5" y1="350" x2="246.5" y2="354" class="tick"/>
    <text x="246.5" y="366" text-anchor="middle" class="sm dim">2024</text>
    <line x1="299" y1="350" x2="299" y2="354" class="tick"/>
    <text x="299" y="366" text-anchor="middle" class="sm dim">2025</text>
    <line x1="64" y1="350" x2="68" y2="350" class="tick"/>
    <text x="60" y="353.6" text-anchor="end" class="sm dim">0%</text>
    <line x1="64" y1="273.75" x2="68" y2="273.75" class="tick"/>
    <text x="60" y="277.35" text-anchor="end" class="sm dim">5%</text>
    <line x1="64" y1="197.5" x2="68" y2="197.5" class="tick"/>
    <text x="60" y="201.1" text-anchor="end" class="sm dim">10%</text>
    <line x1="64" y1="121.25" x2="68" y2="121.25" class="tick"/>
    <text x="60" y="124.85" text-anchor="end" class="sm dim">15%</text>
    <polygon points="89,176.15 141.5,200.55 194,148.7 246.5,218.85 299,238.64 299,273.75 246.5,243.25 194,212.75 141.5,243.25 89,243.25" fill="#e11d48" fill-opacity="0.16" stroke="none"/>
    <polyline points="89,176.15 141.5,200.55 194,148.7 246.5,218.85 299,238.64" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <circle cx="89" cy="176.15" r="3.6" fill="#3b82f6"/>
    <circle cx="141.5" cy="200.55" r="3.6" fill="#3b82f6"/>
    <circle cx="194" cy="148.7" r="3.6" fill="#3b82f6"/>
    <circle cx="246.5" cy="218.85" r="3.6" fill="#3b82f6"/>
    <circle cx="299" cy="238.64" r="3.6" fill="#3b82f6"/>
    <polyline points="89,243.25 141.5,243.25 194,212.75 246.5,243.25 299,273.75" class="curve" stroke="#d97706" stroke-width="2.4"/>
    <circle cx="89" cy="243.25" r="3.6" fill="#d97706"/>
    <circle cx="141.5" cy="243.25" r="3.6" fill="#d97706"/>
    <circle cx="194" cy="212.75" r="3.6" fill="#d97706"/>
    <circle cx="246.5" cy="243.25" r="3.6" fill="#d97706"/>
    <circle cx="299" cy="273.75" r="3.6" fill="#d97706"/>
    <text x="89" y="166.15" text-anchor="middle" class="sm bold">indicated</text>
    <text x="89" y="261.25" text-anchor="middle" class="sm bold">selected</text>
    <text x="194" y="184.72" text-anchor="middle" class="sm dim">gap</text>
  </g>
</svg>
