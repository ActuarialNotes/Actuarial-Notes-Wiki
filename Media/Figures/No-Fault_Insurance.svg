<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The trade a no-fault scheme makes — first-party benefits at once against the right to sue</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Certainty of benefit bought with the</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">right to sue</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Benefits from your own insurer,</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">whoever caused the collision</text>
    <rect x="30" y="98" width="143" height="134" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
    <rect x="30" y="98" width="143" height="28" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
    <text x="101.5" y="116" text-anchor="middle" class="sm bold" fill="#059669">You gain</text>
    <text x="101.5" y="146" text-anchor="middle" class="sm">payment in weeks</text>
    <text x="101.5" y="170" text-anchor="middle" class="sm">no fault to prove</text>
    <text x="101.5" y="194" text-anchor="middle" class="sm">everyone covered</text>
    <text x="101.5" y="218" text-anchor="middle" class="sm">lower legal cost</text>
    <rect x="187" y="98" width="143" height="134" rx="7" fill="#e11d48" fill-opacity="0.08" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="187" y="98" width="143" height="28" rx="7" fill="#e11d48" fill-opacity="0.22" stroke="none"/>
    <text x="258.5" y="116" text-anchor="middle" class="sm bold" fill="#e11d48">You give up</text>
    <text x="258.5" y="146" text-anchor="middle" class="sm">the tort action</text>
    <text x="258.5" y="170" text-anchor="middle" class="sm">pain and suffering</text>
    <text x="258.5" y="194" text-anchor="middle" class="sm">full damages</text>
    <text x="258.5" y="218" text-anchor="middle" class="sm">deterrence</text>
    <text x="180" y="244" text-anchor="middle" class="sm bold">Canadian schemes are almost all partial</text>
    <rect x="40" y="262" width="280" height="30" rx="5" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="40" y="262" width="168" height="30" rx="5" fill="#3b82f6" fill-opacity="0.34" stroke="none"/>
    <text x="124" y="281" text-anchor="middle" class="sm">accident benefits</text>
    <text x="264" y="281" text-anchor="middle" class="sm">tort above</text>
    <line x1="208" y1="256" x2="208" y2="300" class="thin dash" stroke="#e11d48" stroke-width="1.4"/>
    <text x="208" y="314" text-anchor="middle" class="sm" fill="#e11d48">threshold</text>
    <text x="180" y="348" text-anchor="middle" class="sm dim">Quebec and Manitoba bodily injury are pure —</text>
    <text x="180" y="364" text-anchor="middle" class="sm dim">the tort action is gone entirely</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">severity risk becomes frequency risk</text>
  </g>
</svg>
