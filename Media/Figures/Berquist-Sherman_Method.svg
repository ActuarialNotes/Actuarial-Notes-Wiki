<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Historical case reserves restated onto the latest year's adequacy before factors are selected</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Restate the triangle onto today's</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">practice</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Adj Case = Case(latest, n) × (1 + t)^−k</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Adj Reported = Paid + Adj Case</text>
  <line x1="96.17" y1="106" x2="96.17" y2="318" class="grid"/>
  <line x1="146.58" y1="106" x2="146.58" y2="318" class="grid"/>
  <line x1="197" y1="106" x2="197" y2="318" class="grid"/>
  <line x1="247.42" y1="106" x2="247.42" y2="318" class="grid"/>
  <line x1="297.83" y1="106" x2="297.83" y2="318" class="grid"/>
  <line x1="76" y1="318" x2="318" y2="318" class="grid"/>
  <line x1="76" y1="219.07" x2="318" y2="219.07" class="grid"/>
  <line x1="76" y1="120.13" x2="318" y2="120.13" class="grid"/>
  <line x1="76" y1="318" x2="328" y2="318" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="318" x2="76" y2="96" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="96.17" y1="318" x2="96.17" y2="322" class="tick"/>
  <text x="96.17" y="334" text-anchor="middle" class="sm dim">2020</text>
  <line x1="146.58" y1="318" x2="146.58" y2="322" class="tick"/>
  <text x="146.58" y="334" text-anchor="middle" class="sm dim">2021</text>
  <line x1="197" y1="318" x2="197" y2="322" class="tick"/>
  <text x="197" y="334" text-anchor="middle" class="sm dim">2022</text>
  <line x1="247.42" y1="318" x2="247.42" y2="322" class="tick"/>
  <text x="247.42" y="334" text-anchor="middle" class="sm dim">2023</text>
  <line x1="297.83" y1="318" x2="297.83" y2="322" class="tick"/>
  <text x="297.83" y="334" text-anchor="middle" class="sm dim">2024</text>
  <line x1="72" y1="318" x2="76" y2="318" class="tick"/>
  <text x="68" y="321.6" text-anchor="end" class="sm dim">0</text>
  <line x1="72" y1="219.07" x2="76" y2="219.07" class="tick"/>
  <text x="68" y="222.67" text-anchor="end" class="sm dim">700</text>
  <line x1="72" y1="120.13" x2="76" y2="120.13" class="tick"/>
  <text x="68" y="123.73" text-anchor="end" class="sm dim">1,400</text>
  <rect x="78.02" y="230.37" width="17.14" height="87.63" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="97.17" y="193.63" width="17.14" height="124.37" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="128.44" y="224.72" width="17.14" height="93.28" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="147.58" y="185.15" width="17.14" height="132.85" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="178.86" y="216.24" width="17.14" height="101.76" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="198" y="175.25" width="17.14" height="142.75" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="229.27" y="190.8" width="17.14" height="127.2" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="248.42" y="163.95" width="17.14" height="154.05" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="279.69" y="151.23" width="17.14" height="166.77" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="298.83" y="151.23" width="17.14" height="166.77" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <line x1="120" y1="100" x2="133" y2="100" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="139" y="103.6" text-anchor="start" class="sm">as reported</text>
  <line x1="232" y1="100" x2="245" y2="100" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="251" y="103.6" text-anchor="start" class="sm">restated</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">average case outstanding at 12 months</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">case adequacy strengthened, so old years are</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">raised to it — then factors are reselected</text>
</svg>
