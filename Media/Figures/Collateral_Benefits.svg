<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Accident benefits deducted head by head from a tort award, before contributory negligence and the deductible</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Deducted head by head, not off the total</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Net = damages − deductible benefits</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">income against income, care against care</text>
  <text x="180" y="100" text-anchor="middle" class="sm dim">$500,000 assessed, by head ($000)</text>
  <text x="44" y="124" text-anchor="start" class="sm">income loss</text>
  <rect x="44" y="132" width="202.4" height="22" rx="3" fill="#3b82f6" fill-opacity="0.40"/>
  <rect x="168.2" y="132" width="78.2" height="22" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="207.3" y="148" text-anchor="middle" class="sm">−85</text>
  <text x="254.4" y="148" text-anchor="start" class="sm dim">220</text>
  <text x="44" y="180" text-anchor="start" class="sm">future care</text>
  <rect x="44" y="188" width="119.6" height="22" rx="3" fill="#0d9488" fill-opacity="0.40"/>
  <rect x="126.8" y="188" width="36.8" height="22" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="145.2" y="204" text-anchor="middle" class="sm">−40</text>
  <text x="171.6" y="204" text-anchor="start" class="sm dim">130</text>
  <text x="44" y="236" text-anchor="start" class="sm">non-pecuniary</text>
  <rect x="44" y="244" width="138" height="22" rx="3" fill="#d97706" fill-opacity="0.40"/>
  <text x="190" y="260" text-anchor="start" class="sm dim">150</text>
  <text x="180" y="302" text-anchor="middle" class="sm" fill="#e11d48">the red is the accident benefit already paid</text>
  <text x="180" y="332" text-anchor="middle" class="sm dim">then contributory negligence, then the tort</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">deductible on the non-pecuniary head — in that order</text>
  <text x="180" y="378" text-anchor="middle" class="sm dim">where a benefit is not deducted, its payer subrogates</text>
</svg>
