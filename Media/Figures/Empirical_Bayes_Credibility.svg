  <circle cx="193.71" cy="280.93" r="2.8" fill="#059669"/>
  <circle cx="199.13" cy="186.65" r="2.8" fill="#059669"/>
  <line x1="180.16" y1="220.33" x2="201.84" y2="220.33" class="thin" stroke="#059669" stroke-width="2.2"/>
  <circle cx="232.13" cy="157.71" r="2.8" fill="#7c3aed"/>
  <circle cx="237.55" cy="141.22" r="2.8" fill="#7c3aed"/>
