<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The share of the premium dollar left for losses once expenses and profit are provided for</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">What is left for losses after everything</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">else</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PLR = 1 − V − Q_T = 1 − 0.26 − 0.05 = 0.69</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Change = (Proj Ratio + F%) / PLR − 1</text>
  <text x="180" y="122" text-anchor="middle" class="sm dim">the premium dollar, from the top down</text>
  <rect x="88" y="148" width="96" height="49.4" rx="4" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.2"/>
  <text x="198" y="176.7" text-anchor="start" class="sm bold">V  26%</text>
  <rect x="88" y="197.4" width="96" height="9.5" rx="4" fill="#059669" fill-opacity="0.32" stroke="#059669" stroke-width="1.2"/>
  <text x="198" y="206.15" text-anchor="start" class="sm bold">Q  5%</text>
  <rect x="88" y="206.9" width="96" height="131.1" rx="4" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="198" y="276.45" text-anchor="start" class="sm bold">PLR  69%</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">raise V or Q and the PLR falls, so the same</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">loss ratio becomes an inadequate one</text>
</svg>
