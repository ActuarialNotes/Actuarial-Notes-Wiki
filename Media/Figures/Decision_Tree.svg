<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A tree of binary splits and the rectangles it carves out of predictor space</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Recursive binary splits of predictor</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">space</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">split to minimize RSS (or Gini / entropy)</text>
  <circle cx="180" cy="106" r="9" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="92" text-anchor="middle" class="sm dim">age &lt; 25?</text>
  <line x1="174" y1="113" x2="106" y2="146" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <text x="138" y="128" text-anchor="middle" class="sm dim">yes</text>
  <line x1="186" y1="113" x2="254" y2="146" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <text x="222" y="128" text-anchor="middle" class="sm dim">no</text>
  <circle cx="106" cy="154" r="9" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="106" y="142" text-anchor="middle" class="sm dim">power &gt; 150?</text>
  <rect x="236" y="146" width="36" height="18" rx="3" fill="#059669" fill-opacity="0.5"/>
  <text x="254" y="159" text-anchor="middle" class="sm">R₃</text>
  <line x1="100" y1="161" x2="68" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="50" y="190" width="36" height="18" rx="3" fill="#059669" fill-opacity="0.5"/>
  <text x="68" y="203" text-anchor="middle" class="sm">R₁</text>
  <line x1="112" y1="161" x2="144" y2="190" class="thin" stroke="var(--axis)" stroke-width="1.2"/>
  <rect x="126" y="190" width="36" height="18" rx="3" fill="#059669" fill-opacity="0.5"/>
  <text x="144" y="203" text-anchor="middle" class="sm">R₂</text>
  <line x1="66" y1="348" x2="316" y2="348" class="axis"/>
  <line x1="66" y1="236" x2="66" y2="348" class="axis"/>
  <rect x="66" y="236" width="250" height="112" rx="4" fill="var(--soft)" stroke="var(--edge)"/>
  <rect x="66" y="236" width="112.5" height="50.4" fill="#3b82f6" fill-opacity="0.16"/>
  <rect x="66" y="286.4" width="112.5" height="61.6" fill="#d97706" fill-opacity="0.16"/>
  <rect x="178.5" y="236" width="137.5" height="112" fill="#059669" fill-opacity="0.16"/>
  <line x1="178.5" y1="236" x2="178.5" y2="348" class="thin" stroke="var(--ink)" stroke-width="1.4"/>
  <line x1="66" y1="286.4" x2="178.5" y2="286.4" class="thin" stroke="var(--ink)" stroke-width="1.4"/>
  <text x="121" y="316.64" text-anchor="middle" class="sm bold">R₁</text>
  <text x="121" y="260.64" text-anchor="middle" class="sm bold">R₂</text>
  <text x="246" y="292" text-anchor="middle" class="sm bold">R₃</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">age →,  power ↑</text>
</svg>
