<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A waterfall on a broken axis: the running insurer's $260M of equity, less $8M of goodwill and $4M of other intangibles, leaving $248M of capital available</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="48" y="110" width="48" height="234" rx="3" fill="#059669" fill-opacity="0.7"/>
    <text x="72" y="102" text-anchor="middle" class="sm bold">260</text>
    <text x="72" y="362" text-anchor="middle" class="sm dim">equity</text>
    <line x1="45" y1="328" x2="99" y2="320" stroke="var(--surf)" stroke-width="2.4"/>
    <line x1="45" y1="322" x2="99" y2="314" stroke="var(--surf)" stroke-width="2.4"/>
    <rect x="120" y="110" width="48" height="31.2" rx="3" fill="#e11d48" fill-opacity="0.7"/>
    <text x="144" y="102" text-anchor="middle" class="sm bold">8</text>
    <text x="144" y="362" text-anchor="middle" class="sm dim">goodwill</text>
    <rect x="192" y="141.2" width="48" height="15.6" rx="3" fill="#e11d48" fill-opacity="0.7"/>
    <text x="216" y="133.2" text-anchor="middle" class="sm bold">4</text>
    <text x="216" y="362" text-anchor="middle" class="sm dim">intangibles</text>
    <rect x="264" y="156.8" width="48" height="187.2" rx="3" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="288" y="148.8" text-anchor="middle" class="sm bold">248</text>
    <text x="288" y="362" text-anchor="middle" class="sm dim">available</text>
    <line x1="261" y1="328" x2="315" y2="320" stroke="var(--surf)" stroke-width="2.4"/>
    <line x1="261" y1="322" x2="315" y2="314" stroke="var(--surf)" stroke-width="2.4"/>
    <line x1="96" y1="110" x2="120" y2="110" class="thin dot" stroke="var(--dim)"/>
    <line x1="168" y1="141.2" x2="192" y2="141.2" class="thin dot" stroke="var(--dim)"/>
    <line x1="240" y1="156.8" x2="264" y2="156.8" class="thin dot" stroke="var(--dim)"/>
    <line x1="30" y1="344" x2="330" y2="344" class="axis"/>
  </g>
</svg>
