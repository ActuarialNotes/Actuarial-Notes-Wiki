<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>One year of interest split into m sub-period credits</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The periodic rate is i⁽ᵐ⁾ / m</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">(1 + i⁽ᵐ⁾/m)ᵐ = 1 + i</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1.03⁴ = 1.1255,  so i = 12.55%</text>
  <line x1="52" y1="220" x2="318" y2="220" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="216" x2="60" y2="224" class="tick"/>
  <text x="60" y="237" text-anchor="middle" class="sm dim">0</text>
  <line x1="120" y1="216" x2="120" y2="224" class="tick"/>
  <text x="120" y="237" text-anchor="middle" class="sm dim">¼</text>
  <line x1="180" y1="216" x2="180" y2="224" class="tick"/>
  <text x="180" y="237" text-anchor="middle" class="sm dim">½</text>
  <line x1="240" y1="216" x2="240" y2="224" class="tick"/>
  <text x="240" y="237" text-anchor="middle" class="sm dim">¾</text>
  <line x1="300" y1="216" x2="300" y2="224" class="tick"/>
  <text x="300" y="237" text-anchor="middle" class="sm dim">1</text>
  <line x1="66" y1="180" x2="114" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#ah3b82f6)"/>
  <text x="90" y="172" text-anchor="middle" class="sm" fill="#3b82f6">× 1.03</text>
  <line x1="126" y1="180" x2="174" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#ah3b82f6)"/>
  <text x="150" y="172" text-anchor="middle" class="sm" fill="#3b82f6">× 1.03</text>
  <line x1="186" y1="180" x2="234" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#ah3b82f6)"/>
  <text x="210" y="172" text-anchor="middle" class="sm" fill="#3b82f6">× 1.03</text>
  <line x1="246" y1="180" x2="294" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#ah3b82f6)"/>
  <text x="270" y="172" text-anchor="middle" class="sm" fill="#3b82f6">× 1.03</text>
  <text x="180" y="142" text-anchor="middle" class="bold" fill="#3b82f6">i⁽⁴⁾ / 4 = 3% each quarter</text>
  <text x="60" y="260" text-anchor="middle" class="sm dim">1</text>
  <text x="300" y="260" text-anchor="middle" class="sm dim">1.1255</text>
  <text x="180" y="330" text-anchor="middle" class="sm dim">a quoted rate is not an earned rate</text>
</svg>
