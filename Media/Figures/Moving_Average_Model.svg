    <polyline points="64,188.01 71.65,206.37 79.29,177.92 86.94,259.76 94.59,193.24 102.24,253.76 109.88,230.71 117.53,148.57 125.18,134.26 132.82,277.81 140.47,217.39 148.12,224.34 155.76,298.75 163.41,256.49 171.06,272.31 178.71,292.35 186.35,231.88 194,248.49 201.65,233.09 209.29,232.18 216.94,209.23 224.59,221.2 232.24,182.41 239.88,142.41 247.53,223.38" class="curve" stroke="#3b82f6" stroke-width="1.9"/>
