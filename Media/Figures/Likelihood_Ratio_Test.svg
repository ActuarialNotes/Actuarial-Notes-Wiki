<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Two nested log-likelihoods and the deviance drop between them</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Compare the fits of nested models</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">−2 ln Λ = 2[ℓ(full) − ℓ(reduced)]</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">≈ χ²_r under H₀</text>
  <line x1="74" y1="328" x2="336" y2="328" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="328" x2="74" y2="96" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="70" y1="296.29" x2="74" y2="296.29" class="tick"/>
  <text x="66" y="299.89" text-anchor="end" class="sm dim">-416</text>
  <line x1="70" y1="232.86" x2="74" y2="232.86" class="tick"/>
  <text x="66" y="236.46" text-anchor="end" class="sm dim">-412</text>
  <line x1="70" y1="169.43" x2="74" y2="169.43" class="tick"/>
  <text x="66" y="173.03" text-anchor="end" class="sm dim">-408</text>
  <text x="70" y="92" text-anchor="start" class="sm dim">log-likelihood</text>
  <line x1="74" y1="155.16" x2="326" y2="155.16" class="thin" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="74" y1="242.37" x2="326" y2="242.37" class="thin" stroke="#d97706" stroke-width="1.3"/>
  <text x="82.4" y="144.06" text-anchor="start" class="sm" fill="#3b82f6">full model</text>
  <text x="82.4" y="262.99" text-anchor="start" class="sm" fill="#d97706">reduced model</text>
  <line x1="267.2" y1="242.37" x2="267.2" y2="155.16" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="275.2" y="202.76" text-anchor="start" class="sm bold" fill="#e11d48">5.5</text>
  <text x="180" y="364" text-anchor="middle" class="bold">−2 ln Λ = 11.0 on 2 df</text>
  <text x="180" y="382" text-anchor="middle" class="sm dim">χ²₀.₀₅,₂ = 5.99 → reject the reduced model</text>
</svg>
