<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An excess-of-loss treaty cutting each claim into the cedant's retention, the reinsured layer and the excess above it</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The insurer's own insurance</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Net = Gross − Ceded</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Ceded_XOL = min(max(X − R, 0), L)</text>
  <line x1="74" y1="316" x2="320" y2="316" class="grid"/>
  <line x1="74" y1="277.79" x2="320" y2="277.79" class="grid"/>
  <line x1="74" y1="163.14" x2="320" y2="163.14" class="grid"/>
  <line x1="74" y1="102" x2="320" y2="102" class="grid"/>
  <line x1="74" y1="316" x2="330" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="316" x2="74" y2="92" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="70" y1="316" x2="74" y2="316" class="tick"/>
  <text x="66" y="319.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="277.79" x2="74" y2="277.79" class="tick"/>
  <text x="66" y="281.39" text-anchor="end" class="sm dim">500</text>
  <line x1="70" y1="163.14" x2="74" y2="163.14" class="tick"/>
  <text x="66" y="166.74" text-anchor="end" class="sm dim">2,000</text>
  <line x1="70" y1="102" x2="74" y2="102" class="tick"/>
  <text x="66" y="105.6" text-anchor="end" class="sm dim">2,800</text>
  <rect x="87.96" y="302.24" width="18.62" height="13.76" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="121.21" y="277.79" width="18.62" height="38.21" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="121.21" y="268.61" width="18.62" height="9.17" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="154.45" y="293.07" width="18.62" height="22.93" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="187.69" y="277.79" width="18.62" height="38.21" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="187.69" y="209" width="18.62" height="68.79" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="220.94" y="277.79" width="18.62" height="38.21" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="220.94" y="163.14" width="18.62" height="114.64" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="220.94" y="117.29" width="18.62" height="45.86" rx="2" fill="#e11d48" fill-opacity="0.72"/>
  <rect x="254.18" y="297.66" width="18.62" height="18.34" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="287.42" y="277.79" width="18.62" height="38.21" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="287.42" y="247.21" width="18.62" height="30.57" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <line x1="74" y1="277.79" x2="320" y2="277.79" class="thin" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="74" y1="163.14" x2="320" y2="163.14" class="thin" stroke="#d97706" stroke-width="1.3"/>
  <text x="180" y="346" text-anchor="middle" class="sm dim">individual claims ($000)</text>
  <line x1="46" y1="368" x2="59" y2="368" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="65" y="371.6" text-anchor="start" class="sm">retained 500</text>
  <line x1="182" y1="368" x2="195" y2="368" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="201" y="371.6" text-anchor="start" class="sm">1,500 xs 500</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">the layer above the treaty comes back to the cedant</text>
</svg>
