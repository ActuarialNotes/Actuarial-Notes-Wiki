<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The two liabilities, the three measurement models, and which one a Canadian P&amp;C insurer actually uses</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">One current-value model, in force since</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">2023</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Insurance contract liability = LRC + LIC</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">future service, and claims already incurred</text>
    <rect x="38" y="100" width="128" height="62" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="102" y="125" text-anchor="middle" class="sm">LRC</text>
    <text x="102" y="143" text-anchor="middle" class="sm dim">service not yet given</text>
    <rect x="194" y="100" width="128" height="62" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
    <text x="258" y="125" text-anchor="middle" class="sm">LIC</text>
    <text x="258" y="143" text-anchor="middle" class="sm dim">claims already incurred</text>
    <line x1="30" y1="180" x2="330" y2="180" class="rule"/>
    <text x="180" y="202" text-anchor="middle" class="sm bold">three measurement models</text>
    <rect x="34" y="220" width="292" height="36" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.2"/>
    <text x="46" y="243" text-anchor="start" class="sm bold" fill="#0d9488">GMM</text>
    <text x="314" y="243" text-anchor="end" class="sm dim">the default — building blocks</text>
    <rect x="34" y="264" width="292" height="36" rx="6" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.2"/>
    <text x="46" y="287" text-anchor="start" class="sm bold" fill="#059669">PAA</text>
    <text x="314" y="287" text-anchor="end" class="sm dim">short contracts — most Canadian P&amp;C</text>
    <rect x="34" y="308" width="292" height="36" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="46" y="331" text-anchor="start" class="sm bold" fill="#7c3aed">VFA</text>
    <text x="314" y="331" text-anchor="end" class="sm dim">direct participating — not P&amp;C</text>
    <text x="180" y="372" text-anchor="middle" class="sm dim">discounting is mandatory, the RA replaced MfADs,</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">and reinsurance held is never netted</text>
  </g>
</svg>
