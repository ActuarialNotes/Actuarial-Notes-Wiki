<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A set function mapping events to real numbers</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A set function maps sets to numbers</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">f : 𝓕 → ℝ</text>
  <rect x="30" y="84" width="176" height="176" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="43" y="100" text-anchor="middle" class="sm dim">S</text>
  <ellipse cx="118" cy="116" rx="56" ry="20" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="118" y="121" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <ellipse cx="118" cy="172" rx="56" ry="20" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.4"/>
  <text x="118" y="177" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <ellipse cx="118" cy="228" rx="56" ry="20" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.4"/>
  <text x="118" y="233" text-anchor="middle" class="bold" fill="#059669">C</text>
  <text x="192" y="100" text-anchor="end" class="sm dim">𝓕</text>
  <line x1="268" y1="276" x2="268" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="260" y="82" text-anchor="end" class="sm dim">ℝ</text>
  <line x1="178" y1="116" x2="258" y2="130.4" class="thin dash" stroke="#3b82f6" stroke-width="1.1" marker-end="url(#ah3b82f6)"/>
  <line x1="264" y1="130.4" x2="272" y2="130.4" class="tick"/>
  <circle cx="268" cy="130.4" r="4" fill="#3b82f6"/>
  <line x1="178" y1="172" x2="258" y2="185.44" class="thin dash" stroke="#d97706" stroke-width="1.1" marker-end="url(#ahd97706)"/>
  <line x1="264" y1="185.44" x2="272" y2="185.44" class="tick"/>
  <circle cx="268" cy="185.44" r="4" fill="#d97706"/>
  <line x1="178" y1="228" x2="258" y2="237.04" class="thin dash" stroke="#059669" stroke-width="1.1" marker-end="url(#ah059669)"/>
  <line x1="264" y1="237.04" x2="272" y2="237.04" class="tick"/>
  <circle cx="268" cy="237.04" r="4" fill="#059669"/>
  <text x="280" y="134.4" text-anchor="start" class="sm" fill="#3b82f6">f(A)</text>
  <text x="280" y="189.44" text-anchor="start" class="sm" fill="#d97706">f(B)</text>
  <text x="280" y="241.04" text-anchor="start" class="sm" fill="#059669">f(C)</text>
  <text x="180" y="320" text-anchor="middle" class="sm dim">probability is the set function with f(S) = 1</text>
</svg>
