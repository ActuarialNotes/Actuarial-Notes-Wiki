<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Provincial disaster cost per capita along the bottom: the federal share, shaded, steps up from nothing to 50%, 75% and 90% as the cost grows, and the province bears the rest</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="72" y="90" width="25" height="262" fill="#d97706" fill-opacity="0.16" stroke="none"/>
    <rect x="97" y="90" width="50" height="131" fill="#d97706" fill-opacity="0.16" stroke="none"/>
    <rect x="97" y="221" width="50" height="131" fill="#3b82f6" fill-opacity="0.30" stroke="none"/>
    <rect x="147" y="90" width="75" height="65.5" fill="#d97706" fill-opacity="0.16" stroke="none"/>
    <rect x="147" y="155.5" width="75" height="196.5" fill="#3b82f6" fill-opacity="0.30" stroke="none"/>
    <rect x="222" y="90" width="100" height="26.2" fill="#d97706" fill-opacity="0.16" stroke="none"/>
    <rect x="222" y="116.2" width="100" height="235.8" fill="#3b82f6" fill-opacity="0.30" stroke="none"/>
    <polyline points="72,352 97,352 97,221 147,221 147,155.5 222,155.5 222,116.2 322,116.2" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <line x1="72" y1="352" x2="332" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="352" x2="72" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="221" x2="72" y2="221" class="tick"/>
    <text x="64" y="224.6" text-anchor="end" class="sm dim">50%</text>
    <line x1="68" y1="155.5" x2="72" y2="155.5" class="tick"/>
    <text x="64" y="159.1" text-anchor="end" class="sm dim">75%</text>
    <line x1="68" y1="116.2" x2="72" y2="116.2" class="tick"/>
    <text x="64" y="119.8" text-anchor="end" class="sm dim">90%</text>
    <line x1="68" y1="90" x2="72" y2="90" class="tick"/>
    <text x="64" y="93.6" text-anchor="end" class="sm dim">100%</text>
    <text x="238.67" y="241.96" text-anchor="middle" class="bold">Ottawa</text>
    <text x="184.5" y="131.92" text-anchor="middle" class="bold">province</text>
    <text x="322" y="372" text-anchor="end" class="sm dim">cost per capita</text>
  </g>
</svg>
