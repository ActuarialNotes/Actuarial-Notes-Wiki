<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A shifting disposal rate distorting paid development</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">How much of the year is closed, by age</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Disposal Rate = closed ÷ ultimate counts</text>
  <line x1="94.33" y1="108" x2="94.33" y2="316" class="grid"/>
  <line x1="145.17" y1="108" x2="145.17" y2="316" class="grid"/>
  <line x1="196" y1="108" x2="196" y2="316" class="grid"/>
  <line x1="246.83" y1="108" x2="246.83" y2="316" class="grid"/>
  <line x1="297.67" y1="108" x2="297.67" y2="316" class="grid"/>
  <line x1="74" y1="316" x2="318" y2="316" class="grid"/>
  <line x1="74" y1="229.33" x2="318" y2="229.33" class="grid"/>
  <line x1="74" y1="142.67" x2="318" y2="142.67" class="grid"/>
  <line x1="74" y1="316" x2="328" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="316" x2="74" y2="98" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="94.33" y1="316" x2="94.33" y2="320" class="tick"/>
  <text x="94.33" y="332" text-anchor="middle" class="sm dim">2020</text>
  <line x1="145.17" y1="316" x2="145.17" y2="320" class="tick"/>
  <text x="145.17" y="332" text-anchor="middle" class="sm dim">2021</text>
  <line x1="196" y1="316" x2="196" y2="320" class="tick"/>
  <text x="196" y="332" text-anchor="middle" class="sm dim">2022</text>
  <line x1="246.83" y1="316" x2="246.83" y2="320" class="tick"/>
  <text x="246.83" y="332" text-anchor="middle" class="sm dim">2023</text>
  <line x1="297.67" y1="316" x2="297.67" y2="320" class="tick"/>
  <text x="297.67" y="332" text-anchor="middle" class="sm dim">2024</text>
  <line x1="70" y1="316" x2="74" y2="316" class="tick"/>
  <text x="66" y="319.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="70" y1="229.33" x2="74" y2="229.33" class="tick"/>
  <text x="66" y="232.93" text-anchor="end" class="sm dim">30%</text>
  <line x1="70" y1="142.67" x2="74" y2="142.67" class="tick"/>
  <text x="66" y="146.27" text-anchor="end" class="sm dim">60%</text>
  <rect x="77.56" y="217.78" width="33.55" height="98.22" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
  <rect x="128.39" y="214.89" width="33.55" height="101.11" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
  <rect x="179.22" y="212" width="33.55" height="104" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
  <rect x="230.06" y="180.22" width="33.55" height="135.78" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
  <rect x="280.89" y="165.78" width="33.55" height="150.22" rx="1.5" fill="#0d9488" fill-opacity="0.72"/>
  <line x1="74" y1="214.89" x2="318" y2="214.89" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="312.92" y="207.89" text-anchor="end" class="sm dim">old level</text>
  <text x="180" y="346" text-anchor="middle" class="sm dim">claims closed at 12 months, by accident year</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">paid factors then fall for reasons that have</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">nothing to do with what the claims will cost</text>
</svg>
