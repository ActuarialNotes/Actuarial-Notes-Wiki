<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running GMM group's $60M premium split into $44M of outflows, a $5M risk adjustment and an $11M CSM, and the CSM released as profit over three years of coverage: $4.4M, $3.85M and $2.75M</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <path d="M40,112 v-6 H175 q5,0 5,-5.5 q0,5.5 5,5.5 H320 v6" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="180" y="89" text-anchor="middle" class="sm bold">premium 60</text>
    <rect x="40" y="118" width="205.33" height="44" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.3"/>
    <text x="142.67" y="144" text-anchor="middle" class="sm bold">outflows 44</text>
    <rect x="245.33" y="118" width="23.33" height="44" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="257" y="144" text-anchor="middle" class="sm bold">RA</text>
    <rect x="268.67" y="118" width="51.33" height="44" rx="4" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.3"/>
    <text x="294.33" y="144" text-anchor="middle" class="sm bold">CSM 11</text>
    <line x1="294.33" y1="168" x2="258" y2="226" class="thin" stroke="#059669" stroke-width="1.6" marker-end="url(#ah059669)"/>
    <rect x="76" y="220" width="48" height="132" rx="3" fill="#059669" fill-opacity="0.55"/>
    <text x="100" y="213" text-anchor="middle" class="sm">4.4</text>
    <text x="100" y="369" text-anchor="middle" class="sm dim">yr 1</text>
    <rect x="156" y="236.5" width="48" height="115.5" rx="3" fill="#059669" fill-opacity="0.55"/>
    <text x="180" y="229.5" text-anchor="middle" class="sm">3.85</text>
    <text x="180" y="369" text-anchor="middle" class="sm dim">yr 2</text>
    <rect x="236" y="269.5" width="48" height="82.5" rx="3" fill="#059669" fill-opacity="0.55"/>
    <text x="260" y="262.5" text-anchor="middle" class="sm">2.75</text>
