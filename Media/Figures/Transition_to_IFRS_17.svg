<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three bars running back in time from the transition date: full retrospective reaching all the way to inception, modified retrospective approximating the early years, and fair value measured at transition alone — the two fallbacks reached only if the first is impracticable</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="44" y1="364" x2="312" y2="364" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="360" x2="56" y2="368" class="tick"/>
    <text x="56" y="382" text-anchor="middle" class="sm dim">inception</text>
    <line x1="282" y1="360" x2="282" y2="368" class="tick"/>
    <text x="282" y="382" text-anchor="middle" class="sm dim">transition</text>
    <line x1="282" y1="86" x2="282" y2="364" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="56" y="104" width="226" height="28" rx="4" fill="#059669" fill-opacity="0.6"/>
    <rect x="56" y="204" width="112" height="28" rx="4" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="168" y="204" width="114" height="28" rx="4" fill="#d97706" fill-opacity="0.6"/>
    <circle cx="282" cy="318" r="10" fill="#0d9488" fill-opacity="0.7" stroke="#0d9488" stroke-width="1.4"/>
    <text x="276" y="96" text-anchor="end" class="sm bold">full retrospective</text>
    <text x="276" y="196" text-anchor="end" class="sm bold">modified</text>
    <text x="276" y="296" text-anchor="end" class="sm bold">fair value</text>
    <line x1="282" y1="118" x2="318" y2="118" class="thin" stroke="#e11d48" stroke-width="1.5"/>
    <line x1="318" y1="118" x2="318" y2="318" class="thin" stroke="#e11d48" stroke-width="1.5"/>
    <line x1="318" y1="218" x2="285" y2="218" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
    <line x1="318" y1="318" x2="295" y2="318" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
    <text x="312" y="172" text-anchor="end" class="sm">impracticable</text>
  </g>
</svg>
