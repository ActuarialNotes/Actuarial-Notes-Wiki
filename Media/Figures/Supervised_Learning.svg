<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Labelled points fitted by a boundary, against unlabelled points with no answer to fit</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Every training point carries its answer</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">fit f̂ minimizing Σ L(yᵢ, f(xᵢ))</text>
  <line x1="54" y1="316" x2="326" y2="316" class="axis"/>
  <line x1="54" y1="100" x2="54" y2="316" class="axis"/>
  <rect x="54" y="100" width="272" height="216" rx="6" fill="var(--soft)" stroke="var(--edge)"/>
  <circle cx="223.19" cy="228.46" r="3.4" fill="#3b82f6"/>
  <circle cx="156.71" cy="271.89" r="3.4" fill="#3b82f6"/>
  <circle cx="158.71" cy="169.4" r="3.4" fill="#e11d48"/>
  <circle cx="261.35" cy="213.87" r="3.4" fill="#3b82f6"/>
  <circle cx="242.87" cy="155.25" r="3.4" fill="#e11d48"/>
  <circle cx="120.6" cy="289.17" r="3.4" fill="#3b82f6"/>
  <circle cx="151.33" cy="282.19" r="3.4" fill="#3b82f6"/>
  <circle cx="164.43" cy="122.84" r="3.4" fill="#e11d48"/>
  <circle cx="199.66" cy="276.17" r="3.4" fill="#3b82f6"/>
  <circle cx="254.4" cy="261.12" r="3.4" fill="#3b82f6"/>
  <circle cx="254.74" cy="264.79" r="3.4" fill="#3b82f6"/>
  <circle cx="264.28" cy="242.79" r="3.4" fill="#3b82f6"/>
  <circle cx="85.71" cy="156.33" r="3.4" fill="#e11d48"/>
  <circle cx="138.38" cy="237.6" r="3.4" fill="#3b82f6"/>
  <circle cx="141.13" cy="136.87" r="3.4" fill="#e11d48"/>
  <circle cx="100.72" cy="165.95" r="3.4" fill="#e11d48"/>
  <circle cx="107.25" cy="217.44" r="3.4" fill="#e11d48"/>
  <circle cx="273.87" cy="149.9" r="3.4" fill="#3b82f6"/>
  <circle cx="109.39" cy="132.4" r="3.4" fill="#e11d48"/>
  <circle cx="163.1" cy="184.39" r="3.4" fill="#e11d48"/>
  <circle cx="170.31" cy="285.88" r="3.4" fill="#3b82f6"/>
  <circle cx="93.39" cy="286.54" r="3.4" fill="#3b82f6"/>
  <circle cx="176.53" cy="209" r="3.4" fill="#e11d48"/>
  <circle cx="267.67" cy="221.48" r="3.4" fill="#3b82f6"/>
  <circle cx="100.89" cy="235.98" r="3.4" fill="#e11d48"/>
  <circle cx="186.82" cy="235.59" r="3.4" fill="#3b82f6"/>
  <polyline points="64.88,284.9 315.12,115.98" class="curve" stroke="var(--ink)" stroke-width="2"/>
  <text x="255.28" y="121.6" text-anchor="middle" class="sm bold">f̂</text>
  <line x1="54" y1="330" x2="67" y2="330" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="73" y="333.6" text-anchor="start" class="sm">claim</text>
  <line x1="158" y1="330" x2="171" y2="330" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="177" y="333.6" text-anchor="start" class="sm">no claim</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">regression → numeric Y · classification → class Y</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">scored against the label it was given</text>
</svg>
