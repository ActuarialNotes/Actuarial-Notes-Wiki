<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The current value of a differenced series drawn as a node fed by arrows from its own past values (AR) and from past shocks (MA), with the series row tinted for differencing (I)</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahvarink" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--ink)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="86" y="148" width="236" height="60" rx="30" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="224" y1="178" x2="271" y2="178" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <polyline points="116,160 120.4,156.29 124.8,152.78 129.2,149.46 133.6,146.32 138,143.38 142.4,140.62 146.8,138.05 151.2,135.68 155.6,133.5 160,131.5 164.4,129.69 168.8,128.08 173.2,126.66 177.6,125.42 182,124.38 186.4,123.52 190.8,122.85 195.2,122.38 199.6,122.09 204,122 208.4,122.09 212.8,122.38 217.2,122.86 221.6,123.52 226,124.38 230.4,125.42 234.8,126.66 239.2,128.08 243.6,129.69 248,131.5 252.4,133.5 256.8,135.68 261.2,138.06 265.6,140.62 270,143.38 274.4,146.32" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <line x1="274.4" y1="146.32" x2="289.36" y2="157.75" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="215" y1="303" x2="278" y2="192" class="thin" stroke="#059669" stroke-width="2" marker-end="url(#ah059669)"/>
    <line x1="292" y1="297" x2="292" y2="199" class="thin" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ahvarink)"/>
    <circle cx="116" cy="178" r="18" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="116" cy="314" r="15" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.5"/>
    <circle cx="204" cy="178" r="18" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="204" cy="314" r="15" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.5"/>
    <circle cx="292" cy="178" r="18" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2.4"/>
    <circle cx="292" cy="314" r="15" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.5"/>
    <text x="116" y="348" text-anchor="middle" class="sm dim">t−2</text>
    <text x="204" y="348" text-anchor="middle" class="sm dim">t−1</text>
    <text x="292" y="348" text-anchor="middle" class="sm dim">t</text>
    <text x="24" y="183" text-anchor="start" class="bold">∇ᵈY</text>
    <text x="24" y="319" text-anchor="start" class="bold">ε</text>
    <text x="204" y="116" text-anchor="middle" class="sm bold">AR(p)</text>
    <text x="262" y="250" text-anchor="end" class="sm bold">MA(q)</text>
    <text x="160" y="230" text-anchor="middle" class="sm bold">I(d)</text>
  </g>
</svg>
