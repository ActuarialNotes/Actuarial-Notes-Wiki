<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The parallelogram method: a mid-year rate change earning over the unit square</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The parallelogram method reads areas as</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">weights</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">area at the new level = ½(1 − p)²</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">p = 0.5 ⇒ 0.125 of CY 2023 earned premium</text>
    <rect x="96" y="122" width="168" height="168" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <polygon points="180,290 264,290 264,206" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.3"/>
    <text x="237.12" y="266.48" text-anchor="middle" class="sm bold" fill="#059669">0.125</text>
    <text x="153.12" y="192.56" text-anchor="middle" class="sm bold" fill="#3b82f6">0.875</text>
    <text x="153.12" y="216.08" text-anchor="middle" class="sm dim">old rates</text>
    <text x="237.12" y="239.6" text-anchor="middle" class="sm dim" fill="#059669">new</text>
    <line x1="180" y1="290" x2="180" y2="298" class="tick"/>
    <text x="180" y="312" text-anchor="middle" class="sm dim">7/1</text>
    <text x="180" y="332" text-anchor="middle" class="sm dim">calendar year 2023 →</text>
    <text x="88" y="206" text-anchor="end" class="sm dim">fraction of</text>
    <text x="88" y="220" text-anchor="end" class="sm dim">term elapsed</text>
    <text x="180" y="372" text-anchor="middle" class="sm dim">uniform writing, one policy term — where those</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">fail, extend exposures instead</text>
  </g>
</svg>
