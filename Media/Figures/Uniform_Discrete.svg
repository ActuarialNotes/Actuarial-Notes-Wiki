<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 274" width="560" height="274" role="img">
  <title>The discrete uniform PMF and CDF for a fair die</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="272.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Discrete uniform: every one of n values is equally likely</text>
  <line x1="73.66" y1="178" x2="73.66" y2="98.83" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="73.66" cy="98.83" r="3.2" fill="#3b82f6"/>
  <line x1="104.59" y1="178" x2="104.59" y2="98.83" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="104.59" cy="98.83" r="3.2" fill="#3b82f6"/>
  <line x1="135.53" y1="178" x2="135.53" y2="98.83" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="135.53" cy="98.83" r="3.2" fill="#3b82f6"/>
  <line x1="166.47" y1="178" x2="166.47" y2="98.83" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="166.47" cy="98.83" r="3.2" fill="#3b82f6"/>
  <line x1="197.41" y1="178" x2="197.41" y2="98.83" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="197.41" cy="98.83" r="3.2" fill="#3b82f6"/>
  <line x1="228.34" y1="178" x2="228.34" y2="98.83" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="228.34" cy="98.83" r="3.2" fill="#3b82f6"/>
  <line x1="52" y1="178" x2="260" y2="178" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="52" y1="178" x2="52" y2="54" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="73.66" y1="178" x2="73.66" y2="182" class="tick"/>
  <text x="73.66" y="194" text-anchor="middle" class="sm dim">1</text>
  <line x1="104.59" y1="178" x2="104.59" y2="182" class="tick"/>
  <text x="104.59" y="194" text-anchor="middle" class="sm dim">2</text>
  <line x1="135.53" y1="178" x2="135.53" y2="182" class="tick"/>
  <text x="135.53" y="194" text-anchor="middle" class="sm dim">3</text>
  <line x1="166.47" y1="178" x2="166.47" y2="182" class="tick"/>
  <text x="166.47" y="194" text-anchor="middle" class="sm dim">4</text>
  <line x1="197.41" y1="178" x2="197.41" y2="182" class="tick"/>
  <text x="197.41" y="194" text-anchor="middle" class="sm dim">5</text>
  <line x1="228.34" y1="178" x2="228.34" y2="182" class="tick"/>
  <text x="228.34" y="194" text-anchor="middle" class="sm dim">6</text>
  <line x1="48" y1="98.83" x2="52" y2="98.83" class="tick"/>
  <text x="44" y="102.43" text-anchor="end" class="sm dim">1/6</text>
  <text x="250" y="210" text-anchor="end" class="sm dim">k</text>
  <text x="48" y="50" text-anchor="start" class="sm dim">P(X = k)</text>
  <text x="151" y="216" text-anchor="middle" class="sm dim">PMF — a fair die, n = 6</text>
  <line x1="336" y1="178" x2="530" y2="178" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="336" y1="178" x2="336" y2="54" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="355.52" y1="178" x2="355.52" y2="182" class="tick"/>
  <text x="355.52" y="194" text-anchor="middle" class="sm dim">1</text>
  <line x1="383.39" y1="178" x2="383.39" y2="182" class="tick"/>
  <text x="383.39" y="194" text-anchor="middle" class="sm dim">2</text>
  <line x1="411.27" y1="178" x2="411.27" y2="182" class="tick"/>
  <text x="411.27" y="194" text-anchor="middle" class="sm dim">3</text>
  <line x1="439.15" y1="178" x2="439.15" y2="182" class="tick"/>
  <text x="439.15" y="194" text-anchor="middle" class="sm dim">4</text>
  <line x1="467.03" y1="178" x2="467.03" y2="182" class="tick"/>
  <text x="467.03" y="194" text-anchor="middle" class="sm dim">5</text>
  <line x1="494.91" y1="178" x2="494.91" y2="182" class="tick"/>
  <text x="494.91" y="194" text-anchor="middle" class="sm dim">6</text>
  <line x1="332" y1="178" x2="336" y2="178" class="tick"/>
  <text x="328" y="181.6" text-anchor="end" class="sm dim">0</text>
  <line x1="332" y1="126.18" x2="336" y2="126.18" class="tick"/>
  <text x="328" y="129.78" text-anchor="end" class="sm dim">0.5</text>
  <line x1="332" y1="74.36" x2="336" y2="74.36" class="tick"/>
  <text x="328" y="77.96" text-anchor="end" class="sm dim">1</text>
  <text x="520" y="210" text-anchor="end" class="sm dim">k</text>
  <text x="332" y="50" text-anchor="start" class="sm dim">F(k)</text>
  <line x1="355.52" y1="160.73" x2="383.39" y2="160.73" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="355.52" y1="178" x2="355.52" y2="160.73" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="355.52" cy="160.73" r="3" fill="#7c3aed"/>
  <line x1="383.39" y1="143.45" x2="411.27" y2="143.45" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="383.39" y1="160.73" x2="383.39" y2="143.45" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="383.39" cy="143.45" r="3" fill="#7c3aed"/>
  <line x1="411.27" y1="126.18" x2="439.15" y2="126.18" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="411.27" y1="143.45" x2="411.27" y2="126.18" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="411.27" cy="126.18" r="3" fill="#7c3aed"/>
  <line x1="439.15" y1="108.91" x2="467.03" y2="108.91" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="439.15" y1="126.18" x2="439.15" y2="108.91" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="439.15" cy="108.91" r="3" fill="#7c3aed"/>
  <line x1="467.03" y1="91.64" x2="494.91" y2="91.64" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="467.03" y1="108.91" x2="467.03" y2="91.64" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="467.03" cy="91.64" r="3" fill="#7c3aed"/>
  <line x1="494.91" y1="74.36" x2="520" y2="74.36" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="494.91" y1="91.64" x2="494.91" y2="74.36" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="494.91" cy="74.36" r="3" fill="#7c3aed"/>
  <text x="428" y="216" text-anchor="middle" class="sm dim">CDF — a staircase of 1/n jumps</text>
  <line x1="28" y1="216" x2="532" y2="216" class="rule"/>
  <text x="150" y="238" text-anchor="middle" class="sm bold">E[X] = (n+1)/2 = 3.5</text>
  <text x="150" y="256" text-anchor="middle" class="sm dim">Var(X) = (n²−1)/12 = 35/12 ≈ 2.92</text>
  <text x="400" y="238" text-anchor="middle" class="sm bold">Spread depends only on how many values</text>
  <text x="400" y="256" text-anchor="middle" class="sm dim">not on where the range sits</text>
</svg>
