<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <title>Coupon rate against yield rate, and the pricing it implies</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Coupon rate is fixed at issue; yield is set by the market</text>
  <rect x="84" y="76.88" width="88" height="99.12" rx="4" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="1.3"/>
  <line x1="72" y1="92" x2="184" y2="92" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="128" y="130.44" text-anchor="middle" class="sm bold">P &gt; C</text>
  <text x="128" y="194" text-anchor="middle" class="sm bold">r &gt; j</text>
  <text x="128" y="210" text-anchor="middle" class="sm dim">premium</text>
  <rect x="236" y="92" width="88" height="84" rx="4" fill="#059669" fill-opacity="0.35" stroke="#059669" stroke-width="1.3"/>
  <line x1="224" y1="92" x2="336" y2="92" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="280" y="138" text-anchor="middle" class="sm bold">P = C</text>
  <text x="280" y="194" text-anchor="middle" class="sm bold">r = j</text>
  <text x="280" y="210" text-anchor="middle" class="sm dim">par</text>
  <rect x="388" y="105.44" width="88" height="70.56" rx="4" fill="#3b82f6" fill-opacity="0.35" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="376" y1="92" x2="488" y2="92" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="432" y="144.72" text-anchor="middle" class="sm bold">P &lt; C</text>
  <text x="432" y="194" text-anchor="middle" class="sm bold">r &lt; j</text>
  <text x="432" y="210" text-anchor="middle" class="sm dim">discount</text>
  <text x="60" y="96" text-anchor="end" class="sm dim">C</text>
  <line x1="28" y1="230" x2="532" y2="230" class="rule"/>
  <text x="150" y="252" text-anchor="middle" class="sm bold">r = coupon / F</text>
  <text x="150" y="272" text-anchor="middle" class="sm dim">stated per coupon period, fixed for life</text>
  <text x="412" y="252" text-anchor="middle" class="sm bold">The comparison that matters is Fr vs Cj</text>
  <text x="412" y="272" text-anchor="middle" class="sm dim">not r vs j, unless C = F</text>
</svg>
