<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>AY 2024's 2,850 ultimate stacked as paid, case and IBNR, with the 1,500 reported bracketed on one side and the 2,250 unpaid on the other</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="140" y="313.05" width="80" height="58.95" rx="3" fill="#059669" fill-opacity="0.34" stroke="#059669" stroke-width="1.2"/>
    <text x="180" y="346.53" text-anchor="middle" class="sm bold">paid 600</text>
    <rect x="140" y="224.63" width="80" height="88.42" rx="3" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="272.84" text-anchor="middle" class="sm bold">case 900</text>
    <rect x="140" y="92" width="80" height="132.63" rx="3" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="162.32" text-anchor="middle" class="sm bold">IBNR 1,350</text>
    <text x="180" y="82" text-anchor="middle" class="sm bold">ultimate 2,850</text>
    <path d="M134,372.0 H128 V224.6 H134" class="thin" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="120" y="302.32" text-anchor="end" class="sm">reported 1,500</text>
    <path d="M226,313.1 H232 V92.0 H226" class="thin" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="240" y="206.53" text-anchor="start" class="sm">unpaid 2,250</text>
  </g>
</svg>
