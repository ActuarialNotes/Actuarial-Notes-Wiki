  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Any shape a proportion can take</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">f(x) ∝ x^(α−1) (1 − x)^(β−1)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[X] = α/(α + β);  α = β = 1 is uniform</text>
  <text x="180" y="90" text-anchor="middle" class="sm dim">each curve is labelled (α, β)</text>
