<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Counting ordered arrangements versus unordered selections</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Choosing k from n: the two questions</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(n, k) = n! / (n − k)!</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">C(n, k) = P(n, k) / k!</text>
  <text x="159" y="100" text-anchor="middle" class="sm dim">no repeats</text>
  <text x="281" y="100" text-anchor="middle" class="sm dim">repeats</text>
  <text x="92" y="144" text-anchor="end" class="sm bold">Order</text>
  <text x="92" y="160" text-anchor="end" class="sm bold">matters</text>
  <rect x="100" y="110" width="118" height="80" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="159" y="144" text-anchor="middle" class="sm mono">n!/(n−k)!</text>
  <text x="159" y="168" text-anchor="middle" class="bold" fill="#7c3aed">12</text>
  <rect x="222" y="110" width="118" height="80" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="281" y="144" text-anchor="middle" class="sm mono">nᵏ</text>
  <text x="281" y="168" text-anchor="middle" class="bold" fill="#d97706">16</text>
  <text x="92" y="240" text-anchor="end" class="sm bold">Order</text>
  <text x="92" y="256" text-anchor="end" class="sm bold">ignored</text>
  <rect x="100" y="206" width="118" height="80" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="159" y="240" text-anchor="middle" class="sm mono">n!/[k!(n−k)!]</text>
  <text x="159" y="264" text-anchor="middle" class="bold" fill="#059669">6</text>
  <rect x="222" y="206" width="118" height="80" rx="7" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.2"/>
  <text x="281" y="240" text-anchor="middle" class="sm mono">C(n+k−1, k)</text>
  <text x="281" y="264" text-anchor="middle" class="bold" fill="#0d9488">10</text>
  <text x="180" y="326" text-anchor="middle" class="sm dim">counts for n = 4, k = 2</text>
</svg>
