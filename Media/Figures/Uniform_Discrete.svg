<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The discrete uniform PMF and CDF for a fair die</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Discrete uniform: n equally likely</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">values</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">E[X] = (n + 1)/2 = 3.5</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Var(X) = (n² − 1)/12 ≈ 2.92</text>
  <line x1="96.22" y1="208" x2="96.22" y2="126.06" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="96.22" cy="126.06" r="3.2" fill="#3b82f6"/>
  <line x1="136.53" y1="208" x2="136.53" y2="126.06" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="136.53" cy="126.06" r="3.2" fill="#3b82f6"/>
  <line x1="176.84" y1="208" x2="176.84" y2="126.06" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="176.84" cy="126.06" r="3.2" fill="#3b82f6"/>
  <line x1="217.16" y1="208" x2="217.16" y2="126.06" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="217.16" cy="126.06" r="3.2" fill="#3b82f6"/>
  <line x1="257.47" y1="208" x2="257.47" y2="126.06" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="257.47" cy="126.06" r="3.2" fill="#3b82f6"/>
  <line x1="297.78" y1="208" x2="297.78" y2="126.06" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="297.78" cy="126.06" r="3.2" fill="#3b82f6"/>
  <line x1="68" y1="208" x2="336" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="208" x2="68" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="96.22" y1="208" x2="96.22" y2="212" class="tick"/>
  <text x="96.22" y="224" text-anchor="middle" class="sm dim">1</text>
  <line x1="136.53" y1="208" x2="136.53" y2="212" class="tick"/>
  <text x="136.53" y="224" text-anchor="middle" class="sm dim">2</text>
  <line x1="176.84" y1="208" x2="176.84" y2="212" class="tick"/>
  <text x="176.84" y="224" text-anchor="middle" class="sm dim">3</text>
  <line x1="217.16" y1="208" x2="217.16" y2="212" class="tick"/>
  <text x="217.16" y="224" text-anchor="middle" class="sm dim">4</text>
  <line x1="257.47" y1="208" x2="257.47" y2="212" class="tick"/>
  <text x="257.47" y="224" text-anchor="middle" class="sm dim">5</text>
  <line x1="297.78" y1="208" x2="297.78" y2="212" class="tick"/>
  <text x="297.78" y="224" text-anchor="middle" class="sm dim">6</text>
  <line x1="64" y1="126.06" x2="68" y2="126.06" class="tick"/>
  <text x="60" y="129.66" text-anchor="end" class="sm dim">1/6</text>
  <text x="64" y="76" text-anchor="start" class="sm dim">P(X = k)</text>
  <line x1="68" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="350" x2="68" y2="240" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="95.36" y1="350" x2="95.36" y2="354" class="tick"/>
  <text x="95.36" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="134.45" y1="350" x2="134.45" y2="354" class="tick"/>
  <text x="134.45" y="366" text-anchor="middle" class="sm dim">2</text>
  <line x1="173.55" y1="350" x2="173.55" y2="354" class="tick"/>
  <text x="173.55" y="366" text-anchor="middle" class="sm dim">3</text>
  <line x1="212.64" y1="350" x2="212.64" y2="354" class="tick"/>
  <text x="212.64" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="251.73" y1="350" x2="251.73" y2="354" class="tick"/>
  <text x="251.73" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="290.82" y1="350" x2="290.82" y2="354" class="tick"/>
  <text x="290.82" y="366" text-anchor="middle" class="sm dim">6</text>
  <line x1="64" y1="350" x2="68" y2="350" class="tick"/>
  <text x="60" y="353.6" text-anchor="end" class="sm dim">0</text>
  <line x1="64" y1="259.09" x2="68" y2="259.09" class="tick"/>
  <text x="60" y="262.69" text-anchor="end" class="sm dim">1</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">k</text>
  <text x="64" y="236" text-anchor="start" class="sm dim">F(k)</text>
  <line x1="95.36" y1="334.85" x2="134.45" y2="334.85" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="95.36" y1="350" x2="95.36" y2="334.85" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="95.36" cy="334.85" r="3" fill="#7c3aed"/>
  <line x1="134.45" y1="319.7" x2="173.55" y2="319.7" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="134.45" y1="334.85" x2="134.45" y2="319.7" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="134.45" cy="319.7" r="3" fill="#7c3aed"/>
  <line x1="173.55" y1="304.55" x2="212.64" y2="304.55" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="173.55" y1="319.7" x2="173.55" y2="304.55" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="173.55" cy="304.55" r="3" fill="#7c3aed"/>
  <line x1="212.64" y1="289.39" x2="251.73" y2="289.39" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="212.64" y1="304.55" x2="212.64" y2="289.39" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="212.64" cy="289.39" r="3" fill="#7c3aed"/>
  <line x1="251.73" y1="274.24" x2="290.82" y2="274.24" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="251.73" y1="289.39" x2="251.73" y2="274.24" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="251.73" cy="274.24" r="3" fill="#7c3aed"/>
  <line x1="290.82" y1="259.09" x2="326" y2="259.09" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <line x1="290.82" y1="274.24" x2="290.82" y2="259.09" class="curve dash" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="290.82" cy="259.09" r="3" fill="#7c3aed"/>
</svg>
