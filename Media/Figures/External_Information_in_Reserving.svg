<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Thin internal experience blended with an industry development pattern</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Borrow a pattern when your own is too</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">thin</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Selected = Z × own + (1 − Z) × industry</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">0.30 × 1.62 + 0.70 × 1.48 = 1.52</text>
  <line x1="122.4" y1="102" x2="122.4" y2="308" class="grid"/>
  <line x1="170.8" y1="102" x2="170.8" y2="308" class="grid"/>
  <line x1="219.2" y1="102" x2="219.2" y2="308" class="grid"/>
  <line x1="267.6" y1="102" x2="267.6" y2="308" class="grid"/>
  <line x1="316" y1="102" x2="316" y2="308" class="grid"/>
  <line x1="74" y1="298.19" x2="316" y2="298.19" class="grid"/>
  <line x1="74" y1="200.1" x2="316" y2="200.1" class="grid"/>
  <line x1="74" y1="102" x2="316" y2="102" class="grid"/>
  <line x1="74" y1="308" x2="326" y2="308" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="308" x2="74" y2="92" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="122.4" y1="308" x2="122.4" y2="312" class="tick"/>
  <text x="122.4" y="324" text-anchor="middle" class="sm dim">12</text>
  <line x1="170.8" y1="308" x2="170.8" y2="312" class="tick"/>
  <text x="170.8" y="324" text-anchor="middle" class="sm dim">24</text>
  <line x1="219.2" y1="308" x2="219.2" y2="312" class="tick"/>
  <text x="219.2" y="324" text-anchor="middle" class="sm dim">36</text>
  <line x1="267.6" y1="308" x2="267.6" y2="312" class="tick"/>
  <text x="267.6" y="324" text-anchor="middle" class="sm dim">48</text>
  <line x1="316" y1="308" x2="316" y2="312" class="tick"/>
  <text x="316" y="324" text-anchor="middle" class="sm dim">60</text>
  <line x1="70" y1="298.19" x2="74" y2="298.19" class="tick"/>
  <text x="66" y="301.79" text-anchor="end" class="sm dim">1.0</text>
  <line x1="70" y1="200.1" x2="74" y2="200.1" class="tick"/>
  <text x="66" y="203.7" text-anchor="end" class="sm dim">1.5</text>
  <line x1="70" y1="102" x2="74" y2="102" class="tick"/>
  <text x="66" y="105.6" text-anchor="end" class="sm dim">2.0</text>
  <polyline points="122.4,204.02 170.8,266.8 219.2,284.46 267.6,292.3 316,296.23" class="curve dash" stroke="#d97706" stroke-width="2.2"/>
  <circle cx="122.4" cy="176.55" r="3.6" fill="#3b82f6"/>
  <circle cx="170.8" cy="280.53" r="3.6" fill="#3b82f6"/>
  <circle cx="219.2" cy="270.72" r="3.6" fill="#3b82f6"/>
  <circle cx="267.6" cy="300.15" r="3.6" fill="#3b82f6"/>
  <circle cx="316" cy="292.3" r="3.6" fill="#3b82f6"/>
  <polyline points="122.4,176.55 170.8,280.53 219.2,270.72 267.6,300.15 316,292.3" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="195" y="156.93" text-anchor="middle" class="sm bold" fill="#3b82f6">own data — 4 observations</text>
  <text x="259.53" y="243.26" text-anchor="middle" class="sm bold" fill="#d97706">industry</text>
  <text x="180" y="338" text-anchor="middle" class="sm dim">age-to-age factors by age in months</text>
  <text x="180" y="364" text-anchor="middle" class="sm dim">an industry pattern is a complement, not a</text>
  <text x="180" y="382" text-anchor="middle" class="sm dim">substitute — check the mix and limits behind it</text>
</svg>
