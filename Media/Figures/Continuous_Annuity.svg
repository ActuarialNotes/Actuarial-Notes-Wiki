  <line x1="64" y1="204" x2="330" y2="204" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="204" x2="64" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="204" x2="64" y2="208" class="tick"/>
  <text x="64" y="220" text-anchor="middle" class="sm dim">0</text>
  <line x1="268.8" y1="204" x2="268.8" y2="208" class="tick"/>
  <text x="268.8" y="220" text-anchor="middle" class="sm dim">n</text>
  <line x1="60" y1="143.09" x2="64" y2="143.09" class="tick"/>
  <text x="56" y="146.69" text-anchor="end" class="sm dim">0.5</text>
  <line x1="60" y1="82.18" x2="64" y2="82.18" class="tick"/>
  <text x="56" y="85.78" text-anchor="end" class="sm dim">1</text>
  <text x="320" y="236" text-anchor="end" class="sm dim">time t</text>
  <text x="60" y="56" text-anchor="start" class="sm dim">v^t = e^(−δt)</text>
  <text x="151.04" y="162.58" text-anchor="middle" class="sm bold">ā₍ₙ₎ = ∫₀ⁿ v^t dt</text>
  <line x1="268.8" y1="204" x2="268.8" y2="127.57" class="thin dash" stroke="#0d9488" stroke-width="1.3"/>
  <text x="424" y="100" text-anchor="middle" class="sm bold">ā₍ₙ₎ = (1 − vⁿ)/δ</text>
  <text x="424" y="120" text-anchor="middle" class="sm dim">s̄₍ₙ₎ = ((1+i)ⁿ − 1)/δ</text>
  <rect x="330" y="140" width="196" height="58" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="428" y="160" text-anchor="middle" class="sm bold">Only the denominator changes</text>
  <text x="428" y="178" text-anchor="middle" class="sm dim">a₍ₙ₎ uses i, ā₍ₙ₎ uses δ</text>
  <rect x="330" y="206" width="196" height="58" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="428" y="226" text-anchor="middle" class="sm bold">δ &lt; i, so ā₍ₙ₎ &gt; a₍ₙ₎</text>
  <text x="428" y="244" text-anchor="middle" class="sm dim">money arriving sooner is worth more</text>
  <text x="280" y="278" text-anchor="middle" class="sm dim">s̄₍ₙ₎ = (1 + i)ⁿ ā₍ₙ₎ — the same two-date move as always</text>
</svg>
