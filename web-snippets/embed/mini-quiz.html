<div class="an-quiz" data-answer="1">
  <div class="an-quiz-tag">Quick Check · Probability</div>
  <div class="an-quiz-question">
    You flip a fair coin 3 times. What's the probability all three flips
    show the <em>same</em> result (HHH or TTT)?
  </div>

  <div class="an-quiz-options" role="radiogroup" aria-label="Answer options">
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="0">
      <span class="an-quiz-letter">A</span><span class="an-quiz-text">1/8</span>
    </button>
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="1">
      <span class="an-quiz-letter">B</span><span class="an-quiz-text">1/4</span>
    </button>
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="2">
      <span class="an-quiz-letter">C</span><span class="an-quiz-text">1/2</span>
    </button>
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="3">
      <span class="an-quiz-letter">D</span><span class="an-quiz-text">3/8</span>
    </button>
  </div>

  <div class="an-quiz-explain" role="status" aria-live="polite">
    <div class="an-quiz-explain-title"></div>
    <div class="an-quiz-explain-text">
      P(HHH) = (1/2)<sup>3</sup> = 1/8, and P(TTT) = 1/8. The two outcomes
      can't both happen, so P(same result) = 1/8 + 1/8 = <strong>1/4</strong>.
    </div>
    <button type="button" class="an-quiz-retry">Try again</button>
  </div>
</div>

<style>

<script>
(function () {
  // One delegated listener on the document, rather than handlers bound to each
  // quiz. That matters inside a page builder: Elementor (and any CMS that
  // re-renders a widget, loads it over AJAX, or swaps it in the live editor)
  // replaces the markup after this script has run, which would strip
  // per-element handlers and leave dead buttons. Delegation keeps working no
  // matter when the markup appears or reappears.
  //
  // Every handler reads the quiz's state back out of the DOM, so there is no
  // per-instance state to lose and any number of quizzes can share this one
  // listener.
  if (window.__anQuizBound) return;
  window.__anQuizBound = true;

  function reset(quiz) {
    var explainTitle = quiz.querySelector('.an-quiz-explain-title');
    quiz.classList.remove('an-is-answered');
    explainTitle.textContent = '';
    explainTitle.className = 'an-quiz-explain-title';
    quiz.querySelectorAll('.an-quiz-option').forEach(function (opt) {
      opt.disabled = false;
      opt.classList.remove('an-is-correct', 'an-is-wrong');
      opt.setAttribute('aria-checked', 'false');
    });
  }

  function answer(quiz, index) {
    var answerIndex = parseInt(quiz.dataset.answer, 10);
    var explainTitle = quiz.querySelector('.an-quiz-explain-title');
    var correct = index === answerIndex;

    quiz.querySelectorAll('.an-quiz-option').forEach(function (opt, i) {
      opt.disabled = true;
      if (i === answerIndex) opt.classList.add('an-is-correct');
      if (i === index && !correct) opt.classList.add('an-is-wrong');
      opt.setAttribute('aria-checked', i === index ? 'true' : 'false');
    });

    explainTitle.textContent = correct ? 'Correct!' : 'Not quite — here’s why:';
    explainTitle.classList.add(correct ? 'an-good' : 'an-bad');
    quiz.classList.add('an-is-answered');
    quiz.dispatchEvent(new CustomEvent('an-quiz-answered', {
      bubbles: true,
      detail: { correct: correct }
    }));
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;

    var retry = e.target.closest('.an-quiz-retry');
    if (retry) {
      var retryQuiz = retry.closest('.an-quiz');
      if (retryQuiz) reset(retryQuiz);
      return;
    }

    var opt = e.target.closest('.an-quiz-option');
    if (!opt || opt.disabled) return;
    var quiz = opt.closest('.an-quiz');
    if (quiz) answer(quiz, parseInt(opt.dataset.index, 10));
  });
})();
</script>
