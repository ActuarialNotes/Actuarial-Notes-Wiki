<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Two groups' inflows against their fulfilment cash flows: where inflows exceed them the margin is deferred as CSM, and where the fulfilment cash flows exceed the inflows the excess is a loss recognised at once</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="62" y="130" width="44" height="200" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="112" y="158" width="44" height="172" rx="3" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <rect x="112" y="130" width="44" height="28" rx="3" fill="#059669" fill-opacity="0.40" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="134" y="122" text-anchor="middle" class="sm bold">CSM</text>
    <text x="84" y="346" text-anchor="middle" class="sm dim">in</text>
    <text x="134" y="346" text-anchor="middle" class="sm dim">FCF</text>
    <text x="109" y="368" text-anchor="middle" class="sm bold">profitable</text>
    <rect x="206" y="130" width="44" height="200" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="256" y="94" width="44" height="236" rx="3" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <rect x="206" y="94" width="44" height="36" rx="3" fill="#e11d48" fill-opacity="0.40" stroke="#e11d48" stroke-width="1.3"/>
    <text x="228" y="86" text-anchor="middle" class="sm bold">loss</text>
    <text x="228" y="346" text-anchor="middle" class="sm dim">in</text>
    <text x="278" y="346" text-anchor="middle" class="sm dim">FCF</text>
    <text x="253" y="368" text-anchor="middle" class="sm bold">onerous</text>
    <line x1="40" y1="330" x2="320" y2="330" class="axis"/>
  </g>
</svg>
