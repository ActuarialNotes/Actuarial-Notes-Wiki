<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 274" width="560" height="274" role="img">
  <title>The nominal rate deflated by inflation into a real rate</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="272.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The real rate is what is left after inflation</text>
  <text x="196" y="101" text-anchor="end" class="sm bold">Nominal i = 7%</text>
  <rect x="210" y="84" width="224" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="442" y="101" text-anchor="start" class="sm" fill="#3b82f6">7.00%</text>
  <text x="196" y="147" text-anchor="end" class="sm bold">Inflation r = 4%</text>
  <rect x="210" y="130" width="128" height="26" rx="4" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.2"/>
  <text x="346" y="147" text-anchor="start" class="sm" fill="#e11d48">4.00%</text>
  <text x="196" y="193" text-anchor="end" class="sm bold">Real i_r = 2.88%</text>
  <rect x="210" y="176" width="92.31" height="26" rx="4" fill="#059669" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
  <text x="310.31" y="193" text-anchor="start" class="sm" fill="#059669">2.88%</text>
  <text x="300" y="218" text-anchor="middle" class="sm dim">≈ i − r, but only approximately</text>
  <line x1="28" y1="232" x2="532" y2="232" class="rule"/>
  <text x="150" y="252" text-anchor="middle" class="sm bold">1 + i_r = (1 + i)/(1 + r)</text>
  <text x="150" y="268" text-anchor="middle" class="sm dim">i_r ≈ i − r for small rates</text>
  <text x="412" y="252" text-anchor="middle" class="sm bold">r &gt; i gives a negative real rate</text>
  <text x="412" y="268" text-anchor="middle" class="sm dim">purchasing power shrinks</text>
</svg>
