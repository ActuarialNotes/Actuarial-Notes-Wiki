<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A correlogram of a differenced series with one large negative spike at lag 1 and every later lag inside the ±1.96/√n band</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="62" y1="198.93" x2="324" y2="198.93" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
    <line x1="62" y1="239.07" x2="324" y2="239.07" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
    <line x1="62" y1="219" x2="324" y2="219" class="axis"/>
    <text x="55" y="345.46" text-anchor="end" class="sm dim">-1</text>
    <text x="55" y="222.6" text-anchor="end" class="sm dim">0</text>
    <text x="55" y="99.74" text-anchor="end" class="sm dim">1</text>
    <line x1="77.41" y1="219" x2="77.41" y2="282.89" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="77.41" cy="282.89" r="2.6" fill="#3b82f6"/>
    <line x1="103.1" y1="219" x2="103.1" y2="211.63" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="103.1" cy="211.63" r="2.6" fill="#3b82f6"/>
    <line x1="128.78" y1="219" x2="128.78" y2="223.91" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="128.78" cy="223.91" r="2.6" fill="#3b82f6"/>
    <line x1="154.47" y1="219" x2="154.47" y2="207.94" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="154.47" cy="207.94" r="2.6" fill="#3b82f6"/>
    <line x1="180.16" y1="219" x2="180.16" y2="222.69" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="180.16" cy="222.69" r="2.6" fill="#3b82f6"/>
    <line x1="205.84" y1="219" x2="205.84" y2="212.86" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="205.84" cy="212.86" r="2.6" fill="#3b82f6"/>
    <line x1="231.53" y1="219" x2="231.53" y2="216.54" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="231.53" cy="216.54" r="2.6" fill="#3b82f6"/>
    <line x1="257.22" y1="219" x2="257.22" y2="226.37" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="257.22" cy="226.37" r="2.6" fill="#3b82f6"/>
    <line x1="282.9" y1="219" x2="282.9" y2="214.09" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="282.9" cy="214.09" r="2.6" fill="#3b82f6"/>
    <line x1="308.59" y1="219" x2="308.59" y2="217.77" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="308.59" cy="217.77" r="2.6" fill="#3b82f6"/>
    <text x="90.25" y="288.89" text-anchor="start" class="sm bold">ρ₁ = −0.52</text>
    <text x="324" y="192.93" text-anchor="end" class="sm dim">±0.163</text>
    <text x="77.41" y="364" text-anchor="middle" class="sm dim">1</text>
    <text x="180.16" y="364" text-anchor="middle" class="sm dim">5</text>
    <text x="308.59" y="364" text-anchor="middle" class="sm dim">10</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">lag k</text>
  </g>
</svg>
