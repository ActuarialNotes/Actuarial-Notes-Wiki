  <line x1="72" y1="268.95" x2="320" y2="268.95" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="316.9" y="261.95" text-anchor="end" class="sm bold" fill="#059669">minimum</text>
  <line x1="72" y1="145.16" x2="320" y2="145.16" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
  <text x="316.9" y="138.16" text-anchor="end" class="sm bold" fill="#e11d48">maximum</text>
  <text x="174.5" y="194.11" text-anchor="start" class="sm" fill="#3b82f6">basic + converted losses</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">the insured's own losses ($000)</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">retrospective, not prospective — this year's</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">losses adjust this year's premium</text>
</svg>
