<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The federal share of a province's disaster cost rising in steps with cost per capita</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Ottawa's share climbs as the disaster</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">grows</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Federal share rises in steps with</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">provincial cost per capita</text>
    <line x1="68" y1="234" x2="324" y2="234" class="grid"/>
    <line x1="68" y1="163" x2="324" y2="163" class="grid"/>
    <line x1="68" y1="106.2" x2="324" y2="106.2" class="grid"/>
    <line x1="68" y1="234" x2="334" y2="234" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="234" x2="68" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="234" x2="68" y2="234" class="tick"/>
    <text x="60" y="237.6" text-anchor="end" class="sm dim">0%</text>
    <line x1="64" y1="163" x2="68" y2="163" class="tick"/>
    <text x="60" y="166.6" text-anchor="end" class="sm dim">50%</text>
    <line x1="64" y1="106.2" x2="68" y2="106.2" class="tick"/>
    <text x="60" y="109.8" text-anchor="end" class="sm dim">90%</text>
    <polyline points="68,234 93.6,234" class="curve" stroke="var(--dim)" stroke-width="2"/>
    <polyline points="93.6,163 144.8,163" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <polyline points="144.8,127.5 221.6,127.5" class="curve" stroke="#0d9488" stroke-width="2.4"/>
    <polyline points="221.6,106.2 324,106.2" class="curve" stroke="#059669" stroke-width="2.4"/>
    <text x="180" y="256" text-anchor="middle" class="sm dim">provincial cost per capita</text>
    <text x="180" y="274" text-anchor="middle" class="sm dim">the province designs and delivers; Ottawa reimburses</text>
    <line x1="30" y1="290" x2="330" y2="290" class="rule"/>
    <rect x="40" y="304" width="280" height="44" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
    <text x="180" y="322" text-anchor="middle" class="sm">nothing is reimbursed where insurance was</text>
    <text x="180" y="339" text-anchor="middle" class="sm">reasonably and readily available</text>
    <text x="180" y="370" text-anchor="middle" class="sm dim">so as flood became insurable, DFAA narrowed —</text>
    <text x="180" y="386" text-anchor="middle" class="sm dim">and reliable assistance is itself a moral hazard</text>
  </g>
</svg>
