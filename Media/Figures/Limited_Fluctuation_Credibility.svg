  <line x1="62" y1="125.39" x2="324" y2="125.39" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <line x1="203.74" y1="348" x2="203.74" y2="125.39" class="thin dash" stroke="#059669" stroke-width="1.3"/>
