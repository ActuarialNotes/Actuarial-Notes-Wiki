    <rect x="128" y="280" width="26" height="28" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
    <text x="111" y="132" text-anchor="middle" class="bold">X</text>
    <text x="111" y="336" text-anchor="middle" class="sm dim">n × p</text>
    <text x="178" y="235" text-anchor="middle" class="bold">×</text>
