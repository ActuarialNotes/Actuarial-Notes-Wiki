<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A four-by-four map of territories shaded by relativity, hottest at 1.45 in the city centre and cooling smoothly to 0.72 at the edge</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="40" y="88" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.06" stroke="var(--edge)" stroke-width="0.8"/>
    <text x="73.5" y="125.5" text-anchor="middle" class="bold">0.72</text>
    <rect x="110" y="88" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.11" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="180" y="88" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.22" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="250" y="88" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.30" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="40" y="158" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.13" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="110" y="158" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.30" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="180" y="158" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.52" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="250" y="158" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.46" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="40" y="228" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.24" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="110" y="228" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.57" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="180" y="228" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.85" stroke="var(--edge)" stroke-width="0.8"/>
    <text x="213.5" y="265.5" text-anchor="middle" class="bold">1.45</text>
    <rect x="250" y="228" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.59" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="40" y="298" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.19" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="110" y="298" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.41" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="180" y="298" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.55" stroke="var(--edge)" stroke-width="0.8"/>
    <rect x="250" y="298" width="67" height="67" rx="4" fill="#e11d48" fill-opacity="0.35" stroke="var(--edge)" stroke-width="0.8"/>
  </g>
</svg>
