<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Historical earned premium restated at the rate level now in force</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Premium restated at today's rates</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">On-Level Premium = Historical EP × OLF</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">OLF = current index / average index</text>
  <text x="84" y="146" text-anchor="end" class="sm dim">2023</text>
  <rect x="88" y="132" width="159.6" height="24" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="247.6" y="132" width="16.5" height="24" rx="3" fill="#059669" fill-opacity="0.55"/>
  <text x="96" y="149" text-anchor="start" class="sm">3,800</text>
  <text x="274.1" y="149" text-anchor="start" class="sm dim">× 1.1034</text>
  <text x="84" y="212" text-anchor="end" class="sm dim">2024</text>
  <rect x="88" y="198" width="163.8" height="24" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="251.8" y="198" width="2.23" height="24" rx="3" fill="#059669" fill-opacity="0.55"/>
  <text x="96" y="215" text-anchor="start" class="sm">3,900</text>
  <text x="264.03" y="215" text-anchor="start" class="sm dim">× 1.0136</text>
  <text x="84" y="278" text-anchor="end" class="sm dim">2025</text>
  <rect x="88" y="264" width="168" height="24" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="96" y="281" text-anchor="start" class="sm">4,000</text>
  <text x="266" y="281" text-anchor="start" class="sm dim">× 1.0000</text>
  <text x="180" y="116" text-anchor="middle" class="sm dim">earned premium ($000) and its on-level factor</text>
  <text x="180" y="334" text-anchor="middle" class="sm dim">a 12% increase on 7/1/2023 takes two full</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">years to work through earned premium</text>
</svg>
