<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five driver classes' pure premiums as bars measured against the adult-married base class, with relativities from 1.70 down to 0.65</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="116" y="108" text-anchor="end" class="sm">Youthful</text>
    <rect x="124" y="90" width="177.48" height="28" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="308.48" y="108" text-anchor="start" class="sm">1.70</text>
    <text x="116" y="170" text-anchor="end" class="sm">Adult single</text>
    <rect x="124" y="152" width="114.84" height="28" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="245.84" y="170" text-anchor="start" class="sm">1.10</text>
    <text x="116" y="232" text-anchor="end" class="sm bold">Adult married</text>
    <rect x="124" y="214" width="104.4" height="28" rx="3" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="235.4" y="232" text-anchor="start" class="sm">1.00</text>
    <text x="116" y="294" text-anchor="end" class="sm">Mature</text>
    <rect x="124" y="276" width="83.52" height="28" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="214.52" y="294" text-anchor="start" class="sm">0.80</text>
    <text x="116" y="356" text-anchor="end" class="sm">Senior</text>
    <rect x="124" y="338" width="67.86" height="28" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="198.86" y="356" text-anchor="start" class="sm">0.65</text>
    <line x1="228.4" y1="80" x2="228.4" y2="372" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  </g>
</svg>
