<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A banned rating variable's signal migrating into the permitted variables correlated with it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Ban a variable and its signal moves next</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">door</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Prohibited ≠ unpredictive</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">the question is whether pricing on it is acceptable</text>
    <rect x="75" y="94" width="210" height="28" rx="14.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
    <text x="180" y="112" text-anchor="middle" class="sm">credit score — banned</text>
    <line x1="75" y1="108" x2="285" y2="108" class="thin" stroke="#e11d48" stroke-width="1.6"/>
    <line x1="180" y1="126" x2="82" y2="162" class="thin dash" stroke="#d97706" stroke-width="1.4" marker-end="url(#ahd97706)"/>
    <rect x="38" y="168" width="88" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="82" y="184" text-anchor="middle" class="sm">territory</text>
    <line x1="180" y1="126" x2="180" y2="162" class="thin dash" stroke="#d97706" stroke-width="1.4" marker-end="url(#ahd97706)"/>
    <rect x="136" y="168" width="88" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="184" text-anchor="middle" class="sm">vehicle</text>
    <line x1="180" y1="126" x2="278" y2="162" class="thin dash" stroke="#d97706" stroke-width="1.4" marker-end="url(#ahd97706)"/>
    <rect x="234" y="168" width="88" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="278" y="184" text-anchor="middle" class="sm">tenure</text>
    <text x="180" y="214" text-anchor="middle" class="sm bold" fill="#d97706">the signal reappears as a proxy</text>
    <line x1="30" y1="238" x2="330" y2="238" class="rule"/>
    <text x="40" y="262" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="262" text-anchor="start" class="sm">cross-subsidy: good risks pay for bad</text>
    <text x="40" y="286" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="286" text-anchor="start" class="sm">good risks leave, or the residual market grows</text>
    <text x="40" y="310" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="310" text-anchor="start" class="sm">the plan differs by province, so a national</text>
    <text x="40" y="334" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="56" y="334" text-anchor="start" class="sm">insurer runs a different one in each</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">restriction is a policy choice, not an actuarial one</text>
  </g>
</svg>
