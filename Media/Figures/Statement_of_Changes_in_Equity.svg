<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running insurer's equity as a waterfall from $245M opening, up $39M of net income, down $14M of OCI and $10M of dividends, to $260M closing</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="47.02" y="146.71" width="35.96" height="203.29" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="65" y="138.71" text-anchor="middle" class="sm">245</text>
    <text x="65" y="365" text-anchor="middle" class="sm dim">open</text>
    <rect x="105.02" y="114" width="35.96" height="32.71" rx="3" fill="#059669" fill-opacity="0.72"/>
    <text x="123" y="106" text-anchor="middle" class="sm">39</text>
    <text x="123" y="365" text-anchor="middle" class="sm dim">net income</text>
    <rect x="163.02" y="114" width="35.96" height="11.62" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="181" y="106" text-anchor="middle" class="sm">14</text>
    <text x="181" y="365" text-anchor="middle" class="sm dim">OCI</text>
    <rect x="221.02" y="125.62" width="35.96" height="8.63" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="239" y="117.62" text-anchor="middle" class="sm">10</text>
    <text x="239" y="365" text-anchor="middle" class="sm dim">dividends</text>
    <rect x="279.02" y="134.25" width="35.96" height="215.75" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="297" y="126.25" text-anchor="middle" class="sm">260</text>
    <text x="297" y="365" text-anchor="middle" class="sm dim">close</text>
    <line x1="30" y1="350" x2="332" y2="350" class="axis"/>
  </g>
</svg>
