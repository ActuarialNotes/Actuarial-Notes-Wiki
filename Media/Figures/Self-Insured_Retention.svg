<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Eight claims cut at a 250 retention: the entity keeps each claim up to the line and the insurer pays what rises above it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="72" y1="344" x2="326" y2="344" class="grid"/>
    <line x1="72" y1="294" x2="326" y2="294" class="grid"/>
    <line x1="72" y1="194" x2="326" y2="194" class="grid"/>
    <line x1="72" y1="94" x2="326" y2="94" class="grid"/>
    <line x1="72" y1="344" x2="336" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="344" x2="72" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="344" x2="72" y2="344" class="tick"/>
    <text x="64" y="347.6" text-anchor="end" class="sm dim">0</text>
    <line x1="68" y1="294" x2="72" y2="294" class="tick"/>
    <text x="64" y="297.6" text-anchor="end" class="sm dim">250</text>
    <line x1="68" y1="194" x2="72" y2="194" class="tick"/>
    <text x="64" y="197.6" text-anchor="end" class="sm dim">750</text>
    <line x1="68" y1="94" x2="72" y2="94" class="tick"/>
    <text x="64" y="97.6" text-anchor="end" class="sm dim">1,250</text>
    <text x="326" y="376" text-anchor="end" class="sm dim">claims</text>
    <rect x="81.62" y="320" width="15.29" height="24" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="106.28" y="294" width="15.29" height="50" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="106.28" y="276" width="15.29" height="18" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="130.94" y="326" width="15.29" height="18" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="155.6" y="294" width="15.29" height="50" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="155.6" y="188" width="15.29" height="106" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="180.26" y="294" width="15.29" height="50" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="204.92" y="332" width="15.29" height="12" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="229.58" y="294" width="15.29" height="50" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <rect x="229.58" y="114" width="15.29" height="180" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="254.24" y="304" width="15.29" height="40" rx="2" fill="#d97706" fill-opacity="0.75"/>
    <line x1="72" y1="294" x2="326" y2="294" class="thin" stroke="#e11d48" stroke-width="1.3"/>
    <text x="301.34" y="287" text-anchor="middle" class="sm bold">SIR</text>
    <text x="301.34" y="204" text-anchor="middle" class="sm">insured</text>
    <text x="301.34" y="323" text-anchor="middle" class="sm">retained</text>
  </g>
</svg>
