<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Quiz — Actuarial Notes snippet</title>
<style>
  /* Preview-page-only styles — not part of the embeddable snippet. */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: hsl(250 35% 9%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 16px;
  }
</style>
</head>
<body>

<!-- ============================================================
     COPY START — paste everything from here to "COPY END" into
     your site's HTML/embed block. To reuse this for a different
     question, edit the text in the markup and update
     ANSWER_INDEX + the option list in the <script> at the bottom.
============================================================ -->
<div class="an-quiz" data-answer="1">
  <p class="an-quiz-tag">Quick Check · Probability</p>
  <h3 class="an-quiz-question">
    You flip a fair coin 3 times. What's the probability all three flips
    show the <em>same</em> result (HHH or TTT)?
  </h3>

  <div class="an-quiz-options" role="radiogroup" aria-label="Answer options">
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="0">
      <span class="an-quiz-letter">A</span><span class="an-quiz-text">1/8</span>
    </button>
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="1">
      <span class="an-quiz-letter">B</span><span class="an-quiz-text">1/4</span>
    </button>
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="2">
      <span class="an-quiz-letter">C</span><span class="an-quiz-text">1/2</span>
    </button>
    <button type="button" class="an-quiz-option" role="radio" aria-checked="false" data-index="3">
      <span class="an-quiz-letter">D</span><span class="an-quiz-text">3/8</span>
    </button>
  </div>

  <div class="an-quiz-explain" role="status" aria-live="polite">
    <p class="an-quiz-explain-title"></p>
    <p class="an-quiz-explain-text">
      P(HHH) = (1/2)<sup>3</sup> = 1/8, and P(TTT) = 1/8. The two outcomes
      can't both happen, so P(same result) = 1/8 + 1/8 = <strong>1/4</strong>.
    </p>
    <button type="button" class="an-quiz-retry">Try again</button>
  </div>
</div>

<style>
  .an-quiz {
    --an-bg: hsl(250 30% 14%);
    --an-fg: hsl(240 30% 96%);
    --an-muted: hsl(240 15% 70%);
    --an-border: hsl(250 25% 26%);
    --an-primary: hsl(263 85% 66%);
    --an-good: hsl(158 64% 45%);
    --an-bad: hsl(350 80% 62%);
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    background: var(--an-bg);
    border: 1px solid var(--an-border);
    border-radius: 16px;
    padding: 22px 22px 20px;
    color: var(--an-fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .an-quiz * { box-sizing: border-box; }
  .an-quiz-tag {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--an-primary);
  }
  .an-quiz-question {
    margin: 0 0 16px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
  }
  .an-quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .an-quiz-option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: hsl(0 0% 100% / 0.04);
    border: 1px solid var(--an-border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--an-fg);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .an-quiz-option:hover:not(:disabled) {
    border-color: var(--an-primary);
    background: hsl(263 85% 66% / 0.08);
  }
  .an-quiz-option:active:not(:disabled) {
    transform: scale(0.99);
  }
  .an-quiz-option:disabled {
    cursor: default;
  }
  .an-quiz-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: hsl(0 0% 100% / 0.08);
    font-size: 12px;
    font-weight: 800;
  }
  .an-quiz-option.an-is-correct {
    border-color: var(--an-good);
    background: hsl(158 64% 45% / 0.14);
  }
  .an-quiz-option.an-is-correct .an-quiz-letter {
    background: var(--an-good);
    color: hsl(0 0% 100%);
  }
  .an-quiz-option.an-is-wrong {
    border-color: var(--an-bad);
    background: hsl(350 80% 62% / 0.12);
  }
  .an-quiz-option.an-is-wrong .an-quiz-letter {
    background: var(--an-bad);
    color: hsl(0 0% 100%);
  }
  .an-quiz-explain {
    display: none;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--an-border);
  }
  .an-quiz.an-is-answered .an-quiz-explain {
    display: block;
    animation: an-quiz-fade-in 0.25s ease both;
  }
  @keyframes an-quiz-fade-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .an-quiz-explain-title {
    margin: 0 0 6px;
    font-size: 14px;
    font-weight: 800;
  }
  .an-quiz-explain-title.an-good { color: var(--an-good); }
  .an-quiz-explain-title.an-bad { color: var(--an-bad); }
  .an-quiz-explain-text {
    margin: 0;
    font-size: 13px;
    line-height: 1.55;
    color: var(--an-muted);
  }
  .an-quiz-retry {
    margin-top: 12px;
    background: none;
    border: 1px solid var(--an-border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--an-fg);
    cursor: pointer;
  }
  .an-quiz-retry:hover {
    border-color: var(--an-primary);
  }
</style>

<script>
(function () {
  document.querySelectorAll('.an-quiz').forEach(function (quiz) {
    if (quiz.dataset.anBound) return;
    quiz.dataset.anBound = 'true';

    var answerIndex = parseInt(quiz.dataset.answer, 10);
    var options = quiz.querySelectorAll('.an-quiz-option');
    var explainTitle = quiz.querySelector('.an-quiz-explain-title');
    var retry = quiz.querySelector('.an-quiz-retry');

    function reset() {
      quiz.classList.remove('an-is-answered');
      explainTitle.textContent = '';
      explainTitle.className = 'an-quiz-explain-title';
      options.forEach(function (opt) {
        opt.disabled = false;
        opt.classList.remove('an-is-correct', 'an-is-wrong');
        opt.setAttribute('aria-checked', 'false');
      });
    }

    function answer(index) {
      var correct = index === answerIndex;
      options.forEach(function (opt, i) {
        opt.disabled = true;
        if (i === answerIndex) opt.classList.add('an-is-correct');
        if (i === index && !correct) opt.classList.add('an-is-wrong');
        opt.setAttribute('aria-checked', i === index ? 'true' : 'false');
      });
      explainTitle.textContent = correct ? 'Correct!' : 'Not quite — here’s why:';
      explainTitle.classList.add(correct ? 'an-good' : 'an-bad');
      quiz.classList.add('an-is-answered');
      quiz.dispatchEvent(new CustomEvent('an-quiz-answered', {
        bubbles: true,
        detail: { correct: correct }
      }));
    }

    options.forEach(function (opt) {
      opt.addEventListener('click', function () {
        answer(parseInt(opt.dataset.index, 10));
      });
    });
    retry.addEventListener('click', reset);
  });
})();
</script>
<!-- ============================================================
     COPY END
============================================================ -->

</body>
</html>
