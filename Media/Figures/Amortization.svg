<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" width="560" height="296" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="294.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The payment is level; its split is not</text>
  <rect x="77.34" y="83.43" width="19.96" height="59.11" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="77.34" y="142.54" width="19.96" height="69.46" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="109.53" y="83.43" width="19.96" height="53.55" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="109.53" y="136.98" width="19.96" height="75.02" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="141.73" y="83.43" width="19.96" height="47.55" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="141.73" y="130.98" width="19.96" height="81.02" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="173.92" y="83.43" width="19.96" height="41.07" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="173.92" y="124.5" width="19.96" height="87.5" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="206.12" y="83.43" width="19.96" height="34.07" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="206.12" y="117.5" width="19.96" height="94.5" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="238.31" y="83.43" width="19.96" height="26.51" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="238.31" y="109.94" width="19.96" height="102.06" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="270.51" y="83.43" width="19.96" height="18.34" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="270.51" y="101.77" width="19.96" height="110.23" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="302.7" y="83.43" width="19.96" height="9.52" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="302.7" y="92.95" width="19.96" height="119.05" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <line x1="68" y1="83.43" x2="332" y2="83.43" class="thin" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="68" y1="212" x2="342" y2="212" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="212" x2="68" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="87.32" y1="212" x2="87.32" y2="216" class="tick"/>
  <text x="87.32" y="228" text-anchor="middle" class="sm dim">1</text>
  <line x1="119.51" y1="212" x2="119.51" y2="216" class="tick"/>
  <text x="119.51" y="228" text-anchor="middle" class="sm dim">2</text>
  <line x1="151.71" y1="212" x2="151.71" y2="216" class="tick"/>
  <text x="151.71" y="228" text-anchor="middle" class="sm dim">3</text>
  <line x1="183.9" y1="212" x2="183.9" y2="216" class="tick"/>
  <text x="183.9" y="228" text-anchor="middle" class="sm dim">4</text>
  <line x1="216.1" y1="212" x2="216.1" y2="216" class="tick"/>
  <text x="216.1" y="228" text-anchor="middle" class="sm dim">5</text>
  <line x1="248.29" y1="212" x2="248.29" y2="216" class="tick"/>
  <text x="248.29" y="228" text-anchor="middle" class="sm dim">6</text>
  <line x1="280.49" y1="212" x2="280.49" y2="216" class="tick"/>
  <text x="280.49" y="228" text-anchor="middle" class="sm dim">7</text>
  <line x1="312.68" y1="212" x2="312.68" y2="216" class="tick"/>
  <text x="312.68" y="228" text-anchor="middle" class="sm dim">8</text>
  <line x1="64" y1="212" x2="68" y2="212" class="tick"/>
  <text x="60" y="215.6" text-anchor="end" class="sm dim">0</text>
  <line x1="64" y1="138.11" x2="68" y2="138.11" class="tick"/>
  <text x="60" y="141.71" text-anchor="end" class="sm dim">1,000</text>
  <line x1="64" y1="83.43" x2="68" y2="83.43" class="tick"/>
  <text x="60" y="87.03" text-anchor="end" class="sm dim">P = 1,740</text>
  <text x="332" y="244" text-anchor="end" class="sm dim">payment number</text>
  <text x="64" y="54" text-anchor="start" class="sm dim">payment</text>
  <line x1="70" y1="258" x2="83" y2="258" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="89" y="261.6" text-anchor="start" class="sm">interest I_k</text>
  <line x1="194" y1="258" x2="207" y2="258" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="213" y="261.6" text-anchor="start" class="sm">principal PR_k</text>
  <text x="430" y="96" text-anchor="middle" class="sm bold">P = L / a₍ₙ₎</text>
  <text x="430" y="116" text-anchor="middle" class="sm dim">= 10,000 / a₍₈₎ at 8% = 1,740.15</text>
  <line x1="340" y1="140" x2="340" y2="172" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="152" text-anchor="start" class="sm bold">I_k = P (1 − v^(n−k+1))</text>
  <text x="350" y="168" text-anchor="start" class="sm dim">falls every period</text>
  <line x1="340" y1="186" x2="340" y2="218" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="198" text-anchor="start" class="sm bold">PR_k = P v^(n−k+1)</text>
  <text x="350" y="214" text-anchor="start" class="sm dim">rises every period</text>
  <line x1="340" y1="232" x2="340" y2="264" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="244" text-anchor="start" class="sm bold">OB_k = P a₍ₙ₋ₖ₎</text>
  <text x="350" y="260" text-anchor="start" class="sm dim">hits zero at k = n</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">The principal repaid grows by a factor of (1 + i) each period</text>
</svg>
