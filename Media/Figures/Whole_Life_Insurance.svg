    <line x1="32" y1="348" x2="332" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="40" y1="344" x2="40" y2="352" class="tick"/>
    <text x="40" y="366" text-anchor="middle" class="sm dim">0</text>
    <line x1="82.42" y1="344" x2="82.42" y2="352" class="tick"/>
    <text x="82.42" y="366" text-anchor="middle" class="sm dim">1</text>
    <line x1="124.85" y1="344" x2="124.85" y2="352" class="tick"/>
    <text x="124.85" y="366" text-anchor="middle" class="sm dim">2</text>
    <line x1="167.27" y1="344" x2="167.27" y2="352" class="tick"/>
    <text x="167.27" y="366" text-anchor="middle" class="sm dim">3</text>
    <line x1="209.7" y1="344" x2="209.7" y2="352" class="tick"/>
    <text x="209.7" y="366" text-anchor="middle" class="sm dim">4</text>
    <line x1="252.12" y1="344" x2="252.12" y2="352" class="tick"/>
    <text x="252.12" y="366" text-anchor="middle" class="sm dim">5</text>
    <line x1="294.55" y1="344" x2="294.55" y2="352" class="tick"/>
    <text x="294.55" y="366" text-anchor="middle" class="sm dim">…</text>
    <rect x="45.94" y="327.08" width="30.55" height="20.92" rx="1.5" fill="#e11d48" fill-opacity="0.3"/>
    <rect x="88.36" y="318.71" width="30.55" height="29.29" rx="1.5" fill="#e11d48" fill-opacity="0.3"/>
    <rect x="130.79" y="306.15" width="30.55" height="41.85" rx="1.5" fill="#e11d48" fill-opacity="0.3"/>
    <rect x="173.21" y="289.42" width="30.55" height="58.58" rx="1.5" fill="#e11d48" fill-opacity="0.75"/>
    <rect x="215.64" y="268.49" width="30.55" height="79.51" rx="1.5" fill="#e11d48" fill-opacity="0.3"/>
    <rect x="258.06" y="247.57" width="30.55" height="100.43" rx="1.5" fill="#e11d48" fill-opacity="0.3"/>
    <text x="273.33" y="240.57" text-anchor="middle" class="sm bold">ₖ|qₓ</text>
    <line x1="209.7" y1="346" x2="209.7" y2="149.23" class="thin" stroke="#e11d48" stroke-width="2" marker-end="url(#ahe11d48)"/>
    <text x="209.7" y="142.23" text-anchor="middle" class="bold">1</text>
    <line x1="205.7" y1="109.48" x2="42" y2="109.48" class="thin dash" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
    <text x="124.85" y="102.48" text-anchor="middle" class="bold">v⁴</text>
  </g>
</svg>
