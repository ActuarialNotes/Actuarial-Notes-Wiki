  <circle cx="190.8" cy="147.2" r="3.2" fill="var(--dim)"/>
  <text x="125.2" y="88.06" text-anchor="start" class="sm bold">the gap is convexity</text>
  <line x1="76" y1="200" x2="332" y2="200" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="200" x2="76" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="92.4" y1="200" x2="92.4" y2="204" class="tick"/>
  <text x="92.4" y="216" text-anchor="middle" class="sm dim">2%</text>
  <line x1="190.8" y1="200" x2="190.8" y2="204" class="tick"/>
  <text x="190.8" y="216" text-anchor="middle" class="sm dim">5%</text>
  <line x1="289.2" y1="200" x2="289.2" y2="204" class="tick"/>
  <text x="289.2" y="216" text-anchor="middle" class="sm dim">8%</text>
  <line x1="72" y1="178.88" x2="76" y2="178.88" class="tick"/>
  <text x="68" y="182.48" text-anchor="end" class="sm dim">700</text>
  <line x1="72" y1="136.64" x2="76" y2="136.64" class="tick"/>
  <text x="68" y="140.24" text-anchor="end" class="sm dim">1,100</text>
  <line x1="72" y1="94.4" x2="76" y2="94.4" class="tick"/>
  <text x="68" y="98" text-anchor="end" class="sm dim">1,500</text>
  <text x="322" y="232" text-anchor="end" class="sm dim">yield j</text>
  <text x="72" y="54" text-anchor="start" class="sm dim">price</text>
  <line x1="78" y1="252" x2="91" y2="252" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="97" y="255.6" text-anchor="start" class="sm">true price</text>
  <line x1="218" y1="252" x2="231" y2="252" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="237" y="255.6" text-anchor="start" class="sm">duration only</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">ΔP/P ≈ −D_Mod·Δj + ½·C·(Δj)²</text>
  <line x1="342" y1="126" x2="342" y2="160" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="139" text-anchor="start" class="sm bold">C = (1/P) d²P/dj²</text>
  <text x="352" y="155" text-anchor="start" class="sm dim">Σ t(t+1) C_t v^(t+2) / P</text>
  <line x1="342" y1="174" x2="342" y2="208" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="187" text-anchor="start" class="sm bold">Higher convexity is better</text>
  <text x="352" y="203" text-anchor="start" class="sm dim">more upside, less downside</text>
  <line x1="342" y1="222" x2="342" y2="256" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="352" y="235" text-anchor="start" class="sm bold">Always positive</text>
  <text x="352" y="251" text-anchor="start" class="sm dim">for an ordinary bond</text>
  <text x="280" y="290" text-anchor="middle" class="sm dim">Note the v^(t+2): convexity carries an extra (1+j)² in the denominator</text>
</svg>
