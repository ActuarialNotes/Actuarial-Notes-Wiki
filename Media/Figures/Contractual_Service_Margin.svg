<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The CSM set so there is no day-one gain, then released over coverage units</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Unearned profit, released as coverage is</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">given</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">CSM₀ = PV(inflows) − PV(outflows) − RA</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">$60M − $44M − $5M = $11M</text>
  <rect x="40" y="107" width="205.33" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
  <text x="142.67" y="128" text-anchor="middle" class="sm">outflows 44</text>
  <rect x="245.33" y="107" width="23.33" height="34" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="257" y="128" text-anchor="middle" class="sm">RA</text>
  <rect x="268.67" y="107" width="51.33" height="34" rx="4" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.2"/>
  <text x="294.33" y="128" text-anchor="middle" class="sm">CSM 11</text>
  <text x="180" y="162" text-anchor="middle" class="sm dim">the $60M premium, divided so no gain</text>
  <text x="180" y="178" text-anchor="middle" class="sm dim">is recognised on day one</text>
  <line x1="30" y1="198" x2="330" y2="198" class="rule"/>
  <rect x="83.68" y="232.08" width="43.31" height="73.92" rx="3" fill="#059669" fill-opacity="0.75"/>
  <text x="105.33" y="225.08" text-anchor="middle" class="sm">4.4</text>
  <text x="105.33" y="321" text-anchor="middle" class="sm dim">year 1</text>
  <rect x="158.35" y="241.32" width="43.31" height="64.68" rx="3" fill="#059669" fill-opacity="0.75"/>
  <text x="180" y="234.32" text-anchor="middle" class="sm">3.9</text>
  <text x="180" y="321" text-anchor="middle" class="sm dim">year 2</text>
  <rect x="233.01" y="259.8" width="43.31" height="46.2" rx="3" fill="#059669" fill-opacity="0.75"/>
  <text x="254.67" y="252.8" text-anchor="middle" class="sm">2.8</text>
  <text x="254.67" y="321" text-anchor="middle" class="sm dim">year 3</text>
  <line x1="62" y1="306" x2="298" y2="306" class="axis"/>
  <text x="180" y="340" text-anchor="middle" class="sm dim">released on coverage units — 40%, 35%, 25%</text>
  <text x="180" y="364" text-anchor="middle" class="sm dim">a revision to future service adjusts the CSM;</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">one to past service hits profit at once</text>
</svg>
