  <polyline points="82.25,89.31 326,209.77" class="curve" stroke="#d97706" stroke-width="1.6"/>
  <circle cx="201" cy="148" r="3.6" fill="#d97706"/>
  <text x="241" y="136" text-anchor="middle" class="sm">current yield</text>
  <line x1="76" y1="208" x2="336" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="208" x2="76" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="107.25" y1="208" x2="107.25" y2="212" class="tick"/>
  <text x="107.25" y="224" text-anchor="middle" class="sm dim">2%</text>
  <line x1="201" y1="208" x2="201" y2="212" class="tick"/>
  <text x="201" y="224" text-anchor="middle" class="sm dim">5%</text>
  <line x1="294.75" y1="208" x2="294.75" y2="212" class="tick"/>
  <text x="294.75" y="224" text-anchor="middle" class="sm dim">8%</text>
  <line x1="72" y1="188" x2="76" y2="188" class="tick"/>
  <text x="68" y="191.6" text-anchor="end" class="sm dim">800</text>
  <line x1="72" y1="148" x2="76" y2="148" class="tick"/>
  <text x="68" y="151.6" text-anchor="end" class="sm dim">1,000</text>
  <line x1="72" y1="108" x2="76" y2="108" class="tick"/>
  <text x="68" y="111.6" text-anchor="end" class="sm dim">1,200</text>
  <text x="326" y="240" text-anchor="end" class="sm dim">yield j</text>
  <text x="72" y="54" text-anchor="start" class="sm dim">price</text>
  <text x="428" y="100" text-anchor="middle" class="sm bold">D_Mod = −(1/P) dP/dj</text>
  <text x="428" y="120" text-anchor="middle" class="sm dim">= D_Mac/(1+j) = 7.72</text>
  <line x1="340" y1="142" x2="340" y2="174" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="154" text-anchor="start" class="sm bold">ΔP ≈ −D_Mod · P · Δj</text>
  <text x="350" y="170" text-anchor="start" class="sm dim">the tangent, not the curve</text>
  <line x1="340" y1="188" x2="340" y2="220" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="200" text-anchor="start" class="sm bold">D_Mod &lt; D_Mac</text>
  <text x="350" y="216" text-anchor="start" class="sm dim">since 1 + j &gt; 1</text>
  <line x1="340" y1="234" x2="340" y2="266" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="246" text-anchor="start" class="sm bold">Add convexity</text>
  <text x="350" y="262" text-anchor="start" class="sm dim">to correct the curvature</text>
  <text x="280" y="286" text-anchor="middle" class="sm dim">The tangent always sits below the price curve — that is convexity</text>
</svg>
