<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A bad-faith award built column by column — benefit, aggravated, punitive and costs — to $1.6M, far above the dashed policy limit at the benefit</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="49.02" y="302.8" width="38.35" height="47.2" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="68.2" y="294.8" text-anchor="middle" class="sm">320k</text>
    <text x="68.2" y="365" text-anchor="middle" class="sm dim">benefit</text>
    <rect x="105.42" y="288.05" width="38.35" height="14.75" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="124.6" y="280.05" text-anchor="middle" class="sm">100k</text>
    <text x="124.6" y="365" text-anchor="middle" class="sm dim">aggravated</text>
    <rect x="161.82" y="140.55" width="38.35" height="147.5" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="181" y="132.55" text-anchor="middle" class="sm">1.00M</text>
    <text x="181" y="365" text-anchor="middle" class="sm dim">punitive</text>
    <rect x="218.22" y="114" width="38.35" height="26.55" rx="3" fill="#7c3aed" fill-opacity="0.72"/>
    <text x="237.4" y="106" text-anchor="middle" class="sm">180k</text>
    <text x="237.4" y="365" text-anchor="middle" class="sm dim">costs</text>
    <rect x="274.62" y="114" width="38.35" height="236" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="293.8" y="106" text-anchor="middle" class="sm">1.60M</text>
    <text x="293.8" y="365" text-anchor="middle" class="sm dim">total</text>
    <line x1="34" y1="350" x2="328" y2="350" class="axis"/>
    <line x1="36" y1="302.8" x2="326" y2="302.8" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="270" y="318.8" text-anchor="end" class="sm bold">policy limit</text>
  </g>
</svg>
