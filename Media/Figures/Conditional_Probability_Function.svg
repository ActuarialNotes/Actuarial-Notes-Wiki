<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <title>One row of a joint table renormalised into a conditional distribution</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Fix one variable, then renormalise that slice</text>
  <text x="86" y="90" text-anchor="middle" class="sm dim">y = 0</text>
  <text x="138" y="90" text-anchor="middle" class="sm dim">y = 1</text>
  <text x="190" y="90" text-anchor="middle" class="sm dim">y = 2</text>
  <text x="50" y="115" text-anchor="end" class="sm dim">x = 0</text>
  <text x="50" y="145" text-anchor="end" class="sm dim">x = 1</text>
  <text x="50" y="175" text-anchor="end" class="sm dim">x = 2</text>
  <rect x="60" y="96" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="86" y="115" text-anchor="middle" class="sm">0.10</text>
  <rect x="112" y="96" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="138" y="115" text-anchor="middle" class="sm">0.08</text>
  <rect x="164" y="96" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="190" y="115" text-anchor="middle" class="sm">0.02</text>
  <rect x="60" y="126" width="52" height="30" rx="3" fill="#3b82f6" fill-opacity="0.26" stroke="var(--edge)" stroke-width="1"/>
  <text x="86" y="145" text-anchor="middle" class="sm bold">0.06</text>
  <rect x="112" y="126" width="52" height="30" rx="3" fill="#3b82f6" fill-opacity="0.26" stroke="var(--edge)" stroke-width="1"/>
  <text x="138" y="145" text-anchor="middle" class="sm bold">0.20</text>
  <rect x="164" y="126" width="52" height="30" rx="3" fill="#3b82f6" fill-opacity="0.26" stroke="var(--edge)" stroke-width="1"/>
  <text x="190" y="145" text-anchor="middle" class="sm bold">0.14</text>
  <rect x="60" y="156" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="86" y="175" text-anchor="middle" class="sm">0.04</text>
  <rect x="112" y="156" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="138" y="175" text-anchor="middle" class="sm">0.12</text>
  <rect x="164" y="156" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="190" y="175" text-anchor="middle" class="sm">0.24</text>
  <text x="138" y="232" text-anchor="middle" class="sm dim">the row X = 1 sums to 0.40</text>
  <line x1="248" y1="141" x2="288" y2="141" class="thin" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ah7c3aed)"/>
  <text x="268" y="128" text-anchor="middle" class="sm" fill="#7c3aed">÷ 0.40</text>
  <text x="384" y="92" text-anchor="middle" class="sm bold" fill="#7c3aed">P(Y = y | X = 1)</text>
  <text x="332" y="116" text-anchor="middle" class="sm dim">y = 0</text>
  <rect x="306" y="126" width="52" height="30" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="332" y="146" text-anchor="middle" class="sm bold">0.15</text>
  <text x="384" y="116" text-anchor="middle" class="sm dim">y = 1</text>
  <rect x="358" y="126" width="52" height="30" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="384" y="146" text-anchor="middle" class="sm bold">0.50</text>
  <text x="436" y="116" text-anchor="middle" class="sm dim">y = 2</text>
  <rect x="410" y="126" width="52" height="30" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="436" y="146" text-anchor="middle" class="sm bold">0.35</text>
  <text x="384" y="178" text-anchor="middle" class="sm dim">0.15 + 0.50 + 0.35 = 1.00</text>
  <rect x="300" y="194" width="216" height="60" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="408" y="214" text-anchor="middle" class="sm">f_{X|Y}(x | y) = f(x, y) / f_Y(y)</text>
  <text x="408" y="234" text-anchor="middle" class="sm dim">defined wherever f_Y(y) &gt; 0</text>
  <text x="280" y="280" text-anchor="middle" class="sm dim">A conditional distribution is a distribution — it must sum to 1</text>
</svg>
