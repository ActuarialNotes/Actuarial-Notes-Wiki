<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Expected loss rising in proportion to the exposure base</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A good base moves with expected loss</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Premium = Rate × Exposures</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Pure Premium = Losses / Earned Exposures</text>
  <line x1="72" y1="96" x2="72" y2="326" class="grid"/>
  <line x1="122" y1="96" x2="122" y2="326" class="grid"/>
  <line x1="172" y1="96" x2="172" y2="326" class="grid"/>
  <line x1="222" y1="96" x2="222" y2="326" class="grid"/>
  <line x1="272" y1="96" x2="272" y2="326" class="grid"/>
  <line x1="322" y1="96" x2="322" y2="326" class="grid"/>
  <line x1="72" y1="326" x2="322" y2="326" class="grid"/>
  <line x1="72" y1="211" x2="322" y2="211" class="grid"/>
  <line x1="72" y1="96" x2="322" y2="96" class="grid"/>
  <line x1="72" y1="326" x2="332" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="326" x2="72" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="326" x2="72" y2="330" class="tick"/>
  <text x="72" y="342" text-anchor="middle" class="sm dim">0</text>
  <line x1="122" y1="326" x2="122" y2="330" class="tick"/>
  <text x="122" y="342" text-anchor="middle" class="sm dim">1</text>
  <line x1="172" y1="326" x2="172" y2="330" class="tick"/>
  <text x="172" y="342" text-anchor="middle" class="sm dim">2</text>
  <line x1="222" y1="326" x2="222" y2="330" class="tick"/>
  <text x="222" y="342" text-anchor="middle" class="sm dim">3</text>
  <line x1="272" y1="326" x2="272" y2="330" class="tick"/>
  <text x="272" y="342" text-anchor="middle" class="sm dim">4</text>
  <line x1="322" y1="326" x2="322" y2="330" class="tick"/>
  <text x="322" y="342" text-anchor="middle" class="sm dim">5</text>
  <line x1="68" y1="326" x2="72" y2="326" class="tick"/>
  <text x="64" y="329.6" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="211" x2="72" y2="211" class="tick"/>
  <text x="64" y="214.6" text-anchor="end" class="sm dim">1,000</text>
  <line x1="68" y1="96" x2="72" y2="96" class="tick"/>
  <text x="64" y="99.6" text-anchor="end" class="sm dim">2,000</text>
