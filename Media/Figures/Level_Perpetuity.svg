  <rect x="122.26" y="102.99" width="8.23" height="97.01" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="134.74" y="107.61" width="8.23" height="92.39" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="147.22" y="112.01" width="8.23" height="87.99" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="159.69" y="116.2" width="8.23" height="83.8" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="172.17" y="120.19" width="8.23" height="79.81" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="184.64" y="123.99" width="8.23" height="76.01" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="197.12" y="127.61" width="8.23" height="72.39" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="209.6" y="131.06" width="8.23" height="68.94" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="222.07" y="134.34" width="8.23" height="65.66" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="234.55" y="137.47" width="8.23" height="62.53" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="247.03" y="140.45" width="8.23" height="59.55" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="259.5" y="143.28" width="8.23" height="56.72" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="271.98" y="145.98" width="8.23" height="54.02" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="284.45" y="148.55" width="8.23" height="51.45" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="296.93" y="151" width="8.23" height="49" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="309.41" y="153.34" width="8.23" height="46.66" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <line x1="64" y1="200" x2="336" y2="200" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="200" x2="64" y2="60" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76.48" y1="200" x2="76.48" y2="204" class="tick"/>
  <text x="76.48" y="216" text-anchor="middle" class="sm dim">1</text>
  <line x1="126.38" y1="200" x2="126.38" y2="204" class="tick"/>
  <text x="126.38" y="216" text-anchor="middle" class="sm dim">5</text>
  <line x1="188.76" y1="200" x2="188.76" y2="204" class="tick"/>
  <text x="188.76" y="216" text-anchor="middle" class="sm dim">10</text>
  <line x1="251.14" y1="200" x2="251.14" y2="204" class="tick"/>
  <text x="251.14" y="216" text-anchor="middle" class="sm dim">15</text>
  <line x1="313.52" y1="200" x2="313.52" y2="204" class="tick"/>
  <text x="313.52" y="216" text-anchor="middle" class="sm dim">20</text>
  <line x1="60" y1="138.1" x2="64" y2="138.1" class="tick"/>
  <text x="56" y="141.7" text-anchor="end" class="sm dim">0.5</text>
  <line x1="60" y1="76.19" x2="64" y2="76.19" class="tick"/>
  <text x="56" y="79.79" text-anchor="end" class="sm dim">1</text>
  <text x="326" y="232" text-anchor="end" class="sm dim">payment number</text>
  <text x="60" y="56" text-anchor="start" class="sm dim">present value of that payment</text>
  <text x="195" y="246" text-anchor="middle" class="sm dim">the terms shrink fast enough to converge</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">a₍∞₎ = Σ vᵏ = 1/i</text>
  <text x="430" y="120" text-anchor="middle" class="sm dim">at i = 5%:  1/0.05 = 20</text>
  <rect x="340" y="140" width="186" height="58" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="433" y="160" text-anchor="middle" class="sm bold">Perpetuity-due</text>
  <text x="433" y="178" text-anchor="middle" class="sm dim">ä₍∞₎ = 1/d = 21</text>
  <rect x="340" y="206" width="186" height="58" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="433" y="226" text-anchor="middle" class="sm bold">Growing at g &lt; i</text>
  <text x="433" y="244" text-anchor="middle" class="sm dim">PV = 1/(i − g)</text>
</svg>
