<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A riverbank in cross-section: homes high on the bank sit above both flood levels and are insurable, one lower home is priced high, and the home at the water's edge is uninsurable</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <polygon points="20,176 110,176 270,340 296,370 336,370 336,392 20,392" fill="var(--soft)"/>
    <polygon points="193.9,262 336,262 336,330 260.24,330" fill="#d97706" fill-opacity="0.20"/>
    <line x1="193.9" y1="262" x2="336" y2="262" class="thin dash" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="227.07,296 336,296 336,330 260.24,330" fill="#e11d48" fill-opacity="0.20"/>
    <line x1="227.07" y1="296" x2="336" y2="296" class="thin dash" stroke="#e11d48" stroke-width="1.5"/>
    <polygon points="260.24,330 336,330 336,370 296,370 270,340" fill="#3b82f6" fill-opacity="0.40"/>
    <polyline points="20,176 110,176 270,340 296,370 336,370" class="thin" stroke="var(--axis)" stroke-width="1.6"/>
    <polygon points="23.76,156.96 23.76,176 48.24,176 48.24,156.96 36,143.36" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="32.94" y="165.12" width="6.12" height="10.88" fill="#059669" fill-opacity="0.55"/>
    <polygon points="57.76,156.96 57.76,176 82.24,176 82.24,156.96 70,143.36" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="66.94" y="165.12" width="6.12" height="10.88" fill="#059669" fill-opacity="0.55"/>
    <polygon points="91.76,156.96 91.76,176 116.24,176 116.24,156.96 104,143.36" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="100.94" y="165.12" width="6.12" height="10.88" fill="#059669" fill-opacity="0.55"/>
    <polygon points="127.76,187.71 127.76,206.75 152.24,206.75 152.24,187.71 140,174.11" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="136.94" y="195.87" width="6.12" height="10.88" fill="#059669" fill-opacity="0.55"/>
    <polygon points="193.76,255.36 193.76,274.4 218.24,274.4 218.24,255.36 206,241.76" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="202.94" y="263.52" width="6.12" height="10.88" fill="#d97706" fill-opacity="0.55"/>
    <polygon points="230.76,293.28 230.76,312.32 255.24,312.32 255.24,293.28 243,279.69" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="239.94" y="301.44" width="6.12" height="10.88" fill="#e11d48" fill-opacity="0.55"/>
    <text x="88" y="132" text-anchor="middle" class="sm bold">insurable</text>
    <text x="226" y="254" text-anchor="start" class="sm bold">priced high</text>
    <text x="264" y="316" text-anchor="start" class="sm bold">uninsurable</text>
  </g>
</svg>
