<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Four bars growing from the running insurer's $158M of capital required to the $237M base solvency buffer (×1.5) and on to $356M at the 150% target and $439M at 185%, with its $248M of capital available cutting across them</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="36" y="96" text-anchor="start" class="sm bold">required</text>
    <rect x="36" y="104" width="101.12" height="32" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
    <text x="131.12" y="124" text-anchor="end" class="sm">158</text>
    <text x="36" y="166" text-anchor="start" class="sm bold">buffer ×1.5</text>
    <rect x="36" y="174" width="151.68" height="32" rx="3" fill="#0d9488" fill-opacity="0.6"/>
    <text x="181.68" y="194" text-anchor="end" class="sm">237</text>
    <text x="36" y="236" text-anchor="start" class="sm bold">150% target</text>
    <rect x="36" y="244" width="227.52" height="32" rx="3" fill="#d97706" fill-opacity="0.6"/>
    <text x="257.52" y="264" text-anchor="end" class="sm">356</text>
    <text x="36" y="306" text-anchor="start" class="sm bold">185% internal</text>
    <rect x="36" y="314" width="280.61" height="32" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
    <text x="310.61" y="334" text-anchor="end" class="sm">438</text>
    <line x1="194.72" y1="84" x2="194.72" y2="364" class="thin dash" stroke="#059669" stroke-width="1.6"/>
    <text x="194.72" y="380" text-anchor="middle" class="sm bold">available 248</text>
  </g>
</svg>
