  <circle cx="180" cy="169" r="9" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="180" cy="199" r="9" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="180" cy="229" r="9" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="180" cy="259" r="9" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="180" cy="289" r="9" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="290" cy="229" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.4"/>
  <text x="180" y="336" text-anchor="middle" class="sm dim">each hidden unit applies a non-linear g</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">fitted by backpropagation + gradient descent</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">flexible, but the weights do not interpret</text>
</svg>
