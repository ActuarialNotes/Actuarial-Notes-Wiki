<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The rate built up from pure premium and fixed expense, then grossed up for variable expense and profit</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Fixed expense is added, variable expense</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">divided</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Rate = (Pure Premium + F) / (1 − V − Q)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">(360 + 25) / (1 − 0.26 − 0.05) = 557.97</text>
  <rect x="72" y="122" width="216" height="62" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="146" text-anchor="middle" class="sm">360  pure premium</text>
  <text x="180" y="166" text-anchor="middle" class="sm">+ 25  fixed expense F</text>
  <line x1="72" y1="196" x2="288" y2="196" class="rule"/>
  <text x="180" y="216" text-anchor="middle" class="ttl">385</text>
  <line x1="180" y1="228" x2="180" y2="258" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="190" y="248" text-anchor="start" class="sm bold" fill="#d97706">÷ 0.69</text>
  <rect x="72" y="262" width="216" height="60" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.2"/>
  <text x="180" y="284" text-anchor="middle" class="sm">1 − V(0.26) − Q(0.05)</text>
  <text x="180" y="308" text-anchor="middle" class="sm dim">= 0.69 permissible</text>
  <rect x="66" y="340" width="228" height="32" rx="16.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="360" text-anchor="middle" class="sm">indicated rate  $557.97</text>
</svg>
