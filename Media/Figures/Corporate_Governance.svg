    <path d="M164.64,340 V321.76 Q164.64,314.08 173.28,314.08 H186.72 Q195.36,314.08 195.36,321.76 V340 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
