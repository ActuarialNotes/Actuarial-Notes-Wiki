  <text x="240.36" y="305.94" text-anchor="middle" class="sm bold" fill="#3b82f6">fixed F = 25</text>
  <circle cx="295.82" cy="136.77" r="4" fill="#d97706"/>
  <text x="287.82" y="138.77" text-anchor="end" class="sm bold" fill="#d97706">520</text>
  <circle cx="96.18" cy="308.88" r="3.4" fill="#d97706"/>
  <text x="180" y="360" text-anchor="middle" class="sm dim">policy premium</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">so it belongs in the denominator, not the numerator</text>
</svg>
