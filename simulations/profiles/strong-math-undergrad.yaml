# A final-year maths undergraduate: the material's prerequisites are solid, the
# financial vocabulary is new. If a guide fails this learner, it is the guide.
name: Priya (strong maths undergrad)
exam: FM
description: >
  Final-year mathematics student, top of her real analysis class, has passed
  Exam P. Has never worked in finance and has not seen interest theory beyond
  compound interest in high school.
prior_knowledge:
  calculus: multivariable calculus, sequences and series, comfortable with integrals and limits
