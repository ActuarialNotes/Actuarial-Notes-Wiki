    <circle cx="161.52" cy="311.92" r="5.94" fill="var(--surf)" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="198.48" cy="311.92" r="5.94" fill="var(--surf)" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="180" y="376" text-anchor="middle" class="sm bold">pool</text>
    <line x1="282" y1="206" x2="226" y2="268" class="thin dash" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <text x="266" y="246" text-anchor="start" class="sm">cede</text>
  </g>
</svg>
