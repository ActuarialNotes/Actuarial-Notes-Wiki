<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The Appointed Actuary's four statutory duties, and the escalation that ends at OSFI</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Appointed by the board, not by</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">management</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Value · opine · report on condition</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">· escalate a material adverse matter</text>
    <text x="38" y="106" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="54" y="106" text-anchor="start" class="sm">value the liabilities (ICA s. 365)</text>
    <text x="38" y="132" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="54" y="132" text-anchor="start" class="sm">give the Statement of Actuarial Opinion</text>
    <text x="38" y="158" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="54" y="158" text-anchor="start" class="sm">report on financial condition — the FCT</text>
    <text x="38" y="184" text-anchor="start" class="sm" fill="#3b82f6">•</text>
    <text x="54" y="184" text-anchor="start" class="sm">document the valuation in the AA's Report</text>
    <line x1="30" y1="216" x2="330" y2="216" class="rule"/>
    <text x="180" y="238" text-anchor="middle" class="sm bold">and when something is materially wrong</text>
    <rect x="36" y="259" width="88" height="26" rx="13.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
    <text x="80" y="276" text-anchor="middle" class="sm">CEO, CFO</text>
    <rect x="136" y="259" width="88" height="26" rx="13.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="276" text-anchor="middle" class="sm">directors</text>
    <line x1="125" y1="272" x2="135" y2="272" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="236" y="259" width="88" height="26" rx="13.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
    <text x="280" y="276" text-anchor="middle" class="sm">OSFI</text>
    <line x1="225" y1="272" x2="235" y2="272" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <text x="180" y="310" text-anchor="middle" class="sm dim">the dual accountability is the whole difficulty:</text>
    <text x="180" y="326" text-anchor="middle" class="sm dim">an employee, paid by the company, who owes a</text>
    <text x="180" y="342" text-anchor="middle" class="sm dim">duty that can run against it</text>
    <text x="180" y="370" text-anchor="middle" class="sm dim">removable only by the directors, and OSFI is told</text>
    <text x="180" y="386" text-anchor="middle" class="sm dim">— which is what makes the protection real</text>
  </g>
</svg>
