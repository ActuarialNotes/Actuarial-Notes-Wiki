<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A three-level rating factor expanded into dummy variables against a base level</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Levels become dummies, one is the base</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">k levels → k − 1 dummy variables</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">each β is relative to the base</text>
  <text x="88" y="102" text-anchor="middle" class="sm bold" fill="var(--ink)">territory</text>
  <text x="188" y="102" text-anchor="middle" class="sm bold" fill="#3b82f6">urban</text>
  <text x="288" y="102" text-anchor="middle" class="sm bold" fill="#3b82f6">suburban</text>
  <rect x="41" y="112" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="88" y="135" text-anchor="middle" class="sm">rural</text>
  <rect x="141" y="112" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="188" y="135" text-anchor="middle" class="sm bold">0</text>
  <rect x="241" y="112" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="288" y="135" text-anchor="middle" class="sm bold">0</text>
  <rect x="41" y="156" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="88" y="179" text-anchor="middle" class="sm">suburban</text>
  <rect x="141" y="156" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="188" y="179" text-anchor="middle" class="sm bold">0</text>
  <rect x="241" y="156" width="94" height="38" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="288" y="179" text-anchor="middle" class="sm bold">1</text>
  <rect x="41" y="200" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="88" y="223" text-anchor="middle" class="sm">urban</text>
  <rect x="141" y="200" width="94" height="38" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="188" y="223" text-anchor="middle" class="sm bold">1</text>
  <rect x="241" y="200" width="94" height="38" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="288" y="223" text-anchor="middle" class="sm bold">0</text>
  <text x="180" y="260" text-anchor="middle" class="sm dim">rural is the base level — all dummies 0</text>
  <text x="180" y="296" text-anchor="middle" class="sm dim">ordinal levels may instead be scored 1, 2, 3;</text>
  <text x="180" y="314" text-anchor="middle" class="sm dim">a continuous predictor needs no dummies at all</text>
</svg>
