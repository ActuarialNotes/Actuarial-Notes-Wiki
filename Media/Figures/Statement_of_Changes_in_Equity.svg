<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Opening equity reconciled to closing through comprehensive income, dividends and capital transactions</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The audit trail from opening equity to</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">closing</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Close = open + comprehensive income</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">− dividends + capital transactions</text>
    <rect x="47.02" y="155.46" width="35.96" height="108.54" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="65" y="147.46" text-anchor="middle" class="sm">245</text>
    <text x="65" y="279" text-anchor="middle" class="sm dim">open</text>
    <rect x="105.02" y="138" width="35.96" height="17.46" rx="3" fill="#059669" fill-opacity="0.72"/>
    <text x="123" y="130" text-anchor="middle" class="sm">39</text>
    <text x="123" y="279" text-anchor="middle" class="sm dim">net income</text>
    <rect x="163.02" y="138" width="35.96" height="6.2" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="181" y="130" text-anchor="middle" class="sm">14</text>
    <text x="181" y="279" text-anchor="middle" class="sm dim">OCI</text>
    <rect x="221.02" y="144.2" width="35.96" height="4.61" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="239" y="136.2" text-anchor="middle" class="sm">10</text>
    <text x="239" y="279" text-anchor="middle" class="sm dim">dividends</text>
    <rect x="279.02" y="148.81" width="35.96" height="115.19" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="297" y="140.81" text-anchor="middle" class="sm">260</text>
    <text x="297" y="279" text-anchor="middle" class="sm dim">close</text>
    <line x1="30" y1="264" x2="332" y2="264" class="axis"/>
    <text x="180" y="302" text-anchor="middle" class="sm dim">$M, the running insurer</text>
    <line x1="30" y1="320" x2="330" y2="320" class="rule"/>
    <text x="180" y="342" text-anchor="middle" class="sm dim">the dividend is the line OSFI watches: paying it</text>
    <text x="180" y="358" text-anchor="middle" class="sm dim">out while the capital ratio falls is distributing</text>
    <text x="180" y="374" text-anchor="middle" class="sm dim">capital the insurer may shortly need</text>
  </g>
</svg>
