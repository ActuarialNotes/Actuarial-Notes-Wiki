<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running insurer's $92M insurance and $54M market margins stacked to $146M beside the $120M actually required once they are combined — the outlined $26M gap is the diversification credit</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="68" y="193.76" width="84" height="158.24" rx="3" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="110" y="276.88" text-anchor="middle" class="sm">insurance 92</text>
    <rect x="68" y="100.88" width="84" height="92.88" rx="3" fill="#0d9488" fill-opacity="0.7"/>
    <text x="110" y="151.32" text-anchor="middle" class="sm">market 54</text>
    <text x="110" y="92.88" text-anchor="middle" class="sm bold">146</text>
    <text x="110" y="370" text-anchor="middle" class="sm dim">added</text>
    <rect x="208" y="145.6" width="84" height="206.4" rx="3" fill="#059669" fill-opacity="0.7"/>
    <text x="250" y="252.8" text-anchor="middle" class="bold">120</text>
    <rect x="208" y="100.88" width="84" height="44.72" rx="3" fill="#e11d48" fill-opacity="0.1" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="250" y="127.24" text-anchor="middle" class="sm bold">credit −26</text>
    <text x="250" y="370" text-anchor="middle" class="sm dim">combined</text>
    <line x1="152" y1="100.88" x2="208" y2="100.88" class="thin dot" stroke="var(--dim)"/>
    <line x1="40" y1="352" x2="320" y2="352" class="axis"/>
  </g>
</svg>
