<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A death benefit of 1 discounted from the year of death back to issue</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Pay 1 at the end of the year of death</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Aₓ = Σ vᵏ⁺¹ · ₖ|qₓ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">= E[ v^(K+1) ]</text>
  <line x1="36" y1="162" x2="330" y2="162" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="46" y1="158" x2="46" y2="166" class="tick"/>
  <text x="46" y="180" text-anchor="middle" class="sm dim">0</text>
  <line x1="90.67" y1="158" x2="90.67" y2="166" class="tick"/>
  <text x="90.67" y="180" text-anchor="middle" class="sm dim">1</text>
  <line x1="135.33" y1="158" x2="135.33" y2="166" class="tick"/>
  <text x="135.33" y="180" text-anchor="middle" class="sm dim">2</text>
  <line x1="180" y1="158" x2="180" y2="166" class="tick"/>
  <text x="180" y="180" text-anchor="middle" class="sm dim">3</text>
  <line x1="224.67" y1="158" x2="224.67" y2="166" class="tick"/>
  <text x="224.67" y="180" text-anchor="middle" class="sm dim">4</text>
  <line x1="269.33" y1="158" x2="269.33" y2="166" class="tick"/>
  <text x="269.33" y="180" text-anchor="middle" class="sm dim">5</text>
  <line x1="314" y1="158" x2="314" y2="166" class="tick"/>
  <text x="314" y="180" text-anchor="middle" class="sm dim">…</text>
  <text x="46" y="128" text-anchor="middle" class="sm dim">issue</text>
  <circle cx="224.67" cy="162" r="4.6" fill="#e11d48"/>
  <text x="224.67" y="198" text-anchor="middle" class="sm" fill="#e11d48">death in year 4</text>
  <line x1="224.67" y1="150" x2="224.67" y2="104" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="224.67" y="98" text-anchor="middle" class="bold" fill="#e11d48">1</text>
  <line x1="218.67" y1="88" x2="50" y2="88" class="thin dash" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah3b82f6)"/>
  <text x="135.33" y="82" text-anchor="middle" class="sm" fill="#3b82f6">discount v⁴</text>
  <line x1="66" y1="352" x2="330" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="66" y1="352" x2="66" y2="246" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="87.17" y1="352" x2="87.17" y2="356" class="tick"/>
  <text x="87.17" y="368" text-anchor="middle" class="sm dim">0</text>
  <line x1="129.5" y1="352" x2="129.5" y2="356" class="tick"/>
  <text x="129.5" y="368" text-anchor="middle" class="sm dim">1</text>
  <line x1="171.83" y1="352" x2="171.83" y2="356" class="tick"/>
  <text x="171.83" y="368" text-anchor="middle" class="sm dim">2</text>
  <line x1="214.17" y1="352" x2="214.17" y2="356" class="tick"/>
  <text x="214.17" y="368" text-anchor="middle" class="sm dim">3</text>
  <line x1="256.5" y1="352" x2="256.5" y2="356" class="tick"/>
  <text x="256.5" y="368" text-anchor="middle" class="sm dim">4</text>
  <line x1="298.83" y1="352" x2="298.83" y2="356" class="tick"/>
  <text x="298.83" y="368" text-anchor="middle" class="sm dim">5</text>
  <text x="320" y="384" text-anchor="end" class="sm dim">year of death k</text>
  <rect x="76.17" y="336" width="22" height="16" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="118.5" y="329.6" width="22" height="22.4" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="160.83" y="320" width="22" height="32" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="203.17" y="307.2" width="22" height="44.8" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="245.5" y="291.2" width="22" height="60.8" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <rect x="287.83" y="275.2" width="22" height="76.8" rx="1.5" fill="#e11d48" fill-opacity="0.6"/>
  <text x="66" y="250" text-anchor="start" class="sm dim">probability of dying in year k</text>
</svg>
