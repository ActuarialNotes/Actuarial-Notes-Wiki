  <text x="135.28" y="170" text-anchor="middle" class="sm dim">X₍2₎</text>
  <circle cx="163.12" cy="182" r="5" fill="#3b82f6"/>
  <text x="163.12" y="170" text-anchor="middle" class="sm dim">X₍3₎</text>
  <circle cx="211.84" cy="182" r="5" fill="#3b82f6"/>
