    <polygon points="145,316 135.07,318.93 140.02,328.02 130.93,323.07 128,333 125.07,323.07 115.98,328.02 120.93,318.93 111,316 120.93,313.07 115.98,303.98 125.07,308.93 128,299 130.93,308.93 140.02,303.98 135.07,313.07" fill="#e11d48" fill-opacity="0.30" stroke="#e11d48" stroke-width="1.3" stroke-linejoin="round"/>
