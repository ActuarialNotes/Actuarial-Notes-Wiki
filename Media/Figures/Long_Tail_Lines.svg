<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A long-tail reporting pattern only 52.6% reported at 12 months, the unreported gap shaded as IBNR, beside a short-tail pattern that is nearly complete at once</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="101" y1="94" x2="101" y2="344" class="grid"/>
    <line x1="163" y1="94" x2="163" y2="344" class="grid"/>
    <line x1="225" y1="94" x2="225" y2="344" class="grid"/>
    <line x1="287" y1="94" x2="287" y2="344" class="grid"/>
    <line x1="70" y1="344" x2="318" y2="344" class="grid"/>
    <line x1="70" y1="228.26" x2="318" y2="228.26" class="grid"/>
    <line x1="70" y1="112.52" x2="318" y2="112.52" class="grid"/>
    <line x1="70" y1="344" x2="328" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="70" y1="344" x2="70" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="101" y1="344" x2="101" y2="348" class="tick"/>
    <text x="101" y="360" text-anchor="middle" class="sm dim">12</text>
    <line x1="163" y1="344" x2="163" y2="348" class="tick"/>
    <text x="163" y="360" text-anchor="middle" class="sm dim">36</text>
    <line x1="225" y1="344" x2="225" y2="348" class="tick"/>
    <text x="225" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="287" y1="344" x2="287" y2="348" class="tick"/>
    <text x="287" y="360" text-anchor="middle" class="sm dim">84</text>
    <line x1="66" y1="344" x2="70" y2="344" class="tick"/>
    <text x="62" y="347.6" text-anchor="end" class="sm dim">0%</text>
    <line x1="66" y1="228.26" x2="70" y2="228.26" class="tick"/>
    <text x="62" y="231.86" text-anchor="end" class="sm dim">50%</text>
    <line x1="66" y1="112.52" x2="70" y2="112.52" class="tick"/>
    <text x="62" y="116.12" text-anchor="end" class="sm dim">100%</text>
    <text x="318" y="376" text-anchor="end" class="sm dim">age in months</text>
    <polygon points="101,222.24 132,161.36 163,131.96 194,119.23 225,114.83 256,112.98 287,112.52 318,112.52 101,112.52" fill="#3b82f6" fill-opacity="0.14" stroke="none"/>
    <polyline points="101,126.41 132,114.83 163,112.52 194,112.52 225,112.52 256,112.52 287,112.52 318,112.52" class="curve dash" stroke="var(--dim)" stroke-width="1.6"/>
    <polyline points="101,222.24 132,161.36 163,131.96 194,119.23 225,114.83 256,112.98 287,112.52 318,112.52" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <circle cx="101" cy="222.24" r="3" fill="#3b82f6"/>
    <circle cx="132" cy="161.36" r="3" fill="#3b82f6"/>
    <circle cx="163" cy="131.96" r="3" fill="#3b82f6"/>
    <circle cx="194" cy="119.23" r="3" fill="#3b82f6"/>
    <circle cx="225" cy="114.83" r="3" fill="#3b82f6"/>
    <circle cx="256" cy="112.98" r="3" fill="#3b82f6"/>
    <circle cx="287" cy="112.52" r="3" fill="#3b82f6"/>
    <circle cx="318" cy="112.52" r="3" fill="#3b82f6"/>
    <circle cx="101" cy="222.24" r="4.2" fill="#e11d48"/>
    <text x="109" y="236.24" text-anchor="start" class="sm bold">52.6%</text>
    <text x="119.08" y="144.93" text-anchor="middle" class="sm bold">IBNR</text>
    <text x="225" y="200.48" text-anchor="middle" class="sm bold" fill="#3b82f6">long tail</text>
    <text x="177.33" y="105.52" text-anchor="start" class="sm dim">short tail</text>
  </g>
</svg>
