<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Reserving looking backwards at claims already incurred while ratemaking looks forwards</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The retrospective half of the actuarial</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">job</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Total Reserve = Case Reserves + IBNR</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">IBNR = Pure IBNR + IBNER</text>
  <line x1="44" y1="168" x2="316" y2="168" class="axis"/>
  <line x1="180" y1="156" x2="180" y2="180" class="tick"/>
  <text x="180" y="198" text-anchor="middle" class="sm dim">valuation date</text>
  <line x1="170" y1="134" x2="52" y2="134" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="90" y="124" text-anchor="middle" class="sm bold" fill="#3b82f6">reserving</text>
  <text x="90" y="108" text-anchor="middle" class="sm dim">what past losses will cost</text>
  <line x1="190" y1="134" x2="308" y2="134" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="270" y="124" text-anchor="middle" class="sm bold" fill="#d97706">ratemaking</text>
  <text x="270" y="108" text-anchor="middle" class="sm dim">what future losses will cost</text>
  <text x="180" y="246" text-anchor="middle" class="sm dim">the liability being estimated</text>
  <rect x="44" y="271" width="114.24" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
  <text x="101.12" y="292" text-anchor="middle" class="sm">case reserves</text>
  <rect x="158.24" y="271" width="157.76" height="34" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="237.12" y="292" text-anchor="middle" class="sm">IBNR</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">the claims department sets the first;</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">the actuary is responsible for the second</text>
</svg>
