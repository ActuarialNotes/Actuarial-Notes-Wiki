<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The complement carrying the weight that experience does not</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The complement carries the other (1 − Z)</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Est = Z × experience + (1 − Z) × complement</text>
  <rect x="48" y="107" width="224.4" height="26" rx="4" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.2"/>
  <rect x="272.4" y="107" width="39.6" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="160.2" y="124" text-anchor="middle" class="sm">complement</text>
  <text x="292.2" y="124" text-anchor="middle" class="sm">experience</text>
  <text x="180" y="98" text-anchor="middle" class="sm dim">thin class — Z = 0.15</text>
  <rect x="48" y="169" width="124.08" height="26" rx="4" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.2"/>
  <rect x="172.08" y="169" width="139.92" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="110.04" y="186" text-anchor="middle" class="sm">complement</text>
  <text x="242.04" y="186" text-anchor="middle" class="sm">experience</text>
  <text x="180" y="160" text-anchor="middle" class="sm dim">300 claims — Z = 0.53</text>
  <rect x="48" y="231" width="26.4" height="26" rx="4" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.2"/>
  <rect x="74.4" y="231" width="237.6" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="61.2" y="248" text-anchor="middle" class="sm">complement</text>
  <text x="193.2" y="248" text-anchor="middle" class="sm">experience</text>
  <text x="180" y="222" text-anchor="middle" class="sm dim">large class — Z = 0.90</text>
  <text x="180" y="322" text-anchor="middle" class="sm dim">the smaller Z is, the more the complement</text>
  <text x="180" y="338" text-anchor="middle" class="sm dim">decides the answer — so choose it well</text>
  <text x="180" y="390" text-anchor="middle" class="sm bold">accurate · unbiased · independent · available</text>
</svg>
