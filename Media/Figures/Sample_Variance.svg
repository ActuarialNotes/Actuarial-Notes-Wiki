<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five observations as stems from their mean of 10, each stem the deviation that gets squared</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="50" y1="356" x2="336" y2="356" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="50" y1="356" x2="50" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="46" y1="356" x2="50" y2="356" class="tick"/>
    <text x="42" y="359.6" text-anchor="end" class="sm dim">0</text>
    <line x1="46" y1="237.82" x2="50" y2="237.82" class="tick"/>
    <text x="42" y="241.42" text-anchor="end" class="sm dim">10</text>
    <line x1="46" y1="119.64" x2="50" y2="119.64" class="tick"/>
    <text x="42" y="123.24" text-anchor="end" class="sm dim">20</text>
    <line x1="50" y1="237.82" x2="326" y2="237.82" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
    <text x="63.8" y="230.82" text-anchor="start" class="sm bold">X̄</text>
    <polyline points="96,237.82 96,308.73" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="96" cy="308.73" r="4" fill="#3b82f6"/>
    <text x="109" y="273.27" text-anchor="middle" class="sm" fill="#3b82f6">-6</text>
    <polyline points="142,237.82 142,285.09" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="142" cy="285.09" r="4" fill="#3b82f6"/>
    <text x="155" y="261.45" text-anchor="middle" class="sm" fill="#3b82f6">-4</text>
    <polyline points="188,237.82 188,249.64" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="188" cy="249.64" r="4" fill="#3b82f6"/>
    <text x="201" y="243.73" text-anchor="middle" class="sm" fill="#3b82f6">-1</text>
    <polyline points="234,237.82 234,226" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="234" cy="226" r="4" fill="#3b82f6"/>
    <text x="247" y="231.91" text-anchor="middle" class="sm" fill="#3b82f6">+1</text>
    <polyline points="280,237.82 280,119.64" class="curve" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="280" cy="119.64" r="4" fill="#3b82f6"/>
    <text x="293" y="178.73" text-anchor="middle" class="sm" fill="#3b82f6">+10</text>
  </g>
</svg>
