<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A time axis split at the valuation date: reserving looks back at claims already incurred, some carried as case reserves and some still IBNR, while ratemaking looks ahead at claims yet to happen</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="52" y1="340" x2="52" y2="230" class="thin" stroke="#d97706" stroke-width="2"/>
    <circle cx="52" cy="230" r="5" fill="#d97706" fill-opacity="0.8" stroke="#d97706" stroke-width="1.6"/>
    <line x1="72" y1="340" x2="72" y2="268" class="thin" stroke="#d97706" stroke-width="2"/>
    <circle cx="72" cy="268" r="5" fill="#d97706" fill-opacity="0.8" stroke="#d97706" stroke-width="1.6"/>
    <line x1="92" y1="340" x2="92" y2="180" class="thin" stroke="#d97706" stroke-width="2"/>
    <circle cx="92" cy="180" r="5" fill="#d97706" fill-opacity="0.8" stroke="#d97706" stroke-width="1.6"/>
    <line x1="112" y1="340" x2="112" y2="244" class="thin" stroke="#d97706" stroke-width="2"/>
    <circle cx="112" cy="244" r="5" fill="#d97706" fill-opacity="0.8" stroke="#d97706" stroke-width="1.6"/>
    <line x1="130" y1="340" x2="130" y2="276" class="thin dash" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="130" cy="276" r="5" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.6"/>
    <line x1="146" y1="340" x2="146" y2="212" class="thin" stroke="#d97706" stroke-width="2"/>
    <circle cx="146" cy="212" r="5" fill="#d97706" fill-opacity="0.8" stroke="#d97706" stroke-width="1.6"/>
    <line x1="162" y1="340" x2="162" y2="252" class="thin dash" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="162" cy="252" r="5" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.6"/>
    <line x1="180" y1="340" x2="180" y2="194" class="thin dash" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="180" cy="194" r="5" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.6"/>
    <line x1="224" y1="340" x2="224" y2="254" class="thin dot" stroke="var(--dim)" stroke-width="1.6"/>
    <circle cx="224" cy="254" r="5" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="246" y1="340" x2="246" y2="212" class="thin dot" stroke="var(--dim)" stroke-width="1.6"/>
    <circle cx="246" cy="212" r="5" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="270" y1="340" x2="270" y2="270" class="thin dot" stroke="var(--dim)" stroke-width="1.6"/>
    <circle cx="270" cy="270" r="5" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="292" y1="340" x2="292" y2="228" class="thin dot" stroke="var(--dim)" stroke-width="1.6"/>
    <circle cx="292" cy="228" r="5" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="314" y1="340" x2="314" y2="246" class="thin dot" stroke="var(--dim)" stroke-width="1.6"/>
    <circle cx="314" cy="246" r="5" fill="none" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="92" y="168" text-anchor="middle" class="sm bold">case</text>
    <text x="180" y="182" text-anchor="middle" class="sm bold">IBNR</text>
    <line x1="36" y1="340" x2="332" y2="340" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="200" y1="96" x2="200" y2="346" class="thin dash" stroke="var(--ink)" stroke-width="1.3"/>
    <text x="200" y="362" text-anchor="middle" class="sm dim">valuation date</text>
    <line x1="192" y1="120" x2="46" y2="120" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="122" y="110" text-anchor="middle" class="sm bold">reserving</text>
    <line x1="208" y1="120" x2="322" y2="120" class="thin" stroke="#d97706" stroke-width="2" marker-end="url(#ahd97706)"/>
    <text x="264" y="110" text-anchor="middle" class="sm bold">ratemaking</text>
  </g>
</svg>
