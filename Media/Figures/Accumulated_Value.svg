  <line x1="58" y1="192" x2="58" y2="196" class="tick"/>
  <text x="58" y="208" text-anchor="middle" class="sm dim">0</text>
  <line x1="141.33" y1="192" x2="141.33" y2="196" class="tick"/>
  <text x="141.33" y="208" text-anchor="middle" class="sm dim">2</text>
  <line x1="224.67" y1="192" x2="224.67" y2="196" class="tick"/>
  <text x="224.67" y="208" text-anchor="middle" class="sm dim">4</text>
  <line x1="308" y1="192" x2="308" y2="196" class="tick"/>
  <text x="308" y="208" text-anchor="middle" class="sm dim">6</text>
  <line x1="54" y1="110.71" x2="58" y2="110.71" class="tick"/>
  <text x="50" y="114.31" text-anchor="end" class="sm dim">1</text>
  <line x1="54" y1="70.06" x2="58" y2="70.06" class="tick"/>
  <text x="50" y="73.66" text-anchor="end" class="sm dim">1.5</text>
  <text x="308" y="224" text-anchor="end" class="sm dim">time t</text>
  <text x="54" y="52" text-anchor="start" class="sm dim">value of 1</text>
  <circle cx="58" cy="110.71" r="3.6" fill="#d97706"/>
  <text x="72" y="100.71" text-anchor="middle" class="sm">PV</text>
  <circle cx="249.67" cy="81.03" r="3.6" fill="#059669"/>
  <text x="249.67" y="71.03" text-anchor="middle" class="sm">AV</text>
  <line x1="249.67" y1="192" x2="249.67" y2="81.03" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="420" y="96" text-anchor="middle" class="sm bold">AV = PV · a(t) = PV (1 + i)^t</text>
  <line x1="316" y1="116" x2="316" y2="148" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="128" text-anchor="start" class="sm bold">Accumulation factor</text>
  <text x="326" y="144" text-anchor="start" class="sm dim">a(t)/a(s) grows a flow s → t</text>
  <line x1="316" y1="162" x2="316" y2="194" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="174" text-anchor="start" class="sm bold">A stream of flows</text>
  <text x="326" y="190" text-anchor="start" class="sm dim">AV = Σ C_t (1+i)^(n−t)</text>
  <line x1="316" y1="208" x2="316" y2="240" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="220" text-anchor="start" class="sm bold">The mirror of PV</text>
  <text x="326" y="236" text-anchor="start" class="sm dim">PV goes back, AV goes forward</text>
  <text x="280" y="254" text-anchor="middle" class="sm dim">Same rate, same timeline — only the valuation date changes</text>
</svg>
