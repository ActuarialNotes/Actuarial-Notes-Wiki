<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 298" width="560" height="298" role="img">
  <title>Payments growing at a constant rate against a level stream</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="296.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Geometric payments multiply, they do not add</text>
  <line x1="88" y1="132" x2="442" y2="132" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="96" y1="128" x2="96" y2="136" class="tick"/>
  <text x="96" y="149" text-anchor="middle" class="sm dim">0</text>
  <line x1="150.67" y1="128" x2="150.67" y2="136" class="tick"/>
  <text x="150.67" y="149" text-anchor="middle" class="sm dim">1</text>
  <line x1="205.33" y1="128" x2="205.33" y2="136" class="tick"/>
  <text x="205.33" y="149" text-anchor="middle" class="sm dim">2</text>
  <line x1="260" y1="128" x2="260" y2="136" class="tick"/>
  <text x="260" y="149" text-anchor="middle" class="sm dim">3</text>
  <line x1="314.67" y1="128" x2="314.67" y2="136" class="tick"/>
  <text x="314.67" y="149" text-anchor="middle" class="sm dim">4</text>
  <line x1="369.33" y1="128" x2="369.33" y2="136" class="tick"/>
  <text x="369.33" y="149" text-anchor="middle" class="sm dim">5</text>
  <line x1="424" y1="128" x2="424" y2="136" class="tick"/>
  <text x="424" y="149" text-anchor="middle" class="sm dim">6</text>
  <rect x="139.67" y="109.49" width="22" height="22.51" rx="2" fill="#e11d48" fill-opacity="0.55"/>
  <text x="150.67" y="102.49" text-anchor="middle" class="sm">1.00</text>
  <rect x="194.33" y="104.99" width="22" height="27.01" rx="2" fill="#e11d48" fill-opacity="0.55"/>
  <text x="205.33" y="97.99" text-anchor="middle" class="sm">1.20</text>
  <rect x="249" y="99.59" width="22" height="32.41" rx="2" fill="#e11d48" fill-opacity="0.55"/>
  <text x="260" y="92.59" text-anchor="middle" class="sm">1.44</text>
  <rect x="303.67" y="93.11" width="22" height="38.89" rx="2" fill="#e11d48" fill-opacity="0.55"/>
  <text x="314.67" y="86.11" text-anchor="middle" class="sm">1.73</text>
  <rect x="358.33" y="85.33" width="22" height="46.67" rx="2" fill="#e11d48" fill-opacity="0.55"/>
  <text x="369.33" y="78.33" text-anchor="middle" class="sm">2.07</text>
  <rect x="413" y="76" width="22" height="56" rx="2" fill="#e11d48" fill-opacity="0.55"/>
  <text x="424" y="69" text-anchor="middle" class="sm">2.49</text>
  <text x="444" y="92" text-anchor="start" class="sm" fill="#e11d48">× (1 + g) each</text>
  <line x1="28" y1="200" x2="532" y2="200" class="rule"/>
  <text x="150" y="222" text-anchor="middle" class="sm bold">PV = [1 − ((1+g)/(1+i))ⁿ] / (i − g)</text>
  <text x="150" y="244" text-anchor="middle" class="sm dim">for i ≠ g</text>
  <text x="150" y="264" text-anchor="middle" class="sm dim">i = g:  PV = n · v</text>
  <text x="412" y="222" text-anchor="middle" class="sm bold">Geometric perpetuity</text>
  <text x="412" y="244" text-anchor="middle" class="sm dim">PV = 1/(i − g), needs i &gt; g</text>
  <text x="412" y="264" text-anchor="middle" class="sm dim">otherwise the sum diverges</text>
  <text x="280" y="288" text-anchor="middle" class="sm dim">Equivalently: a level annuity valued at rate j = (1+i)/(1+g) − 1</text>
</svg>
