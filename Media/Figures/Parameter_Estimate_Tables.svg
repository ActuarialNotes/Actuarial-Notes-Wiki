<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three coefficient estimates drawn as dots with two-standard-error whiskers against zero, each tagged with its relativity; prior claim's whisker crosses zero</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="94" y1="348" x2="320" y2="348" class="axis"/>
    <line x1="94" y1="90" x2="94" y2="348" class="axis"/>
    <line x1="141.58" y1="348" x2="141.58" y2="352" class="tick"/>
    <text x="141.58" y="364" text-anchor="middle" class="sm dim">0</text>
    <line x1="189.16" y1="348" x2="189.16" y2="352" class="tick"/>
    <text x="189.16" y="364" text-anchor="middle" class="sm dim">0.2</text>
    <line x1="236.74" y1="348" x2="236.74" y2="352" class="tick"/>
    <text x="236.74" y="364" text-anchor="middle" class="sm dim">0.4</text>
    <line x1="284.32" y1="348" x2="284.32" y2="352" class="tick"/>
    <text x="284.32" y="364" text-anchor="middle" class="sm dim">0.6</text>
    <text x="320" y="380" text-anchor="end" class="sm dim">β̂</text>
    <line x1="141.58" y1="348" x2="141.58" y2="90" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <polyline points="165.37,133 241.49,133" class="curve" stroke="#059669" stroke-width="2.4"/>
    <line x1="165.37" y1="127" x2="165.37" y2="139" stroke="#059669" stroke-width="1.6"/>
    <line x1="241.49" y1="127" x2="241.49" y2="139" stroke="#059669" stroke-width="1.6"/>
    <circle cx="203.43" cy="133" r="5" fill="#059669"/>
    <text x="86" y="137" text-anchor="end" class="sm">urban</text>
    <text x="203.43" y="121" text-anchor="middle" class="sm bold">× 1.30</text>
    <polyline points="196.29,204.67 281.94,204.67" class="curve" stroke="#059669" stroke-width="2.4"/>
    <line x1="196.29" y1="198.67" x2="196.29" y2="210.67" stroke="#059669" stroke-width="1.6"/>
    <line x1="281.94" y1="198.67" x2="281.94" y2="210.67" stroke="#059669" stroke-width="1.6"/>
    <circle cx="239.12" cy="204.67" r="5" fill="#059669"/>
    <text x="86" y="208.67" text-anchor="end" class="sm">young driver</text>
    <text x="239.12" y="192.67" text-anchor="middle" class="sm bold">× 1.51</text>
    <polyline points="136.82,276.33 231.98,276.33" class="curve" stroke="#d97706" stroke-width="2.4"/>
    <line x1="136.82" y1="270.33" x2="136.82" y2="282.33" stroke="#d97706" stroke-width="1.6"/>
    <line x1="231.98" y1="270.33" x2="231.98" y2="282.33" stroke="#d97706" stroke-width="1.6"/>
    <circle cx="184.4" cy="276.33" r="5" fill="#d97706"/>
    <text x="86" y="280.33" text-anchor="end" class="sm">prior claim</text>
    <text x="184.4" y="264.33" text-anchor="middle" class="sm bold">× 1.20</text>
  </g>
</svg>
