<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A two-stage probability tree, with the path through A and then B picked out and its branch probabilities multiplied at the leaf</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <circle cx="180" cy="88" r="6" fill="var(--dim)"/>
    <line x1="180" y1="96" x2="100" y2="186" class="thin" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#ah3b82f6)"/>
    <text x="124" y="143" text-anchor="middle" class="sm bold">0.30</text>
    <circle cx="100" cy="206" r="18" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="100" y="211" text-anchor="middle">A</text>
    <line x1="180" y1="96" x2="260" y2="186" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="236" y="143" text-anchor="middle" class="sm">0.70</text>
    <circle cx="260" cy="206" r="18" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.4"/>
    <text x="260" y="211" text-anchor="middle">Aᶜ</text>
    <line x1="100" y1="225" x2="50" y2="302" class="thin" stroke="#059669" stroke-width="2.4" marker-end="url(#ah059669)"/>
    <text x="59" y="264" text-anchor="middle" class="sm bold">0.80</text>
    <circle cx="50" cy="322" r="18" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.4"/>
    <text x="50" y="327" text-anchor="middle">B</text>
    <line x1="100" y1="225" x2="144" y2="302" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="138" y="264" text-anchor="middle" class="sm">0.20</text>
    <circle cx="144" cy="322" r="18" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.4"/>
    <text x="144" y="327" text-anchor="middle">Bᶜ</text>
    <line x1="260" y1="225" x2="216" y2="302" class="thin" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
    <text x="222" y="264" text-anchor="middle" class="sm">0.10</text>
    <circle cx="216" cy="322" r="18" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.4"/>
    <text x="216" y="327" text-anchor="middle">B</text>
    <line x1="260" y1="225" x2="310" y2="302" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
    <text x="301" y="264" text-anchor="middle" class="sm">0.90</text>
    <circle cx="310" cy="322" r="18" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.4"/>
    <text x="310" y="327" text-anchor="middle">Bᶜ</text>
    <text x="50" y="364" text-anchor="middle" class="bold">0.24</text>
  </g>
</svg>
