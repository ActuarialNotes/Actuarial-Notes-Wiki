<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The two distinct failures — a rate difference with no cost basis, and a cost-based difference on a barred basis</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Same expected cost, same price</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="438" text-anchor="middle" class="fml">Premium ratio = expected loss ratio</text>
    <text x="180" y="100" text-anchor="middle" class="sm dim">two failures that get confused</text>
    <rect x="36" y="118" width="288" height="86" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
    <text x="180" y="140" text-anchor="middle" class="sm bold" fill="#e11d48">No cost basis</text>
    <text x="180" y="162" text-anchor="middle" class="sm">priced on elasticity, not on loss —</text>
    <text x="180" y="180" text-anchor="middle" class="sm">an actuarial failure</text>
    <rect x="36" y="218" width="288" height="86" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="240" text-anchor="middle" class="sm bold" fill="#7c3aed">Barred basis</text>
    <text x="180" y="262" text-anchor="middle" class="sm">the data supports the difference and</text>
    <text x="180" y="280" text-anchor="middle" class="sm">the law forbids it anyway</text>
    <text x="180" y="330" text-anchor="middle" class="sm dim">the second is a policy override, and the actuary's</text>
    <text x="180" y="346" text-anchor="middle" class="sm dim">job is to say so rather than to defend the rate</text>
    <text x="180" y="374" text-anchor="middle" class="sm dim">a proxy reproduces a barred variable — also unfair</text>
  </g>
</svg>
