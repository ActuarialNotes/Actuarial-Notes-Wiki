<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The latest diagonal of the triangle multiplied by each year's cumulative development factor</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Multiply the latest diagonal out to</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">ultimate</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">U = C(AY, n) × CDF(n → ult)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1,500 × 1.900 = 2,850</text>
  <text x="180" y="108" text-anchor="middle" class="sm dim">reported to date × CDF = ultimate ($000)</text>
  <text x="56" y="146" text-anchor="start" class="sm dim">2020</text>
  <text x="150" y="146" text-anchor="end" class="sm">1,882</text>
  <text x="216" y="146" text-anchor="end" class="sm dim">× 1.010</text>
  <text x="304" y="146" text-anchor="end" class="sm" fill="var(--ink)">1,901</text>
  <text x="56" y="180" text-anchor="start" class="sm dim">2021</text>
  <text x="150" y="180" text-anchor="end" class="sm">2,029</text>
  <text x="216" y="180" text-anchor="end" class="sm dim">× 1.030</text>
  <text x="304" y="180" text-anchor="end" class="sm" fill="var(--ink)">2,090</text>
  <text x="56" y="214" text-anchor="start" class="sm dim">2022</text>
  <text x="150" y="214" text-anchor="end" class="sm">2,088</text>
  <text x="216" y="214" text-anchor="end" class="sm dim">× 1.092</text>
  <text x="304" y="214" text-anchor="end" class="sm" fill="var(--ink)">2,280</text>
  <text x="56" y="248" text-anchor="start" class="sm dim">2023</text>
  <text x="150" y="248" text-anchor="end" class="sm">2,025</text>
  <text x="216" y="248" text-anchor="end" class="sm dim">× 1.267</text>
  <text x="304" y="248" text-anchor="end" class="sm" fill="var(--ink)">2,566</text>
  <text x="56" y="282" text-anchor="start" class="sm bold">2024</text>
  <text x="150" y="282" text-anchor="end" class="sm">1,500</text>
  <text x="216" y="282" text-anchor="end" class="sm dim">× 1.900</text>
  <text x="304" y="282" text-anchor="end" class="sm bold" fill="#059669">2,850</text>
  <text x="180" y="320" text-anchor="middle" class="sm dim">every dollar of the diagonal is scaled by the</text>
  <text x="180" y="338" text-anchor="middle" class="sm dim">full factor — so a distorted diagonal is</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">multiplied, not merely added to</text>
</svg>
