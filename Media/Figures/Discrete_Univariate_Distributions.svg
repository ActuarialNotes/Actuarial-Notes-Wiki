<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>A decision path from the wording of a question to the right discrete family</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Identifying the discrete family</text>
  <text x="280" y="38" text-anchor="middle" class="sub">read for what is counted and whether the trial count is fixed</text>
  <text x="34" y="78" text-anchor="start" class="sm bold">Fixed number of trials</text>
  <line x1="34" y1="90" x2="34" y2="110" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="44" y="102" text-anchor="start" class="sm dim">with replacement / independent</text>
  <text x="300" y="102" text-anchor="start" class="sm bold" fill="#3b82f6">Binomial (n, p)</text>
  <text x="528" y="102" text-anchor="end" class="sm dim">E[X] = np</text>
  <line x1="34" y1="114" x2="34" y2="134" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <text x="44" y="126" text-anchor="start" class="sm dim">without replacement, finite pool</text>
  <text x="300" y="126" text-anchor="start" class="sm bold" fill="#7c3aed">Hypergeometric (N, K, n)</text>
  <text x="528" y="126" text-anchor="end" class="sm dim">E[X] = nK/N</text>
  <text x="34" y="144" text-anchor="start" class="sm bold">Trials until a success</text>
  <line x1="34" y1="156" x2="34" y2="176" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="44" y="168" text-anchor="start" class="sm dim">first success</text>
  <text x="300" y="168" text-anchor="start" class="sm bold" fill="#059669">Geometric (p)</text>
  <text x="528" y="168" text-anchor="end" class="sm dim">E[X] = 1/p</text>
  <line x1="34" y1="180" x2="34" y2="200" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
  <text x="44" y="192" text-anchor="start" class="sm dim">r-th success</text>
  <text x="300" y="192" text-anchor="start" class="sm bold" fill="#0d9488">Negative binomial (r, p)</text>
  <text x="528" y="192" text-anchor="end" class="sm dim">E[X] = r/p</text>
  <text x="34" y="210" text-anchor="start" class="sm bold">No trials at all</text>
  <line x1="34" y1="222" x2="34" y2="242" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="44" y="234" text-anchor="start" class="sm dim">count per unit time or space</text>
  <text x="300" y="234" text-anchor="start" class="sm bold" fill="#d97706">Poisson (λ)</text>
  <text x="528" y="234" text-anchor="end" class="sm dim">E[X] = λ</text>
  <line x1="34" y1="246" x2="34" y2="266" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="44" y="258" text-anchor="start" class="sm dim">n equally likely values</text>
  <text x="300" y="258" text-anchor="start" class="sm bold" fill="#e11d48">Discrete uniform</text>
  <text x="528" y="258" text-anchor="end" class="sm dim">E[X] = (n+1)/2</text>
  <line x1="28" y1="258" x2="532" y2="258" class="rule"/>
  <text x="34" y="274" text-anchor="start" class="sm dim">Variance ÷ mean:  &lt; 1 binomial   = 1 Poisson   &gt; 1 negative binomial</text>
  <text x="34" y="290" text-anchor="start" class="sm dim">"At least one" → use 1 − P(X = 0)</text>
</svg>
