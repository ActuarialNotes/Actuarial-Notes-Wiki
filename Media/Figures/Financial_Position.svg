<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The running insurer's balance sheet, and the step from equity to capital available</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Equity is where capital available starts</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Assets = Liabilities + Equity</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">$1,240M = $980M + $260M</text>
    <text x="180" y="100" text-anchor="middle" class="sm dim">the running insurer, $M</text>
    <rect x="46" y="118" width="110" height="200" rx="6" fill="#3b82f6" fill-opacity="0.20" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="101" y="208" text-anchor="middle" class="sm bold">assets</text>
    <text x="101" y="224" text-anchor="middle" class="sm dim">1,240</text>
    <rect x="204" y="118" width="110" height="158.06" rx="6" fill="#d97706" fill-opacity="0.20" stroke="#d97706" stroke-width="1.3"/>
    <text x="259" y="190" text-anchor="middle" class="sm bold">liabilities</text>
    <text x="259" y="206" text-anchor="middle" class="sm dim">980</text>
    <rect x="204" y="280.06" width="110" height="37.94" rx="6" fill="#059669" fill-opacity="0.24" stroke="#059669" stroke-width="1.3"/>
    <text x="259" y="300" text-anchor="middle" class="sm bold">equity 260</text>
    <text x="180" y="200" text-anchor="middle" class="ttl" fill="var(--dim)">=</text>
    <line x1="30" y1="330" x2="330" y2="330" class="rule"/>
    <text x="180" y="352" text-anchor="middle" class="sm dim">less $12M of intangibles and goodwill</text>
    <text x="180" y="368" text-anchor="middle" class="sm bold" fill="#059669">→ capital available $248M</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">IFRS 17 grossed both sides up — reinsurance is an asset</text>
  </g>
</svg>
