  <line x1="76" y1="100" x2="320" y2="100" class="grid"/>
  <line x1="76" y1="322" x2="330" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="322" x2="76" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="96.33" y1="322" x2="96.33" y2="326" class="tick"/>
  <text x="96.33" y="338" text-anchor="middle" class="sm dim">2020</text>
  <line x1="147.17" y1="322" x2="147.17" y2="326" class="tick"/>
  <text x="147.17" y="338" text-anchor="middle" class="sm dim">2021</text>
  <line x1="198" y1="322" x2="198" y2="326" class="tick"/>
  <text x="198" y="338" text-anchor="middle" class="sm dim">2022</text>
