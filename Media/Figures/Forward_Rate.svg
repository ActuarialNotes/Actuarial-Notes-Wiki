<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The forward rate implied by two spot rates</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A forward rate is locked in today for a</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">future period</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">(1 + s₃)³ = (1 + s₂)² · (1 + f₂,₃)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">two routes to year 3 must cost the same today</text>
  <line x1="58" y1="250" x2="314" y2="250" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="66" y1="246" x2="66" y2="254" class="tick"/>
  <text x="66" y="267" text-anchor="middle" class="sm dim">0</text>
  <line x1="123.5" y1="246" x2="123.5" y2="254" class="tick"/>
  <text x="123.5" y="267" text-anchor="middle" class="sm dim">1</text>
  <line x1="181" y1="246" x2="181" y2="254" class="tick"/>
  <text x="181" y="267" text-anchor="middle" class="sm dim">2</text>
  <line x1="238.5" y1="246" x2="238.5" y2="254" class="tick"/>
  <text x="238.5" y="267" text-anchor="middle" class="sm dim">3</text>
  <line x1="296" y1="246" x2="296" y2="254" class="tick"/>
  <text x="296" y="267" text-anchor="middle" class="sm dim">4</text>
  <line x1="72" y1="210" x2="175" y2="210" class="thin" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah3b82f6)"/>
  <text x="123.5" y="202" text-anchor="middle" class="sm" fill="#3b82f6">s₂ for 2 years</text>
  <line x1="72" y1="174" x2="232.5" y2="174" class="thin" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah7c3aed)"/>
  <text x="152.25" y="166" text-anchor="middle" class="sm" fill="#7c3aed">s₃ for 3 years</text>
  <line x1="187" y1="290" x2="232.5" y2="290" class="thin" stroke="#d97706" stroke-width="1.7" marker-end="url(#ahd97706)"/>
  <text x="209.75" y="310" text-anchor="middle" class="bold" fill="#d97706">f₂,₃</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">implied, not quoted</text>
</svg>
