<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="278.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The term n is how many payments there are</text>
  <line x1="92" y1="118" x2="448" y2="118" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="100" y1="114" x2="100" y2="122" class="tick"/>
  <text x="100" y="135" text-anchor="middle" class="sm dim">0</text>
  <line x1="155" y1="114" x2="155" y2="122" class="tick"/>
  <text x="155" y="135" text-anchor="middle" class="sm dim">1</text>
  <line x1="210" y1="114" x2="210" y2="122" class="tick"/>
  <text x="210" y="135" text-anchor="middle" class="sm dim">2</text>
  <line x1="265" y1="114" x2="265" y2="122" class="tick"/>
  <text x="265" y="135" text-anchor="middle" class="sm dim">…</text>
  <line x1="320" y1="114" x2="320" y2="122" class="tick"/>
  <text x="320" y="135" text-anchor="middle" class="sm dim">n−1</text>
  <line x1="375" y1="114" x2="375" y2="122" class="tick"/>
  <text x="375" y="135" text-anchor="middle" class="sm dim">n</text>
  <line x1="430" y1="114" x2="430" y2="122" class="tick"/>
  <line x1="155" y1="118" x2="155" y2="88" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="155" y="82" text-anchor="middle" class="sm">P</text>
  <line x1="210" y1="118" x2="210" y2="88" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="210" y="82" text-anchor="middle" class="sm">P</text>
  <line x1="265" y1="118" x2="265" y2="88" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="265" y="82" text-anchor="middle" class="sm">P</text>
  <line x1="320" y1="118" x2="320" y2="88" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="320" y="82" text-anchor="middle" class="sm">P</text>
  <line x1="375" y1="118" x2="375" y2="88" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="375" y="82" text-anchor="middle" class="sm">P</text>
