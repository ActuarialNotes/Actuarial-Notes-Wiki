<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>One model's loss ratio by group, 63%, 72% and 66%, with group B's column standing out above the others</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="40" y="96" text-anchor="start" class="sm dim">loss ratio</text>
    <rect x="50" y="154.38" width="68" height="149.62" rx="4" fill="#0d9488" fill-opacity="0.70"/>
    <text x="84" y="146.38" text-anchor="middle" class="bold">63%</text>
    <circle cx="84" cy="332" r="7.2" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M71.2,364 V348.8 Q71.2,342.4 78.4,342.4 H89.6 Q96.8,342.4 96.8,348.8 V364 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="110" y="358" text-anchor="start" class="bold">A</text>
    <rect x="146" y="133" width="68" height="171" rx="4" fill="#e11d48" fill-opacity="0.70"/>
    <text x="180" y="125" text-anchor="middle" class="bold">72%</text>
    <circle cx="180" cy="332" r="7.2" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M167.2,364 V348.8 Q167.2,342.4 174.4,342.4 H185.6 Q192.8,342.4 192.8,348.8 V364 Z" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="206" y="358" text-anchor="start" class="bold">B</text>
    <rect x="242" y="147.25" width="68" height="156.75" rx="4" fill="#0d9488" fill-opacity="0.70"/>
    <text x="276" y="139.25" text-anchor="middle" class="bold">66%</text>
    <circle cx="276" cy="332" r="7.2" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M263.2,364 V348.8 Q263.2,342.4 270.4,342.4 H281.6 Q288.8,342.4 288.8,348.8 V364 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="302" y="358" text-anchor="start" class="bold">C</text>
    <line x1="34" y1="304" x2="326" y2="304" class="axis"/>
  </g>
</svg>
