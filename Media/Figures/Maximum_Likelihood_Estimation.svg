<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The log-likelihood curve peaking at the maximum likelihood estimate</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Pick the parameter the data likes best</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ℓ(θ) = Σ ln f(xᵢ | θ)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">solve ∂ℓ/∂θ = 0</text>
  <line x1="66" y1="346" x2="336" y2="346" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="66" y1="346" x2="66" y2="92" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="92" y1="346" x2="92" y2="350" class="tick"/>
  <text x="92" y="362" text-anchor="middle" class="sm dim">0.1</text>
  <line x1="144" y1="346" x2="144" y2="350" class="tick"/>
  <text x="144" y="362" text-anchor="middle" class="sm dim">0.2</text>
  <line x1="196" y1="346" x2="196" y2="350" class="tick"/>
  <text x="196" y="362" text-anchor="middle" class="sm dim">0.3</text>
  <line x1="248" y1="346" x2="248" y2="350" class="tick"/>
  <text x="248" y="362" text-anchor="middle" class="sm dim">0.4</text>
  <line x1="300" y1="346" x2="300" y2="350" class="tick"/>
  <text x="300" y="362" text-anchor="middle" class="sm dim">0.5</text>
  <text x="326" y="378" text-anchor="end" class="sm dim">λ</text>
  <text x="62" y="88" text-anchor="start" class="sm dim">ℓ(λ)</text>
