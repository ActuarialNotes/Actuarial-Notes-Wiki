<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Mean square error split into variance and squared bias for three estimators</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Variance plus squared bias</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">MSE(θ̂) = E[(θ̂ − θ)²]</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">= Var(θ̂) + Bias(θ̂)²</text>
  <line x1="68" y1="338" x2="336" y2="338" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="338" x2="68" y2="102" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="338" x2="68" y2="338" class="tick"/>
  <text x="60" y="341.6" text-anchor="end" class="sm dim">0</text>
  <line x1="64" y1="230.38" x2="68" y2="230.38" class="tick"/>
  <text x="60" y="233.98" text-anchor="end" class="sm dim">50</text>
  <line x1="64" y1="122.76" x2="68" y2="122.76" class="tick"/>
  <text x="60" y="126.36" text-anchor="end" class="sm dim">100</text>
  <text x="64" y="98" text-anchor="start" class="sm dim">MSE</text>
  <rect x="93.12" y="122.76" width="56" height="215.24" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="93.12" y="122.76" width="56" height="0" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <text x="121.12" y="356" text-anchor="middle" class="sm">A</text>
  <text x="121.12" y="114.76" text-anchor="middle" class="sm bold">100</text>
  <rect x="169" y="230.38" width="56" height="107.62" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="169" y="195.94" width="56" height="34.44" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <text x="197" y="356" text-anchor="middle" class="sm">B</text>
  <text x="197" y="187.94" text-anchor="middle" class="sm bold">66</text>
  <rect x="244.88" y="294.95" width="56" height="43.05" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="244.88" y="157.2" width="56" height="137.75" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
  <text x="272.88" y="356" text-anchor="middle" class="sm">C</text>
  <text x="272.88" y="149.2" text-anchor="middle" class="sm bold">84</text>
  <line x1="244" y1="92" x2="257" y2="92" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="263" y="95.6" text-anchor="start" class="sm">variance</text>
  <line x1="244" y1="107" x2="257" y2="107" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="263" y="110.6" text-anchor="start" class="sm">bias²</text>
</svg>
