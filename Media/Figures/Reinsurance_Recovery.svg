<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Gross unpaid claims split into the ceded recoverable and the insurer's net liability</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">An asset, not a smaller liability</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Net Unpaid = Gross Unpaid − Ceded Unpaid</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Ceded Ultimate = Ceded Reported × CDF_ceded</text>
  <text x="180" y="120" text-anchor="middle" class="sm dim">AY 2024 unpaid claims ($000)</text>
  <rect x="46" y="148" width="268" height="38" rx="4" fill="#7c3aed" fill-opacity="0.26" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="172" text-anchor="middle" class="sm">gross unpaid 2,250</text>
  <rect x="46" y="210" width="76.23" height="34" rx="4" fill="#d97706" fill-opacity="0.6"/>
  <text x="84.12" y="232" text-anchor="middle" class="sm">ceded 640</text>
  <rect x="46" y="268" width="191.77" height="34" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="141.88" y="290" text-anchor="middle" class="sm">net 1,610</text>
  <text x="180" y="330" text-anchor="middle" class="sm dim">the balance sheet carries the gross liability</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">and the recoverable separately, because the</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">cedant owes its policyholders either way</text>
</svg>
