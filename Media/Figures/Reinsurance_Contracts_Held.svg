<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The reinsurance asset's components, and the CSM that is normally a net cost rather than a profit</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">An asset bought at more than it will</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">recover</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Asset = PV(recoveries) − PV(premiums)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">+ RA + CSM</text>
  <rect x="30" y="100" width="143" height="141" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="30" y="100" width="143" height="26" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="117" text-anchor="middle" class="sm bold" fill="#d97706">Issued</text>
  <text x="101.5" y="146" text-anchor="middle" class="sm">a liability</text>
  <text x="101.5" y="167" text-anchor="middle" class="sm">the RA raises it</text>
  <text x="101.5" y="188" text-anchor="middle" class="sm">the CSM is</text>
  <text x="101.5" y="209" text-anchor="middle" class="sm">unearned profit</text>
  <text x="101.5" y="230" text-anchor="middle" class="sm">no credit item</text>
  <rect x="187" y="100" width="143" height="141" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
  <rect x="187" y="100" width="143" height="26" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="117" text-anchor="middle" class="sm bold" fill="#059669">Held</text>
  <text x="258.5" y="146" text-anchor="middle" class="sm">an asset</text>
  <text x="258.5" y="167" text-anchor="middle" class="sm">the RA is risk</text>
  <text x="258.5" y="188" text-anchor="middle" class="sm">sent away</text>
  <text x="258.5" y="209" text-anchor="middle" class="sm">the CSM is a</text>
  <text x="258.5" y="230" text-anchor="middle" class="sm">net cost</text>
  <text x="180" y="258" text-anchor="middle" class="sm dim">several rules are deliberate mirror images</text>
  <line x1="30" y1="278" x2="330" y2="278" class="rule"/>
  <text x="36" y="300" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="52" y="300" text-anchor="start" class="sm">reinsurance costs more than it recovers, so</text>
  <text x="36" y="324" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="52" y="324" text-anchor="start" class="sm">the CSM is a cost — and that is not a loss</text>
  <text x="36" y="348" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="52" y="348" text-anchor="start" class="sm">non-performance risk reduces the asset, explicitly</text>
  <text x="36" y="372" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="52" y="372" text-anchor="start" class="sm">and an onerous group gets a loss-recovery component</text>
</svg>
