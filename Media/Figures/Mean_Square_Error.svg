<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three estimators' mean square errors as stacked bars of variance plus squared bias</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="56" y1="356" x2="336" y2="356" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="356" x2="56" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="52" y1="356" x2="56" y2="356" class="tick"/>
    <text x="48" y="359.6" text-anchor="end" class="sm dim">0</text>
    <line x1="52" y1="232.19" x2="56" y2="232.19" class="tick"/>
    <text x="48" y="235.79" text-anchor="end" class="sm dim">50</text>
    <line x1="52" y1="108.38" x2="56" y2="108.38" class="tick"/>
    <text x="48" y="111.98" text-anchor="end" class="sm dim">100</text>
    <text x="52" y="82" text-anchor="start" class="sm dim">MSE</text>
    <rect x="79.59" y="108.38" width="64" height="247.62" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="79.59" y="108.38" width="64" height="0" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
    <text x="111.59" y="374" text-anchor="middle" class="sm">A</text>
    <text x="111.59" y="100.38" text-anchor="middle" class="sm bold">100</text>
    <rect x="159" y="232.19" width="64" height="123.81" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="159" y="192.57" width="64" height="39.62" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
    <text x="191" y="374" text-anchor="middle" class="sm">B</text>
    <text x="191" y="184.57" text-anchor="middle" class="sm bold">66</text>
    <rect x="238.41" y="306.48" width="64" height="49.52" rx="1.5" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="238.41" y="148" width="64" height="158.48" rx="1.5" fill="#e11d48" fill-opacity="0.7"/>
    <text x="270.41" y="374" text-anchor="middle" class="sm">C</text>
    <text x="270.41" y="140" text-anchor="middle" class="sm bold">84</text>
    <text x="111.59" y="236.19" text-anchor="middle" class="sm bold">Var</text>
    <text x="270.41" y="231.24" text-anchor="middle" class="sm bold">bias²</text>
  </g>
</svg>
