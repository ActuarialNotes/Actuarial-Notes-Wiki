<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The same predictors assembled into three different linear predictors</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Which terms enter the linear predictor</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">η = β₀ + β₁x₁ + β₂x₂ + β₃x₁x₂ + ⋯</text>
  <text x="180" y="94" text-anchor="middle" class="sm bold" fill="#3b82f6">main effects</text>
  <rect x="122" y="111" width="54" height="22" rx="11.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="149" y="126" text-anchor="middle" class="sm">x₁</text>
  <rect x="184" y="111" width="54" height="22" rx="11.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="211" y="126" text-anchor="middle" class="sm">x₂</text>
  <text x="180" y="156" text-anchor="middle" class="sm dim">AIC 4,102</text>
  <text x="180" y="186" text-anchor="middle" class="sm bold" fill="#059669">+ interaction</text>
  <rect x="91" y="203" width="54" height="22" rx="11.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="118" y="218" text-anchor="middle" class="sm">x₁</text>
  <rect x="153" y="203" width="54" height="22" rx="11.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="218" text-anchor="middle" class="sm">x₂</text>
  <rect x="215" y="203" width="54" height="22" rx="11.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="242" y="218" text-anchor="middle" class="sm">x₁·x₂</text>
  <text x="180" y="248" text-anchor="middle" class="sm dim">AIC 4,085</text>
  <text x="180" y="278" text-anchor="middle" class="sm bold" fill="#d97706">+ polynomial</text>
  <rect x="60" y="295" width="54" height="22" rx="11.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="87" y="310" text-anchor="middle" class="sm">x₁</text>
  <rect x="122" y="295" width="54" height="22" rx="11.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="149" y="310" text-anchor="middle" class="sm">x₂</text>
  <rect x="184" y="295" width="54" height="22" rx="11.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="211" y="310" text-anchor="middle" class="sm">x₁·x₂</text>
  <rect x="246" y="295" width="54" height="22" rx="11.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="273" y="310" text-anchor="middle" class="sm">x₁²</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">AIC 4,088</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">structure is separate from link and distribution</text>
</svg>
