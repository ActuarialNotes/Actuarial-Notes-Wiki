<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A faster settlement pattern distorting the paid development it is measured with</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A change of timing looks like a change</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">of cost</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Disposal Rate = closed ÷ ultimate counts</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Avg Case O/S = case reserves / open claims</text>
  <line x1="121.2" y1="100" x2="121.2" y2="326" class="grid"/>
  <line x1="170.4" y1="100" x2="170.4" y2="326" class="grid"/>
  <line x1="219.6" y1="100" x2="219.6" y2="326" class="grid"/>
  <line x1="268.8" y1="100" x2="268.8" y2="326" class="grid"/>
  <line x1="318" y1="100" x2="318" y2="326" class="grid"/>
  <line x1="72" y1="326" x2="318" y2="326" class="grid"/>
  <line x1="72" y1="218.38" x2="318" y2="218.38" class="grid"/>
  <line x1="72" y1="110.76" x2="318" y2="110.76" class="grid"/>
  <line x1="72" y1="326" x2="328" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="326" x2="72" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="121.2" y1="326" x2="121.2" y2="330" class="tick"/>
  <text x="121.2" y="342" text-anchor="middle" class="sm dim">12</text>
  <line x1="170.4" y1="326" x2="170.4" y2="330" class="tick"/>
  <text x="170.4" y="342" text-anchor="middle" class="sm dim">24</text>
  <line x1="219.6" y1="326" x2="219.6" y2="330" class="tick"/>
  <text x="219.6" y="342" text-anchor="middle" class="sm dim">36</text>
  <line x1="268.8" y1="326" x2="268.8" y2="330" class="tick"/>
  <text x="268.8" y="342" text-anchor="middle" class="sm dim">48</text>
  <line x1="318" y1="326" x2="318" y2="330" class="tick"/>
  <text x="318" y="342" text-anchor="middle" class="sm dim">60</text>
  <line x1="68" y1="326" x2="72" y2="326" class="tick"/>
  <text x="64" y="329.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="68" y1="218.38" x2="72" y2="218.38" class="tick"/>
  <text x="64" y="221.98" text-anchor="end" class="sm dim">50%</text>
  <line x1="68" y1="110.76" x2="72" y2="110.76" class="tick"/>
  <text x="64" y="114.36" text-anchor="end" class="sm dim">100%</text>
  <polyline points="121.2,248.51 170.4,192.55 219.6,153.81 268.8,127.98 318,115.07" class="curve dash" stroke="var(--dim)" stroke-width="1.8"/>
  <polyline points="121.2,214.08 170.4,162.42 219.6,134.44 268.8,119.37 318,112.91" class="curve" stroke="#e11d48" stroke-width="2.4"/>
  <circle cx="121.2" cy="214.08" r="3" fill="#e11d48"/>
  <circle cx="170.4" cy="162.42" r="3" fill="#e11d48"/>
  <circle cx="219.6" cy="134.44" r="3" fill="#e11d48"/>
  <circle cx="268.8" cy="119.37" r="3" fill="#e11d48"/>
  <circle cx="318" cy="112.91" r="3" fill="#e11d48"/>
  <text x="195" y="226.08" text-anchor="middle" class="sm dim">before</text>
  <text x="178.6" y="145.81" text-anchor="middle" class="sm bold" fill="#e11d48">after</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">disposal rate by age in months</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">closing sooner raises paid losses at every age,</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">so paid factors fall and the method under-reserves</text>
</svg>
