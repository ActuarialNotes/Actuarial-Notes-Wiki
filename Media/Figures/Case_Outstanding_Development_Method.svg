<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>AY 2024's 900 of case reserves fanned out by a 2.500 factor into 2,250 of future payments, which with the 600 already paid make the 2,850 ultimate</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="40" y="110" width="58.95" height="44" rx="4" fill="#059669" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
    <text x="69.47" y="136" text-anchor="middle" class="sm bold">paid 600</text>
    <rect x="98.95" y="110" width="88.42" height="44" rx="4" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <text x="143.16" y="136" text-anchor="middle" class="sm bold">case 900</text>
    <polygon points="98.95,154 187.37,154 320,256 98.95,256" fill="#e11d48" fill-opacity="0.1" stroke="none"/>
    <text x="189.47" y="209" text-anchor="middle" class="sm bold">× 2.500</text>
    <rect x="40" y="256" width="58.95" height="44" rx="4" fill="#059669" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
    <rect x="98.95" y="256" width="221.05" height="44" rx="4" fill="#e11d48" fill-opacity="0.34" stroke="#e11d48" stroke-width="1.2"/>
    <text x="209.47" y="282" text-anchor="middle" class="sm bold">future 2,250</text>
    <path d="M40,306 v4.8 H175 q5,0 5,4.4 q0,-4.4 5,-4.4 H320 v-4.8" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="180" y="325" text-anchor="middle" class="sm bold">ultimate 2,850</text>
  </g>
</svg>
