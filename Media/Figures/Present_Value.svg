<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 256" width="560" height="256" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="254.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Discounting moves a payment backwards in time</text>
  <line x1="68" y1="130" x2="478" y2="130" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="126" x2="76" y2="134" class="tick"/>
  <text x="76" y="147" text-anchor="middle" class="sm dim">0</text>
  <line x1="152.8" y1="126" x2="152.8" y2="134" class="tick"/>
  <text x="152.8" y="147" text-anchor="middle" class="sm dim">1</text>
  <line x1="229.6" y1="126" x2="229.6" y2="134" class="tick"/>
  <text x="229.6" y="147" text-anchor="middle" class="sm dim">2</text>
  <line x1="306.4" y1="126" x2="306.4" y2="134" class="tick"/>
  <text x="306.4" y="147" text-anchor="middle" class="sm dim">3</text>
  <line x1="383.2" y1="126" x2="383.2" y2="134" class="tick"/>
  <text x="383.2" y="147" text-anchor="middle" class="sm dim">4</text>
  <line x1="460" y1="126" x2="460" y2="134" class="tick"/>
  <text x="460" y="147" text-anchor="middle" class="sm dim">5</text>
  <line x1="460" y1="130" x2="460" y2="68" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="460" y="62" text-anchor="middle" class="sm">1,000</text>
  <line x1="452" y1="46" x2="84" y2="46" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
  <text x="268" y="38" text-anchor="middle" class="sm bold" fill="#d97706">× v⁵ = (1.06)⁻⁵</text>
  <line x1="76" y1="130" x2="76" y2="90" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="76" y="84" text-anchor="middle" class="sm">747.26</text>
  <text x="76" y="164" text-anchor="middle" class="sm dim">PV</text>
  <text x="460" y="164" text-anchor="middle" class="sm dim">FV</text>
  <line x1="28" y1="186" x2="532" y2="186" class="rule"/>
  <text x="150" y="208" text-anchor="middle" class="sm bold">PV = FV · (1 + i)⁻ⁿ = FV · vⁿ</text>
  <text x="150" y="228" text-anchor="middle" class="sm dim">a dollar later is worth less than one now</text>
  <text x="410" y="208" text-anchor="middle" class="sm bold">Several cash flows</text>
  <text x="410" y="228" text-anchor="middle" class="sm dim">PV = Σ C_t v^t</text>
</svg>
