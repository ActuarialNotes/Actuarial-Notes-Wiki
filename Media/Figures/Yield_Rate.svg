  <text x="326" y="236" text-anchor="end" class="sm dim">yield j</text>
  <text x="72" y="54" text-anchor="start" class="sm dim">price</text>
  <text x="88" y="151.26" text-anchor="start" class="sm dim">market price</text>
  <text x="428" y="100" text-anchor="middle" class="sm bold">P = Fr·a₍ₙ₎ⱼ + C·vⁿ</text>
  <text x="428" y="120" text-anchor="middle" class="sm dim">the j that solves this is the yield</text>
  <line x1="340" y1="142" x2="340" y2="174" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="154" text-anchor="start" class="sm bold">An internal rate of return</text>
  <text x="350" y="170" text-anchor="start" class="sm dim">no closed form — solve numerically</text>
  <line x1="340" y1="188" x2="340" y2="220" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="200" text-anchor="start" class="sm bold">Price and yield move apart</text>
  <text x="350" y="216" text-anchor="start" class="sm dim">yield up, price down</text>
  <line x1="340" y1="234" x2="340" y2="266" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="246" text-anchor="start" class="sm bold">r is fixed, j is not</text>
  <text x="350" y="262" text-anchor="start" class="sm dim">j reflects today's price</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">Yield to maturity assumes the bond is held to maturity</text>
</svg>
