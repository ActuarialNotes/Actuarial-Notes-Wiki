  <circle cx="245.02" cy="207.06" r="3" fill="#3b82f6"/>
  <circle cx="219.94" cy="202.39" r="3" fill="#3b82f6"/>
  <circle cx="185.57" cy="176.39" r="3" fill="#3b82f6"/>
  <circle cx="153.86" cy="159.82" r="3" fill="#3b82f6"/>
  <circle cx="155.18" cy="157.39" r="3" fill="#3b82f6"/>
  <circle cx="121.48" cy="153.36" r="3" fill="#3b82f6"/>
  <circle cx="248.82" cy="217.25" r="3" fill="#3b82f6"/>
  <circle cx="119.72" cy="142.97" r="3" fill="#3b82f6"/>
  <circle cx="236.91" cy="204.48" r="3" fill="#3b82f6"/>
  <circle cx="96.98" cy="138.89" r="3" fill="#3b82f6"/>
  <circle cx="146.84" cy="158.1" r="3" fill="#3b82f6"/>
  <circle cx="231.67" cy="199.5" r="3" fill="#3b82f6"/>
  <circle cx="138.95" cy="149.63" r="3" fill="#3b82f6"/>
  <circle cx="291.01" cy="229.21" r="3" fill="#3b82f6"/>
  <circle cx="301.21" cy="252.44" r="3" fill="#3b82f6"/>
  <circle cx="77.83" cy="128.52" r="3" fill="#3b82f6"/>
  <circle cx="144.6" cy="165.23" r="3" fill="#3b82f6"/>
  <circle cx="205.96" cy="191.8" r="3" fill="#3b82f6"/>
  <circle cx="107.57" cy="140.72" r="3" fill="#3b82f6"/>
  <text x="238.96" y="137.36" text-anchor="middle" class="sm bold" fill="#e11d48">r = −0.94</text>
  <rect x="94" y="296" width="19" height="26" rx="4" fill="#059669" fill-opacity="0.65"/>
  <text x="86" y="314" text-anchor="end" class="sm">uncorrelated</text>
  <text x="121" y="314" text-anchor="start" class="sm bold" fill="#059669">VIF 1</text>
  <rect x="94" y="338" width="168.5" height="26" rx="4" fill="#e11d48" fill-opacity="0.65"/>
  <text x="86" y="356" text-anchor="end" class="sm">r = 0.92</text>
  <text x="270.5" y="356" text-anchor="start" class="sm bold" fill="#e11d48">VIF 12.5</text>
</svg>
