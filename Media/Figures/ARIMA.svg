<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three ARIMA parts assembled, with the ACF/PACF table that identifies them</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Autoregressive, integrated, moving</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">average</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">φ(B)∇ᵈY_t = θ(B)ε_t</text>
  <rect x="12" y="96" width="100" height="50" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="62" y="115" text-anchor="middle" class="sm bold">AR (p)</text>
  <text x="62" y="133" text-anchor="middle" class="sm dim">p lags of Y</text>
  <rect x="130" y="96" width="100" height="50" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="180" y="115" text-anchor="middle" class="sm bold">I (d)</text>
  <text x="180" y="133" text-anchor="middle" class="sm dim">d differences</text>
  <rect x="248" y="96" width="100" height="50" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="298" y="115" text-anchor="middle" class="sm bold">MA (q)</text>
  <text x="298" y="133" text-anchor="middle" class="sm dim">q lags of ε</text>
  <text x="70" y="196" text-anchor="middle" class="sm dim">model</text>
  <text x="180" y="196" text-anchor="middle" class="sm dim">ACF</text>
  <text x="286" y="196" text-anchor="middle" class="sm dim">PACF</text>
  <line x1="38" y1="204" x2="322" y2="204" class="rule"/>
  <text x="70" y="226" text-anchor="middle" class="sm bold">AR(p)</text>
  <text x="180" y="226" text-anchor="middle" class="sm">tails off</text>
  <text x="286" y="226" text-anchor="middle" class="sm">cuts off at p</text>
  <line x1="38" y1="235" x2="322" y2="235" class="rule"/>
  <text x="70" y="254" text-anchor="middle" class="sm bold">MA(q)</text>
  <text x="180" y="254" text-anchor="middle" class="sm">cuts off at q</text>
  <text x="286" y="254" text-anchor="middle" class="sm">tails off</text>
  <line x1="38" y1="263" x2="322" y2="263" class="rule"/>
  <text x="70" y="282" text-anchor="middle" class="sm bold">ARMA</text>
  <text x="180" y="282" text-anchor="middle" class="sm">tails off</text>
  <text x="286" y="282" text-anchor="middle" class="sm">tails off</text>
  <line x1="38" y1="291" x2="322" y2="291" class="rule"/>
  <text x="180" y="322" text-anchor="middle" class="sm">ARIMA(0,1,1): difference once, one MA term</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">seasonal form (p,d,q)(P,D,Q)_s adds lag-s terms</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">identify · estimate · check the residuals</text>
</svg>
