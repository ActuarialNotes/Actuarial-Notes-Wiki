<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The profit provision as the last slice of the premium dollar and the combined ratio it targets</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The margin for capital, and for being</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">wrong</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Rate = (Pure Premium + F) / (1 − V − Q_T)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Target Combined Ratio = 1 − Q_T = 95%</text>
  <text x="180" y="112" text-anchor="middle" class="sm dim">the $520 premium dollar</text>
  <rect x="40" y="135" width="193.76" height="34" rx="4" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="136.88" y="156" text-anchor="middle" class="sm">losses &amp; LAE 69.2%</text>
  <rect x="233.76" y="135" width="72.24" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
  <text x="269.88" y="156" text-anchor="middle" class="sm">expense</text>
  <rect x="306" y="135" width="14" height="34" rx="4" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.2"/>
  <text x="313" y="156" text-anchor="middle" class="sm">Q</text>
  <line x1="306" y1="126" x2="306" y2="186" class="thin dash" stroke="#e11d48" stroke-width="1.5"/>
  <text x="306" y="202" text-anchor="end" class="sm bold" fill="#e11d48">combined ratio 95%</text>
  <text x="180" y="262" text-anchor="middle" class="sm dim">Q_T pays for the capital held behind the book;</text>
  <text x="180" y="282" text-anchor="middle" class="sm dim">the contingency half covers a rate built on</text>
  <text x="180" y="302" text-anchor="middle" class="sm dim">expected values being exceeded</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">investment income may reduce it, never remove it</text>
</svg>
