<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Five folds each taking a turn as the validation set</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Each fold takes a turn as the held-out</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">set</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">CV₍K₎ = (1/K) Σ MSEₖ</text>
  <rect x="53.5" y="106" width="44.2" height="24" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1"/>
  <rect x="100.7" y="106" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="147.9" y="106" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="195.1" y="106" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="242.3" y="106" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="123" text-anchor="end" class="sm dim">1</text>
  <text x="298" y="123" text-anchor="start" class="sm dim">MSE1</text>
  <rect x="53.5" y="140" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="100.7" y="140" width="44.2" height="24" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1"/>
  <rect x="147.9" y="140" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="195.1" y="140" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="242.3" y="140" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="157" text-anchor="end" class="sm dim">2</text>
  <text x="298" y="157" text-anchor="start" class="sm dim">MSE2</text>
  <rect x="53.5" y="174" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="100.7" y="174" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="147.9" y="174" width="44.2" height="24" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1"/>
  <rect x="195.1" y="174" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="242.3" y="174" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="191" text-anchor="end" class="sm dim">3</text>
  <text x="298" y="191" text-anchor="start" class="sm dim">MSE3</text>
  <rect x="53.5" y="208" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="100.7" y="208" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="147.9" y="208" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="195.1" y="208" width="44.2" height="24" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1"/>
  <rect x="242.3" y="208" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="225" text-anchor="end" class="sm dim">4</text>
  <text x="298" y="225" text-anchor="start" class="sm dim">MSE4</text>
  <rect x="53.5" y="242" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="100.7" y="242" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="147.9" y="242" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="195.1" y="242" width="44.2" height="24" rx="3" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1"/>
  <rect x="242.3" y="242" width="44.2" height="24" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#e11d48" stroke-width="1"/>
  <text x="44" y="259" text-anchor="end" class="sm dim">5</text>
  <text x="298" y="259" text-anchor="start" class="sm dim">MSE5</text>
  <line x1="60" y1="292" x2="73" y2="292" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="79" y="295.6" text-anchor="start" class="sm">train</text>
  <line x1="170" y1="292" x2="183" y2="292" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="189" y="295.6" text-anchor="start" class="sm">validate</text>
  <text x="180" y="326" text-anchor="middle" class="sm dim">average the five to estimate test error</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">K = n is LOOCV: near-unbiased, high variance</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">select variables inside the fold, not before</text>
</svg>
