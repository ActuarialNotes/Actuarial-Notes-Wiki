  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Add up the squared misses</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">RSS = Σ (yᵢ − ŷᵢ)²</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">least squares minimises it</text>
