  <text x="248.83" y="338" text-anchor="middle" class="sm dim">2023</text>
  <line x1="299.67" y1="322" x2="299.67" y2="326" class="tick"/>
  <text x="299.67" y="338" text-anchor="middle" class="sm dim">2024</text>
  <line x1="72" y1="322" x2="76" y2="322" class="tick"/>
  <text x="68" y="325.6" text-anchor="end" class="sm dim">2,200</text>
  <line x1="72" y1="211" x2="76" y2="211" class="tick"/>
  <text x="68" y="214.6" text-anchor="end" class="sm dim">2,600</text>
  <line x1="72" y1="100" x2="76" y2="100" class="tick"/>
  <text x="68" y="103.6" text-anchor="end" class="sm dim">3,000</text>
