<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The IFRS 17 disclosures that decide whether two insurers' numbers can be compared at all</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Where you find out what the numbers mean</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Judgement-heavy measurement ⇒</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the notes carry the comparability</text>
  <text x="38" y="106" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="106" text-anchor="start" class="sm">the LRC, loss component, LIC and CSM,</text>
  <text x="38" y="132" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="132" text-anchor="start" class="sm">reconciled opening to closing</text>
  <text x="38" y="158" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="158" text-anchor="start" class="sm">the risk adjustment's confidence level</text>
  <text x="38" y="184" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="184" text-anchor="start" class="sm">the discount rate method and the curves</text>
  <text x="38" y="210" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="210" text-anchor="start" class="sm">the coverage unit driver</text>
  <text x="38" y="236" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="236" text-anchor="start" class="sm">claims development tables</text>
  <text x="38" y="262" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="54" y="262" text-anchor="start" class="sm">the transition approach taken</text>
  <line x1="30" y1="306" x2="330" y2="306" class="rule"/>
  <text x="180" y="328" text-anchor="middle" class="sm dim">two insurers can hold identical risk and report</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">different liabilities — the confidence level and</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">the discount method are where the difference is</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">plus IFRS 7 risk, sensitivity and credit disclosures</text>
</svg>
