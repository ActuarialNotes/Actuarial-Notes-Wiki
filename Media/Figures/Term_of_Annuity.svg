<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The term as the count of payments, solved from the present value</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The term n is how many payments there</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">are</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">n = −ln(1 − i · PV/P) / ln(1 + i)</text>
  <line x1="52" y1="130" x2="314" y2="130" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="126" x2="60" y2="134" class="tick"/>
  <text x="60" y="147" text-anchor="middle" class="sm dim">0</text>
  <line x1="99.33" y1="126" x2="99.33" y2="134" class="tick"/>
  <text x="99.33" y="147" text-anchor="middle" class="sm dim">1</text>
  <line x1="138.67" y1="126" x2="138.67" y2="134" class="tick"/>
  <text x="138.67" y="147" text-anchor="middle" class="sm dim">2</text>
  <line x1="178" y1="126" x2="178" y2="134" class="tick"/>
  <text x="178" y="147" text-anchor="middle" class="sm dim">…</text>
  <line x1="217.33" y1="126" x2="217.33" y2="134" class="tick"/>
  <text x="217.33" y="147" text-anchor="middle" class="sm dim">n−1</text>
  <line x1="256.67" y1="126" x2="256.67" y2="134" class="tick"/>
  <text x="256.67" y="147" text-anchor="middle" class="sm dim">n</text>
  <line x1="296" y1="126" x2="296" y2="134" class="tick"/>
  <line x1="99.33" y1="130" x2="99.33" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="99.33" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="138.67" y1="130" x2="138.67" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="138.67" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="178" y1="130" x2="178" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="178" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="217.33" y1="130" x2="217.33" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="217.33" y="94" text-anchor="middle" class="sm">P</text>
  <line x1="256.67" y1="130" x2="256.67" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="256.67" y="94" text-anchor="middle" class="sm">P</text>
  <path d="M99.33,164 v5.4 H173 q5,0 5,4.95 q0,-4.95 5,-4.95 H256.67 v-5.4" class="thin" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="178" y="184" text-anchor="middle" class="sm dim">n payments</text>
