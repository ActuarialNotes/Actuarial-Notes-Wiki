<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An insurer's exposure to a bad-faith claim building past the policy limit</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The policy limit does not cap this</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Exposure = benefit + aggravated</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">+ punitive + costs</text>
  <rect x="49.02" y="243.2" width="38.35" height="24.8" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
  <text x="68.2" y="235.2" text-anchor="middle" class="sm">320k</text>
  <text x="68.2" y="283" text-anchor="middle" class="sm dim">benefit</text>
  <rect x="105.42" y="235.45" width="38.35" height="7.75" rx="3" fill="#d97706" fill-opacity="0.72"/>
  <text x="124.6" y="227.45" text-anchor="middle" class="sm">100k</text>
  <text x="124.6" y="283" text-anchor="middle" class="sm dim">aggravated</text>
  <rect x="161.82" y="157.95" width="38.35" height="77.5" rx="3" fill="#e11d48" fill-opacity="0.72"/>
  <text x="181" y="149.95" text-anchor="middle" class="sm">1.00M</text>
  <text x="181" y="283" text-anchor="middle" class="sm dim">punitive</text>
  <rect x="218.22" y="144" width="38.35" height="13.95" rx="3" fill="#7c3aed" fill-opacity="0.72"/>
  <text x="237.4" y="136" text-anchor="middle" class="sm">180k</text>
  <text x="237.4" y="283" text-anchor="middle" class="sm dim">costs</text>
  <rect x="274.62" y="144" width="38.35" height="124" rx="3" fill="#0d9488" fill-opacity="0.72"/>
  <text x="293.8" y="136" text-anchor="middle" class="sm">1.60M</text>
  <text x="293.8" y="283" text-anchor="middle" class="sm dim">total</text>
  <line x1="34" y1="268" x2="328" y2="268" class="axis"/>
  <line x1="40" y1="243.2" x2="322" y2="243.2" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="180" y="304" text-anchor="middle" class="sm dim">the dashed line is the policy limit — it caps</text>
  <text x="180" y="320" text-anchor="middle" class="sm dim">the benefit, and nothing else on this chart</text>
  <text x="180" y="346" text-anchor="middle" class="sm dim">Whiten v. Pilot Insurance (SCC, 2002): a fire claim</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">denied on an unsupported arson allegation</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">the claim is not on the contract, so the contract</text>
</svg>
