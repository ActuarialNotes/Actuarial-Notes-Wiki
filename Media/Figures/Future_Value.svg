<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="260.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Accumulating moves payments forward in time</text>
  <line x1="68" y1="132" x2="470" y2="132" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="128" x2="76" y2="136" class="tick"/>
  <text x="76" y="149" text-anchor="middle" class="sm dim">0</text>
  <line x1="170" y1="128" x2="170" y2="136" class="tick"/>
  <text x="170" y="149" text-anchor="middle" class="sm dim">1</text>
  <line x1="264" y1="128" x2="264" y2="136" class="tick"/>
  <text x="264" y="149" text-anchor="middle" class="sm dim">2</text>
  <line x1="358" y1="128" x2="358" y2="136" class="tick"/>
  <text x="358" y="149" text-anchor="middle" class="sm dim">3</text>
  <line x1="452" y1="128" x2="452" y2="136" class="tick"/>
  <text x="452" y="149" text-anchor="middle" class="sm dim">4</text>
  <line x1="76" y1="132" x2="76" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="76" y="86" text-anchor="middle" class="sm">100</text>
  <line x1="170" y1="132" x2="170" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="170" y="86" text-anchor="middle" class="sm">100</text>
  <line x1="264" y1="132" x2="264" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="264" y="86" text-anchor="middle" class="sm">100</text>
  <line x1="82" y1="66" x2="444" y2="66" class="thin dash" stroke="#d97706" stroke-width="1.2" marker-end="url(#ahd97706)"/>
  <line x1="176" y1="66" x2="444" y2="66" class="thin dash" stroke="#d97706" stroke-width="1.2" marker-end="url(#ahd97706)"/>
  <line x1="270" y1="66" x2="444" y2="66" class="thin dash" stroke="#d97706" stroke-width="1.2" marker-end="url(#ahd97706)"/>
  <text x="264" y="58" text-anchor="middle" class="sm bold" fill="#d97706">× (1 + i)^(n − t)</text>
  <line x1="452" y1="132" x2="452" y2="58" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="452" y="52" text-anchor="middle" class="sm">FV₄</text>
  <line x1="28" y1="192" x2="532" y2="192" class="rule"/>
  <text x="150" y="214" text-anchor="middle" class="sm bold">FV = PV · (1 + i)ⁿ</text>
  <text x="150" y="234" text-anchor="middle" class="sm dim">the inverse of discounting</text>
  <text x="410" y="214" text-anchor="middle" class="sm bold">FVₙ = Σ C_t (1 + i)^(n − t)</text>
  <text x="410" y="234" text-anchor="middle" class="sm dim">each flow grows for the time it has left</text>
</svg>
