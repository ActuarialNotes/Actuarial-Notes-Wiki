<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A loan of 10,000 advanced at time 0 and repaid by eight payments of 1,740 above the timeline, while the balance still owed shrinks to nothing below it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="58" y1="150" x2="324" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="146" x2="66" y2="154" class="tick"/>
    <line x1="96" y1="146" x2="96" y2="154" class="tick"/>
    <line x1="126" y1="146" x2="126" y2="154" class="tick"/>
    <line x1="156" y1="146" x2="156" y2="154" class="tick"/>
    <line x1="186" y1="146" x2="186" y2="154" class="tick"/>
    <line x1="216" y1="146" x2="216" y2="154" class="tick"/>
    <line x1="246" y1="146" x2="246" y2="154" class="tick"/>
    <line x1="276" y1="146" x2="276" y2="154" class="tick"/>
    <line x1="306" y1="146" x2="306" y2="154" class="tick"/>
    <polygon points="66,150 66,360 96,340.26 126,318.93 156,295.91 186,271.04 216,244.18 246,215.17 276,183.84 306,150" fill="#059669" fill-opacity="0.16" stroke="none"/>
    <polyline points="66,360 96,340.26 126,318.93 156,295.91 186,271.04 216,244.18 246,215.17 276,183.84 306,150" class="thin" stroke="#059669" stroke-width="1.4"/>
    <line x1="66" y1="150" x2="66" y2="360" class="thin" stroke="#059669" stroke-width="2.2" marker-end="url(#ah059669)"/>
    <text x="66" y="376" text-anchor="middle" class="sm">10,000</text>
    <line x1="96" y1="150" x2="96" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="96" y="166" text-anchor="middle" class="sm dim">1</text>
    <line x1="126" y1="150" x2="126" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="126" y="166" text-anchor="middle" class="sm dim">2</text>
    <line x1="156" y1="150" x2="156" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="156" y="166" text-anchor="middle" class="sm dim">3</text>
    <line x1="186" y1="150" x2="186" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="186" y="166" text-anchor="middle" class="sm dim">4</text>
    <line x1="216" y1="150" x2="216" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="216" y="166" text-anchor="middle" class="sm dim">5</text>
    <line x1="246" y1="150" x2="246" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="246" y="166" text-anchor="middle" class="sm dim">6</text>
    <line x1="276" y1="150" x2="276" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="276" y="166" text-anchor="middle" class="sm dim">7</text>
    <line x1="306" y1="150" x2="306" y2="113.46" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="306" y="166" text-anchor="middle" class="sm dim">8</text>
    <text x="96" y="105.46" text-anchor="middle" class="sm bold">1,740</text>
    <text x="130" y="260" text-anchor="start" class="sm bold">balance</text>
  </g>
</svg>
