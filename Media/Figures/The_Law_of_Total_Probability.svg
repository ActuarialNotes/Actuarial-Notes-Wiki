<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A sample space cut into four columns A1 to A4, with an event B spanning them and each piece of B shaded in its column's colour and marked with its probability</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <clipPath id="ltpB"><ellipse cx="180" cy="262" rx="136" ry="74"/></clipPath>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="26" y="92" width="308" height="280" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
    <rect x="26" y="92" width="92.4" height="280" fill="#3b82f6" fill-opacity="0.1"/>
    <line x1="26" y1="92" x2="26" y2="372" stroke="var(--edge)" stroke-width="1"/>
    <text x="72.2" y="116" text-anchor="middle" class="bold">A₁</text>
    <rect x="118.4" y="92" width="77" height="280" fill="#d97706" fill-opacity="0.1"/>
    <line x1="118.4" y1="92" x2="118.4" y2="372" stroke="var(--edge)" stroke-width="1"/>
    <text x="156.9" y="116" text-anchor="middle" class="bold">A₂</text>
    <rect x="195.4" y="92" width="77" height="280" fill="#059669" fill-opacity="0.1"/>
    <line x1="195.4" y1="92" x2="195.4" y2="372" stroke="var(--edge)" stroke-width="1"/>
    <text x="233.9" y="116" text-anchor="middle" class="bold">A₃</text>
    <rect x="272.4" y="92" width="61.6" height="280" fill="#7c3aed" fill-opacity="0.1"/>
    <line x1="272.4" y1="92" x2="272.4" y2="372" stroke="var(--edge)" stroke-width="1"/>
    <text x="303.2" y="116" text-anchor="middle" class="bold">A₄</text>
    <g clip-path="url(#ltpB)"><rect x="26.00" y="188" width="92.40" height="148" fill="#3b82f6" fill-opacity="0.55"/><rect x="118.40" y="188" width="77.00" height="148" fill="#d97706" fill-opacity="0.55"/><rect x="195.40" y="188" width="77.00" height="148" fill="#059669" fill-opacity="0.55"/><rect x="272.40" y="188" width="61.60" height="148" fill="#7c3aed" fill-opacity="0.55"/></g>
    <text x="81.2" y="267" text-anchor="middle" class="sm bold">0.03</text>
    <text x="156.9" y="267" text-anchor="middle" class="sm bold">0.10</text>
    <text x="233.9" y="267" text-anchor="middle" class="sm bold">0.05</text>
    <text x="294.2" y="267" text-anchor="middle" class="sm bold">0.01</text>
    <ellipse cx="180" cy="262" rx="136" ry="74" fill="none" stroke="#e11d48" stroke-width="2"/>
    <text x="180" y="178" text-anchor="middle" class="bold">B</text>
  </g>
</svg>
