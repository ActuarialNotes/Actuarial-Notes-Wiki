    <circle cx="97.7" cy="299.13" r="3.2" fill="#e11d48"/>
    <circle cx="145.85" cy="264.22" r="3.2" fill="#e11d48"/>
    <circle cx="194" cy="236.29" r="3.2" fill="#e11d48"/>
