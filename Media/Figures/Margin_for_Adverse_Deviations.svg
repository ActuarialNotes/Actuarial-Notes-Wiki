<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three MfADs of the old Canadian regime, and where each of them went under IFRS 17</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Three prescribed margins, replaced by</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">one judgement</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Old: best estimate × (1 + MfADs)</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">New: fulfilment cash flows + one RA</text>
    <rect x="34" y="106" width="292" height="44" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="46" y="125" text-anchor="start" class="sm bold">claims development</text>
    <text x="46" y="140" text-anchor="start" class="sm dim">→ the risk adjustment</text>
    <rect x="34" y="160" width="292" height="44" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.2"/>
    <text x="46" y="179" text-anchor="start" class="sm bold">reinsurance recovery</text>
    <text x="46" y="194" text-anchor="start" class="sm dim">→ non-performance risk</text>
    <rect x="34" y="214" width="292" height="44" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.2"/>
    <text x="46" y="233" text-anchor="start" class="sm bold">interest rate</text>
    <text x="46" y="248" text-anchor="start" class="sm dim">→ nothing; the rate is market</text>
    <line x1="30" y1="284" x2="330" y2="284" class="rule"/>
    <text x="180" y="306" text-anchor="middle" class="sm dim">prescribed ranges were comparable but arbitrary;</text>
    <text x="180" y="322" text-anchor="middle" class="sm dim">an entity-specific RA is neither</text>
    <text x="180" y="350" text-anchor="middle" class="sm dim">note the interest MfAD: prudence used to sit inside</text>
    <text x="180" y="366" text-anchor="middle" class="sm dim">the discount rate, which confused financial risk</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">with insurance risk — IFRS 17 separates them</text>
  </g>
</svg>
