<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Claims split at the retention between the entity's own layer and the insurer's</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The layer the entity funds itself</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Retained = Σ min(X_i, R)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Excess = Σ max(X_i − R, 0)</text>
  <line x1="72" y1="322" x2="320" y2="322" class="grid"/>
  <line x1="72" y1="277.6" x2="320" y2="277.6" class="grid"/>
  <line x1="72" y1="188.8" x2="320" y2="188.8" class="grid"/>
  <line x1="72" y1="100" x2="320" y2="100" class="grid"/>
  <line x1="72" y1="322" x2="330" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="322" x2="72" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="322" x2="72" y2="322" class="tick"/>
  <text x="64" y="325.6" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="277.6" x2="72" y2="277.6" class="tick"/>
  <text x="64" y="281.2" text-anchor="end" class="sm dim">250</text>
  <line x1="68" y1="188.8" x2="72" y2="188.8" class="tick"/>
  <text x="64" y="192.4" text-anchor="end" class="sm dim">750</text>
  <line x1="68" y1="100" x2="72" y2="100" class="tick"/>
  <text x="64" y="103.6" text-anchor="end" class="sm dim">1,250</text>
  <rect x="84.4" y="300.69" width="16.53" height="21.31" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="113.92" y="277.6" width="16.53" height="44.4" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="113.92" y="261.62" width="16.53" height="15.98" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="143.45" y="306.02" width="16.53" height="15.98" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="172.97" y="277.6" width="16.53" height="44.4" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="172.97" y="183.47" width="16.53" height="94.13" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="202.5" y="277.6" width="16.53" height="44.4" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="232.02" y="311.34" width="16.53" height="10.66" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="261.54" y="277.6" width="16.53" height="44.4" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="261.54" y="117.76" width="16.53" height="159.84" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="291.07" y="286.48" width="16.53" height="35.52" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <line x1="72" y1="277.6" x2="320" y2="277.6" class="thin" stroke="#e11d48" stroke-width="1.3"/>
  <text x="317.05" y="270.6" text-anchor="end" class="sm bold" fill="#e11d48">SIR 250</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">individual claims ($000)</text>
  <line x1="56" y1="374" x2="69" y2="374" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="75" y="377.6" text-anchor="start" class="sm">retained</text>
  <line x1="176" y1="374" x2="189" y2="374" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="195" y="377.6" text-anchor="start" class="sm">insured</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the retained layer still needs a reserve estimate</text>
</svg>
