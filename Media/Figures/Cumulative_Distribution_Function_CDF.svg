  <text x="356" y="92" text-anchor="start" class="sm bold">Reading the CDF</text>
  <text x="356" y="116" text-anchor="start" class="sm" fill="#7c3aed">F(x) = P(X ≤ x)</text>
  <text x="356" y="140" text-anchor="start" class="sm dim">non-decreasing, right-continuous</text>
  <text x="356" y="164" text-anchor="start" class="sm dim">F(−∞) = 0,  F(∞) = 1</text>
  <text x="356" y="188" text-anchor="start" class="sm" fill="#3b82f6">f(x) = F′(x)</text>
  <text x="356" y="212" text-anchor="start" class="sm" fill="#059669">P(a &lt; X ≤ b) = F(b) − F(a)</text>
  <text x="356" y="252" text-anchor="start" class="sm dim">A discrete CDF is a staircase:</text>
  <text x="356" y="268" text-anchor="start" class="sm dim">flat, then jumping by p(k)</text>
