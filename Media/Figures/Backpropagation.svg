<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A forward pass computing the loss and a backward pass returning the gradients</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvarink" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--ink)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Forward for the loss, backward for the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">gradient</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">w ← w − η ∂L/∂w</text>
  <rect x="28" y="150" width="60" height="34" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="58" y="172" text-anchor="middle" class="sm bold">x</text>
  <rect x="108" y="150" width="60" height="34" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="138" y="172" text-anchor="middle" class="sm bold">hidden</text>
  <rect x="194" y="150" width="60" height="34" rx="6" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.3"/>
  <text x="224" y="172" text-anchor="middle" class="sm bold">ŷ</text>
  <rect x="268" y="150" width="60" height="34" rx="6" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3"/>
  <text x="298" y="172" text-anchor="middle" class="sm bold">L</text>
  <line x1="90" y1="160" x2="106" y2="160" class="thin" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ahvarink)"/>
  <line x1="170" y1="160" x2="192" y2="160" class="thin" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ahvarink)"/>
  <line x1="256" y1="160" x2="266" y2="160" class="thin" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ahvarink)"/>
  <line x1="106" y1="176" x2="90" y2="176" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
  <line x1="192" y1="176" x2="170" y2="176" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
  <line x1="266" y1="176" x2="256" y2="176" class="thin" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ahe11d48)"/>
  <text x="180" y="132" text-anchor="middle" class="sm dim">forward: activations, then the loss</text>
  <text x="180" y="208" text-anchor="middle" class="sm dim">backward: ∂L/∂z carried layer by layer</text>
  <line x1="40" y1="232" x2="320" y2="232" class="rule"/>
  <text x="180" y="256" text-anchor="middle" class="sm bold">one step, worked</text>
  <text x="180" y="280" text-anchor="middle" class="sm">∂L/∂ŷ = −2(5 − 3) = −4</text>
  <text x="180" y="302" text-anchor="middle" class="sm">∂ŷ/∂w = A = 2  ⇒  ∂L/∂w = −8</text>
  <text x="180" y="324" text-anchor="middle" class="sm">w ← 0.40 − 0.05(−8) = 0.80</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">one backward pass gets every weight's gradient</text>
</svg>
