<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five years drawn as bars as wide as their exposure, beside a complement block as wide as k = 480; the exposure-weighted level across them all is the estimate, and the years carry Z = 0.73</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="34" y="158.52" width="21.54" height="175.48" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="58.54" y="197.04" width="40.01" height="136.96" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="101.56" y="175.64" width="29.24" height="158.36" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="133.79" y="209.88" width="63.09" height="124.12" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="199.89" y="186.34" width="49.24" height="147.66" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="252.13" y="173.5" width="73.87" height="160.5" rx="2" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <line x1="28" y1="186.53" x2="332" y2="186.53" class="thin dash" stroke="var(--ink)" stroke-width="1.6"/>
    <text x="289.07" y="202.53" text-anchor="middle" class="sm">estimate</text>
    <line x1="28" y1="334" x2="332" y2="334" class="axis"/>
    <text x="141.57" y="144.52" text-anchor="middle" class="bold">Z = 0.73</text>
    <path d="M34,342 v4.8 H136.57 q5,0 5,4.4 q0,-4.4 5,-4.4 H249.13 v-4.8" class="thin" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="141.57" y="361" text-anchor="middle" class="sm bold">m = 1,320</text>
    <path d="M252.13,342 v4.8 H284.07 q5,0 5,4.4 q0,-4.4 5,-4.4 H326 v-4.8" class="thin" stroke="#d97706" stroke-width="1.2"/>
    <text x="289.07" y="361" text-anchor="middle" class="sm bold">k = 480</text>
  </g>
</svg>
