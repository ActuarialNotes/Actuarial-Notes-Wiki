<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Earned premium as 100% beside claims of 64% and expenses of 31%: a 95% combined ratio, leaving a 5% underwriting profit</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="52" y="92" width="90" height="276" rx="4" fill="#0d9488" fill-opacity="0.24" stroke="#0d9488" stroke-width="1.3"/>
    <text x="97" y="226" text-anchor="middle" class="sm bold">premium</text>
    <text x="97" y="242" text-anchor="middle" class="sm">100%</text>
    <rect x="176" y="191.36" width="90" height="176.64" rx="4" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="221" y="275.68" text-anchor="middle" class="sm bold">loss</text>
    <text x="221" y="291.68" text-anchor="middle" class="sm">64%</text>
    <rect x="176" y="105.8" width="90" height="85.56" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.3"/>
    <text x="221" y="144.58" text-anchor="middle" class="sm bold">expense</text>
    <text x="221" y="160.58" text-anchor="middle" class="sm">31%</text>
    <rect x="176" y="92" width="90" height="13.8" rx="2" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="142" y1="92" x2="300" y2="92" class="thin dash" stroke="var(--dim)" stroke-width="1.1"/>
    <text x="272" y="97" text-anchor="start" class="sm">profit 5%</text>
    <path d="M272,105.8 h8 V368 h-8" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="286" y="240.9" text-anchor="start" class="bold">95%</text>
    <line x1="40" y1="368" x2="320" y2="368" class="axis"/>
  </g>
</svg>
