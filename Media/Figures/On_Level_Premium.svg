<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three years of earned premium drawn as bars, the two older years lengthened by their on-level factors to today's rate level</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="68" y="138" text-anchor="end" class="sm dim">2023</text>
    <rect x="76" y="112" width="220.4" height="40" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="296.4" y="112" width="22.79" height="40" rx="3" fill="#059669" fill-opacity="0.6"/>
    <text x="319.19" y="170" text-anchor="end" class="sm">× 1.1034</text>
    <text x="86" y="137" text-anchor="start" class="sm">3,800</text>
    <text x="68" y="230" text-anchor="end" class="sm dim">2024</text>
    <rect x="76" y="204" width="226.2" height="40" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="302.2" y="204" width="3.08" height="40" rx="3" fill="#059669" fill-opacity="0.6"/>
    <text x="305.28" y="262" text-anchor="end" class="sm">× 1.0136</text>
    <text x="86" y="229" text-anchor="start" class="sm">3,900</text>
    <text x="68" y="322" text-anchor="end" class="sm dim">2025</text>
    <rect x="76" y="296" width="232" height="40" rx="3" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.1"/>
    <text x="86" y="321" text-anchor="start" class="sm">4,000</text>
  </g>
</svg>
