<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A Poisson counting path with exponential gaps between jumps</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Counts by time t are Poisson(λt)</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">N(t) ~ Poi(λt)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">E[N(t)] = Var(N(t)) = λt</text>
  <line x1="60" y1="352" x2="336" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="352" x2="60" y2="92" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="352" x2="60" y2="356" class="tick"/>
  <text x="60" y="368" text-anchor="middle" class="sm dim">0</text>
  <line x1="148.67" y1="352" x2="148.67" y2="356" class="tick"/>
  <text x="148.67" y="368" text-anchor="middle" class="sm dim">1</text>
  <line x1="237.33" y1="352" x2="237.33" y2="356" class="tick"/>
  <text x="237.33" y="368" text-anchor="middle" class="sm dim">2</text>
  <line x1="326" y1="352" x2="326" y2="356" class="tick"/>
  <text x="326" y="368" text-anchor="middle" class="sm dim">3</text>
  <line x1="56" y1="352" x2="60" y2="352" class="tick"/>
  <text x="52" y="355.6" text-anchor="end" class="sm dim">0</text>
  <line x1="56" y1="289.5" x2="60" y2="289.5" class="tick"/>
  <text x="52" y="293.1" text-anchor="end" class="sm dim">2</text>
  <line x1="56" y1="227" x2="60" y2="227" class="tick"/>
  <text x="52" y="230.6" text-anchor="end" class="sm dim">4</text>
  <line x1="56" y1="164.5" x2="60" y2="164.5" class="tick"/>
  <text x="52" y="168.1" text-anchor="end" class="sm dim">6</text>
  <line x1="56" y1="102" x2="60" y2="102" class="tick"/>
  <text x="52" y="105.6" text-anchor="end" class="sm dim">8</text>
  <text x="326" y="384" text-anchor="end" class="sm dim">months</text>
  <polyline points="60,352 75.96,352 75.96,320.75 97.24,320.75 97.24,289.5 122.95,289.5 122.95,258.25 153.1,258.25 153.1,227 180.59,227 180.59,195.75 228.47,195.75 228.47,164.5 276.35,164.5 276.35,133.25 326,133.25" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="75.96" cy="320.75" r="2.8" fill="#3b82f6"/>
  <line x1="75.96" y1="352" x2="75.96" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="97.24" cy="289.5" r="2.8" fill="#3b82f6"/>
  <line x1="97.24" y1="352" x2="97.24" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="122.95" cy="258.25" r="2.8" fill="#3b82f6"/>
  <line x1="122.95" y1="352" x2="122.95" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="153.1" cy="227" r="2.8" fill="#3b82f6"/>
  <line x1="153.1" y1="352" x2="153.1" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="180.59" cy="195.75" r="2.8" fill="#3b82f6"/>
  <line x1="180.59" y1="352" x2="180.59" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="228.47" cy="164.5" r="2.8" fill="#3b82f6"/>
  <line x1="228.47" y1="352" x2="228.47" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="276.35" cy="133.25" r="2.8" fill="#3b82f6"/>
  <line x1="276.35" y1="352" x2="276.35" y2="343.25" stroke="#d97706" stroke-width="1.4"/>
  <path d="M180.59,308.25 v-3.6 H199.53 q5,0 5,-3.3 q0,3.3 5,3.3 H228.47 v3.6" class="thin" stroke="#d97706" stroke-width="1.2"/>
  <text x="204.53" y="289.25" text-anchor="middle" class="sm">T ~ Exp(λ)</text>
  <text x="180" y="86" text-anchor="middle" class="sm dim">λ = 4 claims per month</text>
</svg>
