  <circle cx="262.65" cy="222" r="4.2" fill="#3b82f6" fill-opacity="0.85"/>
  <line x1="196.45" y1="252" x2="196.45" y2="230" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
