<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>Payments rising by a constant amount, split into a level and an increasing piece</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">An arithmetic annuity is a level annuity plus a staircase</text>
  <line x1="88" y1="128" x2="448" y2="128" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="96" y1="124" x2="96" y2="132" class="tick"/>
  <text x="96" y="145" text-anchor="middle" class="sm dim">0</text>
  <line x1="151.67" y1="124" x2="151.67" y2="132" class="tick"/>
  <text x="151.67" y="145" text-anchor="middle" class="sm dim">1</text>
  <line x1="207.33" y1="124" x2="207.33" y2="132" class="tick"/>
  <text x="207.33" y="145" text-anchor="middle" class="sm dim">2</text>
  <line x1="263" y1="124" x2="263" y2="132" class="tick"/>
  <text x="263" y="145" text-anchor="middle" class="sm dim">3</text>
  <line x1="318.67" y1="124" x2="318.67" y2="132" class="tick"/>
  <text x="318.67" y="145" text-anchor="middle" class="sm dim">4</text>
  <line x1="374.33" y1="124" x2="374.33" y2="132" class="tick"/>
  <text x="374.33" y="145" text-anchor="middle" class="sm dim">5</text>
  <line x1="430" y1="124" x2="430" y2="132" class="tick"/>
  <text x="430" y="145" text-anchor="middle" class="sm dim">6</text>
  <rect x="142.67" y="104" width="18" height="24" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="151.67" y="97" text-anchor="middle" class="sm">1</text>
  <rect x="198.33" y="104" width="18" height="24" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="198.33" y="95" width="18" height="9" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="207.33" y="88" text-anchor="middle" class="sm">2</text>
  <rect x="254" y="104" width="18" height="24" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="254" y="86" width="18" height="18" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="263" y="79" text-anchor="middle" class="sm">3</text>
  <rect x="309.67" y="104" width="18" height="24" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="309.67" y="77" width="18" height="27" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="318.67" y="70" text-anchor="middle" class="sm">4</text>
  <rect x="365.33" y="104" width="18" height="24" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="365.33" y="68" width="18" height="36" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="374.33" y="61" text-anchor="middle" class="sm">5</text>
  <rect x="421" y="104" width="18" height="24" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="421" y="59" width="18" height="45" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="430" y="52" text-anchor="middle" class="sm">6</text>
  <line x1="452" y1="82" x2="465" y2="82" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="471" y="85.6" text-anchor="start" class="sm">level P</text>
  <line x1="452" y1="98" x2="465" y2="98" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="471" y="101.6" text-anchor="start" class="sm">increase Q</text>
  <line x1="28" y1="200" x2="532" y2="200" class="rule"/>
  <text x="150" y="222" text-anchor="middle" class="sm bold">(Ia)₍ₙ₎ = (ä₍ₙ₎ − n vⁿ) / i</text>
  <text x="150" y="242" text-anchor="middle" class="sm dim">payments 1, 2, 3, …, n</text>
  <text x="150" y="264" text-anchor="middle" class="sm dim">(Is)₍ₙ₎ = (1+i)ⁿ (Ia)₍ₙ₎</text>
  <text x="412" y="222" text-anchor="middle" class="sm bold">General P and Q</text>
  <text x="412" y="242" text-anchor="middle" class="sm dim">PV = P·a₍ₙ₎ + (Q/i)(a₍ₙ₎ − n vⁿ)</text>
  <text x="412" y="264" text-anchor="middle" class="sm dim">the two pieces are valued separately</text>
  <text x="280" y="290" text-anchor="middle" class="sm dim">(Ia)₍ₙ₎ + (Da)₍ₙ₎ = (n + 1) a₍ₙ₎ — the pair sums to n+1 each period</text>
</svg>
