<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A drop payment clears the small balance that is left</text>
  <line x1="122" y1="124" x2="438" y2="124" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="130" y1="120" x2="130" y2="128" class="tick"/>
  <text x="130" y="141" text-anchor="middle" class="sm dim">0</text>
  <line x1="178.33" y1="120" x2="178.33" y2="128" class="tick"/>
  <text x="178.33" y="141" text-anchor="middle" class="sm dim">1</text>
  <line x1="226.67" y1="120" x2="226.67" y2="128" class="tick"/>
  <text x="226.67" y="141" text-anchor="middle" class="sm dim">2</text>
  <line x1="275" y1="120" x2="275" y2="128" class="tick"/>
  <text x="275" y="141" text-anchor="middle" class="sm dim">3</text>
  <line x1="323.33" y1="120" x2="323.33" y2="128" class="tick"/>
  <text x="323.33" y="141" text-anchor="middle" class="sm dim">4</text>
  <line x1="371.67" y1="120" x2="371.67" y2="128" class="tick"/>
  <text x="371.67" y="141" text-anchor="middle" class="sm dim">5</text>
  <line x1="420" y1="120" x2="420" y2="128" class="tick"/>
  <text x="420" y="141" text-anchor="middle" class="sm dim">6</text>
  <line x1="178.33" y1="124" x2="178.33" y2="82" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="178.33" y="76" text-anchor="middle" class="sm">P</text>
  <line x1="226.67" y1="124" x2="226.67" y2="82" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="226.67" y="76" text-anchor="middle" class="sm">P</text>
  <line x1="275" y1="124" x2="275" y2="82" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="275" y="76" text-anchor="middle" class="sm">P</text>
  <line x1="323.33" y1="124" x2="323.33" y2="82" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="323.33" y="76" text-anchor="middle" class="sm">P</text>
  <line x1="371.67" y1="124" x2="371.67" y2="82" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="371.67" y="76" text-anchor="middle" class="sm">P</text>
  <line x1="420" y1="124" x2="420" y2="106" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="420" y="100" text-anchor="middle" class="sm">drop</text>
  <line x1="166.33" y1="82" x2="432" y2="82" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="444" y="78" text-anchor="start" class="sm dim">level P</text>
  <line x1="28" y1="190" x2="532" y2="190" class="rule"/>
  <text x="150" y="212" text-anchor="middle" class="sm bold">Drop = B_n (1 + i)</text>
  <text x="150" y="232" text-anchor="middle" class="sm dim">the last balance, accumulated one period</text>
  <text x="150" y="252" text-anchor="middle" class="sm dim">occurs on the regular payment date</text>
  <text x="412" y="212" text-anchor="middle" class="sm bold">Why it happens</text>
  <text x="412" y="232" text-anchor="middle" class="sm dim">P was rounded up, so the loan clears early</text>
  <text x="412" y="252" text-anchor="middle" class="sm dim">contrast with a balloon, which is larger</text>
  <text x="280" y="278" text-anchor="middle" class="sm dim">Find the balance first — the drop is never P minus something</text>
</svg>
