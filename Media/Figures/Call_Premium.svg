<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The call premium shrinking to zero as maturity approaches</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The call premium narrows towards</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">maturity</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">call premium = call price − F</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">it reaches zero at maturity</text>
  <polyline points="78,136.11 119.33,162.84 160.67,189.58 202,216.32 243.33,243.05 284.67,269.79 326,296.53" class="curve" stroke="#d97706" stroke-width="2"/>
  <circle cx="78" cy="136.11" r="3" fill="#d97706"/>
  <circle cx="119.33" cy="162.84" r="3" fill="#d97706"/>
  <circle cx="160.67" cy="189.58" r="3" fill="#d97706"/>
  <circle cx="202" cy="216.32" r="3" fill="#d97706"/>
  <circle cx="243.33" cy="243.05" r="3" fill="#d97706"/>
  <circle cx="284.67" cy="269.79" r="3" fill="#d97706"/>
  <circle cx="326" cy="296.53" r="3" fill="#d97706"/>
  <line x1="78" y1="296.53" x2="326" y2="296.53" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="292.93" y="283.16" text-anchor="end" class="sm dim">face value</text>
  <line x1="78" y1="136.11" x2="78" y2="296.53" stroke="#e11d48" stroke-width="2.4"/>
  <line x1="202" y1="216.32" x2="202" y2="296.53" stroke="#e11d48" stroke-width="2.4"/>
  <text x="94.53" y="210.97" text-anchor="start" class="sm bold" fill="#e11d48">call premium</text>
  <line x1="78" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="354" class="tick"/>
  <text x="78" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="160.67" y1="350" x2="160.67" y2="354" class="tick"/>
  <text x="160.67" y="366" text-anchor="middle" class="sm dim">6</text>
  <line x1="243.33" y1="350" x2="243.33" y2="354" class="tick"/>
  <text x="243.33" y="366" text-anchor="middle" class="sm dim">8</text>
  <line x1="326" y1="350" x2="326" y2="354" class="tick"/>
  <text x="326" y="366" text-anchor="middle" class="sm dim">10</text>
  <line x1="74" y1="296.53" x2="78" y2="296.53" class="tick"/>
  <text x="70" y="300.13" text-anchor="end" class="sm dim">1,000</text>
  <line x1="74" y1="162.84" x2="78" y2="162.84" class="tick"/>
  <text x="70" y="166.44" text-anchor="end" class="sm dim">1,050</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">call date (period)</text>
  <text x="74" y="82" text-anchor="start" class="sm dim">call price</text>
</svg>
