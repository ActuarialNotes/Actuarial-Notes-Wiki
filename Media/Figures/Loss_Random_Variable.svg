  <text x="108.8" y="216" text-anchor="middle" class="sm dim">d</text>
  <text x="328" y="232" text-anchor="end" class="sm dim">x</text>
  <text x="50" y="50" text-anchor="start" class="sm dim">f_X(x)</text>
  <line x1="108.8" y1="200" x2="108.8" y2="72.61" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="80.72" y="149.81" text-anchor="middle" class="sm dim">X ≤ d</text>
  <text x="80.72" y="166" text-anchor="middle" class="sm dim">no pay</text>
  <text x="204.7" y="157.9" text-anchor="middle" class="sm">X &gt; d  →  insurer pays X − d</text>
  <text x="420" y="96" text-anchor="middle" class="sm bold">Loss X  vs  payment Y</text>
  <line x1="316" y1="118" x2="316" y2="152" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="131" text-anchor="start" class="sm bold">X is ground-up</text>
  <text x="326" y="147" text-anchor="start" class="sm dim">the full economic loss</text>
  <line x1="316" y1="166" x2="316" y2="200" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="179" text-anchor="start" class="sm bold">Y = (X − d)₊</text>
  <text x="326" y="195" text-anchor="start" class="sm dim">truncated below, censored above</text>
  <line x1="316" y1="214" x2="316" y2="248" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="326" y="227" text-anchor="start" class="sm bold">E[Y] ≠ E[X] − d</text>
