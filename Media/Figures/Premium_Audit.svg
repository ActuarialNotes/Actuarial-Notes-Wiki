<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A deposit premium corrected to the audited exposure after the policy expires</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The exposure is only known afterwards</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Audited Premium = Rate × Actual Exposure</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Adjustment = Audited − Deposit</text>
  <text x="180" y="112" text-anchor="middle" class="sm dim">workers compensation, payroll per $100</text>
  <text x="88" y="161" text-anchor="end" class="sm dim">estimated</text>
  <rect x="96" y="146" width="121.5" height="26" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="156.75" y="164" text-anchor="middle" class="sm">$9,000</text>
  <text x="88" y="223" text-anchor="end" class="sm dim">actual</text>
  <rect x="96" y="208" width="167.4" height="26" rx="3" fill="#059669" fill-opacity="0.34" stroke="#059669" stroke-width="1.2"/>
  <text x="179.7" y="226" text-anchor="middle" class="sm">$12,400</text>
  <rect x="217.5" y="208" width="45.9" height="26" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <line x1="217.5" y1="264" x2="263.4" y2="264" class="thin" stroke="#d97706" stroke-width="1.6" marker-end="url(#ahd97706)"/>
  <text x="240.45" y="284" text-anchor="middle" class="sm bold" fill="#d97706">+$3,400 billed at audit</text>
  <text x="180" y="326" text-anchor="middle" class="sm dim">audits also correct classification and</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">must be booked before the data is used</text>
</svg>
