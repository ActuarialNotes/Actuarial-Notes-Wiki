  <line x1="58" y1="202" x2="58" y2="56" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="85.3" y1="202" x2="85.3" y2="206" class="tick"/>
  <text x="85.3" y="218" text-anchor="middle" class="sm dim">0</text>
  <line x1="236.99" y1="202" x2="236.99" y2="206" class="tick"/>
  <text x="236.99" y="218" text-anchor="middle" class="sm dim">u</text>
  <text x="328" y="234" text-anchor="end" class="sm dim">y</text>
  <text x="54" y="52" text-anchor="start" class="sm dim">density / mass</text>
  <line x1="85.3" y1="202" x2="85.3" y2="91.9" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85.3" cy="91.9" r="4" fill="#d97706"/>
  <text x="85.3" y="81.9" text-anchor="middle" class="sm bold" fill="#d97706">P(X ≤ d)</text>
