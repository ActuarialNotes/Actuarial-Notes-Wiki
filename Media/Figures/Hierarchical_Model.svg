<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Observations nested inside groups nested inside a population</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Levels nested inside levels</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="438" text-anchor="middle" class="fml">y_ij = β₀ + b_i + ε_ij</text>
    <rect x="74" y="92" width="212" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="113" text-anchor="middle" class="sm bold">population  β₀</text>
    <rect x="32" y="168" width="88" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="76" y="189" text-anchor="middle" class="sm">group 1</text>
    <line x1="180" y1="128" x2="76" y2="164" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <circle cx="50" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="76" y1="204" x2="50" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <circle cx="76" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="76" y1="204" x2="76" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <circle cx="102" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="76" y1="204" x2="102" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <rect x="132" y="168" width="88" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="176" y="189" text-anchor="middle" class="sm">group 2</text>
    <line x1="180" y1="128" x2="176" y2="164" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <circle cx="150" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="176" y1="204" x2="150" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <circle cx="176" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="176" y1="204" x2="176" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <circle cx="202" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="176" y1="204" x2="202" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <rect x="232" y="168" width="88" height="34" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="276" y="189" text-anchor="middle" class="sm">group 3</text>
    <line x1="180" y1="128" x2="276" y2="164" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <circle cx="250" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="276" y1="204" x2="250" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <circle cx="276" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="276" y1="204" x2="276" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <circle cx="302" cy="264" r="9" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
    <line x1="276" y1="204" x2="302" y2="252" class="thin" stroke="var(--axis)" stroke-width="1.0" marker-end="url(#ahvaraxis)"/>
    <text x="180" y="300" text-anchor="middle" class="sm dim">level 3 · level 2 · level 1</text>
    <text x="180" y="326" text-anchor="middle" class="sm dim">variance is split across the levels,</text>
    <text x="180" y="342" text-anchor="middle" class="sm dim">one component each</text>
    <text x="180" y="390" text-anchor="middle" class="sm dim">observations in a group are correlated</text>
  </g>
</svg>
