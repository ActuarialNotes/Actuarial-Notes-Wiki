  <text x="58" y="86" text-anchor="start" class="sm dim">accuracy</text>
  <text x="320" y="358" text-anchor="end" class="sm dim">availability</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">policy year matches best and closes last</text>
</svg>
