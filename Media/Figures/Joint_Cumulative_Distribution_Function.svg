<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The joint CDF as the probability mass in the lower-left quadrant</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The joint CDF accumulates mass to the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">lower left</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">F(x, y) = P(X ≤ x, Y ≤ y)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">f(x, y) = ∂²F / ∂x ∂y</text>
  <rect x="88" y="106" width="216" height="216" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <rect x="88" y="196.72" width="133.92" height="125.28" fill="#3b82f6" fill-opacity="0.22"/>
  <line x1="221.92" y1="106" x2="221.92" y2="322" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="88" y1="196.72" x2="304" y2="196.72" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="88" y1="322" x2="320" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="88" y1="322" x2="88" y2="94" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <text x="221.92" y="342" text-anchor="middle" class="sm dim">x</text>
  <text x="78" y="200.72" text-anchor="end" class="sm dim">y</text>
  <text x="154.96" y="264.36" text-anchor="middle" class="bold" fill="#3b82f6">F(x, y)</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">F(∞, ∞) = 1,  F(−∞, y) = 0</text>
</svg>
