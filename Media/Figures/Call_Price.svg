<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <title>The call price replacing the redemption value at a call date</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">At a call date, the call price takes the place of C</text>
  <line x1="96" y1="122" x2="438" y2="122" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="104" y1="118" x2="104" y2="126" class="tick"/>
  <text x="104" y="139" text-anchor="middle" class="sm dim">0</text>
  <line x1="143.5" y1="118" x2="143.5" y2="126" class="tick"/>
  <line x1="183" y1="118" x2="183" y2="126" class="tick"/>
  <line x1="222.5" y1="118" x2="222.5" y2="126" class="tick"/>
  <text x="222.5" y="139" text-anchor="middle" class="sm dim">n_c</text>
  <line x1="262" y1="118" x2="262" y2="126" class="tick"/>
  <line x1="301.5" y1="118" x2="301.5" y2="126" class="tick"/>
  <line x1="341" y1="118" x2="341" y2="126" class="tick"/>
  <line x1="380.5" y1="118" x2="380.5" y2="126" class="tick"/>
  <line x1="420" y1="118" x2="420" y2="126" class="tick"/>
  <text x="420" y="139" text-anchor="middle" class="sm dim">n</text>
  <line x1="143.5" y1="122" x2="143.5" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="183" y1="122" x2="183" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="222.5" y1="122" x2="222.5" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="262" y1="122" x2="262" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="301.5" y1="122" x2="301.5" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="341" y1="122" x2="341" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="380.5" y1="122" x2="380.5" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="420" y1="122" x2="420" y2="98" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="222.5" y1="122" x2="222.5" y2="62" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="222.5" y="56" text-anchor="middle" class="sm">C_call</text>
  <line x1="420" y1="122" x2="420" y2="62" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="420" y="56" text-anchor="middle" class="sm">C</text>
  <line x1="222.5" y1="44" x2="222.5" y2="112" class="thin dash" stroke="#d97706" stroke-width="1.2"/>
  <line x1="28" y1="196" x2="532" y2="196" class="rule"/>
  <text x="150" y="218" text-anchor="middle" class="sm bold">P_call = Fr·a₍ₙ_c₎ⱼ + C_call·v^(n_c)</text>
  <text x="150" y="240" text-anchor="middle" class="sm dim">the same formula, a shorter term</text>
  <text x="150" y="260" text-anchor="middle" class="sm dim">and a different terminal payment</text>
  <text x="412" y="218" text-anchor="middle" class="sm bold">Call price ≥ face value</text>
  <text x="412" y="240" text-anchor="middle" class="sm dim">the excess is the call premium</text>
  <text x="412" y="260" text-anchor="middle" class="sm dim">it compensates for the lost coupons</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">Price every possible call date and take the lowest price</text>
</svg>
