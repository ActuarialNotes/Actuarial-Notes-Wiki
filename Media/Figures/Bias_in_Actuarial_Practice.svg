<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Testing a model on outputs by group, and the three fairness definitions that cannot all hold at once</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Dropping the variable does not remove</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">the effect</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Test the outputs, not the inputs</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">predicted vs actual cost, by group</text>
    <text x="180" y="100" text-anchor="middle" class="sm dim">loss ratio by group, one model</text>
    <rect x="77.22" y="147.22" width="47.56" height="60.78" rx="3" fill="#0d9488" fill-opacity="0.75"/>
    <text x="101" y="140.22" text-anchor="middle" class="sm">63%</text>
    <text x="101" y="223" text-anchor="middle" class="sm dim">group A</text>
    <rect x="159.22" y="138.54" width="47.56" height="69.46" rx="3" fill="#e11d48" fill-opacity="0.75"/>
    <text x="183" y="131.54" text-anchor="middle" class="sm">72%</text>
    <text x="183" y="223" text-anchor="middle" class="sm dim">group B</text>
    <rect x="241.22" y="144.33" width="47.56" height="63.67" rx="3" fill="#0d9488" fill-opacity="0.75"/>
    <text x="265" y="137.33" text-anchor="middle" class="sm">66%</text>
    <text x="265" y="223" text-anchor="middle" class="sm dim">group C</text>
    <line x1="54" y1="208" x2="312" y2="208" class="axis"/>
    <text x="180" y="244" text-anchor="middle" class="sm dim">group B pays too little for its cost —</text>
    <text x="180" y="260" text-anchor="middle" class="sm dim">found only by looking at the output</text>
    <line x1="30" y1="280" x2="330" y2="280" class="rule"/>
    <text x="180" y="302" text-anchor="middle" class="sm bold">and these three cannot all hold</text>
    <rect x="36" y="316" width="90.67" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="81.33" y="332" text-anchor="middle" class="sm">equal premium</text>
    <rect x="134.67" y="316" width="90.67" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="332" text-anchor="middle" class="sm">equal LR</text>
    <rect x="233.33" y="316" width="90.67" height="24" rx="12.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
    <text x="278.67" y="332" text-anchor="middle" class="sm">equal risk</text>
    <text x="180" y="362" text-anchor="middle" class="sm dim">so fairness has to be chosen, stated and documented</text>
    <text x="180" y="378" text-anchor="middle" class="sm dim">in the model risk framework — not assumed</text>
  </g>
</svg>
