<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The historic bargain — the worker's tort action traded for a no-fault benefit an employer pool funds</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">A monopoly board, funded by employer</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">assessment</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Assessment = rate per $100 of payroll</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">× payroll, adjusted by experience</text>
    <rect x="40" y="94" width="112" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="96" y="112" text-anchor="middle" class="sm">worker</text>
    <rect x="208" y="94" width="112" height="28" rx="14.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="264" y="112" text-anchor="middle" class="sm">employer</text>
    <line x1="152" y1="100" x2="208" y2="100" class="thin" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ah3b82f6)"/>
    <line x1="208" y1="118" x2="152" y2="118" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
    <text x="180" y="146" text-anchor="middle" class="sm dim">gives up the right to sue</text>
    <text x="180" y="162" text-anchor="middle" class="sm dim">gets a no-fault benefit for life</text>
    <line x1="30" y1="184" x2="330" y2="184" class="rule"/>
    <text x="36" y="208" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="208" text-anchor="start" class="sm">no private insurer writes it, in any province</text>
    <text x="36" y="232" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="232" text-anchor="start" class="sm">WSIB · WorkSafeBC · WCB Alberta · CNESST</text>
    <text x="36" y="256" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="256" text-anchor="start" class="sm">rate groups by industry, experience rated</text>
    <text x="36" y="280" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="280" text-anchor="start" class="sm">permanent disability is a lifetime annuity —</text>
    <text x="36" y="304" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="304" text-anchor="start" class="sm">the board's liability behaves like a pension</text>
    <text x="180" y="348" text-anchor="middle" class="sm dim">a general liability policy does not cover employee</text>
    <text x="180" y="364" text-anchor="middle" class="sm dim">injury — the board has exclusive jurisdiction</text>
  </g>
</svg>
