  <circle cx="236.99" cy="150.19" r="4" fill="#e11d48"/>
  <text x="240.99" y="140.19" text-anchor="middle" class="sm bold" fill="#e11d48">P(X ≥ d + u/α)</text>
  <text x="420" y="96" text-anchor="middle" class="sm bold">Y = α min( (X − d)₊ , u )</text>
