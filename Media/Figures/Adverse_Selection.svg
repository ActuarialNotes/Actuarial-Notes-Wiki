<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The death spiral over rounds of repricing: the price climbs as the number insured falls, each round losing the best risks left</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="56" y1="352" x2="332" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="352" x2="56" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <polyline points="56,273.4 100.33,262.92 144.67,247.2 189,223.62 233.33,189.56 277.67,142.4 322,90" class="curve" stroke="#e11d48" stroke-width="2.6"/>
    <polyline points="56,100.48 100.33,137.16 144.67,179.08 189,221 233.33,262.92 277.67,299.6 322,325.8" class="curve" stroke="#3b82f6" stroke-width="2.6"/>
    <circle cx="56" cy="273.4" r="3.4" fill="#e11d48"/>
    <circle cx="56" cy="100.48" r="3.4" fill="#3b82f6"/>
    <circle cx="100.33" cy="262.92" r="3.4" fill="#e11d48"/>
    <circle cx="100.33" cy="137.16" r="3.4" fill="#3b82f6"/>
    <circle cx="144.67" cy="247.2" r="3.4" fill="#e11d48"/>
    <circle cx="144.67" cy="179.08" r="3.4" fill="#3b82f6"/>
    <circle cx="189" cy="223.62" r="3.4" fill="#e11d48"/>
    <circle cx="189" cy="221" r="3.4" fill="#3b82f6"/>
    <circle cx="233.33" cy="189.56" r="3.4" fill="#e11d48"/>
    <circle cx="233.33" cy="262.92" r="3.4" fill="#3b82f6"/>
    <circle cx="277.67" cy="142.4" r="3.4" fill="#e11d48"/>
    <circle cx="277.67" cy="299.6" r="3.4" fill="#3b82f6"/>
    <circle cx="322" cy="90" r="3.4" fill="#e11d48"/>
    <circle cx="322" cy="325.8" r="3.4" fill="#3b82f6"/>
    <text x="242.2" y="126.68" text-anchor="middle" class="bold">price</text>
    <text x="113.63" y="116.2" text-anchor="start" class="bold">insureds</text>
    <text x="322" y="372" text-anchor="end" class="sm dim">rounds</text>
  </g>
</svg>
