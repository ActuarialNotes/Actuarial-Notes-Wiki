<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The weights of a loading vector shown as a bar per variable for two components</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A loading vector weights the variables</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">z_im = Σⱼ φ_jm x_ij,   Σⱼ φ²_jm = 1</text>
  <text x="180" y="98" text-anchor="middle" class="sm bold" fill="#3b82f6">φ₁ — overall size</text>
  <line x1="52" y1="156" x2="316" y2="156" class="axis"/>
  <rect x="66" y="132.08" width="34" height="23.92" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="83" y="172" text-anchor="middle" class="sm dim">braking</text>
  <text x="83" y="126.08" text-anchor="middle" class="sm">+0.52</text>
  <rect x="128" y="132.54" width="34" height="23.46" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="145" y="172" text-anchor="middle" class="sm dim">cornering</text>
  <text x="145" y="126.54" text-anchor="middle" class="sm">+0.51</text>
  <rect x="190" y="133.46" width="34" height="22.54" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="207" y="172" text-anchor="middle" class="sm dim">night</text>
  <text x="207" y="127.46" text-anchor="middle" class="sm">+0.49</text>
  <rect x="252" y="133.92" width="34" height="22.08" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="269" y="172" text-anchor="middle" class="sm dim">mileage</text>
  <text x="269" y="127.92" text-anchor="middle" class="sm">+0.48</text>
  <text x="180" y="230" text-anchor="middle" class="sm bold" fill="#7c3aed">φ₂ — a contrast</text>
  <line x1="52" y1="288" x2="316" y2="288" class="axis"/>
  <rect x="66" y="259.94" width="34" height="28.06" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
  <text x="83" y="304" text-anchor="middle" class="sm dim">braking</text>
  <text x="83" y="253.94" text-anchor="middle" class="sm">+0.61</text>
  <rect x="128" y="262.7" width="34" height="25.3" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
  <text x="145" y="304" text-anchor="middle" class="sm dim">cornering</text>
  <text x="145" y="256.7" text-anchor="middle" class="sm">+0.55</text>
  <rect x="190" y="288" width="34" height="19.32" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
  <text x="207" y="280" text-anchor="middle" class="sm dim">night</text>
  <text x="207" y="321.32" text-anchor="middle" class="sm">-0.42</text>
  <rect x="252" y="288" width="34" height="17.94" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
  <text x="269" y="280" text-anchor="middle" class="sm dim">mileage</text>
  <text x="269" y="319.94" text-anchor="middle" class="sm">-0.39</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">sign is arbitrary — φ and −φ are one component</text>
</svg>
