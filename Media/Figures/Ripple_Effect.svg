<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A waterfall turning a $50M catastrophe into $85M: an $8M reinstatement premium, a $15M dearer renewal and $12M of business lost stacked on the direct loss</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="41.4" y="211.18" width="37.2" height="138.82" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="60" y="203.18" text-anchor="middle" class="sm">50</text>
    <text x="60" y="365" text-anchor="middle" class="sm dim">cat</text>
    <rect x="101.4" y="188.96" width="37.2" height="22.21" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="120" y="180.96" text-anchor="middle" class="sm">8</text>
    <text x="120" y="365" text-anchor="middle" class="sm dim">reinstate</text>
    <rect x="161.4" y="147.32" width="37.2" height="41.65" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="180" y="139.32" text-anchor="middle" class="sm">15</text>
    <text x="180" y="365" text-anchor="middle" class="sm dim">renewal</text>
    <rect x="221.4" y="114" width="37.2" height="33.32" rx="3" fill="#7c3aed" fill-opacity="0.72"/>
    <text x="240" y="106" text-anchor="middle" class="sm">12</text>
    <text x="240" y="365" text-anchor="middle" class="sm dim">lost</text>
    <rect x="281.4" y="114" width="37.2" height="236" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="300" y="106" text-anchor="middle" class="sm">85</text>
    <text x="300" y="365" text-anchor="middle" class="sm dim">total</text>
    <line x1="24" y1="350" x2="336" y2="350" class="axis"/>
  </g>
</svg>
