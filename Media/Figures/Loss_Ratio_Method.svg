<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The loss ratio method comparing the projected ratio with the permissible loss ratio</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="180" y="116" text-anchor="middle" class="sm dim">projected loss &amp; LAE ratio plus fixed expense</text>
    <rect x="46" y="140" width="231.82" height="34" rx="4" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="277.82" y="140" width="16.08" height="34" rx="4" fill="#0d9488" fill-opacity="0.55"/>
    <text x="161.91" y="163" text-anchor="middle" class="sm">69.2%</text>
    <text x="285.86" y="190" text-anchor="middle" class="sm dim">+4.8%</text>
    <rect x="46" y="232" width="231.15" height="34" rx="4" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <text x="161.57" y="255" text-anchor="middle" class="sm">PLR 69.0%</text>
    <text x="180" y="218" text-anchor="middle" class="sm dim">against what the premium makes available</text>
    <text x="180" y="300" text-anchor="middle" class="bold" fill="#059669">74.0 / 69.0 = 1.073 ⇒ +7.3%</text>
    <text x="180" y="344" text-anchor="middle" class="sm dim">works without exposure counts, but the</text>
    <text x="180" y="362" text-anchor="middle" class="sm dim">premium must be brought on level first</text>
  </g>
</svg>
