<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The indicated average rate against the current one</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">What the average rate has to become</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Change = Indicated Rate / Current − 1</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">557.97 / 520 − 1 = +7.3%</text>
  <text x="180" y="134" text-anchor="middle" class="sm dim">current</text>
  <rect x="62" y="148" width="208" height="34" rx="4" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="166" y="171" text-anchor="middle" class="sm">$520.00</text>
  <text x="180" y="208" text-anchor="middle" class="sm dim">indicated</text>
  <rect x="62" y="222" width="223.19" height="34" rx="4" fill="#059669" fill-opacity="0.34" stroke="#059669" stroke-width="1.2"/>
  <text x="173.59" y="245" text-anchor="middle" class="sm">$557.97</text>
  <rect x="270" y="222" width="15.19" height="34" rx="4" fill="#059669" fill-opacity="0.75"/>
  <line x1="331.19" y1="268" x2="281.19" y2="250" class="thin" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
  <text x="335.19" y="278" text-anchor="end" class="sm bold" fill="#059669">+$37.97 = +7.3%</text>
  <text x="180" y="330" text-anchor="middle" class="sm dim">the aggregate answer — classification work</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">distributes it but must not change it</text>
</svg>
