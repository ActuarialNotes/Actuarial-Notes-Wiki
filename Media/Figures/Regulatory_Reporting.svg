<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three linked regulatory deliverables and the range the opinion turns on</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Schedule P, the opinion, and the report</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">behind it</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Opinion: Low ≤ Carried Reserve ≤ High</text>
  <rect x="44" y="122" width="272" height="50" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="144" text-anchor="middle" class="sm bold">Schedule P</text>
  <text x="180" y="160" text-anchor="middle" class="sm dim">ten years of triangles, filed</text>
  <rect x="44" y="190" width="272" height="50" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="180" y="212" text-anchor="middle" class="sm bold">Statement of Actuarial Opinion</text>
  <text x="180" y="228" text-anchor="middle" class="sm dim">reasonable / deficient / redundant</text>
  <line x1="180" y1="174" x2="180" y2="188" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <rect x="44" y="258" width="272" height="50" rx="6" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="280" text-anchor="middle" class="sm bold">Actuarial Report</text>
  <text x="180" y="296" text-anchor="middle" class="sm dim">the work supporting the opinion</text>
  <line x1="180" y1="242" x2="180" y2="256" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <line x1="66" y1="348" x2="294" y2="348" class="axis"/>
  <rect x="111.6" y="339" width="141.36" height="18" rx="4" fill="#059669" fill-opacity="0.20" stroke="#059669" stroke-width="1.1"/>
  <text x="180" y="330" text-anchor="middle" class="sm dim">carried inside the range ⇒ reasonable</text>
  <text x="66" y="366" text-anchor="middle" class="sm dim">low</text>
  <text x="294" y="366" text-anchor="middle" class="sm dim">high</text>
</svg>
