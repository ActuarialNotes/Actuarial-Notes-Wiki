<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A mixed model drawn as a population line with one shifted line per group</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">One population line, one shifted line</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">per group</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">y = Xβ + Zb + ε</text>
  <line x1="121.55" y1="96" x2="121.55" y2="338" class="grid"/>
  <line x1="181.09" y1="96" x2="181.09" y2="338" class="grid"/>
  <line x1="240.64" y1="96" x2="240.64" y2="338" class="grid"/>
  <line x1="300.18" y1="96" x2="300.18" y2="338" class="grid"/>
  <line x1="62" y1="297.67" x2="324" y2="297.67" class="grid"/>
  <line x1="62" y1="217" x2="324" y2="217" class="grid"/>
  <line x1="62" y1="136.33" x2="324" y2="136.33" class="grid"/>
  <line x1="62" y1="338" x2="334" y2="338" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="338" x2="62" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="121.55" y1="338" x2="121.55" y2="342" class="tick"/>
  <text x="121.55" y="354" text-anchor="middle" class="sm dim">1</text>
  <line x1="181.09" y1="338" x2="181.09" y2="342" class="tick"/>
  <text x="181.09" y="354" text-anchor="middle" class="sm dim">2</text>
  <line x1="240.64" y1="338" x2="240.64" y2="342" class="tick"/>
  <text x="240.64" y="354" text-anchor="middle" class="sm dim">3</text>
  <line x1="300.18" y1="338" x2="300.18" y2="342" class="tick"/>
  <text x="300.18" y="354" text-anchor="middle" class="sm dim">4</text>
  <line x1="58" y1="297.67" x2="62" y2="297.67" class="tick"/>
  <text x="54" y="301.27" text-anchor="end" class="sm dim">0.7</text>
  <line x1="58" y1="217" x2="62" y2="217" class="tick"/>
  <text x="54" y="220.6" text-anchor="end" class="sm dim">1</text>
  <line x1="58" y1="136.33" x2="62" y2="136.33" class="tick"/>
  <text x="54" y="139.93" text-anchor="end" class="sm dim">1.3</text>
  <polyline points="97.73,282.61 318.05,222.92" class="curve" stroke="#3b82f6" stroke-width="1.5"/>
  <polyline points="97.73,242.28 318.05,182.58" class="curve" stroke="#d97706" stroke-width="1.5"/>
  <polyline points="97.73,207.32 318.05,147.63" class="curve" stroke="#059669" stroke-width="1.5"/>
  <polyline points="97.73,175.05 318.05,115.36" class="curve" stroke="#7c3aed" stroke-width="1.5"/>
  <polyline points="97.73,132.03 318.05,72.34" class="curve" stroke="#e11d48" stroke-width="1.5"/>
  <polyline points="97.73,212.7 318.05,153" class="curve" stroke="var(--ink)" stroke-width="2.8"/>
  <text x="318.05" y="145" text-anchor="end" class="sm bold">Xβ</text>
  <text x="180" y="370" text-anchor="middle" class="sm dim">development period</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">the heavy line is the fixed part; each thin</text>
  <text x="180" y="403" text-anchor="middle" class="sm dim">line is one group's random intercept</text>
</svg>
