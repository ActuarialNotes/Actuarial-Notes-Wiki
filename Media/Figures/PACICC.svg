<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The causes of Canadian insurer failure, in the order PACICC's own research puts them</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Pricing and reserves, not investments</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Canada's P&amp;C guaranty fund —</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">compulsory for every licensed member</text>
    <text x="180" y="100" text-anchor="middle" class="sm dim">why insurers fail, in order</text>
    <text x="40" y="138" text-anchor="start" class="sm">inadequate pricing</text>
    <rect x="170" y="124" width="146" height="18" rx="3" fill="#e11d48" fill-opacity="0.60"/>
    <text x="40" y="168" text-anchor="start" class="sm">deficient reserves</text>
    <rect x="170" y="154" width="131" height="18" rx="3" fill="#e11d48" fill-opacity="0.60"/>
    <text x="40" y="198" text-anchor="start" class="sm">rapid growth, new lines</text>
    <rect x="170" y="184" width="96" height="18" rx="3" fill="#d97706" fill-opacity="0.60"/>
    <text x="40" y="228" text-anchor="start" class="sm">reinsurance failure</text>
    <rect x="170" y="214" width="64" height="18" rx="3" fill="#d97706" fill-opacity="0.60"/>
    <text x="40" y="258" text-anchor="start" class="sm">catastrophe exposure</text>
    <rect x="170" y="244" width="50" height="18" rx="3" fill="#0d9488" fill-opacity="0.60"/>
    <text x="40" y="288" text-anchor="start" class="sm">investment losses</text>
    <rect x="170" y="274" width="29" height="18" rx="3" fill="#059669" fill-opacity="0.60"/>
    <text x="180" y="322" text-anchor="middle" class="sm dim">the last line is the one candidates expect first</text>
    <text x="180" y="350" text-anchor="middle" class="sm dim">second half of the mandate, often forgotten:</text>
    <text x="180" y="366" text-anchor="middle" class="sm dim">to minimise the cost of failure — which is why</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">PACICC argues for early OSFI intervention</text>
  </g>
</svg>
