  <text x="204.08" y="288.97" text-anchor="middle" class="sm bold" fill="#059669">δ = ln(1 + i)</text>
  <circle cx="72" cy="127.75" r="3.2" fill="#3b82f6"/>
  <circle cx="82.16" cy="225.48" r="3.2" fill="#3b82f6"/>
