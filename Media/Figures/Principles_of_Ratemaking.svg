<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four CAS ratemaking principles</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Four statements define an actuarially</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">sound rate</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Rate = E[Loss + LAE + Expense + Capital]</text>
  <circle cx="46" cy="132" r="13" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="46" y="136" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="66" y="128" text-anchor="start" class="sm">A rate is an estimate of the expected value</text>
  <text x="66" y="144" text-anchor="start" class="sm">of future costs</text>
  <circle cx="46" cy="198" r="13" fill="#0d9488" fill-opacity="0.22" stroke="#0d9488" stroke-width="1.2"/>
  <text x="46" y="202" text-anchor="middle" class="sm bold" fill="#0d9488">2</text>
  <text x="66" y="194" text-anchor="start" class="sm">A rate provides for all costs associated</text>
  <text x="66" y="210" text-anchor="start" class="sm">with the transfer of risk</text>
  <circle cx="46" cy="264" r="13" fill="#7c3aed" fill-opacity="0.22" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="46" y="268" text-anchor="middle" class="sm bold" fill="#7c3aed">3</text>
  <text x="66" y="260" text-anchor="start" class="sm">A rate provides for the costs associated</text>
  <text x="66" y="276" text-anchor="start" class="sm">with an individual risk transfer</text>
  <circle cx="46" cy="330" r="13" fill="#059669" fill-opacity="0.22" stroke="#059669" stroke-width="1.2"/>
  <text x="46" y="334" text-anchor="middle" class="sm bold" fill="#059669">4</text>
  <text x="66" y="326" text-anchor="start" class="sm">A rate is reasonable and not excessive,</text>
  <text x="66" y="342" text-anchor="start" class="sm">inadequate or unfairly discriminatory</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">only the fourth is a judgment; the first three are definitions</text>
</svg>
