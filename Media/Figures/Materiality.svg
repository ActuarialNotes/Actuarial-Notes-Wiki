<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The same $6M error laid against three of the running insurer's yardsticks, each drawn full width: under 1% of its $640M insurance contract liabilities, 2.4% of its $248M capital and 11% of its $54M pre-tax income</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="40" y="92" width="14" height="14" rx="2" fill="#e11d48" fill-opacity="0.85"/>
    <text x="62" y="104" text-anchor="start" class="sm bold">$6M error</text>
    <text x="40" y="141" text-anchor="start" class="sm bold">liabilities 640</text>
    <rect x="40" y="150" width="242" height="34" rx="4" fill="#3b82f6" fill-opacity="0.45"/>
    <rect x="279.73" y="150" width="2.27" height="34" rx="1" fill="#e11d48" fill-opacity="0.85"/>
    <text x="290" y="171" text-anchor="start" class="sm bold">0.9%</text>
    <text x="40" y="221" text-anchor="start" class="sm bold">capital 248</text>
    <rect x="40" y="230" width="242" height="34" rx="4" fill="#0d9488" fill-opacity="0.45"/>
    <rect x="276.15" y="230" width="5.85" height="34" rx="1" fill="#e11d48" fill-opacity="0.85"/>
    <text x="290" y="251" text-anchor="start" class="sm bold">2.4%</text>
    <text x="40" y="301" text-anchor="start" class="sm bold">pre-tax income 54</text>
    <rect x="40" y="310" width="242" height="34" rx="4" fill="#d97706" fill-opacity="0.45"/>
    <rect x="255.11" y="310" width="26.89" height="34" rx="1" fill="#e11d48" fill-opacity="0.85"/>
    <text x="290" y="331" text-anchor="start" class="sm bold">11%</text>
  </g>
</svg>
