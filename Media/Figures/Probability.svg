<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A disc cut into twelve equal slices, the equally likely outcomes, with five of them shaded as the event E</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <circle cx="180" cy="232" r="141.5" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
    <path d="M180.0,232 L180.00,92.00 A140,140 0 0 1 250.00,110.76 Z" fill="#3b82f6" fill-opacity="0.7" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L250.00,110.76 A140,140 0 0 1 301.24,162.00 Z" fill="#3b82f6" fill-opacity="0.7" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L301.24,162.00 A140,140 0 0 1 320.00,232.00 Z" fill="#3b82f6" fill-opacity="0.7" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L320.00,232.00 A140,140 0 0 1 301.24,302.00 Z" fill="#3b82f6" fill-opacity="0.7" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L301.24,302.00 A140,140 0 0 1 250.00,353.24 Z" fill="#3b82f6" fill-opacity="0.7" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L250.00,353.24 A140,140 0 0 1 180.00,372.00 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L180.00,372.00 A140,140 0 0 1 110.00,353.24 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L110.00,353.24 A140,140 0 0 1 58.76,302.00 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L58.76,302.00 A140,140 0 0 1 40.00,232.00 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L40.00,232.00 A140,140 0 0 1 58.76,162.00 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L58.76,162.00 A140,140 0 0 1 110.00,110.76 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M180.0,232 L110.00,110.76 A140,140 0 0 1 180.00,92.00 Z" fill="var(--soft)" fill-opacity="1" stroke="var(--surf)" stroke-width="3" stroke-linejoin="round"/>
    <text x="258.43" y="217.98" text-anchor="middle" class="bold">E</text>
    <text x="68" y="120" text-anchor="middle" class="sm dim">S</text>
  </g>
</svg>
