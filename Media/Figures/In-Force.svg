<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A dashed valuation date cutting through five policies, the three it crosses highlighted as in force</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="48" y1="100" x2="48" y2="350" class="grid"/>
    <line x1="138" y1="100" x2="138" y2="350" class="grid"/>
    <line x1="228" y1="100" x2="228" y2="350" class="grid"/>
    <line x1="318" y1="100" x2="318" y2="350" class="grid"/>
    <line x1="40" y1="350" x2="334" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <text x="93" y="366" text-anchor="middle" class="sm dim">2023</text>
    <text x="183" y="366" text-anchor="middle" class="sm dim">2024</text>
    <text x="273" y="366" text-anchor="middle" class="sm dim">2025</text>
    <rect x="61.5" y="121" width="90" height="14" rx="3" fill="var(--axis)" fill-opacity="0.3" stroke="var(--axis)" stroke-width="1.1"/>
    <rect x="102" y="167" width="90" height="14" rx="3" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="142.5" y="213" width="90" height="14" rx="3" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="174" y="259" width="90" height="14" rx="3" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="205.5" y="305" width="90" height="14" rx="3" fill="var(--axis)" fill-opacity="0.3" stroke="var(--axis)" stroke-width="1.1"/>
    <line x1="183" y1="98" x2="183" y2="350" class="thin dash" stroke="#e11d48" stroke-width="1.6"/>
    <circle cx="183" cy="174" r="4.8" fill="#e11d48"/>
    <circle cx="183" cy="220" r="4.8" fill="#e11d48"/>
    <circle cx="183" cy="266" r="4.8" fill="#e11d48"/>
    <text x="183" y="88" text-anchor="middle" class="sm bold">valuation date</text>
  </g>
</svg>
