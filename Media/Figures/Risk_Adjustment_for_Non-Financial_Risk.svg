    <text x="220" y="126.76" text-anchor="middle" class="sm bold" fill="#7c3aed">75th</text>
    <path d="M152.4,250 v4.8 H181.2 q5,0 5,4.4 q0,-4.4 5,-4.4 H220 v-4.8" class="thin" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="186.2" y="269" text-anchor="middle" class="sm dim">the RA is the gap between them</text>
    <line x1="30" y1="282" x2="330" y2="282" class="rule"/>
    <text x="38" y="304" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="304" text-anchor="start" class="sm">higher for low-frequency, high-severity risk</text>
    <text x="38" y="328" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="328" text-anchor="start" class="sm">higher for long duration and wide uncertainty</text>
    <text x="38" y="352" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="352" text-anchor="start" class="sm">released as the risk expires, so slowly on</text>
    <text x="38" y="376" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="54" y="376" text-anchor="start" class="sm">a long-tail line</text>
