<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>One timeline carrying the annuity family: short due payments at the start of each period, tall immediate ones at the end, and a perpetuity's carrying on past n</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="38" y1="320" x2="324" y2="320" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="46" y1="316" x2="46" y2="324" class="tick"/>
    <text x="46" y="337" text-anchor="middle" class="sm dim">0</text>
    <line x1="89.33" y1="316" x2="89.33" y2="324" class="tick"/>
    <text x="89.33" y="337" text-anchor="middle" class="sm dim">1</text>
    <line x1="132.67" y1="316" x2="132.67" y2="324" class="tick"/>
    <text x="132.67" y="337" text-anchor="middle" class="sm dim">2</text>
    <line x1="176" y1="316" x2="176" y2="324" class="tick"/>
    <text x="176" y="337" text-anchor="middle" class="sm dim">3</text>
    <line x1="219.33" y1="316" x2="219.33" y2="324" class="tick"/>
    <text x="219.33" y="337" text-anchor="middle" class="sm dim">n</text>
    <line x1="262.67" y1="316" x2="262.67" y2="324" class="tick"/>
    <line x1="306" y1="316" x2="306" y2="324" class="tick"/>
    <line x1="41" y1="320" x2="41" y2="190" class="thin" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ah7c3aed)"/>
    <line x1="84.33" y1="320" x2="84.33" y2="190" class="thin" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ah7c3aed)"/>
    <line x1="127.67" y1="320" x2="127.67" y2="190" class="thin" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ah7c3aed)"/>
    <line x1="171" y1="320" x2="171" y2="190" class="thin" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ah7c3aed)"/>
    <line x1="94.33" y1="320" x2="94.33" y2="124" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="137.67" y1="320" x2="137.67" y2="124" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="181" y1="320" x2="181" y2="124" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <line x1="224.33" y1="320" x2="224.33" y2="124" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <g opacity="0.55">
    <line x1="267.67" y1="320" x2="267.67" y2="124" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    </g>
    <g opacity="0.25">
    <line x1="311" y1="320" x2="311" y2="124" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    </g>
    <text x="324" y="222" text-anchor="start" class="bold">…</text>
    <text x="41" y="178" text-anchor="middle" class="sm bold">due</text>
    <text x="224.33" y="112" text-anchor="middle" class="sm bold">immediate</text>
    <text x="289.33" y="94" text-anchor="middle" class="sm bold">perpetuity</text>
  </g>
</svg>
