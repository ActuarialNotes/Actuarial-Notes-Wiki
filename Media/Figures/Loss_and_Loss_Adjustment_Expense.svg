<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The claim dollar split into indemnity, ALAE and ULAE</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Claims cost more than the indemnity paid</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Loss &amp; LAE = Loss + ALAE + ULAE</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Ratio = (Loss + LAE) / Earned Premium</text>
  <text x="180" y="106" text-anchor="middle" class="sm dim">the $360 pure premium, by component</text>
  <rect x="60" y="128" width="78" height="175" rx="4" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="142" y1="215.5" x2="148" y2="211.5" class="thin" stroke="#3b82f6" stroke-width="1"/>
  <text x="152" y="215.5" text-anchor="start" class="sm bold">Indemnity  $300</text>
  <text x="152" y="230.5" text-anchor="start" class="sm dim">paid to the claimant</text>
  <rect x="60" y="303" width="78" height="21" rx="4" fill="#0d9488" fill-opacity="0.32" stroke="#0d9488" stroke-width="1.2"/>
  <line x1="142" y1="313.5" x2="148" y2="309.5" class="thin" stroke="#0d9488" stroke-width="1"/>
  <text x="152" y="313.5" text-anchor="start" class="sm bold">ALAE  $36</text>
  <text x="152" y="328.5" text-anchor="start" class="sm dim">traceable to one claim</text>
  <rect x="60" y="324" width="78" height="14" rx="4" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.2"/>
  <line x1="142" y1="331" x2="148" y2="351.5" class="thin" stroke="#d97706" stroke-width="1"/>
  <text x="152" y="355.5" text-anchor="start" class="sm bold">ULAE  $24</text>
  <text x="152" y="370.5" text-anchor="start" class="sm dim">claims-department overhead</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">ALAE follows the claim, ULAE the department</text>
</svg>
