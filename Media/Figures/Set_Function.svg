<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three sets A, B and C inside S, each sent by an arrow to its own point on the real line</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="30" y="80" width="180" height="300" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <text x="43" y="96" text-anchor="middle" class="sm dim">S</text>
    <ellipse cx="120" cy="138" rx="62" ry="30" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="120" y="143" text-anchor="middle" class="bold">A</text>
    <ellipse cx="120" cy="230" rx="62" ry="30" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.4"/>
    <text x="120" y="235" text-anchor="middle" class="bold">B</text>
    <ellipse cx="120" cy="322" rx="62" ry="30" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.4"/>
    <text x="120" y="327" text-anchor="middle" class="bold">C</text>
    <text x="196" y="96" text-anchor="end" class="sm dim">𝓕</text>
    <line x1="268" y1="378" x2="268" y2="82" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <text x="260" y="80" text-anchor="end" class="sm dim">ℝ</text>
    <line x1="186" y1="138" x2="258" y2="150.4" class="thin dash" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#ah3b82f6)"/>
    <line x1="264" y1="150.4" x2="272" y2="150.4" class="tick"/>
    <circle cx="268" cy="150.4" r="4.5" fill="#3b82f6"/>
    <text x="280" y="154.4" text-anchor="start" class="sm">f(A)</text>
    <line x1="186" y1="230" x2="258" y2="237.44" class="thin dash" stroke="#d97706" stroke-width="1.2" marker-end="url(#ahd97706)"/>
    <line x1="264" y1="237.44" x2="272" y2="237.44" class="tick"/>
    <circle cx="268" cy="237.44" r="4.5" fill="#d97706"/>
    <text x="280" y="241.44" text-anchor="start" class="sm">f(B)</text>
    <line x1="186" y1="322" x2="258" y2="319.04" class="thin dash" stroke="#059669" stroke-width="1.2" marker-end="url(#ah059669)"/>
    <line x1="264" y1="319.04" x2="272" y2="319.04" class="tick"/>
    <circle cx="268" cy="319.04" r="4.5" fill="#059669"/>
    <text x="280" y="323.04" text-anchor="start" class="sm">f(C)</text>
  </g>
</svg>
