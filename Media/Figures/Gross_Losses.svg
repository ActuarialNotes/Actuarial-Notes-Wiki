<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>AY 2024's 2,850 gross ultimate as one column, stacked from the net the insurer keeps and the ceded, salvage and subrogation and deductible shares that come off it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="110" y="120" width="82" height="135.58" rx="4" fill="#3b82f6" fill-opacity="0.36" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="206" y="191.79" text-anchor="start" class="sm">net 1,610</text>
    <rect x="110" y="255.58" width="82" height="53.89" rx="4" fill="#d97706" fill-opacity="0.36" stroke="#d97706" stroke-width="1.2"/>
    <text x="206" y="286.53" text-anchor="start" class="sm">ceded 640</text>
    <rect x="110" y="309.47" width="82" height="21.05" rx="4" fill="#059669" fill-opacity="0.36" stroke="#059669" stroke-width="1.2"/>
    <text x="206" y="324" text-anchor="start" class="sm">S&amp;S 250</text>
    <rect x="110" y="330.53" width="82" height="29.47" rx="4" fill="#e11d48" fill-opacity="0.36" stroke="#e11d48" stroke-width="1.2"/>
    <text x="206" y="349.26" text-anchor="start" class="sm">deductible 350</text>
    <path d="M106,120 H98 V360 H106" class="thin" stroke="var(--ink)" stroke-width="1.4"/>
    <text x="92" y="244" text-anchor="end" class="sm bold">gross 2,850</text>
  </g>
</svg>
