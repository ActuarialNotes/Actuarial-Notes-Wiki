<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>$250,000 of damages owed from the accident as a block, with a red wedge of interest growing on top of it to $68,750 by judgment five and a half years later</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="42" y1="350" x2="334" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="42" y1="350" x2="42" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="42" y1="350" x2="42" y2="354" class="tick"/>
    <text x="42" y="366" text-anchor="middle" class="sm dim">0</text>
    <line x1="87.48" y1="350" x2="87.48" y2="354" class="tick"/>
    <text x="87.48" y="366" text-anchor="middle" class="sm dim">1</text>
    <line x1="132.97" y1="350" x2="132.97" y2="354" class="tick"/>
    <text x="132.97" y="366" text-anchor="middle" class="sm dim">2</text>
    <line x1="178.45" y1="350" x2="178.45" y2="354" class="tick"/>
    <text x="178.45" y="366" text-anchor="middle" class="sm dim">3</text>
    <line x1="223.94" y1="350" x2="223.94" y2="354" class="tick"/>
    <text x="223.94" y="366" text-anchor="middle" class="sm dim">4</text>
    <line x1="292.16" y1="350" x2="292.16" y2="354" class="tick"/>
    <text x="292.16" y="366" text-anchor="middle" class="sm dim">5.5</text>
    <text x="324" y="382" text-anchor="end" class="sm dim">years</text>
    <polygon points="42,350 42,169.44 292.16,169.44 292.16,350" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.3"/>
    <polygon points="42,169.44 292.16,119.79 292.16,169.44" fill="#e11d48" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.3"/>
    <text x="167.08" y="259.72" text-anchor="middle" class="bold">$250,000</text>
    <text x="242.13" y="153.58" text-anchor="middle" class="bold">$68,750</text>
  </g>
</svg>
