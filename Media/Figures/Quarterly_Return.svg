<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Three quarterly filings between annual returns, and what a regulator would otherwise miss</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Eleven months is too long to wait</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">A reduced annual return: statements,</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">the MCT, and the key exhibits</text>
    <line x1="68" y1="230" x2="322" y2="230" class="grid"/>
    <line x1="68" y1="139.33" x2="322" y2="139.33" class="grid"/>
    <line x1="68" y1="230" x2="332" y2="230" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="230" x2="68" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="230" x2="68" y2="230" class="tick"/>
    <text x="60" y="233.6" text-anchor="end" class="sm dim">100%</text>
    <line x1="64" y1="139.33" x2="68" y2="139.33" class="tick"/>
    <text x="60" y="142.93" text-anchor="end" class="sm dim">150%</text>
    <polyline points="93.4,106.69 144.2,121.2 195,141.15 245.8,170.16 296.6,197.36" class="curve" stroke="#e11d48" stroke-width="2.4"/>
    <circle cx="93.4" cy="106.69" r="3.6" fill="#e11d48"/>
    <circle cx="144.2" cy="121.2" r="3.6" fill="#e11d48"/>
    <circle cx="195" cy="141.15" r="3.6" fill="#e11d48"/>
    <circle cx="245.8" cy="170.16" r="3.6" fill="#e11d48"/>
    <circle cx="296.6" cy="197.36" r="3.6" fill="#e11d48"/>
    <text x="93.4" y="96.69" text-anchor="middle" class="sm dim">annual</text>
    <text x="296.6" y="213.36" text-anchor="middle" class="sm dim">annual</text>
    <line x1="68" y1="139.33" x2="322" y2="139.33" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
    <text x="189.92" y="130.27" text-anchor="middle" class="sm" fill="#d97706">supervisory target</text>
    <text x="180" y="252" text-anchor="middle" class="sm dim">quarters</text>
    <text x="180" y="276" text-anchor="middle" class="sm dim">without the three points between, this insurer</text>
    <text x="180" y="292" text-anchor="middle" class="sm dim">looks fine until it does not</text>
    <line x1="30" y1="310" x2="330" y2="310" class="rule"/>
    <text x="180" y="332" text-anchor="middle" class="sm dim">the liabilities are still estimated each quarter,</text>
    <text x="180" y="348" text-anchor="middle" class="sm dim">usually rolled forward — which is exactly what</text>
    <text x="180" y="364" text-anchor="middle" class="sm dim">will not catch a deterioration in the emergence</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">read the sequence, not any one ratio</text>
  </g>
</svg>
