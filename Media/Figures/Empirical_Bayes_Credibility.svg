  <circle cx="281.39" cy="222.64" r="2.8" fill="#e11d48"/>
  <circle cx="286.81" cy="232.57" r="2.8" fill="#e11d48"/>
  <circle cx="292.23" cy="215.39" r="2.8" fill="#e11d48"/>
  <circle cx="297.65" cy="203.64" r="2.8" fill="#e11d48"/>
  <line x1="278.68" y1="231.33" x2="300.36" y2="231.33" class="thin" stroke="#e11d48" stroke-width="2.2"/>
  <line x1="58" y1="203.1" x2="324" y2="203.1" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="326" y="206.7" text-anchor="start" class="sm dim">X̄</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">within-risk scatter ⇒ v̂</text>
  <text x="180" y="369" text-anchor="middle" class="sm dim">spread of the bars, less v̂/n ⇒ â</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">â &lt; 0 is set to 0, giving Z = 0</text>
</svg>
