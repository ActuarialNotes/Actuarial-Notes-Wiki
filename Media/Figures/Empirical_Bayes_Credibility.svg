  <circle cx="133.61" cy="197.66" r="2.8" fill="#d97706"/>
  <circle cx="139.03" cy="175.36" r="2.8" fill="#d97706"/>
  <circle cx="144.45" cy="177.67" r="2.8" fill="#d97706"/>
  <circle cx="149.87" cy="122.16" r="2.8" fill="#d97706"/>
