<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Commission and taxes rising in proportion to premium</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A constant share of whatever the premium</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">is</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">V = Variable Expenses / Premium = 26%</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Rate = (Pure Premium + F) / (1 − V − Q)</text>
  <line x1="74" y1="100" x2="74" y2="328" class="grid"/>
  <line x1="184.91" y1="100" x2="184.91" y2="328" class="grid"/>
  <line x1="295.82" y1="100" x2="295.82" y2="328" class="grid"/>
  <line x1="74" y1="328" x2="318" y2="328" class="grid"/>
  <line x1="74" y1="217.68" x2="318" y2="217.68" class="grid"/>
  <line x1="74" y1="107.35" x2="318" y2="107.35" class="grid"/>
  <line x1="74" y1="328" x2="328" y2="328" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="328" x2="74" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="328" x2="74" y2="332" class="tick"/>
  <text x="74" y="344" text-anchor="middle" class="sm dim">0</text>
  <line x1="184.91" y1="328" x2="184.91" y2="332" class="tick"/>
  <text x="184.91" y="344" text-anchor="middle" class="sm dim">1,000</text>
  <line x1="295.82" y1="328" x2="295.82" y2="332" class="tick"/>
  <text x="295.82" y="344" text-anchor="middle" class="sm dim">2,000</text>
  <line x1="70" y1="328" x2="74" y2="328" class="tick"/>
  <text x="66" y="331.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="217.68" x2="74" y2="217.68" class="tick"/>
  <text x="66" y="221.28" text-anchor="end" class="sm dim">300</text>
  <line x1="70" y1="107.35" x2="74" y2="107.35" class="tick"/>
  <text x="66" y="110.95" text-anchor="end" class="sm dim">600</text>
