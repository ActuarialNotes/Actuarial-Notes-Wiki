<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An arithmetic payment stream decomposed into level and increasing parts</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Level P plus a pure increase of Q</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PV = P · a₍ₙ₎ + (Q/i)( a₍ₙ₎ − n vⁿ )</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">a negative Q gives a decreasing annuity</text>
  <line x1="48" y1="344" x2="318" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="56" y1="340" x2="56" y2="348" class="tick"/>
  <text x="56" y="361" text-anchor="middle" class="sm dim">0</text>
  <line x1="96.67" y1="340" x2="96.67" y2="348" class="tick"/>
  <text x="96.67" y="361" text-anchor="middle" class="sm dim">1</text>
  <line x1="137.33" y1="340" x2="137.33" y2="348" class="tick"/>
  <text x="137.33" y="361" text-anchor="middle" class="sm dim">2</text>
  <line x1="178" y1="340" x2="178" y2="348" class="tick"/>
  <text x="178" y="361" text-anchor="middle" class="sm dim">3</text>
  <line x1="218.67" y1="340" x2="218.67" y2="348" class="tick"/>
  <text x="218.67" y="361" text-anchor="middle" class="sm dim">4</text>
  <line x1="259.33" y1="340" x2="259.33" y2="348" class="tick"/>
  <text x="259.33" y="361" text-anchor="middle" class="sm dim">5</text>
  <line x1="300" y1="340" x2="300" y2="348" class="tick"/>
  <text x="300" y="361" text-anchor="middle" class="sm dim">6</text>
  <rect x="84.67" y="313.14" width="24" height="30.86" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="96.67" y="305.14" text-anchor="middle" class="sm">100</text>
  <rect x="125.33" y="313.14" width="24" height="30.86" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="125.33" y="297.71" width="24" height="15.43" rx="2" fill="#d97706" fill-opacity="0.6"/>
  <text x="137.33" y="289.71" text-anchor="middle" class="sm">150</text>
  <rect x="166" y="313.14" width="24" height="30.86" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="166" y="282.29" width="24" height="30.86" rx="2" fill="#d97706" fill-opacity="0.6"/>
  <text x="178" y="274.29" text-anchor="middle" class="sm">200</text>
  <rect x="206.67" y="313.14" width="24" height="30.86" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="206.67" y="266.86" width="24" height="46.29" rx="2" fill="#d97706" fill-opacity="0.6"/>
  <text x="218.67" y="258.86" text-anchor="middle" class="sm">250</text>
  <rect x="247.33" y="313.14" width="24" height="30.86" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="247.33" y="251.43" width="24" height="61.71" rx="2" fill="#d97706" fill-opacity="0.6"/>
  <text x="259.33" y="243.43" text-anchor="middle" class="sm">300</text>
  <rect x="288" y="313.14" width="24" height="30.86" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="288" y="236" width="24" height="77.14" rx="2" fill="#d97706" fill-opacity="0.6"/>
  <text x="300" y="228" text-anchor="middle" class="sm">350</text>
  <line x1="58" y1="94" x2="71" y2="94" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="77" y="97.6" text-anchor="start" class="sm">P = 100</text>
  <line x1="58" y1="110" x2="71" y2="110" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="77" y="113.6" text-anchor="start" class="sm">+ Q = 50 each period</text>
</svg>
