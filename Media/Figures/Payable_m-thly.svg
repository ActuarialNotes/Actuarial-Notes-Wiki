<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An annual payment of 1 split into m sub-period payments</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The same 1 per year, paid in m pieces</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">a⁽ᵐ⁾₍ₙ₎ = (1 − vⁿ) / i⁽ᵐ⁾</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">a⁽ᵐ⁾₍ₙ₎ &gt; a₍ₙ₎ — the money arrives earlier</text>
  <text x="180" y="90" text-anchor="middle" class="bold" fill="var(--dim)">m = 1</text>
  <line x1="54" y1="156" x2="318" y2="156" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="152" x2="62" y2="160" class="tick"/>
  <text x="62" y="172" text-anchor="middle" class="sm dim">0</text>
  <line x1="121.5" y1="152" x2="121.5" y2="160" class="tick"/>
  <text x="121.5" y="172" text-anchor="middle" class="sm dim">1</text>
  <line x1="181" y1="152" x2="181" y2="160" class="tick"/>
  <text x="181" y="172" text-anchor="middle" class="sm dim">2</text>
  <line x1="240.5" y1="152" x2="240.5" y2="160" class="tick"/>
  <text x="240.5" y="172" text-anchor="middle" class="sm dim">3</text>
  <line x1="300" y1="152" x2="300" y2="160" class="tick"/>
  <text x="300" y="172" text-anchor="middle" class="sm dim">4</text>
  <line x1="121.5" y1="156" x2="121.5" y2="122" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="121.5" y="116" text-anchor="middle" class="sm">1</text>
  <line x1="181" y1="156" x2="181" y2="122" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="181" y="116" text-anchor="middle" class="sm">1</text>
  <line x1="240.5" y1="156" x2="240.5" y2="122" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="240.5" y="116" text-anchor="middle" class="sm">1</text>
  <line x1="300" y1="156" x2="300" y2="122" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="300" y="116" text-anchor="middle" class="sm">1</text>
  <text x="180" y="198" text-anchor="middle" class="sm dim">1 per year</text>
  <text x="180" y="212" text-anchor="middle" class="bold" fill="#3b82f6">m = 4</text>
  <line x1="54" y1="278" x2="318" y2="278" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="274" x2="62" y2="282" class="tick"/>
  <text x="62" y="294" text-anchor="middle" class="sm dim">0</text>
  <line x1="121.5" y1="274" x2="121.5" y2="282" class="tick"/>
  <text x="121.5" y="294" text-anchor="middle" class="sm dim">1</text>
  <line x1="181" y1="274" x2="181" y2="282" class="tick"/>
  <text x="181" y="294" text-anchor="middle" class="sm dim">2</text>
  <line x1="240.5" y1="274" x2="240.5" y2="282" class="tick"/>
  <text x="240.5" y="294" text-anchor="middle" class="sm dim">3</text>
  <line x1="300" y1="274" x2="300" y2="282" class="tick"/>
  <text x="300" y="294" text-anchor="middle" class="sm dim">4</text>
  <line x1="76.88" y1="278" x2="76.88" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="91.75" y1="278" x2="91.75" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="106.62" y1="278" x2="106.62" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="121.5" y1="278" x2="121.5" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="136.38" y1="278" x2="136.38" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="151.25" y1="278" x2="151.25" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="166.12" y1="278" x2="166.12" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="181" y1="278" x2="181" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="195.88" y1="278" x2="195.88" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="210.75" y1="278" x2="210.75" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="225.62" y1="278" x2="225.62" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="240.5" y1="278" x2="240.5" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="255.38" y1="278" x2="255.38" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="270.25" y1="278" x2="270.25" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="285.12" y1="278" x2="285.12" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="300" y1="278" x2="300" y2="254" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="180" y="320" text-anchor="middle" class="sm dim">¼ each quarter</text>
</svg>
