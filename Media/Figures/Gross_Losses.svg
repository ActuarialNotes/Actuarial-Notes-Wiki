<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Gross losses as the base from which net and ceded figures are derived</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Before any cession or recovery</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Gross = Net + Ceded + Other Recoveries</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Gross Ultimate = Gross Reported × CDF_gross</text>
  <text x="180" y="118" text-anchor="middle" class="sm dim">AY 2024 ultimate ($000)</text>
  <rect x="100" y="146" width="82" height="110.72" rx="4" fill="#3b82f6" fill-opacity="0.36" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="196" y="205.36" text-anchor="start" class="sm">net 1,610</text>
  <rect x="100" y="256.72" width="82" height="44.01" rx="4" fill="#d97706" fill-opacity="0.36" stroke="#d97706" stroke-width="1.2"/>
  <text x="196" y="282.73" text-anchor="start" class="sm">ceded 640</text>
  <rect x="100" y="300.74" width="82" height="17.19" rx="4" fill="#059669" fill-opacity="0.36" stroke="#059669" stroke-width="1.2"/>
  <text x="196" y="313.33" text-anchor="start" class="sm">S&amp;S 250</text>
  <rect x="100" y="317.93" width="82" height="24.07" rx="4" fill="#e11d48" fill-opacity="0.36" stroke="#e11d48" stroke-width="1.2"/>
  <text x="196" y="333.96" text-anchor="start" class="sm">deductible 350</text>
  <text x="86" y="244" text-anchor="end" class="sm bold">gross</text>
  <text x="86" y="260" text-anchor="end" class="sm bold">2,850</text>
  <line x1="94" y1="146" x2="94" y2="342" class="thin" stroke="var(--dim)" stroke-width="1.4"/>
  <text x="180" y="390" text-anchor="middle" class="sm dim">reserve here first — every other view is a subtraction</text>
</svg>
