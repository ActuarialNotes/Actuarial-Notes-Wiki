  <text x="159" y="264" text-anchor="middle" class="sm dim">μₓ</text>
  <text x="66" y="165" text-anchor="end" class="sm dim">μ_Y</text>
  <text x="159" y="286" text-anchor="middle" class="sm dim">Cov &gt; 0: the + quadrants dominate</text>
  <text x="404" y="92" text-anchor="middle" class="sm bold">Cov(X, Y) = E[(X − μₓ)(Y − μ_Y)]</text>
  <text x="404" y="112" text-anchor="middle" class="sm dim">= E[XY] − E[X] E[Y]</text>
  <line x1="296" y1="130" x2="296" y2="158" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="306" y="141" text-anchor="start" class="sm bold">Sign, not strength</text>
  <text x="306" y="156" text-anchor="start" class="sm dim">the units make the size unreadable</text>
  <line x1="296" y1="172" x2="296" y2="200" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="306" y="183" text-anchor="start" class="sm bold">Independent ⇒ Cov = 0</text>
  <text x="306" y="198" text-anchor="start" class="sm dim">the converse is not true</text>
  <line x1="296" y1="214" x2="296" y2="242" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="306" y="225" text-anchor="start" class="sm bold">Cov(X, X) = Var(X)</text>
  <text x="306" y="240" text-anchor="start" class="sm dim">variance is self-covariance</text>
  <line x1="296" y1="256" x2="296" y2="284" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="306" y="267" text-anchor="start" class="sm bold">Standardise it</text>
  <text x="306" y="282" text-anchor="start" class="sm dim">ρ = Cov / (σₓ σ_Y) lands in [−1, 1]</text>
</svg>
