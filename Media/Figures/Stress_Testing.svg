<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three kinds of test, from moving one variable to starting at failure and working back</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Severe but plausible — and it has to</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">change something</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Sensitivity → scenario → reverse</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">one variable, a coherent set, then failure</text>
    <rect x="30" y="100" width="300" height="48" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="121" text-anchor="middle" class="sm">Sensitivity</text>
    <text x="180" y="136" text-anchor="middle" class="sm dim">move one variable — +100 bp, +10% reserves</text>
    <rect x="30" y="162" width="300" height="48" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.3"/>
    <text x="180" y="183" text-anchor="middle" class="sm">Scenario</text>
    <text x="180" y="198" text-anchor="middle" class="sm dim">move a coherent set that could happen together</text>
    <line x1="180" y1="147" x2="180" y2="161" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="30" y="224" width="300" height="48" rx="6" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3"/>
    <text x="180" y="245" text-anchor="middle" class="sm">Reverse</text>
    <text x="180" y="260" text-anchor="middle" class="sm dim">start at non-viability and work backwards</text>
    <line x1="180" y1="209" x2="180" y2="223" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <line x1="30" y1="292" x2="330" y2="292" class="rule"/>
    <text x="180" y="314" text-anchor="middle" class="sm dim">too mild reveals nothing; too extreme is dismissed</text>
    <text x="180" y="340" text-anchor="middle" class="sm dim">model the ripples and the realistic management</text>
    <text x="180" y="356" text-anchor="middle" class="sm dim">actions — assuming neither gives the wrong answer</text>
    <text x="180" y="382" text-anchor="middle" class="sm dim">a test that changes no limit was not worth running</text>
  </g>
</svg>
