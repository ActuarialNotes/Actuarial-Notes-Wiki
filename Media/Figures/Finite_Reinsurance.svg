<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A finite contract's outcome band, narrow enough that the reinsurer's result barely moves</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The reinsurer's result barely moves — so</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">it is a loan</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Reinsurer's outcome ≈ fee</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">+ investment margin</text>
    <line x1="72" y1="191.33" x2="334" y2="191.33" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="240" x2="72" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <polygon points="72,188.9 72,181.6 74.1,181.6 76.2,181.6 78.3,181.6 80.4,181.6 82.5,181.6 84.6,181.6 86.7,181.6 88.8,181.6 90.9,181.6 93,181.6 95.1,181.6 97.2,181.6 99.3,181.6 101.4,181.6 103.5,181.6 105.6,181.6 107.7,181.6 109.8,181.6 111.9,181.6 114,181.6 116.1,181.6 118.2,181.6 120.3,181.6 122.4,181.6 124.5,181.6 126.6,181.6 128.7,181.6 130.8,181.6 132.9,181.6 135,181.6 137.1,181.6 139.2,181.6 141.3,181.6 143.4,181.6 145.5,181.6 147.6,181.6 149.7,181.6 151.8,181.6 153.9,181.6 156,181.6 158.1,181.6 160.2,181.6 162.3,181.6 164.4,181.6 166.5,181.6 168.6,181.6 170.7,181.6 172.8,181.6 174.9,181.6 177,181.6 179.1,181.6 181.2,181.6 183.3,181.6 185.4,181.6 187.5,181.6 189.6,181.6 191.7,181.6 193.8,181.6 195.9,181.6 198,181.6 200.1,181.6 202.2,181.6 204.3,181.6 206.4,181.6 208.5,181.6 210.6,181.6 212.7,181.6 214.8,181.6 216.9,181.6 219,181.6 221.1,181.6 223.2,181.6 225.3,181.6 227.4,181.6 229.5,181.6 231.6,181.6 233.7,181.6 235.8,181.6 237.9,181.6 240,181.6 242.1,181.6 244.2,181.6 246.3,181.6 248.4,181.6 250.5,181.6 252.6,181.6 254.7,181.6 256.8,181.6 258.9,181.6 261,181.6 263.1,181.6 265.2,181.6 267.3,181.6 269.4,181.6 271.5,181.6 273.6,181.6 275.7,181.6 277.8,181.6 279.9,181.6 282,181.6 284.1,181.6 286.2,181.6 288.3,181.6 290.4,181.6 292.5,181.6 294.6,181.6 296.7,181.6 298.8,181.6 300.9,181.6 303,181.6 305.1,181.6 307.2,181.6 309.3,181.6 311.4,181.6 313.5,181.6 315.6,181.6 317.7,181.6 319.8,181.6 321.9,181.6 324,181.6 324,188.9" fill="#0d9488" fill-opacity="0.25" stroke="none"/>
    <polyline points="72,185.25 324,185.25" class="curve" stroke="#0d9488" stroke-width="2.4"/>
    <polyline points="72,108.6 324,230.27" class="curve dash" stroke="#e11d48" stroke-width="2.2"/>
    <text x="238.32" y="162.13" text-anchor="middle" class="sm bold" fill="#e11d48">a real treaty</text>
    <text x="152.64" y="169.43" text-anchor="middle" class="sm bold" fill="#0d9488">finite</text>
    <text x="180" y="262" text-anchor="middle" class="sm dim">how bad the cedant's losses turn out</text>
    <text x="52" y="80" text-anchor="start" class="sm dim">reinsurer's result</text>
    <line x1="30" y1="266" x2="330" y2="266" class="rule"/>
    <text x="36" y="288" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="288" text-anchor="start" class="sm">a low aggregate limit relative to premium</text>
    <text x="36" y="313" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="313" text-anchor="start" class="sm">an experience account crediting the cedant</text>
    <text x="36" y="338" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="338" text-anchor="start" class="sm">retrospective premium, profit commission</text>
    <text x="36" y="363" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="363" text-anchor="start" class="sm">and — the classic vice — a side letter</text>
  </g>
</svg>
