<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A commutation replacing a stream of future recoveries with cash today, and handing the tail back</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah0d9488" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#0d9488"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Cash today, and the tail comes home</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Price ≈ PV(future recoveries)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">± who wants out more</text>
  <line x1="48" y1="150" x2="322" y2="150" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="150" x2="74" y2="136" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
  <line x1="118" y1="150" x2="118" y2="132" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
  <line x1="162" y1="150" x2="162" y2="128" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
  <line x1="206" y1="150" x2="206" y2="124" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
  <line x1="250" y1="150" x2="250" y2="120" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
  <line x1="294" y1="150" x2="294" y2="116" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
  <text x="180" y="104" text-anchor="middle" class="sm dim">recoveries the reinsurer would have paid</text>
  <text x="180" y="170" text-anchor="middle" class="sm dim">spread over decades</text>
  <line x1="180" y1="186" x2="180" y2="210" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <rect x="80" y="214" width="200" height="28" rx="14.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="232" text-anchor="middle" class="sm">one lump sum today</text>
  <line x1="30" y1="256" x2="330" y2="256" class="rule"/>
  <rect x="30" y="270" width="143" height="94" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="30" y="270" width="143" height="24" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="286" text-anchor="middle" class="sm bold" fill="#3b82f6">Cedant wants</text>
  <text x="101.5" y="314" text-anchor="middle" class="sm">credit risk gone</text>
  <text x="101.5" y="334" text-anchor="middle" class="sm">cash now</text>
  <text x="101.5" y="354" text-anchor="middle" class="sm">a closed file</text>
  <rect x="187" y="270" width="143" height="94" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="187" y="270" width="143" height="24" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="286" text-anchor="middle" class="sm bold" fill="#d97706">Reinsurer wants</text>
  <text x="258.5" y="314" text-anchor="middle" class="sm">capital released</text>
  <text x="258.5" y="334" text-anchor="middle" class="sm">the tail capped</text>
  <text x="258.5" y="354" text-anchor="middle" class="sm">out of the line</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">afterwards the cedant carries the whole tail again</text>
</svg>
