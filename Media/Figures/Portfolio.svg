<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Three holdings of 300k, 500k and 200k standing at their durations of 2.1, 6.4 and 14.2 on a beam, which balances on a fulcrum at the portfolio's 6.67</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="64.8" y="182" width="34" height="108" rx="3" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="81.8" y="174" text-anchor="middle" class="sm bold">300k</text>
    <rect x="142.2" y="110" width="34" height="180" rx="3" fill="#7c3aed" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="159.2" y="102" text-anchor="middle" class="sm bold">500k</text>
    <rect x="282.6" y="218" width="34" height="72" rx="3" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.3"/>
    <text x="299.6" y="210" text-anchor="middle" class="sm bold">200k</text>
    <line x1="44" y1="290" x2="323" y2="290" stroke="#d97706" stroke-width="2.4"/>
    <line x1="44" y1="290" x2="44" y2="294" class="tick"/>
    <text x="44" y="308" text-anchor="middle" class="sm dim">0</text>
    <line x1="134" y1="290" x2="134" y2="294" class="tick"/>
    <text x="134" y="308" text-anchor="middle" class="sm dim">5</text>
    <line x1="224" y1="290" x2="224" y2="294" class="tick"/>
    <text x="224" y="308" text-anchor="middle" class="sm dim">10</text>
    <line x1="314" y1="290" x2="314" y2="294" class="tick"/>
    <text x="314" y="308" text-anchor="middle" class="sm dim">15</text>
    <polygon points="164.06,292 151.06,314 177.06,314" fill="#d97706"/>
    <text x="164.06" y="330" text-anchor="middle" class="sm bold">6.67</text>
    <text x="323" y="330" text-anchor="end" class="sm dim">duration</text>
  </g>
</svg>
