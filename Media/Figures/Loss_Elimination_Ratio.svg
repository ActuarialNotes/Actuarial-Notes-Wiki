  <circle cx="110" cy="252.01" r="4" fill="#e11d48"/>
  <text x="118" y="246.01" text-anchor="start" class="sm bold" fill="#e11d48">d = 500 ⇒ 34%</text>
  <circle cx="152" cy="203.23" r="4" fill="#d97706"/>
  <text x="160" y="197.23" text-anchor="start" class="sm bold" fill="#d97706">1,000 ⇒ 57%</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">deductible</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">doubling the deductible does not double the</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">credit — small claims are eliminated first</text>
</svg>
