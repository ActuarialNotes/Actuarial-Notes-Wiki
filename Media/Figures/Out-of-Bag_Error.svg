  <text x="79" y="271.6" text-anchor="start" class="sm">in the bag</text>
  <line x1="184" y1="268" x2="197" y2="268" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>
  <text x="203" y="271.6" text-anchor="start" class="sm">out of bag</text>
  <text x="180" y="300" text-anchor="middle" class="sm dim">each row is predicted by the ~37% of trees</text>
  <text x="180" y="316" text-anchor="middle" class="sm dim">that never saw it — a free held-out set</text>
  <text x="180" y="348" text-anchor="middle" class="sm">B = 600 ⇒ ≈ 221 trees vote on each row</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">≈ LOOCV, at no extra fitting cost</text>
</svg>
