<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three components of a GLM: distribution, linear predictor, link</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Three parts: distribution, predictor,</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">link</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">g(μᵢ) = ηᵢ = β₀ + Σ βⱼxᵢⱼ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Yᵢ ~ exponential family, Var = φV(μ)</text>
  <rect x="32" y="92" width="296" height="60" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="116" text-anchor="middle" class="bold">η = β₀ + β₁x₁ + ⋯ + βₚxₚ</text>
  <text x="180" y="134" text-anchor="middle" class="sm dim">systematic component — linear in the parameters</text>
  <line x1="180" y1="154" x2="180" y2="182" class="thin" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#ahvardim)"/>
  <rect x="32" y="184" width="296" height="60" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="180" y="208" text-anchor="middle" class="bold">μ = g⁻¹(η)</text>
  <text x="180" y="226" text-anchor="middle" class="sm dim">link function — log keeps μ &gt; 0</text>
  <line x1="180" y1="246" x2="180" y2="274" class="thin" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#ahvardim)"/>
  <rect x="32" y="276" width="296" height="60" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="300" text-anchor="middle" class="bold">Y ~ Poisson, Gamma, binomial, …</text>
  <text x="180" y="318" text-anchor="middle" class="sm dim">random component — variance tied to the mean</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">ordinary regression is the case</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">Normal + identity link</text>
</svg>
