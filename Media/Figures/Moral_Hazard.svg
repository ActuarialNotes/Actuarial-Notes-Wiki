<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The three moral hazards of an insured loss — before it, after it, and at the provider's desk</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="34" y="100" width="292" height="48" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="121" text-anchor="middle" class="sm">Ex ante</text>
    <text x="180" y="136" text-anchor="middle" class="sm dim">the sprinkler never gets installed</text>
    <rect x="34" y="160" width="292" height="48" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.3"/>
    <text x="180" y="181" text-anchor="middle" class="sm">Ex post</text>
    <text x="180" y="196" text-anchor="middle" class="sm dim">treatment runs longer, repair runs richer</text>
    <rect x="34" y="220" width="292" height="48" rx="6" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3"/>
    <text x="180" y="241" text-anchor="middle" class="sm">Provider side</text>
    <text x="180" y="256" text-anchor="middle" class="sm dim">the bill answers to an insured payer</text>
    <text x="180" y="292" text-anchor="middle" class="sm dim">the last is usually the largest</text>
    <line x1="30" y1="312" x2="330" y2="312" class="rule"/>
    <text x="180" y="334" text-anchor="middle" class="sm dim">controls: deductible, coinsurance, experience</text>
    <text x="180" y="350" text-anchor="middle" class="sm dim">rating, claims management, benefit protocols</text>
    <text x="180" y="378" text-anchor="middle" class="sm dim">it is a rational response to incentives — not fraud</text>
  </g>
</svg>
