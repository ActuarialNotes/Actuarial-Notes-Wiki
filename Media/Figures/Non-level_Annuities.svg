<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Three non-level payment patterns on one timeline</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">When payments vary, discount each one</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PV = Σ C_t v^t</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">or decompose into level + increasing</text>
  <text x="180" y="70" text-anchor="middle" class="bold" fill="#d97706">Arithmetic</text>
  <line x1="68" y1="132" x2="318" y2="132" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="128" x2="76" y2="136" class="tick"/>
  <line x1="120.8" y1="128" x2="120.8" y2="136" class="tick"/>
  <text x="120.8" y="147" text-anchor="middle" class="sm dim">1</text>
  <line x1="165.6" y1="128" x2="165.6" y2="136" class="tick"/>
  <text x="165.6" y="147" text-anchor="middle" class="sm dim">2</text>
  <line x1="210.4" y1="128" x2="210.4" y2="136" class="tick"/>
  <text x="210.4" y="147" text-anchor="middle" class="sm dim">3</text>
  <line x1="255.2" y1="128" x2="255.2" y2="136" class="tick"/>
  <text x="255.2" y="147" text-anchor="middle" class="sm dim">4</text>
  <line x1="300" y1="128" x2="300" y2="136" class="tick"/>
  <text x="300" y="147" text-anchor="middle" class="sm dim">5</text>
  <line x1="120.8" y1="132" x2="120.8" y2="116.4" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <line x1="165.6" y1="132" x2="165.6" y2="108.8" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <line x1="210.4" y1="132" x2="210.4" y2="101.2" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <line x1="255.2" y1="132" x2="255.2" y2="93.6" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <line x1="300" y1="132" x2="300" y2="86" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="180" y="162" text-anchor="middle" class="bold" fill="#e11d48">Geometric</text>
  <line x1="68" y1="224" x2="318" y2="224" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="220" x2="76" y2="228" class="tick"/>
  <line x1="120.8" y1="220" x2="120.8" y2="228" class="tick"/>
  <text x="120.8" y="239" text-anchor="middle" class="sm dim">1</text>
  <line x1="165.6" y1="220" x2="165.6" y2="228" class="tick"/>
  <text x="165.6" y="239" text-anchor="middle" class="sm dim">2</text>
  <line x1="210.4" y1="220" x2="210.4" y2="228" class="tick"/>
  <text x="210.4" y="239" text-anchor="middle" class="sm dim">3</text>
  <line x1="255.2" y1="220" x2="255.2" y2="228" class="tick"/>
  <text x="255.2" y="239" text-anchor="middle" class="sm dim">4</text>
  <line x1="300" y1="220" x2="300" y2="228" class="tick"/>
  <text x="300" y="239" text-anchor="middle" class="sm dim">5</text>
  <line x1="120.8" y1="224" x2="120.8" y2="208.55" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="165.6" y1="224" x2="165.6" y2="204.82" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="210.4" y1="224" x2="210.4" y2="199.24" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="255.2" y1="224" x2="255.2" y2="190.67" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <line x1="300" y1="224" x2="300" y2="178" class="thin" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ahe11d48)"/>
  <text x="180" y="254" text-anchor="middle" class="bold" fill="#7c3aed">Irregular</text>
  <line x1="68" y1="316" x2="318" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="312" x2="76" y2="320" class="tick"/>
  <line x1="120.8" y1="312" x2="120.8" y2="320" class="tick"/>
  <text x="120.8" y="331" text-anchor="middle" class="sm dim">1</text>
  <line x1="165.6" y1="312" x2="165.6" y2="320" class="tick"/>
  <text x="165.6" y="331" text-anchor="middle" class="sm dim">2</text>
  <line x1="210.4" y1="312" x2="210.4" y2="320" class="tick"/>
  <text x="210.4" y="331" text-anchor="middle" class="sm dim">3</text>
  <line x1="255.2" y1="312" x2="255.2" y2="320" class="tick"/>
  <text x="255.2" y="331" text-anchor="middle" class="sm dim">4</text>
  <line x1="300" y1="312" x2="300" y2="320" class="tick"/>
  <text x="300" y="331" text-anchor="middle" class="sm dim">5</text>
  <line x1="120.8" y1="316" x2="120.8" y2="285.2" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="165.6" y1="316" x2="165.6" y2="300.4" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="210.4" y1="316" x2="210.4" y2="277.6" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="255.2" y1="316" x2="255.2" y2="292.8" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="300" y1="316" x2="300" y2="270" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
</svg>
