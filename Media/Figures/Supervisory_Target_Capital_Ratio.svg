<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The 150% supervisory target and the 100% minimum, and the space between them</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">150% is where OSFI expects you to</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">operate</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Supervisory target 150%</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">Minimum 100%</text>
    <rect x="82" y="122" width="52" height="200" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <line x1="74" y1="291.23" x2="140" y2="291.23" class="thin dash" stroke="#e11d48" stroke-width="1.4"/>
    <text x="150" y="295.23" text-anchor="start" class="sm" fill="#e11d48">100% minimum</text>
    <line x1="74" y1="214.31" x2="140" y2="214.31" class="thin dash" stroke="#d97706" stroke-width="1.4"/>
    <text x="150" y="218.31" text-anchor="start" class="sm" fill="#d97706">150% supervisory</text>
    <line x1="74" y1="160.46" x2="140" y2="160.46" class="thin dash" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="150" y="164.46" text-anchor="start" class="sm" fill="#7c3aed">185% internal</text>
    <rect x="82" y="214.31" width="52" height="76.92" rx="4" fill="#d97706" fill-opacity="0.18"/>
    <text x="150" y="268" text-anchor="start" class="sm dim">room to act</text>
    <line x1="30" y1="340" x2="330" y2="340" class="rule"/>
    <text x="180" y="360" text-anchor="middle" class="sm dim">below 150% is not a breach of law — it is a</text>
    <text x="180" y="376" text-anchor="middle" class="sm dim">capital restoration plan, a dividend stop and</text>
    <text x="180" y="392" text-anchor="middle" class="sm dim">closer reporting</text>
  </g>
</svg>
