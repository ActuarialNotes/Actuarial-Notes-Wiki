<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running PAA book at 31 December: $12.0M of unearned premium less $2.4M of acquisition cash flows carries an LRC of $9.6M, which the $1.9M loss component tops up to the $11.5M of fulfilment cash flows</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="44" y="116" width="52" height="234" rx="3" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="70" y="108" text-anchor="middle" class="sm">12.0</text>
    <text x="70" y="367" text-anchor="middle" class="sm dim">unearned</text>
    <rect x="119" y="116" width="52" height="46.8" rx="3" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.2"/>
    <text x="145" y="108" text-anchor="middle" class="sm">−2.4</text>
    <text x="145" y="367" text-anchor="middle" class="sm dim">acquisition</text>
    <rect x="194" y="162.8" width="52" height="187.2" rx="3" fill="#0d9488" fill-opacity="0.34" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="194" y="125.75" width="52" height="37.05" rx="3" fill="#e11d48" fill-opacity="0.34" stroke="#e11d48" stroke-width="1.2"/>
    <text x="220" y="367" text-anchor="middle" class="sm dim">LRC</text>
    <rect x="269" y="125.75" width="52" height="224.25" rx="3" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="295" y="117.75" text-anchor="middle" class="sm">11.5</text>
    <text x="295" y="367" text-anchor="middle" class="sm dim">FCF</text>
    <text x="220" y="260.4" text-anchor="middle" class="sm bold">9.6</text>
    <text x="220" y="148.28" text-anchor="middle" class="sm bold">1.9</text>
    <line x1="190" y1="125.75" x2="324" y2="125.75" class="thin dash" stroke="#7c3aed" stroke-width="1.3"/>
    <line x1="38" y1="350" x2="326" y2="350" class="axis"/>
  </g>
</svg>
