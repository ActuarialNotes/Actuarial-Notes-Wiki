<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The insurer's own target set above the supervisory one, derived from its own adverse scenarios</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Your own target, from your own scenarios</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Internal &gt; 150% supervisory</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">— set by ORSA, tested by FCT</text>
  <rect x="36" y="96" width="88" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="80" y="114" text-anchor="middle" class="sm">scenarios</text>
  <rect x="136" y="96" width="88" height="28" rx="14.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
  <text x="180" y="114" text-anchor="middle" class="sm">capital need</text>
  <line x1="125" y1="110" x2="135" y2="110" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="236" y="96" width="88" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="280" y="114" text-anchor="middle" class="sm">target</text>
  <line x1="225" y1="110" x2="235" y2="110" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <text x="180" y="148" text-anchor="middle" class="sm dim">ORSA works backwards from what could go wrong</text>
  <line x1="30" y1="170" x2="330" y2="170" class="rule"/>
  <text x="38" y="194" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="194" text-anchor="start" class="sm">a catastrophe at the PML</text>
  <text x="38" y="220" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="220" text-anchor="start" class="sm">a reserve strengthening on a long-tail line</text>
  <text x="38" y="246" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="246" text-anchor="start" class="sm">a reinsurer failing on its recoverables</text>
  <text x="38" y="272" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="272" text-anchor="start" class="sm">a market fall against an equity holding</text>
  <rect x="40" y="300" width="280" height="46" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="320" text-anchor="middle" class="sm">breaching the internal target is the first</text>
  <text x="180" y="337" text-anchor="middle" class="sm">tripwire — and it is management's, not OSFI's</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">a target that does not follow from the scenarios</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">is a governance finding, and OSFI challenges it</text>
</svg>
