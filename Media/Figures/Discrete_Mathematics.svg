<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 264" width="560" height="264" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="262.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Counting distinct structures: the power set of {a, b, c}</text>
  <rect x="148" y="61" width="60" height="26" rx="6" fill="var(--dim)" fill-opacity="0.13" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="178" y="78" text-anchor="middle" class="sm">∅</text>
  <rect x="44" y="103" width="60" height="26" rx="6" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="74" y="120" text-anchor="middle" class="sm">{a}</text>
  <rect x="148" y="103" width="60" height="26" rx="6" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="178" y="120" text-anchor="middle" class="sm">{b}</text>
  <rect x="252" y="103" width="60" height="26" rx="6" fill="#3b82f6" fill-opacity="0.13" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="282" y="120" text-anchor="middle" class="sm">{c}</text>
  <rect x="44" y="145" width="60" height="26" rx="6" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="74" y="162" text-anchor="middle" class="sm">{a,b}</text>
  <rect x="148" y="145" width="60" height="26" rx="6" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="178" y="162" text-anchor="middle" class="sm">{a,c}</text>
  <rect x="252" y="145" width="60" height="26" rx="6" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="282" y="162" text-anchor="middle" class="sm">{b,c}</text>
  <rect x="148" y="187" width="60" height="26" rx="6" fill="#059669" fill-opacity="0.13" stroke="#059669" stroke-width="1.2"/>
  <text x="178" y="204" text-anchor="middle" class="sm">{a,b,c}</text>
  <line x1="178" y1="87" x2="74" y2="103" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="178" y1="87" x2="178" y2="103" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="178" y1="87" x2="282" y2="103" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="74" y1="129" x2="74" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="74" y1="129" x2="178" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="74" y1="129" x2="282" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="178" y1="129" x2="74" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="178" y1="129" x2="178" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="178" y1="129" x2="282" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="282" y1="129" x2="74" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="282" y1="129" x2="178" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="282" y1="129" x2="282" y2="145" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="74" y1="171" x2="178" y2="187" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="178" y1="171" x2="178" y2="187" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <line x1="282" y1="171" x2="178" y2="187" class="thin" stroke="var(--edge)" stroke-width="1"/>
  <text x="178" y="238" text-anchor="middle" class="sm dim">8 subsets in all</text>
  <text x="444" y="88" text-anchor="middle" class="sm bold">|𝒫(S)| = 2^|S|</text>
  <text x="444" y="108" text-anchor="middle" class="sm dim">2³ = 8</text>
  <rect x="360" y="128" width="168" height="84" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="444" y="150" text-anchor="middle" class="sm bold">Every subset is an event</text>
  <text x="444" y="168" text-anchor="middle" class="sm dim">each element is either in</text>
  <text x="444" y="184" text-anchor="middle" class="sm dim">or out — two choices, |S| times</text>
  <text x="444" y="202" text-anchor="middle" class="sm dim">2 × 2 × 2 = 8</text>
</svg>
