  <text x="176" y="134" text-anchor="middle" class="sm">T₃</text>
  <line x1="64" y1="350" x2="334" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="350" x2="64" y2="186" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="350" x2="64" y2="354" class="tick"/>
  <text x="64" y="366" text-anchor="middle" class="sm dim">0</text>
  <line x1="118.17" y1="350" x2="118.17" y2="354" class="tick"/>
  <text x="118.17" y="366" text-anchor="middle" class="sm dim">0.25</text>
  <line x1="172.33" y1="350" x2="172.33" y2="354" class="tick"/>
  <text x="172.33" y="366" text-anchor="middle" class="sm dim">0.5</text>
