<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The ratio of ALAE to loss rising with age to 17% at ultimate, because defence costs develop more slowly than indemnity</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="107.14" y1="94" x2="107.14" y2="344" class="grid"/>
    <line x1="177.43" y1="94" x2="177.43" y2="344" class="grid"/>
    <line x1="247.71" y1="94" x2="247.71" y2="344" class="grid"/>
    <line x1="318" y1="94" x2="318" y2="344" class="grid"/>
    <line x1="72" y1="344" x2="318" y2="344" class="grid"/>
    <line x1="72" y1="239.83" x2="318" y2="239.83" class="grid"/>
    <line x1="72" y1="135.67" x2="318" y2="135.67" class="grid"/>
    <line x1="72" y1="344" x2="328" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="344" x2="72" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="107.14" y1="344" x2="107.14" y2="348" class="tick"/>
    <text x="107.14" y="360" text-anchor="middle" class="sm dim">12</text>
    <line x1="177.43" y1="344" x2="177.43" y2="348" class="tick"/>
    <text x="177.43" y="360" text-anchor="middle" class="sm dim">36</text>
    <line x1="247.71" y1="344" x2="247.71" y2="348" class="tick"/>
    <text x="247.71" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="318" y1="344" x2="318" y2="348" class="tick"/>
    <text x="318" y="360" text-anchor="middle" class="sm dim">84</text>
    <line x1="68" y1="344" x2="72" y2="344" class="tick"/>
    <text x="64" y="347.6" text-anchor="end" class="sm dim">0%</text>
    <line x1="68" y1="239.83" x2="72" y2="239.83" class="tick"/>
    <text x="64" y="243.43" text-anchor="end" class="sm dim">10%</text>
    <line x1="68" y1="135.67" x2="72" y2="135.67" class="tick"/>
    <text x="64" y="139.27" text-anchor="end" class="sm dim">20%</text>
    <text x="318" y="376" text-anchor="end" class="sm dim">age in months</text>
    <text x="68" y="80" text-anchor="start" class="sm dim">ALAE / loss</text>
    <polyline points="107.14,255.46 142.29,227.33 177.43,203.37 212.57,185.67 247.71,174.21 282.86,169 318,166.92" class="curve" stroke="#7c3aed" stroke-width="2.4"/>
    <circle cx="107.14" cy="255.46" r="3" fill="#7c3aed"/>
    <circle cx="142.29" cy="227.33" r="3" fill="#7c3aed"/>
    <circle cx="177.43" cy="203.37" r="3" fill="#7c3aed"/>
    <circle cx="212.57" cy="185.67" r="3" fill="#7c3aed"/>
    <circle cx="247.71" cy="174.21" r="3" fill="#7c3aed"/>
    <circle cx="282.86" cy="169" r="3" fill="#7c3aed"/>
    <circle cx="318" cy="166.92" r="3" fill="#7c3aed"/>
    <text x="236" y="164.21" text-anchor="middle" class="sm bold" fill="#7c3aed">17% at ultimate</text>
  </g>
</svg>
