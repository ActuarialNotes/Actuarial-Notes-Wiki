<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" width="560" height="232" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="230.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Kolmogorov's three axioms</text>
  <rect x="18" y="52" width="164" height="128" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <rect x="40" y="76" width="120" height="62" rx="6" fill="#3b82f6" fill-opacity="0.22" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="100" y="112" text-anchor="middle" class="bold">S</text>
  <text x="100" y="158" text-anchor="middle" class="sm bold">P(S) = 1</text>
  <text x="100" y="173" text-anchor="middle" class="sm dim">something must happen</text>
  <rect x="198" y="52" width="164" height="128" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <line x1="222" y1="104" x2="338" y2="104" class="axis"/>
  <rect x="280" y="78" width="58" height="26" rx="3" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.2"/>
  <line x1="280" y1="70" x2="280" y2="112" class="thin" stroke="var(--axis)" stroke-width="1.1"/>
  <text x="280" y="124" text-anchor="middle" class="sm dim">0</text>
  <text x="248" y="92" text-anchor="middle" class="sm" fill="#e11d48">✗</text>
  <text x="280" y="158" text-anchor="middle" class="sm bold">P(E) ≥ 0</text>
  <text x="280" y="173" text-anchor="middle" class="sm dim">no negative probability</text>
  <rect x="378" y="52" width="164" height="128" rx="7" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.2"/>
  <circle cx="432" cy="104" r="26" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="490" cy="104" r="26" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="432" y="109" text-anchor="middle" class="sm">E₁</text>
  <text x="490" y="109" text-anchor="middle" class="sm">E₂</text>
  <text x="460" y="158" text-anchor="middle" class="sm bold">P(E₁ ∪ E₂) = P(E₁) + P(E₂)</text>
  <text x="460" y="173" text-anchor="middle" class="sm dim">when they cannot overlap</text>
  <text x="280" y="208" text-anchor="middle" class="sm dim">Everything else in probability is derived from these three</text>
</svg>
