<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>An event as a subset of the sample space, simple versus compound</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="30" y="92" width="296" height="232" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <text x="43" y="108" text-anchor="middle" class="sm dim">S</text>
    <ellipse cx="116" cy="196" rx="74" ry="68" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="116" y="118" text-anchor="middle" class="bold" fill="#3b82f6">E</text>
    <ellipse cx="258" cy="168" rx="30" ry="28" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="258" y="126" text-anchor="middle" class="bold" fill="#7c3aed">F</text>
    <circle cx="88" cy="166" r="4.5" fill="var(--dim)"/>
    <circle cx="152" cy="158" r="4.5" fill="var(--dim)"/>
    <circle cx="210" cy="180" r="4.5" fill="var(--dim)"/>
    <circle cx="258" cy="168" r="4.5" fill="var(--dim)"/>
    <circle cx="96" cy="236" r="4.5" fill="var(--dim)"/>
    <circle cx="156" cy="248" r="4.5" fill="var(--dim)"/>
    <circle cx="216" cy="238" r="4.5" fill="var(--dim)"/>
    <circle cx="276" cy="280" r="4.5" fill="var(--dim)"/>
    <text x="180" y="352" text-anchor="middle" class="sm dim">outcomes ω ∈ S</text>
  </g>
</svg>
