<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Liability passing to the vehicle owner and the employer, neither of whom was careless</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Liable for someone else's negligence</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Owner ← permitted driver</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Employer ← employee, in the course of work</text>
  <rect x="41" y="103" width="110" height="26" rx="13.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="96" y="120" text-anchor="middle" class="sm">driver</text>
  <rect x="209" y="103" width="110" height="26" rx="13.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="264" y="120" text-anchor="middle" class="sm">owner</text>
  <line x1="152" y1="116" x2="208" y2="116" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="180" y="148" text-anchor="middle" class="sm dim">consent to use the vehicle</text>
  <rect x="41" y="173" width="110" height="26" rx="13.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="96" y="190" text-anchor="middle" class="sm">employee</text>
  <rect x="209" y="173" width="110" height="26" rx="13.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="264" y="190" text-anchor="middle" class="sm">employer</text>
  <line x1="152" y1="186" x2="208" y2="186" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="180" y="218" text-anchor="middle" class="sm dim">in the course of employment</text>
  <line x1="30" y1="240" x2="330" y2="240" class="rule"/>
  <text x="180" y="262" text-anchor="middle" class="sm dim">neither of the two on the right did anything wrong</text>
  <text x="40" y="292" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="56" y="292" text-anchor="start" class="sm">control of the activity, and the deeper pocket</text>
  <text x="40" y="316" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="56" y="316" text-anchor="start" class="sm">so the risk is the car and everyone who drives it</text>
  <text x="40" y="340" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="56" y="340" text-anchor="start" class="sm">— which is why a household member matters</text>
  <text x="40" y="364" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="56" y="364" text-anchor="start" class="sm">some provinces cap the owner's share</text>
</svg>
