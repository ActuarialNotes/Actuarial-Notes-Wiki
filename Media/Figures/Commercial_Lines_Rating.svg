<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The chain of adjustments from a manual premium to a commercial risk's final price</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The manual rate is a starting point</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Standard = Manual × M_exp × (1 + sched)</text>
  <rect x="44" y="120" width="272" height="46" rx="6" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="56" y="140" text-anchor="start" class="sm bold">Manual premium</text>
  <text x="56" y="156" text-anchor="start" class="sm dim">class rate × exposure</text>
  <text x="304" y="148" text-anchor="end" class="sm bold">100,000</text>
  <rect x="44" y="182" width="272" height="46" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="56" y="202" text-anchor="start" class="sm bold">× Experience mod</text>
  <text x="56" y="218" text-anchor="start" class="sm dim">the risk's own losses</text>
  <text x="304" y="210" text-anchor="end" class="sm bold">0.88</text>
  <line x1="180" y1="167" x2="180" y2="180" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <rect x="44" y="244" width="272" height="46" rx="6" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
  <text x="56" y="264" text-anchor="start" class="sm bold">× Schedule mod</text>
  <text x="56" y="280" text-anchor="start" class="sm dim">underwriter judgment</text>
  <text x="304" y="272" text-anchor="end" class="sm bold">0.95</text>
  <line x1="180" y1="229" x2="180" y2="242" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <rect x="44" y="306" width="272" height="46" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="56" y="326" text-anchor="start" class="sm bold">Standard premium</text>
  <text x="56" y="342" text-anchor="start" class="sm dim">before any retro</text>
  <text x="304" y="334" text-anchor="end" class="sm bold">83,600</text>
  <line x1="180" y1="291" x2="180" y2="304" class="thin" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#ahvardim)"/>
  <text x="180" y="390" text-anchor="middle" class="sm dim">and a retro plan can still move it afterwards</text>
</svg>
