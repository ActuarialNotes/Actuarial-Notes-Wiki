<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The IFRS 17 income statement down to the insurance service result, with reinsurance on its own line</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Underwriting, with every financial</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">effect stripped out</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ISR = revenue − service expenses</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">− net reinsurance expense</text>
  <rect x="34" y="108" width="292" height="40" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="46" y="133" text-anchor="start" class="sm">Insurance revenue</text>
  <text x="314" y="133" text-anchor="end" class="sm bold">420</text>
  <rect x="34" y="160" width="292" height="40" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.2"/>
  <text x="46" y="185" text-anchor="start" class="sm">Insurance service expenses</text>
  <text x="314" y="185" text-anchor="end" class="sm bold">(370)</text>
  <rect x="34" y="212" width="292" height="40" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="46" y="237" text-anchor="start" class="sm">Net reinsurance expense</text>
  <text x="314" y="237" text-anchor="end" class="sm bold">(12)</text>
  <rect x="34" y="264" width="292" height="40" rx="6" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.2"/>
  <text x="46" y="289" text-anchor="start" class="sm">Insurance service result</text>
  <text x="314" y="289" text-anchor="end" class="sm bold">38</text>
  <line x1="34" y1="258" x2="326" y2="258" class="rule"/>
  <text x="180" y="336" text-anchor="middle" class="sm dim">$M, the running insurer — investment return and</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">every interest-rate effect are reported below this</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">close to an underwriting result, but not the combined ratio</text>
</svg>
