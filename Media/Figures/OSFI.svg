<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>OSFI's intervention ladder, from normal supervision to non-viability</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Prudential supervision runs on a ladder</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Composite risk rating → stage 0–4</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">solvency only — never rates or conduct</text>
  <rect x="38" y="100" width="147.68" height="40" rx="6" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.3"/>
  <text x="46" y="117" text-anchor="start" class="sm bold">Stage 0 — normal</text>
  <text x="46" y="131" text-anchor="start" class="sm dim">routine supervision</text>
  <rect x="38" y="152" width="181.76" height="40" rx="6" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.3"/>
  <text x="46" y="169" text-anchor="start" class="sm bold">Stage 1 — early warning</text>
  <text x="46" y="183" text-anchor="start" class="sm dim">issues identified</text>
  <rect x="38" y="204" width="215.84" height="40" rx="6" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.3"/>
  <text x="46" y="221" text-anchor="start" class="sm bold">Stage 2 — risk to viability</text>
  <text x="46" y="235" text-anchor="start" class="sm dim">capital plan required</text>
  <rect x="38" y="256" width="249.92" height="40" rx="6" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.3"/>
  <text x="46" y="273" text-anchor="start" class="sm bold">Stage 3 — serious doubt</text>
  <text x="46" y="287" text-anchor="start" class="sm dim">business restricted</text>
  <rect x="38" y="308" width="284" height="40" rx="6" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="46" y="325" text-anchor="start" class="sm bold">Stage 4 — non-viable</text>
  <text x="46" y="339" text-anchor="start" class="sm dim">control of assets</text>
  <text x="180" y="384" text-anchor="middle" class="sm dim">escalation is graduated, and never automatic</text>
</svg>
