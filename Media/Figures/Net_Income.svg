<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running insurer's net income as a waterfall: the $38M insurance service result and the $22M net financial result as separate steps, less $6M of other expenses and tax, to $39M</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="49.02" y="200.53" width="38.35" height="149.47" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="68.2" y="192.53" text-anchor="middle" class="sm">38</text>
    <text x="68.2" y="365" text-anchor="middle" class="sm dim">ISR</text>
    <rect x="105.42" y="114" width="38.35" height="86.53" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="124.6" y="106" text-anchor="middle" class="sm">22</text>
    <text x="124.6" y="365" text-anchor="middle" class="sm dim">financial</text>
    <rect x="161.82" y="114" width="38.35" height="23.6" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="181" y="106" text-anchor="middle" class="sm">6</text>
    <text x="181" y="365" text-anchor="middle" class="sm dim">other</text>
    <rect x="218.22" y="137.6" width="38.35" height="57.35" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="237.4" y="129.6" text-anchor="middle" class="sm">15</text>
    <text x="237.4" y="365" text-anchor="middle" class="sm dim">tax</text>
    <rect x="274.62" y="194.95" width="38.35" height="155.05" rx="3" fill="#059669" fill-opacity="0.72"/>
    <text x="293.8" y="186.95" text-anchor="middle" class="sm">39</text>
    <text x="293.8" y="365" text-anchor="middle" class="sm dim">net</text>
    <line x1="34" y1="350" x2="328" y2="350" class="axis"/>
  </g>
</svg>
