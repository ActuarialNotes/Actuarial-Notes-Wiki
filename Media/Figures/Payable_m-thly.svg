<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <title>An annual payment of 1 split into m sub-period payments</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Payable m-thly: the same 1 per year, paid in m pieces</text>
  <line x1="144" y1="106" x2="442" y2="106" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="152" y1="102" x2="152" y2="110" class="tick"/>
  <text x="152" y="121" text-anchor="middle" class="sm dim">0</text>
  <line x1="220" y1="102" x2="220" y2="110" class="tick"/>
  <text x="220" y="121" text-anchor="middle" class="sm dim">1</text>
  <line x1="288" y1="102" x2="288" y2="110" class="tick"/>
  <text x="288" y="121" text-anchor="middle" class="sm dim">2</text>
  <line x1="356" y1="102" x2="356" y2="110" class="tick"/>
  <text x="356" y="121" text-anchor="middle" class="sm dim">3</text>
  <line x1="424" y1="102" x2="424" y2="110" class="tick"/>
  <text x="424" y="121" text-anchor="middle" class="sm dim">4</text>
  <text x="140" y="110" text-anchor="end" class="sm bold" fill="var(--dim)">m = 1</text>
  <line x1="220" y1="106" x2="220" y2="76" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="220" y="70" text-anchor="middle" class="sm">1</text>
  <line x1="288" y1="106" x2="288" y2="76" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="288" y="70" text-anchor="middle" class="sm">1</text>
  <line x1="356" y1="106" x2="356" y2="76" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="356" y="70" text-anchor="middle" class="sm">1</text>
  <line x1="424" y1="106" x2="424" y2="76" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="424" y="70" text-anchor="middle" class="sm">1</text>
  <text x="440" y="110" text-anchor="start" class="sm dim">1 per year</text>
  <line x1="144" y1="182" x2="442" y2="182" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="152" y1="178" x2="152" y2="186" class="tick"/>
  <text x="152" y="197" text-anchor="middle" class="sm dim">0</text>
  <line x1="220" y1="178" x2="220" y2="186" class="tick"/>
  <text x="220" y="197" text-anchor="middle" class="sm dim">1</text>
  <line x1="288" y1="178" x2="288" y2="186" class="tick"/>
  <text x="288" y="197" text-anchor="middle" class="sm dim">2</text>
  <line x1="356" y1="178" x2="356" y2="186" class="tick"/>
  <text x="356" y="197" text-anchor="middle" class="sm dim">3</text>
  <line x1="424" y1="178" x2="424" y2="186" class="tick"/>
  <text x="424" y="197" text-anchor="middle" class="sm dim">4</text>
  <text x="140" y="186" text-anchor="end" class="sm bold" fill="#3b82f6">m = 4</text>
  <line x1="169" y1="182" x2="169" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="186" y1="182" x2="186" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="203" y1="182" x2="203" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="220" y1="182" x2="220" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="237" y1="182" x2="237" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="254" y1="182" x2="254" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="271" y1="182" x2="271" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="288" y1="182" x2="288" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="305" y1="182" x2="305" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="322" y1="182" x2="322" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="339" y1="182" x2="339" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="356" y1="182" x2="356" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="373" y1="182" x2="373" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="390" y1="182" x2="390" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="407" y1="182" x2="407" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="424" y1="182" x2="424" y2="160" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="440" y="186" text-anchor="start" class="sm dim">¼ each quarter</text>
  <line x1="28" y1="220" x2="532" y2="220" class="rule"/>
  <text x="150" y="242" text-anchor="middle" class="sm bold">a⁽ᵐ⁾₍ₙ₎ = (1 − vⁿ) / i⁽ᵐ⁾</text>
  <text x="150" y="262" text-anchor="middle" class="sm dim">the only change is i → i⁽ᵐ⁾</text>
  <text x="412" y="242" text-anchor="middle" class="sm bold">Because money arrives earlier</text>
  <text x="412" y="262" text-anchor="middle" class="sm dim">a⁽ᵐ⁾₍ₙ₎ &gt; a₍ₙ₎ for every m &gt; 1</text>
</svg>
