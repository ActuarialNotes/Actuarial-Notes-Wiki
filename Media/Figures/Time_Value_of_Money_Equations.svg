<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The moves that connect any two valuation dates</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Every FM calculation is one of these</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">moves</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">FV = PV (1 + i)ⁿ,   PV = FV vⁿ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">s₍ₙ₎ = (1 + i)ⁿ a₍ₙ₎</text>
  <rect x="34" y="90" width="108" height="64" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="88" y="128" text-anchor="middle" class="ttl">PV</text>
  <rect x="218" y="90" width="108" height="64" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="272" y="128" text-anchor="middle" class="ttl">FV</text>
  <rect x="34" y="270" width="108" height="64" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="88" y="308" text-anchor="middle" class="ttl">a₍ₙ₎</text>
  <rect x="218" y="270" width="108" height="64" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="272" y="308" text-anchor="middle" class="ttl">s₍ₙ₎</text>
  <line x1="146" y1="108" x2="214" y2="108" class="thin" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
  <text x="180" y="100" text-anchor="middle" class="sm" fill="#059669">× (1 + i)ⁿ</text>
  <line x1="214" y1="138" x2="146" y2="138" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <text x="180" y="156" text-anchor="middle" class="sm" fill="#d97706">× vⁿ</text>
  <line x1="88" y1="262" x2="88" y2="160" class="thin dash" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#ah3b82f6)"/>
  <text x="80" y="214" text-anchor="end" class="sm dim">× P</text>
  <line x1="272" y1="262" x2="272" y2="160" class="thin dash" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#ah7c3aed)"/>
  <text x="280" y="214" text-anchor="start" class="sm dim">× P</text>
  <line x1="146" y1="302" x2="214" y2="302" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="180" y="294" text-anchor="middle" class="sm dim">× (1 + i)ⁿ</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">same rate, same timeline — only the date changes</text>
</svg>
