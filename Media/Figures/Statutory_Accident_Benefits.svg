<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The benefit heads every auto policy must carry, and the tiered limits that drive their cost</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">First-party benefits set by regulation,</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">not by the insurer</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Medical · attendant care · income</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">· death and funeral — regardless of fault</text>
  <text x="40" y="104" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="104" text-anchor="start" class="sm">medical and rehabilitation</text>
  <text x="40" y="129" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="129" text-anchor="start" class="sm">attendant care — the severe-claim driver</text>
  <text x="40" y="154" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="154" text-anchor="start" class="sm">income replacement, after an elimination period</text>
  <text x="40" y="179" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="179" text-anchor="start" class="sm">non-earner, caregiver, housekeeping</text>
  <text x="40" y="204" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="204" text-anchor="start" class="sm">death and funeral</text>
  <line x1="30" y1="236" x2="330" y2="236" class="rule"/>
  <text x="180" y="254" text-anchor="middle" class="sm dim">and the tier decides the limit</text>
  <text x="44" y="274" text-anchor="start" class="sm">minor — $3,500</text>
  <rect x="44" y="280" width="34" height="16" rx="3" fill="#059669" fill-opacity="0.55"/>
  <text x="44" y="312" text-anchor="start" class="sm">non-catastrophic — $65,000</text>
  <rect x="44" y="318" width="112" height="16" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="44" y="350" text-anchor="start" class="sm">catastrophic — $1,000,000</text>
  <rect x="44" y="356" width="232" height="16" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="180" y="388" text-anchor="middle" class="sm dim">so the fight is over the tier, not the treatment</text>
</svg>
