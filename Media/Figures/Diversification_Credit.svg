<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The credit removing the over-statement in adding insurance and market risk together</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">A hurricane and a market crash are not</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">the same event</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Credit applies between insurance</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">and market risk — and nothing else</text>
    <rect x="58.28" y="169.63" width="39.44" height="72.37" rx="3" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="78" y="162.63" text-anchor="middle" class="sm">92</text>
    <text x="78" y="257" text-anchor="middle" class="sm dim">insurance</text>
    <rect x="126.28" y="199.52" width="39.44" height="42.48" rx="3" fill="#0d9488" fill-opacity="0.75"/>
    <text x="146" y="192.52" text-anchor="middle" class="sm">54</text>
    <text x="146" y="257" text-anchor="middle" class="sm dim">market</text>
    <rect x="194.28" y="127.15" width="39.44" height="114.85" rx="3" fill="var(--dim)" fill-opacity="0.75"/>
    <text x="214" y="120.15" text-anchor="middle" class="sm">146</text>
    <text x="214" y="257" text-anchor="middle" class="sm dim">added</text>
    <rect x="262.28" y="147.6" width="39.44" height="94.4" rx="3" fill="#059669" fill-opacity="0.75"/>
    <text x="282" y="140.6" text-anchor="middle" class="sm">120</text>
    <text x="282" y="257" text-anchor="middle" class="sm dim">combined</text>
    <line x1="38" y1="242" x2="322" y2="242" class="axis"/>
    <text x="180" y="280" text-anchor="middle" class="sm dim">$M — the $26M credit is the difference</text>
    <line x1="30" y1="300" x2="330" y2="300" class="rule"/>
    <text x="180" y="322" text-anchor="middle" class="sm dim">credit and operational risk get no credit at all</text>
    <text x="180" y="346" text-anchor="middle" class="sm dim">and the credit is largest when the two risks are</text>
    <text x="180" y="362" text-anchor="middle" class="sm dim">of similar size — an insurer that is almost all</text>
    <text x="180" y="378" text-anchor="middle" class="sm dim">insurance risk has little to diversify against</text>
  </g>
</svg>
