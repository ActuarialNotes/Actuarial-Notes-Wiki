<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 286" width="560" height="286" role="img">
  <title>Alternating signs over the seven regions of a three-set Venn diagram</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="284.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Add singles, subtract pairs, add back the triple</text>
  <circle cx="168" cy="114" r="58" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="134" cy="172" r="58" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="202" cy="172" r="58" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.5"/>
  <text x="168" y="48" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <text x="72" y="224" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <text x="264" y="224" text-anchor="middle" class="bold" fill="#059669">C</text>
  <text x="168" y="88" text-anchor="middle" class="bold">+</text>
  <text x="116" y="194" text-anchor="middle" class="bold">+</text>
  <text x="220" y="194" text-anchor="middle" class="bold">+</text>
  <text x="138" y="144" text-anchor="middle" class="bold">−</text>
  <text x="198" y="144" text-anchor="middle" class="bold">−</text>
  <text x="168" y="196" text-anchor="middle" class="bold">−</text>
  <text x="168" y="162" text-anchor="middle" class="bold">+</text>
  <text x="168" y="250" text-anchor="middle" class="sm dim">every region ends up counted exactly once</text>
  <text x="420" y="78" text-anchor="middle" class="bold">P(A ∪ B ∪ C)</text>
  <text x="310" y="106" text-anchor="start" class="sm" fill="#3b82f6">+ P(A) + P(B) + P(C)</text>
  <text x="310" y="132" text-anchor="start" class="sm" fill="#e11d48">− P(A∩B) − P(A∩C) − P(B∩C)</text>
  <text x="310" y="158" text-anchor="start" class="sm" fill="#059669">+ P(A∩B∩C)</text>
  <rect x="300" y="182" width="236" height="62" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="418" y="202" text-anchor="middle" class="sm bold">Two events</text>
  <text x="418" y="220" text-anchor="middle" class="sm dim">P(A ∪ B) = P(A) + P(B) − P(A∩B)</text>
  <text x="418" y="236" text-anchor="middle" class="sm dim">disjoint events drop every ∩ term</text>
</svg>
