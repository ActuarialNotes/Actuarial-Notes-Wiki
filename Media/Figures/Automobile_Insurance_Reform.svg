<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The reform cycle, and the levers ranked by the savings each delivers</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Under rate regulation, only cost can be</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">cut</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Premium ≈ Freq × Sev ÷ (1 − V − Q)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">so the only durable saving is a cheaper product</text>
  <rect x="134" y="97.1" width="92" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="113.1" text-anchor="middle" class="sm">costs rise</text>
  <rect x="230.1" y="156" width="92" height="24" rx="12.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="276.1" y="172" text-anchor="middle" class="sm">rates lag</text>
  <rect x="134" y="214.9" width="92" height="24" rx="12.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="230.9" text-anchor="middle" class="sm">crisis</text>
  <rect x="37.9" y="156" width="92" height="24" rx="12.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="83.9" y="172" text-anchor="middle" class="sm">reform</text>
  <line x1="199.18" y1="131.65" x2="235.69" y2="155.49" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="235.69" y1="180.51" x2="199.18" y2="204.35" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="160.82" y1="204.35" x2="124.31" y2="180.51" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="124.31" y1="155.49" x2="160.82" y2="131.65" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="30" y1="244" x2="330" y2="244" class="rule"/>
  <text x="180" y="264" text-anchor="middle" class="sm dim">the levers, by savings delivered</text>
  <rect x="40" y="280" width="264" height="22" rx="4" fill="#e11d48" fill-opacity="0.24" stroke="#e11d48" stroke-width="1.1"/>
  <text x="48" y="295" text-anchor="start" class="sm">restrict tort access</text>
  <rect x="40" y="308" width="216" height="22" rx="4" fill="#d97706" fill-opacity="0.24" stroke="#d97706" stroke-width="1.1"/>
  <text x="48" y="323" text-anchor="start" class="sm">cap or define benefits</text>
  <rect x="40" y="336" width="172" height="22" rx="4" fill="#0d9488" fill-opacity="0.24" stroke="#0d9488" stroke-width="1.1"/>
  <text x="48" y="351" text-anchor="start" class="sm">convert to first party</text>
  <rect x="40" y="364" width="140" height="22" rx="4" fill="#059669" fill-opacity="0.24" stroke="#059669" stroke-width="1.1"/>
  <text x="48" y="379" text-anchor="start" class="sm">attack cost drivers</text>
</svg>
