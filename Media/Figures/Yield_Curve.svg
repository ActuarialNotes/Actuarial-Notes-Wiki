<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Normal, flat and inverted term structures on one set of axes</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Three shapes the term structure takes</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P = Σ C_t / (1 + s_t)^t</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">every maturity has its own spot rate</text>
  <polyline points="80.19,256.25 88.39,240.63 96.58,225 112.97,198.96 129.35,178.12 153.94,162.5 235.87,141.67 317.81,131.25" class="curve" stroke="#059669" stroke-width="2"/>
  <circle cx="80.19" cy="256.25" r="2.6" fill="#059669"/>
  <circle cx="88.39" cy="240.63" r="2.6" fill="#059669"/>
  <circle cx="96.58" cy="225" r="2.6" fill="#059669"/>
  <circle cx="112.97" cy="198.96" r="2.6" fill="#059669"/>
  <circle cx="129.35" cy="178.12" r="2.6" fill="#059669"/>
  <circle cx="153.94" cy="162.5" r="2.6" fill="#059669"/>
  <circle cx="235.87" cy="141.67" r="2.6" fill="#059669"/>
  <circle cx="317.81" cy="131.25" r="2.6" fill="#059669"/>
  <polyline points="80.19,204.17 88.39,204.17 96.58,204.17 112.97,204.17 129.35,204.17 153.94,204.17 235.87,204.17 317.81,204.17" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="80.19" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="88.39" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="96.58" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="112.97" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="129.35" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="153.94" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="235.87" cy="204.17" r="2.6" fill="#3b82f6"/>
  <circle cx="317.81" cy="204.17" r="2.6" fill="#3b82f6"/>
  <polyline points="80.19,162.5 88.39,183.33 96.58,204.17 112.97,235.42 129.35,256.25 153.94,277.08 235.87,308.33 317.81,318.75" class="curve" stroke="#e11d48" stroke-width="2"/>
  <circle cx="80.19" cy="162.5" r="2.6" fill="#e11d48"/>
  <circle cx="88.39" cy="183.33" r="2.6" fill="#e11d48"/>
  <circle cx="96.58" cy="204.17" r="2.6" fill="#e11d48"/>
  <circle cx="112.97" cy="235.42" r="2.6" fill="#e11d48"/>
  <circle cx="129.35" cy="256.25" r="2.6" fill="#e11d48"/>
  <circle cx="153.94" cy="277.08" r="2.6" fill="#e11d48"/>
  <circle cx="235.87" cy="308.33" r="2.6" fill="#e11d48"/>
  <circle cx="317.81" cy="318.75" r="2.6" fill="#e11d48"/>
  <text x="309.61" y="121.25" text-anchor="end" class="sm bold" fill="#059669">normal</text>
  <text x="309.61" y="194.17" text-anchor="end" class="sm bold" fill="#3b82f6">flat</text>
  <text x="309.61" y="334.75" text-anchor="end" class="sm bold" fill="#e11d48">inverted</text>
  <line x1="72" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="350" x2="72" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="80.19" y1="350" x2="80.19" y2="354" class="tick"/>
  <text x="80.19" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="153.94" y1="350" x2="153.94" y2="354" class="tick"/>
  <text x="153.94" y="366" text-anchor="middle" class="sm dim">10</text>
  <line x1="235.87" y1="350" x2="235.87" y2="354" class="tick"/>
  <text x="235.87" y="366" text-anchor="middle" class="sm dim">20</text>
  <line x1="317.81" y1="350" x2="317.81" y2="354" class="tick"/>
  <text x="317.81" y="366" text-anchor="middle" class="sm dim">30</text>
  <line x1="68" y1="329.17" x2="72" y2="329.17" class="tick"/>
  <text x="64" y="332.77" text-anchor="end" class="sm dim">3.5%</text>
  <line x1="68" y1="277.08" x2="72" y2="277.08" class="tick"/>
  <text x="64" y="280.68" text-anchor="end" class="sm dim">4.0%</text>
  <line x1="68" y1="225" x2="72" y2="225" class="tick"/>
  <text x="64" y="228.6" text-anchor="end" class="sm dim">4.5%</text>
  <line x1="68" y1="172.92" x2="72" y2="172.92" class="tick"/>
  <text x="64" y="176.52" text-anchor="end" class="sm dim">5.0%</text>
  <line x1="68" y1="120.83" x2="72" y2="120.83" class="tick"/>
  <text x="64" y="124.43" text-anchor="end" class="sm dim">5.5%</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">maturity (years)</text>
  <text x="68" y="86" text-anchor="start" class="sm dim">spot rate</text>
</svg>
