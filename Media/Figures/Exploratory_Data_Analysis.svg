<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Four exploratory views of the same data set</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Look at the data before modelling it</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">shape, spread, outliers, relationships</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">one plot per question</text>
  <text x="103" y="92" text-anchor="middle" class="sm bold" fill="#3b82f6">histogram</text>
  <line x1="34" y1="196" x2="172" y2="196" class="axis"/>
  <rect x="39.92" y="177.14" width="13" height="18.86" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="55.1" y="148.86" width="13" height="47.14" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="70.28" y="114.57" width="13" height="81.43" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="85.46" y="129.14" width="13" height="66.86" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="100.64" y="153.14" width="13" height="42.86" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="115.82" y="170.29" width="13" height="25.71" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="131" y="182.29" width="13" height="13.71" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <rect x="146.18" y="189.14" width="13" height="6.86" rx="1.5" fill="#3b82f6" fill-opacity="0.65"/>
  <text x="261" y="92" text-anchor="middle" class="sm bold" fill="#d97706">box plot</text>
  <line x1="192" y1="196" x2="330" y2="196" class="axis"/>
  <rect x="227.88" y="130.86" width="52.44" height="44.57" rx="3" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <line x1="249.96" y1="130.86" x2="249.96" y2="175.43" stroke="#d97706" stroke-width="2"/>
  <line x1="203.04" y1="153.14" x2="227.88" y2="153.14" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <line x1="280.32" y1="153.14" x2="307.92" y2="153.14" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="321.72" cy="153.14" r="3" fill="#d97706"/>
  <text x="103" y="254" text-anchor="middle" class="sm bold" fill="#059669">scatter</text>
  <line x1="34" y1="358" x2="172" y2="358" class="axis"/>
  <circle cx="48.39" cy="352.13" r="2.6" fill="#059669"/>
  <circle cx="39.29" cy="346.79" r="2.6" fill="#059669"/>
  <circle cx="130.36" cy="286.94" r="2.6" fill="#059669"/>
  <circle cx="139.28" cy="295" r="2.6" fill="#059669"/>
  <circle cx="86.49" cy="323.46" r="2.6" fill="#059669"/>
  <circle cx="55.79" cy="324.83" r="2.6" fill="#059669"/>
  <circle cx="51.62" cy="323.3" r="2.6" fill="#059669"/>
  <circle cx="45.68" cy="354.06" r="2.6" fill="#059669"/>
  <circle cx="150.6" cy="287.49" r="2.6" fill="#059669"/>
  <circle cx="63.18" cy="340.36" r="2.6" fill="#059669"/>
  <circle cx="72.32" cy="335.6" r="2.6" fill="#059669"/>
  <circle cx="159.11" cy="298.11" r="2.6" fill="#059669"/>
  <circle cx="77.82" cy="335.89" r="2.6" fill="#059669"/>
  <circle cx="51.83" cy="335.79" r="2.6" fill="#059669"/>
  <circle cx="93.58" cy="328.42" r="2.6" fill="#059669"/>
  <circle cx="51.82" cy="335.81" r="2.6" fill="#059669"/>
  <circle cx="98.14" cy="309.6" r="2.6" fill="#059669"/>
  <circle cx="155.94" cy="276.38" r="2.6" fill="#059669"/>
  <text x="261" y="254" text-anchor="middle" class="sm bold" fill="#7c3aed">bar chart</text>
  <line x1="192" y1="358" x2="330" y2="358" class="axis"/>
  <rect x="203.08" y="280.86" width="22" height="77.14" rx="1.5" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="236.2" y="304.86" width="22" height="53.14" rx="1.5" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="269.32" y="328.86" width="22" height="29.14" rx="1.5" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="302.44" y="347.71" width="22" height="10.29" rx="1.5" fill="#7c3aed" fill-opacity="0.65"/>
</svg>
