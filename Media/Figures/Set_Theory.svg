<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <clipPath id="clipA0"><circle cx="64.0" cy="108" r="36"/></clipPath>
    <clipPath id="clipA1"><circle cx="198.0" cy="108" r="36"/></clipPath>
    <clipPath id="clipA2"><circle cx="332.0" cy="108" r="36"/></clipPath>
    <clipPath id="clipA3"><circle cx="466.0" cy="108" r="36"/></clipPath>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="248.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Set operations are the language of events</text>
  <rect x="20" y="56" width="124" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="30" y="70" text-anchor="middle" class="sm dim">S</text>
  <g opacity="0.22" fill="#3b82f6"><circle cx="64.0" cy="108" r="36"/><circle cx="100.0" cy="108" r="36"/></g>
  <circle cx="64" cy="108" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="100" cy="108" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="40" y="80" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="124" y="80" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="82" y="182" text-anchor="middle" class="sm">A ∪ B  (or)</text>
  <rect x="154" y="56" width="124" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="164" y="70" text-anchor="middle" class="sm dim">S</text>
  <g clip-path="url(#clipA1)"><circle cx="234.0" cy="108" r="36" fill="#3b82f6" fill-opacity="0.3"/></g>
  <circle cx="198" cy="108" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="234" cy="108" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="174" y="80" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="258" y="80" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="216" y="182" text-anchor="middle" class="sm">A ∩ B  (and)</text>
  <rect x="288" y="56" width="124" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="298" y="70" text-anchor="middle" class="sm dim">S</text>
  <rect x="288" y="56" width="124" height="104" rx="7" fill="#3b82f6" fill-opacity="0.22"/>
  <circle cx="332" cy="108" r="36" fill="var(--soft)"/>
  <circle cx="332" cy="108" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="368" cy="108" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="308" y="80" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="392" y="80" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="350" y="182" text-anchor="middle" class="sm">Aᶜ  (not)</text>
  <rect x="422" y="56" width="124" height="104" rx="7" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="432" y="70" text-anchor="middle" class="sm dim">S</text>
  <circle cx="466" cy="108" r="36" fill="#3b82f6" fill-opacity="0.22"/>
  <g clip-path="url(#clipA3)"><circle cx="502.0" cy="108" r="36" fill="var(--soft)"/></g>
  <circle cx="466" cy="108" r="36" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="502" cy="108" r="36" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="442" y="80" text-anchor="middle" class="sm bold" fill="#3b82f6">A</text>
  <text x="526" y="80" text-anchor="middle" class="sm bold" fill="#d97706">B</text>
  <text x="484" y="182" text-anchor="middle" class="sm">A \ B  (only A)</text>
  <text x="280" y="224" text-anchor="middle" class="sm dim">An event is a subset of S; "or", "and", "not" are ∪, ∩, ᶜ</text>
</svg>
