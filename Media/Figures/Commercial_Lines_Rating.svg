<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A $100,000 manual premium stepping down through an experience mod of 0.88 and a schedule mod of 0.95 to a standard premium of $83,600</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah0d9488" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#0d9488"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="28" y="156" width="64" height="200" rx="3" fill="#7c3aed" fill-opacity="0.32" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="60" y="148" text-anchor="middle" class="sm bold">100,000</text>
    <text x="60" y="374" text-anchor="middle" class="sm dim">manual</text>
    <rect x="148" y="180" width="64" height="176" rx="3" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="180" y="172" text-anchor="middle" class="sm bold">88,000</text>
    <rect x="268" y="188.8" width="64" height="167.2" rx="3" fill="#059669" fill-opacity="0.32" stroke="#059669" stroke-width="1.2"/>
    <text x="300" y="180.8" text-anchor="middle" class="sm bold">83,600</text>
    <text x="300" y="374" text-anchor="middle" class="sm dim">standard</text>
    <polygon points="107.76,87 125.44,87 132.24,93.8 132.24,121 107.76,121" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M125.44,87 V93.8 H132.24" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="112.52" y1="100.6" x2="126.8" y2="100.6" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="112.52" y1="106.38" x2="126.8" y2="106.38" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="112.52" y1="112.16" x2="122.04" y2="112.16" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
    <text x="120" y="138" text-anchor="middle" class="sm">experience</text>
    <line x1="96" y1="236" x2="144" y2="236" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
    <text x="120" y="228" text-anchor="middle" class="sm bold">× 0.88</text>
    <circle cx="240" cy="93.8" r="6.12" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M229.12,121 V108.08 Q229.12,102.64 235.24,102.64 H244.76 Q250.88,102.64 250.88,108.08 V121 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="240" y="138" text-anchor="middle" class="sm">schedule</text>
    <line x1="216" y1="236" x2="264" y2="236" class="thin" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah0d9488)"/>
    <text x="240" y="228" text-anchor="middle" class="sm bold">× 0.95</text>
  </g>
</svg>
