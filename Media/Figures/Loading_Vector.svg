<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Paired bars of the first two loading vectors across four driving variables: φ₁ weighs all four about equally, φ₂ sets braking and cornering against night and mileage</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="60" y1="341.92" x2="328" y2="341.92" class="grid"/>
    <line x1="60" y1="241.15" x2="328" y2="241.15" class="grid"/>
    <line x1="60" y1="140.38" x2="328" y2="140.38" class="grid"/>
    <line x1="60" y1="241.15" x2="328" y2="241.15" class="axis"/>
    <line x1="60" y1="90" x2="60" y2="352" class="axis"/>
    <line x1="56" y1="341.92" x2="60" y2="341.92" class="tick"/>
    <text x="52" y="345.52" text-anchor="end" class="sm dim">-0.5</text>
    <line x1="56" y1="241.15" x2="60" y2="241.15" class="tick"/>
    <text x="52" y="244.75" text-anchor="end" class="sm dim">0</text>
    <line x1="56" y1="140.38" x2="60" y2="140.38" class="tick"/>
    <text x="52" y="143.98" text-anchor="end" class="sm dim">0.5</text>
    <rect x="75.95" y="136.35" width="20.42" height="104.8" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="139.76" y="138.37" width="20.42" height="102.78" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="203.57" y="142.4" width="20.42" height="98.75" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <rect x="267.38" y="144.42" width="20.42" height="96.74" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="86.16" y="129.35" text-anchor="middle" class="sm bold">φ₁</text>
    <rect x="100.2" y="118.22" width="20.42" height="122.94" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="164.01" y="130.31" width="20.42" height="110.85" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="227.82" y="241.15" width="20.42" height="84.65" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <rect x="291.63" y="241.15" width="20.42" height="78.6" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
    <text x="110.41" y="111.22" text-anchor="middle" class="sm bold">φ₂</text>
    <line x1="60" y1="241.15" x2="328" y2="241.15" class="thin" stroke="var(--axis)" stroke-width="1.3"/>
    <text x="98.29" y="369" text-anchor="middle" class="sm dim">braking</text>
    <text x="162.1" y="369" text-anchor="middle" class="sm dim">cornering</text>
    <text x="225.9" y="369" text-anchor="middle" class="sm dim">night</text>
    <text x="289.71" y="369" text-anchor="middle" class="sm dim">mileage</text>
  </g>
</svg>
