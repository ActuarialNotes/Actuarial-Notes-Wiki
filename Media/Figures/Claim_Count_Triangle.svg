<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A claim-count development triangle beside the severity it makes computable</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Counts separate more claims from</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">costlier ones</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Ultimate Counts = N_n × CDF_count(n → ult)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Severity = Ultimate Losses / Ultimate Counts</text>
  <text x="180" y="110" text-anchor="middle" class="sm dim">cumulative reported claim counts</text>
  <text x="98" y="132" text-anchor="middle" class="sm dim">12</text>
  <text x="150" y="132" text-anchor="middle" class="sm dim">24</text>
  <text x="202" y="132" text-anchor="middle" class="sm dim">36</text>
  <text x="254" y="132" text-anchor="middle" class="sm dim">48</text>
  <text x="306" y="132" text-anchor="middle" class="sm dim">60</text>
  <text x="66" y="157.5" text-anchor="end" class="sm dim">2020</text>
  <text x="98" y="157.5" text-anchor="middle" class="sm">620</text>
  <text x="150" y="157.5" text-anchor="middle" class="sm">806</text>
  <text x="202" y="157.5" text-anchor="middle" class="sm">858</text>
  <text x="254" y="157.5" text-anchor="middle" class="sm">877</text>
  <text x="306" y="157.5" text-anchor="middle" class="sm">886</text>
  <text x="66" y="184.5" text-anchor="end" class="sm dim">2021</text>
  <text x="98" y="184.5" text-anchor="middle" class="sm">640</text>
  <text x="150" y="184.5" text-anchor="middle" class="sm">832</text>
  <text x="202" y="184.5" text-anchor="middle" class="sm">886</text>
  <text x="254" y="184.5" text-anchor="middle" class="sm">906</text>
  <text x="66" y="211.5" text-anchor="end" class="sm dim">2022</text>
  <text x="98" y="211.5" text-anchor="middle" class="sm">660</text>
  <text x="150" y="211.5" text-anchor="middle" class="sm">858</text>
  <text x="202" y="211.5" text-anchor="middle" class="sm">914</text>
  <text x="66" y="238.5" text-anchor="end" class="sm dim">2023</text>
  <text x="98" y="238.5" text-anchor="middle" class="sm">680</text>
  <text x="150" y="238.5" text-anchor="middle" class="sm">884</text>
  <text x="66" y="265.5" text-anchor="end" class="sm dim">2024</text>
  <text x="98" y="265.5" text-anchor="middle" class="sm">700</text>
  <text x="180" y="300" text-anchor="middle" class="sm dim">age in months →</text>
  <text x="180" y="332" text-anchor="middle" class="sm">AY 2024: 700 × 1.429 = 1,000 ultimate claims</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">2,850,000 / 1,000 = $2,850 average severity</text>
</svg>
