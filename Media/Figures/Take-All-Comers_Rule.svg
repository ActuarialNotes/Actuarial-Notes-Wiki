<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An applicant who meets the filed rules must be written at the filed rate; one who fails them may be declined</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Meet the filed rules and the insurer</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">must write you</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Compulsory product ⇒ compulsory offer</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">at the filed rate, on the filed rules</text>
  <rect x="55" y="90" width="250" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="108" text-anchor="middle" class="sm">applicant for compulsory auto</text>
  <text x="180" y="142" text-anchor="middle" class="sm dim">does the applicant meet the filed rules?</text>
  <line x1="180" y1="152" x2="106" y2="178" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="180" y1="152" x2="254" y2="178" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <text x="120" y="172" text-anchor="middle" class="sm bold" fill="#059669">yes</text>
  <text x="240" y="172" text-anchor="middle" class="sm bold" fill="#d97706">no</text>
  <rect x="38" y="190" width="130" height="76" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="103" y="222" text-anchor="middle" class="sm">must write</text>
  <text x="103" y="240" text-anchor="middle" class="sm dim">at the filed rate</text>
  <rect x="192" y="190" width="130" height="76" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="257" y="222" text-anchor="middle" class="sm">may decline</text>
  <text x="257" y="240" text-anchor="middle" class="sm dim">rule must be filed</text>
  <line x1="257" y1="268" x2="257" y2="292" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="187" y="294" width="140" height="24" rx="12.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="257" y="310" text-anchor="middle" class="sm">Facility Association</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">so an insurer cannot underwrite its way out of</text>
  <text x="180" y="360" text-anchor="middle" class="sm dim">an inadequate approved rate — it must file for more</text>
  <text x="180" y="384" text-anchor="middle" class="sm dim">refusing to quote is a market-conduct offence</text>
</svg>
