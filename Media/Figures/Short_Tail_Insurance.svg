<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A short-tail reporting pattern already 94% reported at 12 months and complete by 36, beside a long-tail pattern still climbing</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="119.6" y1="94" x2="119.6" y2="344" class="grid"/>
    <line x1="169.2" y1="94" x2="169.2" y2="344" class="grid"/>
    <line x1="218.8" y1="94" x2="218.8" y2="344" class="grid"/>
    <line x1="268.4" y1="94" x2="268.4" y2="344" class="grid"/>
    <line x1="318" y1="94" x2="318" y2="344" class="grid"/>
    <line x1="70" y1="344" x2="318" y2="344" class="grid"/>
    <line x1="70" y1="228.26" x2="318" y2="228.26" class="grid"/>
    <line x1="70" y1="112.52" x2="318" y2="112.52" class="grid"/>
    <line x1="70" y1="344" x2="328" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="70" y1="344" x2="70" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="119.6" y1="344" x2="119.6" y2="348" class="tick"/>
    <text x="119.6" y="360" text-anchor="middle" class="sm dim">12</text>
    <line x1="169.2" y1="344" x2="169.2" y2="348" class="tick"/>
    <text x="169.2" y="360" text-anchor="middle" class="sm dim">24</text>
    <line x1="218.8" y1="344" x2="218.8" y2="348" class="tick"/>
    <text x="218.8" y="360" text-anchor="middle" class="sm dim">36</text>
    <line x1="268.4" y1="344" x2="268.4" y2="348" class="tick"/>
    <text x="268.4" y="360" text-anchor="middle" class="sm dim">48</text>
    <line x1="318" y1="344" x2="318" y2="348" class="tick"/>
    <text x="318" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="66" y1="344" x2="70" y2="344" class="tick"/>
    <text x="62" y="347.6" text-anchor="end" class="sm dim">0%</text>
    <line x1="66" y1="228.26" x2="70" y2="228.26" class="tick"/>
    <text x="62" y="231.86" text-anchor="end" class="sm dim">50%</text>
    <line x1="66" y1="112.52" x2="70" y2="112.52" class="tick"/>
    <text x="62" y="116.12" text-anchor="end" class="sm dim">100%</text>
    <text x="318" y="376" text-anchor="end" class="sm dim">age in months</text>
    <polyline points="119.6,222.24 169.2,161.36 218.8,131.96 268.4,119.23 318,114.83" class="curve dash" stroke="var(--dim)" stroke-width="1.6"/>
    <polyline points="119.6,126.41 169.2,114.83 218.8,112.52 268.4,112.52 318,112.52" class="curve" stroke="#059669" stroke-width="2.4"/>
    <circle cx="119.6" cy="126.41" r="3" fill="#059669"/>
    <circle cx="169.2" cy="114.83" r="3" fill="#059669"/>
    <circle cx="218.8" cy="112.52" r="3" fill="#059669"/>
    <circle cx="268.4" cy="112.52" r="3" fill="#059669"/>
    <circle cx="318" cy="112.52" r="3" fill="#059669"/>
    <text x="127.6" y="140.41" text-anchor="start" class="sm bold">94%</text>
    <text x="243.6" y="103.52" text-anchor="middle" class="sm bold" fill="#059669">short tail</text>
    <text x="194" y="200.48" text-anchor="middle" class="sm dim">long tail</text>
  </g>
</svg>
