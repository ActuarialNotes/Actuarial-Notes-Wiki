  <text x="280" y="264" text-anchor="end" class="sm dim">term n</text>
  <text x="70" y="166" text-anchor="start" class="sm dim">a₍ₙ₎</text>
  <text x="424" y="196" text-anchor="middle" class="sm bold">n = −ln(1 − i·PV/P) / ln(1 + i)</text>
  <text x="424" y="218" text-anchor="middle" class="sm dim">invert the annuity factor with logs</text>
  <text x="424" y="244" text-anchor="middle" class="sm dim">A perpetuity is the n → ∞ case</text>
  <text x="424" y="264" text-anchor="middle" class="sm dim">A non-integer n implies a final part payment</text>
</svg>
