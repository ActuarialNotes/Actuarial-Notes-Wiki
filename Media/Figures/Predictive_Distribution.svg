<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A Poisson pmf beside the wider negative binomial that mixing it over a Gamma produces</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Mixing over the posterior widens the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">forecast</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">f(xₙ₊₁ | x) = ∫ f(xₙ₊₁ | θ) π(θ | x) dθ</text>
  <line x1="60" y1="338" x2="326" y2="338" class="axis"/>
  <line x1="60" y1="100" x2="60" y2="338" class="axis"/>
  <line x1="85.16" y1="338" x2="85.16" y2="342" class="tick"/>
  <text x="85.16" y="354" text-anchor="middle" class="sm dim">0</text>
  <line x1="121.11" y1="338" x2="121.11" y2="342" class="tick"/>
  <text x="121.11" y="354" text-anchor="middle" class="sm dim">1</text>
  <line x1="157.05" y1="338" x2="157.05" y2="342" class="tick"/>
  <text x="157.05" y="354" text-anchor="middle" class="sm dim">2</text>
  <line x1="193" y1="338" x2="193" y2="342" class="tick"/>
  <text x="193" y="354" text-anchor="middle" class="sm dim">3</text>
  <line x1="228.95" y1="338" x2="228.95" y2="342" class="tick"/>
  <text x="228.95" y="354" text-anchor="middle" class="sm dim">4</text>
  <line x1="264.89" y1="338" x2="264.89" y2="342" class="tick"/>
  <text x="264.89" y="354" text-anchor="middle" class="sm dim">5</text>
  <line x1="300.84" y1="338" x2="300.84" y2="342" class="tick"/>
  <text x="300.84" y="354" text-anchor="middle" class="sm dim">6</text>
  <line x1="56" y1="338" x2="60" y2="338" class="tick"/>
  <text x="52" y="341.6" text-anchor="end" class="sm dim">0</text>
  <line x1="56" y1="224.67" x2="60" y2="224.67" class="tick"/>
  <text x="52" y="228.27" text-anchor="end" class="sm dim">0.2</text>
  <line x1="56" y1="111.33" x2="60" y2="111.33" class="tick"/>
  <text x="52" y="114.93" text-anchor="end" class="sm dim">0.4</text>
  <rect x="75.16" y="129.53" width="9" height="208.47" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="86.16" y="86.15" width="9" height="251.85" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="111.11" y="129.53" width="9" height="208.47" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="122.11" y="170.1" width="9" height="167.9" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="147.05" y="233.77" width="9" height="104.23" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="158.05" y="254.05" width="9" height="83.95" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="183" y="303.26" width="9" height="34.74" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="194" y="300.69" width="9" height="37.31" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="218.95" y="329.31" width="9" height="8.69" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="229.95" y="322.45" width="9" height="15.55" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="254.89" y="336.26" width="9" height="1.74" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="265.89" y="331.78" width="9" height="6.22" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="290.84" y="337.71" width="9" height="0.29" rx="1.5" fill="var(--dim)" fill-opacity="0.55"/>
  <rect x="301.84" y="335.58" width="9" height="2.42" rx="1.5" fill="#3b82f6" fill-opacity="0.75"/>
  <line x1="170" y1="96" x2="183" y2="96" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="189" y="99.6" text-anchor="start" class="sm">Poisson(1), fixed λ</text>
  <line x1="170" y1="112" x2="183" y2="112" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="189" y="115.6" text-anchor="start" class="sm">predictive, λ ~ Gamma</text>
  <text x="180" y="374" text-anchor="middle" class="sm">same mean 1.0, variance 1.0 vs 1.5</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">parameter uncertainty fattens the tail</text>
</svg>
