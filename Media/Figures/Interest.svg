    <rect x="86.77" y="117.86" width="18.75" height="232.14" rx="2" fill="var(--dim)" fill-opacity="0.3"/>
    <rect x="86.77" y="99.29" width="18.75" height="18.57" rx="2" fill="#d97706" fill-opacity="0.85"/>
