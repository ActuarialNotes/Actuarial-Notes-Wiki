<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="290.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Let m → ∞ and the payments become a stream</text>
  <line x1="142" y1="96" x2="442" y2="96" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="150" y1="92" x2="150" y2="100" class="tick"/>
  <line x1="424" y1="92" x2="424" y2="100" class="tick"/>
  <text x="138" y="100" text-anchor="end" class="sm bold" fill="#3b82f6">m = 4</text>
  <line x1="218.5" y1="96" x2="218.5" y2="74" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="287" y1="96" x2="287" y2="74" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="355.5" y1="96" x2="355.5" y2="74" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="424" y1="96" x2="424" y2="74" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="142" y1="152" x2="442" y2="152" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="150" y1="148" x2="150" y2="156" class="tick"/>
  <line x1="424" y1="148" x2="424" y2="156" class="tick"/>
  <text x="138" y="156" text-anchor="end" class="sm bold" fill="#7c3aed">m = 12</text>
  <line x1="172.83" y1="152" x2="172.83" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="195.67" y1="152" x2="195.67" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="218.5" y1="152" x2="218.5" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="241.33" y1="152" x2="241.33" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="264.17" y1="152" x2="264.17" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="287" y1="152" x2="287" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="309.83" y1="152" x2="309.83" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="332.67" y1="152" x2="332.67" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="355.5" y1="152" x2="355.5" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="378.33" y1="152" x2="378.33" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="401.17" y1="152" x2="401.17" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="424" y1="152" x2="424" y2="130" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="142" y1="208" x2="442" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="150" y1="204" x2="150" y2="212" class="tick"/>
  <text x="150" y="225" text-anchor="middle" class="sm dim">0</text>
  <line x1="424" y1="204" x2="424" y2="212" class="tick"/>
  <text x="424" y="225" text-anchor="middle" class="sm dim">n</text>
  <rect x="150" y="184" width="274" height="24" rx="2" fill="#0d9488" fill-opacity="0.4"/>
  <text x="138" y="212" text-anchor="end" class="sm bold" fill="#0d9488">m → ∞</text>
  <text x="444" y="196" text-anchor="start" class="sm dim">a continuous stream</text>
  <line x1="28" y1="240" x2="532" y2="240" class="rule"/>
  <text x="150" y="262" text-anchor="middle" class="sm bold">ā₍ₙ₎ = ∫₀ⁿ e^(−δt) dt = (1 − vⁿ)/δ</text>
  <text x="150" y="282" text-anchor="middle" class="sm dim">the discount rate i becomes δ</text>
  <text x="412" y="262" text-anchor="middle" class="sm bold">Since δ &lt; i⁽ᵐ⁾ &lt; i</text>
  <text x="412" y="282" text-anchor="middle" class="sm dim">ā₍ₙ₎ is the largest of the three</text>
</svg>
