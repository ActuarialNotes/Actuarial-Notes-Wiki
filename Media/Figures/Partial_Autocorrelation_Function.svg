<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A PACF cutting off after lag 1 beside the ACF of the same AR(1) tailing off</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The direct link at lag k, intervening</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">lags removed</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">φ_kk = Corr(Y_t, Y_{t−k} | Y_{t−1}, …)</text>
  <text x="180" y="104" text-anchor="middle" class="sm bold" fill="var(--dim)">ACF — tails off</text>
  <line x1="62" y1="147.79" x2="324" y2="147.79" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
  <line x1="62" y1="164.21" x2="324" y2="164.21" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
  <line x1="62" y1="156" x2="324" y2="156" class="axis"/>
  <text x="55" y="201.5" text-anchor="end" class="sm dim">-1</text>
  <text x="55" y="159.6" text-anchor="end" class="sm dim">0</text>
  <text x="55" y="117.7" text-anchor="end" class="sm dim">1</text>
  <line x1="81.17" y1="156" x2="81.17" y2="126.25" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="81.17" cy="126.25" r="2.6" fill="var(--dim)"/>
  <line x1="113.12" y1="156" x2="113.12" y2="134.88" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="113.12" cy="134.88" r="2.6" fill="var(--dim)"/>
  <line x1="145.07" y1="156" x2="145.07" y2="141" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="145.07" cy="141" r="2.6" fill="var(--dim)"/>
  <line x1="177.02" y1="156" x2="177.02" y2="145.35" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="177.02" cy="145.35" r="2.6" fill="var(--dim)"/>
  <line x1="208.98" y1="156" x2="208.98" y2="148.44" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="208.98" cy="148.44" r="2.6" fill="var(--dim)"/>
  <line x1="240.93" y1="156" x2="240.93" y2="150.63" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="240.93" cy="150.63" r="2.6" fill="var(--dim)"/>
  <line x1="272.88" y1="156" x2="272.88" y2="152.19" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="272.88" cy="152.19" r="2.6" fill="var(--dim)"/>
  <line x1="304.83" y1="156" x2="304.83" y2="153.29" stroke="var(--dim)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="304.83" cy="153.29" r="2.6" fill="var(--dim)"/>
  <text x="180" y="236" text-anchor="middle" class="sm bold" fill="#7c3aed">PACF — cuts off at 1</text>
  <line x1="62" y1="279.79" x2="324" y2="279.79" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
  <line x1="62" y1="296.21" x2="324" y2="296.21" class="thin dash" stroke="#e11d48" stroke-width="1.1"/>
  <line x1="62" y1="288" x2="324" y2="288" class="axis"/>
  <text x="55" y="333.5" text-anchor="end" class="sm dim">-1</text>
  <text x="55" y="291.6" text-anchor="end" class="sm dim">0</text>
  <text x="55" y="249.7" text-anchor="end" class="sm dim">1</text>
  <line x1="81.17" y1="288" x2="81.17" y2="258.25" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="81.17" cy="258.25" r="2.6" fill="#7c3aed"/>
  <line x1="113.12" y1="288" x2="113.12" y2="290.1" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="113.12" cy="290.1" r="2.6" fill="#7c3aed"/>
  <line x1="145.07" y1="288" x2="145.07" y2="284.65" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="145.07" cy="284.65" r="2.6" fill="#7c3aed"/>
  <line x1="177.02" y1="288" x2="177.02" y2="287.16" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="177.02" cy="287.16" r="2.6" fill="#7c3aed"/>
  <line x1="208.98" y1="288" x2="208.98" y2="289.26" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="208.98" cy="289.26" r="2.6" fill="#7c3aed"/>
  <line x1="240.93" y1="288" x2="240.93" y2="285.9" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="240.93" cy="285.9" r="2.6" fill="#7c3aed"/>
  <line x1="272.88" y1="288" x2="272.88" y2="288.42" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="272.88" cy="288.42" r="2.6" fill="#7c3aed"/>
  <line x1="304.83" y1="288" x2="304.83" y2="286.74" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="304.83" cy="286.74" r="2.6" fill="#7c3aed"/>
  <text x="180" y="214" text-anchor="middle" class="sm dim">ρ₂ = 0.48 only because lag 1 carried it</text>
  <text x="180" y="356" text-anchor="middle" class="sm bold">AR(1): the direct link at lag 2 is zero</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">AR cuts the PACF, MA cuts the ACF</text>
</svg>
