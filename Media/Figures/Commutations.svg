<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A timeline on which the reinsurer's future recoveries, spread over decades, are gathered into one lump sum paid now — while the cedant's claim payments below the line run on to the end of the tail</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah0d9488" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#0d9488"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="46" y1="222" x2="334" y2="222" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="62" y1="218" x2="62" y2="226" class="tick"/>
    <text x="62" y="240" text-anchor="middle" class="sm dim">now</text>
    <line x1="112" y1="222" x2="112" y2="150" class="thin dash" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
    <line x1="112" y1="222" x2="112" y2="340" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <line x1="150" y1="222" x2="150" y2="157" class="thin dash" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
    <line x1="150" y1="222" x2="150" y2="326" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <line x1="188" y1="222" x2="188" y2="164" class="thin dash" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
    <line x1="188" y1="222" x2="188" y2="312" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <line x1="226" y1="222" x2="226" y2="171" class="thin dash" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
    <line x1="226" y1="222" x2="226" y2="298" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <line x1="264" y1="222" x2="264" y2="178" class="thin dash" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
    <line x1="264" y1="222" x2="264" y2="284" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <line x1="302" y1="222" x2="302" y2="185" class="thin dash" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
    <line x1="302" y1="222" x2="302" y2="270" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <text x="226" y="132" text-anchor="middle" class="sm">recoveries</text>
    <text x="112" y="358" text-anchor="middle" class="sm">the tail</text>
    <line x1="62" y1="222" x2="62" y2="90" class="thin" stroke="#059669" stroke-width="3.2" marker-end="url(#ah059669)"/>
    <text x="72" y="96" text-anchor="start" class="sm bold">lump sum</text>
    <path d="M188,142 Q146,106 72,126" class="thin" stroke="#059669" stroke-width="1.4"/>
    <line x1="80.88" y1="123.6" x2="72" y2="126" class="thin" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
  </g>
</svg>
