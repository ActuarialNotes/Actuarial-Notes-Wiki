<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A random number of claims of random size summing to the aggregate loss</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A random count of random claim sizes</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">S = X₁ + ⋯ + X_N</text>
  <text x="180" y="100" text-anchor="middle" class="sm dim">N ~ Poisson(λ)  draws the count</text>
  <rect x="46" y="163" width="38" height="51" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="65" y="229" text-anchor="middle" class="sm dim">X₁</text>
  <rect x="102" y="187" width="38" height="27" rx="3" fill="#d97706" fill-opacity="0.6"/>
  <text x="121" y="229" text-anchor="middle" class="sm dim">X₂</text>
  <rect x="158" y="136" width="38" height="78" rx="3" fill="#059669" fill-opacity="0.6"/>
  <text x="177" y="229" text-anchor="middle" class="sm dim">X₃</text>
  <rect x="214" y="175" width="38" height="39" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <text x="233" y="229" text-anchor="middle" class="sm dim">X₄</text>
  <rect x="270" y="152.5" width="38" height="61.5" rx="3" fill="#e11d48" fill-opacity="0.6"/>
  <text x="289" y="229" text-anchor="middle" class="sm dim">X₅</text>
  <line x1="38" y1="214" x2="322" y2="214" class="axis"/>
  <text x="180" y="258" text-anchor="middle" class="sm dim">N = 5 this year — next year it is a different N</text>
  <rect x="70" y="288" width="220" height="34" rx="6" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4"/>
  <text x="180" y="310" text-anchor="middle" class="bold" fill="#059669">S = 171</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">E[S] = E[N]E[X];  both vary</text>
</svg>
