  <circle cx="122" cy="284.6" r="3.4" fill="#3b82f6"/>
  <circle cx="172" cy="243.2" r="3.4" fill="#3b82f6"/>
  <circle cx="222" cy="201.8" r="3.4" fill="#3b82f6"/>
  <circle cx="272" cy="160.4" r="3.4" fill="#3b82f6"/>
  <text x="224.5" y="185.24" text-anchor="end" class="sm bold" fill="#3b82f6">360 per car-year</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">earned exposures (car-years)</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">proportional, practical, verifiable,</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">and not manipulable by the insured</text>
