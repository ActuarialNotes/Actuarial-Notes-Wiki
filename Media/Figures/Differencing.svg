<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A trending series turned stationary by taking first differences</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Differences remove the trend</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">∇Y_t = Y_t − Y_{t−1} = (1 − B)Y_t</text>
  <text x="180" y="102" text-anchor="middle" class="sm bold" fill="#e11d48">Y_t — trending, non-stationary</text>
  <rect x="56" y="110" width="268" height="86" rx="5" fill="var(--soft)" stroke="var(--edge)"/>
  <polyline points="56,184.62 61.7,183.86 67.4,181.76 73.11,179.35 78.81,176.29 84.51,174.37 90.21,173.53 95.91,172.43 101.62,169.65 107.32,168.65 113.02,167.79 118.72,165.77 124.43,161.74 130.13,159.64 135.83,159.57 141.53,154.74 147.23,152.33 152.94,152.02 158.64,152.22 164.34,152.9 170.04,153.59 175.74,153.95 181.45,153.02 187.15,153.36 192.85,152 198.55,150.52 204.26,151.28 209.96,152.39 215.66,152.24 221.36,151.24 227.06,147.48 232.77,147.11 238.47,147.4 244.17,146.48 249.87,144.67 255.57,141.76 261.28,139.81 266.98,137.24 272.68,134.4 278.38,133.53 284.09,130.63 289.79,128.98 295.49,128.12 301.19,126.52 306.89,122.56 312.6,122.56 318.3,121.82 324,121.38" class="curve" stroke="#e11d48" stroke-width="1.7"/>
  <text x="180" y="234" text-anchor="middle" class="sm bold" fill="#059669">∇Y_t — stationary</text>
  <rect x="56" y="242" width="268" height="86" rx="5" fill="var(--soft)" stroke="var(--edge)"/>
  <line x1="56" y1="304.77" x2="324" y2="304.77" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <polyline points="56,296.75 61.83,282.45 67.65,279.14 73.48,272.23 79.3,284.34 85.13,295.77 90.96,293.1 96.78,275.21 102.61,294.16 108.43,295.61 114.26,283.3 120.09,261.89 125.91,282.51 131.74,304.02 137.57,253.38 143.39,279.15 149.22,301.49 155.04,306.84 160.87,312.04 166.7,312.08 172.52,308.61 178.35,294.92 184.17,308.39 190,290.24 195.83,289.06 201.65,312.84 207.48,316.62 213.3,303.14 219.13,294.17 224.96,264.8 230.78,300.84 236.61,307.8 242.43,295.04 248.26,285.48 254.09,273.92 259.91,283.94 265.74,277.53 271.57,274.55 277.39,295.46 283.22,273.97 289.04,287.25 294.87,295.62 300.7,287.72 306.52,262.72 312.35,304.7 318.17,296.96 324,300.11" class="curve" stroke="#059669" stroke-width="1.7"/>
  <text x="180" y="372" text-anchor="middle" class="sm dim">d = 1 for a linear trend, 2 for a quadratic</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">over-differencing injects a negative MA(1)</text>
</svg>
