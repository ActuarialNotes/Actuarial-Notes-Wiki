<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The GMM revenue build-up for year one of the running group, component by component</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Built from what was released, not from</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">premium</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Revenue = expected claims + RA released</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">+ CSM released + acquisition</text>
  <rect x="66.19" y="167.47" width="36.12" height="86.53" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
  <text x="84.25" y="159.47" text-anchor="middle" class="sm">17.6</text>
  <text x="84.25" y="269" text-anchor="middle" class="sm dim">claims</text>
  <rect x="130.69" y="157.63" width="36.12" height="9.83" rx="3" fill="#7c3aed" fill-opacity="0.72"/>
  <text x="148.75" y="149.63" text-anchor="middle" class="sm">2.0</text>
  <text x="148.75" y="269" text-anchor="middle" class="sm dim">RA</text>
  <rect x="195.19" y="136" width="36.12" height="21.63" rx="3" fill="#059669" fill-opacity="0.72"/>
  <text x="213.25" y="128" text-anchor="middle" class="sm">4.4</text>
  <text x="213.25" y="269" text-anchor="middle" class="sm dim">CSM</text>
  <rect x="259.69" y="136" width="36.12" height="118" rx="3" fill="#0d9488" fill-opacity="0.72"/>
  <text x="277.75" y="128" text-anchor="middle" class="sm">24.0</text>
  <text x="277.75" y="269" text-anchor="middle" class="sm dim">revenue</text>
  <line x1="46" y1="254" x2="316" y2="254" class="axis"/>
  <text x="180" y="292" text-anchor="middle" class="sm dim">$M — year 1 of the running group, 40% of coverage</text>
  <line x1="30" y1="312" x2="330" y2="312" class="rule"/>
  <text x="38" y="334" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="334" text-anchor="start" class="sm">deposit components are excluded</text>
  <text x="38" y="358" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="358" text-anchor="start" class="sm">ceded premium is not deducted from it</text>
  <text x="38" y="382" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="54" y="382" text-anchor="start" class="sm">under the PAA it is simply premium earned</text>
</svg>
