  <text x="180" y="430" text-anchor="middle" class="fml">PV(A) = PV(L),  D(A) = D(L),  C(A) &gt; C(L)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">ΔS ≈ ½ (C_A − C_L) V (Δj)² ≥ 0</text>
