<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" width="560" height="296" role="img">
  <title>Portfolio duration as the value-weighted average of its holdings</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="294.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A portfolio's duration is its value-weighted average</text>
  <text x="126" y="109" text-anchor="end" class="sm bold">Short bond</text>
  <rect x="138" y="92" width="64.8" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="170.4" y="109" text-anchor="middle" class="sm bold">300k</text>
  <text x="374" y="109" text-anchor="start" class="sm">D = 2.1</text>
  <text x="126" y="155" text-anchor="end" class="sm bold">Medium bond</text>
  <rect x="138" y="138" width="108" height="26" rx="4" fill="#7c3aed" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="192" y="155" text-anchor="middle" class="sm bold">500k</text>
  <text x="374" y="155" text-anchor="start" class="sm">D = 6.4</text>
  <text x="126" y="201" text-anchor="end" class="sm bold">Long bond</text>
  <rect x="138" y="184" width="43.2" height="26" rx="4" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.2"/>
  <text x="159.6" y="201" text-anchor="middle" class="sm bold">200k</text>
  <text x="374" y="201" text-anchor="start" class="sm">D = 14.2</text>
  <line x1="44" y1="236" x2="444" y2="236" class="rule"/>
  <text x="126" y="258" text-anchor="end" class="sm bold">Portfolio</text>
  <text x="246" y="258" text-anchor="middle" class="sm bold">1,000k</text>
  <text x="374" y="258" text-anchor="start" class="sm bold" fill="#059669">D = 6.67</text>
  <line x1="28" y1="258" x2="532" y2="258" class="rule"/>
  <text x="150" y="278" text-anchor="middle" class="sm bold">D_port = Σ Pᵢ Dᵢ / Σ Pᵢ</text>
  <text x="412" y="278" text-anchor="middle" class="sm bold">Convexity averages the same way</text>
</svg>
