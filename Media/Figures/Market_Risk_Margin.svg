<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Asset and liability durations for a matched and a mismatched insurer on one scale — only the mismatched one's excess asset duration, shaded, attracts an interest rate charge</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="40" y="94" text-anchor="start" class="sm bold">matched</text>
    <rect x="40" y="102" width="115.6" height="30" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="48" y="121" text-anchor="start" class="sm">assets</text>
    <rect x="40" y="140" width="115.6" height="30" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="48" y="159" text-anchor="start" class="sm">liabilities</text>
    <text x="40" y="222" text-anchor="start" class="sm bold">mismatched</text>
    <rect x="40" y="230" width="115.6" height="30" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="48" y="249" text-anchor="start" class="sm">assets</text>
    <rect x="40" y="268" width="115.6" height="30" rx="3" fill="#d97706" fill-opacity="0.55"/>
    <text x="48" y="287" text-anchor="start" class="sm">liabilities</text>
    <rect x="155.6" y="230" width="129.2" height="30" rx="3" fill="#e11d48" fill-opacity="0.6"/>
    <line x1="155.6" y1="224" x2="155.6" y2="304" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="220.2" y="249" text-anchor="middle" class="sm bold">mismatch</text>
    <line x1="40" y1="352" x2="332" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="40" y1="352" x2="40" y2="356" class="tick"/>
    <text x="40" y="369" text-anchor="middle" class="sm dim">0</text>
    <line x1="108" y1="352" x2="108" y2="356" class="tick"/>
    <text x="108" y="369" text-anchor="middle" class="sm dim">2</text>
    <line x1="176" y1="352" x2="176" y2="356" class="tick"/>
    <text x="176" y="369" text-anchor="middle" class="sm dim">4</text>
    <line x1="244" y1="352" x2="244" y2="356" class="tick"/>
    <text x="244" y="369" text-anchor="middle" class="sm dim">6</text>
    <line x1="312" y1="352" x2="312" y2="356" class="tick"/>
    <text x="312" y="369" text-anchor="middle" class="sm dim">8</text>
    <text x="332" y="386" text-anchor="end" class="sm dim">duration</text>
  </g>
</svg>
