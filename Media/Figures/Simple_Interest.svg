  <line x1="192" y1="192" x2="192" y2="196" class="tick"/>
  <text x="192" y="208" text-anchor="middle" class="sm dim">5</text>
  <line x1="326" y1="192" x2="326" y2="196" class="tick"/>
  <text x="326" y="208" text-anchor="middle" class="sm dim">10</text>
  <line x1="54" y1="185" x2="58" y2="185" class="tick"/>
  <text x="50" y="188.6" text-anchor="end" class="sm dim">1</text>
  <line x1="54" y1="115" x2="58" y2="115" class="tick"/>
  <text x="50" y="118.6" text-anchor="end" class="sm dim">2</text>
  <text x="326" y="224" text-anchor="end" class="sm dim">years</text>
  <text x="54" y="52" text-anchor="start" class="sm dim">a(t)</text>
  <line x1="66" y1="78" x2="79" y2="78" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="81.6" text-anchor="start" class="sm">simple: 1 + it</text>
  <line x1="66" y1="94" x2="79" y2="94" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="97.6" text-anchor="start" class="sm">compound: (1 + i)ᵗ</text>
  <text x="283.12" y="94" text-anchor="middle" class="sm dim">the gap is</text>
  <text x="283.12" y="103.8" text-anchor="middle" class="sm dim">interest on interest</text>
  <text x="432" y="96" text-anchor="middle" class="sm bold">A(t) = P (1 + i t)</text>
  <line x1="340" y1="116" x2="340" y2="148" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="128" text-anchor="start" class="sm bold">Linear in t</text>
  <text x="350" y="144" text-anchor="start" class="sm dim">each year adds the same P·i</text>
  <line x1="340" y1="162" x2="340" y2="194" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="174" text-anchor="start" class="sm bold">Equal at t = 1</text>
  <text x="350" y="190" text-anchor="start" class="sm dim">they agree after one period</text>
  <line x1="340" y1="208" x2="340" y2="240" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="220" text-anchor="start" class="sm bold">Short-term use</text>
  <text x="350" y="236" text-anchor="start" class="sm dim">T-bills, part-period conventions</text>
  <text x="280" y="256" text-anchor="middle" class="sm dim">Below one period, simple interest is the larger of the two</text>
</svg>
