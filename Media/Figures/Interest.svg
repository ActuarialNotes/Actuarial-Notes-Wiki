<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Interest charged on the declining balance, period by period</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Interest is charged on whatever is still</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">owed</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">I_k = i · OB₍ₖ₋₁₎</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">never on the original loan amount</text>
  <rect x="87.07" y="131.82" width="18.15" height="218.18" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="87.07" y="175.45" width="18.15" height="174.55" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="117.32" y="152.33" width="18.15" height="197.67" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="117.32" y="191.86" width="18.15" height="158.14" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="147.56" y="174.48" width="18.15" height="175.52" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="147.56" y="209.59" width="18.15" height="140.41" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="177.8" y="198.41" width="18.15" height="151.59" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="177.8" y="228.73" width="18.15" height="121.27" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="208.05" y="224.25" width="18.15" height="125.75" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="208.05" y="249.4" width="18.15" height="100.6" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="238.29" y="252.16" width="18.15" height="97.84" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="238.29" y="271.72" width="18.15" height="78.28" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="268.54" y="282.3" width="18.15" height="67.7" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="268.54" y="295.84" width="18.15" height="54.16" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <rect x="298.78" y="314.85" width="18.15" height="35.15" rx="2" fill="var(--dim)" fill-opacity="0.2"/>
  <rect x="298.78" y="321.88" width="18.15" height="28.12" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <line x1="78" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="100" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="96.15" y1="350" x2="96.15" y2="354" class="tick"/>
  <text x="96.15" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="126.39" y1="350" x2="126.39" y2="354" class="tick"/>
  <text x="126.39" y="366" text-anchor="middle" class="sm dim">2</text>
  <line x1="156.63" y1="350" x2="156.63" y2="354" class="tick"/>
  <text x="156.63" y="366" text-anchor="middle" class="sm dim">3</text>
  <line x1="186.88" y1="350" x2="186.88" y2="354" class="tick"/>
  <text x="186.88" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="217.12" y1="350" x2="217.12" y2="354" class="tick"/>
  <text x="217.12" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="247.37" y1="350" x2="247.37" y2="354" class="tick"/>
  <text x="247.37" y="366" text-anchor="middle" class="sm dim">6</text>
  <line x1="277.61" y1="350" x2="277.61" y2="354" class="tick"/>
  <text x="277.61" y="366" text-anchor="middle" class="sm dim">7</text>
  <line x1="307.85" y1="350" x2="307.85" y2="354" class="tick"/>
  <text x="307.85" y="366" text-anchor="middle" class="sm dim">8</text>
  <line x1="74" y1="350" x2="78" y2="350" class="tick"/>
  <text x="70" y="353.6" text-anchor="end" class="sm dim">0</text>
  <line x1="74" y1="240.91" x2="78" y2="240.91" class="tick"/>
  <text x="70" y="244.51" text-anchor="end" class="sm dim">5,000</text>
  <line x1="74" y1="131.82" x2="78" y2="131.82" class="tick"/>
  <text x="70" y="135.42" text-anchor="end" class="sm dim">10,000</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">period</text>
  <line x1="62" y1="92" x2="75" y2="92" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="81" y="95.6" text-anchor="start" class="sm">balance OB₍ₖ₋₁₎</text>
  <line x1="62" y1="108" x2="75" y2="108" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="81" y="111.6" text-anchor="start" class="sm">interest I_k (×10)</text>
</svg>
