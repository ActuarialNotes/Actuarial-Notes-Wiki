    <rect x="260" y="223.6" width="60" height="8.4" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="290" y="250" text-anchor="middle" class="bold">OSFI</text>
    <line x1="160" y1="286" x2="268" y2="232" class="thin" stroke="#e11d48" stroke-width="2" marker-end="url(#ahe11d48)"/>
    <text x="236" y="290" text-anchor="middle" class="sm">escalates</text>
