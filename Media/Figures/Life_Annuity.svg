<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Annual payments continuing only while the annuitant is alive</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Pay 1 a year while (x) is alive</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">äₓ = Σ vᵏ · ₖpₓ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">aₓ = äₓ − 1</text>
  <line x1="36" y1="275" x2="328" y2="275" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="46" y1="271" x2="46" y2="279" class="tick"/>
  <text x="46" y="293" text-anchor="middle" class="sm dim">0</text>
  <line x1="90" y1="271" x2="90" y2="279" class="tick"/>
  <text x="90" y="293" text-anchor="middle" class="sm dim">1</text>
  <line x1="134" y1="271" x2="134" y2="279" class="tick"/>
  <text x="134" y="293" text-anchor="middle" class="sm dim">2</text>
  <line x1="178" y1="271" x2="178" y2="279" class="tick"/>
  <text x="178" y="293" text-anchor="middle" class="sm dim">3</text>
  <line x1="222" y1="271" x2="222" y2="279" class="tick"/>
  <text x="222" y="293" text-anchor="middle" class="sm dim">4</text>
  <line x1="266" y1="271" x2="266" y2="279" class="tick"/>
  <text x="266" y="293" text-anchor="middle" class="sm dim">5</text>
  <line x1="310" y1="271" x2="310" y2="279" class="tick"/>
  <text x="310" y="293" text-anchor="middle" class="sm dim">…</text>
  <line x1="46" y1="269" x2="46" y2="187" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="46" y="179" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="46" y="165" text-anchor="middle" class="sm dim">1.00</text>
  <line x1="90" y1="269" x2="90" y2="188.86" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="90" y="180.86" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="90" y="166.86" text-anchor="middle" class="sm dim">0.97</text>
  <line x1="134" y1="269" x2="134" y2="191.34" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="134" y="183.34" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="134" y="169.34" text-anchor="middle" class="sm dim">0.93</text>
  <line x1="178" y1="269" x2="178" y2="194.44" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="178" y="186.44" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="178" y="172.44" text-anchor="middle" class="sm dim">0.88</text>
  <line x1="222" y1="269" x2="222" y2="198.78" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="222" y="190.78" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="222" y="176.78" text-anchor="middle" class="sm dim">0.81</text>
  <line x1="266" y1="269" x2="266" y2="204.36" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="266" y="196.36" text-anchor="middle" class="sm bold" fill="#3b82f6">1</text>
  <text x="266" y="182.36" text-anchor="middle" class="sm dim">0.72</text>
  <text x="180" y="96" text-anchor="middle" class="sm dim">each payment weighted by ₖpₓ</text>
</svg>
