<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A weighted average moving because the weights moved</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The average moves when only the weights</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">do</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Aggregate LR = Σ wᵢ × LRᵢ</text>
  <line x1="116.33" y1="114" x2="116.33" y2="304" class="grid"/>
  <line x1="197" y1="114" x2="197" y2="304" class="grid"/>
  <line x1="277.67" y1="114" x2="277.67" y2="304" class="grid"/>
  <line x1="76" y1="304" x2="318" y2="304" class="grid"/>
  <line x1="76" y1="217.64" x2="318" y2="217.64" class="grid"/>
  <line x1="76" y1="131.27" x2="318" y2="131.27" class="grid"/>
  <line x1="76" y1="304" x2="328" y2="304" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="304" x2="76" y2="104" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="116.33" y1="304" x2="116.33" y2="308" class="tick"/>
  <text x="116.33" y="320" text-anchor="middle" class="sm dim">Terr 1</text>
  <line x1="197" y1="304" x2="197" y2="308" class="tick"/>
  <text x="197" y="320" text-anchor="middle" class="sm dim">Terr 2</text>
  <line x1="277.67" y1="304" x2="277.67" y2="308" class="tick"/>
  <text x="277.67" y="320" text-anchor="middle" class="sm dim">Terr 3</text>
  <line x1="72" y1="304" x2="76" y2="304" class="tick"/>
  <text x="68" y="307.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="72" y1="217.64" x2="76" y2="217.64" class="tick"/>
  <text x="68" y="221.24" text-anchor="end" class="sm dim">25%</text>
  <line x1="72" y1="131.27" x2="76" y2="131.27" class="tick"/>
  <text x="68" y="134.87" text-anchor="end" class="sm dim">50%</text>
  <rect x="89.52" y="148.55" width="25.81" height="155.45" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="117.33" y="217.64" width="25.81" height="86.36" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="170.19" y="183.09" width="25.81" height="120.91" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="198" y="183.09" width="25.81" height="120.91" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="250.85" y="234.91" width="25.81" height="69.09" rx="2" fill="var(--dim)" fill-opacity="0.45"/>
  <rect x="278.67" y="165.82" width="25.81" height="138.18" rx="2" fill="#3b82f6" fill-opacity="0.72"/>
  <line x1="66" y1="108" x2="79" y2="108" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="111.6" text-anchor="start" class="sm">2022 mix</text>
  <line x1="178" y1="108" x2="191" y2="108" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="197" y="111.6" text-anchor="start" class="sm">2024 mix</text>
  <text x="180" y="334" text-anchor="middle" class="sm dim">share of the book, by territory</text>
  <text x="180" y="358" text-anchor="middle" class="sm bold">aggregate loss ratio 69.5% → 76.1%</text>
  <text x="180" y="380" text-anchor="middle" class="sm dim">with every territory's own ratio unchanged</text>
</svg>
