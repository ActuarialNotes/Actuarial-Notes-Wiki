  <text x="180" y="40" text-anchor="middle" class="ttl">An unbiased estimator centres on θ</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">E[θ̂] = θ</text>
