    <rect x="281.54" y="242.36" width="4.56" height="3.8" fill="#d97706" fill-opacity="0.55"/>
    <rect x="289.9" y="242.36" width="4.56" height="3.8" fill="#d97706" fill-opacity="0.55"/>
    <text x="288" y="272" text-anchor="middle" class="sm bold">business lost</text>
    <rect x="164" y="350" width="32" height="6" fill="#7c3aed" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="180" cy="356" rx="16" ry="3.4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/>
    <ellipse cx="180" cy="350" rx="16" ry="3.4" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.2"/>
    <ellipse cx="180" cy="350" rx="16" ry="3.4" fill="#7c3aed" fill-opacity="0.3" stroke="none"/>
    <rect x="164" y="344" width="32" height="6" fill="#7c3aed" fill-opacity="0.25" stroke="none"/>
