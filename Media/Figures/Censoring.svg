<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Six claims drawn as bars from zero: four observed in full, two stopped at the policy limit with their true size unknown</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="40" y1="322.74" x2="336" y2="322.74" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="40" y1="344" x2="40" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="40" y1="322.74" x2="40" y2="326.74" class="tick"/>
    <text x="40" y="338.74" text-anchor="middle" class="sm dim">0</text>
    <line x1="97.2" y1="322.74" x2="97.2" y2="326.74" class="tick"/>
    <text x="97.2" y="338.74" text-anchor="middle" class="sm dim">2</text>
    <line x1="154.4" y1="322.74" x2="154.4" y2="326.74" class="tick"/>
    <text x="154.4" y="338.74" text-anchor="middle" class="sm dim">4</text>
    <line x1="211.6" y1="322.74" x2="211.6" y2="326.74" class="tick"/>
    <text x="211.6" y="338.74" text-anchor="middle" class="sm dim">6</text>
    <line x1="268.8" y1="322.74" x2="268.8" y2="326.74" class="tick"/>
    <text x="268.8" y="338.74" text-anchor="middle" class="sm dim">8</text>
    <line x1="326" y1="322.74" x2="326" y2="326.74" class="tick"/>
    <text x="326" y="338.74" text-anchor="middle" class="sm dim">10</text>
    <text x="326" y="354.74" text-anchor="end" class="sm dim">claim size (000s)</text>
    <line x1="211.6" y1="344" x2="211.6" y2="103.09" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
    <text x="211.6" y="97.09" text-anchor="middle" class="sm">policy limit u</text>
    <polyline points="40,124.34 137.24,124.34" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="137.24" cy="124.34" r="3.6" fill="#3b82f6"/>
    <polyline points="40,158 185.86,158" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="185.86" cy="158" r="3.6" fill="#3b82f6"/>
    <polyline points="40,191.66 211.6,191.66" class="curve" stroke="#e11d48" stroke-width="2"/>
    <circle cx="211.6" cy="191.66" r="3.6" fill="#e11d48"/>
    <text x="233.6" y="195.66" text-anchor="middle" class="sm" fill="#e11d48">→ ?</text>
    <polyline points="40,225.31 102.92,225.31" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="102.92" cy="225.31" r="3.6" fill="#3b82f6"/>
    <polyline points="40,258.97 211.6,258.97" class="curve" stroke="#e11d48" stroke-width="2"/>
    <circle cx="211.6" cy="258.97" r="3.6" fill="#e11d48"/>
    <text x="233.6" y="262.97" text-anchor="middle" class="sm" fill="#e11d48">→ ?</text>
    <polyline points="40,292.63 165.84,292.63" class="curve" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="165.84" cy="292.63" r="3.6" fill="#3b82f6"/>
  </g>
</svg>
