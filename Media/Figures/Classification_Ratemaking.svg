<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Class relativities measured against the base class's pure premium</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Each class pays its own expected cost</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Relativity_i = PP_i / PP_base</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Rate_i = Base Rate × ∏ R_i,k</text>
  <text x="164" y="128" text-anchor="end" class="sm">Youthful</text>
  <rect x="172" y="114" width="119.95" height="22" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="298.95" y="128" text-anchor="start" class="sm">1.70</text>
  <text x="164" y="172" text-anchor="end" class="sm">Adult single</text>
  <rect x="172" y="158" width="77.62" height="22" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="256.62" y="172" text-anchor="start" class="sm">1.10</text>
  <text x="164" y="216" text-anchor="end" class="sm bold">Adult married</text>
  <rect x="172" y="202" width="70.56" height="22" rx="3" fill="#3b82f6" fill-opacity="0.7"/>
  <text x="249.56" y="216" text-anchor="start" class="sm">1.00</text>
  <text x="164" y="260" text-anchor="end" class="sm">Mature</text>
  <rect x="172" y="246" width="56.45" height="22" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="235.45" y="260" text-anchor="start" class="sm">0.80</text>
  <text x="164" y="304" text-anchor="end" class="sm">Senior</text>
  <rect x="172" y="290" width="45.86" height="22" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="224.86" y="304" text-anchor="start" class="sm">0.65</text>
  <line x1="242.56" y1="108" x2="242.56" y2="336" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="180" y="356" text-anchor="middle" class="sm dim">the base class is a choice of denominator —</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">it changes the factors, not anyone's premium</text>
</svg>
