<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Many uneconomic claims aggregated into one action, gated by certification</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Certification is the whole exposure</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Many small claims → one action</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">binding everyone who does not opt out</text>
  <circle cx="52" cy="110" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="72" cy="110" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="92" cy="110" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="112" cy="110" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="132" cy="110" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="152" cy="110" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="52" cy="132" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="72" cy="132" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="92" cy="132" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="112" cy="132" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="132" cy="132" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <circle cx="152" cy="132" r="6" fill="#3b82f6" fill-opacity="0.55"/>
  <line x1="178" y1="122" x2="216" y2="122" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <rect x="224" y="108" width="104" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="276" y="126" text-anchor="middle" class="sm">one action</text>
  <text x="180" y="162" text-anchor="middle" class="sm dim">each claim is too small to litigate alone</text>
  <line x1="30" y1="184" x2="330" y2="184" class="rule"/>
  <text x="180" y="206" text-anchor="middle" class="sm bold">certification asks four questions</text>
  <text x="44" y="230" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="60" y="230" text-anchor="start" class="sm">an identifiable class</text>
  <text x="44" y="254" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="60" y="254" text-anchor="start" class="sm">common issues</text>
  <text x="44" y="278" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="60" y="278" text-anchor="start" class="sm">a suitable representative</text>
  <text x="44" y="302" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="60" y="302" text-anchor="start" class="sm">preferable to individual actions</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">reserving is binary around that decision, and</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">the exposure is to a practice, not to an event —</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">so it does not develop like an ordinary claim</text>
</svg>
