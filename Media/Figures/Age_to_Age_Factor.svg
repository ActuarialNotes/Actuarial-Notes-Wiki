    <text x="151" y="330" text-anchor="middle" class="sm bold">2,250</text>
    <line x1="107" y1="94" x2="141" y2="94" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
    <text x="124" y="84" text-anchor="middle" class="sm bold">× 1.500</text>
