<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Observed link ratios falling toward 1.000 until the data ends at 48 months, and the dashed extrapolation beyond it that the 1.010 tail factor stands for</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="94.55" y1="94" x2="94.55" y2="344" class="grid"/>
    <line x1="184.73" y1="94" x2="184.73" y2="344" class="grid"/>
    <line x1="274.91" y1="94" x2="274.91" y2="344" class="grid"/>
    <line x1="72" y1="325.34" x2="320" y2="325.34" class="grid"/>
    <line x1="72" y1="213.4" x2="320" y2="213.4" class="grid"/>
    <line x1="72" y1="101.46" x2="320" y2="101.46" class="grid"/>
    <line x1="72" y1="344" x2="330" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="72" y1="344" x2="72" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="94.55" y1="344" x2="94.55" y2="348" class="tick"/>
    <text x="94.55" y="360" text-anchor="middle" class="sm dim">12</text>
    <line x1="184.73" y1="344" x2="184.73" y2="348" class="tick"/>
    <text x="184.73" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="274.91" y1="344" x2="274.91" y2="348" class="tick"/>
    <text x="274.91" y="360" text-anchor="middle" class="sm dim">108</text>
    <line x1="68" y1="325.34" x2="72" y2="325.34" class="tick"/>
    <text x="64" y="328.94" text-anchor="end" class="sm dim">1.0</text>
    <line x1="68" y1="213.4" x2="72" y2="213.4" class="tick"/>
    <text x="64" y="217" text-anchor="end" class="sm dim">1.3</text>
    <line x1="68" y1="101.46" x2="72" y2="101.46" class="tick"/>
    <text x="64" y="105.06" text-anchor="end" class="sm dim">1.6</text>
    <text x="320" y="376" text-anchor="end" class="sm dim">age in months</text>
    <polyline points="94.55,138.78 117.09,265.64 139.64,302.96 162.18,317.88" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <circle cx="94.55" cy="138.78" r="3.4" fill="#3b82f6"/>
    <circle cx="117.09" cy="265.64" r="3.4" fill="#3b82f6"/>
    <circle cx="139.64" cy="302.96" r="3.4" fill="#3b82f6"/>
    <circle cx="162.18" cy="317.88" r="3.4" fill="#3b82f6"/>
    <polyline points="162.18,317.88 184.73,323.1 207.27,324.22 229.82,324.97 252.36,325.34 274.91,325.34 297.45,325.34" class="curve dash" stroke="#d97706" stroke-width="2.2"/>
    <line x1="173.45" y1="344" x2="173.45" y2="94" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="167.45" y="161.16" text-anchor="end" class="sm dim">data ends</text>
    <text x="237.33" y="288.03" text-anchor="middle" class="sm bold" fill="#d97706">tail 1.010</text>
  </g>
</svg>
