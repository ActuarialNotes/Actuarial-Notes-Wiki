    <polyline points="68,193.84 322,201.52" class="curve" stroke="#e11d48" stroke-width="2.4"/>
    <text x="154.36" y="163.12" text-anchor="middle" class="sm bold" fill="#3b82f6">claims</text>
    <text x="235.64" y="191.28" text-anchor="middle" class="sm bold" fill="#e11d48">expenses</text>
    <text x="180" y="244" text-anchor="middle" class="sm dim">years into the run-off</text>
    <text x="180" y="264" text-anchor="middle" class="sm dim">the expense line barely falls — and that is the</text>
    <text x="180" y="280" text-anchor="middle" class="sm dim">adjustment most often understated</text>
    <line x1="30" y1="300" x2="330" y2="300" class="rule"/>
    <text x="36" y="322" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="322" text-anchor="start" class="sm">claimants and counsel behave differently</text>
    <text x="36" y="346" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="346" text-anchor="start" class="sm">recoveries stretch out, so commutations appeal</text>
    <text x="36" y="370" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="370" text-anchor="start" class="sm">and the FCT solvency scenario asks this question</text>
  </g>
</svg>
