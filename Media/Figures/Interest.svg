    <text x="277.61" y="366" text-anchor="middle" class="sm dim">7</text>
    <line x1="307.85" y1="350" x2="307.85" y2="354" class="tick"/>
    <text x="307.85" y="366" text-anchor="middle" class="sm dim">8</text>
    <line x1="74" y1="350" x2="78" y2="350" class="tick"/>
    <text x="70" y="353.6" text-anchor="end" class="sm dim">0</text>
    <line x1="74" y1="233.93" x2="78" y2="233.93" class="tick"/>
    <text x="70" y="237.53" text-anchor="end" class="sm dim">5,000</text>
    <line x1="74" y1="117.86" x2="78" y2="117.86" class="tick"/>
    <text x="70" y="121.46" text-anchor="end" class="sm dim">10,000</text>
    <text x="326" y="382" text-anchor="end" class="sm dim">period</text>
    <text x="74" y="76" text-anchor="start" class="sm dim">balance</text>
    <text x="96.15" y="93.29" text-anchor="middle" class="sm bold">800</text>
    <text x="307.85" y="303.6" text-anchor="middle" class="sm bold">129</text>
  </g>
</svg>
