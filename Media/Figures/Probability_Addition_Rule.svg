<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img">
  <title>The addition rule correcting for a double-counted overlap</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="248.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Add the parts, then subtract the double-counted overlap</text>
  <rect x="28" y="56" width="262" height="126" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="40" y="72" text-anchor="middle" class="sm dim">S</text>
  <circle cx="132" cy="118" r="54" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="184" cy="118" r="54" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.5"/>
  <path d="M158,70.67 A54,54 0 0 1 158,165.33 A54,54 0 0 1 158,70.67 Z" fill="#e11d48" fill-opacity="0.4" stroke="none"/>
  <text x="106" y="122" text-anchor="middle" class="sm">0.30</text>
  <text x="158" y="122" text-anchor="middle" class="sm bold">0.15</text>
  <text x="210" y="122" text-anchor="middle" class="sm">0.25</text>
  <text x="102" y="74" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <text x="214" y="74" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <text x="158" y="200" text-anchor="middle" class="sm dim">P(A) = 0.45,  P(B) = 0.40,  P(A ∩ B) = 0.15</text>
  <text x="424" y="82" text-anchor="middle" class="bold">P(A ∪ B)</text>
  <text x="322" y="104" text-anchor="start" class="sm" fill="#3b82f6">+ P(A)</text>
  <text x="526" y="104" text-anchor="end" class="sm" fill="var(--ink)">0.45</text>
  <text x="322" y="132" text-anchor="start" class="sm" fill="#d97706">+ P(B)</text>
  <text x="526" y="132" text-anchor="end" class="sm" fill="var(--ink)">0.40</text>
  <text x="322" y="160" text-anchor="start" class="sm" fill="#e11d48">− P(A ∩ B)</text>
  <text x="526" y="160" text-anchor="end" class="sm" fill="var(--ink)">0.15</text>
  <line x1="322" y1="174" x2="526" y2="174" class="rule"/>
  <text x="322" y="188" text-anchor="start" class="sm" fill="var(--ink)">= P(A ∪ B)</text>
  <text x="526" y="188" text-anchor="end" class="sm bold" fill="#059669">0.70</text>
  <text x="424" y="232" text-anchor="middle" class="sm dim">Disjoint events have nothing to subtract</text>
</svg>
