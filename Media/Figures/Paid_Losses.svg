<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Paid losses climbing to the same ultimate as reported losses, from further below</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="109.14" y1="94" x2="109.14" y2="344" class="grid"/>
    <line x1="179.43" y1="94" x2="179.43" y2="344" class="grid"/>
    <line x1="249.71" y1="94" x2="249.71" y2="344" class="grid"/>
    <line x1="320" y1="94" x2="320" y2="344" class="grid"/>
    <line x1="74" y1="344" x2="320" y2="344" class="grid"/>
    <line x1="74" y1="226.81" x2="320" y2="226.81" class="grid"/>
    <line x1="74" y1="109.62" x2="320" y2="109.62" class="grid"/>
    <line x1="74" y1="344" x2="330" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="344" x2="74" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="109.14" y1="344" x2="109.14" y2="348" class="tick"/>
    <text x="109.14" y="360" text-anchor="middle" class="sm dim">12</text>
    <line x1="179.43" y1="344" x2="179.43" y2="348" class="tick"/>
    <text x="179.43" y="360" text-anchor="middle" class="sm dim">36</text>
    <line x1="249.71" y1="344" x2="249.71" y2="348" class="tick"/>
    <text x="249.71" y="360" text-anchor="middle" class="sm dim">60</text>
    <line x1="320" y1="344" x2="320" y2="348" class="tick"/>
    <text x="320" y="360" text-anchor="middle" class="sm dim">84</text>
    <line x1="70" y1="344" x2="74" y2="344" class="tick"/>
    <text x="66" y="347.6" text-anchor="end" class="sm dim">0</text>
    <line x1="70" y1="226.81" x2="74" y2="226.81" class="tick"/>
    <text x="66" y="230.41" text-anchor="end" class="sm dim">1,500</text>
    <line x1="70" y1="109.62" x2="74" y2="109.62" class="tick"/>
    <text x="66" y="113.22" text-anchor="end" class="sm dim">3,000</text>
    <text x="320" y="376" text-anchor="end" class="sm dim">age in months</text>
    <polyline points="109.14,226.81 144.29,168.22 179.43,140.09 214.57,127.83 249.71,123.53 284.86,121.73 320,121.34" class="curve" stroke="#3b82f6" stroke-width="2.2"/>
    <polyline points="109.14,297.12 144.29,226.81 179.43,176.03 214.57,144 249.71,129.94 284.86,123.69 320,121.34" class="curve" stroke="#059669" stroke-width="2.4"/>
    <line x1="74" y1="121.34" x2="320" y2="121.34" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
    <text x="128.57" y="168.22" text-anchor="end" class="sm bold" fill="#3b82f6">reported</text>
    <text x="191.14" y="201.75" text-anchor="middle" class="sm bold" fill="#059669">paid</text>
    <text x="302.43" y="113.34" text-anchor="end" class="sm dim">ultimate</text>
  </g>
</svg>
