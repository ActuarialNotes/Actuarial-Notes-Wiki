<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A unit square split 0.6 across for A and 0.5 down for B, so the corner where they cross has area 0.30</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="82" y="92" width="236" height="236" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
    <rect x="82" y="92" width="141.6" height="236" fill="#3b82f6" fill-opacity="0.16"/>
    <rect x="82" y="92" width="236" height="118" fill="#d97706" fill-opacity="0.16"/>
    <rect x="82" y="92" width="141.6" height="118" fill="#059669" fill-opacity="0.34"/>
    <line x1="223.6" y1="92" x2="223.6" y2="328" class="thin" stroke="#3b82f6" stroke-width="1.6"/>
    <line x1="82" y1="210" x2="318" y2="210" class="thin" stroke="#d97706" stroke-width="1.6"/>
    <text x="152.8" y="271.36" text-anchor="middle" class="bold">A</text>
    <text x="270.8" y="156" text-anchor="middle" class="bold">B</text>
    <text x="152.8" y="156" text-anchor="middle" class="bold">0.30</text>
    <path d="M82,336 v5.4 H147.8 q5,0 5,4.95 q0,-4.95 5,-4.95 H223.6 v-5.4" class="thin" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="152.8" y="356" text-anchor="middle" class="sm bold">0.6</text>
    <text x="70" y="155" text-anchor="end" class="sm bold">0.5</text>
    <line x1="76" y1="94" x2="76" y2="208" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
