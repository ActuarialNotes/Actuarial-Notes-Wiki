<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A chain from input x through a hidden unit and the prediction ŷ to the loss L, a forward arrow running left to right above it and a gradient arrow running back below it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvarink" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--ink)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="82" y1="226" x2="115" y2="226" class="thin" stroke="var(--axis)" stroke-width="1.6"/>
    <line x1="163" y1="226" x2="197" y2="226" class="thin" stroke="var(--axis)" stroke-width="1.6"/>
    <line x1="245" y1="226" x2="278" y2="226" class="thin" stroke="var(--axis)" stroke-width="1.6"/>
    <circle cx="58" cy="226" r="24" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="58" y="231" text-anchor="middle" class="bold">x</text>
    <circle cx="139" cy="226" r="24" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="139" y="231" text-anchor="middle" class="bold">h</text>
    <circle cx="221" cy="226" r="24" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.6"/>
    <text x="221" y="231" text-anchor="middle" class="bold">ŷ</text>
    <circle cx="302" cy="226" r="24" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="1.6"/>
    <text x="302" y="231" text-anchor="middle" class="bold">L</text>
    <line x1="44" y1="150" x2="316" y2="150" class="thin" stroke="var(--ink)" stroke-width="2.2" marker-end="url(#ahvarink)"/>
    <text x="180" y="136" text-anchor="middle" class="sm bold">forward</text>
    <line x1="316" y1="302" x2="44" y2="302" class="thin" stroke="#e11d48" stroke-width="2.2" marker-end="url(#ahe11d48)"/>
    <text x="180" y="324" text-anchor="middle" class="sm bold">gradients</text>
    <line x1="58" y1="162" x2="58" y2="196" class="thin dot" stroke="var(--axis)" stroke-width="1.2"/>
    <line x1="58" y1="256" x2="58" y2="290" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <line x1="139" y1="162" x2="139" y2="196" class="thin dot" stroke="var(--axis)" stroke-width="1.2"/>
    <line x1="139" y1="256" x2="139" y2="290" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <line x1="221" y1="162" x2="221" y2="196" class="thin dot" stroke="var(--axis)" stroke-width="1.2"/>
    <line x1="221" y1="256" x2="221" y2="290" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
    <line x1="302" y1="162" x2="302" y2="196" class="thin dot" stroke="var(--axis)" stroke-width="1.2"/>
    <line x1="302" y1="256" x2="302" y2="290" class="thin dot" stroke="#e11d48" stroke-width="1.2"/>
  </g>
</svg>
