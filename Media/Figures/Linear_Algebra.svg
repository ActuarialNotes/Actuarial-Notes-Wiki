<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A design matrix times a coefficient vector giving the fitted values</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Regression is one matrix equation</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">β̂ = (XᵀX)⁻¹Xᵀy</text>
  <rect x="35" y="123" width="76" height="110" rx="5" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="42" y="130" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="64" y="130" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="86" y="130" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="42" y="150" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="64" y="150" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="86" y="150" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="42" y="170" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="64" y="170" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="86" y="170" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="42" y="190" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="64" y="190" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="86" y="190" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="42" y="210" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="64" y="210" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <rect x="86" y="210" width="18" height="16" rx="2" fill="#3b82f6" fill-opacity="0.35"/>
  <text x="73" y="252" text-anchor="middle" class="sm bold" fill="#3b82f6">X  (n × p)</text>
  <text x="124" y="178" text-anchor="middle" class="bold">×</text>
  <rect x="133" y="153" width="32" height="70" rx="5" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1.3"/>
  <rect x="140" y="160" width="18" height="16" rx="2" fill="#d97706" fill-opacity="0.35"/>
  <rect x="140" y="180" width="18" height="16" rx="2" fill="#d97706" fill-opacity="0.35"/>
  <rect x="140" y="200" width="18" height="16" rx="2" fill="#d97706" fill-opacity="0.35"/>
  <text x="149" y="242" text-anchor="middle" class="sm bold" fill="#d97706">β  (p × 1)</text>
  <text x="178" y="178" text-anchor="middle" class="bold">=</text>
  <rect x="187" y="123" width="32" height="110" rx="5" fill="#059669" fill-opacity="0.10" stroke="#059669" stroke-width="1.3"/>
  <rect x="194" y="130" width="18" height="16" rx="2" fill="#059669" fill-opacity="0.35"/>
  <rect x="194" y="150" width="18" height="16" rx="2" fill="#059669" fill-opacity="0.35"/>
  <rect x="194" y="170" width="18" height="16" rx="2" fill="#059669" fill-opacity="0.35"/>
  <rect x="194" y="190" width="18" height="16" rx="2" fill="#059669" fill-opacity="0.35"/>
  <rect x="194" y="210" width="18" height="16" rx="2" fill="#059669" fill-opacity="0.35"/>
  <text x="203" y="252" text-anchor="middle" class="sm bold" fill="#059669">ŷ  (n × 1)</text>
  <text x="180" y="268" text-anchor="middle" class="sm dim">each row is one observation,</text>
  <text x="180" y="284" text-anchor="middle" class="sm dim">each column one predictor</text>
  <text x="180" y="320" text-anchor="middle" class="sm dim">XᵀX must be invertible — collinear</text>
  <text x="180" y="336" text-anchor="middle" class="sm dim">columns are what break it</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">eigenvectors of XᵀX are the PCA loadings</text>
</svg>
