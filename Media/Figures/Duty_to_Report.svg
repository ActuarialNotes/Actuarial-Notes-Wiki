<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three-step escalation, each step given a real chance before the next</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Escalate, one step at a time</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">CEO and CFO → directors → OSFI</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">on any material adverse effect</text>
  <rect x="34" y="108" width="292" height="52" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="180" y="131" text-anchor="middle" class="sm">CEO and CFO</text>
  <text x="180" y="146" text-anchor="middle" class="sm dim">and give them a real chance to fix it</text>
  <rect x="34" y="178" width="292" height="52" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.3"/>
  <text x="180" y="201" text-anchor="middle" class="sm">The directors</text>
  <text x="180" y="216" text-anchor="middle" class="sm dim">if it is not suitably addressed</text>
  <line x1="180" y1="159" x2="180" y2="177" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="34" y="248" width="292" height="52" rx="6" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.3"/>
  <text x="180" y="271" text-anchor="middle" class="sm">OSFI</text>
  <text x="180" y="286" text-anchor="middle" class="sm dim">if it is still not addressed</text>
  <line x1="180" y1="229" x2="180" y2="247" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="30" y1="300" x2="330" y2="300" class="rule"/>
  <text x="36" y="322" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="52" y="322" text-anchor="start" class="sm">s. 361 immunity is what makes it usable</text>
  <text x="36" y="346" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="52" y="346" text-anchor="start" class="sm">resigning without reporting defeats the design</text>
  <text x="36" y="370" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="52" y="370" text-anchor="start" class="sm">and the successor must ask you why you left</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">document the dates, the audience and the answer</text>
</svg>
