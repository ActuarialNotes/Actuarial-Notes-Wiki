<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A linear predictor passed through a link function to a non-normal mean</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvarink" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--ink)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A link carries the linear predictor to</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">the mean</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">g(μ) = β₀ + β₁x₁ + ⋯ + βₚxₚ</text>
  <rect x="34" y="100" width="96" height="46" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="82" y="127" text-anchor="middle" class="sm bold">β₀ + Σβⱼxⱼ</text>
  <text x="82" y="160" text-anchor="middle" class="sm dim">linear predictor η</text>
  <rect x="228" y="100" width="96" height="46" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="276" y="127" text-anchor="middle" class="sm bold">μ = E[y]</text>
  <text x="276" y="160" text-anchor="middle" class="sm dim">mean response</text>
  <line x1="136" y1="123" x2="222" y2="123" class="thin" stroke="var(--ink)" stroke-width="1.7" marker-end="url(#ahvarink)"/>
  <text x="179" y="114" text-anchor="middle" class="sm bold">g⁻¹</text>
  <line x1="66" y1="282" x2="320" y2="282" class="grid"/>
  <line x1="66" y1="242" x2="320" y2="242" class="grid"/>
  <line x1="66" y1="202" x2="320" y2="202" class="grid"/>
  <line x1="66" y1="322" x2="320" y2="322" class="axis"/>
  <line x1="66" y1="202" x2="66" y2="322" class="axis"/>
  <line x1="62" y1="282" x2="66" y2="282" class="tick"/>
  <text x="58" y="285.6" text-anchor="end" class="sm dim">2</text>
  <line x1="62" y1="242" x2="66" y2="242" class="tick"/>
  <text x="58" y="245.6" text-anchor="end" class="sm dim">4</text>
  <line x1="62" y1="202" x2="66" y2="202" class="tick"/>
  <text x="58" y="205.6" text-anchor="end" class="sm dim">6</text>
  <text x="320" y="338" text-anchor="end" class="sm dim">η</text>
