<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A final payment smaller than the regular one, clearing a small remaining balance</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A drop payment clears the small balance</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">left</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">drop = B_n (1 + i)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the last balance, accumulated one period</text>
  <line x1="48" y1="250" x2="318" y2="250" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="56" y1="246" x2="56" y2="254" class="tick"/>
  <text x="56" y="267" text-anchor="middle" class="sm dim">0</text>
  <line x1="96.67" y1="246" x2="96.67" y2="254" class="tick"/>
  <text x="96.67" y="267" text-anchor="middle" class="sm dim">1</text>
  <line x1="137.33" y1="246" x2="137.33" y2="254" class="tick"/>
  <text x="137.33" y="267" text-anchor="middle" class="sm dim">2</text>
  <line x1="178" y1="246" x2="178" y2="254" class="tick"/>
  <text x="178" y="267" text-anchor="middle" class="sm dim">3</text>
  <line x1="218.67" y1="246" x2="218.67" y2="254" class="tick"/>
  <text x="218.67" y="267" text-anchor="middle" class="sm dim">4</text>
  <line x1="259.33" y1="246" x2="259.33" y2="254" class="tick"/>
  <text x="259.33" y="267" text-anchor="middle" class="sm dim">5</text>
  <line x1="300" y1="246" x2="300" y2="254" class="tick"/>
  <text x="300" y="267" text-anchor="middle" class="sm dim">6</text>
  <line x1="96.67" y1="250" x2="96.67" y2="196" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="96.67" y="190" text-anchor="middle" class="sm">P</text>
  <line x1="137.33" y1="250" x2="137.33" y2="196" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="137.33" y="190" text-anchor="middle" class="sm">P</text>
  <line x1="178" y1="250" x2="178" y2="196" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="178" y="190" text-anchor="middle" class="sm">P</text>
  <line x1="218.67" y1="250" x2="218.67" y2="196" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="218.67" y="190" text-anchor="middle" class="sm">P</text>
  <line x1="259.33" y1="250" x2="259.33" y2="196" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="259.33" y="190" text-anchor="middle" class="sm">P</text>
  <line x1="300" y1="250" x2="300" y2="230" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="300" y="224" text-anchor="middle" class="sm">drop</text>
  <line x1="84.67" y1="196" x2="312" y2="196" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="180" y="174" text-anchor="middle" class="sm dim">level P</text>
  <text x="180" y="340" text-anchor="middle" class="sm dim">P was rounded up, so the loan clears early</text>
</svg>
