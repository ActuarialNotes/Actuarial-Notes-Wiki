    <rect x="207.75" y="216.2" width="18.75" height="133.8" rx="2" fill="var(--dim)" fill-opacity="0.3"/>
    <rect x="207.75" y="205.5" width="18.75" height="10.7" rx="2" fill="#d97706" fill-opacity="0.85"/>
    <rect x="237.99" y="245.89" width="18.75" height="104.11" rx="2" fill="var(--dim)" fill-opacity="0.3"/>
