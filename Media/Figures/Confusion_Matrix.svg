<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four cells of a confusion matrix with the metrics each one feeds</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Every classification metric comes from</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">four cells</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">sensitivity = TP / (TP + FN)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">specificity = TN / (TN + FP)</text>
  <text x="220" y="100" text-anchor="middle" class="sm dim">actual</text>
  <text x="174" y="120" text-anchor="middle" class="sm bold">+</text>
  <text x="266" y="120" text-anchor="middle" class="sm bold">−</text>
  <text x="114" y="166" text-anchor="end" class="sm bold">+</text>
  <text x="114" y="226" text-anchor="end" class="sm bold">−</text>
  <text x="98" y="192" text-anchor="end" class="sm dim">pred</text>
  <rect x="130" y="134" width="88" height="56" rx="5" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.2"/>
  <text x="174" y="158" text-anchor="middle" class="sm bold">TP</text>
  <text x="174" y="176" text-anchor="middle" class="sm">45</text>
  <rect x="222" y="134" width="88" height="56" rx="5" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.2"/>
  <text x="266" y="158" text-anchor="middle" class="sm bold">FP</text>
  <text x="266" y="176" text-anchor="middle" class="sm">45</text>
  <rect x="130" y="194" width="88" height="56" rx="5" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.2"/>
  <text x="174" y="218" text-anchor="middle" class="sm bold">FN</text>
  <text x="174" y="236" text-anchor="middle" class="sm">15</text>
  <rect x="222" y="194" width="88" height="56" rx="5" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.2"/>
  <text x="266" y="218" text-anchor="middle" class="sm bold">TN</text>
  <text x="266" y="236" text-anchor="middle" class="sm">895</text>
  <text x="180" y="278" text-anchor="middle" class="sm dim">1,000 claims, 60 fraudulent, 90 flagged</text>
  <text x="180" y="306" text-anchor="middle" class="sm">sensitivity 45/60 = 75%   specificity 95.2%</text>
  <text x="180" y="328" text-anchor="middle" class="sm">precision 45/90 = 50%     accuracy 94.0%</text>
  <text x="180" y="350" text-anchor="middle" class="sm bold">flagging nothing also scores 94% accuracy</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the threshold moves every number here</text>
</svg>
