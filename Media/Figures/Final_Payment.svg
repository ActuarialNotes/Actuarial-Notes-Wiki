<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Four level payments P, then two alternatives at time 5: a short drop payment below the level line or a tall balloon payment above it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="58" y1="330" x2="318" y2="330" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="326" x2="66" y2="334" class="tick"/>
    <text x="66" y="347" text-anchor="middle" class="sm dim">0</text>
    <line x1="112.8" y1="326" x2="112.8" y2="334" class="tick"/>
    <text x="112.8" y="347" text-anchor="middle" class="sm dim">1</text>
    <line x1="159.6" y1="326" x2="159.6" y2="334" class="tick"/>
    <text x="159.6" y="347" text-anchor="middle" class="sm dim">2</text>
    <line x1="206.4" y1="326" x2="206.4" y2="334" class="tick"/>
    <text x="206.4" y="347" text-anchor="middle" class="sm dim">3</text>
    <line x1="253.2" y1="326" x2="253.2" y2="334" class="tick"/>
    <text x="253.2" y="347" text-anchor="middle" class="sm dim">4</text>
    <line x1="300" y1="326" x2="300" y2="334" class="tick"/>
    <text x="300" y="347" text-anchor="middle" class="sm dim">5</text>
    <line x1="112.8" y1="330" x2="112.8" y2="220" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="159.6" y1="330" x2="159.6" y2="220" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="206.4" y1="330" x2="206.4" y2="220" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <line x1="253.2" y1="330" x2="253.2" y2="220" class="thin" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah3b82f6)"/>
    <text x="112.8" y="212" text-anchor="middle" class="bold">P</text>
    <line x1="100.8" y1="220" x2="322" y2="220" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <line x1="291" y1="330" x2="291" y2="291.5" class="thin" stroke="#059669" stroke-width="2.2" marker-end="url(#ah059669)"/>
    <text x="291" y="285.5" text-anchor="middle" class="sm bold">drop</text>
    <line x1="309" y1="330" x2="309" y2="99" class="thin" stroke="#e11d48" stroke-width="2.2" marker-end="url(#ahe11d48)"/>
    <text x="309" y="93" text-anchor="middle" class="sm bold">balloon</text>
  </g>
</svg>
