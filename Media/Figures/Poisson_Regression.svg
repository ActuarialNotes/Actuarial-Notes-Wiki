<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Expected claim frequency as bars growing step by step from a base of 0.100 as each rating factor multiplies it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="108" y1="348" x2="336" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="108" y1="348" x2="108" y2="76" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="108" y1="348" x2="108" y2="352" class="tick"/>
    <text x="108" y="364" text-anchor="middle" class="sm dim">0</text>
    <line x1="180.67" y1="348" x2="180.67" y2="352" class="tick"/>
    <text x="180.67" y="364" text-anchor="middle" class="sm dim">0.1</text>
    <line x1="253.33" y1="348" x2="253.33" y2="352" class="tick"/>
    <text x="253.33" y="364" text-anchor="middle" class="sm dim">0.2</text>
    <text x="326" y="380" text-anchor="end" class="sm dim">frequency</text>
    <rect x="108" y="106.17" width="72.67" height="28" rx="3" fill="var(--dim)" fill-opacity="0.65"/>
    <text x="100" y="124.17" text-anchor="end" class="sm">base</text>
    <text x="186.67" y="124.17" text-anchor="start" class="sm">0.100</text>
    <rect x="108" y="163.13" width="94.47" height="28" rx="3" fill="#3b82f6" fill-opacity="0.65"/>
    <text x="100" y="181.13" text-anchor="end" class="sm">× urban</text>
    <text x="208.47" y="181.13" text-anchor="start" class="sm">0.130</text>
    <line x1="180.67" y1="134.17" x2="180.67" y2="163.13" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="108" y="220.09" width="142.43" height="28" rx="3" fill="#d97706" fill-opacity="0.65"/>
    <text x="100" y="238.09" text-anchor="end" class="sm">× young</text>
    <text x="256.43" y="238.09" text-anchor="start" class="sm">0.196</text>
    <line x1="202.47" y1="191.13" x2="202.47" y2="220.09" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="108" y="277.04" width="177.31" height="28" rx="3" fill="#e11d48" fill-opacity="0.65"/>
    <text x="100" y="295.04" text-anchor="end" class="sm">× prior claim</text>
    <text x="291.31" y="295.04" text-anchor="start" class="sm">0.244</text>
    <line x1="250.43" y1="248.09" x2="250.43" y2="277.04" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
  </g>
</svg>
