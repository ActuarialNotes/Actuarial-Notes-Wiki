<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A 30.8% expense column stacked from commission 20.0, taxes 3.0 and other acquisition 3.0 — the 26% that varies with premium — topped by 4.8 of fixed general expense</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="128" y="188" width="80" height="180" rx="2" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.1"/>
    <text x="218" y="282" text-anchor="start" class="sm">commission 20.0</text>
    <rect x="128" y="161" width="80" height="27" rx="2" fill="#0d9488" fill-opacity="0.34" stroke="#0d9488" stroke-width="1.1"/>
    <text x="218" y="178.5" text-anchor="start" class="sm">taxes 3.0</text>
    <rect x="128" y="134" width="80" height="27" rx="2" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.1"/>
    <text x="218" y="151.5" text-anchor="start" class="sm">other acq. 3.0</text>
    <rect x="128" y="90.8" width="80" height="43.2" rx="2" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.1"/>
    <text x="218" y="116.4" text-anchor="start" class="sm">general 4.8</text>
    <text x="168" y="80.8" text-anchor="middle" class="bold">30.8%</text>
    <path d="M124,366.0 H120 V136.0 H124" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="114" y="255" text-anchor="end" class="sm dim">variable</text>
    <path d="M124,132.0 H120 V92.8 H124" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="114" y="116.4" text-anchor="end" class="sm dim">fixed</text>
  </g>
</svg>
