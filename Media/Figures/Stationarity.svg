<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A stationary series oscillating about a fixed mean above a non-stationary one that wanders</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Mean, variance and autocovariance fixed</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">in time</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">E[Y_t] = μ,  Cov(Y_t, Y_{t+k}) = γ_k</text>
  <text x="180" y="102" text-anchor="middle" class="sm bold" fill="#059669">stationary — AR(1), φ = 0.55</text>
  <rect x="54" y="110" width="270" height="86" rx="5" fill="var(--soft)" stroke="var(--edge)"/>
  <line x1="54" y1="159.53" x2="324" y2="159.53" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <polyline points="54,169.21 58.58,154.35 63.15,125.5 67.73,145.46 72.31,153.26 76.88,149.22 81.46,150.47 86.03,183.78 90.61,165.03 95.19,170.19 99.76,143.03 104.34,161.3 108.92,151.28 113.49,158.7 118.07,134.14 122.64,141.17 127.22,156.73 131.8,153.9 136.37,152.56 140.95,139.09 145.53,153.72 150.1,176.04 154.68,140.8 159.25,121.6 163.83,151.68 168.41,165.42 172.98,183.73 177.56,171.14 182.14,171.67 186.71,155.96 191.29,131.26 195.86,137.04 200.44,151.84 205.02,167.33 209.59,139.8 214.17,137.2 218.75,163.83 223.32,140.71 227.9,136.19 232.47,149.45 237.05,151.86 241.63,147.34 246.2,162.6 250.78,166.01 255.36,164.31 259.93,167.84 264.51,157.45 269.08,167.65 273.66,176.14 278.24,184.62 282.81,176.32 287.39,173.38 291.97,154.15 296.54,176.85 301.12,155.42 305.69,149.01 310.27,144.34 314.85,121.38 319.42,156.21 324,154.75" class="curve" stroke="#059669" stroke-width="1.7"/>
  <text x="180" y="234" text-anchor="middle" class="sm bold" fill="#e11d48">non-stationary — random walk</text>
  <rect x="54" y="242" width="270" height="86" rx="5" fill="var(--soft)" stroke="var(--edge)"/>
  <polyline points="54,276.98 58.58,280.12 63.15,273.5 67.73,272.07 72.31,280.13 76.88,292.15 81.46,285.84 86.03,287.84 90.61,272.17 95.19,271.8 99.76,282.53 104.34,267.35 108.92,267.07 113.49,261.54 118.07,262.7 122.64,266.95 127.22,262.35 131.8,260.28 136.37,274.89 140.95,275.76 145.53,272.7 150.1,253.97 154.68,253.38 159.25,257.95 163.83,270.68 168.41,276.62 172.98,273.74 177.56,263.96 182.14,264.22 186.71,270.12 191.29,275.57 195.86,272.4 200.44,276.82 205.02,277.62 209.59,278.46 214.17,291.99 218.75,300.4 223.32,316.62 227.9,309.47 232.47,306.94 237.05,304.25 241.63,301.27 246.2,307.04 250.78,300.96 255.36,303.09 259.93,292.43 264.51,273.37 269.08,271.75 273.66,264.34 278.24,264.92 282.81,270.03 287.39,267.13 291.97,277.93 296.54,281.86 301.12,281.32 305.69,291.96 310.27,297.21 314.85,299.71 319.42,293.5 324,290.5" class="curve" stroke="#e11d48" stroke-width="1.7"/>
  <text x="180" y="372" text-anchor="middle" class="sm dim">|φ| &lt; 1 is stationary; φ = 1 is a unit root</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">difference, or the ARIMA results do not hold</text>
</svg>
