<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The order-of-magnitude step between the non-catastrophic and catastrophic benefit limits</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">One designation multiplies the limit</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">tenfold</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">A defined list, not a judgement</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">— and then a lifetime care annuity</text>
  <text x="180" y="104" text-anchor="middle" class="sm dim">Ontario medical, rehab and attendant care</text>
  <rect x="46" y="126" width="40" height="10" rx="2" fill="#d97706" fill-opacity="0.75"/>
  <text x="96" y="136" text-anchor="start" class="sm">non-catastrophic — $65,000</text>
  <rect x="46" y="162" width="268" height="40" rx="4" fill="#e11d48" fill-opacity="0.55"/>
  <text x="180" y="187" text-anchor="middle" class="sm">catastrophic — $1,000,000</text>
  <line x1="30" y1="226" x2="330" y2="226" class="rule"/>
  <text x="44" y="250" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="60" y="250" text-anchor="start" class="sm">paraplegia, amputation, blindness</text>
  <text x="44" y="274" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="60" y="274" text-anchor="start" class="sm">a listed impairment score, or</text>
  <text x="44" y="298" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="60" y="298" text-anchor="start" class="sm">a catastrophic brain injury</text>
  <text x="180" y="330" text-anchor="middle" class="sm dim">a few per cent of claims, a large share of cost</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">designation arrives years late, and the reserve</text>
  <text x="180" y="370" text-anchor="middle" class="sm dim">is a lifetime annuity — so discount rate and</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">care inflation move it more than the claim does</text>
</svg>
