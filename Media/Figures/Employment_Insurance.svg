<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The 55% benefit rate against the maximum insurable earnings ceiling, and who pays the premium</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">55% of earnings, up to a ceiling</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Weekly benefit = 0.55 × insurable earnings</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">employer pays 1.4 × the employee rate</text>
    <line x1="68" y1="242" x2="334" y2="242" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="68" y1="242" x2="68" y2="84" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <polyline points="68,242 236.96,153.2 324,153.2" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
    <line x1="236.96" y1="242" x2="236.96" y2="153.2" class="thin dash" stroke="#e11d48" stroke-width="1.3"/>
    <text x="236.96" y="133.47" text-anchor="middle" class="sm bold" fill="#e11d48">ceiling</text>
    <text x="144.8" y="183.73" text-anchor="middle" class="sm bold" fill="#3b82f6">55%</text>
    <text x="288.16" y="168" text-anchor="middle" class="sm dim">flat</text>
    <text x="180" y="264" text-anchor="middle" class="sm dim">insurable earnings</text>
    <text x="90" y="80" text-anchor="start" class="sm dim">weekly benefit</text>
    <line x1="30" y1="272" x2="330" y2="272" class="rule"/>
    <text x="38" y="294" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="294" text-anchor="start" class="sm">compulsory — the archetypal adverse selection risk</text>
    <text x="38" y="318" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="318" text-anchor="start" class="sm">moral hazard is the design problem: replace too</text>
    <text x="38" y="342" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="342" text-anchor="start" class="sm">much for too long and return-to-work slows</text>
    <text x="38" y="366" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="54" y="366" text-anchor="start" class="sm">and no experience rating, unlike workers' comp</text>
  </g>
</svg>
