<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A territory indication blended with the statewide indication by a credibility weight</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Blend the data you have with what it</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">lacks</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Estimate = Z · Own + (1 − Z) · Complement</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Z = √(n / n_F)  or  n / (n + K)</text>
  <text x="180" y="106" text-anchor="middle" class="sm dim">Territory 07: +18% indicated on 430 claims</text>
  <rect x="44" y="134" width="163.2" height="30" rx="4" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="1.2"/>
  <rect x="207.2" y="134" width="108.8" height="30" rx="4" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="125.6" y="154" text-anchor="middle" class="sm">statewide +7.3%</text>
  <text x="261.6" y="154" text-anchor="middle" class="sm">own +18%</text>
  <text x="125.6" y="126" text-anchor="middle" class="sm dim">1 − Z = 0.60</text>
  <text x="261.6" y="126" text-anchor="middle" class="sm dim">Z = 0.40</text>
  <line x1="44" y1="250" x2="316" y2="250" class="axis"/>
  <line x1="44" y1="245" x2="44" y2="255" class="tick"/>
  <text x="44" y="269" text-anchor="middle" class="sm" fill="#d97706">+7.3%</text>
  <line x1="316" y1="245" x2="316" y2="255" class="tick"/>
  <text x="316" y="269" text-anchor="middle" class="sm" fill="#3b82f6">+18%</text>
  <line x1="152.8" y1="214" x2="152.8" y2="243" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="152.8" y="207" text-anchor="middle" class="bold" fill="#059669">+11.6%</text>
  <text x="180" y="310" text-anchor="middle" class="sm dim">Z rises with volume, never above 1 —</text>
  <text x="180" y="328" text-anchor="middle" class="sm dim">and the complement carries the rest</text>
</svg>
