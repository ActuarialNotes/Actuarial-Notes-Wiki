<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 274" width="560" height="274" role="img">
  <title>Interest collected up front, so only 1 minus d is advanced</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="272.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Discount charges the interest at the start of the period</text>
  <line x1="182" y1="112" x2="348" y2="112" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="190" y1="108" x2="190" y2="116" class="tick"/>
  <text x="190" y="127" text-anchor="middle" class="sm dim">0</text>
  <line x1="330" y1="108" x2="330" y2="116" class="tick"/>
  <text x="330" y="127" text-anchor="middle" class="sm dim">1</text>
  <text x="56" y="116" text-anchor="start" class="sm bold" fill="#3b82f6">Interest rate i</text>
  <line x1="190" y1="112" x2="190" y2="80" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="190" y="74" text-anchor="middle" class="sm">receive 1</text>
  <line x1="330" y1="112" x2="330" y2="80" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="330" y="74" text-anchor="middle" class="sm">repay 1 + i</text>
  <text x="392" y="116" text-anchor="start" class="sm bold">6.00%</text>
  <text x="444" y="116" text-anchor="start" class="sm dim">paid at the end</text>
  <line x1="182" y1="188" x2="348" y2="188" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="190" y1="184" x2="190" y2="192" class="tick"/>
  <text x="190" y="203" text-anchor="middle" class="sm dim">0</text>
  <line x1="330" y1="184" x2="330" y2="192" class="tick"/>
  <text x="330" y="203" text-anchor="middle" class="sm dim">1</text>
  <text x="56" y="192" text-anchor="start" class="sm bold" fill="#d97706">Discount rate d</text>
  <line x1="190" y1="188" x2="190" y2="156" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="190" y="150" text-anchor="middle" class="sm">receive 1 − d</text>
  <line x1="330" y1="188" x2="330" y2="156" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="330" y="150" text-anchor="middle" class="sm">repay 1</text>
  <text x="392" y="192" text-anchor="start" class="sm bold">5.66%</text>
  <text x="444" y="192" text-anchor="start" class="sm dim">paid up front</text>
  <line x1="28" y1="226" x2="532" y2="226" class="rule"/>
  <text x="150" y="248" text-anchor="middle" class="sm bold">d = i/(1 + i) = iv = 1 − v</text>
  <text x="150" y="266" text-anchor="middle" class="sm dim">i = d/(1 − d)</text>
  <text x="410" y="248" text-anchor="middle" class="sm bold">d &lt; i for every positive rate</text>
  <text x="410" y="266" text-anchor="middle" class="sm dim">1 today accumulates to 1/(1 − d)</text>
</svg>
