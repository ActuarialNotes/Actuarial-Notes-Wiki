<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four opinions available to the Appointed Actuary, and the one thing the opinion is about</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">An opinion on the amount carried, not on</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">your own estimate</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Does the reported liability make</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">appropriate provision for the obligations?</text>
  <rect x="30" y="104" width="300" height="40" rx="6" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1.2"/>
  <text x="42" y="129" text-anchor="start" class="sm bold">Unqualified</text>
  <text x="318" y="129" text-anchor="end" class="sm dim">it does</text>
  <rect x="30" y="154" width="300" height="40" rx="6" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.2"/>
  <text x="42" y="179" text-anchor="start" class="sm bold">Qualified</text>
  <text x="318" y="179" text-anchor="end" class="sm dim">except for one component</text>
  <rect x="30" y="204" width="300" height="40" rx="6" fill="#e11d48" fill-opacity="0.16" stroke="#e11d48" stroke-width="1.2"/>
  <text x="42" y="229" text-anchor="start" class="sm bold">Adverse</text>
  <text x="318" y="229" text-anchor="end" class="sm dim">it does not</text>
  <rect x="30" y="254" width="300" height="40" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="42" y="279" text-anchor="start" class="sm bold">Denial</text>
  <text x="318" y="279" text-anchor="end" class="sm dim">the data will not support an opinion</text>
  <line x1="30" y1="314" x2="330" y2="314" class="rule"/>
  <text x="180" y="336" text-anchor="middle" class="sm dim">data sufficiency is a gate, not a formality: a</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">margin cannot cure data that cannot be relied on</text>
  <text x="180" y="378" text-anchor="middle" class="sm dim">subsequent events count up to the signing date</text>
</svg>
