<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A waterfall from AY 2024's 2,850 gross ultimate, taking off 640 ceded, 250 of salvage and subrogation and 350 of deductibles to leave 1,610 net</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="110" y="98" width="220" height="28" rx="4" fill="#7c3aed" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="100" y="116" text-anchor="end" class="sm bold">gross</text>
    <text x="322" y="116" text-anchor="end" class="sm bold">2,850</text>
    <rect x="280.6" y="158" width="49.4" height="28" rx="4" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <text x="100" y="176" text-anchor="end" class="sm">ceded</text>
    <text x="274.6" y="176" text-anchor="end" class="sm">−640</text>
    <line x1="280.6" y1="186" x2="280.6" y2="218" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="261.3" y="218" width="19.3" height="28" rx="4" fill="#059669" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
    <text x="100" y="236" text-anchor="end" class="sm">S&amp;S</text>
    <text x="255.3" y="236" text-anchor="end" class="sm">−250</text>
    <line x1="261.3" y1="246" x2="261.3" y2="278" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="234.28" y="278" width="27.02" height="28" rx="4" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.2"/>
    <text x="100" y="296" text-anchor="end" class="sm">deductible</text>
    <text x="228.28" y="296" text-anchor="end" class="sm">−350</text>
    <line x1="234.28" y1="306" x2="234.28" y2="338" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
    <rect x="110" y="338" width="124.28" height="28" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="100" y="356" text-anchor="end" class="sm bold">net</text>
    <text x="226.28" y="356" text-anchor="end" class="sm bold">1,610</text>
    <line x1="330" y1="126" x2="330" y2="158" class="thin dot" stroke="var(--dim)" stroke-width="1.2"/>
  </g>
</svg>
