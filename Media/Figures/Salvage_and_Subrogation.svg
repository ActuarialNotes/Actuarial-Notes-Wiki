<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Gross ultimate reduced by salvage and subrogation recoveries</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Two recoveries that arrive after the</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">payment</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Net Ultimate = Gross Ultimate − S&amp;S</text>
  <text x="180" y="120" text-anchor="middle" class="sm dim">AY 2024 ultimate ($000)</text>
  <rect x="46" y="144" width="268" height="34" rx="4" fill="#7c3aed" fill-opacity="0.28" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="166" text-anchor="middle" class="sm">gross 2,850</text>
  <rect x="46" y="200" width="8.46" height="30" rx="3" fill="#0d9488" fill-opacity="0.7"/>
  <text x="64.46" y="221" text-anchor="start" class="sm">salvage 90</text>
  <rect x="46" y="244" width="15.05" height="30" rx="3" fill="#e11d48" fill-opacity="0.7"/>
  <text x="71.05" y="265" text-anchor="start" class="sm">subrogation 160</text>
  <rect x="46" y="292" width="244.49" height="34" rx="4" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="168.25" y="314" text-anchor="middle" class="sm">net 2,600</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">S&amp;S has its own long development pattern —</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">estimate it, do not net it out of the triangle</text>
</svg>
