<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The present value of a customer's profit over the years they are expected to stay</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A customer is worth more than one policy</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">LTV = Σ (P_t − L_t − E_t) · ₜp / (1 + r)ᵗ</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Retention = renewed / eligible to renew</text>
  <line x1="96.19" y1="102" x2="96.19" y2="320" class="grid"/>
  <line x1="136.52" y1="102" x2="136.52" y2="320" class="grid"/>
  <line x1="176.84" y1="102" x2="176.84" y2="320" class="grid"/>
  <line x1="217.16" y1="102" x2="217.16" y2="320" class="grid"/>
  <line x1="257.48" y1="102" x2="257.48" y2="320" class="grid"/>
  <line x1="297.81" y1="102" x2="297.81" y2="320" class="grid"/>
  <line x1="72" y1="320" x2="322" y2="320" class="grid"/>
  <line x1="72" y1="232.8" x2="322" y2="232.8" class="grid"/>
  <line x1="72" y1="145.6" x2="322" y2="145.6" class="grid"/>
  <line x1="72" y1="232.8" x2="332" y2="232.8" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="320" x2="72" y2="92" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="96.19" y1="232.8" x2="96.19" y2="236.8" class="tick"/>
  <text x="96.19" y="248.8" text-anchor="middle" class="sm dim">1</text>
  <line x1="136.52" y1="232.8" x2="136.52" y2="236.8" class="tick"/>
  <text x="136.52" y="248.8" text-anchor="middle" class="sm dim">2</text>
  <line x1="176.84" y1="232.8" x2="176.84" y2="236.8" class="tick"/>
  <text x="176.84" y="248.8" text-anchor="middle" class="sm dim">3</text>
  <line x1="217.16" y1="232.8" x2="217.16" y2="236.8" class="tick"/>
  <text x="217.16" y="248.8" text-anchor="middle" class="sm dim">4</text>
  <line x1="257.48" y1="232.8" x2="257.48" y2="236.8" class="tick"/>
  <text x="257.48" y="248.8" text-anchor="middle" class="sm dim">5</text>
  <line x1="297.81" y1="232.8" x2="297.81" y2="236.8" class="tick"/>
  <text x="297.81" y="248.8" text-anchor="middle" class="sm dim">6</text>
  <line x1="68" y1="320" x2="72" y2="320" class="tick"/>
  <text x="64" y="323.6" text-anchor="end" class="sm dim">-40</text>
  <line x1="68" y1="232.8" x2="72" y2="232.8" class="tick"/>
  <text x="64" y="236.4" text-anchor="end" class="sm dim">0</text>
  <line x1="68" y1="145.6" x2="72" y2="145.6" class="tick"/>
  <text x="64" y="149.2" text-anchor="end" class="sm dim">40</text>
  <rect x="82.89" y="232.8" width="26.61" height="74.12" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="123.21" y="184.84" width="26.61" height="47.96" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="163.53" y="167.4" width="26.61" height="65.4" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="203.85" y="176.12" width="26.61" height="56.68" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="244.18" y="187.02" width="26.61" height="45.78" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="284.5" y="197.92" width="26.61" height="34.88" rx="1.5" fill="#3b82f6" fill-opacity="0.72"/>
  <rect x="90.19" y="232.8" width="12" height="74.12" rx="1.5" fill="#e11d48" fill-opacity="0.72"/>
  <text x="120.39" y="289.48" text-anchor="start" class="sm" fill="#e11d48">year 1 loses money</text>
  <text x="233.29" y="145.6" text-anchor="middle" class="sm bold" fill="#3b82f6">PV of profit = $81</text>
  <text x="180" y="352" text-anchor="middle" class="sm dim">policy year, discounted and survival-weighted</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">it is a marketing and retention frame laid over</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">the indication — it never replaces one</text>
</svg>
