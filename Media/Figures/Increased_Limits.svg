<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Increased limits factors rising with the policy limit, and the cost of a layer between two of them</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The extra cost of a higher limit</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">ILF(L) = E[X ∧ L] / E[X ∧ B]</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">layer (M, L] = Basic LC × [ILF(L) − ILF(M)]</text>
  <line x1="72.85" y1="100" x2="72.85" y2="322" class="grid"/>
  <line x1="116.46" y1="100" x2="116.46" y2="322" class="grid"/>
  <line x1="164.92" y1="100" x2="164.92" y2="322" class="grid"/>
  <line x1="310.31" y1="100" x2="310.31" y2="322" class="grid"/>
  <line x1="68" y1="303.5" x2="320" y2="303.5" class="grid"/>
  <line x1="68" y1="211" x2="320" y2="211" class="grid"/>
  <line x1="68" y1="118.5" x2="320" y2="118.5" class="grid"/>
  <line x1="68" y1="322" x2="330" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="322" x2="68" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72.85" y1="322" x2="72.85" y2="326" class="tick"/>
  <text x="72.85" y="338" text-anchor="middle" class="sm dim">100k</text>
  <line x1="116.46" y1="322" x2="116.46" y2="326" class="tick"/>
  <text x="116.46" y="338" text-anchor="middle" class="sm dim">1M</text>
  <line x1="164.92" y1="322" x2="164.92" y2="326" class="tick"/>
  <text x="164.92" y="338" text-anchor="middle" class="sm dim">2M</text>
  <line x1="310.31" y1="322" x2="310.31" y2="326" class="tick"/>
  <text x="310.31" y="338" text-anchor="middle" class="sm dim">5M</text>
  <line x1="64" y1="303.5" x2="68" y2="303.5" class="tick"/>
  <text x="60" y="307.1" text-anchor="end" class="sm dim">1.0</text>
  <line x1="64" y1="211" x2="68" y2="211" class="tick"/>
  <text x="60" y="214.6" text-anchor="end" class="sm dim">1.5</text>
  <line x1="64" y1="118.5" x2="68" y2="118.5" class="tick"/>
  <text x="60" y="122.1" text-anchor="end" class="sm dim">2.0</text>
  <polyline points="72.85,303.5 80.12,244.3 92.23,201.75 116.46,168.45 164.92,144.4 310.31,124.05" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="72.85" cy="303.5" r="3.2" fill="#3b82f6"/>
  <circle cx="80.12" cy="244.3" r="3.2" fill="#3b82f6"/>
  <circle cx="92.23" cy="201.75" r="3.2" fill="#3b82f6"/>
  <circle cx="116.46" cy="168.45" r="3.2" fill="#3b82f6"/>
  <circle cx="164.92" cy="144.4" r="3.2" fill="#3b82f6"/>
  <circle cx="310.31" cy="124.05" r="3.2" fill="#3b82f6"/>
  <line x1="92.23" y1="322" x2="92.23" y2="201.75" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <line x1="116.46" y1="322" x2="116.46" y2="168.45" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <line x1="92.23" y1="201.75" x2="116.46" y2="201.75" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <line x1="116.46" y1="201.75" x2="116.46" y2="168.45" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <text x="122.88" y="185.1" text-anchor="start" class="sm bold" fill="#d97706">0.18</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">policy limit</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">the curve must be concave — a layer higher</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">up cannot cost more than the one below it</text>
</svg>
