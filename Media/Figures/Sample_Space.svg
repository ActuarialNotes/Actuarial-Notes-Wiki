<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 254" width="560" height="254" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="252.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The sample space collects every elementary outcome exactly once</text>
  <rect x="34" y="58" width="254" height="150" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.2"/>
  <text x="47" y="74" text-anchor="middle" class="sm dim">S</text>
  <circle cx="74" cy="100" r="22" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="74" y="105" text-anchor="middle" class="sm">ω₁</text>
  <circle cx="150" cy="100" r="22" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="150" y="105" text-anchor="middle" class="sm">ω₂</text>
  <circle cx="226" cy="100" r="22" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="226" y="105" text-anchor="middle" class="sm">ω₃</text>
  <circle cx="74" cy="162" r="22" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="74" y="167" text-anchor="middle" class="sm">ω₄</text>
  <circle cx="150" cy="162" r="22" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="150" y="167" text-anchor="middle" class="sm">ω₅</text>
  <circle cx="226" cy="162" r="22" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="226" y="167" text-anchor="middle" class="sm">ω₆</text>
  <text x="161" y="226" text-anchor="middle" class="sm dim">S = {ω₁, …, ω₆}  — one roll of a die</text>
  <text x="424" y="72" text-anchor="middle" class="bold">Two requirements</text>
  <rect x="316" y="96" width="216" height="44" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="424" y="114" text-anchor="middle" class="sm bold">Mutually exclusive</text>
  <text x="424" y="129" text-anchor="middle" class="sm dim">no two outcomes can occur together</text>
  <rect x="316" y="152" width="216" height="44" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="424" y="170" text-anchor="middle" class="sm bold">Collectively exhaustive</text>
  <text x="424" y="185" text-anchor="middle" class="sm dim">together they cover every possibility</text>
  <text x="424" y="226" text-anchor="middle" class="sm dim">S may be finite, countable, or uncountable</text>
</svg>
