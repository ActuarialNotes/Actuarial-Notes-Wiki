<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The annuity family, sorted by payment timing and pattern</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah7c3aed" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7c3aed"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">An annuity is a stream of periodic</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">payments</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">a₍ₙ₎ = (1 − vⁿ)/i</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">everything else is built from it</text>
  <text x="180" y="82" text-anchor="middle" class="bold" fill="#3b82f6">a₍ₙ₎  immediate</text>
  <line x1="60" y1="116" x2="314" y2="116" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="112" x2="68" y2="120" class="tick"/>
  <line x1="125" y1="112" x2="125" y2="120" class="tick"/>
  <line x1="182" y1="112" x2="182" y2="120" class="tick"/>
  <line x1="239" y1="112" x2="239" y2="120" class="tick"/>
  <line x1="296" y1="112" x2="296" y2="120" class="tick"/>
  <line x1="125" y1="116" x2="125" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="182" y1="116" x2="182" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="239" y1="116" x2="239" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <line x1="296" y1="116" x2="296" y2="92" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="180" y="158" text-anchor="middle" class="bold" fill="#7c3aed">ä₍ₙ₎  due</text>
  <line x1="60" y1="192" x2="314" y2="192" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="188" x2="68" y2="196" class="tick"/>
  <line x1="125" y1="188" x2="125" y2="196" class="tick"/>
  <line x1="182" y1="188" x2="182" y2="196" class="tick"/>
  <line x1="239" y1="188" x2="239" y2="196" class="tick"/>
  <line x1="296" y1="188" x2="296" y2="196" class="tick"/>
  <line x1="68" y1="192" x2="68" y2="168" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="125" y1="192" x2="125" y2="168" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="182" y1="192" x2="182" y2="168" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <line x1="239" y1="192" x2="239" y2="168" class="thin" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah7c3aed)"/>
  <text x="180" y="234" text-anchor="middle" class="bold" fill="#059669">a₍∞₎  perpetuity</text>
  <line x1="60" y1="268" x2="314" y2="268" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="264" x2="68" y2="272" class="tick"/>
  <line x1="125" y1="264" x2="125" y2="272" class="tick"/>
  <line x1="182" y1="264" x2="182" y2="272" class="tick"/>
  <line x1="239" y1="264" x2="239" y2="272" class="tick"/>
  <line x1="296" y1="264" x2="296" y2="272" class="tick"/>
  <line x1="125" y1="268" x2="125" y2="244" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <line x1="182" y1="268" x2="182" y2="244" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <line x1="239" y1="268" x2="239" y2="244" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <line x1="296" y1="268" x2="296" y2="244" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="310" y="262" text-anchor="start" class="bold" fill="#059669">…</text>
  <text x="180" y="310" text-anchor="middle" class="bold" fill="#0d9488">ā₍ₙ₎  continuous</text>
  <line x1="60" y1="344" x2="314" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="340" x2="68" y2="348" class="tick"/>
  <line x1="125" y1="340" x2="125" y2="348" class="tick"/>
  <line x1="182" y1="340" x2="182" y2="348" class="tick"/>
  <line x1="239" y1="340" x2="239" y2="348" class="tick"/>
  <line x1="296" y1="340" x2="296" y2="348" class="tick"/>
  <rect x="68" y="322" width="228" height="22" rx="2" fill="#0d9488" fill-opacity="0.42"/>
</svg>
