  <line x1="52" y1="212" x2="390" y2="212" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="52" y1="212" x2="52" y2="48" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="187.06" y1="212" x2="187.06" y2="216" class="tick"/>
  <text x="187.06" y="228" text-anchor="middle" class="sm dim">a</text>
  <line x1="288.35" y1="212" x2="288.35" y2="216" class="tick"/>
  <text x="288.35" y="228" text-anchor="middle" class="sm dim">b</text>
  <text x="48" y="44" text-anchor="start" class="sm dim">f(x)</text>
  <text x="237.71" y="178.52" text-anchor="middle" class="sm bold">P(a ≤ X ≤ b)</text>
  <line x1="187.06" y1="212" x2="187.06" y2="100.44" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="288.35" y1="212" x2="288.35" y2="168.64" class="thin dash" stroke="#3b82f6" stroke-width="1.3"/>
  <line x1="376" y1="66" x2="376" y2="96" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="386" y="77" text-anchor="start" class="sm bold">f(x) ≥ 0</text>
  <text x="386" y="92" text-anchor="start" class="sm dim">a density is never negative</text>
  <line x1="376" y1="112" x2="376" y2="142" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="386" y="123" text-anchor="start" class="sm bold">∫ f(x) dx = 1</text>
  <text x="386" y="138" text-anchor="start" class="sm dim">total area is exactly 1</text>
  <line x1="376" y1="158" x2="376" y2="188" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="386" y="169" text-anchor="start" class="sm bold">P(X = c) = 0</text>
  <text x="386" y="184" text-anchor="start" class="sm dim">a single point has no width</text>
  <line x1="376" y1="204" x2="376" y2="234" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="386" y="215" text-anchor="start" class="sm bold">f(x) may exceed 1</text>
  <text x="386" y="230" text-anchor="start" class="sm dim">a density is not a probability</text>
  <text x="280" y="256" text-anchor="middle" class="sm dim">P(a ≤ X ≤ b) = ∫ₐᵇ f(x) dx — endpoints never matter</text>
</svg>
