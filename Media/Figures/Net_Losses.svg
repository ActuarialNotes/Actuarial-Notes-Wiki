<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Gross losses reduced step by step to what the insurer finally bears</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">What is left after every recovery</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Net = Gross − Ceded − S&amp;S − Deductibles</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">2,850 − 640 − 250 − 350 = 1,610</text>
  <rect x="46" y="132" width="268" height="30" rx="4" fill="#7c3aed" fill-opacity="0.45"/>
  <text x="54" y="153" text-anchor="start" class="sm">gross</text>
  <text x="314" y="153" text-anchor="end" class="sm">2,850</text>
  <rect x="46" y="176" width="207.82" height="30" rx="4" fill="#d97706" fill-opacity="0.45"/>
  <text x="54" y="197" text-anchor="start" class="sm">− ceded 640</text>
  <text x="314" y="197" text-anchor="end" class="sm">2,210</text>
  <rect x="46" y="220" width="184.31" height="30" rx="4" fill="#059669" fill-opacity="0.45"/>
  <text x="54" y="241" text-anchor="start" class="sm">− S&amp;S 250</text>
  <text x="314" y="241" text-anchor="end" class="sm">1,960</text>
  <rect x="46" y="264" width="151.4" height="30" rx="4" fill="#e11d48" fill-opacity="0.45"/>
  <text x="54" y="285" text-anchor="start" class="sm">− deductible 350</text>
  <text x="314" y="285" text-anchor="end" class="sm">1,610</text>
  <rect x="46" y="308" width="151.4" height="30" rx="4" fill="#3b82f6" fill-opacity="0.7"/>
  <text x="54" y="329" text-anchor="start" class="sm">net</text>
  <text x="314" y="329" text-anchor="end" class="sm bold">1,610</text>
  <text x="180" y="372" text-anchor="middle" class="sm dim">net is a derived figure — the estimate is made gross</text>
</svg>
