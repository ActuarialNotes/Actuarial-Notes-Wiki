<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Six claim predictors ranked by the impurity they remove, prior claims longest and gender barely there</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="118" y="110" text-anchor="end" class="sm">prior claims</text>
    <rect x="128" y="94" width="184" height="24" rx="3" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="118" y="150" text-anchor="end" class="sm">claim amount</text>
    <rect x="128" y="134" width="130.64" height="24" rx="3" fill="#3b82f6" fill-opacity="0.60"/>
    <text x="118" y="190" text-anchor="end" class="sm">days to report</text>
    <rect x="128" y="174" width="117.76" height="24" rx="3" fill="#3b82f6" fill-opacity="0.57"/>
    <text x="118" y="230" text-anchor="end" class="sm">territory</text>
    <rect x="128" y="214" width="22.08" height="24" rx="3" fill="#3b82f6" fill-opacity="0.31"/>
    <text x="118" y="270" text-anchor="end" class="sm">policy age</text>
    <rect x="128" y="254" width="16.56" height="24" rx="3" fill="#3b82f6" fill-opacity="0.29"/>
    <text x="118" y="310" text-anchor="end" class="sm">gender</text>
    <rect x="128" y="294" width="3.68" height="24" rx="3" fill="#3b82f6" fill-opacity="0.26"/>
    <line x1="128" y1="86" x2="128" y2="336" class="axis"/>
    <line x1="128" y1="336" x2="318" y2="336" class="axis"/>
    <line x1="128" y1="336" x2="128" y2="340" class="tick"/>
    <text x="128" y="353" text-anchor="middle" class="sm dim">0</text>
    <line x1="220" y1="336" x2="220" y2="340" class="tick"/>
    <text x="220" y="353" text-anchor="middle" class="sm dim">50</text>
    <line x1="312" y1="336" x2="312" y2="340" class="tick"/>
    <text x="312" y="353" text-anchor="middle" class="sm dim">100</text>
  </g>
</svg>
