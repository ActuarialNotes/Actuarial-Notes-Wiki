<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A GLM coefficient table read as multiplicative rating relativities</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Estimate, error, test, relativity</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">z = β̂ⱼ / SE(β̂ⱼ)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">relativity = e^β̂ⱼ (log link)</text>
  <rect x="28" y="100" width="304" height="36" rx="6" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="38" y="123" text-anchor="start" class="sm bold">term</text>
  <text x="146" y="123" text-anchor="middle" class="sm bold">β̂</text>
  <text x="196" y="123" text-anchor="middle" class="sm bold">SE</text>
  <text x="242" y="123" text-anchor="middle" class="sm bold">p</text>
  <text x="290" y="123" text-anchor="middle" class="sm bold">e^β̂</text>
  <line x1="28" y1="182" x2="332" y2="182" class="rule"/>
  <text x="38" y="169" text-anchor="start" class="sm">intercept</text>
  <text x="146" y="169" text-anchor="middle" class="sm">−2.30</text>
  <text x="196" y="169" text-anchor="middle" class="sm">0.06</text>
  <text x="242" y="169" text-anchor="middle" class="sm">&lt;.001</text>
  <text x="290" y="169" text-anchor="middle" class="sm">0.100</text>
  <line x1="28" y1="228" x2="332" y2="228" class="rule"/>
  <text x="38" y="215" text-anchor="start" class="sm">urban</text>
  <text x="146" y="215" text-anchor="middle" class="sm">0.26</text>
  <text x="196" y="215" text-anchor="middle" class="sm">0.08</text>
  <text x="242" y="215" text-anchor="middle" class="sm bold" fill="#059669">0.001</text>
  <text x="290" y="215" text-anchor="middle" class="sm">1.30</text>
  <line x1="28" y1="274" x2="332" y2="274" class="rule"/>
  <text x="38" y="261" text-anchor="start" class="sm">young driver</text>
  <text x="146" y="261" text-anchor="middle" class="sm">0.41</text>
  <text x="196" y="261" text-anchor="middle" class="sm">0.09</text>
  <text x="242" y="261" text-anchor="middle" class="sm bold" fill="#059669">&lt;.001</text>
  <text x="290" y="261" text-anchor="middle" class="sm">1.51</text>
  <line x1="28" y1="320" x2="332" y2="320" class="rule"/>
  <text x="38" y="307" text-anchor="start" class="sm">prior claim</text>
  <text x="146" y="307" text-anchor="middle" class="sm">0.18</text>
  <text x="196" y="307" text-anchor="middle" class="sm">0.10</text>
  <text x="242" y="307" text-anchor="middle" class="sm bold" fill="#d97706">0.069</text>
  <text x="290" y="307" text-anchor="middle" class="sm">1.20</text>
  <text x="180" y="366" text-anchor="middle" class="sm dim">e^0.26 = 1.30 → urban risks 30% more often</text>
  <text x="180" y="384" text-anchor="middle" class="sm dim">p = 0.069 → prior claim is not significant at 5%</text>
</svg>
