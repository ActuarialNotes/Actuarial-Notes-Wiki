<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The amount and the timing of loss each either transferred or not: only a contract transferring both is reinsurance, and every other combination is accounted for as a deposit</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <polygon points="64,92 196,92 196,224 326,224 326,352 64,352" fill="#d97706" fill-opacity="0.10" stroke="none"/>
    <rect x="196" y="92" width="130" height="132" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.3"/>
    <line x1="196" y1="224" x2="196" y2="352" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <line x1="64" y1="224" x2="196" y2="224" class="thin dash" stroke="var(--dim)" stroke-width="1.2"/>
    <line x1="64" y1="352" x2="338" y2="352" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="64" y1="352" x2="64" y2="80" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <text x="326" y="372" text-anchor="end" class="sm dim">when</text>
    <text x="54" y="96" text-anchor="end" class="sm dim" transform="rotate(-90 54 96)">how much</text>
    <path d="M261,118 L286.6,126.96 V148.72 Q286.6,171.76 261,182 Q235.4,171.76 235.4,148.72 V126.96 Z" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="261" y="208" text-anchor="middle" class="sm bold">reinsurance</text>
    <rect x="114" y="304" width="32" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="130" cy="310" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="304" rx="16" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="304" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <rect x="114" y="298" width="32" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="130" cy="304" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="298" rx="16" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="298" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <rect x="114" y="292" width="32" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="130" cy="298" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="292" rx="16" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="292" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <rect x="114" y="286" width="32" height="6" fill="#d97706" fill-opacity="0.25" stroke="none"/>
    <ellipse cx="130" cy="292" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="286" rx="16" ry="3.4" fill="var(--surf)" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="130" cy="286" rx="16" ry="3.4" fill="#d97706" fill-opacity="0.3" stroke="none"/>
    <text x="130" y="334" text-anchor="middle" class="sm bold">deposit</text>
  </g>
</svg>
