    <ellipse cx="180" cy="338" rx="16" ry="3.4" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.2"/>
    <ellipse cx="180" cy="338" rx="16" ry="3.4" fill="#7c3aed" fill-opacity="0.3" stroke="none"/>
