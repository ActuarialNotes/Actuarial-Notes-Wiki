<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The development the triangle cannot see, beyond its last observed age</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The development past the end of the data</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">CDF(last → ult) = f(last observed) × Tail</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1.020 × 1.010 = 1.030</text>
  <line x1="94.55" y1="100" x2="94.55" y2="322" class="grid"/>
  <line x1="184.73" y1="100" x2="184.73" y2="322" class="grid"/>
  <line x1="274.91" y1="100" x2="274.91" y2="322" class="grid"/>
  <line x1="72" y1="305.43" x2="320" y2="305.43" class="grid"/>
  <line x1="72" y1="206.03" x2="320" y2="206.03" class="grid"/>
  <line x1="72" y1="106.63" x2="320" y2="106.63" class="grid"/>
  <line x1="72" y1="322" x2="330" y2="322" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="322" x2="72" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="94.55" y1="322" x2="94.55" y2="326" class="tick"/>
  <text x="94.55" y="338" text-anchor="middle" class="sm dim">12</text>
  <line x1="184.73" y1="322" x2="184.73" y2="326" class="tick"/>
  <text x="184.73" y="338" text-anchor="middle" class="sm dim">60</text>
  <line x1="274.91" y1="322" x2="274.91" y2="326" class="tick"/>
  <text x="274.91" y="338" text-anchor="middle" class="sm dim">108</text>
  <line x1="68" y1="305.43" x2="72" y2="305.43" class="tick"/>
  <text x="64" y="309.03" text-anchor="end" class="sm dim">1.0</text>
  <line x1="68" y1="206.03" x2="72" y2="206.03" class="tick"/>
  <text x="64" y="209.63" text-anchor="end" class="sm dim">1.3</text>
  <line x1="68" y1="106.63" x2="72" y2="106.63" class="tick"/>
  <text x="64" y="110.23" text-anchor="end" class="sm dim">1.6</text>
  <polyline points="94.55,139.76 117.09,252.42 139.64,285.55 162.18,298.81" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="94.55" cy="139.76" r="3.4" fill="#3b82f6"/>
  <circle cx="117.09" cy="252.42" r="3.4" fill="#3b82f6"/>
  <circle cx="139.64" cy="285.55" r="3.4" fill="#3b82f6"/>
  <circle cx="162.18" cy="298.81" r="3.4" fill="#3b82f6"/>
  <polyline points="162.18,298.81 184.73,303.44 207.27,304.44 229.82,305.1 252.36,305.43 274.91,305.43 297.45,305.43" class="curve dash" stroke="#d97706" stroke-width="2.2"/>
  <line x1="173.45" y1="322" x2="173.45" y2="100" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="167.45" y="159.64" text-anchor="end" class="sm dim">data ends</text>
  <text x="229.82" y="272.3" text-anchor="middle" class="sm bold" fill="#d97706">extrapolated</text>
  <text x="180" y="354" text-anchor="middle" class="sm dim">age in months</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">a curve fit or an industry benchmark — and on</text>
  <text x="180" y="394" text-anchor="middle" class="sm dim">a long tail, the largest assumption in the analysis</text>
</svg>
