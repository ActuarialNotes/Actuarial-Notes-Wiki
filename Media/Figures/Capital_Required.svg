<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A waterfall of the running insurer's risk margins — insurance $92M, market $54M, credit $21M and operational $17M — less the $26M diversification credit, landing on $158M of capital required</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="36.67" y="234" width="33.66" height="118" rx="3" fill="#3b82f6" fill-opacity="0.72"/>
    <text x="53.5" y="226" text-anchor="middle" class="sm">92</text>
    <text x="53.5" y="367" text-anchor="middle" class="sm dim">insurance</text>
    <rect x="87.67" y="164.74" width="33.66" height="69.26" rx="3" fill="#0d9488" fill-opacity="0.72"/>
    <text x="104.5" y="156.74" text-anchor="middle" class="sm">54</text>
    <text x="104.5" y="367" text-anchor="middle" class="sm dim">market</text>
    <rect x="138.67" y="137.8" width="33.66" height="26.93" rx="3" fill="#d97706" fill-opacity="0.72"/>
    <text x="155.5" y="129.8" text-anchor="middle" class="sm">21</text>
    <text x="155.5" y="367" text-anchor="middle" class="sm dim">credit</text>
    <rect x="189.67" y="116" width="33.66" height="21.8" rx="3" fill="#7c3aed" fill-opacity="0.72"/>
    <text x="206.5" y="108" text-anchor="middle" class="sm">17</text>
    <text x="206.5" y="367" text-anchor="middle" class="sm dim">ops</text>
    <rect x="240.67" y="116" width="33.66" height="33.35" rx="3" fill="#059669" fill-opacity="0.72"/>
    <text x="257.5" y="108" text-anchor="middle" class="sm">−26</text>
    <text x="257.5" y="367" text-anchor="middle" class="sm dim">divers.</text>
    <rect x="291.67" y="149.35" width="33.66" height="202.65" rx="3" fill="#e11d48" fill-opacity="0.72"/>
    <text x="308.5" y="141.35" text-anchor="middle" class="sm">158</text>
    <text x="308.5" y="367" text-anchor="middle" class="sm dim">required</text>
    <line x1="22" y1="352" x2="340" y2="352" class="axis"/>
  </g>
</svg>
