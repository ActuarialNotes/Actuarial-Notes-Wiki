<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>An AR(1) forecast with a prediction interval widening to the stationary bound</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A forecast is a mean plus an interval</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Ŷ_{t+h} ± z·σ√(Σψ²_j)</text>
  <line x1="64" y1="100" x2="64" y2="314" class="grid"/>
  <line x1="145.25" y1="100" x2="145.25" y2="314" class="grid"/>
  <line x1="234.62" y1="100" x2="234.62" y2="314" class="grid"/>
  <line x1="315.88" y1="100" x2="315.88" y2="314" class="grid"/>
  <line x1="64" y1="269.42" x2="324" y2="269.42" class="grid"/>
  <line x1="64" y1="224.83" x2="324" y2="224.83" class="grid"/>
  <line x1="64" y1="180.25" x2="324" y2="180.25" class="grid"/>
  <line x1="64" y1="135.67" x2="324" y2="135.67" class="grid"/>
  <line x1="64" y1="314" x2="334" y2="314" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="314" x2="64" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="314" x2="64" y2="318" class="tick"/>
  <line x1="145.25" y1="314" x2="145.25" y2="318" class="tick"/>
  <line x1="234.62" y1="314" x2="234.62" y2="318" class="tick"/>
  <text x="234.62" y="330" text-anchor="middle" class="sm dim">now</text>
  <line x1="315.88" y1="314" x2="315.88" y2="318" class="tick"/>
  <line x1="60" y1="269.42" x2="64" y2="269.42" class="tick"/>
  <text x="56" y="273.02" text-anchor="end" class="sm dim">40</text>
  <line x1="60" y1="224.83" x2="64" y2="224.83" class="tick"/>
  <text x="56" y="228.43" text-anchor="end" class="sm dim">50</text>
  <line x1="60" y1="180.25" x2="64" y2="180.25" class="tick"/>
  <text x="56" y="183.85" text-anchor="end" class="sm dim">60</text>
  <line x1="60" y1="135.67" x2="64" y2="135.67" class="tick"/>
  <text x="56" y="139.27" text-anchor="end" class="sm dim">70</text>
  <polyline points="64,236.63 72.12,227.06 80.25,260.84 88.38,230.46 96.5,240.64 104.62,251.63 112.75,240.64 120.88,193.98 129,212.96 137.12,213.06 145.25,214.68 153.38,224.07 161.5,218.64 169.62,210.67 177.75,228.59 185.88,239.11 194,243.29 202.12,265.76 210.25,262.73 218.38,220.01 226.5,219.75 234.62,175.79" class="curve" stroke="#3b82f6" stroke-width="1.9"/>
  <polyline points="234.62,175.79 242.75,195.41 250.88,207.18 259,214.24 267.12,218.48 275.25,221.02 283.38,222.55 291.5,223.46 299.62,224.01 307.75,224.34 315.88,224.54" class="curve dash" stroke="#059669" stroke-width="2.3"/>
  <polyline points="234.62,175.79 242.75,160.46 250.88,166.42 259,171.58 267.12,175.15 275.25,177.46 283.38,178.9 291.5,179.79 299.62,180.32 307.75,180.65 315.88,180.85" class="curve" stroke="#059669" stroke-width="1.2"/>
  <polyline points="234.62,175.79 242.75,230.36 250.88,247.94 259,256.9 267.12,261.8 275.25,264.58 283.38,266.19 291.5,267.14 299.62,267.7 307.75,268.03 315.88,268.23" class="curve" stroke="#059669" stroke-width="1.2"/>
  <line x1="64" y1="224.83" x2="324" y2="224.83" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <line x1="234.62" y1="314" x2="234.62" y2="117.83" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <circle cx="250.88" cy="207.18" r="3.6" fill="#059669"/>
  <text x="258.88" y="199.18" text-anchor="start" class="sm bold" fill="#059669">53.96</text>
  <text x="180" y="346" text-anchor="middle" class="sm bold">two steps: (44.8, 63.1) at 95%</text>
  <text x="180" y="364" text-anchor="middle" class="sm dim">the interval stops widening — unlike a walk's</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">it carries process variance only, not model risk</text>
</svg>
