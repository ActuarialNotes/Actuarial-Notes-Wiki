<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Payments of 100 rising by 50 a period to 350, each bar a level block P with the accumulated increases Q on top</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="48" y1="344" x2="318" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="56" y1="340" x2="56" y2="348" class="tick"/>
    <text x="56" y="361" text-anchor="middle" class="sm dim">0</text>
    <line x1="96.67" y1="340" x2="96.67" y2="348" class="tick"/>
    <text x="96.67" y="361" text-anchor="middle" class="sm dim">1</text>
    <line x1="137.33" y1="340" x2="137.33" y2="348" class="tick"/>
    <text x="137.33" y="361" text-anchor="middle" class="sm dim">2</text>
    <line x1="178" y1="340" x2="178" y2="348" class="tick"/>
    <text x="178" y="361" text-anchor="middle" class="sm dim">3</text>
    <line x1="218.67" y1="340" x2="218.67" y2="348" class="tick"/>
    <text x="218.67" y="361" text-anchor="middle" class="sm dim">4</text>
    <line x1="259.33" y1="340" x2="259.33" y2="348" class="tick"/>
    <text x="259.33" y="361" text-anchor="middle" class="sm dim">5</text>
    <line x1="300" y1="340" x2="300" y2="348" class="tick"/>
    <text x="300" y="361" text-anchor="middle" class="sm dim">6</text>
    <rect x="84.67" y="284" width="24" height="60" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <text x="96.67" y="276" text-anchor="middle" class="sm">100</text>
    <rect x="125.33" y="284" width="24" height="60" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="125.33" y="254" width="24" height="30" rx="2" fill="#d97706" fill-opacity="0.6"/>
    <text x="137.33" y="246" text-anchor="middle" class="sm">150</text>
    <rect x="166" y="284" width="24" height="60" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="166" y="224" width="24" height="60" rx="2" fill="#d97706" fill-opacity="0.6"/>
    <text x="178" y="216" text-anchor="middle" class="sm">200</text>
    <rect x="206.67" y="284" width="24" height="60" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="206.67" y="194" width="24" height="90" rx="2" fill="#d97706" fill-opacity="0.6"/>
    <text x="218.67" y="186" text-anchor="middle" class="sm">250</text>
    <rect x="247.33" y="284" width="24" height="60" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="247.33" y="164" width="24" height="120" rx="2" fill="#d97706" fill-opacity="0.6"/>
    <text x="259.33" y="156" text-anchor="middle" class="sm">300</text>
    <rect x="288" y="284" width="24" height="60" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="288" y="134" width="24" height="150" rx="2" fill="#d97706" fill-opacity="0.6"/>
    <text x="300" y="126" text-anchor="middle" class="sm">350</text>
    <text x="79.67" y="318" text-anchor="end" class="bold">P</text>
    <text x="154.33" y="273" text-anchor="start" class="bold">Q</text>
  </g>
</svg>
