<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A claim payment of 2,850 on a timeline, followed later by a salvage recovery of 90 from the wreck and a subrogation recovery of 160 from the party at fault</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="40" y1="230" x2="330" y2="230" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <text x="330" y="248" text-anchor="end" class="sm dim">time</text>
    <line x1="80" y1="230" x2="80" y2="370" class="thin" stroke="#e11d48" stroke-width="2.4" marker-end="url(#ahe11d48)"/>
    <text x="90" y="336" text-anchor="start" class="sm bold">paid 2,850</text>
    <line x1="196" y1="230" x2="196" y2="184" class="thin" stroke="#059669" stroke-width="2.4" marker-end="url(#ah059669)"/>
    <text x="204" y="211" text-anchor="start" class="sm bold">+90</text>
    <path d="M171,151 V144 L181,142 L188,134 H205 L212,142 L221,145 V151 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="182" cy="152" r="4.5" fill="var(--surf)" stroke="#0d9488" stroke-width="1.6"/>
    <circle cx="210" cy="152" r="4.5" fill="var(--surf)" stroke="#0d9488" stroke-width="1.6"/>
    <text x="196" y="110" text-anchor="middle" class="sm bold">salvage</text>
    <line x1="284" y1="230" x2="284" y2="164" class="thin" stroke="#059669" stroke-width="2.4" marker-end="url(#ah059669)"/>
    <text x="292" y="201" text-anchor="start" class="sm bold">+160</text>
    <line x1="284" y1="105" x2="284" y2="146" stroke="#0d9488" stroke-width="1.8"/>
    <rect x="273" y="146" width="22" height="5" rx="2" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="261" y1="111" x2="307" y2="111" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="284" cy="104" r="2.5" fill="#0d9488"/>
    <line x1="261" y1="111" x2="253" y2="126" stroke="#0d9488" stroke-width="1"/>
    <line x1="261" y1="111" x2="269" y2="126" stroke="#0d9488" stroke-width="1"/>
    <path d="M251,126 Q261,133 271,126 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="307" y1="111" x2="299" y2="126" stroke="#0d9488" stroke-width="1"/>
    <line x1="307" y1="111" x2="315" y2="126" stroke="#0d9488" stroke-width="1"/>
    <path d="M297,126 Q307,133 317,126 Z" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="284" y="90" text-anchor="middle" class="sm bold">subrogation</text>
  </g>
</svg>
