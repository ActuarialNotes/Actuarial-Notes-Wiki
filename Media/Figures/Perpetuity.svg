  <line x1="74" y1="181.45" x2="274" y2="181.45" class="thin dash" stroke="#059669" stroke-width="1.3"/>
  <text x="278" y="185.05" text-anchor="start" class="sm dim">1/i = 20</text>
  <line x1="74" y1="236" x2="284" y2="236" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="236" x2="74" y2="166" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="236" x2="74" y2="240" class="tick"/>
  <text x="74" y="252" text-anchor="middle" class="sm dim">0</text>
  <line x1="174" y1="236" x2="174" y2="240" class="tick"/>
  <text x="174" y="252" text-anchor="middle" class="sm dim">20</text>
  <line x1="274" y1="236" x2="274" y2="240" class="tick"/>
  <text x="274" y="252" text-anchor="middle" class="sm dim">40</text>
  <line x1="70" y1="208.73" x2="74" y2="208.73" class="tick"/>
  <text x="66" y="212.33" text-anchor="end" class="sm dim">10</text>
  <line x1="70" y1="181.45" x2="74" y2="181.45" class="tick"/>
  <text x="66" y="185.05" text-anchor="end" class="sm dim">20</text>
  <text x="274" y="268" text-anchor="end" class="sm dim">number of payments n</text>
  <text x="70" y="162" text-anchor="start" class="sm dim">a₍ₙ₎</text>
  <text x="430" y="190" text-anchor="middle" class="sm bold">a₍∞₎ = 1/i</text>
  <text x="430" y="210" text-anchor="middle" class="sm dim">ä₍∞₎ = 1/d = (1+i)/i</text>
  <text x="430" y="234" text-anchor="middle" class="sm bold">ä₍∞₎ = 1 + a₍∞₎</text>
  <text x="430" y="254" text-anchor="middle" class="sm dim">one payment now, then a perpetuity</text>
  <text x="430" y="276" text-anchor="middle" class="sm dim">consols, ground rent, endowments</text>
</svg>
