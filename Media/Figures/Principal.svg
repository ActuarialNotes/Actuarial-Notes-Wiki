<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The principal portion of each payment growing as the balance falls</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The principal portion is what actually</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">repays the loan</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PR_k = P − I_k = P v^(n−k+1)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Σ PR_k = L exactly</text>
  <rect x="82.91" y="135.71" width="19.05" height="98.51" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="82.91" y="234.23" width="19.05" height="115.77" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="113.64" y="135.71" width="19.05" height="89.25" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="113.64" y="224.97" width="19.05" height="125.03" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="144.38" y="135.71" width="19.05" height="79.25" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="144.38" y="214.96" width="19.05" height="135.04" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="175.11" y="135.71" width="19.05" height="68.45" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="175.11" y="204.16" width="19.05" height="145.84" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="205.84" y="135.71" width="19.05" height="56.78" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="205.84" y="192.49" width="19.05" height="157.51" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="236.57" y="135.71" width="19.05" height="44.18" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="236.57" y="179.89" width="19.05" height="170.11" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="267.3" y="135.71" width="19.05" height="30.57" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="267.3" y="166.28" width="19.05" height="183.72" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <rect x="298.03" y="135.71" width="19.05" height="15.87" rx="2" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="298.03" y="151.59" width="19.05" height="198.41" rx="2" fill="#d97706" fill-opacity="0.7"/>
  <line x1="74" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="350" x2="74" y2="100" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="92.44" y1="350" x2="92.44" y2="354" class="tick"/>
  <text x="92.44" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="123.17" y1="350" x2="123.17" y2="354" class="tick"/>
  <text x="123.17" y="366" text-anchor="middle" class="sm dim">2</text>
  <line x1="153.9" y1="350" x2="153.9" y2="354" class="tick"/>
  <text x="153.9" y="366" text-anchor="middle" class="sm dim">3</text>
  <line x1="184.63" y1="350" x2="184.63" y2="354" class="tick"/>
  <text x="184.63" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="215.37" y1="350" x2="215.37" y2="354" class="tick"/>
  <text x="215.37" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="246.1" y1="350" x2="246.1" y2="354" class="tick"/>
  <text x="246.1" y="366" text-anchor="middle" class="sm dim">6</text>
  <line x1="276.83" y1="350" x2="276.83" y2="354" class="tick"/>
  <text x="276.83" y="366" text-anchor="middle" class="sm dim">7</text>
  <line x1="307.56" y1="350" x2="307.56" y2="354" class="tick"/>
  <text x="307.56" y="366" text-anchor="middle" class="sm dim">8</text>
  <line x1="70" y1="350" x2="74" y2="350" class="tick"/>
  <text x="66" y="353.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="226.86" x2="74" y2="226.86" class="tick"/>
  <text x="66" y="230.46" text-anchor="end" class="sm dim">1,000</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">payment number</text>
  <line x1="58" y1="92" x2="71" y2="92" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="77" y="95.6" text-anchor="start" class="sm">principal repaid</text>
  <line x1="58" y1="108" x2="71" y2="108" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="77" y="111.6" text-anchor="start" class="sm">interest</text>
</svg>
