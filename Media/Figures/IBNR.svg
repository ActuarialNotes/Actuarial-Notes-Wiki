<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>IBNR split into claims not yet reported and further development on claims already known</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Two different things under one name</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">IBNR = Ultimate − Reported</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">IBNR = Pure IBNR + IBNER</text>
  <text x="180" y="116" text-anchor="middle" class="sm dim">AY 2024 IBNR of 1,350 ($000)</text>
  <rect x="44" y="138" width="157.16" height="36" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="122.58" y="160" text-anchor="middle" class="sm">pure IBNR 780</text>
  <rect x="201.16" y="138" width="114.84" height="36" rx="4" fill="#e11d48" fill-opacity="0.30" stroke="#e11d48" stroke-width="1.2"/>
  <text x="258.58" y="160" text-anchor="middle" class="sm">IBNER 570</text>
  <rect x="48" y="211" width="11" height="11" rx="2" fill="#7c3aed" fill-opacity="0.8"/>
  <text x="66" y="221" text-anchor="start" class="sm bold">Pure IBNR</text>
  <text x="66" y="240" text-anchor="start" class="sm dim">claims that have happened but</text>
  <text x="66" y="257" text-anchor="start" class="sm dim">have not been reported at all</text>
  <rect x="48" y="289" width="11" height="11" rx="2" fill="#e11d48" fill-opacity="0.8"/>
  <text x="66" y="299" text-anchor="start" class="sm bold">IBNER</text>
  <text x="66" y="318" text-anchor="start" class="sm dim">development on the claims</text>
  <text x="66" y="335" text-anchor="start" class="sm dim">already in the case reserves</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">a triangle estimates the sum; only claim data splits it</text>
</svg>
