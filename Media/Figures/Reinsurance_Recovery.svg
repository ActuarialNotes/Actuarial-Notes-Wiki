<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The cedant's balance sheet carrying the full 2,250 of gross unpaid claims as a liability and the 640 due from the reinsurer as a separate asset</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="180" y1="90" x2="180" y2="370" class="rule"/>
    <line x1="30" y1="370" x2="330" y2="370" class="axis"/>
    <text x="100" y="100" text-anchor="middle" class="sm dim">assets</text>
    <text x="260" y="100" text-anchor="middle" class="sm dim">liabilities</text>
    <rect x="200" y="130" width="120" height="240" rx="4" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="260" y="254" text-anchor="middle" class="sm bold">gross 2,250</text>
    <rect x="40" y="301.73" width="120" height="68.27" rx="4" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <text x="100" y="339.87" text-anchor="middle" class="sm bold">recoverable 640</text>
    <rect x="84.32" y="184" width="31.36" height="56" rx="2" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="90.48" y="190.72" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="102.8" y="190.72" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="90.48" y="201.92" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="102.8" y="201.92" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="90.48" y="213.12" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="102.8" y="213.12" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="90.48" y="224.32" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <rect x="102.8" y="224.32" width="6.72" height="5.6" fill="#d97706" fill-opacity="0.55"/>
    <text x="100" y="172" text-anchor="middle" class="sm bold">reinsurer</text>
    <line x1="100" y1="244" x2="100" y2="297.73" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  </g>
</svg>
