<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Paid losses developing toward the same ultimate as reported losses, from further below</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The only figure that contains no</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">estimate</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Reported = Paid + Case Reserves</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Ultimate = Paid_n × CDF_paid(n → ult)</text>
  <line x1="109.14" y1="98" x2="109.14" y2="326" class="grid"/>
  <line x1="179.43" y1="98" x2="179.43" y2="326" class="grid"/>
  <line x1="249.71" y1="98" x2="249.71" y2="326" class="grid"/>
  <line x1="320" y1="98" x2="320" y2="326" class="grid"/>
  <line x1="74" y1="326" x2="320" y2="326" class="grid"/>
  <line x1="74" y1="219.12" x2="320" y2="219.12" class="grid"/>
  <line x1="74" y1="112.25" x2="320" y2="112.25" class="grid"/>
  <line x1="74" y1="326" x2="330" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="326" x2="74" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="109.14" y1="326" x2="109.14" y2="330" class="tick"/>
  <text x="109.14" y="342" text-anchor="middle" class="sm dim">12</text>
  <line x1="179.43" y1="326" x2="179.43" y2="330" class="tick"/>
  <text x="179.43" y="342" text-anchor="middle" class="sm dim">36</text>
  <line x1="249.71" y1="326" x2="249.71" y2="330" class="tick"/>
  <text x="249.71" y="342" text-anchor="middle" class="sm dim">60</text>
  <line x1="320" y1="326" x2="320" y2="330" class="tick"/>
  <text x="320" y="342" text-anchor="middle" class="sm dim">84</text>
  <line x1="70" y1="326" x2="74" y2="326" class="tick"/>
  <text x="66" y="329.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="219.12" x2="74" y2="219.12" class="tick"/>
  <text x="66" y="222.72" text-anchor="end" class="sm dim">1,500</text>
  <line x1="70" y1="112.25" x2="74" y2="112.25" class="tick"/>
  <text x="66" y="115.85" text-anchor="end" class="sm dim">3,000</text>
  <polyline points="109.14,219.12 144.29,165.69 179.43,140.04 214.57,128.85 249.71,124.93 284.86,123.29 320,122.94" class="curve" stroke="#3b82f6" stroke-width="2.2"/>
  <polyline points="109.14,283.25 144.29,219.12 179.43,172.81 214.57,143.6 249.71,130.78 284.86,125.08 320,122.94" class="curve" stroke="#059669" stroke-width="2.4"/>
  <line x1="74" y1="122.94" x2="320" y2="122.94" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="161.86" y="141.88" text-anchor="middle" class="sm bold" fill="#3b82f6">reported</text>
  <text x="208.71" y="204.62" text-anchor="middle" class="sm bold" fill="#059669">paid</text>
  <text x="302.43" y="114.94" text-anchor="end" class="sm dim">ultimate</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">age in months</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">immune to case-reserving changes, and</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">distorted instead by the speed of settlement</text>
</svg>
