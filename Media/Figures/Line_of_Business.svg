<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Four lines of business — auto, home, workers comp and liability — each with its own indicated rate change</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="176" y1="78" x2="176" y2="380" class="rule"/>
    <path d="M41,103 V96 L51,94 L58,86 H75 L82,94 L91,97 V103 Z" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="52" cy="104" r="4.5" fill="var(--surf)" stroke="#3b82f6" stroke-width="1.6"/>
    <circle cx="80" cy="104" r="4.5" fill="var(--surf)" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="66" y="134" text-anchor="middle" class="sm">Personal auto</text>
    <rect x="176" y="87" width="65.7" height="22" rx="3" fill="#3b82f6" fill-opacity="0.65"/>
    <text x="249.7" y="102" text-anchor="start" class="sm">+7.3%</text>
    <polygon points="52.32,175.72 52.32,197 79.68,197 79.68,175.72 66,160.52" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="62.58" y="184.84" width="6.84" height="12.16" fill="#d97706" fill-opacity="0.55"/>
    <text x="66" y="214" text-anchor="middle" class="sm">Homeowners</text>
    <rect x="176" y="167" width="112.5" height="22" rx="3" fill="#d97706" fill-opacity="0.65"/>
    <text x="296.5" y="182" text-anchor="start" class="sm">+12.5%</text>
    <circle cx="66" cy="246.6" r="6.84" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M53.84,277 V262.56 Q53.84,256.48 60.68,256.48 H71.32 Q78.16,256.48 78.16,262.56 V277 Z" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="66" y="294" text-anchor="middle" class="sm">Workers comp</text>
    <rect x="154.4" y="247" width="21.6" height="22" rx="3" fill="#059669" fill-opacity="0.65"/>
    <text x="146.4" y="262" text-anchor="end" class="sm">−2.4%</text>
    <rect x="55.92" y="320" width="20.16" height="36" rx="2" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="59.88" y="324.32" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="67.8" y="324.32" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="59.88" y="331.52" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="67.8" y="331.52" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="59.88" y="338.72" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="67.8" y="338.72" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="59.88" y="345.92" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <rect x="67.8" y="345.92" width="4.32" height="3.6" fill="#7c3aed" fill-opacity="0.55"/>
    <text x="66" y="374" text-anchor="middle" class="sm">General liability</text>
    <rect x="176" y="327" width="36.9" height="22" rx="3" fill="#7c3aed" fill-opacity="0.65"/>
    <text x="220.9" y="342" text-anchor="start" class="sm">+4.1%</text>
  </g>
</svg>
