<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 294" width="560" height="294" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="292.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Decompose: a level annuity of P plus a pure increase of Q</text>
  <line x1="88" y1="126" x2="442" y2="126" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="96" y1="122" x2="96" y2="130" class="tick"/>
  <text x="96" y="143" text-anchor="middle" class="sm dim">0</text>
  <line x1="150.67" y1="122" x2="150.67" y2="130" class="tick"/>
  <text x="150.67" y="143" text-anchor="middle" class="sm dim">1</text>
  <line x1="205.33" y1="122" x2="205.33" y2="130" class="tick"/>
  <text x="205.33" y="143" text-anchor="middle" class="sm dim">2</text>
  <line x1="260" y1="122" x2="260" y2="130" class="tick"/>
  <text x="260" y="143" text-anchor="middle" class="sm dim">3</text>
  <line x1="314.67" y1="122" x2="314.67" y2="130" class="tick"/>
  <text x="314.67" y="143" text-anchor="middle" class="sm dim">4</text>
  <line x1="369.33" y1="122" x2="369.33" y2="130" class="tick"/>
  <text x="369.33" y="143" text-anchor="middle" class="sm dim">5</text>
  <line x1="424" y1="122" x2="424" y2="130" class="tick"/>
  <text x="424" y="143" text-anchor="middle" class="sm dim">6</text>
  <rect x="139.67" y="111.14" width="22" height="14.86" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="150.67" y="104.14" text-anchor="middle" class="sm">100</text>
  <rect x="194.33" y="111.14" width="22" height="14.86" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="194.33" y="103.71" width="22" height="7.43" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="205.33" y="96.71" text-anchor="middle" class="sm">150</text>
  <rect x="249" y="111.14" width="22" height="14.86" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="249" y="96.29" width="22" height="14.86" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="260" y="89.29" text-anchor="middle" class="sm">200</text>
  <rect x="303.67" y="111.14" width="22" height="14.86" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="303.67" y="88.86" width="22" height="22.29" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="314.67" y="81.86" text-anchor="middle" class="sm">250</text>
  <rect x="358.33" y="111.14" width="22" height="14.86" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="358.33" y="81.43" width="22" height="29.71" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="369.33" y="74.43" text-anchor="middle" class="sm">300</text>
  <rect x="413" y="111.14" width="22" height="14.86" rx="2" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="413" y="74" width="22" height="37.14" rx="2" fill="#d97706" fill-opacity="0.55"/>
  <text x="424" y="67" text-anchor="middle" class="sm">350</text>
  <line x1="452" y1="82" x2="465" y2="82" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="471" y="85.6" text-anchor="start" class="sm">P = 100</text>
  <line x1="452" y1="98" x2="465" y2="98" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="471" y="101.6" text-anchor="start" class="sm">+ Q = 50</text>
  <line x1="28" y1="196" x2="532" y2="196" class="rule"/>
  <text x="280" y="218" text-anchor="middle" class="sm bold">PV = P · a₍ₙ₎  +  (Q / i) · ( a₍ₙ₎ − n vⁿ )</text>
  <text x="280" y="242" text-anchor="middle" class="sm dim">the level piece uses the ordinary annuity factor; the increase uses (Ia)₍ₙ₎</text>
  <text x="280" y="262" text-anchor="middle" class="sm dim">(Ia)₍ₙ₎ = (ä₍ₙ₎ − n vⁿ) / i</text>
  <text x="280" y="282" text-anchor="middle" class="sm dim">A negative Q gives a decreasing annuity — same formula</text>
</svg>
