<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The same rate effect routed to OCI instead of profit, leaving a systematic amount behind</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Same total, different line</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Profit keeps the locked-in unwind;</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">OCI takes the rate change</text>
  <rect x="75" y="92" width="210" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="110" text-anchor="middle" class="sm">IFIE for the period</text>
  <line x1="140" y1="122" x2="106" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="220" y1="122" x2="254" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="38" y="164" width="132" height="74" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="104" y="195" text-anchor="middle" class="sm">profit or loss</text>
  <text x="104" y="213" text-anchor="middle" class="sm dim">systematic, at the</text>
  <text x="104" y="226" text-anchor="middle" class="sm dim">locked-in rate</text>
  <rect x="190" y="164" width="132" height="74" rx="7" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.2"/>
  <text x="256" y="195" text-anchor="middle" class="sm">OCI</text>
  <text x="256" y="213" text-anchor="middle" class="sm dim">the effect of the</text>
  <text x="256" y="226" text-anchor="middle" class="sm dim">rate change</text>
  <line x1="30" y1="256" x2="330" y2="256" class="rule"/>
  <text x="180" y="278" text-anchor="middle" class="sm bold">comprehensive income is identical either way</text>
  <text x="180" y="306" text-anchor="middle" class="sm dim">elected by portfolio, applied to every group in it</text>
  <text x="180" y="332" text-anchor="middle" class="sm dim">the point is the mismatch: bonds at FVOCI move</text>
  <text x="180" y="348" text-anchor="middle" class="sm dim">through OCI, so the liability should too</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">and what is left in OCI is the duration mismatch</text>
</svg>
