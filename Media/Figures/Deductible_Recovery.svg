<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The insurer paying a claimant the full 700 of a claim, then billing the insured back for the 250 inside its deductible</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="162.08" y="100" width="35.84" height="64" rx="2" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="169.12" y="107.68" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="183.2" y="107.68" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="169.12" y="120.48" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="183.2" y="120.48" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="169.12" y="133.28" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="183.2" y="133.28" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="169.12" y="146.08" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="183.2" y="146.08" width="7.68" height="6.4" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="180" y="184" text-anchor="middle" class="sm bold">insurer</text>
    <circle cx="72" cy="271.4" r="11.16" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M52.16,321 V297.44 Q52.16,287.52 63.32,287.52 H80.68 Q91.84,287.52 91.84,297.44 V321 Z" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="72" y="342" text-anchor="middle" class="sm bold">claimant</text>
    <polygon points="265.68,286.28 265.68,321 310.32,321 310.32,286.28 288,261.48" fill="#059669" fill-opacity="0.18" stroke="#059669" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="282.42" y="301.16" width="11.16" height="19.84" fill="#059669" fill-opacity="0.55"/>
    <text x="288" y="342" text-anchor="middle" class="sm bold">insured</text>
    <line x1="154" y1="168" x2="96" y2="256" class="thin" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ah3b82f6)"/>
    <text x="112" y="206" text-anchor="end" class="sm bold">pays 700</text>
    <line x1="264" y1="256" x2="206" y2="168" class="thin dash" stroke="#059669" stroke-width="2.2" marker-end="url(#ah059669)"/>
    <text x="248" y="206" text-anchor="start" class="sm bold">repays 250</text>
  </g>
</svg>
