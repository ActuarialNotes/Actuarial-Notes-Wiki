<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Each cash flow's present value weighting its own time</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Each date is weighted by its share of</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">the price</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">D_Mac = Σ t · PV(C_t) / P</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the weights sum to 1</text>
  <rect x="89.63" y="333.2" width="15.4" height="16.8" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="112.97" y="334" width="15.4" height="16" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="136.3" y="334.76" width="15.4" height="15.24" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="159.63" y="335.49" width="15.4" height="14.51" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="182.97" y="336.18" width="15.4" height="13.82" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="206.3" y="336.84" width="15.4" height="13.16" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="229.63" y="337.46" width="15.4" height="12.54" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="252.97" y="338.06" width="15.4" height="11.94" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="276.3" y="338.63" width="15.4" height="11.37" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="299.63" y="122.6" width="15.4" height="227.4" rx="1.5" fill="#7c3aed" fill-opacity="0.7"/>
  <line x1="74" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="350" x2="74" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="97.33" y1="350" x2="97.33" y2="354" class="tick"/>
  <text x="97.33" y="366" text-anchor="middle" class="sm dim">1</text>
  <line x1="120.67" y1="350" x2="120.67" y2="354" class="tick"/>
  <text x="120.67" y="366" text-anchor="middle" class="sm dim">2</text>
  <line x1="144" y1="350" x2="144" y2="354" class="tick"/>
  <text x="144" y="366" text-anchor="middle" class="sm dim">3</text>
  <line x1="167.33" y1="350" x2="167.33" y2="354" class="tick"/>
  <text x="167.33" y="366" text-anchor="middle" class="sm dim">4</text>
  <line x1="190.67" y1="350" x2="190.67" y2="354" class="tick"/>
  <text x="190.67" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="214" y1="350" x2="214" y2="354" class="tick"/>
  <text x="214" y="366" text-anchor="middle" class="sm dim">6</text>
  <line x1="237.33" y1="350" x2="237.33" y2="354" class="tick"/>
  <text x="237.33" y="366" text-anchor="middle" class="sm dim">7</text>
  <line x1="260.67" y1="350" x2="260.67" y2="354" class="tick"/>
  <text x="260.67" y="366" text-anchor="middle" class="sm dim">8</text>
  <line x1="284" y1="350" x2="284" y2="354" class="tick"/>
  <text x="284" y="366" text-anchor="middle" class="sm dim">9</text>
  <line x1="307.33" y1="350" x2="307.33" y2="354" class="tick"/>
  <text x="307.33" y="366" text-anchor="middle" class="sm dim">10</text>
  <line x1="70" y1="350" x2="74" y2="350" class="tick"/>
  <text x="66" y="353.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="261.81" x2="74" y2="261.81" class="tick"/>
  <text x="66" y="265.41" text-anchor="end" class="sm dim">0.25</text>
  <line x1="70" y1="173.61" x2="74" y2="173.61" class="tick"/>
  <text x="66" y="177.21" text-anchor="end" class="sm dim">0.5</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">time t</text>
  <text x="70" y="82" text-anchor="start" class="sm dim">weight PV(C_t)/P</text>
  <line x1="263.18" y1="350" x2="263.18" y2="96" class="thin dash" stroke="#d97706" stroke-width="1.3"/>
  <text x="263.18" y="110" text-anchor="middle" class="sm bold" fill="#d97706">8.11</text>
</svg>
