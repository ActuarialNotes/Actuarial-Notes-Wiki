<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Reported losses as paid losses plus the case reserves still outstanding</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Paid plus case — what is known, not what</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">is owed</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Reported = Paid + Case Reserves</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Ultimate = Reported + IBNR</text>
  <line x1="102.38" y1="100" x2="102.38" y2="316" class="grid"/>
  <line x1="149.69" y1="100" x2="149.69" y2="316" class="grid"/>
  <line x1="197" y1="100" x2="197" y2="316" class="grid"/>
  <line x1="244.31" y1="100" x2="244.31" y2="316" class="grid"/>
  <line x1="291.62" y1="100" x2="291.62" y2="316" class="grid"/>
  <line x1="74" y1="316" x2="320" y2="316" class="grid"/>
  <line x1="74" y1="208" x2="320" y2="208" class="grid"/>
  <line x1="74" y1="100" x2="320" y2="100" class="grid"/>
  <line x1="74" y1="316" x2="330" y2="316" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="316" x2="74" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="102.38" y1="316" x2="102.38" y2="320" class="tick"/>
  <text x="102.38" y="332" text-anchor="middle" class="sm dim">12</text>
  <line x1="149.69" y1="316" x2="149.69" y2="320" class="tick"/>
  <text x="149.69" y="332" text-anchor="middle" class="sm dim">24</text>
  <line x1="197" y1="316" x2="197" y2="320" class="tick"/>
  <text x="197" y="332" text-anchor="middle" class="sm dim">36</text>
  <line x1="244.31" y1="316" x2="244.31" y2="320" class="tick"/>
  <text x="244.31" y="332" text-anchor="middle" class="sm dim">48</text>
  <line x1="291.62" y1="316" x2="291.62" y2="320" class="tick"/>
  <text x="291.62" y="332" text-anchor="middle" class="sm dim">60</text>
  <line x1="70" y1="316" x2="74" y2="316" class="tick"/>
  <text x="66" y="319.6" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="208" x2="74" y2="208" class="tick"/>
  <text x="66" y="211.6" text-anchor="end" class="sm dim">1,500</text>
  <line x1="70" y1="100" x2="74" y2="100" class="tick"/>
  <text x="66" y="103.6" text-anchor="end" class="sm dim">3,000</text>
  <rect x="89.14" y="184.24" width="26.49" height="131.76" rx="2" fill="#059669" fill-opacity="0.72"/>
  <rect x="89.14" y="180.5" width="26.49" height="3.74" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="136.45" y="181.36" width="26.49" height="134.64" rx="2" fill="#059669" fill-opacity="0.72"/>
  <rect x="136.45" y="169.91" width="26.49" height="11.45" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="183.75" y="194.97" width="26.49" height="121.03" rx="2" fill="#059669" fill-opacity="0.72"/>
  <rect x="183.75" y="165.66" width="26.49" height="29.3" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="231.06" y="223.7" width="26.49" height="92.3" rx="2" fill="#059669" fill-opacity="0.72"/>
  <rect x="231.06" y="170.2" width="26.49" height="53.5" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <rect x="278.37" y="272.8" width="26.49" height="43.2" rx="2" fill="#059669" fill-opacity="0.72"/>
  <rect x="278.37" y="208" width="26.49" height="64.8" rx="2" fill="#d97706" fill-opacity="0.72"/>
  <text x="180" y="346" text-anchor="middle" class="sm dim">age of each accident year at 12/31/2024</text>
  <line x1="60" y1="368" x2="73" y2="368" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="79" y="371.6" text-anchor="start" class="sm">paid</text>
  <line x1="164" y1="368" x2="177" y2="368" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  <text x="183" y="371.6" text-anchor="start" class="sm">case</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">case reserves are an estimate — so reported is too</text>
</svg>
