<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Forward selection adding predictors while AIC falls and then rises</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Add a term only while the criterion</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">improves</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">compare by AIC, BIC or deviance</text>
  <line x1="85.66" y1="114" x2="85.66" y2="334" class="grid"/>
  <line x1="129.79" y1="114" x2="129.79" y2="334" class="grid"/>
  <line x1="173.93" y1="114" x2="173.93" y2="334" class="grid"/>
  <line x1="218.07" y1="114" x2="218.07" y2="334" class="grid"/>
  <line x1="262.21" y1="114" x2="262.21" y2="334" class="grid"/>
  <line x1="306.34" y1="114" x2="306.34" y2="334" class="grid"/>
  <line x1="68" y1="297.33" x2="324" y2="297.33" class="grid"/>
  <line x1="68" y1="224" x2="324" y2="224" class="grid"/>
  <line x1="68" y1="150.67" x2="324" y2="150.67" class="grid"/>
  <line x1="68" y1="334" x2="324" y2="334" class="axis"/>
  <line x1="68" y1="114" x2="68" y2="334" class="axis"/>
  <line x1="85.66" y1="334" x2="85.66" y2="338" class="tick"/>
  <text x="85.66" y="350" text-anchor="middle" class="sm dim">+0</text>
  <line x1="129.79" y1="334" x2="129.79" y2="338" class="tick"/>
  <text x="129.79" y="350" text-anchor="middle" class="sm dim">+1</text>
  <line x1="173.93" y1="334" x2="173.93" y2="338" class="tick"/>
  <text x="173.93" y="350" text-anchor="middle" class="sm dim">+2</text>
  <line x1="218.07" y1="334" x2="218.07" y2="338" class="tick"/>
  <text x="218.07" y="350" text-anchor="middle" class="sm dim">+3</text>
  <line x1="262.21" y1="334" x2="262.21" y2="338" class="tick"/>
  <text x="262.21" y="350" text-anchor="middle" class="sm dim">+4</text>
  <line x1="306.34" y1="334" x2="306.34" y2="338" class="tick"/>
  <text x="306.34" y="350" text-anchor="middle" class="sm dim">+5</text>
  <line x1="64" y1="297.33" x2="68" y2="297.33" class="tick"/>
  <text x="60" y="300.93" text-anchor="end" class="sm dim">4090</text>
  <line x1="64" y1="224" x2="68" y2="224" class="tick"/>
  <text x="60" y="227.6" text-anchor="end" class="sm dim">4110</text>
  <line x1="64" y1="150.67" x2="68" y2="150.67" class="tick"/>
  <text x="60" y="154.27" text-anchor="end" class="sm dim">4130</text>
  <polyline points="85.66,128.67 129.79,216.67 173.93,275.33 218.07,315.67 262.21,304.67 306.34,282.67" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <circle cx="85.66" cy="128.67" r="3.6" fill="#3b82f6"/>
  <circle cx="129.79" cy="216.67" r="3.6" fill="#3b82f6"/>
  <circle cx="173.93" cy="275.33" r="3.6" fill="#3b82f6"/>
  <circle cx="218.07" cy="315.67" r="3.6" fill="#059669"/>
  <circle cx="262.21" cy="304.67" r="3.6" fill="#3b82f6"/>
  <circle cx="306.34" cy="282.67" r="3.6" fill="#3b82f6"/>
  <circle cx="218.07" cy="315.67" r="5" fill="#059669"/>
  <text x="218.07" y="304.67" text-anchor="middle" class="sm bold" fill="#059669">stop here</text>
  <text x="180" y="92" text-anchor="middle" class="sm dim">terms added, in order of significance</text>
  <text x="180" y="368" text-anchor="middle" class="sm dim">forward · backward · stepwise · criterion-based</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">statistics propose; judgement disposes</text>
</svg>
