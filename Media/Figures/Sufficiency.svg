<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The likelihood factorizing into a piece that sees θ and a piece that does not</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The likelihood factors through T(x):</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">Fisher–Neyman</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">f(x₁,…,xₙ | θ) = g(T(x), θ) · h(x)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Fisher–Neyman factorization</text>
  <rect x="40" y="96" width="300" height="44" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="190" y="122" text-anchor="middle" class="sm">f(x₁, …, xₙ | θ)</text>
  <line x1="120" y1="144" x2="96" y2="178" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <line x1="260" y1="144" x2="284" y2="178" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
  <rect x="34" y="182" width="146" height="66" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
  <text x="107" y="209" text-anchor="middle" class="sm">g(T(x), θ)</text>
  <text x="107" y="227" text-anchor="middle" class="sm dim">sees θ, only via T</text>
  <rect x="200" y="182" width="146" height="66" rx="7" fill="var(--dim)" fill-opacity="0.12" stroke="var(--dim)" stroke-width="1.2"/>
  <text x="273" y="209" text-anchor="middle" class="sm">h(x)</text>
  <text x="273" y="227" text-anchor="middle" class="sm dim">free of θ</text>
  <text x="180" y="280" text-anchor="middle" class="sm dim">so once T is known,</text>
  <rect x="54" y="292" width="252" height="44" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="180" y="318" text-anchor="middle" class="sm">the rest of the data is noise</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">Rao–Blackwell: conditioning on T</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">never raises the variance</text>
</svg>
