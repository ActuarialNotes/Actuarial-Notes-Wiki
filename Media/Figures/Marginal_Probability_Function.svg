<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The joint probabilities as discs on a three-by-three lattice, with each column's total drawn as a bar above it and each row's total as a bar beside it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="95" y1="164" x2="95" y2="362" class="grid"/>
    <line x1="62" y1="329" x2="260" y2="329" class="grid"/>
    <line x1="95" y1="362" x2="95" y2="366" class="tick"/>
    <text x="95" y="378" text-anchor="middle" class="sm dim">0</text>
    <line x1="58" y1="329" x2="62" y2="329" class="tick"/>
    <text x="54" y="333" text-anchor="end" class="sm dim">0</text>
    <line x1="161" y1="164" x2="161" y2="362" class="grid"/>
    <line x1="62" y1="263" x2="260" y2="263" class="grid"/>
    <line x1="161" y1="362" x2="161" y2="366" class="tick"/>
    <text x="161" y="378" text-anchor="middle" class="sm dim">1</text>
    <line x1="58" y1="263" x2="62" y2="263" class="tick"/>
    <text x="54" y="267" text-anchor="end" class="sm dim">1</text>
    <line x1="227" y1="164" x2="227" y2="362" class="grid"/>
    <line x1="62" y1="197" x2="260" y2="197" class="grid"/>
    <line x1="227" y1="362" x2="227" y2="366" class="tick"/>
    <text x="227" y="378" text-anchor="middle" class="sm dim">2</text>
    <line x1="58" y1="197" x2="62" y2="197" class="tick"/>
    <text x="54" y="201" text-anchor="end" class="sm dim">2</text>
    <line x1="62" y1="362" x2="272" y2="362" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="62" y1="362" x2="62" y2="152" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <text x="276" y="366" text-anchor="start" class="sm dim">x</text>
    <text x="56" y="148" text-anchor="end" class="sm dim">y</text>
    <circle cx="95" cy="329" r="19.6" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="95" cy="263" r="17.53" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="95" cy="197" r="8.76" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="161" cy="329" r="15.18" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="161" cy="263" r="27.71" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="161" cy="197" r="23.19" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="227" cy="329" r="12.39" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="227" cy="263" r="21.47" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <circle cx="227" cy="197" r="30.36" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.3"/>
    <rect x="81" y="120" width="28" height="26" rx="3" fill="#d97706" fill-opacity="0.7"/>
    <rect x="284" y="315" width="26" height="28" rx="3" fill="#059669" fill-opacity="0.7"/>
    <rect x="147" y="94" width="28" height="52" rx="3" fill="#d97706" fill-opacity="0.7"/>
    <rect x="284" y="249" width="52" height="28" rx="3" fill="#059669" fill-opacity="0.7"/>
    <rect x="213" y="94" width="28" height="52" rx="3" fill="#d97706" fill-opacity="0.7"/>
    <rect x="284" y="183" width="52" height="28" rx="3" fill="#059669" fill-opacity="0.7"/>
    <line x1="62" y1="146" x2="260" y2="146" class="axis"/>
    <line x1="284" y1="164" x2="284" y2="362" class="axis"/>
    <text x="54" y="114" text-anchor="end" class="sm bold">pₓ</text>
    <text x="284" y="158" text-anchor="start" class="sm bold">p_Y</text>
  </g>
</svg>
