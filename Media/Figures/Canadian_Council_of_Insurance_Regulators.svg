<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>CCIR harmonising a position that each member regulator must then adopt itself</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">It harmonises; it cannot compel</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">CCIR position → each regulator adopts</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">no legal authority of its own</text>
  <rect x="70" y="94" width="220" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="112" text-anchor="middle" class="sm">CCIR agrees a position</text>
  <line x1="180" y1="124" x2="62" y2="158" class="thin dash" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="29" y="164" width="66" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="62" y="180" text-anchor="middle" class="sm">FSRA</text>
  <text x="62" y="204" text-anchor="middle" class="sm dim">adopts</text>
  <text x="62" y="219" text-anchor="middle" class="sm dim">separately</text>
  <line x1="180" y1="124" x2="141" y2="158" class="thin dash" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="108" y="164" width="66" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="141" y="180" text-anchor="middle" class="sm">AMF</text>
  <text x="141" y="204" text-anchor="middle" class="sm dim">adopts</text>
  <text x="141" y="219" text-anchor="middle" class="sm dim">separately</text>
  <line x1="180" y1="124" x2="220" y2="158" class="thin dash" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="187" y="164" width="66" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="220" y="180" text-anchor="middle" class="sm">BCFSA</text>
  <text x="220" y="204" text-anchor="middle" class="sm dim">adopts</text>
  <text x="220" y="219" text-anchor="middle" class="sm dim">separately</text>
  <line x1="180" y1="124" x2="299" y2="158" class="thin dash" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="266" y="164" width="66" height="24" rx="12.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="299" y="180" text-anchor="middle" class="sm">Alberta</text>
  <text x="299" y="204" text-anchor="middle" class="sm dim">adopts</text>
  <text x="299" y="219" text-anchor="middle" class="sm dim">separately</text>
  <line x1="30" y1="244" x2="330" y2="244" class="rule"/>
  <text x="44" y="268" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="60" y="268" text-anchor="start" class="sm">the Market Conduct Annual Statement</text>
  <text x="44" y="292" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="60" y="292" text-anchor="start" class="sm">the fair-treatment-of-customers guidance</text>
  <text x="44" y="316" text-anchor="start" class="sm" fill="#0d9488">•</text>
  <text x="60" y="316" text-anchor="start" class="sm">harmonised forms and filings</text>
  <text x="180" y="356" text-anchor="middle" class="sm dim">it is not a regulator, and OSFI keeps solvency</text>
</svg>
