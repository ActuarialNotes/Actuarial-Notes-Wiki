<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Workers' compensation as a temple of 1913 held up by five columns: no-fault compensation, collective liability, security of payment, exclusive jurisdiction and an independent board</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <polygon points="34,142 180,92 326,142" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="180" y="130" text-anchor="middle" class="bold">1913</text>
    <rect x="34" y="144" width="292" height="14" rx="2" fill="#0d9488" fill-opacity="0.30" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="47" y="162" width="34" height="172" rx="3" fill="#059669" fill-opacity="0.20" stroke="#059669" stroke-width="1.3"/>
    <text x="64" y="252" text-anchor="middle" class="sm" transform="rotate(-90 64 248)">no-fault</text>
    <rect x="105" y="162" width="34" height="172" rx="3" fill="#0d9488" fill-opacity="0.20" stroke="#0d9488" stroke-width="1.3"/>
    <text x="122" y="252" text-anchor="middle" class="sm" transform="rotate(-90 122 248)">collective</text>
    <rect x="163" y="162" width="34" height="172" rx="3" fill="#3b82f6" fill-opacity="0.20" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="252" text-anchor="middle" class="sm" transform="rotate(-90 180 248)">security</text>
    <rect x="221" y="162" width="34" height="172" rx="3" fill="#7c3aed" fill-opacity="0.20" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="238" y="252" text-anchor="middle" class="sm" transform="rotate(-90 238 248)">exclusive</text>
    <rect x="279" y="162" width="34" height="172" rx="3" fill="#d97706" fill-opacity="0.20" stroke="#d97706" stroke-width="1.3"/>
    <text x="296" y="252" text-anchor="middle" class="sm" transform="rotate(-90 296 248)">independent</text>
    <rect x="30" y="338" width="300" height="14" rx="2" fill="#0d9488" fill-opacity="0.30" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="22" y="354" width="316" height="14" rx="2" fill="#0d9488" fill-opacity="0.30" stroke="#0d9488" stroke-width="1.2"/>
  </g>
</svg>
