<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A waterfall from $558 of premium down through $300 of losses, $60 of LAE and $170 of expenses to $28 of underwriting profit</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="23" y="108" width="42" height="240" rx="2" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="44" y="100" text-anchor="middle" class="sm">558</text>
    <text x="44" y="366" text-anchor="middle" class="sm dim">premium</text>
    <rect x="85" y="108" width="42" height="129.04" rx="2" fill="#3b82f6" fill-opacity="0.34" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="106" y="100" text-anchor="middle" class="sm">300</text>
    <text x="106" y="366" text-anchor="middle" class="sm dim">losses</text>
    <line x1="65" y1="108" x2="85" y2="108" class="thin dash" stroke="var(--dim)" stroke-width="1"/>
    <rect x="147" y="237.04" width="42" height="25.81" rx="2" fill="#0d9488" fill-opacity="0.34" stroke="#0d9488" stroke-width="1.2"/>
    <text x="168" y="229.04" text-anchor="middle" class="sm">60</text>
    <text x="168" y="366" text-anchor="middle" class="sm dim">LAE</text>
    <line x1="127" y1="237.04" x2="147" y2="237.04" class="thin dash" stroke="var(--dim)" stroke-width="1"/>
    <rect x="209" y="262.85" width="42" height="73.15" rx="2" fill="#d97706" fill-opacity="0.34" stroke="#d97706" stroke-width="1.2"/>
    <text x="230" y="254.85" text-anchor="middle" class="sm">170</text>
    <text x="230" y="366" text-anchor="middle" class="sm dim">expenses</text>
    <line x1="189" y1="262.85" x2="209" y2="262.85" class="thin dash" stroke="var(--dim)" stroke-width="1"/>
    <line x1="251" y1="336" x2="271" y2="336" class="thin dash" stroke="var(--dim)" stroke-width="1"/>
    <rect x="271" y="336" width="42" height="12" rx="2" fill="#059669" fill-opacity="0.6" stroke="#059669" stroke-width="1.2"/>
    <text x="292" y="328" text-anchor="middle" class="sm bold">28</text>
    <text x="292" y="366" text-anchor="middle" class="sm bold">profit</text>
  </g>
</svg>
