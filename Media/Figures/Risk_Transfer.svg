<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The two risks a reinsurance contract must transfer, and the features that destroy the transfer</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Transfer both, or account for it as a</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">deposit</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Insurance risk = underwriting + timing</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">how much is paid, and when</text>
  <rect x="40" y="94" width="124" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="102" y="112" text-anchor="middle" class="sm">underwriting</text>
  <text x="102" y="136" text-anchor="middle" class="sm dim">how much</text>
  <rect x="196" y="94" width="124" height="28" rx="14.0" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.2"/>
  <text x="258" y="112" text-anchor="middle" class="sm">timing</text>
  <text x="258" y="136" text-anchor="middle" class="sm dim">when</text>
  <line x1="30" y1="158" x2="330" y2="158" class="rule"/>
  <text x="180" y="180" text-anchor="middle" class="sm bold" fill="#e11d48">features that destroy the transfer</text>
  <text x="38" y="204" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="54" y="204" text-anchor="start" class="sm">a loss ratio corridor</text>
  <text x="38" y="228" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="54" y="228" text-anchor="start" class="sm">an aggregate limit just above expected loss</text>
  <text x="38" y="252" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="54" y="252" text-anchor="start" class="sm">retrospective premium adjustment</text>
  <text x="38" y="276" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="54" y="276" text-anchor="start" class="sm">profit commissions that give the profit back</text>
  <text x="38" y="300" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="54" y="300" text-anchor="start" class="sm">and any side letter, documented or not</text>
  <rect x="40" y="330" width="280" height="46" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="180" y="350" text-anchor="middle" class="sm">fail the test and it is deposit accounting:</text>
  <text x="180" y="367" text-anchor="middle" class="sm">no ceded premium, no ceded losses, no relief</text>
</svg>
