<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" width="560" height="296" role="img">
  <title>Market value moving with the prevailing yield while book value follows its own schedule</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="294.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Market value follows today's yield; book value follows the original one</text>
  <polyline points="72,148 97.4,148 122.8,148 148.2,148 173.6,148 199,148 224.4,148 249.8,148 275.2,148 300.6,148 326,148" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="72,148 97.4,133.46 122.8,115.41 148.2,128.93 173.6,157.99 199,172.93 224.4,159.14 249.8,148 275.2,145.01 300.6,148 326,148" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <line x1="72" y1="208" x2="336" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="208" x2="72" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="72" y1="208" x2="72" y2="212" class="tick"/>
  <text x="72" y="224" text-anchor="middle" class="sm dim">0</text>
  <line x1="199" y1="208" x2="199" y2="212" class="tick"/>
  <text x="199" y="224" text-anchor="middle" class="sm dim">5</text>
  <line x1="326" y1="208" x2="326" y2="212" class="tick"/>
  <text x="326" y="224" text-anchor="middle" class="sm dim">10</text>
  <line x1="68" y1="188" x2="72" y2="188" class="tick"/>
  <text x="64" y="191.6" text-anchor="end" class="sm dim">900</text>
  <line x1="68" y1="148" x2="72" y2="148" class="tick"/>
  <text x="64" y="151.6" text-anchor="end" class="sm dim">1,000</text>
  <line x1="68" y1="108" x2="72" y2="108" class="tick"/>
  <text x="64" y="111.6" text-anchor="end" class="sm dim">1,100</text>
  <text x="326" y="240" text-anchor="end" class="sm dim">coupons paid</text>
  <text x="68" y="54" text-anchor="start" class="sm dim">value</text>
  <line x1="74" y1="264" x2="87" y2="264" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <text x="93" y="267.6" text-anchor="start" class="sm">book value</text>
  <line x1="192" y1="264" x2="205" y2="264" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="211" y="267.6" text-anchor="start" class="sm">market value</text>
  <text x="430" y="100" text-anchor="middle" class="sm bold">MV = Fr·a₍ₙ₎ + C·vⁿ</text>
  <text x="430" y="120" text-anchor="middle" class="sm dim">at the prevailing market yield</text>
  <line x1="340" y1="142" x2="340" y2="174" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="154" text-anchor="start" class="sm bold">Market yield &gt; r</text>
  <text x="350" y="170" text-anchor="start" class="sm dim">trades below face — a discount</text>
  <line x1="340" y1="188" x2="340" y2="220" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="200" text-anchor="start" class="sm bold">Market yield &lt; r</text>
  <text x="350" y="216" text-anchor="start" class="sm dim">trades above face — a premium</text>
  <line x1="340" y1="234" x2="340" y2="266" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="350" y="246" text-anchor="start" class="sm bold">Three different things</text>
  <text x="350" y="262" text-anchor="start" class="sm dim">market, book and face value</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">Both converge on C at maturity, whatever happens in between</text>
</svg>
