<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The a priori 2,600 split into its expected reported and unreported shares, the unreported 47.4% carried down beside AY 2024's actual 1,500 reported to make a 2,732 ultimate</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="40" y="120" text-anchor="start" class="sm bold">a priori 2,600</text>
    <rect x="40" y="130" width="140.26" height="44" rx="4" fill="var(--dim)" fill-opacity="0.14" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="110.13" y="156" text-anchor="middle" class="sm">52.6%</text>
    <rect x="180.26" y="130" width="126.25" height="44" rx="4" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="243.38" y="156" text-anchor="middle" class="sm bold">47.4%</text>
    <polygon points="180.26,174 306.51,174 320,280 193.75,280" fill="#7c3aed" fill-opacity="0.1" stroke="none"/>
    <rect x="40" y="280" width="153.75" height="44" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="116.88" y="306" text-anchor="middle" class="sm bold">reported 1,500</text>
    <rect x="193.75" y="280" width="126.25" height="44" rx="4" fill="#7c3aed" fill-opacity="0.34" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="256.88" y="306" text-anchor="middle" class="sm bold">IBNR 1,232</text>
    <path d="M40,330 v4.8 H175 q5,0 5,4.4 q0,-4.4 5,-4.4 H320 v-4.8" class="thin" stroke="var(--dim)" stroke-width="1.2"/>
    <text x="180" y="349" text-anchor="middle" class="sm bold">BF 2,732</text>
  </g>
</svg>
