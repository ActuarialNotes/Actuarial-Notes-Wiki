  <text x="192" y="175.5" text-anchor="middle" class="sm" fill="#3b82f6">±σ</text>
  <text x="432" y="86" text-anchor="middle" class="sm bold">Var(X) = E[(X − μ)²]</text>
  <text x="432" y="106" text-anchor="middle" class="sm dim">= E[X²] − μ²</text>
  <line x1="336" y1="126" x2="336" y2="158" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
  <text x="346" y="138" text-anchor="start" class="sm bold">Var(aX + b) = a² Var(X)</text>
  <text x="346" y="154" text-anchor="start" class="sm dim">shifts do not change spread</text>
  <line x1="336" y1="172" x2="336" y2="204" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="346" y="184" text-anchor="start" class="sm bold">Var(X) ≥ 0</text>
  <text x="346" y="200" text-anchor="start" class="sm dim">zero only for a constant X</text>
  <line x1="336" y1="218" x2="336" y2="250" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
  <text x="346" y="230" text-anchor="start" class="sm bold">Units are squared</text>
  <text x="346" y="246" text-anchor="start" class="sm dim">take √ for standard deviation</text>
