  <text x="180" y="40" text-anchor="middle" class="ttl">Interest credited m times a year</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">(1 + i⁽ᵐ⁾/m)ᵐ = 1 + i</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">i⁽ᵐ⁾ = 12% quoted throughout</text>
