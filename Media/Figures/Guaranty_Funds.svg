<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A failed insurer's shortfall assessed on the surviving members by market share, after the fact</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The survivors pay, in proportion to</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">market share</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Assessment = shortfall × premium share</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">levied after the failure, not before</text>
  <rect x="70" y="90" width="220" height="28" rx="14.0" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="108" text-anchor="middle" class="sm">insurer fails — shortfall</text>
  <line x1="180" y1="120" x2="64" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="38" y="130" width="52" height="66" rx="4" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="64" y="214" text-anchor="middle" class="sm dim">A 40%</text>
  <line x1="180" y1="120" x2="141" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="115" y="141" width="52" height="55" rx="4" fill="#0d9488" fill-opacity="0.55"/>
  <text x="141" y="214" text-anchor="middle" class="sm dim">B 30%</text>
  <line x1="180" y1="120" x2="218" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="192" y="152" width="52" height="44" rx="4" fill="#d97706" fill-opacity="0.55"/>
  <text x="218" y="214" text-anchor="middle" class="sm dim">C 20%</text>
  <line x1="180" y1="120" x2="295" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <rect x="269" y="163" width="52" height="33" rx="4" fill="#059669" fill-opacity="0.55"/>
  <text x="295" y="214" text-anchor="middle" class="sm dim">D 10%</text>
  <text x="180" y="240" text-anchor="middle" class="sm dim">none of them chose the failed insurer's risk</text>
  <line x1="30" y1="262" x2="330" y2="262" class="rule"/>
  <text x="36" y="284" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="284" text-anchor="start" class="sm">post-assessment: the fund holds little standing cash</text>
  <text x="36" y="308" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="308" text-anchor="start" class="sm">coverage is capped per claim and per policy</text>
  <text x="36" y="332" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="332" text-anchor="start" class="sm">an annual cap spreads a big failure over years</text>
  <text x="36" y="356" text-anchor="start" class="sm" fill="#7c3aed">•</text>
  <text x="52" y="356" text-anchor="start" class="sm">and capacity runs out on a very large member</text>
</svg>
