  <text x="180" y="430" text-anchor="middle" class="fml">Trend Factor = (1 + t)ⁿ = 1.05^2.75 = 1.142</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1 + t_PP = (1 + t_freq)(1 + t_sev)</text>
