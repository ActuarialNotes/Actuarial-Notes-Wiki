<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A capital-ratio thermometer filled to the running insurer's 235.4%, above the 100% minimum line and the 150% supervisory and 185% internal targets</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="90" y="90" width="60" height="282" rx="4" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.1"/>
    <rect x="90" y="128.47" width="60" height="243.53" rx="4" fill="#3b82f6" fill-opacity="0.42"/>
    <line x1="82" y1="340.67" x2="156" y2="340.67" class="thin dash" stroke="#e11d48" stroke-width="1.4"/>
    <text x="166" y="344.67" text-anchor="start" class="sm" fill="#e11d48">100% minimum</text>
    <line x1="82" y1="262.33" x2="156" y2="262.33" class="thin dash" stroke="#d97706" stroke-width="1.4"/>
    <text x="166" y="266.33" text-anchor="start" class="sm" fill="#d97706">150% supervisory</text>
    <line x1="82" y1="207.5" x2="156" y2="207.5" class="thin dash" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="166" y="211.5" text-anchor="start" class="sm" fill="#7c3aed">185% internal</text>
    <text x="82" y="125.47" text-anchor="end" class="bold">235.4%</text>
    <rect x="47.92" y="144.47" width="20.16" height="36" rx="2" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="51.88" y="148.79" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="59.8" y="148.79" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="51.88" y="155.99" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="59.8" y="155.99" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="51.88" y="163.19" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="59.8" y="163.19" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="51.88" y="170.39" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="59.8" y="170.39" width="4.32" height="3.6" fill="#3b82f6" fill-opacity="0.55"/>
  </g>
</svg>
