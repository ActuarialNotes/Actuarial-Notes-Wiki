<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The four moving parts of a loan and the two ways to find the balance</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Principal in, payments out, balance in</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">between</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">L = P · a₍ₙ₎</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">OB_k = P · a₍ₙ₋ₖ₎ = L(1+i)ᵏ − P·s₍ₖ₎</text>
  <line x1="52" y1="240" x2="318" y2="240" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="60" y1="236" x2="60" y2="244" class="tick"/>
  <text x="60" y="257" text-anchor="middle" class="sm dim">0</text>
  <line x1="100" y1="236" x2="100" y2="244" class="tick"/>
  <text x="100" y="257" text-anchor="middle" class="sm dim">1</text>
  <line x1="140" y1="236" x2="140" y2="244" class="tick"/>
  <text x="140" y="257" text-anchor="middle" class="sm dim">2</text>
  <line x1="180" y1="236" x2="180" y2="244" class="tick"/>
  <text x="180" y="257" text-anchor="middle" class="sm dim">3</text>
  <line x1="220" y1="236" x2="220" y2="244" class="tick"/>
  <text x="220" y="257" text-anchor="middle" class="sm dim">…</text>
  <line x1="260" y1="236" x2="260" y2="244" class="tick"/>
  <text x="260" y="257" text-anchor="middle" class="sm dim">n−1</text>
  <line x1="300" y1="236" x2="300" y2="244" class="tick"/>
  <text x="300" y="257" text-anchor="middle" class="sm dim">n</text>
  <line x1="60" y1="240" x2="60" y2="336" class="thin" stroke="#059669" stroke-width="1.8" marker-end="url(#ah059669)"/>
  <text x="60" y="352" text-anchor="middle" class="sm">L</text>
  <line x1="100" y1="240" x2="100" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="100" y="174" text-anchor="middle" class="sm">P</text>
  <line x1="140" y1="240" x2="140" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="140" y="174" text-anchor="middle" class="sm">P</text>
  <line x1="180" y1="240" x2="180" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="180" y="174" text-anchor="middle" class="sm">P</text>
  <line x1="220" y1="240" x2="220" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="220" y="174" text-anchor="middle" class="sm">P</text>
  <line x1="260" y1="240" x2="260" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="260" y="174" text-anchor="middle" class="sm">P</text>
  <line x1="300" y1="240" x2="300" y2="180" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="300" y="174" text-anchor="middle" class="sm">P</text>
  <text x="180" y="110" text-anchor="middle" class="sm dim">the lender advances L, the borrower repays P</text>
</svg>
