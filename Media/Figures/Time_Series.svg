<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A quarterly loss index showing trend, seasonality and irregular movement</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Observations ordered in time, and</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">dependent</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Y_t = m_t + s_t + z_t</text>
  <line x1="62" y1="100" x2="62" y2="312" class="grid"/>
  <line x1="115.74" y1="100" x2="115.74" y2="312" class="grid"/>
  <line x1="169.49" y1="100" x2="169.49" y2="312" class="grid"/>
  <line x1="223.23" y1="100" x2="223.23" y2="312" class="grid"/>
  <line x1="276.97" y1="100" x2="276.97" y2="312" class="grid"/>
  <line x1="330.72" y1="100" x2="330.72" y2="312" class="grid"/>
  <line x1="62" y1="312" x2="334" y2="312" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="312" x2="62" y2="90" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="62" y1="312" x2="62" y2="316" class="tick"/>
  <text x="62" y="328" text-anchor="middle" class="sm dim">Y1</text>
  <line x1="115.74" y1="312" x2="115.74" y2="316" class="tick"/>
  <text x="115.74" y="328" text-anchor="middle" class="sm dim">Y3</text>
  <line x1="169.49" y1="312" x2="169.49" y2="316" class="tick"/>
  <text x="169.49" y="328" text-anchor="middle" class="sm dim">Y5</text>
  <line x1="223.23" y1="312" x2="223.23" y2="316" class="tick"/>
  <text x="223.23" y="328" text-anchor="middle" class="sm dim">Y7</text>
  <line x1="276.97" y1="312" x2="276.97" y2="316" class="tick"/>
  <text x="276.97" y="328" text-anchor="middle" class="sm dim">Y9</text>
  <line x1="330.72" y1="312" x2="330.72" y2="316" class="tick"/>
  <text x="330.72" y="328" text-anchor="middle" class="sm dim">Y11</text>
  <polyline points="62,291.48 68.72,274.18 75.44,258.58 82.15,269.59 88.87,270.22 95.59,263.21 102.31,246.2 109.03,260.41 115.74,253.13 122.46,237.02 129.18,224.95 135.9,241.35 142.62,240.17 149.33,223.15 156.05,212.93 162.77,230.02 169.49,218.04 176.21,203.28 182.92,194.45 189.64,210.86 196.36,208.42 203.08,192.54 209.79,182.69 216.51,202.15 223.23,198.55 229.95,192.21 236.67,168.67 243.38,181.31 250.1,173.85 256.82,163.63 263.54,149.74 270.26,171.5 276.97,168.89 283.69,150.69 290.41,136.03 297.13,151 303.85,147.14 310.56,127.41 317.28,120.52 324,143.98" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="62,285.52 324,155.68" class="curve dash" stroke="#d97706" stroke-width="1.8"/>
  <text x="317.28" y="171.68" text-anchor="end" class="sm bold" fill="#d97706">trend</text>
  <text x="180" y="346" text-anchor="middle" class="sm dim">consecutive values are correlated —</text>
  <text x="180" y="361" text-anchor="middle" class="sm dim">the assumption regression starts by denying</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">40 quarters of a loss index</text>
</svg>
