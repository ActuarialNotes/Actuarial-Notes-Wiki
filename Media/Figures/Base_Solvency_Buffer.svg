<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The 1.5 multiplier, and how the supervisory target compounds it into 2.25 times capital required</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The multiplier that the ratio is</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">measured against</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">BSB = 1.5 × capital required</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">1.5 × $158M = $237M</text>
  <text x="180" y="102" text-anchor="middle" class="sm dim">capital required, and what it becomes</text>
  <text x="40" y="126" text-anchor="start" class="sm">capital required</text>
  <rect x="40" y="134" width="100" height="24" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="148" y="151" text-anchor="start" class="sm">158</text>
  <text x="40" y="178" text-anchor="start" class="sm">base solvency buffer  ×1.5</text>
  <rect x="40" y="186" width="150" height="24" rx="3" fill="#0d9488" fill-opacity="0.55"/>
  <text x="198" y="203" text-anchor="start" class="sm">237</text>
  <text x="40" y="230" text-anchor="start" class="sm">at the 150% target  ×2.25</text>
  <rect x="40" y="238" width="225" height="24" rx="3" fill="#d97706" fill-opacity="0.55"/>
  <text x="273" y="255" text-anchor="start" class="sm">356</text>
  <text x="40" y="282" text-anchor="start" class="sm">at a 185% internal target  ×2.8</text>
  <rect x="40" y="290" width="278" height="24" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
  <text x="326" y="307" text-anchor="start" class="sm">439</text>
  <line x1="30" y1="336" x2="330" y2="336" class="rule"/>
  <text x="180" y="358" text-anchor="middle" class="sm dim">$M — so a ratio can fall because capital fell,</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">or because the buffer rose. Decompose before</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">concluding anything about it</text>
</svg>
