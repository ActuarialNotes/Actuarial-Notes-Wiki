<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A dendrogram fusing T1 with T2 at height 2 and T3 with T4 at 4, then both pairs at 10, cut at 7 into two clusters</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="70" y="352" text-anchor="middle" class="sm dim">T1</text>
    <text x="130" y="352" text-anchor="middle" class="sm dim">T2</text>
    <text x="230" y="352" text-anchor="middle" class="sm dim">T3</text>
    <text x="290" y="352" text-anchor="middle" class="sm dim">T4</text>
    <line x1="70" y1="334" x2="70" y2="292" class="thin" stroke="#3b82f6" stroke-width="1.8"/>
    <line x1="130" y1="334" x2="130" y2="292" class="thin" stroke="#3b82f6" stroke-width="1.8"/>
    <line x1="70" y1="292" x2="130" y2="292" class="thin" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="64" y="296" text-anchor="end" class="sm" fill="#3b82f6">h = 2</text>
    <line x1="230" y1="334" x2="230" y2="250" class="thin" stroke="#d97706" stroke-width="1.8"/>
    <line x1="290" y1="334" x2="290" y2="250" class="thin" stroke="#d97706" stroke-width="1.8"/>
    <line x1="230" y1="250" x2="290" y2="250" class="thin" stroke="#d97706" stroke-width="1.8"/>
    <text x="224" y="254" text-anchor="end" class="sm" fill="#d97706">h = 4</text>
    <line x1="100" y1="292" x2="100" y2="124" class="thin" stroke="#7c3aed" stroke-width="1.8"/>
    <line x1="260" y1="250" x2="260" y2="124" class="thin" stroke="#7c3aed" stroke-width="1.8"/>
    <line x1="100" y1="124" x2="260" y2="124" class="thin" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="180" y="116" text-anchor="middle" class="sm" fill="#7c3aed">h = 10</text>
    <line x1="46" y1="334" x2="320" y2="334" class="axis"/>
    <line x1="46" y1="187" x2="320" y2="187" class="thin dash" stroke="#059669" stroke-width="1.4"/>
    <text x="322" y="191" text-anchor="end" class="sm bold" fill="#059669">cut</text>
  </g>
</svg>
