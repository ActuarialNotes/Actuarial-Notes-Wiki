    <text x="306" y="361" text-anchor="middle" class="sm dim">5</text>
    <polyline points="56,197.54 61,196.68 66,195.82 71,194.95 76,194.08 81,193.21 86,192.33 91,191.44 96,190.55 101,189.65 106,188.75 111,187.84 116,186.93 121,186.01 126,185.09 131,184.16 136,183.23 141,182.29 146,181.34 151,180.39 156,179.43 161,178.47 166,177.51 171,176.53 176,175.55 181,174.57 186,173.58 191,172.58 196,171.58 201,170.57 206,169.56 211,168.54 216,167.52 221,166.48 226,165.45 231,164.4 236,163.35 241,162.3 246,161.24 251,160.17 256,159.09 261,158.01 266,156.93 271,155.83 276,154.73 281,153.63 286,152.52 291,151.4 296,150.27 301,149.14 306,148" class="thin dot" stroke="#d97706" stroke-width="1.6"/>
