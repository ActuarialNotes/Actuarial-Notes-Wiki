  <circle cx="198" cy="92" r="5" fill="var(--dim)"/>
  <text x="198" y="80" text-anchor="middle" class="sm dim">X1</text>
  <circle cx="110" cy="92" r="5" fill="var(--dim)"/>
  <text x="110" y="80" text-anchor="middle" class="sm dim">X2</text>
