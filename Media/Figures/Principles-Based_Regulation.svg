<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The Canadian framework using both — a rules-based MCT with principles-based expectations on top</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Canada uses both, and on purpose</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Rules say how; principles say what</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">— the MCT under ORSA, FCT and B-15</text>
    <rect x="38" y="100" width="284" height="54" rx="7" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.2"/>
    <text x="180" y="121" text-anchor="middle" class="sm">ORSA · FCT · governance · B-15</text>
    <text x="180" y="139" text-anchor="middle" class="sm dim">principles — the outcome is prescribed</text>
    <line x1="180" y1="158" x2="180" y2="176" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="38" y="182" width="284" height="54" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="180" y="203" text-anchor="middle" class="sm">the MCT</text>
    <text x="180" y="221" text-anchor="middle" class="sm dim">rules — the formula is prescribed</text>
    <line x1="30" y1="254" x2="330" y2="254" class="rule"/>
    <rect x="30" y="268" width="143" height="94" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="30" y="268" width="143" height="24" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
    <text x="101.5" y="284" text-anchor="middle" class="sm bold" fill="#3b82f6">Rules</text>
    <text x="101.5" y="312" text-anchor="middle" class="sm">predictable</text>
    <text x="101.5" y="332" text-anchor="middle" class="sm">comparable</text>
    <text x="101.5" y="352" text-anchor="middle" class="sm">gameable</text>
    <rect x="187" y="268" width="143" height="94" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="187" y="268" width="143" height="24" rx="7" fill="#0d9488" fill-opacity="0.22" stroke="none"/>
    <text x="258.5" y="284" text-anchor="middle" class="sm bold" fill="#0d9488">Principles</text>
    <text x="258.5" y="312" text-anchor="middle" class="sm">proportionate</text>
    <text x="258.5" y="332" text-anchor="middle" class="sm">innovation-proof</text>
    <text x="258.5" y="352" text-anchor="middle" class="sm">unpredictable</text>
    <text x="180" y="380" text-anchor="middle" class="sm dim">and principles move the work onto the actuary</text>
  </g>
</svg>
