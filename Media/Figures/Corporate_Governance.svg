<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The three lines model, and the Appointed Actuary's place outside management's reporting line</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Oversight that can actually say no</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Three lines: own it · challenge it</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">· audit it — and a board that challenges</text>
  <rect x="30" y="100" width="300" height="48" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="180" y="121" text-anchor="middle" class="sm">The business</text>
  <text x="180" y="136" text-anchor="middle" class="sm dim">owns and manages its risks</text>
  <rect x="30" y="160" width="300" height="48" rx="6" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.3"/>
  <text x="180" y="181" text-anchor="middle" class="sm">Oversight functions</text>
  <text x="180" y="196" text-anchor="middle" class="sm dim">risk, compliance, the actuary</text>
  <rect x="30" y="220" width="300" height="48" rx="6" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="180" y="241" text-anchor="middle" class="sm">Internal audit</text>
  <text x="180" y="256" text-anchor="middle" class="sm dim">independent assurance to the board</text>
  <line x1="30" y1="268" x2="330" y2="268" class="rule"/>
  <text x="36" y="290" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="290" text-anchor="start" class="sm">the board approves strategy and risk appetite</text>
  <text x="36" y="313" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="313" text-anchor="start" class="sm">a majority of independent directors, and a chair</text>
  <text x="36" y="336" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="336" text-anchor="start" class="sm">independent of management</text>
  <text x="36" y="359" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="359" text-anchor="start" class="sm">and the actuary answers to the directors — which</text>
  <text x="36" y="382" text-anchor="start" class="sm" fill="#d97706">•</text>
  <text x="52" y="382" text-anchor="start" class="sm">is what makes the duty to report workable</text>
</svg>
