<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The GMM's three building blocks stacked into one liability, all remeasured every period</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">The default model: cash flows, risk,</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">profit</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Liability = PV(cash flows) + RA + CSM</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">and all three are remeasured each period</text>
    <rect x="116" y="230" width="128" height="74" rx="6" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="180" y="262" text-anchor="middle" class="sm">PV of expected</text>
    <text x="180" y="278" text-anchor="middle" class="sm">cash flows</text>
    <rect x="116" y="178" width="128" height="48" rx="6" fill="#7c3aed" fill-opacity="0.28" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="207" text-anchor="middle" class="sm">risk adjustment</text>
    <rect x="116" y="126" width="128" height="48" rx="6" fill="#059669" fill-opacity="0.28" stroke="#059669" stroke-width="1.2"/>
    <text x="180" y="155" text-anchor="middle" class="sm">CSM</text>
    <text x="108" y="150" text-anchor="end" class="sm dim">profit</text>
    <text x="108" y="203" text-anchor="end" class="sm dim">risk</text>
    <text x="108" y="270" text-anchor="end" class="sm dim">cost</text>
    <text x="180" y="328" text-anchor="middle" class="sm dim">the LIC is measured the same way under both</text>
    <text x="180" y="344" text-anchor="middle" class="sm dim">models — the choice only ever touches the LRC</text>
    <text x="180" y="370" text-anchor="middle" class="sm dim">and it is the expensive one: full projection, a</text>
    <text x="180" y="386" text-anchor="middle" class="sm dim">locked-in rate, and coverage units to track</text>
  </g>
</svg>
