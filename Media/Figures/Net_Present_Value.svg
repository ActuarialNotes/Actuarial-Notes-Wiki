<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Project cash flows drawn as dashed outlines with their discounted values filled inside, summed into a small positive NPV bar at the end</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="85.62" y="175.38" width="24" height="158.75" rx="2" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="85.62" y="175.38" width="24" height="158.75" rx="2" fill="#e11d48" fill-opacity="0.7"/>
    <rect x="125" y="127.75" width="24" height="47.62" rx="2" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="125" y="132.08" width="24" height="43.3" rx="2" fill="#059669" fill-opacity="0.7"/>
    <rect x="164.38" y="111.88" width="24" height="63.5" rx="2" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="164.38" y="122.9" width="24" height="52.48" rx="2" fill="#059669" fill-opacity="0.7"/>
    <rect x="203.75" y="111.88" width="24" height="63.5" rx="2" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="203.75" y="127.67" width="24" height="47.71" rx="2" fill="#059669" fill-opacity="0.7"/>
    <rect x="243.12" y="127.75" width="24" height="47.62" rx="2" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="243.12" y="142.85" width="24" height="32.53" rx="2" fill="#059669" fill-opacity="0.7"/>
    <rect x="290.38" y="158.11" width="24" height="17.26" rx="2" fill="#7c3aed" fill-opacity="0.85"/>
    <text x="302.38" y="150.11" text-anchor="middle" class="sm bold">109</text>
    <line x1="74" y1="175.38" x2="336" y2="175.38" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="74" y1="350" x2="74" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
    <line x1="70" y1="334.12" x2="74" y2="334.12" class="tick"/>
    <text x="66" y="337.73" text-anchor="end" class="sm dim">-1,000</text>
    <line x1="70" y1="175.38" x2="74" y2="175.38" class="tick"/>
    <text x="66" y="178.97" text-anchor="end" class="sm dim">0</text>
    <line x1="70" y1="96" x2="74" y2="96" class="tick"/>
    <text x="66" y="99.6" text-anchor="end" class="sm dim">500</text>
    <text x="70" y="82" text-anchor="start" class="sm dim">cash flow</text>
    <text x="97.62" y="366" text-anchor="middle" class="sm dim">0</text>
    <text x="137" y="366" text-anchor="middle" class="sm dim">1</text>
    <text x="176.38" y="366" text-anchor="middle" class="sm dim">2</text>
    <text x="215.75" y="366" text-anchor="middle" class="sm dim">3</text>
    <text x="255.12" y="366" text-anchor="middle" class="sm dim">4</text>
    <text x="302.38" y="366" text-anchor="middle" class="sm bold">NPV</text>
  </g>
</svg>
