<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" width="560" height="288" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="286.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Collapsing several variables into one weighted sum</text>
  <text x="60" y="92" text-anchor="start" class="sm bold">L = c₁X₁ + c₂X₂ + ⋯ + cₙXₙ</text>
  <rect x="69" y="125" width="54" height="22" rx="11.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="96" y="140" text-anchor="middle" class="sm">X₁</text>
  <rect x="145" y="125" width="54" height="22" rx="11.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="172" y="140" text-anchor="middle" class="sm">X₂</text>
  <rect x="221" y="125" width="54" height="22" rx="11.0" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.2"/>
  <text x="248" y="140" text-anchor="middle" class="sm">X₃</text>
  <line x1="252" y1="136" x2="292" y2="136" class="thin" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#ahvardim)"/>
  <rect x="310" y="125" width="60" height="22" rx="11.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
  <text x="340" y="140" text-anchor="middle" class="sm">L</text>
  <text x="60" y="180" text-anchor="start" class="sm bold">Expectation is always linear</text>
  <text x="60" y="198" text-anchor="start" class="sm dim">E[L] = Σ cᵢ E[Xᵢ] — no independence needed</text>
  <line x1="28" y1="214" x2="532" y2="214" class="rule"/>
  <text x="40" y="234" text-anchor="start" class="sm">Var(L) = Σ cᵢ² Var(Xᵢ) + 2 Σ_{i&lt;j} cᵢcⱼ Cov(Xᵢ, Xⱼ)</text>
  <text x="40" y="254" text-anchor="start" class="sm dim">Independent Xᵢ: every covariance term drops out</text>
  <text x="40" y="274" text-anchor="start" class="sm dim">Coefficients enter squared — so Var(X − Y) = Var X + Var Y</text>
  <rect x="348" y="82" width="176" height="96" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="436" y="104" text-anchor="middle" class="sm bold">The sample mean X̄</text>
  <text x="436" y="124" text-anchor="middle" class="sm dim">of n i.i.d. variables has</text>
  <text x="436" y="142" text-anchor="middle" class="sm dim">mean μ and variance σ²/n</text>
  <text x="436" y="162" text-anchor="middle" class="sm dim">→ approximately normal (CLT)</text>
</svg>
