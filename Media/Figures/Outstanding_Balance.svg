  <text x="64" y="84.69" text-anchor="end" class="sm dim">10,000</text>
  <text x="326" y="244" text-anchor="end" class="sm dim">payments made</text>
  <text x="68" y="54" text-anchor="start" class="sm dim">balance</text>
  <text x="428" y="96" text-anchor="middle" class="sm bold">Same number, two derivations</text>
  <rect x="340" y="114" width="190" height="62" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="435" y="136" text-anchor="middle" class="sm bold">Prospective</text>
  <text x="435" y="156" text-anchor="middle" class="sm dim">OB_k = P · a₍ₙ₋ₖ₎</text>
  <rect x="340" y="184" width="190" height="62" rx="7" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2"/>
  <text x="435" y="206" text-anchor="middle" class="sm bold">Retrospective</text>
  <text x="435" y="226" text-anchor="middle" class="sm dim">OB_k = L(1+i)ᵏ − P·s₍ₖ₎</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">OB_k = L − P·a₍ₖ₎ is wrong — it ignores the interest accrued</text>
