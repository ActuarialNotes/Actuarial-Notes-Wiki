<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Variance of a sum with and without the covariance term</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Covariance is what independence removes</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="438" text-anchor="middle" class="fml">Var(X₁ + X₂) = Var X₁ + Var X₂ + 2 Cov</text>
  <text x="180" y="100" text-anchor="middle" class="bold" fill="#059669">Independent</text>
  <rect x="40" y="116" width="116.67" height="36" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="98.33" y="140" text-anchor="middle" class="sm bold">1.00</text>
  <rect x="156.67" y="116" width="81.67" height="36" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
  <text x="197.5" y="140" text-anchor="middle" class="sm bold">0.70</text>
  <line x1="40" y1="162" x2="238.33" y2="162" stroke="#059669" stroke-width="1.8"/>
  <text x="139.17" y="180" text-anchor="middle" class="bold">Var = 1.70</text>
  <line x1="40" y1="198" x2="52" y2="198" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="58" y="202" text-anchor="start" class="sm dim">Var(X₁)</text>
  <line x1="136" y1="198" x2="148" y2="198" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="154" y="202" text-anchor="start" class="sm dim">Var(X₂)</text>
  <text x="180" y="248" text-anchor="middle" class="bold" fill="#e11d48">Positively correlated</text>
  <rect x="40" y="264" width="116.67" height="36" rx="3" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="98.33" y="288" text-anchor="middle" class="sm bold">1.00</text>
  <rect x="156.67" y="264" width="81.67" height="36" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
  <text x="197.5" y="288" text-anchor="middle" class="sm bold">0.70</text>
  <rect x="238.33" y="264" width="81.67" height="36" rx="3" fill="#e11d48" fill-opacity="0.55"/>
  <text x="279.17" y="288" text-anchor="middle" class="sm bold">0.70</text>
  <line x1="40" y1="310" x2="320" y2="310" stroke="#e11d48" stroke-width="1.8"/>
  <text x="180" y="328" text-anchor="middle" class="bold">Var = 2.40</text>
  <line x1="40" y1="346" x2="52" y2="346" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="58" y="350" text-anchor="start" class="sm dim">Var(X₁)</text>
  <line x1="136" y1="346" x2="148" y2="346" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round"/>
  <text x="154" y="350" text-anchor="start" class="sm dim">Var(X₂)</text>
  <line x1="232" y1="346" x2="244" y2="346" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
  <text x="250" y="350" text-anchor="start" class="sm dim">2 Cov</text>
</svg>
