<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Conditioning on B rescales the sample space to B</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Conditioning makes B the new sample</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">space</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">P(A | B) = P(A ∩ B) / P(B)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">= 0.12 / 0.40 = 0.30</text>
  <rect x="30" y="82" width="300" height="132" rx="8" fill="var(--soft)" stroke="var(--edge)" stroke-width="1"/>
  <text x="42" y="100" text-anchor="middle" class="sm dim">S</text>
  <circle cx="153" cy="148" r="50" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="207" cy="148" r="50" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.5"/>
  <path d="M180,105.92 A50,50 0 0 1 180,190.08 A50,50 0 0 1 180,105.92 Z" fill="#7c3aed" fill-opacity="0.4" stroke="none"/>
  <text x="123" y="108" text-anchor="middle" class="bold" fill="#3b82f6">A</text>
  <text x="237" y="108" text-anchor="middle" class="bold" fill="#d97706">B</text>
  <text x="180" y="152" text-anchor="middle" class="sm bold">0.12</text>
  <text x="233" y="152" text-anchor="middle" class="sm">0.28</text>
  <line x1="180" y1="224" x2="180" y2="250" class="thin" stroke="var(--dim)" stroke-width="1.5" marker-end="url(#ahvardim)"/>
  <text x="196" y="242" text-anchor="start" class="sm dim">given B</text>
  <circle cx="180" cy="322" r="60" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.6"/>
  <path d="M180,322 L180,262 A60,60 0 0 1 237.06,340.54 Z" fill="#7c3aed" fill-opacity="0.42" stroke="none"/>
  <line x1="180" y1="322" x2="180" y2="262" class="thin" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="180" y1="322" x2="237.06" y2="340.54" class="thin" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="264" y="298" text-anchor="middle" class="sm bold" fill="#7c3aed">A ∩ B</text>
  <text x="96" y="346" text-anchor="middle" class="bold" fill="#d97706">B</text>
</svg>
