<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The statutory three-part rate standard and the three regimes, ordered by how tightly they grip</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Not excessive, not inadequate, not</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">unfair</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Prior approval → file-and-use → use-and-file</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">grip loosens as the line gets less compulsory</text>
  <text x="52" y="100" text-anchor="start" class="sm bold" fill="#3b82f6">not excessive</text>
  <text x="52" y="116" text-anchor="start" class="sm dim">consumer protection</text>
  <text x="52" y="140" text-anchor="start" class="sm bold" fill="#d97706">not inadequate</text>
  <text x="52" y="156" text-anchor="start" class="sm dim">solvency</text>
  <text x="52" y="180" text-anchor="start" class="sm bold" fill="#059669">not unfairly discriminatory</text>
  <text x="52" y="196" text-anchor="start" class="sm dim">equity</text>
  <line x1="30" y1="222" x2="330" y2="222" class="rule"/>
  <rect x="40" y="246" width="268" height="32" rx="5" fill="#e11d48" fill-opacity="0.20" stroke="#e11d48" stroke-width="1.2"/>
  <text x="50" y="266" text-anchor="start" class="sm">Prior approval — Ontario auto</text>
  <rect x="40" y="290" width="196" height="32" rx="5" fill="#d97706" fill-opacity="0.20" stroke="#d97706" stroke-width="1.2"/>
  <text x="50" y="310" text-anchor="start" class="sm">File-and-use — used at once</text>
  <rect x="40" y="334" width="124" height="32" rx="5" fill="#059669" fill-opacity="0.20" stroke="#059669" stroke-width="1.2"/>
  <text x="50" y="354" text-anchor="start" class="sm">Use-and-file — commercial lines</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">the tighter the grip, the longer the lag</text>
</svg>
