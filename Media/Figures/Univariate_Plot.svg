<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The same sample seen three ways: histogram, box plot, empirical CDF</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">One variable: histogram, box plot, QQ</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">plot</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">shape · outliers · quantiles</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">no second variable involved</text>
  <text x="64" y="88" text-anchor="start" class="sm bold" fill="#3b82f6">histogram — shape</text>
  <line x1="64" y1="170" x2="320" y2="170" class="axis"/>
  <rect x="65.3" y="121.74" width="23" height="48.26" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="90.9" y="105.01" width="23" height="64.99" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="116.5" y="116.59" width="23" height="53.41" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="142.1" y="132.68" width="23" height="37.32" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="167.7" y="145.55" width="23" height="24.45" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="193.3" y="154.56" width="23" height="15.44" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="218.9" y="160.35" width="23" height="9.65" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="244.5" y="164.21" width="23" height="5.79" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="270.1" y="166.78" width="23" height="3.22" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <rect x="295.7" y="168.07" width="23" height="1.93" rx="1.5" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="64" y="198" text-anchor="start" class="sm bold" fill="#d97706">box plot — outliers</text>
  <line x1="64" y1="252" x2="320" y2="252" class="axis"/>
  <rect x="107.52" y="212.44" width="64" height="28.52" rx="3" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.4"/>
  <line x1="133.12" y1="212.44" x2="133.12" y2="240.96" stroke="#d97706" stroke-width="2.2"/>
  <line x1="72.96" y1="226.7" x2="107.52" y2="226.7" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <line x1="171.52" y1="226.7" x2="249.6" y2="226.7" class="thin" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="289.28" cy="226.7" r="3.4" fill="#e11d48"/>
  <text x="64" y="290" text-anchor="start" class="sm bold" fill="#059669">empirical CDF — quantiles</text>
  <line x1="64" y1="372" x2="330" y2="372" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="372" x2="64" y2="288" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="64" y1="372" x2="64" y2="376" class="tick"/>
  <text x="64" y="388" text-anchor="middle" class="sm dim">0</text>
  <line x1="128" y1="372" x2="128" y2="376" class="tick"/>
  <text x="128" y="388" text-anchor="middle" class="sm dim">5</text>
  <line x1="192" y1="372" x2="192" y2="376" class="tick"/>
  <text x="192" y="388" text-anchor="middle" class="sm dim">10</text>
  <line x1="256" y1="372" x2="256" y2="376" class="tick"/>
  <text x="256" y="388" text-anchor="middle" class="sm dim">15</text>
  <line x1="320" y1="372" x2="320" y2="376" class="tick"/>
  <text x="320" y="388" text-anchor="middle" class="sm dim">20</text>
  <line x1="60" y1="372" x2="64" y2="372" class="tick"/>
  <text x="56" y="375.6" text-anchor="end" class="sm dim">0</text>
  <line x1="60" y1="301.52" x2="64" y2="301.52" class="tick"/>
  <text x="56" y="305.12" text-anchor="end" class="sm dim">1</text>
  <polyline points="64,372 76.8,365.82 89.6,357.46 102.4,348.74 115.2,340.56 128,333.31 140.8,327.13 153.6,321.98 166.4,317.78 179.2,314.4 192,311.71 204.8,309.58 217.6,307.91 230.4,306.62 243.2,305.61 256,304.84 268.8,304.25 281.6,303.79 294.4,303.45 307.2,303.18 320,302.98" class="curve" stroke="#059669" stroke-width="2.2"/>
</svg>
