.67,156.91 278.11,157.33 279.56,157.72 281,158.08 282.44,158.42 283.89,158.74 285.33,159.03 286.78,159.3 288.22,159.55 289.67,159.78 291.11,159.99 292.56,160.18 294,160.35 295.44,160.52 296.89,160.66 298.33,160.8 299.78,160.92 301.22,161.03 302.67,161.13 304.11,161.23 305.56,161.31 307,161.38 308.44,161.45 309.89,161.51 311.33,161.57 312.78,161.62 314.22,161.66 315.67,161.7 317.11,161.74 318.56,161.77 320,161.79" class="curve" stroke="var(--dim)" stroke-width="1.6"/>
  <line x1="60" y1="162" x2="320" y2="162" class="axis"/>
  <text x="316" y="126" text-anchor="end" class="sm dim">μ, σ²</text>
  <line x1="180" y1="170" x2="180" y2="198" class="thin" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#ahvardim)"/>
  <text x="188" y="188" text-anchor="start" class="sm dim">sample of n</text>
  <line x1="60" y1="222" x2="320" y2="222" class="axis"/>
  <circle cx="128.82" cy="222" r="4.2" fill="#3b82f6" fill-opacity="0.85"/>
