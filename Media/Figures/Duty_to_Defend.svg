<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>The duty to defend read off the pleadings, sitting outside the narrower duty to indemnify</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Read the pleadings, not the evidence</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Duty to defend ⊃ duty to indemnify</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">one arguable allegation defends the whole claim</text>
  <circle cx="178" cy="202" r="84" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="178" cy="224" r="44" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.6"/>
  <text x="178" y="138" text-anchor="middle" class="sm bold" fill="#3b82f6">alleged</text>
  <text x="178" y="232" text-anchor="middle" class="sm bold" fill="#d97706">proven</text>
  <text x="178" y="168" text-anchor="middle" class="sm" fill="#3b82f6">defend</text>
  <text x="178" y="250" text-anchor="middle" class="sm" fill="#d97706">indemnify</text>
  <text x="180" y="306" text-anchor="middle" class="sm dim">so an insurer defends claims it may never pay</text>
  <text x="180" y="330" text-anchor="middle" class="sm dim">under a reservation of rights — and where the</text>
  <text x="180" y="346" text-anchor="middle" class="sm dim">defence could steer the outcome, the insured</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">picks independent counsel at the insurer's cost</text>
  <text x="180" y="386" text-anchor="middle" class="sm dim">defence cost is ALAE, and it can rival indemnity</text>
</svg>
