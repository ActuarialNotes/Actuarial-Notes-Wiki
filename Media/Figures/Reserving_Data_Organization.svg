<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Segmenting a book into triangles that each hold a stable emergence pattern</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Segment until each triangle behaves like</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">itself</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Unpaid = Ultimate − Paid</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">IBNR = Ultimate − Reported</text>
  <text x="180" y="112" text-anchor="middle" class="sm dim">one book, three defensible segmentations</text>
  <text x="46" y="136" text-anchor="start" class="sm bold">Coverage</text>
  <rect x="46" y="146" width="62" height="30" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="77" y="166" text-anchor="middle" class="sm">BI</text>
  <rect x="113" y="146" width="62" height="30" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="144" y="166" text-anchor="middle" class="sm">PD</text>
  <rect x="180" y="146" width="62" height="30" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="211" y="166" text-anchor="middle" class="sm">Coll</text>
  <rect x="247" y="146" width="62" height="30" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="278" y="166" text-anchor="middle" class="sm">Comp</text>
  <text x="46" y="204" text-anchor="start" class="sm bold">Claim type</text>
  <rect x="46" y="214" width="129" height="30" rx="4" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.1"/>
  <text x="110.5" y="234" text-anchor="middle" class="sm">litigated</text>
  <rect x="180" y="214" width="129" height="30" rx="4" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.1"/>
  <text x="244.5" y="234" text-anchor="middle" class="sm">not litigated</text>
  <text x="46" y="272" text-anchor="start" class="sm bold">Limit band</text>
  <rect x="46" y="282" width="129" height="30" rx="4" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="110.5" y="302" text-anchor="middle" class="sm">basic</text>
  <rect x="180" y="282" width="129" height="30" rx="4" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="244.5" y="302" text-anchor="middle" class="sm">excess</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">more homogeneous, less credible — the same</text>
  <text x="180" y="376" text-anchor="middle" class="sm dim">trade as ratemaking, decided per triangle</text>
</svg>
