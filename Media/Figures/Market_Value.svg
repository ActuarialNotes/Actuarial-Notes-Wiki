<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Market value moving with the prevailing yield while book value follows its own schedule</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">Market value follows today's yield</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">MV = Fr · a₍ₙ₎ + C · vⁿ at today's yield</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">book value keeps using the original yield</text>
  <polyline points="78,247.14 102.8,247.14 127.6,247.14 152.4,247.14 177.2,247.14 202,247.14 226.8,247.14 251.6,247.14 276.4,247.14 301.2,247.14 326,247.14" class="curve" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="78,247.14 102.8,222.22 127.6,191.28 152.4,214.46 177.2,264.27 202,289.89 226.8,266.24 251.6,247.14 276.4,242.01 301.2,247.14 326,247.14" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <line x1="78" y1="350" x2="336" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="100" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="78" y1="350" x2="78" y2="354" class="tick"/>
  <text x="78" y="366" text-anchor="middle" class="sm dim">0</text>
  <line x1="202" y1="350" x2="202" y2="354" class="tick"/>
  <text x="202" y="366" text-anchor="middle" class="sm dim">5</text>
  <line x1="326" y1="350" x2="326" y2="354" class="tick"/>
  <text x="326" y="366" text-anchor="middle" class="sm dim">10</text>
  <line x1="74" y1="315.71" x2="78" y2="315.71" class="tick"/>
  <text x="70" y="319.31" text-anchor="end" class="sm dim">900</text>
  <line x1="74" y1="247.14" x2="78" y2="247.14" class="tick"/>
  <text x="70" y="250.74" text-anchor="end" class="sm dim">1,000</text>
  <line x1="74" y1="178.57" x2="78" y2="178.57" class="tick"/>
  <text x="70" y="182.17" text-anchor="end" class="sm dim">1,100</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">coupons paid</text>
  <line x1="62" y1="92" x2="75" y2="92" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <text x="81" y="95.6" text-anchor="start" class="sm">book value</text>
  <line x1="62" y1="108" x2="75" y2="108" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="81" y="111.6" text-anchor="start" class="sm">market value</text>
</svg>
