  <polyline points="76,190.03 101,183.84 126,177.22 151,170.13 176,162.55 201,154.44 226,145.76 251,136.47 276,126.53 301,115.9 326,104.52" class="curve" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="76" cy="190.03" r="2.8" fill="#3b82f6"/>
  <circle cx="101" cy="183.84" r="2.8" fill="#3b82f6"/>
  <circle cx="126" cy="177.22" r="2.8" fill="#3b82f6"/>
  <circle cx="151" cy="170.13" r="2.8" fill="#3b82f6"/>
  <circle cx="176" cy="162.55" r="2.8" fill="#3b82f6"/>
  <circle cx="201" cy="154.44" r="2.8" fill="#3b82f6"/>
  <circle cx="226" cy="145.76" r="2.8" fill="#3b82f6"/>
  <circle cx="251" cy="136.47" r="2.8" fill="#3b82f6"/>
  <circle cx="276" cy="126.53" r="2.8" fill="#3b82f6"/>
  <circle cx="301" cy="115.9" r="2.8" fill="#3b82f6"/>
  <circle cx="326" cy="104.52" r="2.8" fill="#3b82f6"/>
  <line x1="76" y1="104.52" x2="326" y2="104.52" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
  <text x="330" y="108.12" text-anchor="start" class="sm dim">C</text>
  <text x="156" y="168.43" text-anchor="start" class="sm bold">discount C − P</text>
  <line x1="76" y1="208" x2="336" y2="208" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="208" x2="76" y2="58" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="208" x2="76" y2="212" class="tick"/>
  <text x="76" y="224" text-anchor="middle" class="sm dim">0</text>
  <line x1="201" y1="208" x2="201" y2="212" class="tick"/>
  <text x="201" y="224" text-anchor="middle" class="sm dim">5</text>
  <line x1="326" y1="208" x2="326" y2="212" class="tick"/>
  <text x="326" y="224" text-anchor="middle" class="sm dim">10</text>
  <line x1="72" y1="195.83" x2="76" y2="195.83" class="tick"/>
  <text x="68" y="199.43" text-anchor="end" class="sm dim">850</text>
  <line x1="72" y1="134.96" x2="76" y2="134.96" class="tick"/>
  <text x="68" y="138.56" text-anchor="end" class="sm dim">950</text>
  <line x1="72" y1="74.09" x2="76" y2="74.09" class="tick"/>
  <text x="68" y="77.69" text-anchor="end" class="sm dim">1,050</text>
  <text x="326" y="240" text-anchor="end" class="sm dim">coupons paid</text>
  <text x="72" y="54" text-anchor="start" class="sm dim">book value</text>
  <text x="428" y="100" text-anchor="middle" class="sm bold">Fr &lt; Cj  →  the coupon underpays</text>
  <rect x="340" y="120" width="190" height="66" rx="7" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="435" y="142" text-anchor="middle" class="sm bold">Written up in period t</text>
  <text x="435" y="162" text-anchor="middle" class="sm dim">(Cj − Fr) · v^(n−t+1)</text>
  <text x="435" y="180" text-anchor="middle" class="sm dim">growing every period</text>
  <rect x="340" y="194" width="190" height="66" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
  <text x="435" y="216" text-anchor="middle" class="sm bold">The shortfall is made up</text>
  <text x="435" y="236" text-anchor="middle" class="sm dim">by the capital gain at redemption</text>
  <text x="435" y="254" text-anchor="middle" class="sm dim">so the investor still earns j</text>
  <text x="280" y="284" text-anchor="middle" class="sm dim">The mirror of amortization of premium — same schedule, other sign</text>
</svg>
