    <polyline points="239.88,174.82 247.53,195.6 255.18,210.15 262.82,220.33 270.47,227.46 278.12,232.45 285.76,235.94 293.41,238.39 301.06,240.1 308.71,241.3 316.35,242.13" class="curve dash" stroke="#059669" stroke-width="2.2"/>
