<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Capital credit for an unregistered cession capped at the collateral posted behind it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Credit stops where the collateral stops</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Credit = min(ceded liabilities,</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">acceptable collateral)</text>
    <text x="180" y="102" text-anchor="middle" class="sm dim">$100M ceded, $70M collateralised</text>
    <text x="40" y="132" text-anchor="start" class="sm">ceded liabilities</text>
    <rect x="40" y="140" width="260" height="24" rx="3" fill="#3b82f6" fill-opacity="0.35"/>
    <text x="40" y="190" text-anchor="start" class="sm">acceptable collateral</text>
    <rect x="40" y="198" width="182" height="24" rx="3" fill="#059669" fill-opacity="0.55"/>
    <text x="40" y="248" text-anchor="start" class="sm">capital credit</text>
    <rect x="40" y="256" width="182" height="24" rx="3" fill="#059669" fill-opacity="0.75"/>
    <rect x="222" y="256" width="78" height="24" rx="3" fill="#e11d48" fill-opacity="0.30"/>
    <text x="261" y="272" text-anchor="middle" class="sm" fill="#e11d48">none</text>
    <line x1="30" y1="300" x2="330" y2="300" class="rule"/>
    <text x="36" y="322" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="322" text-anchor="start" class="sm">assets in a Canadian trust, or a letter of credit</text>
    <text x="36" y="346" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="346" text-anchor="start" class="sm">used anyway for capacity and intra-group cessions</text>
    <text x="36" y="370" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="370" text-anchor="start" class="sm">and the cost is real: LOC fees, trapped assets,</text>
    <text x="36" y="394" text-anchor="start" class="sm" fill="#d97706">•</text>
    <text x="52" y="394" text-anchor="start" class="sm">and enforcement across a border</text>
  </g>
</svg>
