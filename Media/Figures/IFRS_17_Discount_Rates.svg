<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The discount rate built two ways: bottom-up, a risk-free rate plus an illiquidity premium; top-down, an asset yield less its credit and market risk — landing close, but not necessarily together</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="60" y="236" width="96" height="120" rx="5" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="108" y="300" text-anchor="middle" class="sm">risk-free</text>
    <rect x="60" y="180" width="96" height="54" rx="5" fill="#0d9488" fill-opacity="0.36" stroke="#0d9488" stroke-width="1.2"/>
    <text x="108" y="211" text-anchor="middle" class="sm">illiquidity</text>
    <line x1="40" y1="340" x2="40" y2="186" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
    <rect x="204" y="170" width="96" height="186" rx="5" fill="#d97706" fill-opacity="0.30" stroke="#d97706" stroke-width="1.2"/>
    <text x="252" y="270" text-anchor="middle" class="sm">asset yield</text>
    <rect x="204" y="108" width="96" height="60" rx="5" fill="#e11d48" fill-opacity="0.10" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="252" y="142" text-anchor="middle" class="sm">credit risk</text>
    <line x1="320" y1="112" x2="320" y2="164" class="thin" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ahe11d48)"/>
    <line x1="52" y1="180" x2="164" y2="180" class="thin dash" stroke="#7c3aed" stroke-width="1.8"/>
    <line x1="196" y1="170" x2="308" y2="170" class="thin dash" stroke="#7c3aed" stroke-width="1.8"/>
    <line x1="34" y1="356" x2="330" y2="356" class="axis"/>
    <text x="108" y="374" text-anchor="middle" class="sm bold">bottom-up</text>
    <text x="252" y="374" text-anchor="middle" class="sm bold">top-down</text>
  </g>
</svg>
