<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" width="560" height="276" role="img">
  <title>One period of growth, and the equivalent nominal rates that produce it</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="274.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">The effective rate is what actually happened over the period</text>
  <line x1="152" y1="118" x2="418" y2="118" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="160" y1="114" x2="160" y2="122" class="tick"/>
  <text x="160" y="135" text-anchor="middle" class="sm dim">0</text>
  <line x1="400" y1="114" x2="400" y2="122" class="tick"/>
  <text x="400" y="135" text-anchor="middle" class="sm dim">1</text>
  <line x1="160" y1="118" x2="160" y2="78" class="thin" stroke="var(--dim)" stroke-width="1.8" marker-end="url(#ahvardim)"/>
  <text x="160" y="72" text-anchor="middle" class="sm">1</text>
  <line x1="400" y1="118" x2="400" y2="52" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="400" y="46" text-anchor="middle" class="sm">1 + i</text>
  <line x1="170" y1="36" x2="390" y2="36" class="thin" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ah3b82f6)"/>
  <text x="280" y="28" text-anchor="middle" class="sm bold" fill="#3b82f6">one measurement period</text>
  <line x1="28" y1="172" x2="532" y2="172" class="rule"/>
  <text x="280" y="194" text-anchor="middle" class="sm bold">These all describe the same 8% effective annual rate</text>
  <text x="44" y="224" text-anchor="start" class="sm bold">i = 8.0000%</text>
  <text x="44" y="242" text-anchor="start" class="sm dim">effective annual</text>
  <text x="172" y="224" text-anchor="start" class="sm bold">i⁽²⁾ = 7.8461%</text>
  <text x="172" y="242" text-anchor="start" class="sm dim">semi-annual</text>
  <text x="300" y="224" text-anchor="start" class="sm bold">i⁽¹²⁾ = 7.7208%</text>
  <text x="300" y="242" text-anchor="start" class="sm dim">monthly</text>
  <text x="428" y="224" text-anchor="start" class="sm bold">δ = 7.6961%</text>
  <text x="428" y="242" text-anchor="start" class="sm dim">continuous</text>
  <text x="280" y="266" text-anchor="middle" class="sm dim">Convert every quoted rate to an effective rate before comparing</text>
</svg>
