<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Quebec's integrated regulator and its split public–private auto market</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="40" text-anchor="middle" class="ttl">Quebec supervises everything in one body</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">Prudential + conduct + securities</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">one regulator, one civil-law contract</text>
    <rect x="55" y="92" width="250" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="110" text-anchor="middle" class="sm">Autorité des marchés financiers</text>
    <line x1="180" y1="122" x2="62" y2="150" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
    <text x="62" y="168" text-anchor="middle" class="sm">insurance</text>
    <line x1="180" y1="122" x2="141" y2="150" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
    <text x="141" y="168" text-anchor="middle" class="sm">securities</text>
    <line x1="180" y1="122" x2="220" y2="150" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
    <text x="220" y="168" text-anchor="middle" class="sm">deposits</text>
    <line x1="180" y1="122" x2="299" y2="150" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
    <text x="299" y="168" text-anchor="middle" class="sm">distribution</text>
    <line x1="30" y1="196" x2="330" y2="196" class="rule"/>
    <text x="180" y="222" text-anchor="middle" class="sm bold">Quebec auto is split down the middle</text>
    <rect x="34" y="240" width="139" height="80" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
    <rect x="34" y="240" width="139" height="26" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
    <text x="103.5" y="257" text-anchor="middle" class="sm bold" fill="#d97706">Bodily injury</text>
    <text x="103.5" y="286" text-anchor="middle" class="sm">public SAAQ</text>
    <text x="103.5" y="308" text-anchor="middle" class="sm">no-fault</text>
    <rect x="187" y="240" width="139" height="80" rx="7" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="187" y="240" width="139" height="26" rx="7" fill="#3b82f6" fill-opacity="0.22" stroke="none"/>
    <text x="256.5" y="257" text-anchor="middle" class="sm bold" fill="#3b82f6">Property damage</text>
    <text x="256.5" y="286" text-anchor="middle" class="sm">private insurers</text>
    <text x="256.5" y="308" text-anchor="middle" class="sm">under the AMF</text>
    <text x="180" y="372" text-anchor="middle" class="sm dim">the Civil Code governs the contract, not an Insurance Act</text>
  </g>
</svg>
