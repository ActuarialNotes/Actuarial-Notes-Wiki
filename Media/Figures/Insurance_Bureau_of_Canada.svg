<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>What the industry's trade association does, and the one thing it is not</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">The industry's voice — and not a</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">regulator</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Advocacy · data · consumer information</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">membership is voluntary, output is not law</text>
  <rect x="56" y="92" width="248" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="180" y="110" text-anchor="middle" class="sm">Insurance Bureau of Canada</text>
  <line x1="180" y1="122" x2="62" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <text x="62" y="170" text-anchor="middle" class="sm">advocacy</text>
  <line x1="180" y1="122" x2="141" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <text x="141" y="170" text-anchor="middle" class="sm">data</text>
  <line x1="180" y1="122" x2="220" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <text x="220" y="170" text-anchor="middle" class="sm">consumers</text>
  <line x1="180" y1="122" x2="299" y2="152" class="thin" stroke="var(--dim)" stroke-width="1.1" marker-end="url(#ahvardim)"/>
  <text x="299" y="170" text-anchor="middle" class="sm">the Code</text>
  <line x1="30" y1="194" x2="330" y2="194" class="rule"/>
  <text x="40" y="218" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="218" text-anchor="start" class="sm">auto reform, flood and tax consultations</text>
  <text x="40" y="243" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="243" text-anchor="start" class="sm">industry aggregates and catastrophe totals</text>
  <text x="40" y="268" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="268" text-anchor="start" class="sm">the Vehicle Information Centre rating data</text>
  <text x="40" y="293" text-anchor="start" class="sm" fill="#3b82f6">•</text>
  <text x="56" y="293" text-anchor="start" class="sm">disaster response and anti-fraud work</text>
  <rect x="44" y="322" width="272" height="44" rx="7" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.2"/>
  <text x="180" y="340" text-anchor="middle" class="sm" fill="#e11d48">it does not licence, approve rates,</text>
  <text x="180" y="357" text-anchor="middle" class="sm" fill="#e11d48">set capital or adjudicate a complaint</text>
</svg>
