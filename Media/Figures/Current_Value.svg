<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 264" width="560" height="264" role="img">
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="262.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">Current value picks a reference date and moves everything to it</text>
  <line x1="60" y1="140" x2="488" y2="140" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="136" x2="68" y2="144" class="tick"/>
  <text x="68" y="157" text-anchor="middle" class="sm dim">0</text>
  <line x1="135" y1="136" x2="135" y2="144" class="tick"/>
  <text x="135" y="157" text-anchor="middle" class="sm dim">1</text>
  <line x1="202" y1="136" x2="202" y2="144" class="tick"/>
  <text x="202" y="157" text-anchor="middle" class="sm dim">2</text>
  <line x1="269" y1="136" x2="269" y2="144" class="tick"/>
  <text x="269" y="157" text-anchor="middle" class="sm dim">3</text>
  <line x1="336" y1="136" x2="336" y2="144" class="tick"/>
  <text x="336" y="157" text-anchor="middle" class="sm dim">4</text>
  <line x1="403" y1="136" x2="403" y2="144" class="tick"/>
  <text x="403" y="157" text-anchor="middle" class="sm dim">5</text>
  <line x1="470" y1="136" x2="470" y2="144" class="tick"/>
  <text x="470" y="157" text-anchor="middle" class="sm dim">6</text>
  <line x1="269" y1="44" x2="269" y2="170" class="thin dash" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="269" y="36" text-anchor="middle" class="sm bold" fill="#7c3aed">reference date t</text>
  <line x1="68" y1="140" x2="68" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="68" y="90" text-anchor="middle" class="sm">C₀</text>
  <line x1="135" y1="140" x2="135" y2="96" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="135" y="90" text-anchor="middle" class="sm">C₁</text>
  <line x1="403" y1="140" x2="403" y2="96" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="403" y="90" text-anchor="middle" class="sm">C₅</text>
  <line x1="470" y1="140" x2="470" y2="96" class="thin" stroke="#d97706" stroke-width="1.8" marker-end="url(#ahd97706)"/>
  <text x="470" y="90" text-anchor="middle" class="sm">C₆</text>
  <line x1="143" y1="82" x2="261" y2="82" class="thin" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#ah3b82f6)"/>
  <text x="202" y="74" text-anchor="middle" class="sm" fill="#3b82f6">accumulate</text>
  <line x1="395" y1="82" x2="277" y2="82" class="thin" stroke="#d97706" stroke-width="1.4" marker-end="url(#ahd97706)"/>
  <text x="336" y="74" text-anchor="middle" class="sm" fill="#d97706">discount</text>
  <line x1="28" y1="196" x2="532" y2="196" class="rule"/>
  <text x="280" y="218" text-anchor="middle" class="sm bold">Current value at t  =  Σ C_k · a(t) / a(t_k)</text>
  <text x="280" y="240" text-anchor="middle" class="sm dim">Flows before t are grown forward; flows after t are discounted back</text>
  <text x="280" y="258" text-anchor="middle" class="sm dim">PV is the t = 0 case; AV is the t = n case</text>
</svg>
