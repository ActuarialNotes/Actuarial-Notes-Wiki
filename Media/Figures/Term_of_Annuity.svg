  <line x1="76" y1="348" x2="330" y2="348" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="348" x2="76" y2="214" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="76" y1="348" x2="76" y2="352" class="tick"/>
