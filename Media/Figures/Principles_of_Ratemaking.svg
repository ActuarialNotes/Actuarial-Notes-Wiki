<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>One risk's rate drawn as a column of every expected cost — loss, LAE, expense and capital — whose top lands in the narrow sound band between inadequate and excessive</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="120" y="227.6" width="84" height="102.4" rx="2" fill="#3b82f6" fill-opacity="0.32" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="110" y="282.8" text-anchor="end" class="sm">loss</text>
    <rect x="120" y="214.8" width="84" height="12.8" rx="2" fill="#0d9488" fill-opacity="0.32" stroke="#0d9488" stroke-width="1.2"/>
    <text x="110" y="225.2" text-anchor="end" class="sm">LAE</text>
    <rect x="120" y="182.8" width="84" height="32" rx="2" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.2"/>
    <text x="110" y="202.8" text-anchor="end" class="sm">expense</text>
    <rect x="120" y="170" width="84" height="12.8" rx="2" fill="#059669" fill-opacity="0.32" stroke="#059669" stroke-width="1.2"/>
    <text x="110" y="180.4" text-anchor="end" class="sm">capital</text>
    <path d="M130,362.4 V353.44 L142.8,350.88 L151.76,340.64 H173.52 L182.48,350.88 L194,354.72 V362.4 Z" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="144.08" cy="363.68" r="5.76" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.6"/>
    <circle cx="179.92" cy="363.68" r="5.76" fill="var(--surf)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="254" y="76" width="22" height="80" rx="3" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="1.1"/>
    <rect x="254" y="156" width="22" height="28" rx="3" fill="#059669" fill-opacity="0.5" stroke="#059669" stroke-width="1.1"/>
    <rect x="254" y="184" width="22" height="146" rx="3" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.1"/>
    <line x1="208" y1="170" x2="250" y2="170" class="thin dash" stroke="var(--ink)" stroke-width="1.4"/>
    <text x="284" y="120" text-anchor="start" class="sm">excessive</text>
    <text x="284" y="174" text-anchor="start" class="sm bold">sound</text>
    <text x="284" y="261" text-anchor="start" class="sm">inadequate</text>
  </g>
</svg>
