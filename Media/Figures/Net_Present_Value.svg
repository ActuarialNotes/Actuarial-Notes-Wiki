<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Project cash flows discounted and summed into an NPV</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">NPV discounts every flow to time 0</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">NPV = Σ C_t v^t</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">at i = 10%:  NPV ≈ 96</text>
  <rect x="88.08" y="175.38" width="13" height="158.75" rx="2" fill="#e11d48" fill-opacity="0.3"/>
  <rect x="105.08" y="175.38" width="13" height="158.75" rx="2" fill="#e11d48" fill-opacity="0.85"/>
  <rect x="136.54" y="127.75" width="13" height="47.62" rx="2" fill="#059669" fill-opacity="0.3"/>
  <rect x="153.54" y="132.08" width="13" height="43.3" rx="2" fill="#059669" fill-opacity="0.85"/>
  <rect x="185" y="111.88" width="13" height="63.5" rx="2" fill="#059669" fill-opacity="0.3"/>
  <rect x="202" y="122.9" width="13" height="52.48" rx="2" fill="#059669" fill-opacity="0.85"/>
  <rect x="233.46" y="111.88" width="13" height="63.5" rx="2" fill="#059669" fill-opacity="0.3"/>
  <rect x="250.46" y="127.67" width="13" height="47.71" rx="2" fill="#059669" fill-opacity="0.85"/>
  <rect x="281.92" y="127.75" width="13" height="47.62" rx="2" fill="#059669" fill-opacity="0.3"/>
  <rect x="298.92" y="142.85" width="13" height="32.53" rx="2" fill="#059669" fill-opacity="0.85"/>
  <line x1="74" y1="175.38" x2="336" y2="175.38" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="74" y1="350" x2="74" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="70" y1="334.12" x2="74" y2="334.12" class="tick"/>
  <text x="66" y="337.73" text-anchor="end" class="sm dim">-1,000</text>
  <line x1="70" y1="175.38" x2="74" y2="175.38" class="tick"/>
  <text x="66" y="178.97" text-anchor="end" class="sm dim">0</text>
  <line x1="70" y1="96" x2="74" y2="96" class="tick"/>
  <text x="66" y="99.6" text-anchor="end" class="sm dim">500</text>
  <text x="70" y="82" text-anchor="start" class="sm dim">cash flow</text>
  <text x="103.08" y="366" text-anchor="middle" class="sm dim">0</text>
  <text x="151.54" y="366" text-anchor="middle" class="sm dim">1</text>
  <text x="200" y="366" text-anchor="middle" class="sm dim">2</text>
  <text x="248.46" y="366" text-anchor="middle" class="sm dim">3</text>
  <text x="296.92" y="366" text-anchor="middle" class="sm dim">4</text>
  <text x="326" y="382" text-anchor="end" class="sm dim">year</text>
  <text x="180" y="388" text-anchor="middle" class="sm dim">pale = nominal,  solid = discounted</text>
</svg>
