<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>The running GMM group's liability as three stacked building blocks — $44M present value of cash flows, a $5M risk adjustment and an $11M CSM — with an arrow looping round to show all three remeasured every period</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ah0d9488" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#0d9488"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="124" y="166" width="112" height="198" rx="4" fill="#3b82f6" fill-opacity="0.30" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="180" y="269" text-anchor="middle" class="sm bold">PV 44</text>
    <text x="114" y="269" text-anchor="end" class="sm dim">cost</text>
    <rect x="124" y="143.5" width="112" height="22.5" rx="4" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="180" y="158.75" text-anchor="middle" class="sm bold">RA 5</text>
    <text x="114" y="158.75" text-anchor="end" class="sm dim">risk</text>
    <rect x="124" y="94" width="112" height="49.5" rx="4" fill="#059669" fill-opacity="0.30" stroke="#059669" stroke-width="1.3"/>
    <text x="180" y="122.75" text-anchor="middle" class="sm bold">CSM 11</text>
    <text x="114" y="122.75" text-anchor="end" class="sm dim">profit</text>
    <path d="M252,354 C308,354 308,104.0 264,104.0" class="thin" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="266" y1="104" x2="254" y2="104" class="thin" stroke="#0d9488" stroke-width="1.8" marker-end="url(#ah0d9488)"/>
    <text x="312" y="229" text-anchor="middle" class="sm" transform="rotate(-90 312 229.0)">remeasure</text>
  </g>
</svg>
