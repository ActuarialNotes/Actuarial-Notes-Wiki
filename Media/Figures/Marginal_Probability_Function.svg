<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
  <title>Marginals as the row and column sums of a joint table</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 13.5px; font-weight: 600; }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="558.8" height="298.8" rx="10"/>
  <text x="280" y="22" text-anchor="middle" class="ttl">A marginal is a row sum or a column sum</text>
  <text x="100" y="86" text-anchor="middle" class="sm dim">y = 0</text>
  <text x="152" y="86" text-anchor="middle" class="sm dim">y = 1</text>
  <text x="204" y="86" text-anchor="middle" class="sm dim">y = 2</text>
  <text x="64" y="111" text-anchor="end" class="sm dim">x = 0</text>
  <text x="64" y="141" text-anchor="end" class="sm dim">x = 1</text>
  <text x="64" y="171" text-anchor="end" class="sm dim">x = 2</text>
  <rect x="74" y="92" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="100" y="111" text-anchor="middle" class="sm">0.10</text>
  <rect x="126" y="92" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="152" y="111" text-anchor="middle" class="sm">0.08</text>
  <rect x="178" y="92" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="204" y="111" text-anchor="middle" class="sm">0.02</text>
  <rect x="74" y="122" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="100" y="141" text-anchor="middle" class="sm">0.06</text>
  <rect x="126" y="122" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="152" y="141" text-anchor="middle" class="sm">0.20</text>
  <rect x="178" y="122" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="204" y="141" text-anchor="middle" class="sm">0.14</text>
  <rect x="74" y="152" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="100" y="171" text-anchor="middle" class="sm">0.04</text>
  <rect x="126" y="152" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="152" y="171" text-anchor="middle" class="sm">0.12</text>
  <rect x="178" y="152" width="52" height="30" rx="3" fill="var(--soft)" fill-opacity="1" stroke="var(--edge)" stroke-width="1"/>
  <text x="204" y="171" text-anchor="middle" class="sm">0.24</text>
  <text x="256" y="86" text-anchor="middle" class="sm dim" fill="#d97706">pₓ(x)</text>
  <rect x="236" y="92" width="52" height="30" rx="3" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1"/>
  <text x="262" y="111" text-anchor="middle" class="sm bold">0.20</text>
  <rect x="236" y="122" width="52" height="30" rx="3" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1"/>
  <text x="262" y="141" text-anchor="middle" class="sm bold">0.40</text>
  <rect x="236" y="152" width="52" height="30" rx="3" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1"/>
  <text x="262" y="171" text-anchor="middle" class="sm bold">0.40</text>
  <text x="64" y="203" text-anchor="end" class="sm dim" fill="#059669">p_Y(y)</text>
  <rect x="74" y="188" width="52" height="30" rx="3" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1"/>
  <text x="100" y="207" text-anchor="middle" class="sm bold">0.20</text>
  <rect x="126" y="188" width="52" height="30" rx="3" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1"/>
  <text x="152" y="207" text-anchor="middle" class="sm bold">0.40</text>
  <rect x="178" y="188" width="52" height="30" rx="3" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="1"/>
  <text x="204" y="207" text-anchor="middle" class="sm bold">0.40</text>
  <line x1="224" y1="107" x2="232" y2="107" class="thin" stroke="#d97706" stroke-width="1.4" marker-end="url(#ahd97706)"/>
  <line x1="100" y1="178" x2="100" y2="184" class="thin" stroke="#059669" stroke-width="1.4" marker-end="url(#ah059669)"/>
  <text x="430" y="96" text-anchor="middle" class="sm bold">Sum the other variable out</text>
  <text x="430" y="118" text-anchor="middle" class="sm" fill="#d97706">pₓ(x) = Σ_y p(x, y)</text>
  <text x="430" y="138" text-anchor="middle" class="sm" fill="#059669">p_Y(y) = Σ_x p(x, y)</text>
  <rect x="342" y="156" width="176" height="62" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="430" y="176" text-anchor="middle" class="sm bold">Continuous case</text>
  <text x="430" y="194" text-anchor="middle" class="sm dim">f_X(x) = ∫ f(x, y) dy</text>
  <text x="430" y="210" text-anchor="middle" class="sm dim">limits depend on the support</text>
  <line x1="28" y1="240" x2="532" y2="240" class="rule"/>
  <text x="280" y="260" text-anchor="middle" class="sm dim">If y survives in your f_X(x), the inner limits were wrong</text>
  <text x="280" y="280" text-anchor="middle" class="sm dim">Both margins sum to 1 — a fast arithmetic check</text>
</svg>
