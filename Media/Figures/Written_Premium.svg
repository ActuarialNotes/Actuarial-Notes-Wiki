<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A full-term premium booked at inception against the premium earned month by month</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">Booked in full the day the policy is</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">issued</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">WP = full-term premium, at issue</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">Earned Premium = WP − ΔUEP</text>
  <line x1="68" y1="98" x2="68" y2="326" class="grid"/>
  <line x1="131" y1="98" x2="131" y2="326" class="grid"/>
  <line x1="194" y1="98" x2="194" y2="326" class="grid"/>
  <line x1="257" y1="98" x2="257" y2="326" class="grid"/>
  <line x1="320" y1="98" x2="320" y2="326" class="grid"/>
  <line x1="68" y1="326" x2="320" y2="326" class="grid"/>
  <line x1="68" y1="226.87" x2="320" y2="226.87" class="grid"/>
  <line x1="68" y1="127.74" x2="320" y2="127.74" class="grid"/>
  <line x1="68" y1="326" x2="330" y2="326" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="326" x2="68" y2="88" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="68" y1="326" x2="68" y2="330" class="tick"/>
  <text x="68" y="342" text-anchor="middle" class="sm dim">0</text>
  <line x1="131" y1="326" x2="131" y2="330" class="tick"/>
  <text x="131" y="342" text-anchor="middle" class="sm dim">3</text>
  <line x1="194" y1="326" x2="194" y2="330" class="tick"/>
  <text x="194" y="342" text-anchor="middle" class="sm dim">6</text>
  <line x1="257" y1="326" x2="257" y2="330" class="tick"/>
  <text x="257" y="342" text-anchor="middle" class="sm dim">9</text>
  <line x1="320" y1="326" x2="320" y2="330" class="tick"/>
  <text x="320" y="342" text-anchor="middle" class="sm dim">12</text>
  <line x1="64" y1="326" x2="68" y2="326" class="tick"/>
  <text x="60" y="329.6" text-anchor="end" class="sm dim">0%</text>
  <line x1="64" y1="226.87" x2="68" y2="226.87" class="tick"/>
  <text x="60" y="230.47" text-anchor="end" class="sm dim">50%</text>
  <line x1="64" y1="127.74" x2="68" y2="127.74" class="tick"/>
  <text x="60" y="131.34" text-anchor="end" class="sm dim">100%</text>
  <polyline points="68,326 68,127.74 320,127.74" class="curve" stroke="#d97706" stroke-width="2.4"/>
  <polyline points="68,326 320,127.74" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <text x="198.2" y="115.79" text-anchor="middle" class="sm bold" fill="#d97706">written</text>
  <text x="248.6" y="211.08" text-anchor="middle" class="sm bold" fill="#3b82f6">earned</text>
  <text x="180" y="358" text-anchor="middle" class="sm dim">months since inception</text>
  <text x="180" y="374" text-anchor="middle" class="sm dim">a $600 annual policy written 12/1 is $600</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">of CY written premium and $50 of CY earned</text>
</svg>
