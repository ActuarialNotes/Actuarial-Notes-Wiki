<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Five equal payments P, each discounted into a shrinking block of the stack at time 0 and grown into a widening block of the stack at time 5</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <line x1="58" y1="344" x2="312" y2="344" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
    <line x1="66" y1="340" x2="66" y2="348" class="tick"/>
    <text x="66" y="361" text-anchor="middle" class="sm dim">0</text>
    <line x1="111.6" y1="340" x2="111.6" y2="348" class="tick"/>
    <text x="111.6" y="361" text-anchor="middle" class="sm dim">1</text>
    <line x1="157.2" y1="340" x2="157.2" y2="348" class="tick"/>
    <text x="157.2" y="361" text-anchor="middle" class="sm dim">2</text>
    <line x1="202.8" y1="340" x2="202.8" y2="348" class="tick"/>
    <text x="202.8" y="361" text-anchor="middle" class="sm dim">3</text>
    <line x1="248.4" y1="340" x2="248.4" y2="348" class="tick"/>
    <text x="248.4" y="361" text-anchor="middle" class="sm dim">4</text>
    <line x1="294" y1="340" x2="294" y2="348" class="tick"/>
    <text x="294" y="361" text-anchor="middle" class="sm dim">5</text>
    <rect x="99.6" y="308" width="24" height="36" rx="2" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="111.6" y="300" text-anchor="middle" class="sm bold">P</text>
    <rect x="54" y="310.67" width="24" height="33.33" rx="2" fill="#d97706" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="282" y="308" width="24" height="36" rx="2" fill="#3b82f6" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="145.2" y="308" width="24" height="36" rx="2" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="157.2" y="300" text-anchor="middle" class="sm bold">P</text>
    <rect x="54" y="279.8" width="24" height="30.86" rx="2" fill="#d97706" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="282" y="269.12" width="24" height="38.88" rx="2" fill="#059669" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="190.8" y="308" width="24" height="36" rx="2" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="202.8" y="300" text-anchor="middle" class="sm bold">P</text>
    <rect x="54" y="251.22" width="24" height="28.58" rx="2" fill="#d97706" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="282" y="227.13" width="24" height="41.99" rx="2" fill="#059669" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="236.4" y="308" width="24" height="36" rx="2" fill="#3b82f6" fill-opacity="0.75"/>
    <text x="248.4" y="300" text-anchor="middle" class="sm bold">P</text>
    <rect x="54" y="224.76" width="24" height="26.46" rx="2" fill="#d97706" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="282" y="181.78" width="24" height="45.35" rx="2" fill="#059669" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="54" y="200.26" width="24" height="24.5" rx="2" fill="#d97706" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <rect x="282" y="132.8" width="24" height="48.98" rx="2" fill="#059669" fill-opacity="0.75" stroke="var(--surf)" stroke-width="1"/>
    <text x="66" y="192.26" text-anchor="middle" class="bold">P·a₍ₙ₎</text>
    <text x="294" y="124.8" text-anchor="middle" class="bold">P·s₍ₙ₎</text>
  </g>
</svg>
