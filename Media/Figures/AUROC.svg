  <text x="223.96" y="195.2" text-anchor="middle" class="sm bold" fill="#3b82f6">AUROC = 0.80</text>
  <text x="265.24" y="175.12" text-anchor="start" class="sm dim">chance</text>
  <circle cx="110.44" cy="208.88" r="3.6" fill="#e11d48"/>
  <text x="119.44" y="223.88" text-anchor="start" class="sm" fill="#e11d48">one threshold</text>
  <text x="180" y="344" text-anchor="middle" class="sm dim">false positive rate →   sensitivity ↑</text>
  <text x="180" y="362" text-anchor="middle" class="sm dim">0.5 is worthless, 1.0 is perfect separation</text>
  <text x="180" y="390" text-anchor="middle" class="sm dim">threshold-free — unlike accuracy</text>
</svg>
