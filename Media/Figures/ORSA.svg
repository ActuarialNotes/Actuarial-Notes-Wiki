<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>ORSA asking whether the standard formula fits this insurer, and setting the internal target that follows</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahvardim" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--dim)"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
    <text x="180" y="31" text-anchor="middle" class="ttl">Does the standard formula fit this</text>
    <text x="180" y="50" text-anchor="middle" class="ttl">insurer?</text>
    <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
    <text x="180" y="430" text-anchor="middle" class="fml">The insurer's own view of required capital</text>
    <text x="180" y="452" text-anchor="middle" class="fml2">— and the internal target it implies</text>
    <rect x="42" y="92" width="276" height="28" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="180" y="110" text-anchor="middle" class="sm">the MCT's standardised requirement</text>
    <line x1="180" y1="122" x2="180" y2="146" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="55" y="148" width="250" height="28" rx="14.0" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.2"/>
    <text x="180" y="166" text-anchor="middle" class="sm">risks it does not capture for us</text>
    <line x1="180" y1="178" x2="180" y2="202" class="thin" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#ahvardim)"/>
    <rect x="90" y="204" width="180" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="222" text-anchor="middle" class="sm">the internal target</text>
    <line x1="30" y1="246" x2="330" y2="246" class="rule"/>
    <text x="36" y="268" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="268" text-anchor="start" class="sm">all material risks identified and assessed</text>
    <text x="36" y="292" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="292" text-anchor="start" class="sm">risk linked to capital</text>
    <text x="36" y="316" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="316" text-anchor="start" class="sm">forward over the business plan, not the</text>
    <text x="36" y="340" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="340" text-anchor="start" class="sm">balance sheet as it stands today</text>
    <text x="36" y="364" text-anchor="start" class="sm" fill="#0d9488">•</text>
    <text x="52" y="364" text-anchor="start" class="sm">board-owned, at least annually</text>
    <text x="180" y="388" text-anchor="middle" class="sm dim">ORSA sets the target; FCT tests whether it holds</text>
  </g>
</svg>
