<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A voluntary code's two halves, and the four limits that make it self-regulation</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="31" text-anchor="middle" class="ttl">A voluntary bargain, with no statutory</text>
  <text x="180" y="50" text-anchor="middle" class="ttl">remedy</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Rights ↔ responsibilities</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">adopted by members, enacted by nobody</text>
  <rect x="30" y="96" width="143" height="148" rx="7" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.2"/>
  <rect x="30" y="96" width="143" height="28" rx="7" fill="#059669" fill-opacity="0.22" stroke="none"/>
  <text x="101.5" y="114" text-anchor="middle" class="sm bold" fill="#059669">Your rights</text>
  <text x="101.5" y="144" text-anchor="middle" class="sm">plain-language</text>
  <text x="101.5" y="166" text-anchor="middle" class="sm">information</text>
  <text x="101.5" y="188" text-anchor="middle" class="sm">professional</text>
  <text x="101.5" y="210" text-anchor="middle" class="sm">service</text>
  <text x="101.5" y="232" text-anchor="middle" class="sm">prompt claims</text>
  <rect x="187" y="96" width="143" height="148" rx="7" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.2"/>
  <rect x="187" y="96" width="143" height="28" rx="7" fill="#d97706" fill-opacity="0.22" stroke="none"/>
  <text x="258.5" y="114" text-anchor="middle" class="sm bold" fill="#d97706">Your duties</text>
  <text x="258.5" y="144" text-anchor="middle" class="sm">ask, and</text>
  <text x="258.5" y="166" text-anchor="middle" class="sm">understand</text>
  <text x="258.5" y="188" text-anchor="middle" class="sm">full and honest</text>
  <text x="258.5" y="210" text-anchor="middle" class="sm">disclosure</text>
  <text x="258.5" y="232" text-anchor="middle" class="sm">report promptly</text>
  <line x1="30" y1="250" x2="330" y2="250" class="rule"/>
  <text x="180" y="272" text-anchor="middle" class="sm bold" fill="#e11d48">and the four limits the exam wants</text>
  <text x="40" y="296" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="56" y="296" text-anchor="start" class="sm">no statutory remedy for a breach</text>
  <text x="40" y="320" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="56" y="320" text-anchor="start" class="sm">binds members only</text>
  <text x="40" y="344" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="56" y="344" text-anchor="start" class="sm">written by the industry it governs</text>
  <text x="40" y="368" text-anchor="start" class="sm" fill="#e11d48">•</text>
  <text x="56" y="368" text-anchor="start" class="sm">enforced only if a Superintendent acts</text>
</svg>
