<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>A level annuity valued as a present value and as an accumulated value</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah059669" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#059669"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">The same payment, every period</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">PV = P · a₍ₙ₎</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">FV = P · s₍ₙ₎ = (1 + i)ⁿ · PV</text>
  <line x1="58" y1="230" x2="318" y2="230" class="thin" stroke="var(--axis)" stroke-width="1.2" marker-end="url(#ahvaraxis)"/>
  <line x1="66" y1="226" x2="66" y2="234" class="tick"/>
  <text x="66" y="247" text-anchor="middle" class="sm dim">0</text>
  <line x1="112.8" y1="226" x2="112.8" y2="234" class="tick"/>
  <text x="112.8" y="247" text-anchor="middle" class="sm dim">1</text>
  <line x1="159.6" y1="226" x2="159.6" y2="234" class="tick"/>
  <text x="159.6" y="247" text-anchor="middle" class="sm dim">2</text>
  <line x1="206.4" y1="226" x2="206.4" y2="234" class="tick"/>
  <text x="206.4" y="247" text-anchor="middle" class="sm dim">3</text>
  <line x1="253.2" y1="226" x2="253.2" y2="234" class="tick"/>
  <text x="253.2" y="247" text-anchor="middle" class="sm dim">4</text>
  <line x1="300" y1="226" x2="300" y2="234" class="tick"/>
  <text x="300" y="247" text-anchor="middle" class="sm dim">5</text>
  <line x1="112.8" y1="230" x2="112.8" y2="186" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="112.8" y="180" text-anchor="middle" class="sm">P</text>
  <line x1="159.6" y1="230" x2="159.6" y2="186" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="159.6" y="180" text-anchor="middle" class="sm">P</text>
  <line x1="206.4" y1="230" x2="206.4" y2="186" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="206.4" y="180" text-anchor="middle" class="sm">P</text>
  <line x1="253.2" y1="230" x2="253.2" y2="186" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="253.2" y="180" text-anchor="middle" class="sm">P</text>
  <line x1="300" y1="230" x2="300" y2="186" class="thin" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ah3b82f6)"/>
  <text x="300" y="180" text-anchor="middle" class="sm">P</text>
  <line x1="104.8" y1="278" x2="70" y2="278" class="thin" stroke="#d97706" stroke-width="1.5" marker-end="url(#ahd97706)"/>
  <text x="70" y="302" text-anchor="middle" class="bold" fill="#d97706">P · a₍ₙ₎</text>
  <line x1="261.2" y1="278" x2="296" y2="278" class="thin" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
  <text x="296" y="302" text-anchor="middle" class="bold" fill="#059669">P · s₍ₙ₎</text>
</svg>
