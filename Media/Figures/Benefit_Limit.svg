<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img">
  <title>Insurer payment capped at the benefit limit u</title>
  <style>:root {
  --surf: #ffffff; --edge: #e4e4e7; --ink: #18181b; --dim: #6b7280;
  --grid: #ececf1; --soft: #f4f4f5; --axis: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #1a1d24; --edge: #2f333c; --ink: #f4f4f5; --dim: #a1a1aa;
    --grid: #272b33; --soft: #22262e; --axis: #6b7280;
  }
}
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.ttl { font-size: 14px; font-weight: 600; }
.fml { font-size: 14px; font-weight: 600; }
.fml2 { font-size: 12.5px; fill: var(--dim); }
.sub { font-size: 11px; fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <defs>
    <marker id="ahvaraxis" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="var(--axis)"/></marker>
  </defs>
  <rect class="card" x="0.6" y="0.6" width="358.8" height="468.8" rx="10"/>
  <text x="180" y="40" text-anchor="middle" class="ttl">A limit caps what the insurer pays</text>
  <line x1="28" y1="406" x2="332" y2="406" class="rule"/>
  <text x="180" y="430" text-anchor="middle" class="fml">Y = min(X, u)</text>
  <text x="180" y="452" text-anchor="middle" class="fml2">the insured keeps every dollar above u</text>
  <polyline points="66,350 324,96" class="curve dash" stroke="var(--dim)" stroke-width="1.1"/>
  <text x="298.2" y="101.08" text-anchor="end" class="sm dim">Y = X</text>
  <polyline points="66,350 220.8,197.6" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <polyline points="220.8,197.6 324,197.6" class="curve" stroke="#3b82f6" stroke-width="2.4"/>
  <polygon points="220.8,197.6 324,96 324,197.6" fill="#e11d48" fill-opacity="0.2" stroke="none"/>
  <text x="313.68" y="172.2" text-anchor="end" class="sm" fill="#e11d48">the insured</text>
  <text x="313.68" y="189.98" text-anchor="end" class="sm" fill="#e11d48">keeps this</text>
  <line x1="66" y1="350" x2="334" y2="350" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="66" y1="350" x2="66" y2="86" class="thin" stroke="var(--axis)" stroke-width="1.1" marker-end="url(#ahvaraxis)"/>
  <line x1="220.8" y1="350" x2="220.8" y2="354" class="tick"/>
  <text x="220.8" y="366" text-anchor="middle" class="sm dim">u</text>
  <line x1="62" y1="197.6" x2="66" y2="197.6" class="tick"/>
  <text x="58" y="201.2" text-anchor="end" class="sm dim">u</text>
  <text x="324" y="382" text-anchor="end" class="sm dim">loss X</text>
  <text x="62" y="82" text-anchor="start" class="sm dim">payment Y</text>
  <line x1="66" y1="197.6" x2="324" y2="197.6" class="thin dash" stroke="var(--dim)" stroke-width="1.3"/>
</svg>
