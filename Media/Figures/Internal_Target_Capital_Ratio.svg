<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>Four scenario arrows — catastrophe, reserves, a reinsurer failing and a market fall — dropping from a 185% internal target, the worst of them landing just above the 150% supervisory target below it</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <defs>
    <marker id="ahe11d48" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#e11d48"/></marker>
    <marker id="ahd97706" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#d97706"/></marker>
    <marker id="ah0d9488" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#0d9488"/></marker>
    <marker id="ah3b82f6" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#3b82f6"/></marker>
  </defs>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <rect x="34" y="99.91" width="296" height="232.27" fill="#7c3aed" fill-opacity="0.08"/>
    <line x1="34" y1="99.91" x2="330" y2="99.91" class="thin" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="34" y="92.91" text-anchor="start" class="sm bold">185% internal</text>
    <line x1="34" y1="332.18" x2="330" y2="332.18" class="thin" stroke="#d97706" stroke-width="1.8"/>
    <text x="34" y="325.18" text-anchor="start" class="sm bold">150% target</text>
    <text x="152" y="92.91" text-anchor="middle" class="sm">cat</text>
    <line x1="152" y1="99.91" x2="152" y2="318.91" class="thin" stroke="#e11d48" stroke-width="2.6" marker-end="url(#ahe11d48)"/>
    <text x="206" y="92.91" text-anchor="middle" class="sm">reserves</text>
    <line x1="206" y1="99.91" x2="206" y2="232.64" class="thin" stroke="#d97706" stroke-width="2.6" marker-end="url(#ahd97706)"/>
    <text x="260" y="92.91" text-anchor="middle" class="sm">reinsurer</text>
    <line x1="260" y1="99.91" x2="260" y2="179.55" class="thin" stroke="#0d9488" stroke-width="2.6" marker-end="url(#ah0d9488)"/>
    <text x="314" y="92.91" text-anchor="middle" class="sm">market</text>
    <line x1="314" y1="99.91" x2="314" y2="265.82" class="thin" stroke="#3b82f6" stroke-width="2.6" marker-end="url(#ah3b82f6)"/>
  </g>
</svg>
