<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 360 366" width="360" height="366" role="img">
  <title>A four-by-four grid of every ordered pick of two from A, B, C and D: the diagonal repeats a letter, and the cells above and below it mirror each other</title>
  <style>:root {
  --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
    --grid: #333333; --soft: #242424; --axis: #6b6b6b;
  }
}
/* Named by the host in the embed URL (`…svg#dark`), and beats the media query
   above because a value set here lands on the drawing rather than on the root
   it inherits from. See the module docstring. */
#light:target ~ * { --surf: #ffffff; --edge: #c7c7c7; --ink: #000000; --dim: #424242;
  --grid: #dedede; --soft: #e8e8e8; --axis: #8c8c8c; }
#dark:target ~ * { --surf: #171717; --edge: #424242; --ink: #ffffff; --dim: #c7c7c7;
  --grid: #333333; --soft: #242424; --axis: #6b6b6b; }
text {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  fill: var(--ink);
  font-size: 12px;
}
.dim { fill: var(--dim); }
.sm  { font-size: 10.5px; }
.bold { font-weight: 600; }
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
}
.card { fill: var(--surf); stroke: var(--edge); }
.axis { stroke: var(--axis); stroke-width: 1.1; fill: none; }
.grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.tick { stroke: var(--axis); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; fill: none; }
.soft { fill: var(--soft); }
.curve { fill: none; stroke-width: 2; stroke-linecap: round;
         stroke-linejoin: round; }
.thin  { fill: none; stroke-width: 1.4; stroke-linecap: round; }
.dash  { stroke-dasharray: 4 3; }
.dot   { stroke-dasharray: 1.5 3; stroke-linecap: round; }</style>
  <g id="light"/><g id="dark"/>
  <g class="art">
    <rect class="card" x="0.6" y="46.6" width="358.8" height="364.8" rx="10"/>
    <text x="82" y="151" text-anchor="end" class="bold">A</text>
    <text x="126" y="104" text-anchor="middle" class="bold">A</text>
    <rect x="98" y="118" width="56" height="56" rx="6" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <rect x="158" y="118" width="56" height="56" rx="6" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <rect x="218" y="118" width="56" height="56" rx="6" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <rect x="278" y="118" width="56" height="56" rx="6" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <text x="82" y="211" text-anchor="end" class="bold">B</text>
    <text x="186" y="104" text-anchor="middle" class="bold">B</text>
    <rect x="98" y="178" width="56" height="56" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="158" y="178" width="56" height="56" rx="6" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <rect x="218" y="178" width="56" height="56" rx="6" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <rect x="278" y="178" width="56" height="56" rx="6" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <text x="82" y="271" text-anchor="end" class="bold">C</text>
    <text x="246" y="104" text-anchor="middle" class="bold">C</text>
    <rect x="98" y="238" width="56" height="56" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="158" y="238" width="56" height="56" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="218" y="238" width="56" height="56" rx="6" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <rect x="278" y="238" width="56" height="56" rx="6" fill="#059669" fill-opacity="0.45" stroke="#059669" stroke-width="1.2"/>
    <text x="82" y="331" text-anchor="end" class="bold">D</text>
    <text x="306" y="104" text-anchor="middle" class="bold">D</text>
    <rect x="98" y="298" width="56" height="56" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="158" y="298" width="56" height="56" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="218" y="298" width="56" height="56" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="278" y="298" width="56" height="56" rx="6" fill="#d97706" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <text x="66" y="240" text-anchor="end" class="sm dim">1st</text>
    <text x="216" y="82" text-anchor="middle" class="sm dim">2nd</text>
  </g>
</svg>
